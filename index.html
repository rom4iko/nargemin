<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Наряди">
<title>Наряди взводу</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--bd:#d1d5db;--tx:#111827;--mut:#6b7280;--pri:#1d4ed8;--we:#fee2e2;--today:#fef9c3;--bar:#1f2937}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header{background:var(--bar);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;justify-content:center;min-height:42px}
.tabs{display:flex;gap:4px;margin-top:6px}
.tabs button{flex:1;background:#374151;color:#d1d5db;border:0;border-radius:8px;padding:9px 2px;font-size:14px}
.tabs button.on{background:var(--pri);color:#fff;font-weight:600}
#toast{display:none;position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:#111827;color:#fff;border-radius:12px;padding:10px 14px;z-index:60;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#toast button{background:none;border:0;color:#93c5fd;font-weight:700;font-size:16px;padding:8px 10px}
.whor{display:flex;gap:6px;margin-top:4px;align-items:stretch}
.whor .who{margin-top:0;flex:1}
.whor .x{flex:0 0 52px;background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;border-radius:8px;font-size:20px;font-weight:700}
#htitle{font-size:18px;font-weight:600}
.mnav{display:flex;gap:6px;align-items:center;width:100%;justify-content:space-between}
.mnav b{flex:1;text-align:center;font-size:17px}
.mnav button{background:#374151;color:#fff;border:0;border-radius:8px;min-width:44px;height:40px;font-size:18px}
.mnav .td{font-size:13px;padding:0 10px}
main{padding:10px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
button.b{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:0 14px;min-height:44px;font-size:16px}
button.b.gray{background:#6b7280}button.b.red{background:#dc2626}button.b.full{width:100%}
input,select{font:inherit;font-size:16px;padding:0 10px;min-height:44px;border:1px solid var(--bd);border-radius:10px;background:#fff;max-width:100%}
input[type=color]{padding:2px;width:48px}
input[type=checkbox]{min-height:0;width:24px;height:24px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.row>input:not([type=color]):not([type=checkbox]),.row>select{flex:1;min-width:120px}
.seg{display:flex;background:#e5e7eb;border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:8px;font-size:15px;color:var(--tx)}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);font-weight:600}
.chip{display:inline-block;color:#fff;border-radius:6px;padding:1px 7px;font-weight:600;font-size:13px}
.mut{color:var(--mut)}.zero{color:#c4c9d1}
.hint{color:var(--mut);font-size:14px;margin:6px 0}
.kv{display:inline-block;background:#fef3c7;color:#92400e;border:1px solid #f59e0b;border-radius:4px;font-size:11px;font-weight:700;line-height:1.3;padding:0 4px;margin-right:5px;vertical-align:middle}
.warn{background:#fef3c7;border:1px solid #f59e0b;padding:10px 12px;border-radius:10px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.tag{font-size:11px;background:#fde68a;border-radius:4px;padding:1px 5px;margin-left:4px;white-space:nowrap}

/* day strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px;position:relative;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;width:48px;border:1px solid var(--bd);background:#fff;border-radius:10px;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;font:inherit}
.dchip small{font-size:11px;color:var(--mut)}.dchip b{font-size:18px}
.dchip i{font-style:normal;font-size:11px;min-height:14px;color:var(--pri);font-weight:700}
.dchip.we{background:var(--we)}.dchip.td{outline:2px solid #eab308}
.dchip.on{background:var(--pri);color:#fff;border-color:var(--pri)}.dchip.on small,.dchip.on i{color:#fff}
.dayhead{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}
.dayhead h2{margin:0}
.duty{border-left:6px solid #888;padding:6px 10px;margin-bottom:8px;background:#fff;border-radius:8px;border:1px solid var(--bd);border-left-width:6px}
.duty .dn{font-weight:600;margin-bottom:4px}
.who{display:flex;justify-content:space-between;align-items:center;width:100%;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:10px;margin-top:4px;font:inherit;text-align:left}

/* month table */
.tw{overflow:auto;max-height:calc(100vh - 300px);max-height:calc(100dvh - 300px);border:1px solid var(--bd);border-radius:8px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;background:#fff;font-size:13px}
th,td{border:1px solid var(--bd);padding:3px 5px;text-align:center;white-space:nowrap}
thead th{position:sticky;top:0;background:#f9fafb;z-index:3}
td.name,th.name{text-align:left;position:sticky;left:0;background:#fff;z-index:2;max-width:130px;min-width:110px;overflow:hidden;text-overflow:ellipsis}
thead th.name{z-index:4;background:#f9fafb}
tr.sq td{background:#e5e7eb;font-weight:600;text-align:left}
tr.sq td:first-child{position:sticky;left:0}
th.day{cursor:pointer;min-width:36px;padding:2px}
th.day small{display:block;color:var(--mut);font-weight:400;font-size:10px}
th.we,td.we{background:var(--we)}
th.today{background:var(--today)!important;outline:2px solid #eab308;outline-offset:-2px}
td.cell{height:38px;min-width:36px;padding:2px}
.sum{background:#eff6ff;font-weight:600}
tfoot td{background:#f9fafb;font-weight:600;position:sticky;bottom:0}

/* stats cards */
.sumbox{display:flex;gap:8px;margin-bottom:10px}
.sumbox div{flex:1;background:#fff;border:1px solid var(--bd);border-radius:12px;text-align:center;padding:10px 4px}
.sumbox b{display:block;font-size:26px}.sumbox small{color:var(--mut)}
.sqh{display:flex;justify-content:space-between;font-weight:700;margin:12px 4px 6px}
.pc{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.pc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pc-h small{display:block;color:var(--mut);font-size:12px}
.nums{display:flex;gap:12px;text-align:center}
.nums b{display:block;font-size:20px}.nums small{font-size:11px;color:var(--mut)}
.nums span:first-child b{color:var(--pri)}
.mg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px}
.mg div{background:#f3f4f6;border-radius:6px;text-align:center;padding:4px 0}
.mg div.cur{background:#dbeafe;outline:1px solid var(--pri)}
.mg small{display:block;font-size:11px;color:var(--mut)}

/* people list */
.li{display:flex;justify-content:space-between;align-items:center;width:100%;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;font:inherit;text-align:left}
.li small{display:block;color:var(--mut);font-size:13px}

/* bottom sheet */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.md{background:#fff;border-radius:18px 18px 0 0;padding:16px 14px calc(14px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:90vh;max-height:90dvh;overflow:auto}
.md h3{margin:0 0 4px;font-size:18px}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tl button{border:3px solid transparent;border-radius:10px;padding:10px 6px;color:#fff;font-size:15px;min-height:48px}
.tl button.sel{border-color:#111}
#dl{max-height:42vh;max-height:42dvh;overflow:auto;border:1px solid var(--bd);border-radius:10px}
.pr{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #eee;padding:10px;font:inherit;min-height:52px}
.pr.as{background:#ecfdf5}.pr.bad{background:#fffbeb}
.pr .r{text-align:right;font-size:13px;white-space:nowrap}
.fld{display:block;margin-bottom:10px}.fld small{display:block;color:var(--mut);margin-bottom:3px}.fld input,.fld select{width:100%}
@media(min-width:700px){.md{border-radius:18px;margin-bottom:5vh}.ov{align-items:center}}
@media print{header,nav,.warn,.noprint,.seg{display:none!important}.tw{max-height:none;overflow:visible}body{background:#fff;padding:0}.card{border:0;padding:0}td.name,th.name,thead th,tfoot td{position:static}@page{size:landscape;margin:8mm}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div id="htitle"></div>
    <div class="mnav" id="mnav">
      <button data-act="prev" aria-label="Попередній місяць">‹</button>
      <b id="mlabel"></b>
      <button data-act="next" aria-label="Наступний місяць">›</button>
      <button class="td" data-act="today">Сьогодні</button>
    </div>
  </div>
  <div class="tabs">
    <button data-act="tab" data-tab="schedule">📅 Графік</button>
    <button data-act="tab" data-tab="stats">📊 Облік</button>
    <button data-act="tab" data-tab="people">👥 Склад</button>
    <button data-act="tab" data-tab="settings">⚙️ Ще</button>
  </div>
</header>
<main id="app"></main>
<div id="modal"></div>
<div id="toast"></div>

<script>
const KEY='naryady_platoon_v1';
const MONTHS=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const MGEN=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const MSHORT=['Січ','Лют','Бер','Кві','Тра','Чер','Лип','Сер','Вер','Жов','Лис','Гру'];
const WD=['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
const WDL=['Неділя','Понеділок','Вівторок','Середа','Четвер','Пʼятниця','Субота'];
const RANKS=['солдат','старший солдат','молодший сержант','сержант','старший сержант','головний сержант','штаб-сержант','майстер-сержант','молодший лейтенант','лейтенант','старший лейтенант','капітан'];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dk=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const keyOf=dt=>dk(dt.getFullYear(),dt.getMonth(),dt.getDate());
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const uid=()=>Math.random().toString(36).slice(2,10);

function defaults(){
  return {
    squads:[{id:'s1',name:'1 відділення'},{id:'s2',name:'2 відділення'},{id:'s3',name:'3 відділення'}],
    people:[],
    types:[
      {id:'t1',name:'Черговий роти',code:'ЧР',color:'#2563eb'},
      {id:'t2',name:'Днювальний роти',code:'ДР',color:'#d97706'}
    ],
    duties:{},            // { 'YYYY-MM-DD': { personId: typeId } }
    meta:{lastBackup:null,v:2}
  };
}
function normalize(o){
  const d=Object.assign(defaults(),o);
  d.meta=Object.assign({lastBackup:null,v:1},o.meta||{});
  if(d.meta.v<2){
    // перехід на два види нарядів: «Черговий роти» і «Днювальний роти»
    const inUse=id=>Object.values(d.duties).some(m=>Object.values(m).includes(id));
    const old={t1:'Черговий по роті',t2:'Добовий наряд',t3:'Варта',t4:'Патруль'};
    d.types=d.types.filter(t=>!((t.id==='t3'||t.id==='t4')&&old[t.id]===t.name&&!inUse(t.id)));
    const t1=d.types.find(t=>t.id==='t1'&&t.name===old.t1); if(t1) t1.name='Черговий роти';
    const t2=d.types.find(t=>t.id==='t2'&&t.name===old.t2); if(t2){t2.name='Днювальний роти';t2.code='ДР';t2.color='#d97706';}
    d.meta.v=2;
  }
  d.people.forEach(p=>{p.name=cap(p.name);p.cmd=!!p.cmd;});
  return d;
}
function load(){
  try{const r=localStorage.getItem(KEY); if(r){const d=normalize(JSON.parse(r)); try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){} return d;}}catch(e){}
  return defaults();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){toast('Не вдалося зберегти дані: '+e.message);}
}
/* повідомлення та підтвердження всередині програми (системні вікна на телефонах працюють не скрізь) */
let toastT=null,TU=null,CB=null;
function toast(msg,label,fn){
  const el=$('#toast'); if(!el) return; clearTimeout(toastT);
  el.innerHTML=`<span>${esc(msg)}</span>`+(label?`<button data-act="toastUndo">${esc(label)}</button>`:'');
  el.style.display='flex'; TU=fn||null;
  toastT=setTimeout(()=>{el.style.display='none';TU=null;},label?7000:4000);
}
function confirmBox(text,yesLabel,yes,no){
  CB={yes,no};
  modal(`<h3>${esc(text)}</h3><div class="row" style="margin-top:16px"><button class="b red" data-act="cbYes" style="flex:1">${esc(yesLabel)}</button><button class="b gray" data-act="cbNo" style="flex:1">Скасувати</button></div>`);
}
function removeDuty(pid,date){
  const p=person(pid),tid=dutyOn(pid,date); if(!tid) return;
  setDuty(pid,date,null);
  toast(`Знято з наряду: ${p?p.name:''}`,'Скасувати',()=>{setDuty(pid,date,tid);render();});
}
let S=load();
const now=new Date();
const V={tab:S.people.length?'schedule':'people',sched:'day',sort:'squad',open:{},year:now.getFullYear(),month:now.getMonth(),day:now.getDate()};
let DA=null;

const person=id=>S.people.find(p=>p.id===id);
const type=id=>S.types.find(t=>t.id===id);
const squad=id=>S.squads.find(s=>s.id===id);
const sqIdx=id=>S.squads.findIndex(s=>s.id===id);
const sortedPeople=()=>[...S.people].sort((a,b)=>sqIdx(a.squad)-sqIdx(b.squad)||(!!b.cmd-!!a.cmd)||a.name.localeCompare(b.name,'uk'));
// Кожне слово імені з великої літери (після пробілу або дефіса): «іваненко-петренко петро» → «Іваненко-Петренко Петро»
const cap=s=>String(s||'').trim().replace(/\s+/g,' ').replace(/(^|[\s-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
const kv=p=>p.cmd?'<span class="kv">КВ</span>':'';
function setCmd(p,on){ if(on) S.people.forEach(x=>{if(x.squad===p.squad&&x.id!==p.id) x.cmd=false;}); p.cmd=!!on; }
const nz=n=>n?n:`<span class="zero">0</span>`;
const clampDay=()=>{V.day=Math.max(1,Math.min(V.day,dim(V.year,V.month)));};
function setMonth(){const c=V.year===now.getFullYear()&&V.month===now.getMonth();V.day=c?now.getDate():1;}

function buildIndex(){
  const byMonth={},byType={},total={};
  for(const [date,m] of Object.entries(S.duties)){
    const ym=date.slice(0,7);
    for(const [pid,tid] of Object.entries(m)){
      byMonth[pid]=byMonth[pid]||{}; byMonth[pid][ym]=(byMonth[pid][ym]||0)+1;
      total[pid]=(total[pid]||0)+1;
      const k=pid+'|'+ym; byType[k]=byType[k]||{}; byType[k][tid]=(byType[k][tid]||0)+1;
    }
  }
  return {byMonth,byType,total};
}
function setDuty(pid,date,tid){
  if(!tid){ if(S.duties[date]){delete S.duties[date][pid]; if(!Object.keys(S.duties[date]).length) delete S.duties[date];} }
  else { S.duties[date]=S.duties[date]||{}; S.duties[date][pid]=tid; }
  save();
}
const dutyOn=(pid,date)=>(S.duties[date]||{})[pid];
const fmtDate=k=>{const [y,m,d]=k.split('-').map(Number);return `${d} ${MGEN[m-1]} ${y}`;};

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===V.tab));
  const showNav=(V.tab==='schedule'||V.tab==='stats');
  $('#mnav').style.display=showNav?'flex':'none';
  $('#htitle').style.display=showNav?'none':'block';
  $('#htitle').textContent={people:'Особовий склад',settings:'Налаштування'}[V.tab]||'';
  $('#mlabel').textContent=`${MONTHS[V.month]} ${V.year}`;
  clampDay();
  const f={schedule:renderSchedule,stats:renderStats,people:renderPeople,settings:renderSettings}[V.tab];
  const sc=$('.tw'); const st=sc?[sc.scrollTop,sc.scrollLeft]:null;
  const pageY=window.scrollY;
  $('#app').innerHTML=backupBanner()+f();
  const sc2=$('.tw'); if(st&&sc2){sc2.scrollTop=st[0];sc2.scrollLeft=st[1];}
  const strip=$('.strip'),on=$('.dchip.on');
  if(strip&&on) strip.scrollLeft=on.offsetLeft-strip.clientWidth/2+on.clientWidth/2;
  window.scrollTo(0,pageY);
}
function backupBanner(){
  if(!Object.keys(S.duties).length) return '';
  const lb=S.meta.lastBackup?new Date(S.meta.lastBackup):null;
  if(lb && (Date.now()-lb.getTime())<7*864e5) return '';
  return `<div class="warn noprint"><div style="flex:1">⚠️ Дані зберігаються лише в цьому браузері. ${lb?'Остання копія: '+lb.toLocaleDateString('uk-UA'):'Резервної копії ще не було.'}</div>
    <button class="b" data-act="share">Зберегти копію</button></div>`;
}

function renderSchedule(){
  if(!S.people.length) return `<div class="card"><h2>Спочатку додайте особовий склад</h2><button class="b full" data-act="tab" data-tab="people">Перейти до складу</button></div>`;
  const seg=`<div class="seg"><button data-act="sview" data-v="day" class="${V.sched==='day'?'on':''}">День</button><button data-act="sview" data-v="month" class="${V.sched==='month'?'on':''}">Таблиця місяця</button></div>`;
  return seg+(V.sched==='day'?renderDayView():renderMonthTable());
}

function renderDayView(){
  const {year:y,month:m}=V,n=dim(y,m),todayK=keyOf(new Date()),date=dk(y,m,V.day);
  let h=`<div class="strip">`;
  for(let d=1;d<=n;d++){
    const k=dk(y,m,d),wd=new Date(y,m,d).getDay(),c=Object.keys(S.duties[k]||{}).length;
    h+=`<button class="dchip ${d===V.day?'on':''} ${(wd===0||wd===6)?'we':''} ${k===todayK?'td':''}" data-act="pickday" data-d="${d}"><small>${WD[wd]}</small><b>${d}</b><i>${c||''}</i></button>`;
  }
  h+=`</div>`;
  const wd=new Date(y,m,V.day).getDay(),day=S.duties[date]||{};
  h+=`<div class="dayhead"><h2>${WDL[wd]}, ${V.day} ${MGEN[m]}</h2><span class="mut">${Object.keys(day).length} в наряді</span></div>`;
  let any=false;
  for(const t of S.types){
    const ids=Object.keys(day).filter(pid=>day[pid]===t.id&&person(pid));
    if(!ids.length) continue; any=true;
    ids.sort((a,b)=>person(a).name.localeCompare(person(b).name,'uk'));
    h+=`<div class="duty" style="border-left-color:${esc(t.color)}"><div class="dn"><span class="chip" style="background:${esc(t.color)}">${esc(t.code)}</span> ${esc(t.name)} <span class="mut">(${ids.length})</span></div>`+
      ids.map(pid=>{const p=person(pid);return `<div class="whor"><button class="who" data-act="openCell" data-p="${pid}" data-date="${date}"><span><b>${kv(p)}${esc(p.name)}</b><br><small class="mut">${esc(p.rank)} · ${esc(squad(p.squad)?.name||'')}</small></span><span class="mut">змінити ›</span></button><button class="x" data-act="rmDuty" data-p="${pid}" data-date="${date}" aria-label="Зняти з наряду" title="Зняти з наряду">✕</button></div>`;}).join('')+`</div>`;
  }
  if(!any) h+=`<div class="card mut" style="text-align:center">На цей день нарядів ще немає</div>`;
  h+=`<button class="b full" data-act="openDay" data-date="${date}">＋ Призначити в наряд</button>`;

}

function renderMonthTable(){
  const idx=buildIndex(),{year:y,month:m}=V,n=dim(y,m),ym=`${y}-${pad(m+1)}`,todayK=keyOf(new Date());
  let h=`<div class="card" style="padding:8px"><div class="legend row">`+
    S.types.map(t=>`<span><span class="chip" style="background:${esc(t.color)}">${esc(t.code)}</span> <small>${esc(t.name)}</small></span>`).join('')+`</div>
    <div class="hint" style="margin-top:0">Торкніться клітинки — призначити. Торкніться дати — відкрити день.</div>`;
  h+=`<div class="tw"><table><thead><tr><th class="name">Військовослужбовець</th>`;
  for(let d=1;d<=n;d++){
    const wd=new Date(y,m,d).getDay(),we=wd===0||wd===6,k=dk(y,m,d);
    h+=`<th class="day ${we?'we':''} ${k===todayK?'today':''}" data-day="${d}"><div>${d}</div><small>${WD[wd]}</small></th>`;
  }
  h+=`<th class="sum">Міс.</th><th class="sum">Всього</th></tr></thead><tbody>`;
  const perDay=Array(n+1).fill(0);
  for(const sq of S.squads){
    const ps=sortedPeople().filter(p=>p.squad===sq.id&&(p.active||(idx.byMonth[p.id]?.[ym]||0)>0));
    if(!ps.length) continue;
    h+=`<tr class="sq"><td colspan="${n+3}">${esc(sq.name)} <span class="mut">(${ps.length})</span></td></tr>`;
    for(const p of ps){
      h+=`<tr><td class="name"><b>${kv(p)}${esc(p.name)}</b>${p.active?'':' <i class="mut">(вибув)</i>'}</td>`;
      for(let d=1;d<=n;d++){
        const wd=new Date(y,m,d).getDay(),we=wd===0||wd===6,tid=dutyOn(p.id,dk(y,m,d)),t=tid&&type(tid);
        if(tid) perDay[d]++;
        h+=`<td class="cell ${we?'we':''}" data-p="${p.id}" data-d="${dk(y,m,d)}">${tid?(t?`<span class="chip" style="background:${esc(t.color)}" title="${esc(t.name)}">${esc(t.code)}</span>`:'?'):''}</td>`;
      }
      h+=`<td class="sum">${idx.byMonth[p.id]?.[ym]||0}</td><td class="sum">${idx.total[p.id]||0}</td></tr>`;
    }
  }
  h+=`</tbody><tfoot><tr><td class="name">В наряді</td>`;
  let sumAll=0; for(let d=1;d<=n;d++){sumAll+=perDay[d]; h+=`<td>${perDay[d]||''}</td>`;}
  h+=`<td class="sum">${sumAll}</td><td></td></tr></tfoot></table></div>
   <div class="row noprint" style="margin-top:8px"><button class="b gray" data-act="print">🖨 Друк</button></div></div>`;
  return h;
}

function statsData(){
  const idx=buildIndex();
  const rows=sortedPeople().filter(p=>p.active||(idx.total[p.id]||0)>0);
  return {idx,rows};
}
function renderStats(){
  const {idx,rows}=statsData(),y=V.year,ym=`${y}-${pad(V.month+1)}`;
  if(!rows.length) return `<div class="card">Немає даних. Додайте особовий склад.</div>`;
  const mc=p=>idx.byMonth[p.id]?.[ym]||0;
  const yc=p=>{let s=0;for(let i=0;i<12;i++)s+=idx.byMonth[p.id]?.[`${y}-${pad(i+1)}`]||0;return s;};
  const ac=p=>idx.total[p.id]||0;
  const sum=(ps,f)=>ps.reduce((a,p)=>a+f(p),0);
  const card=p=>{
    let ex='';
    if(V.open[p.id]){
      ex=`<div class="mg">`+MSHORT.map((s,i)=>{const c=idx.byMonth[p.id]?.[`${y}-${pad(i+1)}`]||0;return `<div class="${i===V.month?'cur':''}"><small>${s}</small><b>${c}</b></div>`;}).join('')+`</div>`;
      const bt=idx.byType[p.id+'|'+ym]||{};
      const parts=S.types.filter(t=>bt[t.id]).map(t=>`<span class="chip" style="background:${esc(t.color)}">${esc(t.code)} × ${bt[t.id]}</span>`).join(' ');
      ex+=`<div class="hint">${MONTHS[V.month]}: ${parts||'нарядів не було'}</div>`;
    }
    return `<div class="pc" data-act="togglep" data-id="${p.id}"><div class="pc-h"><div><b>${kv(p)}${esc(p.name)}</b>${p.active?'':' <i class="mut">(вибув)</i>'}<small>${esc(p.rank)}${p.rank?' · ':''}${esc(squad(p.squad)?.name||'')}</small></div>
      <div class="nums"><span><b>${mc(p)}</b><small>міс.</small></span><span><b>${yc(p)}</b><small>${y}</small></span><span><b>${ac(p)}</b><small>всього</small></span></div></div>${ex}</div>`;
  };
  let h=`<div class="sumbox"><div><b>${sum(rows,mc)}</b><small>за ${MSHORT[V.month].toLowerCase()}</small></div><div><b>${sum(rows,yc)}</b><small>за ${y}</small></div><div><b>${sum(rows,ac)}</b><small>всього</small></div></div>
    <div class="seg"><button data-act="sortmode" data-v="squad" class="${V.sort==='squad'?'on':''}">По відділеннях</button><button data-act="sortmode" data-v="least" class="${V.sort==='least'?'on':''}">Найменше нарядів</button></div>`;
  if(V.sort==='least'){
    const l=[...rows].sort((a,b)=>mc(a)-mc(b)||ac(a)-ac(b)||a.name.localeCompare(b.name,'uk'));
    h+=`<div class="hint">Сортування: за місяць, потім за весь час — зверху ті, кому йти в наряд найдоречніше.</div>`+l.map(card).join('');
  } else {
    for(const sq of S.squads){
      const ps=rows.filter(p=>p.squad===sq.id); if(!ps.length) continue;
      h+=`<div class="sqh"><span>${esc(sq.name)}</span><span class="mut">${sum(ps,mc)} · ${sum(ps,yc)} · ${sum(ps,ac)}</span></div>`+ps.map(card).join('');
    }
    h+=`<div class="hint">У заголовку відділення: місяць · рік · всього. Торкніться картки, щоб побачити розбивку по місяцях.</div>`;
  }
  h+=`<div class="row noprint" style="margin-top:10px"><button class="b gray" data-act="csv">⬇ CSV (Excel)</button></div>`;
  return h;
}

/* ---------- sheets ---------- */
function modal(html){ $('#modal').innerHTML=`<div class="ov"><div class="md">${html}</div></div>`; }
function closeModal(){ $('#modal').innerHTML=''; DA=null; CB=null; render(); }

function openCell(pid,date){
  const p=person(pid),cur=dutyOn(pid,date);
  const [y,m,d]=date.split('-').map(Number);
  const yest=dutyOn(pid,keyOf(new Date(y,m-1,d-1))),tom=dutyOn(pid,keyOf(new Date(y,m-1,d+1)));

  if(yest||tom) h+=`<div class="warn" style="margin:8px 0 0">${yest?'Вчора вже був у наряді. ':''}${tom?'Завтра вже в наряді.':''}</div>`;
  if(cur) h+=`<button class="b red full" data-act="clearCell" data-p="${pid}" data-date="${date}" style="margin-top:10px">✕ Зняти наряд</button><div class="hint" style="margin:10px 0 0">Або оберіть інший вид наряду:</div>`;
  h+=`<div class="tl">`+S.types.map(t=>`<button class="${t.id===cur?'sel':''}" style="background:${esc(t.color)}" data-act="setCell" data-p="${pid}" data-date="${date}" data-t="${t.id}">${esc(t.code)} — ${esc(t.name)}</button>`).join('')+`</div>

  modal(h);
}

function openDay(date){ DA={date,tid:S.types[0]?.id,squad:'all'}; renderDay(); }
function renderDay(){
  const idx=buildIndex(),date=DA.date,ym=date.slice(0,7);
  const [y,m,d]=date.split('-').map(Number);
  const pk=keyOf(new Date(y,m-1,d-1)),nk=keyOf(new Date(y,m-1,d+1)),day=S.duties[date]||{};
  const list=S.people.filter(p=>p.active&&(DA.squad==='all'||p.squad===DA.squad)).map(p=>({p,as:day[p.id],yest:!!(S.duties[pk]||{})[p.id],tom:!!(S.duties[nk]||{})[p.id],mc:idx.byMonth[p.id]?.[ym]||0,tot:idx.total[p.id]||0}));
  list.sort((a,b)=>(!!a.as-!!b.as)||(a.yest-b.yest)||(a.tom-b.tom)||a.mc-b.mc||a.tot-b.tot||a.p.name.localeCompare(b.p.name,'uk'));
  const old=$('#dl'),st=old?old.scrollTop:0;
  let h=`<h3>Наряд на ${fmtDate(date)}</h3><div class="hint" style="margin-top:2px">Оберіть вид наряду, потім торкайтесь людей. Зверху — ті, хто ходив найменше (за місяць, потім за весь час). Повторний дотик прибирає наряд.</div>
   <div class="tl">`+S.types.map(t=>`<button class="${t.id===DA.tid?'sel':''}" style="background:${esc(t.color)}" data-act="dtype" data-t="${t.id}">${esc(t.code)} — ${esc(t.name)}</button>`).join('')+`</div>
   <div class="row"><select data-bind="dsq"><option value="all">Всі відділення</option>${S.squads.map(s=>`<option value="${s.id}" ${DA.squad===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
   <div id="dl">`;
  for(const r of list){
    const t=r.as&&type(r.as);
    h+=`<button class="pr ${r.as?'as':(r.yest||r.tom)?'bad':''}" data-act="assign" data-p="${r.p.id}">
      <span><b>${kv(r.p)}${esc(r.p.name)}</b><br><small class="mut">${esc(squad(r.p.squad)?.name||'')}</small>${r.yest?'<span class="tag">вчора</span>':''}${r.tom?'<span class="tag">завтра</span>':''}</span>
      <span class="r">${t?`<span class="chip" style="background:${esc(t.color)}">${esc(t.code)}</span><br>`:''}<span class="mut">міс: ${r.mc} · всього: ${r.tot}</span></span></button>`;
  }
  if(!list.length) h+=`<div class="hint" style="padding:10px">Немає людей.</div>`;
  h+=`</div><div class="row" style="margin-top:12px"><button class="b full" data-act="closeModal">Готово</button></div>`;
  modal(h); const nl=$('#dl'); if(nl) nl.scrollTop=st;
  render();
}

/* ---------- export / import ---------- */
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);}
function markBackup(){S.meta.lastBackup=new Date().toISOString();save();render();}
function backupBlob(){return new Blob([JSON.stringify(S,null,2)],{type:'application/json'});}
const backupName=()=>`naryady_backup_${keyOf(new Date())}.json`;
async function shareBackup(){
  const file=new File([backupBlob()],backupName(),{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Резервна копія нарядів'});markBackup();return;}
    catch(e){if(e&&e.name==='AbortError')return;}
  }
  download(backupName(),backupBlob()); markBackup();
}
function exportCSV(){
  const {idx,rows}=statsData(),y=V.year;
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const lines=[['№','Звання','ПІБ','Відділення',...MONTHS,`За ${y}`,'Всього'].map(q).join(';')];
  rows.forEach((p,i)=>{
    const ms=MONTHS.map((_,k)=>idx.byMonth[p.id]?.[`${y}-${pad(k+1)}`]||0),ys=ms.reduce((a,b)=>a+b,0);
    lines.push([i+1,p.rank,p.name,squad(p.squad)?.name||'',...ms,ys,idx.total[p.id]||0].map(q).join(';'));
  });
  download(`oblik_naryadiv_${y}.csv`,new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));
}
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!Array.isArray(o.people)||!Array.isArray(o.squads)||!Array.isArray(o.types)||typeof o.duties!=='object') throw new Error('Невірний формат файлу');
      confirmBox('Поточні дані буде замінено даними з файлу. Продовжити?','Замінити',()=>{S=normalize(o);save();closeModal();toast('Дані відновлено з копії');});
    }catch(e){toast('Не вдалося завантажити: '+e.message);}
  };
  r.readAsText(file);
}

/* ---------- actions ---------- */
function act(a,ds){
  switch(a){
    case 'tab': V.tab=ds.tab; render(); window.scrollTo(0,0); break;
    case 'prev': V.month--; if(V.month<0){V.month=11;V.year--;} setMonth(); render(); break;
    case 'next': V.month++; if(V.month>11){V.month=0;V.year++;} setMonth(); render(); break;
    case 'today': V.year=now.getFullYear(); V.month=now.getMonth(); V.day=now.getDate(); render(); break;
    case 'sview': V.sched=ds.v; render(); break;
    case 'pickday': V.day=+ds.d; render(); break;
    case 'sortmode': V.sort=ds.v; render(); break;
    case 'togglep': V.open[ds.id]=!V.open[ds.id]; render(); break;
    case 'print': window.print(); break;
    case 'closeModal': closeModal(); break;
    case 'openCell': openCell(ds.p,ds.date); break;
    case 'openDay': openDay(ds.date); break;
    case 'openPerson': openPerson(ds.id); break;
    case 'setCell': setDuty(ds.p,ds.date,ds.t); closeModal(); break;
    case 'clearCell': removeDuty(ds.p,ds.date); closeModal(); break;
    case 'rmDuty': removeDuty(ds.p,ds.date); render(); break;
    case 'toastUndo': { const f=TU; TU=null; $('#toast').style.display='none'; if(f) f(); break; }
    case 'cbYes': { const f=CB&&CB.yes; CB=null; if(f) f(); break; }
    case 'cbNo': { const f=CB&&CB.no; CB=null; if(f) f(); else closeModal(); break; }
    case 'dtype': DA.tid=ds.t; renderDay(); break;
    case 'assign':
      if(!DA.tid) return;
      if(dutyOn(ds.p,DA.date)===DA.tid) setDuty(ds.p,DA.date,null); else setDuty(ds.p,DA.date,DA.tid);
      renderDay(); break;
    case 'addPerson': {
      const name=cap($('#np-name').value); if(!name){$('#np-name').focus();return;}
      const sq=$('#np-squad').value,rk=$('#np-rank').value.trim(),isCmd=$('#np-cmd').checked;
      const np={id:uid(),rank:rk,name,squad:sq,active:true,cmd:false};
      S.people.push(np); setCmd(np,isCmd);
      save(); render(); $('#np-squad').value=sq; $('#np-rank').value=rk; $('#np-name').focus(); break; }
    case 'savePerson': {
      const p=person(ds.id),name=cap($('#pe-name').value); if(!name){$('#pe-name').focus();return;}
      p.name=name; p.rank=$('#pe-rank').value.trim(); p.squad=$('#pe-squad').value; p.active=$('#pe-active').checked;
      setCmd(p,$('#pe-cmd').checked);
      save(); closeModal(); break; }
    case 'delPerson': {
      const p=person(ds.id);
      confirmBox(`Видалити «${p.name}» разом з усіма його нарядами? (Щоб зберегти історію — краще зняти позначку «В строю».)`,'Видалити',()=>{
        S.people=S.people.filter(x=>x.id!==ds.id);
        for(const k of Object.keys(S.duties)){delete S.duties[k][ds.id]; if(!Object.keys(S.duties[k]).length) delete S.duties[k];}
        save(); closeModal();
      },()=>openPerson(ds.id));
      break; }
    case 'addSquad': { const v=$('#ns-name').value.trim(); if(!v)return; S.squads.push({id:uid(),name:v}); save(); render(); break; }
    case 'delSquad':
      if(S.squads.length<2){toast('Має залишитись хоча б одне відділення.');return;}
      if(S.people.some(p=>p.squad===ds.id)){toast('У цьому відділенні є особовий склад. Спочатку переведіть людей в інше відділення.');return;}
      S.squads=S.squads.filter(s=>s.id!==ds.id); save(); render(); break;
    case 'addType': { const n=$('#nt-name').value.trim(),c=$('#nt-code').value.trim(); if(!n||!c){toast('Вкажіть назву і код.');return;} S.types.push({id:uid(),name:n,code:c,color:$('#nt-color').value}); save(); render(); break; }
    case 'delType': {
      const t=type(ds.id); let cnt=0; Object.values(S.duties).forEach(m=>Object.values(m).forEach(x=>{if(x===ds.id)cnt++;}));
      confirmBox(`Видалити вид наряду «${t.name}»${cnt?` разом з ${cnt} призначеними нарядами`:''}?`,'Видалити',()=>{
        S.types=S.types.filter(x=>x.id!==ds.id);
        for(const k of Object.keys(S.duties)){for(const pid of Object.keys(S.duties[k])) if(S.duties[k][pid]===ds.id) delete S.duties[k][pid]; if(!Object.keys(S.duties[k]).length) delete S.duties[k];}
        save(); closeModal();
      });
      break; }
    case 'share': shareBackup(); break;
    case 'csv': exportCSV(); break;
    case 'importBtn': $('#imp').click(); break;
    case 'wipe':
      confirmBox('Стерти ВСІ дані (особовий склад, наряди, налаштування)? Це незворотно.','Далі',()=>
        confirmBox('Точно стерти? Рекомендується спершу зробити резервну копію.','Стерти все',()=>{S=defaults();save();V.tab='people';closeModal();}));
      break;
  }
}

document.addEventListener('click',e=>{
  const t=e.target;
  const a=t.closest('[data-act]'); if(a){act(a.dataset.act,a.dataset);return;}
  if(t.classList&&t.classList.contains('ov')){closeModal();return;}
  const c=t.closest('td.cell'); if(c){openCell(c.dataset.p,c.dataset.d);return;}
  const th=t.closest('th[data-day]'); if(th){V.day=+th.dataset.day;V.sched='day';render();window.scrollTo(0,0);return;}
});
document.addEventListener('change',e=>{
  const t=e.target,id=t.dataset.id;
  if(t.id==='imp'){ if(t.files[0]) importJSON(t.files[0]); t.value=''; return; }
  if(t.dataset.bind==='dsq'){DA.squad=t.value;renderDay();return;}
  if(t.dataset.sf){squad(id).name=t.value.trim()||squad(id).name;save();return;}
  if(t.dataset.tf){const x=type(id);x[t.dataset.tf]=t.value.trim()||x[t.dataset.tf];save();return;}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='np-name') act('addPerson',{});
  if(e.key==='Escape'&&$('#modal').innerHTML) closeModal();
});
render();
</script>
</body>
</html>

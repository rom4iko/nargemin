      state.personnel = state.personnel.filter(function(p) { return p.id !== pid; });

      showToast('Видалено зі складу');
      render();

          (admin ? (
            '<div class="grid-2">' +
              '<button type="button" class="btn btn-sm btn-warn" onclick="fbPushAll(false)">☁️ Завантажити мої дані в хмару</button>' +
              '<button type="button" class="btn btn-sm btn-info" onclick="fbPullAll(true,false)">⬇️ Завантажити з хмари</button>' +
            '</div>' +
            '<div class="grid-2">' +
              '<button type="button" class="btn btn-sm btn-secondary" onclick="fbTestWrite()">🧪 Тест запису</button>' +
              '<button type="button" class="btn btn-sm btn-secondary" onclick="copyShareLinkForKV()">🔗 Скопіювати посилання для КВ</button>' +
            '</div>'
          ) : (
            '<button type="button" class="btn btn-sm btn-info btn-full" onclick="fbPullAll(true,false)">⬇️ Завантажити з хмари</button>'
          )) +
          '<div id="fb-diag-box" class="diag-box ' + diagCls + '">' + esc(fbDiag.text) + '</div>' +
        '</div>';

      var backupCard =
        '<div class="card stack">' +
          '<div class="section-title">💾 Резервна копія та експорт</div>' +
          '<div class="grid-2">' +
            '<button type="button" class="btn btn-sm btn-secondary" onclick="exportBackupJSON()">💾 Зберегти бекап (JSON)</button>' +
            '<button type="button" class="btn btn-sm btn-secondary" onclick="exportDutiesCSV()">📊 Експорт нарядів (CSV)</button>' +
          '</div>' +
          (admin ? '<button type="button" class="btn btn-sm btn-info btn-full" onclick="document.getElementById(\'import-json-input\').click()">⬆️ Відновити з бекапу (JSON)</button>' : '') +
        '</div>';

      if (!admin) return versionCard + fbCard + backupCard;

      var pinsCard =
        '<div class="card stack">' +
          '<div class="section-title">🔑 PIN-коди доступу (4 цифри)</div>' +
          '<div class="grid-2">' +
            '<div class="field"><label class="field-label">🛡️ Адмін</label><input id="pin-admin" class="input" maxlength="4" inputmode="numeric" value="' + esc(state.pins.admin) + '" /></div>' +
            '<div class="field"><label class="field-label">⭐ КГ</label><input id="pin-kg" class="input" maxlength="4" inputmode="numeric" value="' + esc(state.pins.kg) + '" /></div>' +
            '<div class="field"><label class="field-label">🔹 КВ 1</label><input id="pin-kv1" class="input" maxlength="4" inputmode="numeric" value="' + esc(state.pins.kv1) + '" /></div>' +
            '<div class="field"><label class="field-label">🔹 КВ 2</label><input id="pin-kv2" class="input" maxlength="4" inputmode="numeric" value="' + esc(state.pins.kv2) + '" /></div>' +
            '<div class="field"><label class="field-label">🔹 КВ 3</label><input id="pin-kv3" class="input" maxlength="4" inputmode="numeric" value="' + esc(state.pins.kv3) + '" /></div>' +
          '</div>' +
          '<button type="button" class="btn btn-primary btn-full" onclick="savePinsSettings()">Зберегти PIN-коди</button>' +
        '</div>';

      var permBlocks = ['kg', 'kv1', 'kv2', 'kv3'].map(function(rk) {
        var pm = getPerm(rk);
        return '<div class="perm-block">' +
          '<div class="fw-800 text-sm" style="color:#fff">' + esc(ROLES_META[rk].label) + '</div>' +
          '<div class="grid-2">' +
            '<label class="toggle-pill"><input type="checkbox" ' + (pm.dutiesEdit ? 'checked' : '') + ' onchange="setRolePerm(\'' + rk + '\',\'dutiesEdit\',this.checked)" /><span>Ред. нарядів</span></label>' +
            '<label class="toggle-pill"><input type="checkbox" ' + (pm.tasksCreate ? 'checked' : '') + ' onchange="setRolePerm(\'' + rk + '\',\'tasksCreate\',this.checked)" /><span>Ставити задачі</span></label>' +
            '<label class="toggle-pill"><input type="checkbox" ' + (pm.tasksStatus ? 'checked' : '') + ' onchange="setRolePerm(\'' + rk + '\',\'tasksStatus\',this.checked)" /><span>Статус задач</span></label>' +
            '<label class="toggle-pill"><input type="checkbox" ' + (pm.tasksViewAll ? 'checked' : '') + ' onchange="setRolePerm(\'' + rk + '\',\'tasksViewAll\',this.checked)" /><span>Всі задачі</span></label>' +
          '</div>' +
          '<div class="grid-2">' +
            '<div class="field"><label class="field-label">Розхід</label>' +
              '<select class="select select-sm" onchange="setRolePerm(\'' + rk + '\',\'rozkhidMode\',this.value)">' +
                '<option value="view" ' + (pm.rozkhidMode === 'view' ? 'selected' : '') + '>Перегляд</option>' +
                '<option value="squad" ' + (pm.rozkhidMode === 'squad' ? 'selected' : '') + '>Своє відд.</option>' +
                '<option value="all" ' + (pm.rozkhidMode === 'all' ? 'selected' : '') + '>Увесь взвод</option>' +
              '</select>' +
            '</div>' +
            '<div class="field"><label class="field-label">Склад</label>' +
              '<select class="select select-sm" onchange="setRolePerm(\'' + rk + '\',\'skladMode\',this.value)">' +
                '<option value="view" ' + (pm.skladMode === 'view' ? 'selected' : '') + '>Перегляд</option>' +
                '<option value="squad_status" ' + (pm.skladMode === 'squad_status' ? 'selected' : '') + '>Статуси свого</option>' +
                '<option value="all_edit" ' + (pm.skladMode === 'all_edit' ? 'selected' : '') + '>Повне ред.</option>' +
              '</select>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');

      var permsCard = '<div class="card stack"><div class="section-title">🛡️ Права доступу ролей</div>' + permBlocks + '</div>';

      var dangerCard =
        '<div class="card stack">' +
          '<div class="section-title" style="color:#fca5a5">Небезпечна зона</div>' +
          '<button type="button" class="btn btn-sm btn-danger btn-full" onclick="confirmClearLocalData()">🗑️ Очистити локальні дані</button>' +
        '</div>';

      return versionCard + fbCard + backupCard + pinsCard + permsCard + dangerCard;
    }

    function savePinsSettings() {
      if (!isAdmin()) return;
      var nextPins = {}, used = {};
      for (var i = 0; i < ROLE_ORDER.length; i++) {
        var k = ROLE_ORDER[i];
        var val = (document.getElementById('pin-' + k).value || '').trim();
        if (!/^\d{4}$/.test(val)) { showToast('Усі PIN-коди мають містити 4 цифри', true); return; }
        if (used[val]) { showToast('PIN-коди не можуть повторюватись', true); return; }
        used[val] = true;
        nextPins[k] = val;
      }
      state.pins = nextPins;
      saveState(true);
      showToast('PIN-коди збережено');
    }

    function setRolePerm(roleKey, field, val) {
      if (!isAdmin()) return;
      if (!state.rolePermissions[roleKey]) state.rolePermissions[roleKey] = Object.assign({}, DEFAULT_ROLE_PERMISSIONS[roleKey]);
      state.rolePermissions[roleKey][field] = val;
      saveState(true);
      showToast('Права оновлено');
    }

    function confirmClearLocalData() {
      if (!isAdmin()) return;
      openModal(
        '<div class="modal-header"><div class="modal-title">Очистити локальні дані?</div><button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body">' +
          '<div class="text-sm">Усі локальні списки, наряди та задачі на цьому пристрої буде скинуто. Дані у Firebase залишаться до ручного завантаження.</div>' +
          '<div class="grid-2">' +
            '<button type="button" class="btn btn-secondary" onclick="closeModal()">Скасувати</button>' +
            '<button type="button" class="btn btn-danger" onclick="executeClearLocalData()">Очистити</button>' +
          '</div>' +
        '</div>'
      );
    }

    function executeClearLocalData() {
      state = createDefaultState();
      safeLSRemove(STORAGE_KEY);
      closeModal();
      showToast('Локальні дані очищено');
      render();
    }

    // =========================================================================
    // 13. РЕЗЕРВНЕ КОПІЮВАННЯ (JSON) ТА ЕКСПОРТ НАРЯДІВ (CSV)
    // =========================================================================
    function exportBackupJSON() {
      try {
        state.lastBackupAt = fmtTimeNow();
        var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'pomichnyk_vzvodu_backup_' + todayISO() + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('Бекап збережено (' + state.personnel.length + ' осіб)');
      } catch (e) {
        showToast('Помилка збереження бекапу', true);
      }
    }

    function handleImportJSON(ev) {
      if (!isAdmin()) return;
      var file = ev.target && ev.target.files ? ev.target.files[0] : null;
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function() {
        try {
          var parsed = JSON.parse(String(reader.result || ''));
          state = normalizeState(parsed);
          saveState(true);
          render();
          showToast('✅ Відновлено з бекапу: ' + state.personnel.length + ' осіб');
        } catch (e) {
          showToast('Помилка читання JSON файлу', true);
        }
      };
      reader.readAsText(file);
      ev.target.value = '';
    }

    function exportDutiesCSV() {
      var rows = [['Дата', 'Вид наряду', 'Відділення', 'Звання', 'ПІБ']];
      var sorted = state.duties.slice().sort(function(a, b) { return a.date.localeCompare(b.date); });
      sorted.forEach(function(d) {
        var dt = getDutyTypeById(d.dutyTypeId);
        var p = getPersonById(d.personId);
        var sq = p ? getSquadById(p.squadId) : null;
        rows.push([fmtUA(d.date), dt ? dt.shortName : '', sq ? sq.name : '', p ? p.rank : '', p ? p.fullName : '']);
      });
      var csv = '\uFEFF' + rows.map(function(r) {
        return r.map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(';');
      }).join('\n');
      try {
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'naryady_' + state.groupNumber + '_' + todayISO() + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('CSV нарядів експортовано');
      } catch (e) {
        showToast('Помилка експорту CSV', true);
      }
    }

    // =========================================================================
    // 14. ДЕЛЕГУВАННЯ ПОДІЙ, МОДАЛКИ, РЕНДЕР ТА ЗАПУСК
    // =========================================================================
    function isModalOpen() {
      var root = document.getElementById('modal-root');
      return Boolean(root && root.classList.contains('open'));
    }
    function openModal(html) {
      var box = document.getElementById('modal-box');
      var root = document.getElementById('modal-root');
      if (!box || !root) return;
      box.innerHTML = html;
      root.classList.add('open');
    }
    function closeModal() {
      var root = document.getElementById('modal-root');
      if (root) root.classList.remove('open');
    }

    function switchTab(tab) {
      ui.tab = tab;
      render();
      window.scrollTo(0, 0);
    }

    function updateTasksBadge() {
      var badge = document.getElementById('nav-tasks-badge');
      if (!badge || !currentRole) return;
      var activeCount = state.tasks.filter(function(t) {
        return t.status !== 'done' && isTaskVisibleForRole(t, currentRole);
      }).length;
      if (activeCount <= 0) {
        badge.classList.add('hidden');
        badge.textContent = '0';
      } else {
        badge.classList.remove('hidden');
        badge.textContent = activeCount > 99 ? '99+' : String(activeCount);
      }
    }

    function bindMainDelegatedEvents() {
      var main = document.getElementById('main-content');
      if (!main || main.dataset.bound === '1') return;
      main.dataset.bound = '1';

      main.addEventListener('click', function(ev) {
        // Календар нарядів
        var calBtn = ev.target.closest('[data-cal-date]');
        if (calBtn) {
          ui.selectedDate = calBtn.getAttribute('data-cal-date');
          render();
          return;
        }
        // Наряди: + Призначити / Видалити запис
        var assignBtn = ev.target.closest('[data-assign-dt]');
        if (assignBtn) {
          openDutyPickerModal(assignBtn.getAttribute('data-assign-dt'));
          return;
        }
        var remDutyBtn = ev.target.closest('[data-remove-duty]');
        if (remDutyBtn) {
          removeDuty(remDutyBtn.getAttribute('data-remove-duty'));
          return;
        }
        // Задачі: статус / видалення
        var taskStBtn = ev.target.closest('[data-task-st]');
        if (taskStBtn) {
          if (!canUpdateTaskStatus()) return;
          var tid = taskStBtn.getAttribute('data-task-id');
          var t = state.tasks.find(function(x) { return x.id === tid; });
          if (t) {
            t.status = taskStBtn.getAttribute('data-task-st');
            t.updatedAt = fmtTimeNow();
            saveState(true);
            render();
          }
          return;
        }
        var delTaskBtn = ev.target.closest('[data-del-task]');
        if (delTaskBtn) {
          if (!canCreateTasks()) return;
          var dtid = delTaskBtn.getAttribute('data-del-task');
          state.tasks = state.tasks.filter(function(x) { return x.id !== dtid; });
          saveState(true);
          showToast('Задачу видалено');
          render();
          return;
        }
        // Розхід: степери, скидання, мульти-вибір людей, видалення періоду
        var stepBtn = ev.target.closest('[data-r-step]');
        if (stepBtn) {
          stepRozkhidNumeric(stepBtn.getAttribute('data-r-step'), Number(stepBtn.getAttribute('data-r-delta')) || 0);
          return;
        }
        var resetBtn = ev.target.closest('[data-r-reset]');
        if (resetBtn) {
          resetRozkhidNumeric(resetBtn.getAttribute('data-r-reset'));
          return;
        }
        var peopleBtn = ev.target.closest('[data-r-people]');
        if (peopleBtn) {
          openRozkhidCategoryPeopleModal(peopleBtn.getAttribute('data-r-people'));
          return;
        }
        var delAbsBtn = ev.target.closest('[data-del-abs]');
        if (delAbsBtn) {
          if (!canEditRozkhid()) return;
          var aid = delAbsBtn.getAttribute('data-del-abs');
          state.scheduledAbsences = state.scheduledAbsences.filter(function(a) { return a.id !== aid; });
          saveState(true);
          showToast('Період видалено');
          render();
          return;
        }
        // Склад: згортання, розкриття бійця, редагування, видалення
        var colSq = ev.target.closest('[data-col-sq]');
        if (colSq) {
          var sid = colSq.getAttribute('data-col-sq');
          ui.collapsedSquads[sid] = !ui.collapsedSquads[sid];
          render();
          return;
        }
        var expP = ev.target.closest('[data-exp-pers]');
        if (expP) {
          var pid = expP.getAttribute('data-exp-pers');
          ui.expandedSoldiers[pid] = !ui.expandedSoldiers[pid];
          render();
          return;
        }
        var editP = ev.target.closest('[data-edit-pers]');
        if (editP) {
          openPersonModal(editP.getAttribute('data-edit-pers'));
          return;
        }
        var delP = ev.target.closest('[data-del-pers]');
        if (delP) {
          confirmDeletePerson(delP.getAttribute('data-del-pers'));
          return;
        }
      });

      main.addEventListener('change', function(ev) {
        // Поіменний розхід на дату
        var rosterSel = ev.target.closest('[data-roster-pid]');
        if (rosterSel) {
          setManualPersonRozkhid(ui.rozkhidDate, rosterSel.getAttribute('data-roster-pid'), rosterSel.value);
          return;
        }
        // Постійний статус бійця у Складі
        var persSel = ev.target.closest('[data-pers-st]');
        if (persSel) {
          var p = getPersonById(persSel.getAttribute('data-pers-st'));
          if (p && canEditPersonPresence(p)) {
            p.presenceStatus = normalizePresenceStatus(persSel.value);
            saveState(true);
            render();
          }
        }
      });
    }

    function render() {
      if (!currentRole) return;
      updateSyncPillUI();
      updateTasksBadge();

      document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
      var activeBtn = document.getElementById('nav-' + ui.tab);
      if (activeBtn) activeBtn.classList.add('active');

      var main = document.getElementById('main-content');
      if (!main) return;
      if (ui.tab === 'duties') main.innerHTML = renderDutiesTab();
      else if (ui.tab === 'tasks') main.innerHTML = renderTasksTab();
      else if (ui.tab === 'rozkhid') main.innerHTML = renderRozkhidTab();
      else if (ui.tab === 'personnel') main.innerHTML = renderPersonnelTab();
      else main.innerHTML = renderSettingsTab();
    }

    (function bootstrap() {
      bindMainDelegatedEvents();
      try {
        var params = new URLSearchParams(window.location.search);
        var fbParam = params.get('fb') || params.get('db');
        if (fbParam) {
          var normalized = normalizeFirebaseBaseUrl(fbParam);
          if (normalized) {
            fbUrl = normalized;
            safeLSSet(FB_URL_STORAGE_KEY, fbUrl);
          }
        }
      } catch (e) {}

      var savedRole = safeSSGet(SESSION_ROLE_KEY) || safeLSGet(SESSION_ROLE_KEY);
      if (savedRole && ROLES_META[savedRole]) {
        loginAsRole(savedRole);
      } else {
        document.getElementById('pin-screen').classList.remove('hidden');
        renderPinScreen();
      }
    })();
  </script>
</body>
</html>

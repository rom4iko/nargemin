      { code: 'Н',              hint: 'Наряд (авто з графіка)' },
      { code: 'Г',              hint: 'Гуртожиток' },
      { code: 'Пк',             hint: 'Поза казармою' },
      { code: 'Хв',             hint: 'Хворий' },
      { code: 'Стародобовий',   hint: 'Вчорашній наряд (авто)' }
    ];

    const DEFAULT_SQUADS = [
      { id: GROUP_CMD_SQUAD_ID, name: 'Командир групи', color: '#eab308', isGroupCmd: true },
      { id: 'sq_1', name: '1-ше відділення', color: '#10b981' },
      { id: 'sq_2', name: '2-ге відділення', color: '#3b82f6' },
      { id: 'sq_3', name: '3-тє відділення', color: '#f59e0b' }
    ];

    const DEFAULT_DUTY_TYPES = [
      { id: 'dt_1', name: 'Черговий' },
      { id: 'dt_2', name: 'Днювальний' },
      { id: 'dt_3', name: 'КПП' },
      { id: 'dt_4', name: 'Патруль' }
    ];

    // =========================================================================
    // СТАН ДАНИХ ТА UI (БЕЗ ДЕМО-ЗАПИСІВ)
    // =========================================================================
    let state = {
      groupNumber: '223',
      squads: [],       // [{ id, name, color, isGroupCmd? }]
      soldiers: [],     // [{ id, name, rank, squadId, isCommander, status }]
      dutyTypes: [],    // [{ id, name }]
      duties: [],       // [{ id, date: 'YYYY-MM-DD', soldierId, dutyTypeId }]
      tasks: [],        // [{ id, targetType: 'squad'|'all_commanders', targetSquadId, text, issuer, deadline, status, note, createdAt }]
      rozkhid: {},      // { 'YYYY-MM-DD': { overrides: { [soldierId]: code|'Вн' }, extra: { [catCode]: number } } }
      lastBackupAt: null
    };

    const nowDate = new Date();
    let ui = {
      activeTab: 'duties',        // 'duties' | 'tasks' | 'rozkhid' | 'personnel' | 'settings'
      dutiesSubTab: 'schedule',   // 'schedule' | 'stats'
      year: nowDate.getFullYear(),
      month: nowDate.getMonth(),
      selectedDate: toISODate(nowDate),
      scheduleSquadFilter: 'all',
      statsSquadFilter: 'all',
      statsSort: 'month_desc',    // 'month_desc' | 'month_asc' | 'total_desc' | 'alpha'
      rozkhidDate: toISODate(nowDate),
      rozkhidIncludeNames: true,  // УВІМКНЕНО за замовчуванням у v2.5
      rozkhidHideZeros: false,
      personnelSquadFilter: 'all',
      expandedPersonnelSquads: {},
      expandedSoldiers: {},
      personnelSearch: '',
      tasksTargetFilter: 'all',
      tasksStatusFilter: 'all',
      openNotes: {}
    };

    let assignModal = { date: '', dutyTypeId: '' };
    let tempSquadColor = SQUAD_PALETTE[0];

    // =========================================================================
    // УТИЛІТИ
    // =========================================================================
    function genId(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function toISODate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function toDateTimeHuman(d) {
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      const hh = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${dd}.${mm}.${yyyy} о ${hh}:${min}`;
    }

    function addDaysISO(iso, delta) {
      const [y, m, d] = iso.split('-').map(Number);
      return toISODate(new Date(y, m - 1, d + delta));
    }

    function diffDaysISO(isoA, isoB) {
      const [ya, ma, da] = isoA.split('-').map(Number);
      const [yb, mb, db] = isoB.split('-').map(Number);
      return Math.round((Date.UTC(ya, ma - 1, da) - Date.UTC(yb, mb - 1, db)) / 86400000);
    }

    function formatDateHuman(iso) {
      if (!iso) return '—';
      const [y, m, d] = iso.split('-').map(Number);
      return `${d} ${MONTHS_GEN_UK[m - 1]} ${y}`;
    }

    function formatDateShort(iso) {
      if (!iso) return 'Не було';
      const [y, m, d] = iso.split('-').map(Number);
      return `${String(d).padStart(2, '0')}.${String(m).padStart(2, '0')}.${y}`;
    }

    function formatDeadline(val) {
      if (!val) return '';
      const [datePart, timePart] = val.split('T');
      const [y, m, d] = datePart.split('-').map(Number);
      const base = `${String(d).padStart(2, '0')}.${String(m).padStart(2, '0')}.${y}`;
      return timePart ? `${base} о ${timePart.slice(0, 5)}` : base;
    }

    function getMonthPrefix(year, month) {
      return `${year}-${String(month + 1).padStart(2, '0')}`;
    }

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Автоматична велика літера для кожного слова та ініціалів у ПІБ
    function formatFullName(raw) {
      if (!raw) return '';
      return raw
        .trim()
        .replace(/\s+/g, ' ')
        .split(' ')
        .map(word =>
          word
            .split('-')
            .map(part =>
              part
                .split('.')
                .map(seg => seg ? seg.charAt(0).toUpperCase() + seg.slice(1) : '')
                .join('.')
            )
            .join('-')
        )
        .join(' ');
    }

    function capitalizeLive(inputEl) {
      const pos = inputEl.selectionStart;
      const val = inputEl.value;
      const formatted = val.replace(/(^|[\s\-\.])([a-zа-яіїєґ])/g, (m, sep, ch) => sep + ch.toUpperCase());
      if (formatted !== val) {
        inputEl.value = formatted;
        try { inputEl.setSelectionRange(pos, pos); } catch (e) {}
      }
    }

    // Надійне копіювання в буфер обміну (працює на iOS Safari, Android Chrome та в iFrame)
    function copyToClipboard(text, successMsg = 'Скопійовано у буфер обміну') {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) {
          showToast(successMsg);
          return true;
        }
      } catch (e) {}

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(successMsg))
          .catch(() => showToast('Не вдалося скопіювати текст', 'error'));
        return true;
      }

      showToast('Не вдалося скопіювати текст', 'error');
      return false;
    }

    // Отримання прізвища для рапорту (якщо є однофамільці у взводі — додає ініціал імені)
    function getSurnameCountsMap() {
      const counts = {};
      for (const s of state.soldiers) {
        const parts = (s.name || '').trim().split(/\s+/);
        const key = (parts[0] || '').toLowerCase();
        if (key) counts[key] = (counts[key] || 0) + 1;
      }
      return counts;
    }

    function formatReportSurname(soldier, surnameCounts) {
      const parts = (soldier.name || '').trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return '';
      const surname = parts[0];
      const key = surname.toLowerCase();
      if ((surnameCounts[key] || 0) > 1 && parts[1]) {
        const initial = parts[1].replace(/\./g, '').charAt(0).toUpperCase();
        return initial ? `${surname} ${initial}.` : surname;
      }
      return surname;
    }

    function normalizeSoldierStatus(st) {
      if (!st || st === 'active') return 'active';
      if (st === 'leave') return 'Вп';
      if (st === 'medical') return 'Ш';
      if (st === 'trip') return 'Вд';
      if (PERMANENT_ABSENT_CODES.has(st)) return st;
      return 'active';
    }

    function getStatusObj(statusId) {
      const norm = normalizeSoldierStatus(statusId);
      return SOLDIER_STATUSES.find(s => s.id === norm) || SOLDIER_STATUSES[0];
    }

    function isGroupCmdSquad(sq) {
      return Boolean(sq && (sq.id === GROUP_CMD_SQUAD_ID || sq.isGroupCmd));
    }

    function getOrderedSquads() {
      const cmd = [];
      const rest = [];
      for (const sq of state.squads) {
        if (isGroupCmdSquad(sq)) cmd.push(sq);
        else rest.push(sq);
      }
      return [...cmd, ...rest];
    }

    function getSquadById(id) {
      return state.squads.find(s => s.id === id) || { id, name: 'Без відділення', color: '#64748b' };
    }

    function getSquadTabLabel(sq) {
      if (!sq) return 'Відд.';
      if (isGroupCmdSquad(sq)) return 'Ком. групи';
      const m = sq.name.match(/^(\d+)/);
      if (m) return `${m[1]} відд.`;
      return sq.name.length > 11 ? sq.name.slice(0, 10) + '…' : sq.name;
    }

    function formatCommanderTargetLabel(sq) {
      if (!sq) return 'Командиру відділення';
      if (isGroupCmdSquad(sq)) return 'Командиру групи';
      const m = sq.name.match(/^(\d+)/);
      if (m) return `Командиру ${m[1]}-го відділення`;
      return `Командиру (${sq.name})`;
    }

    function getSoldierById(id) {
      return state.soldiers.find(s => s.id === id);
    }

    function getDutyTypeById(id) {
      return state.dutyTypes.find(d => d.id === id) || { id, name: 'Наряд' };
    }

    function getSquadCommander(squadId) {
      return state.soldiers.find(s => s.squadId === squadId && s.isCommander) || null;
    }

    function getGroupCommanderSoldier() {
      return state.soldiers.find(s => s.squadId === GROUP_CMD_SQUAD_ID) || null;
    }

    // Командир відділення завжди зверху, решта — за алфавітом
    function sortSquadMembers(list) {
      return [...list].sort((a, b) => {
        if (a.isCommander && !b.isCommander) return -1;
        if (!a.isCommander && b.isCommander) return 1;
        return a.name.localeCompare(b.name, 'uk');
      });
    }

    function getSoldierStats(soldierId, year, month, beforeOrOnDate = null) {
      const prefix = getMonthPrefix(year, month);
      let monthCount = 0;
      let totalCount = 0;
      let lastDate = null;

      for (const d of state.duties) {
        if (d.soldierId !== soldierId) continue;
        totalCount++;
        if (d.date.startsWith(prefix)) monthCount++;
        if (!beforeOrOnDate || d.date <= beforeOrOnDate) {
          if (!lastDate || d.date > lastDate) lastDate = d.date;
        }
      }
      return { monthCount, totalCount, lastDate };
    }

    // =========================================================================
    // ІНІЦІАЛІЗАЦІЯ, МІГРАЦІЯ ТА ЗБЕРЕЖЕННЯ (БЕЗ ДЕМО-ЗАПИСІВ)
    // =========================================================================
    function ensureGroupCmdSquad(squadsList) {
      const list = Array.isArray(squadsList) ? [...squadsList] : [];
      const existingIdx = list.findIndex(sq =>
        sq && (sq.id === GROUP_CMD_SQUAD_ID || sq.isGroupCmd || (sq.name && sq.name.trim().toLowerCase() === 'командир групи'))
      );
      if (existingIdx === -1) {
        list.unshift({ id: GROUP_CMD_SQUAD_ID, name: 'Командир групи', color: '#eab308', isGroupCmd: true });
      } else {
        const [item] = list.splice(existingIdx, 1);
        item.isGroupCmd = true;
        if (!item.color) item.color = '#eab308';
        list.unshift(item);
      }
      return list;
    }

    // Міграція формату rozkhid з попередніх версій ({ [date]: { [soldierId]: code } } -> { [date]: { overrides: {}, extra: {} } })
    function migrateRozkhidMap(rawRozkhid) {
      const res = {};
      if (!rawRozkhid || typeof rawRozkhid !== 'object') return res;
      for (const [dateKey, val] of Object.entries(rawRozkhid)) {
        if (!val || typeof val !== 'object') continue;
        if (val.overrides && typeof val.overrides === 'object') {
          res[dateKey] = {
            overrides: { ...val.overrides },
            extra: val.extra && typeof val.extra === 'object' ? { ...val.extra } : {}
          };
        } else {
          // Старий плаский формат: { [soldierId]: statusCode }
          res[dateKey] = {
            overrides: { ...val },
            extra: {}
          };
        }
      }
      return res;
    }

    function createEmptyInitialState() {
      return {
        groupNumber: '223',
        squads: JSON.parse(JSON.stringify(DEFAULT_SQUADS)),
        soldiers: [],
        dutyTypes: JSON.parse(JSON.stringify(DEFAULT_DUTY_TYPES)),
        duties: [],
        tasks: [],
        rozkhid: {},
        lastBackupAt: null
      };
    }

    function loadState() {
      try {
        let raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          for (const legacyKey of ['pomichnyk_vzvodu_v2', 'pomichnyk_vzvodu_v1', 'platoon_duty_tracker_v1']) {
            const legacyRaw = localStorage.getItem(legacyKey);
            if (legacyRaw) {
              raw = legacyRaw;
              break;
            }
          }
        }
        if (!raw) {
          state = createEmptyInitialState();
          saveState();
          return;
        }
        const parsed = JSON.parse(raw);
        const migratedSquads = ensureGroupCmdSquad(
          Array.isArray(parsed.squads) && parsed.squads.length
            ? parsed.squads
            : JSON.parse(JSON.stringify(DEFAULT_SQUADS))
        );
        const migratedSoldiers = (Array.isArray(parsed.soldiers) ? parsed.soldiers : []).map(s => ({
          ...s,
          status: normalizeSoldierStatus(s.status)
        }));
        state = {
          groupNumber: typeof parsed.groupNumber === 'string' && parsed.groupNumber.trim() ? parsed.groupNumber : '223',
          squads: migratedSquads,
          soldiers: migratedSoldiers,
          dutyTypes: Array.isArray(parsed.dutyTypes) && parsed.dutyTypes.length
            ? parsed.dutyTypes
            : JSON.parse(JSON.stringify(DEFAULT_DUTY_TYPES)),
          duties: Array.isArray(parsed.duties) ? parsed.duties : [],
          tasks: Array.isArray(parsed.tasks) ? parsed.tasks : [],
          rozkhid: migrateRozkhidMap(parsed.rozkhid),
          lastBackupAt: parsed.lastBackupAt || null
        };
        saveState();
      } catch (e) {
        console.error('Помилка читання localStorage:', e);
        state = createEmptyInitialState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Помилка збереження:', e);
        showToast('Помилка збереження в пам\'ять пристрою', 'error');
      }
    }

    // =========================================================================
    // СПОВІЩЕННЯ ТА МОДАЛЬНІ ВІКНА (БЕЗ alert() / confirm())
    // =========================================================================
    function showToast(msg, type = 'success') {
      const root = document.getElementById('toast-root');
      const el = document.createElement('div');
      el.className = `toast ${type === 'error' ? 'error' : ''}`;
      el.textContent = msg;
      root.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.2s';
        setTimeout(() => el.remove(), 220);
      }, 2400);
    }

    function openModal(html) {
      const root = document.getElementById('modal-root');
      const panel = document.getElementById('modal-panel');
      panel.innerHTML = html;
      root.classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal-root').classList.remove('open');
    }

    document.getElementById('modal-root').addEventListener('click', (e) => {
      if (e.target.id === 'modal-root') closeModal();
    });

    function showConfirm(title, message, confirmLabel, onConfirm, danger = true) {
      openModal(`
        <div class="modal-header">
          <div class="modal-title">${esc(title)}</div>
          <button class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <p class="text-sm text-muted" style="line-height:1.5">${esc(message)}</p>
          <div class="grid-2" style="margin-top:4px">
            <button class="btn btn-secondary" onclick="closeModal()">Скасувати</button>
            <button id="confirm-ok-btn" class="btn ${danger ? 'btn-danger-solid' : 'btn-primary'}">${esc(confirmLabel)}</button>
          </div>
        </div>
      `);
      document.getElementById('confirm-ok-btn').onclick = () => {
        closeModal();
        onConfirm();
      };
    }

    // =========================================================================
    // НАВІГАЦІЯ ТА ЗАГАЛЬНІ КОМПОНЕНТИ
    // =========================================================================
    function switchTab(tab) {
      ui.activeTab = tab;
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function switchDutiesSubTab(sub) {
      ui.dutiesSubTab = sub;
      render();
    }

    function changeMonth(delta) {
      ui.month += delta;
      if (ui.month < 0) { ui.month = 11; ui.year--; }
      else if (ui.month > 11) { ui.month = 0; ui.year++; }

      if (ui.year === nowDate.getFullYear() && ui.month === nowDate.getMonth()) {
        ui.selectedDate = toISODate(nowDate);
      } else {
        ui.selectedDate = `${ui.year}-${String(ui.month + 1).padStart(2, '0')}-01`;
      }
      render();
    }

    function goToToday() {
      const t = new Date();
      ui.year = t.getFullYear();
      ui.month = t.getMonth();
      ui.selectedDate = toISODate(t);
      render();
    }

    function renderMonthBar(showTodayBtn = true) {
      return `
        <div class="date-bar">
          <button class="btn-icon" onclick="changeMonth(-1)" aria-label="Попередній місяць">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="date-bar-title" style="text-transform:uppercase">${MONTHS_UK[ui.month]} ${ui.year}</div>
          ${showTodayBtn ? `<button class="btn btn-sm btn-secondary" onclick="goToToday()">Сьогодні</button>` : ''}
          <button class="btn-icon" onclick="changeMonth(1)" aria-label="Наступний місяць">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      `;
    }

    function renderSquadPills(activeId, handlerName, excludeGroupCmd = false) {
      const allBtn = `
        <button class="pill-btn ${activeId === 'all' ? 'active' : ''}" style="--pill-color:#4ade80" onclick="${handlerName}('all')">
          <span>Всі</span>
        </button>
      `;
      const ordered = getOrderedSquads().filter(sq => !(excludeGroupCmd && isGroupCmdSquad(sq)));
      const squadBtns = ordered.map(sq => `
        <button class="pill-btn ${activeId === sq.id ? 'active' : ''}" style="--pill-color:${sq.color}" onclick="${handlerName}('${sq.id}')">
          <span class="pill-dot" style="background:${sq.color}"></span>
          <span>${esc(getSquadTabLabel(sq))}</span>
        </button>
      `).join('');
      return `<div class="pills-row">${allBtn}${squadBtns}</div>`;
    }

    // =========================================================================
    // ВКЛАДКА 1: НАРЯДИ (ГРАФІК + ОБЛІК)
    // =========================================================================
    function renderDutiesTab() {
      const subTabsHtml = `
        <div class="subtabs">
          <button class="subtab-btn ${ui.dutiesSubTab === 'schedule' ? 'active' : ''}" onclick="switchDutiesSubTab('schedule')">Графік</button>
          <button class="subtab-btn ${ui.dutiesSubTab === 'stats' ? 'active' : ''}" onclick="switchDutiesSubTab('stats')">Облік</button>
        </div>
      `;
      return subTabsHtml + (ui.dutiesSubTab === 'schedule' ? renderScheduleView() : renderStatsView());
    }

    function setScheduleSquadFilter(id) {
      ui.scheduleSquadFilter = id;
      render();
    }

    function selectCalendarDate(iso) {
      ui.selectedDate = iso;
      render();
    }

    function renderScheduleView() {
      const y = ui.year;
      const m = ui.month;
      const firstDay = new Date(y, m, 1);
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      let offset = firstDay.getDay() - 1;
      if (offset < 0) offset = 6;

      const todayISO = toISODate(nowDate);
      const monthPrefix = getMonthPrefix(y, m);

      const byDate = {};
      for (const d of state.duties) {
        if (!d.date.startsWith(monthPrefix)) continue;
        const soldier = getSoldierById(d.soldierId);
        if (!soldier) continue;
        if (ui.scheduleSquadFilter !== 'all' && soldier.squadId !== ui.scheduleSquadFilter) continue;
        if (!byDate[d.date]) byDate[d.date] = [];
        byDate[d.date].push({ duty: d, soldier });
      }

      let cells = '';
      for (let i = 0; i < offset; i++) cells += `<div></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = `${monthPrefix}-${String(day).padStart(2, '0')}`;
        const items = byDate[iso] || [];
        const isToday = iso === todayISO;
        const isSelected = iso === ui.selectedDate;

        const dots = items.slice(0, 5).map(item => {
          const sq = getSquadById(item.soldier.squadId);
          return `<span class="cal-dot" style="background:${sq.color}"></span>`;
        }).join('');

        cells += `
          <button class="cal-cell ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" onclick="selectCalendarDate('${iso}')">
            <span class="cal-day-num">${day}</span>
            <div class="cal-dots">${dots}${items.length > 5 ? '<span style="font-size:9px;color:#8b99a8;line-height:6px">+</span>' : ''}</div>
          </button>
        `;
      }

      const dayDuties = state.duties.filter(d => {
        if (d.date !== ui.selectedDate) return false;
        const s = getSoldierById(d.soldierId);
        if (!s) return false;
        if (ui.scheduleSquadFilter !== 'all' && s.squadId !== ui.scheduleSquadFilter) return false;
        return true;
      });

      const dayListHtml = dayDuties.length === 0
        ? `<div class="empty-state">На ${formatDateHuman(ui.selectedDate)} нарядів не призначено.</div>`
        : `<div class="stack">
            ${dayDuties.map(d => {
              const s = getSoldierById(d.soldierId);
              const sq = getSquadById(s.squadId);
              const dt = getDutyTypeById(d.dutyTypeId);
              const isKG = isGroupCmdSquad(sq);
              return `
                <div class="soldier-row" style="--sq-color:${sq.color}; border-radius:10px; border:1px solid var(--border); border-left:4px solid ${sq.color};">
                  <div class="soldier-info">
                    <div class="soldier-name-line">
                      <span class="badge" style="background:${sq.color}22; color:${sq.color}; border-color:${sq.color}55">${esc(dt.name)}</span>
                      <span class="soldier-name">${esc(s.name)}</span>
                      ${isKG ? `<span class="badge badge-kg">★ КГ</span>` : (s.isCommander ? `<span class="badge badge-kv">★ КВ</span>` : '')}
                    </div>
                    <div class="soldier-meta">
                      <span>${esc(sq.name)}</span>
                      ${s.rank ? `<span>• ${esc(s.rank)}</span>` : ''}
                    </div>
                  </div>
                  <button class="btn-icon danger" onclick="removeDuty('${d.id}')" title="Видалити наряд">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                  </button>
                </div>
              `;
            }).join('')}
          </div>`;

      return `
        ${renderMonthBar(true)}
        ${renderSquadPills(ui.scheduleSquadFilter, 'setScheduleSquadFilter')}

        <div class="card">
          <div class="cal-weekdays">
            ${WEEKDAYS_UK.map((w, i) => `<div class="${i >= 5 ? 'wknd' : ''}">${w}</div>`).join('')}
          </div>
          <div class="cal-grid">${cells}</div>
        </div>

        <div class="card stack">
          <div class="row-between">
            <div>
              <div style="font-size:15px;font-weight:700;color:#fff">${formatDateHuman(ui.selectedDate)}</div>
              <div class="text-xs text-muted">Призначено нарядів: ${dayDuties.length}</div>
            </div>
            <button class="btn btn-sm btn-primary" onclick="openAssignDutyModal('${ui.selectedDate}')">+ Призначити наряд</button>
          </div>
          ${dayListHtml}
          ${dayDuties.length > 0 ? `
            <button class="btn btn-secondary btn-full" onclick="copyDayDuties('${ui.selectedDate}')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>Скопіювати наряд на день</span>
            </button>
          ` : ''}
        </div>
      `;
    }

    function copyDayDuties(isoDate) {
      const dayDuties = state.duties.filter(d => {
        if (d.date !== isoDate) return false;
        const s = getSoldierById(d.soldierId);
        if (!s) return false;
        if (ui.scheduleSquadFilter !== 'all' && s.squadId !== ui.scheduleSquadFilter) return false;
        return true;
      });
      if (!dayDuties.length) return;

      const lines = [`Наряд на ${formatDateHuman(isoDate)}:`];
      dayDuties.forEach((d, idx) => {
        const s = getSoldierById(d.soldierId);
        const sq = getSquadById(s.squadId);
        const dt = getDutyTypeById(d.dutyTypeId);
        lines.push(`${idx + 1}. ${dt.name} — ${s.name}${s.rank ? ' (' + s.rank + ')' : ''} [${getSquadTabLabel(sq)}]`);
      });
      copyToClipboard(lines.join('\n'), 'Наряд на день скопійовано');
    }

    function removeDuty(id, reopenSoldierId = null) {
      state.duties = state.duties.filter(d => d.id !== id);
      saveState();
      render();
      if (reopenSoldierId) openSoldierHistoryModal(reopenSoldierId);
      showToast('Запис наряду видалено');
    }

    function openAssignDutyModal(isoDate) {
      if (state.soldiers.length === 0) {
        showToast('Спочатку додайте бійців у вкладці «Склад»', 'error');
        return;
      }
      assignModal.date = isoDate;
      assignModal.dutyTypeId = state.dutyTypes[0]?.id || '';
      renderAssignDutyModal();
    }

    function setAssignDutyType(id) {
      assignModal.dutyTypeId = id;
      renderAssignDutyModal();
    }

    function renderAssignDutyModal() {
      const [y, m] = assignModal.date.split('-').map(Number);
      const targetYear = y;
      const targetMonth = m - 1;
      const yesterdayISO = addDaysISO(assignModal.date, -1);

      const busyTodaySet = new Set(state.duties.filter(d => d.date === assignModal.date).map(d => d.soldierId));
      const busyYestSet = new Set(state.duties.filter(d => d.date === yesterdayISO).map(d => d.soldierId));

      const enriched = state.soldiers.map(s => {
        const stats = getSoldierStats(s.id, targetYear, targetMonth, yesterdayISO);
        const isToday = busyTodaySet.has(s.id);
        const isYesterday = busyYestSet.has(s.id);
        const restDays = stats.lastDate ? diffDaysISO(assignModal.date, stats.lastDate) : 99999;
        return { ...s, stats, isToday, isYesterday, restDays };
      });

      const eligible = enriched.filter(c => normalizeSoldierStatus(c.status) === 'active' && !c.isToday && !c.isYesterday);
      const bestMonthCount = eligible.length ? Math.min(...eligible.map(c => c.stats.monthCount)) : -1;

      // Групування та сортування по відділеннях: Командир групи → 1-ше → 2-ге → 3-тє (КВ зверху)
      const orderedSquads = getOrderedSquads();
      const groupsHtml = orderedSquads.map(sq => {
        const isKG = isGroupCmdSquad(sq);
        const members = enriched
          .filter(s => s.squadId === sq.id)
          .sort((a, b) => {
            if (!isKG) {
              if (a.isCommander && !b.isCommander) return -1;
              if (!a.isCommander && b.isCommander) return 1;
            }
            const aActive = normalizeSoldierStatus(a.status) === 'active';
            const bActive = normalizeSoldierStatus(b.status) === 'active';
            if (aActive !== bActive) return aActive ? -1 : 1;
            if (a.isToday !== b.isToday) return a.isToday ? 1 : -1;
            if (a.isYesterday !== b.isYesterday) return a.isYesterday ? 1 : -1;
            if (a.stats.monthCount !== b.stats.monthCount) return a.stats.monthCount - b.stats.monthCount;
            if (a.restDays !== b.restDays) return b.restDays - a.restDays;
            return a.name.localeCompare(b.name, 'uk');
          });

        if (members.length === 0) return '';

        const rows = members.map(c => {
          const stObj = getStatusObj(c.status);
          const isActive = stObj.id === 'active';
          const isRec = isActive && !c.isToday && !c.isYesterday && c.stats.monthCount === bestMonthCount;

          return `
            <button class="soldier-row ${c.isCommander || isKG ? 'is-kv' : ''}" onclick="confirmAssignDuty('${c.id}')" style="--sq-color:${sq.color}; width:100%; text-align:left; border-radius:10px; border:1px solid ${isRec ? 'rgba(16,185,129,0.45)' : 'var(--border)'}; border-left:4px solid ${sq.color}; opacity:${!isActive ? '0.6' : '1'}">
              <div class="soldier-info">
                <div class="soldier-name-line">
                  <span class="soldier-name">${esc(c.name)}</span>
                  ${isKG ? `<span class="badge badge-kg">★ КГ</span>` : (c.isCommander ? `<span class="badge badge-kv">★ КВ</span>` : '')}
                  ${isRec ? `<span class="badge badge-rec">Рекомендовано</span>` : ''}
                  ${c.isToday ? `<span class="badge badge-warn">Вже сьогодні</span>` : ''}
                  ${!c.isToday && c.isYesterday ? `<span class="badge badge-warn">Був учора</span>` : ''}
                  ${!isActive ? `<span class="badge ${stObj.cls}">${stObj.short}</span>` : ''}
                </div>
                <div class="soldier-meta">
                  ${c.rank ? `<span>${esc(c.rank)} •</span>` : ''}
                  <span>Ост.: ${formatDateShort(c.stats.lastDate)}</span>
                </div>
              </div>
              <div style="text-align:right;flex-shrink:0">
                <div style="font-size:15px;font-weight:800;color:${isRec ? '#4ade80' : '#fff'}">${c.stats.monthCount} <span class="text-xs text-muted" style="font-weight:500">міс</span></div>
                <div class="text-xs text-muted">${c.stats.totalCount} всього</div>
              </div>
            </button>
          `;
        }).join('');

        return `
          <div class="stack" style="gap:6px">
            <div class="row-gap" style="padding:4px 2px 0">
              <span class="pill-dot" style="background:${sq.color}"></span>
              <span class="section-title" style="color:${sq.color}">${esc(sq.name)}</span>
            </div>
            ${rows}
          </div>
        `;
      }).join('');

      openModal(`
        <div class="modal-header">
          <div>
            <div class="modal-title">Призначити наряд</div>
            <div class="text-xs text-muted">${formatDateHuman(assignModal.date)}</div>
          </div>
          <button class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <div class="field-label">1. Оберіть вид наряду:</div>
            <div class="chips-wrap">
              ${state.dutyTypes.map(dt => `
                <button class="btn btn-sm ${assignModal.dutyTypeId === dt.id ? 'btn-primary' : 'btn-secondary'}" onclick="setAssignDutyType('${dt.id}')">
                  ${esc(dt.name)}
                </button>
              `).join('')}
            </div>
          </div>

          <div class="field-label">2. Оберіть військовослужбовця (по відділеннях):</div>
          <div class="stack" style="gap:12px">${groupsHtml}</div>
        </div>
      `);
    }

    function confirmAssignDuty(soldierId) {
      if (!assignModal.dutyTypeId) {
        showToast('Оберіть вид наряду', 'error');
        return;
      }
      state.duties.push({
        id: genId('d'),
        date: assignModal.date,
        soldierId,
        dutyTypeId: assignModal.dutyTypeId
      });
      saveState();
      closeModal();
      render();
      showToast('Наряд призначено');
    }

    // Підвкладка «ОБЛІК»
    function setStatsSquadFilter(id) {
      ui.statsSquadFilter = id;
      render();
    }

    function setStatsSort(val) {
      ui.statsSort = val;
      render();
    }

    function renderStatsView() {
      const y = ui.year;
      const m = ui.month;

      const filtered = state.soldiers
        .filter(s => ui.statsSquadFilter === 'all' || s.squadId === ui.statsSquadFilter)
        .map(s => ({ ...s, stats: getSoldierStats(s.id, y, m) }));

      const totalMonth = filtered.reduce((sum, s) => sum + s.stats.monthCount, 0);
      const totalAllTime = filtered.reduce((sum, s) => sum + s.stats.totalCount, 0);
      const avgPerSoldier = filtered.length > 0 ? (totalMonth / filtered.length).toFixed(1) : '0.0';
      const maxMonth = Math.max(1, ...filtered.map(s => s.stats.monthCount));

      const sortMembers = (arr, isKG) => [...arr].sort((a, b) => {
        if (!isKG) {
          if (a.isCommander && !b.isCommander) return -1;
          if (!a.isCommander && b.isCommander) return 1;
        }
        if (ui.statsSort === 'month_desc') return b.stats.monthCount - a.stats.monthCount || b.stats.totalCount - a.stats.totalCount || a.name.localeCompare(b.name, 'uk');
        if (ui.statsSort === 'month_asc') return a.stats.monthCount - b.stats.monthCount || a.stats.totalCount - b.stats.totalCount || a.name.localeCompare(b.name, 'uk');
        if (ui.statsSort === 'total_desc') return b.stats.totalCount - a.stats.totalCount || b.stats.monthCount - a.stats.monthCount || a.name.localeCompare(b.name, 'uk');
        return a.name.localeCompare(b.name, 'uk');
      });

      const orderedSquads = getOrderedSquads().filter(sq => ui.statsSquadFilter === 'all' || sq.id === ui.statsSquadFilter);

      let listHtml = '';
      if (filtered.length === 0) {
        listHtml = `<div class="card empty-state">Особового складу ще немає. Додайте бійців у вкладці «Склад».</div>`;
      } else {
        listHtml = orderedSquads.map(sq => {
          const isKG = isGroupCmdSquad(sq);
          const members = sortMembers(filtered.filter(s => s.squadId === sq.id), isKG);
          if (members.length === 0) return '';
          return `
            <div class="card-flush">
              <div class="card-header" style="border-left:4px solid ${sq.color}">
                <div class="row-gap">
                  <span class="pill-dot" style="background:${sq.color}"></span>
                  <span class="section-title">${esc(sq.name)} (${members.length})</span>
                </div>
                <span class="text-xs text-muted">Міс. / Всього</span>
              </div>
              <div>
                ${members.map(s => renderStatsRow(s, sq, maxMonth)).join('')}
              </div>
            </div>
          `;
        }).join('');
      }

      return `
        ${renderMonthBar(false)}

        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-val">${totalMonth}</div>
            <div class="kpi-label">За місяць</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-val" style="color:#60a5fa">${avgPerSoldier}</div>
            <div class="kpi-label">Середнє / боєць</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-val" style="color:#4ade80">${totalAllTime}</div>
            <div class="kpi-label">За весь час</div>
          </div>
        </div>

        ${renderSquadPills(ui.statsSquadFilter, 'setStatsSquadFilter')}

        <div class="row-between">
          <span class="text-xs text-muted" style="font-weight:600">Всередині відділення:</span>
          <select class="select" style="width:auto;min-height:38px;padding:6px 10px;font-size:13px" onchange="setStatsSort(this.value)">
            <option value="month_desc" ${ui.statsSort === 'month_desc' ? 'selected' : ''}>За місяць (більше → менше)</option>
            <option value="month_asc" ${ui.statsSort === 'month_asc' ? 'selected' : ''}>За місяць (менше → більше)</option>
            <option value="total_desc" ${ui.statsSort === 'total_desc' ? 'selected' : ''}>За весь час</option>
            <option value="alpha" ${ui.statsSort === 'alpha' ? 'selected' : ''}>За алфавітом</option>
          </select>
        </div>

        <div class="stack">${listHtml}</div>
      `;
    }

    function renderStatsRow(s, sq, maxMonth) {
      const pct = Math.round((s.stats.monthCount / maxMonth) * 100);
      const st = getStatusObj(s.status);
      const isKG = isGroupCmdSquad(sq);
      return `
        <button class="soldier-row ${s.isCommander || isKG ? 'is-kv' : ''}" onclick="openSoldierHistoryModal('${s.id}')" style="--sq-color:${sq.color}; width:100%; text-align:left;">
          <div class="soldier-info">
            <div class="soldier-name-line">
              <span class="pill-dot" style="background:${sq.color}"></span>
              <span class="soldier-name">${esc(s.name)}</span>
              ${isKG ? `<span class="badge badge-kg">★ КГ</span>` : (s.isCommander ? `<span class="badge badge-kv">★ КВ</span>` : '')}
              ${st.id !== 'active' ? `<span class="badge ${st.cls}">${st.short}</span>` : ''}
            </div>
            <div class="soldier-meta">
              <span>Останній: ${formatDateShort(s.stats.lastDate)}</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%; background:${sq.color}"></div>
            </div>
          </div>
          <div class="row-gap" style="flex-shrink:0">
            <div style="text-align:right">
              <div style="font-size:16px;font-weight:800;color:#fff;line-height:1">${s.stats.monthCount}</div>
              <div class="text-xs text-muted">міс.</div>
            </div>
            <div style="width:1px;height:26px;background:var(--border)"></div>
            <div style="text-align:right;min-width:34px">
              <div style="font-size:14px;font-weight:700;color:#4ade80;line-height:1">${s.stats.totalCount}</div>
              <div class="text-xs text-muted">всього</div>
            </div>
          </div>
        </button>
      `;
    }

    function openSoldierHistoryModal(soldierId) {
      const s = getSoldierById(soldierId);
      if (!s) return;
      const sq = getSquadById(s.squadId);
      const stats = getSoldierStats(s.id, ui.year, ui.month);
      const history = state.duties
        .filter(d => d.soldierId === s.id)
        .sort((a, b) => b.date.localeCompare(a.date));

      openModal(`
        <div class="modal-header">
          <div>
            <div class="modal-title">${esc(s.name)} ${s.isCommander ? '★' : ''}</div>
            <div class="text-xs text-muted">${esc(sq.name)}${s.rank ? ' • ' + esc(s.rank) : ''}</div>
          </div>
          <button class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="grid-2">
            <div class="kpi-card">
              <div class="kpi-val">${stats.monthCount}</div>
              <div class="kpi-label">${MONTHS_UK[ui.month]} ${ui.year}</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-val" style="color:#4ade80">${stats.totalCount}</div>
              <div class="kpi-label">За весь час</div>
            </div>
          </div>

          <div class="field-label">Історія нарядів (${history.length}):</div>
          ${history.length === 0
            ? `<div class="empty-state">Записів про наряди ще немає.</div>`
            : `<div class="stack">
                ${history.map(d => {
                  const dt = getDutyTypeById(d.dutyTypeId);
                  return `
                    <div class="row-between" style="padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--border)">
                      <div>
                        <div class="text-sm" style="font-weight:600;color:#fff">${formatDateHuman(d.date)}</div>
                        <span class="badge" style="margin-top:4px;background:${sq.color}22;color:${sq.color};border-color:${sq.color}55">${esc(dt.name)}</span>
                      </div>
                      <button class="btn-icon danger" onclick="removeDuty('${d.id}', '${s.id}')" title="Видалити запис">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                      </button>
                    </div>
                  `;
                }).join('')}
              </div>`
          }
        </div>
      `);
    }

    // =========================================================================
    // ВКЛАДКА 2: ЗАДАЧІ
    // =========================================================================
    function setTasksTargetFilter(val) {
      ui.tasksTargetFilter = val;
      render();
    }

    function setTasksStatusFilter(val) {
      ui.tasksStatusFilter = val;
      render();
    }

    function getFilteredTasks() {
      return state.tasks.filter(t => {
        if (ui.tasksTargetFilter !== 'all') {
          const matchesSquad = t.targetType === 'squad' && t.targetSquadId === ui.tasksTargetFilter;
          const isAllCmd = t.targetType === 'all_commanders';
          if (!matchesSquad && !isAllCmd) return false;
        }
        if (ui.tasksStatusFilter === 'active' && t.status !== 'received') return false;
        if (ui.tasksStatusFilter === 'done' && t.status !== 'done') return false;
        if (ui.tasksStatusFilter === 'failed' && t.status !== 'failed') return false;
        return true;
      });
    }

    function getTaskTargetDisplay(task) {
      if (task.targetType === 'all_commanders') {
        return { label: 'Усім командирам відділень', color: '#a855f7', kvName: '' };
      }
      const sq = getSquadById(task.targetSquadId);
      const kv = getSquadCommander(task.targetSquadId);
      return {
        label: formatCommanderTargetLabel(sq),
        color: sq.color,
        kvName: kv ? kv.name : ''
      };
    }

    function renderTasksTab() {
      const targetPills = renderSquadPills(ui.tasksTargetFilter, 'setTasksTargetFilter', true);

      const statusPills = `
        <div class="pills-row">
          <button class="pill-btn ${ui.tasksStatusFilter === 'all' ? 'active' : ''}" style="--pill-color:#e8eef5" onclick="setTasksStatusFilter('all')">Усі</button>
          <button class="pill-btn ${ui.tasksStatusFilter === 'active' ? 'active' : ''}" style="--pill-color:#3b82f6" onclick="setTasksStatusFilter('active')">Активні</button>
          <button class="pill-btn ${ui.tasksStatusFilter === 'done' ? 'active' : ''}" style="--pill-color:#10b981" onclick="setTasksStatusFilter('done')">Виконані</button>
          <button class="pill-btn ${ui.tasksStatusFilter === 'failed' ? 'active' : ''}" style="--pill-color:#ef4444" onclick="setTasksStatusFilter('failed')">Не виконано</button>
        </div>
      `;

      const filteredTasks = getFilteredTasks();

      const tasksHtml = filteredTasks.length === 0
        ? `<div class="card empty-state">Задач немає. Натисніть «+ Нова задача», щоб додати задачу.</div>`
        : filteredTasks.map(t => {
            const target = getTaskTargetDisplay(t);
            const isNoteOpen = Boolean(ui.openNotes[t.id]);
            const hasNote = Boolean(t.note && t.note.trim());

            return `
              <div class="task-card status-${t.status}" style="--sq-color:${target.color}">
                <div class="task-top">
                  <div>
                    <span class="badge" style="background:${target.color}22; color:${target.color}; border-color:${target.color}55; white-space:normal; line-height:1.25">
                      ${esc(target.label)}
                    </span>
                    ${target.kvName ? `<div class="text-xs text-muted" style="margin-top:3px">КВ: ${esc(target.kvName)}</div>` : ''}
                  </div>
                  <div class="row-gap" style="flex-shrink:0">
                    <button class="btn-icon" style="width:34px;height:34px" onclick="openTaskModal('${t.id}')" title="Редагувати">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                    <button class="btn-icon danger" style="width:34px;height:34px" onclick="promptDeleteTask('${t.id}')" title="Видалити">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                  </div>
                </div>

                <div class="task-text">${esc(t.text)}</div>

                <div class="task-meta">
                  <span>Поставив: <strong style="color:#fff">${esc(t.issuer || 'Не вказано')}</strong></span>
                  <span>• ${esc(t.createdAt || '')}</span>
                  ${t.deadline ? `<span>• Термін: <strong style="color:#fbbf24">${formatDeadline(t.deadline)}</strong></span>` : ''}
                </div>

                <div class="task-status-grid">
                  <button class="status-tap-btn ${t.status === 'received' ? 'active-received' : ''}" onclick="setTaskStatus('${t.id}', 'received')">Отримав задачу</button>
                  <button class="status-tap-btn ${t.status === 'done' ? 'active-done' : ''}" onclick="setTaskStatus('${t.id}', 'done')">Виконано</button>
                  <button class="status-tap-btn ${t.status === 'failed' ? 'active-failed' : ''}" onclick="setTaskStatus('${t.id}', 'failed')">Не виконано</button>
                </div>

                <div>
                  <button class="note-toggle-btn ${hasNote ? 'has-note' : ''}" onclick="toggleTaskNote('${t.id}')">
                    <span>${hasNote ? '● Зауваження (є запис)' : 'Зауваження'}</span>
                    <span>${isNoteOpen ? '▲' : '▼'}</span>
                  </button>
                  ${isNoteOpen ? `
                    <div class="note-box" style="margin-top:6px">
                      <textarea id="note-input-${t.id}" class="textarea" style="min-height:68px" placeholder="Вкажіть причину невиконання або коментар...">${esc(t.note || '')}</textarea>
                      <div class="row-between">
                        <span class="text-xs text-muted">${t.status === 'failed' ? 'Вкажіть причину невиконання' : 'Коментар до задачі'}</span>
                        <button class="btn btn-sm btn-primary" onclick="saveTaskNote('${t.id}')">Зберегти</button>
                      </div>
                    </div>
                  ` : (hasNote ? `<div class="text-xs" style="margin-top:6px;padding:7px 10px;border-radius:8px;background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.22);color:#fde68a;white-space:pre-wrap">${esc(t.note)}</div>` : '')}
                </div>
              </div>
            `;
          }).join('');

      return `
        <div class="grid-2">
          <button class="btn btn-primary" onclick="openTaskModal()">+ Нова задача</button>
          <button class="btn btn-secondary" onclick="copyActiveTasks()">Скопіювати активні</button>
        </div>

        ${targetPills}
        ${statusPills}

        <div class="stack">${tasksHtml}</div>
      `;
    }

    function setTaskStatus(taskId, status) {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      t.status = status;
      if (status === 'failed') ui.openNotes[taskId] = true;
      saveState();
      render();
      if (status === 'failed') {
        setTimeout(() => document.getElementById(`note-input-${taskId}`)?.focus(), 60);
      }
    }

    function toggleTaskNote(taskId) {
      ui.openNotes[taskId] = !ui.openNotes[taskId];
      render();
    }

    function saveTaskNote(taskId) {
      const t = state.tasks.find(x => x.id === taskId);
      const input = document.getElementById(`note-input-${taskId}`);
      if (!t || !input) return;
      t.note = input.value.trim();
      ui.openNotes[taskId] = false;
      saveState();
      render();
      showToast('Зауваження збережено');
    }

    function openTaskModal(taskId = null) {
      const existing = taskId ? state.tasks.find(t => t.id === taskId) : null;
      const squadTargets = getOrderedSquads().filter(sq => !isGroupCmdSquad(sq));
      let currentTargetVal = 'all_commanders';
      if (existing) {
        currentTargetVal = existing.targetType === 'squad' ? `squad:${existing.targetSquadId}` : 'all_commanders';
      } else if (ui.tasksTargetFilter !== 'all' && ui.tasksTargetFilter !== GROUP_CMD_SQUAD_ID) {
        currentTargetVal = `squad:${ui.tasksTargetFilter}`;
      } else if (squadTargets.length > 0) {
        currentTargetVal = `squad:${squadTargets[0].id}`;
      }

      const targetOptions = [
        ...squadTargets.map(sq => {
          const kv = getSquadCommander(sq.id);
          const baseLbl = formatCommanderTargetLabel(sq);
          const fullLbl = kv ? `${baseLbl} (${kv.name})` : baseLbl;
          return `<option value="squad:${sq.id}" ${currentTargetVal === 'squad:' + sq.id ? 'selected' : ''}>${esc(fullLbl)}</option>`;
        }),
        `<option value="all_commanders" ${currentTargetVal === 'all_commanders' ? 'selected' : ''}>Усім командирам відділень</option>`
      ].join('');

      const groupCmdSoldier = getGroupCommanderSoldier();

      openModal(`
        <div class="modal-header">
          <div class="modal-title">${existing ? 'Редагувати задачу' : 'Нова задача'}</div>
          <button class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <form class="modal-body" onsubmit="saveTask(event, '${taskId || ''}')">
          <div class="field">
            <label class="field-label" for="task-target">Кому</label>
            <select id="task-target" class="select">${targetOptions}</select>
          </div>

          <div class="field">
            <label class="field-label" for="task-issuer">Хто поставив</label>
            <input id="task-issuer" class="input" type="text" required value="${esc(existing?.issuer || '')}" placeholder="Введіть вручну..." />
            ${groupCmdSoldier ? `
              <div class="chips-wrap" style="margin-top:2px">
                <button type="button" class="btn btn-sm btn-secondary" onclick="document.getElementById('task-issuer').value = '${esc(groupCmdSoldier.name)}'">
                  ★ КГ: ${esc(groupCmdSoldier.name)}
                </button>
              </div>
            ` : ''}
          </div>

          <div class="field">
            <label class="field-label" for="task-text">Суть задачі</label>
            <textarea id="task-text" class="textarea" required placeholder="Опишіть задачу...">${esc(existing?.text || '')}</textarea>
          </div>

          <div class="field">
            <label class="field-label" for="task-deadline">Термін виконання (необов'язково)</label>
            <input id="task-deadline" class="input" type="datetime-local" value="${esc(existing?.deadline || '')}" />
          </div>

          <button type="submit" class="btn btn-primary btn-full">${existing ? 'Зберегти зміни' : 'Поставити задачу'}</button>
        </form>
      `);
      setTimeout(() => document.getElementById('task-issuer')?.focus(), 60);
    }

    function saveTask(e, taskId) {
      e.preventDefault();
      const targetVal = document.getElementById('task-target').value;
      const issuer = document.getElementById('task-issuer').value.trim();
      const text = document.getElementById('task-text').value.trim();
      const deadline = document.getElementById('task-deadline').value;
      if (!text || !issuer) return;

      let targetType = 'all_commanders';
      let targetSquadId = null;
      if (targetVal.startsWith('squad:')) {
        targetType = 'squad';
        targetSquadId = targetVal.slice(6);
      }

      if (taskId) {
        const t = state.tasks.find(x => x.id === taskId);
        if (t) {
          t.targetType = targetType;
          t.targetSquadId = targetSquadId;
          t.text = text;
          t.issuer = issuer;
          t.deadline = deadline;
        }
      } else {
        state.tasks.unshift({
          id: genId('t'),
          targetType,
          targetSquadId,
          text,
          issuer,
          deadline,
          status: 'received',
          note: '',
          createdAt: toDateTimeHuman(new Date())
        });
      }
      saveState();
      closeModal();
      render();
      showToast(taskId ? 'Задачу оновлено' : 'Задачу поставлено');
    }

    function promptDeleteTask(taskId) {
      showConfirm(
        'Видалити задачу?',
        'Задача та зауваження до неї будуть видалені.',
        'Видалити',
        () => {
          state.tasks = state.tasks.filter(t => t.id !== taskId);
          saveState();
          render();
          showToast('Задачу видалено');
        }
      );
    }

    function copyActiveTasks() {
      const list = state.tasks.filter(t => {
        if (t.status === 'done') return false;
        if (ui.tasksTargetFilter !== 'all') {
          const matchesSquad = t.targetType === 'squad' && t.targetSquadId === ui.tasksTargetFilter;
          const isAllCmd = t.targetType === 'all_commanders';
          if (!matchesSquad && !isAllCmd) return false;
        }
        return true;
      });
      if (!list.length) {
        showToast('Немає активних задач для копіювання', 'error');
        return;
      }
      const statusMap = { received: 'Отримав задачу', done: 'Виконано', failed: 'Не виконано' };
      const lines = [`Активні задачі (${formatDateShort(toISODate(new Date()))}):`];
      list.forEach((t, i) => {
        const target = getTaskTargetDisplay(t);
        lines.push(`${i + 1}. [${target.label}${target.kvName ? ' — ' + target.kvName : ''}] ${t.text}`);
        lines.push(`   Поставив: ${t.issuer} | Статус: ${statusMap[t.status]}${t.deadline ? ' | Термін: ' + formatDeadline(t.deadline) : ''}`);
        if (t.note) lines.push(`   Зауваження: ${t.note}`);
      });
      copyToClipboard(lines.join('\n'), 'Активні задачі скопійовано');
    }

    // =========================================================================
    // ВКЛАДКА 3: РОЗХІД (КЛЮЧОВЕ ОНОВЛЕННЯ v2.5 — АВТОПІДТЯГУВАННЯ + ПРІЗВИЩА В ДУЖКАХ)
    // =========================================================================
    function ensureRozkhidDay(dateISO) {
      if (!state.rozkhid[dateISO] || typeof state.rozkhid[dateISO] !== 'object') {
        state.rozkhid[dateISO] = { overrides: {}, extra: {} };
      }
      if (!state.rozkhid[dateISO].overrides) state.rozkhid[dateISO].overrides = {};
      if (!state.rozkhid[dateISO].extra) state.rozkhid[dateISO].extra = {};
      return state.rozkhid[dateISO];
    }

    function changeRozkhidDate(delta) {
      ui.rozkhidDate = addDaysISO(ui.rozkhidDate, delta);
      render();
    }

    function setRozkhidToday() {
      ui.rozkhidDate = toISODate(new Date());
      render();
    }

    function updateGroupNumber(val) {
      state.groupNumber = val.trim();
      saveState();
      const previewEl = document.getElementById('rozkhid-preview-box');
      if (previewEl) previewEl.textContent = generateRozkhidText();
    }

    function toggleRozkhidOption(opt, checked) {
      if (opt === 'names') ui.rozkhidIncludeNames = checked;
      if (opt === 'hideZeros') ui.rozkhidHideZeros = checked;
      const previewEl = document.getElementById('rozkhid-preview-box');
      if (previewEl) previewEl.textContent = generateRozkhidText();
    }

    // Ефективний статус бійця на конкретну дату:
    // 1) Ручна правка за день (overrides)
    // 2) Авто: наряд на цю дату -> 'Н'
    // 3) Авто: постійний статус у «Складі» (Ш, Л, Вд, Вп, Г, Пк, Хв)
    // 4) Авто: наряд попередньої доби -> 'Стародобовий'
    // 5) Інакше -> 'Вн'
    function getEffectiveRozkhidStatus(dateISO, soldier, todayDutySet, yestDutySet) {
      const dayData = state.rozkhid[dateISO];
      if (dayData && dayData.overrides && dayData.overrides[soldier.id]) {
        return dayData.overrides[soldier.id];
      }
      if (todayDutySet.has(soldier.id)) return 'Н';
      const perm = normalizeSoldierStatus(soldier.status);
      if (PERMANENT_ABSENT_CODES.has(perm)) return perm;
      if (yestDutySet.has(soldier.id)) return 'Стародобовий';
      return 'Вн';
    }

    // Повний розрахунок розходу за вибрану дату (зі збереженням порядку відділень)
    function computeRozkhidData(dateISO) {
      const yestISO = addDaysISO(dateISO, -1);
      const todayDutySet = new Set(state.duties.filter(d => d.date === dateISO).map(d => d.soldierId));
      const yestDutySet = new Set(state.duties.filter(d => d.date === yestISO).map(d => d.soldierId));
      const dayData = state.rozkhid[dateISO] || { overrides: {}, extra: {} };
      const surnameCounts = getSurnameCountsMap();

      const buckets = {};
      ROZKHID_ABSENT_CATEGORIES.forEach(cat => {
        buckets[cat.code] = { soldiers: [], extra: Number(dayData.extra?.[cat.code] || 0) };
      });

      const orderedSoldiers = [];
      for (const sq of getOrderedSquads()) {
        const members = sortSquadMembers(state.soldiers.filter(s => s.squadId === sq.id));
        orderedSoldiers.push(...members);
      }

      const statusBySoldier = {};
      for (const s of orderedSoldiers) {
        const code = getEffectiveRozkhidStatus(dateISO, s, todayDutySet, yestDutySet);
        statusBySoldier[s.id] = code;
        if (buckets[code]) {
          buckets[code].soldiers.push({
            id: s.id,
            fullName: s.name,
            reportName: formatReportSurname(s, surnameCounts)
          });
        }
      }

      const totalList = state.soldiers.length;
      let totalAbsent = 0;
      const categories = ROZKHID_ABSENT_CATEGORIES.map(cat => {
        const b = buckets[cat.code];
        const count = Math.max(0, b.soldiers.length + b.extra);
        totalAbsent += count;
        return {
          code: cat.code,
          hint: cat.hint,
          soldiers: b.soldiers,
          extra: b.extra,
          count
        };
      });

      const presentCount = Math.max(0, totalList - totalAbsent);
      return { totalList, presentCount, totalAbsent, categories, statusBySoldier };
    }

    // Генерація готового тексту рапорту за точним шаблоном v2.5 (з прізвищами в дужках)
    function generateRozkhidText() {
      const data = computeRozkhidData(ui.rozkhidDate);
      const groupNum = (state.groupNumber || '223').trim() || '223';
      const lines = [
        groupNum,
        `З/с - ${data.totalList}`,
        `Вн - ${data.presentCount}`
      ];

      for (const cat of data.categories) {
        if (ui.rozkhidHideZeros && cat.count === 0) continue;
        let line = `${cat.code} - ${cat.count}`;
        if (ui.rozkhidIncludeNames && cat.count > 0 && cat.soldiers.length > 0) {
          const namesStr = cat.soldiers.map(x => x.reportName).join(', ');
          line += ` (${namesStr})`;
        }
        lines.push(line);
      }

      return lines.join('\n');
    }

    function copyRozkhid() {
      copyToClipboard(generateRozkhidText(), 'Розхід скопійовано у буфер обміну');
    }

    // Коригування кількості кнопками «-» та «+»
    function adjustRozkhidCount(catCode, delta) {
      const dayData = ensureRozkhidDay(ui.rozkhidDate);
      const data = computeRozkhidData(ui.rozkhidDate);
      const cat = data.categories.find(c => c.code === catCode);
      if (!cat) return;

      if (delta > 0) {
        dayData.extra[catCode] = (Number(dayData.extra[catCode] || 0)) + 1;
      } else if (delta < 0) {
        const curExtra = Number(dayData.extra[catCode] || 0);
        if (curExtra > 0) {
          dayData.extra[catCode] = curExtra - 1;
        } else if (cat.soldiers.length > 0) {
          // Знімаємо останнього бійця з цієї категорії на сьогодні
          const lastSoldier = cat.soldiers[cat.soldiers.length - 1];
          dayData.overrides[lastSoldier.id] = 'Вн';
        }
      }
      saveState();
      render();
    }

    function resetRozkhidDayOverrides() {
      delete state.rozkhid[ui.rozkhidDate];
      saveState();
      render();
      showToast('Відновлено автоматичний розрахунок з нарядів та складу');
    }

    // Модальне вікно «ПІБ» для поіменного вибору бійців (згруповано по відділеннях)
    function openRozkhidCategoryModal(catCode) {
      const catMeta = ROZKHID_ABSENT_CATEGORIES.find(x => x.code === catCode) || { code: catCode, hint: '' };
      const dateISO = ui.rozkhidDate;
      const data = computeRozkhidData(dateISO);
      const orderedSquads = getOrderedSquads();

      const groupsHtml = orderedSquads.map(sq => {
        const isKG = isGroupCmdSquad(sq);
        const members = sortSquadMembers(state.soldiers.filter(s => s.squadId === sq.id));
        if (members.length === 0) return '';

        const rows = members.map(s => {
          const curStatus = data.statusBySoldier[s.id] || 'Вн';
          const isChecked = curStatus === catCode;
          return `
            <label class="checkbox-card" style="border-left:4px solid ${sq.color}; padding:9px 11px;">
              <div class="soldier-info">
                <div class="soldier-name-line">
                  <span class="soldier-name">${esc(s.name)}</span>
                  ${isKG ? `<span class="badge badge-kg">★ КГ</span>` : (s.isCommander ? `<span class="badge badge-kv">★ КВ</span>` : '')}
                </div>
                <div class="soldier-meta">
                  <span>Статус: <strong style="color:${curStatus === 'Вн' ? '#34d399' : '#fbbf24'}">${esc(curStatus)}</strong></span>
                </div>
              </div>
              <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleSoldierInRozkhidCategory('${s.id}', '${esc(catCode)}', this.checked)" />
            </label>
          `;
        }).join('');

        return `
          <div class="stack" style="gap:6px">
            <div class="row-gap" style="padding:4px 2px 0">
              <span class="pill-dot" style="background:${sq.color}"></span>
              <span class="section-title" style="color:${sq.color}">${esc(sq.name)}</span>
            </div>
            ${rows}
          </div>
        `;
      }).join('');

      openModal(`
        <div class="modal-header">
          <div>
            <div class="modal-title">${esc(catMeta.code)}</div>
            <div class="text-xs text-muted">${formatDateHuman(dateISO)} • Поіменний вибір по відділеннях</div>
          </div>
          <button class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          ${state.soldiers.length === 0
            ? `<div class="empty-state">Немає особового складу. Додайте бійців у розділі «Склад».</div>`
            : `<div class="stack" style="gap:12px">${groupsHtml}</div>`
          }
          <button class="btn btn-primary btn-full" onclick="closeModal()">Готово</button>
        </div>
      `);
    }

    function toggleSoldierInRozkhidCategory(soldierId, catCode, checked) {
      const dayData = ensureRozkhidDay(ui.rozkhidDate);
      if (checked) {
        dayData.overrides[soldierId] = catCode;
      } else {
        dayData.overrides[soldierId] = 'Вн';
      }
      saveState();
      render();
      openRozkhidCategoryModal(catCode);
    }

    function renderRozkhidTab() {
      const data = computeRozkhidData(ui.rozkhidDate);
      const previewText = generateRozkhidText();
      const hasManualEdits = Boolean(
        state.rozkhid[ui.rozkhidDate] &&
        (Object.keys(state.rozkhid[ui.rozkhidDate].overrides || {}).length > 0 ||
         Object.values(state.rozkhid[ui.rozkhidDate].extra || {}).some(v => v > 0))
      );

      const categoriesHtml = data.categories.map(cat => {
        const namesPreview = cat.soldiers.map(x => x.reportName).join(', ');
        return `
          <div class="rozkhid-cat-row ${cat.count > 0 ? 'has-val' : ''}">
            <div style="min-width:0;flex:1">
              <div class="text-sm" style="font-weight:700;color:${cat.count > 0 ? '#fbbf24' : '#fff'}">${esc(cat.code)}</div>
              <div class="text-xs text-muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                ${namesPreview ? esc(namesPreview) : esc(cat.hint)}
              </div>
            </div>
            <div class="stepper">
              <button class="step-btn" onclick="adjustRozkhidCount('${esc(cat.code)}', -1)" aria-label="Зменшити">−</button>
              <span class="step-val" style="color:${cat.count > 0 ? '#fbbf24' : 'var(--muted)'}">${cat.count}</span>
              <button class="step-btn" onclick="adjustRozkhidCount('${esc(cat.code)}', 1)" aria-label="Збільшити">+</button>
              <button class="btn btn-sm btn-secondary" style="margin-left:4px;min-height:34px;padding:4px 9px" onclick="openRozkhidCategoryModal('${esc(cat.code)}')">ПІБ</button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <!-- Вибір дати розходу -->
        <div class="date-bar">
          <button class="btn-icon" onclick="changeRozkhidDate(-1)" aria-label="Попередній день">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="date-bar-title">${formatDateHuman(ui.rozkhidDate)}</div>
          <button class="btn btn-sm btn-secondary" onclick="setRozkhidToday()">Сьогодні</button>
          <button class="btn-icon" onclick="changeRozkhidDate(1)" aria-label="Наступний день">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>

        <!-- Номер групи та зведення З/с і Вн -->
        <div class="card stack">
          <div class="row-between">
            <label for="rozkhid-group-input" class="field-label" style="white-space:nowrap">Номер групи:</label>
            <input id="rozkhid-group-input" class="input" style="max-width:150px;min-height:40px;padding:7px 11px;text-align:center;font-weight:800" type="text" value="${esc(state.groupNumber)}" placeholder="223" oninput="updateGroupNumber(this.value)" />
          </div>
          <div class="kpi-grid-2">
            <div class="kpi-card" style="background:var(--bg)">
              <div class="kpi-val">${data.totalList}</div>
              <div class="kpi-label">З/с (За списком)</div>
            </div>
            <div class="kpi-card" style="background:var(--bg)">
              <div class="kpi-val" style="color:#4ade80">${data.presentCount}</div>
              <div class="kpi-label">Вн (Відсутні: ${data.totalAbsent})</div>
            </div>
          </div>
        </div>

        <!-- Позиції відсутності (автопідтягування + ручні лічильники + вибір ПІБ) -->
        <div class="card stack">
          <div class="row-between">
            <span class="section-title" style="color:var(--muted)">Розподіл відсутніх</span>
            ${hasManualEdits ? `<button class="btn btn-sm btn-secondary" onclick="resetRozkhidDayOverrides()">Авто-синхр.</button>` : `<span class="text-xs text-muted">Авто з нарядів і складу</span>`}
          </div>
          <div class="stack" style="gap:6px">${categoriesHtml}</div>
        </div>

        <!-- Попередній перегляд рапорту та копіювання -->
        <div class="card stack" style="border-color:rgba(94,150,77,0.45)">
          <span class="section-title" style="color:#4ade80">Рапорт для месенджера</span>
          <div class="grid-2">
            <label class="toggle-pill">
              <input type="checkbox" ${ui.rozkhidIncludeNames ? 'checked' : ''} onchange="toggleRozkhidOption('names', this.checked)" />
              <span>Прізвища в дужках</span>
            </label>
            <label class="toggle-pill">
              <input type="checkbox" ${ui.rozkhidHideZeros ? 'checked' : ''} onchange="toggleRozkhidOption('hideZeros', this.checked)" />
              <span>Приховати нулі</span>
            </label>
          </div>
          <pre id="rozkhid-preview-box" class="rozkhid-preview">${esc(previewText)}</pre>
          <button class="btn btn-primary btn-full" onclick="copyRozkhid()">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span>Скопіювати розхід</span>
          </button>
        </div>
      `;
    }

    // =========================================================================
    // ВКЛАДКА 4: СКЛАД (КОМАНДИР ГРУПИ ПЕРШИЙ + ВІДДІЛЕННЯ + АКОРДЕОН ПРІЗВИЩ)
    // =========================================================================
    function setPersonnelSquadFilter(id) {
      ui.personnelSquadFilter = id;
      if (id !== 'all') ui.expandedPersonnelSquads[id] = true;
      render();
    }

    function togglePersonnelSquad(squadId) {
      ui.expandedPersonnelSquads[squadId] = !ui.expandedPersonnelSquads[squadId];
      render();
    }

    function toggleSoldierCard(soldierId) {
      ui.expandedSoldiers[soldierId] = !ui.expandedSoldiers[soldierId];
      render();
    }

    function quickSetSoldierStatus(soldierId, newStatus) {
      const s = getSoldierById(soldierId);
      if (!s) return;
      s.status = newStatus;
      saveState();
      render();
      const st = getStatusObj(newStatus);
      showToast(`${s.name}: ${st.label}`);
    }

    function toggleAllPersonnelSquads() {
      const ordered = getOrderedSquads();
      const allOpen = ordered.length > 0 && ordered.every(sq => ui.expandedPersonnelSquads[sq.id]);
      ordered.forEach(sq => { ui.expandedPersonnelSquads[sq.id] = !allOpen; });
      render();
    }

    function onPersonnelSearchInput(val) {
      ui.personnelSearch = val;
      const container = document.getElementById('personnel-list-container');
      if (container) container.innerHTML = buildPersonnelAccordionHtml();
      const clearBtn = document.getElementById('personnel-search-clear');
      if (clearBtn) clearBtn.classList.toggle('hidden', !val);
    }

    function clearPersonnelSearch() {
      ui.personnelSearch = '';
      render();
    }

    function renderPersonnelTab() {
      const ordered = getOrderedSquads();
      const allOpen = ordered.length > 0 && ordered.every(sq => ui.expandedPersonnelSquads[sq.id]);

      const filterPills = `
        <div class="pills-row">
          <button class="pill-btn ${ui.personnelSquadFilter === 'all' ? 'active' : ''}" style="--pill-color:#4ade80" onclick="setPersonnelSquadFilter('all')">
            <span>Всі</span>
            <span class="pill-count">${state.soldiers.length}</span>
          </button>
          ${ordered.map(sq => {
            const cnt = state.soldiers.filter(s => s.squadId === sq.id).length;
            return `
              <button class="pill-btn ${ui.personnelSquadFilter === sq.id ? 'active' : ''}" style="--pill-color:${sq.color}" onclick="setPersonnelSquadFilter('${sq.id}')">
                <span class="pill-dot" style="background:${sq.color}"></span>
                <span>${esc(getSquadTabLabel(sq))}</span>
                <span class="pill-count">${cnt}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;

      return `
        ${filterPills}

        <div class="row-gap">
          <div class="search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="personnel-search-input" class="input" type="text" value="${esc(ui.personnelSearch)}" placeholder="Пошук по ПІБ..." oninput="onPersonnelSearchInput(this.value)" />
            <button id="personnel-search-clear" class="search-clear ${ui.personnelSearch ? '' : 'hidden'}" onclick="clearPersonnelSearch()" aria-label="Очистити">✕</button>
          </div>
          <button class="btn btn-sm btn-secondary" style="flex-shrink:0;min-height:44px" onclick="toggleAllPersonnelSquads()">
            ${allOpen ? 'Згорнути всі' : 'Розгорнути всі'}
          </button>
        </div>

        <div class="text-xs text-muted" style="padding:0 2px">
          Всього у складі: <strong style="color:#fff">${state.soldiers.length}</strong> • Натисніть на відділення або прізвище, щоб розгорнути
        </div>

        <div id="personnel-list-container" class="stack">
          ${buildPersonnelAccordionHtml()}
        </div>

        <button class="btn btn-secondary btn-full" onclick="openSquadModal()">+ Додати нове відділення</button>
      `;
    }

    function buildPersonnelAccordionHtml() {
      const ordered = getOrderedSquads().filter(sq => ui.personnelSquadFilter === 'all' || sq.id === ui.personnelSquadFilter);
      if (ordered.length === 0) {
        return `<div class="card empty-state">Немає відділень. Натисніть кнопку нижче, щоб створити відділення.</div>`;
      }

      const query = ui.personnelSearch.trim().toLowerCase();
      let totalShown = 0;

      const html = ordered.map(sq => {
        const isKG = isGroupCmdSquad(sq);
        const allMembers = state.soldiers.filter(s => s.squadId === sq.id);
        const filteredMembers = sortSquadMembers(
          allMembers.filter(s => !query || s.name.toLowerCase().includes(query) || (s.rank && s.rank.toLowerCase().includes(query)))
        );

        if (query && filteredMembers.length === 0) return '';
        totalShown += filteredMembers.length;

        const isOpen = query ? true : (ui.personnelSquadFilter === sq.id ? true : Boolean(ui.expandedPersonnelSquads[sq.id]));

        return `
          <div class="card-flush">
            <div class="accordion-header ${isOpen ? 'open' : ''}" style="border-left:4px solid ${sq.color}; ${isKG ? 'background:linear-gradient(90deg, rgba(234,179,8,0.14) 0%, rgba(13,18,23,0.75) 75%);' : ''}" onclick="togglePersonnelSquad('${sq.id}')">

    function openSoldierModal(soldierId = null, preselectedSquadId = null) {

    function saveSoldier(e, soldierId) {
      e.preventDefault();
      const name = formatFullName(document.getElementById('s-name').value);
      const rank = document.getElementById('s-rank').value.trim();
      const squadId = document.getElementById('s-squad').value;
      const isKG = squadId === GROUP_CMD_SQUAD_ID;
      const isCommander = isKG ? true : document.getElementById('s-kv').checked;
      const status = document.getElementById('s-status').value;
      if (!name) return;

      if (isCommander) {
        state.soldiers.forEach(s => {
          if (s.squadId === squadId && s.id !== soldierId) s.isCommander = false;
        });
      }

      if (soldierId) {
        const s = state.soldiers.find(x => x.id === soldierId);
        if (s) {
          s.name = name;
          s.rank = rank;
          s.squadId = squadId;
          s.isCommander = isCommander;
          s.status = status;
        }
      } else {
        state.soldiers.push({ id: genId('s'), name, rank, squadId, isCommander, status });
        ui.expandedPersonnelSquads[squadId] = true;
      }
      saveState();
      closeModal();
      render();
      showToast(soldierId ? 'Дані оновлено' : 'Додано до складу');
    }

    function promptDeleteSoldier(soldierId) {
      const s = getSoldierById(soldierId);
      if (!s) return;
      showConfirm(
        `Видалити ${s.name}?`,
        'Військовослужбовець та всі записи про його наряди й розхід будуть видалені.',
        'Видалити',
        () => {
          state.soldiers = state.soldiers.filter(x => x.id !== soldierId);
          state.duties = state.duties.filter(d => d.soldierId !== soldierId);
          Object.keys(state.rozkhid).forEach(dt => {
            if (state.rozkhid[dt]?.overrides) delete state.rozkhid[dt].overrides[soldierId];
          });
          saveState();
          render();
          showToast('Бійця видалено');
        }
      );
    }

    function openSquadModal(squadId = null) {

            <div class="color-palette" id="squad-color-palette">
              ${SQUAD_PALETTE.map(c => `

      btn.classList.add('selected');

    function saveSquad(e, squadId) {
      e.preventDefault();
      const name = document.getElementById('squad-name-input').value.trim();
      if (!name) return;
      if (squadId) {
        const sq = state.squads.find(x => x.id === squadId);
        if (sq) { sq.name = name; sq.color = tempSquadColor; }
      } else {
        state.squads.push({ id: genId('sq'), name, color: tempSquadColor });
      }
      saveState();
      closeModal();
      render();
      showToast(squadId ? 'Підрозділ оновлено' : 'Відділення додано');
    }

    function promptDeleteSquad(squadId) {
      const sq = getSquadById(squadId);
      const cnt = state.soldiers.filter(s => s.squadId === squadId).length;
      showConfirm(
        `Видалити «${sq.name}»?`,
        cnt > 0
          ? `У цьому відділенні є ${cnt} бійців. Вони та їхні наряди також будуть видалені.`
          : 'Відділення буде видалено зі списку.',
        'Видалити',
        () => {
          const sIds = new Set(state.soldiers.filter(s => s.squadId === squadId).map(s => s.id));
          state.squads = state.squads.filter(s => s.id !== squadId);
          state.soldiers = state.soldiers.filter(s => s.squadId !== squadId);
          state.duties = state.duties.filter(d => !sIds.has(d.soldierId));
          state.tasks = state.tasks.filter(t => !(t.targetType === 'squad' && t.targetSquadId === squadId));
          Object.keys(state.rozkhid).forEach(dt => {
            sIds.forEach(sid => { if (state.rozkhid[dt]?.overrides) delete state.rozkhid[dt].overrides[sid]; });
          });
          if (ui.scheduleSquadFilter === squadId) ui.scheduleSquadFilter = 'all';
          if (ui.statsSquadFilter === squadId) ui.statsSquadFilter = 'all';
          if (ui.tasksTargetFilter === squadId) ui.tasksTargetFilter = 'all';
          if (ui.personnelSquadFilter === squadId) ui.personnelSquadFilter = 'all';
          saveState();
          render();
          showToast('Відділення видалено');
        }
      );
    }

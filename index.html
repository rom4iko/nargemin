<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1015" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Помічник взводу v2.7</title>
  <style>
    /* =========================================================================
       ТЕМНА ТАКТИЧНА ТЕМА ТА БАЗОВІ СТИЛІ
       ========================================================================= */
    :root {
      --bg: #0b1015;
      --bg-elev: #131b24;
      --card: #161f2a;
      --card-hover: #1d2836;
      --border: #263342;
      --border-strong: #35475c;
      --text: #e7eef5;
      --muted: #8b9bb0;
      --olive: #4b7a3d;
      --olive-hover: #3e6632;
      --accent: #4ade80;
      --blue: #38bdf8;
      --amber: #f59e0b;
      --danger: #ef4444;
      --radius: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font-family: inherit; font-size: 14px; color: var(--text); }
    button { cursor: pointer; border: none; background: none; padding: 0; }
    input[type="date"] { color-scheme: dark; }

    /* Контейнер, шапка та навігація */
    .app {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(82px + var(--safe-bottom));
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: calc(10px + var(--safe-top)) 14px 10px;
      background: rgba(11, 16, 21, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(75, 122, 61, 0.22);
      border: 1px solid rgba(74, 222, 128, 0.35);
      color: var(--accent);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .brand-title { font-size: 16px; font-weight: 800; color: #fff; line-height: 1.2; }
    .brand-sub { font-size: 11px; color: var(--muted); line-height: 1.2; }
    .ver-pill {
      font-size: 11px; font-weight: 800; color: var(--accent);
      background: rgba(74, 222, 128, 0.12); border: 1px solid rgba(74, 222, 128, 0.32);
      padding: 3px 9px; border-radius: 999px; flex-shrink: 0;
    }

    .main { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }

    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      background: rgba(19, 27, 36, 0.96);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
    }
    .nav-inner { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: 64px; }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; font-size: 10.5px; font-weight: 700; color: var(--muted); min-height: 44px;
    }
    .nav-btn.active { color: var(--accent); }

    /* Картки, сітки, типографіка */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .card-flush { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .stack-sm { display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .wrap { flex-wrap: wrap; }
    .min0 { min-width: 0; flex: 1; }
    .text-xs { font-size: 12px; }
    .text-sm { font-size: 13.5px; }
    .text-muted { color: var(--muted); }
    .fw-bold { font-weight: 700; }
    .fw-800 { font-weight: 800; }
    .section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; }
    .empty-state { text-align: center; padding: 20px 12px; color: var(--muted); font-size: 13.5px; }

    /* Кнопки та інпути (44px+ touch targets) */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 44px; padding: 9px 14px; border-radius: 11px;
      font-weight: 700; font-size: 13.5px; text-align: center; transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-sm { min-height: 36px; padding: 6px 11px; font-size: 12px; border-radius: 9px; }
    .btn-xs { min-height: 30px; padding: 4px 9px; font-size: 11.5px; border-radius: 8px; }
    .btn-full { width: 100%; }
    .btn-primary { background: var(--olive); color: #fff; }
    .btn-secondary { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); }
    .btn-info { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.35); }
    .btn-warn { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }

    .btn-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: var(--bg-elev); border: 1px solid var(--border);
      color: var(--text); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px;
    }
    .btn-icon-sm { width: 34px; height: 34px; border-radius: 9px; font-size: 13px; }
    .btn-icon.danger { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.3); color: #f87171; }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field-label { font-size: 12px; font-weight: 700; color: var(--muted); }
    .input, .select, .textarea {
      width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border); color: #fff; outline: none;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); }
    .textarea { min-height: 82px; resize: vertical; }
    .chips-wrap { display: flex; flex-wrap: wrap; gap: 6px; }

    /* Вкладки, фільтри, бейджі */
    .seg-control {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
      background: var(--card); border: 1px solid var(--border); padding: 4px; border-radius: 12px;
    }
    .seg-btn { min-height: 38px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--muted); }
    .seg-btn.active { background: var(--olive); color: #fff; }

    .pills-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .pills-scroll::-webkit-scrollbar { display: none; }
    .pill {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
      min-height: 36px; padding: 6px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 700; background: var(--card); border: 1px solid var(--border); color: var(--muted);
    }
    .pill.active { background: var(--olive); border-color: var(--olive); color: #fff; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .badge {
      display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px;
      border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .badge-kg { background: rgba(234, 179, 8, 0.2); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.4); }
    .badge-kv { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-ok { background: rgba(74, 222, 128, 0.16); color: #86efac; border: 1px solid rgba(74, 222, 128, 0.3); }
    .badge-info { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-warn { background: rgba(245, 158, 11, 0.18); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35); }
    .badge-err { background: rgba(239, 68, 68, 0.18); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }

    /* Календар і панель дати */
    .date-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 6px;
    }
    .date-bar-title { font-size: 14px; font-weight: 800; color: #fff; text-align: center; flex: 1; }
    .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-bottom: 6px; }
    .cal-weekdays div { font-size: 11px; font-weight: 700; color: var(--muted); }
    .cal-weekdays .wknd { color: #fbbf24; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-cell {
      height: 46px; border-radius: 9px; border: 1px solid transparent;
      background: rgba(11, 16, 21, 0.55); color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 5px 2px;
    }
    .cal-cell.today { border-color: rgba(74, 222, 128, 0.55); }
    .cal-cell.selected { background: rgba(75, 122, 61, 0.38); border-color: var(--accent); color: #fff; }
    .cal-num { font-size: 12.5px; font-weight: 700; line-height: 1; }
    .cal-dots { display: flex; gap: 2px; height: 6px; align-items: center; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; }

    /* Акордеони, картки бійців, статуси присутності */
    .acc-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      min-height: 48px; padding: 10px 12px; background: rgba(11, 16, 21, 0.55); cursor: pointer; user-select: none;
    }
    .chevron { display: inline-block; transition: transform 0.18s; color: var(--muted); flex-shrink: 0; font-size: 13px; }
    .acc-header.open .chevron { transform: rotate(90deg); color: #fff; }
    .acc-body { border-top: 1px solid var(--border); }
    .soldier-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--bg); }
    .soldier-name { font-size: 14px; font-weight: 700; color: #fff; }

    .presence-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .presence-btn {
      min-height: 36px; padding: 6px 8px; border-radius: 9px; font-size: 12px; font-weight: 700;
      background: var(--card); border: 1px solid var(--border); color: var(--muted); text-align: center;
    }
    .presence-btn.active-ok { background: rgba(74, 222, 128, 0.2); border-color: var(--accent); color: #86efac; }
    .presence-btn.active-warn { background: rgba(245, 158, 11, 0.22); border-color: var(--amber); color: #fde68a; }

    /* Задачі */
    .task-card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 13px; display: flex; flex-direction: column; gap: 10px;
    }
    .status-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .status-btn {
      min-height: 38px; padding: 6px 4px; border-radius: 9px; font-size: 11.5px; font-weight: 700;
      background: var(--bg); border: 1px solid var(--border); color: var(--muted); text-align: center;
    }
    .status-btn.st-received { background: rgba(56, 189, 248, 0.2); border-color: var(--blue); color: #7dd3fc; }
    .status-btn.st-done { background: rgba(34, 197, 94, 0.22); border-color: #22c55e; color: #86efac; }
    .status-btn.st-failed { background: rgba(239, 68, 68, 0.22); border-color: var(--danger); color: #fca5a5; }

    /* Розхід, KPI, прев'ю */
    .kpi-box { background: var(--bg); border: 1px solid var(--border); border-radius: 11px; padding: 10px; text-align: center; }
    .kpi-val { font-size: 20px; font-weight: 800; color: #fff; }
    .kpi-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .rozkhid-row {
      display: flex; flex-direction: column; gap: 6px; padding: 9px 10px;
      border-radius: 11px; background: var(--bg); border: 1px solid var(--border);
    }
    .rozkhid-row.has-count { border-color: rgba(245, 158, 11, 0.45); }
    .stepper { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .step-btn {
      width: 34px; height: 34px; border-radius: 8px; background: var(--card);
      border: 1px solid var(--border); color: #fff; font-size: 17px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .step-val { min-width: 24px; text-align: center; font-weight: 800; font-size: 14px; }
    .name-chip {
      display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 6px;
      font-size: 11px; font-weight: 600; background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.3); color: #fde68a;
    }
    .sched-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border);
    }
    .preview-pre {
      margin: 0; padding: 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px; white-space: pre-wrap; word-break: break-word; line-height: 1.48;
    }
    .toggle-pill {
      display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 10px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .toggle-pill input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
    .checkbox-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      min-height: 48px; padding: 10px 12px; background: var(--bg); border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .checkbox-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); flex-shrink: 0; }

    /* Модалки, Toast, палітра кольорів */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.78);
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    @media (min-width: 520px) { .modal-backdrop { align-items: center; padding: 16px; } }
    .modal-box {
      width: 100%; max-width: 540px; max-height: 92vh; background: var(--card);
      border: 1px solid var(--border); border-radius: 18px 18px 0 0;
      display: flex; flex-direction: column; overflow: hidden; padding-bottom: var(--safe-bottom);
    }
    @media (min-width: 520px) { .modal-box { border-radius: 18px; padding-bottom: 0; } }
    .modal-header {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0;
    }
    .modal-title { font-size: 16px; font-weight: 800; color: #fff; }
    .modal-body { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

    .toast-root {
      position: fixed; top: calc(62px + var(--safe-top)); left: 50%; transform: translateX(-50%);
      z-index: 60; width: 92%; max-width: 390px; pointer-events: none; display: flex; flex-direction: column; gap: 6px;
    }
    .toast {
      padding: 10px 14px; border-radius: 11px; text-align: center; font-size: 13px; font-weight: 700;
      color: #fff; background: #1b2836; border: 1px solid rgba(74, 222, 128, 0.55); box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .toast.error { background: #3a171c; border-color: rgba(239, 68, 68, 0.65); color: #fecaca; }

    .color-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .color-swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; }
    .color-swatch.selected { border-color: #fff; transform: scale(1.1); }
  </style>
</head>
<body>
  <div class="app">
    <!-- Компактна шапка -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">Помічник взводу</div>
          <div class="brand-sub">Наряди • Задачі • Розхід • Склад</div>
        </div>
      </div>
      <span class="ver-pill">v2.7</span>
    </header>

    <!-- Контент активної вкладки -->
    <main id="main-content" class="main"></main>

    <!-- 5-вкладкова нижня навігація -->
    <nav class="nav" aria-label="Головне меню">
      <div class="nav-inner">
        <button class="nav-btn" id="nav-duties" onclick="switchTab('duties')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span>Наряди</span>
        </button>
        <button class="nav-btn" id="nav-tasks" onclick="switchTab('tasks')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          <span>Задачі</span>
        </button>
        <button class="nav-btn" id="nav-rozkhid" onclick="switchTab('rozkhid')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          <span>Розхід</span>
        </button>
        <button class="nav-btn" id="nav-personnel" onclick="switchTab('personnel')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>Склад</span>
        </button>
        <button class="nav-btn" id="nav-settings" onclick="switchTab('settings')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>Налашт.</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- Модальне вікно, Toast, прихований імпорт JSON -->
  <div id="modal-root" class="modal-backdrop" onclick="if(event.target.id==='modal-root') closeModal()">
    <div id="modal-box" class="modal-box"></div>
  </div>
  <div id="toast-root" class="toast-root"></div>
  <input type="file" id="import-json-input" accept=".json,application/json" style="display:none" onchange="handleImportJSON(event)" />

  <script>
    // =========================================================================
    // 1. КОНСТАНТИ, ДОВІДНИКИ ТА СХЕМА ДАНИХ
    // =========================================================================
    const APP_VERSION = 'v2.7';
    const APP_UPDATED = '20.11.2026';
    const STORAGE_KEY = 'pomichnyk_vzvodu_v27';
    const LEGACY_KEYS = [
      'pomichnyk_vzvodu_data', 'pomichnyk_vzvodu_v3', 'pomichnyk_vzvodu_v2',
      'pomichnyk_vzvodu_v1', 'platoon_helper_state', 'platoon_duty_tracker_v1'
    ];

    const MONTHS_UK = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
    const MONTHS_GEN = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
    const WEEKDAYS_UK = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
    const PALETTE = ['#eab308','#3b82f6','#10b981','#f97316','#ef4444','#38bdf8','#a855f7','#ec4899'];
    const QUICK_RANKS = ['солдат', 'ст. солдат', 'мол. сержант', 'сержант'];

    const DEFAULT_SQUADS = [
      { id: 'cmd', name: 'Командир групи', color: '#eab308', isCmdGroup: true },
      { id: 'sq1', name: '1-ше відділення', color: '#3b82f6', isCmdGroup: false },
      { id: 'sq2', name: '2-ге відділення', color: '#10b981', isCmdGroup: false },
      { id: 'sq3', name: '3-тє відділення', color: '#f97316', isCmdGroup: false }
    ];

    const DEFAULT_DUTY_TYPES = [
      { id: 'chk', shortName: 'ЧК', name: 'Черговий курсу', maxCount: 1, color: '#ef4444' },
      { id: 'dn', shortName: 'Дн', name: 'Днювальні курсу', maxCount: 3, color: '#38bdf8' }
    ];

    // Точний порядок категорій у Розході
    const ROZKHID_CATS = [
      { key: 'priyom_shpytal', label: 'Прийом шпиталь', hint: 'Прийом у шпиталі', schedulable: true },
      { key: 'priyom_lazaret', label: 'Прийом лазарет', hint: 'Прийом у лазареті', schedulable: true },
      { key: 'sh', label: 'Ш', hint: 'Шпиталь', schedulable: true },
      { key: 'l', label: 'Л', hint: 'Лазарет', schedulable: true },
      { key: 'vd', label: 'Вд', hint: 'Відрядження', schedulable: true },
      { key: 'vp', label: 'Вп', hint: 'Відпустка', schedulable: true },
      { key: 'n', label: 'Н', hint: 'Наряд (авто)', schedulable: false },
      { key: 'g', label: 'Г', hint: 'Гуртожиток', schedulable: true },
      { key: 'pk', label: 'Пк', hint: 'Поза казармою', schedulable: true },
      { key: 'hv', label: 'Хв', hint: 'Хворий', schedulable: true },
      { key: 'starodobovyi', label: 'Стародобовий', hint: 'Вчорашній наряд (авто)', schedulable: false }
    ];

    // Статуси присутності в картці бійця ("Склад")
    const PRESENCE_STATUSES = [
      { key: 'in_service', shortLabel: 'В строю', fullLabel: 'В строю', isOk: true },
      { key: 'sh', shortLabel: 'Ш', fullLabel: 'Ш (Шпиталь)', isOk: false },
      { key: 'l', shortLabel: 'Л', fullLabel: 'Л (Лазарет)', isOk: false },
      { key: 'vd', shortLabel: 'Вд', fullLabel: 'Вд (Відрядження)', isOk: false },
      { key: 'vp', shortLabel: 'Вп', fullLabel: 'Вп (Відпустка)', isOk: false },
      { key: 'g', shortLabel: 'Г', fullLabel: 'Г (Гуртожиток)', isOk: false },
      { key: 'pk', shortLabel: 'Пк', fullLabel: 'Пк (Поза казармою)', isOk: false },
      { key: 'hv', shortLabel: 'Хв', fullLabel: 'Хв (Хворий)', isOk: false }
    ];

    const PERM_ABSENT_KEYS = new Set(['sh', 'l', 'vd', 'vp', 'g', 'pk', 'hv']);

    // Стан даних та UI
    const nowInit = new Date();
    let state = {
      groupNumber: '223',
      squads: [],
      personnel: [],
      dutyTypes: [],
      duties: [],
      tasks: [],
      scheduledAbsences: [],
      rozkhidByDate: {},
      lastBackupAt: null
    };

    let ui = {
      activeTab: 'duties',
      dutiesSubTab: 'schedule',
      year: nowInit.getFullYear(),
      month: nowInit.getMonth(),
      selectedDate: toISO(nowInit),
      scheduleSquadFilter: 'all',
      taskRecipientFilter: 'all',
      taskStatusFilter: 'all',
      openTaskRemarks: {},
      rozkhidDate: toISO(nowInit),
      rozkhidShowNames: true,
      rozkhidHideZeros: false,
      rozkhidUpcomingOpen: true,
      rozkhidModalCat: '',
      rozkhidModalSearch: '',
      rozkhidModalOpenSquads: {},
      personnelSearch: '',
      personnelSquadFilter: 'all',
      openPersonnelSquads: { cmd: true, sq1: true, sq2: true, sq3: true },
      openSoldiers: {}
    };

    let assignModal = { date: '', dutyTypeId: '', selectedIds: [] };
    let tempColor = '#3b82f6';

    // =========================================================================
    // 2. УТИЛІТИ ДАТ, ТЕКСТУ, СОРТУВАННЯ
    // =========================================================================
    function genId(p) { return p + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6); }
    function toISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    function todayISO() { return toISO(new Date()); }
    function addDaysISO(iso, delta) {
      const p = String(iso).split('-').map(Number);
      return toISO(new Date(p[0], p[1] - 1, p[2] + delta));
    }
    function formatHumanDate(iso) {
      if (!iso) return '—';
      const p = String(iso).split('-').map(Number);
      return p[2] + ' ' + MONTHS_GEN[p[1] - 1] + ' ' + p[0];
    }
    function formatDotDate(iso) {
      if (!iso) return '—';
      const p = String(iso).split('-');
      return p.length === 3 ? (p[2] + '.' + p[1] + '.' + p[0]) : iso;
    }
    function formatDayMonth(iso) {
      if (!iso) return '—';
      const p = String(iso).split('-');
      return p.length === 3 ? (p[2] + '.' + p[1]) : iso;
    }
    function monthPrefix(y, m) { return y + '-' + String(m + 1).padStart(2, '0'); }
    function formatDateTimeNow() {
      const d = new Date();
      return formatDotDate(toISO(d)) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function capitalizePIB(str) {
      return String(str || '').replace(/(^|[\s-])([а-яіїєґa-z])/gi, function(m, sep, ch) { return sep + ch.toUpperCase(); });
    }
    function isCmdGroup(sq) {
      return Boolean(sq && (sq.isCmdGroup || sq.isGroupCmd || sq.id === 'cmd' || sq.id === 'sq_group_cmd'));
    }
    function getOrderedSquads() {
      const list = Array.isArray(state.squads) ? state.squads : [];
      return list.filter(isCmdGroup).concat(list.filter(function(s) { return !isCmdGroup(s); }));
    }
    function getSquadById(id) {
      return state.squads.find(function(s) { return s.id === id; }) || { id: id, name: 'Без відділення', color: '#64748b', isCmdGroup: false };
    }
    function getSoldierById(id) { return state.personnel.find(function(p) { return p.id === id; }); }
    function getDutyTypeById(id) {
      return state.dutyTypes.find(function(dt) { return dt.id === id; }) || { id: id, shortName: 'Наряд', name: 'Наряд', maxCount: 1, color: '#64748b' };
    }
    function getRozkhidCat(key) { return ROZKHID_CATS.find(function(c) { return c.key === key; }) || { key: key, label: key, hint: '' }; }
    function getPresenceMeta(key) { return PRESENCE_STATUSES.find(function(p) { return p.key === key; }) || PRESENCE_STATUSES[0]; }
    function sortSquadPersonnel(list) {
      return list.slice().sort(function(a, b) {
        if (a.isLeader && !b.isLeader) return -1;
        if (!a.isLeader && b.isLeader) return 1;
        return String(a.fullName || '').localeCompare(String(b.fullName || ''), 'uk');
      });
    }
    function getSoldierDutyStats(soldierId, y, m) {
      const pref = monthPrefix(y, m);
      let monthCount = 0, totalCount = 0, lastDate = '';
      for (let i = 0; i < state.duties.length; i++) {
        const d = state.duties[i];
        if (d.soldierId === soldierId) {
          totalCount++;
          if (d.date && d.date.indexOf(pref) === 0) monthCount++;
          if (d.date && (!lastDate || d.date > lastDate)) lastDate = d.date;
        }
      }
      return { monthCount: monthCount, totalCount: totalCount, lastDate: lastDate };
    }
    function getUpcomingAbsencesForSoldier(soldierId) {
      const td = todayISO();
      return state.scheduledAbsences
        .filter(function(a) { return a.soldierId === soldierId && (a.endDate || a.startDate) >= td; })
        .sort(function(a, b) { return a.startDate.localeCompare(b.startDate); });
    }
    function formatSquadRecipient(sq) {
      const m = String(sq.name || '').match(/^(\d+)/);
      return m ? ('Командиру ' + m[1] + '-го відділення') : ('Командиру (' + sq.name + ')');
    }
    function formatSquadShortTab(sq) {
      const m = String(sq.name || '').match(/^(\d+-\S+)/);
      return m ? (m[1] + ' відд.') : sq.name;
    }

    // =========================================================================
    // 3. ЗБЕРЕЖЕННЯ ТА МІГРАЦІЯ ДАНИХ (v2.3 – v2.6.1 -> v2.7)
    // =========================================================================
    function createFreshState() {
      return {
        groupNumber: '223',
        squads: JSON.parse(JSON.stringify(DEFAULT_SQUADS)),
        personnel: [],
        dutyTypes: JSON.parse(JSON.stringify(DEFAULT_DUTY_TYPES)),
        duties: [],
        tasks: [],
        scheduledAbsences: [],
        rozkhidByDate: {},
        lastBackupAt: null
      };
    }

    function mapLegacyStatus(val) {
      if (!val) return 'in_service';
      const map = {
        active: 'in_service', in_service: 'in_service', 'Вн': 'in_service', 'В строю': 'in_service',
        'Прийом шпиталь': 'priyom_shpytal', priyom_shpytal: 'priyom_shpytal',
        'Прийом лазарет': 'priyom_lazaret', priyom_lazaret: 'priyom_lazaret',
        'Ш': 'sh', sh: 'sh', 'Л': 'l', l: 'l', medical: 'l',
        'Вд': 'vd', vd: 'vd', trip: 'vd', 'Вп': 'vp', vp: 'vp', leave: 'vp',
        'Н': 'n', n: 'n', 'Г': 'g', g: 'g', 'Пк': 'pk', pk: 'pk', 'Хв': 'hv', hv: 'hv',
        'Стародобовий': 'starodobovyi', starodobovyi: 'starodobovyi'
      };
      return map[String(val).trim()] || 'in_service';
    }

    function normalizeState(parsed) {
      if (!parsed || typeof parsed !== 'object') return createFreshState();
      let rawSquads = Array.isArray(parsed.squads) && parsed.squads.length
        ? parsed.squads.slice()
        : JSON.parse(JSON.stringify(DEFAULT_SQUADS));
      if (!rawSquads.some(isCmdGroup)) {
        rawSquads.unshift({ id: 'cmd', name: 'Командир групи', color: '#eab308', isCmdGroup: true });
      }
      const squads = rawSquads.map(function(sq, idx) {
        return {
          id: sq.id || genId('sq'),
          name: String(sq.name || ('Відділення ' + idx)),
          color: sq.color || PALETTE[idx % PALETTE.length],
          isCmdGroup: isCmdGroup(sq)
        };
      });

      const rawPeople = Array.isArray(parsed.personnel) ? parsed.personnel : (Array.isArray(parsed.soldiers) ? parsed.soldiers : []);
      const defaultNonCmdId = (squads.find(function(s) { return !s.isCmdGroup; }) || squads[0]).id;
      const personnel = rawPeople.map(function(p) {
        const st = mapLegacyStatus(p.presenceStatus || p.status);
        return {
          id: p.id || genId('p'),
          fullName: capitalizePIB(String(p.fullName || p.name || '').trim()),
          rank: String(p.rank || '').trim(),
          squadId: p.squadId || defaultNonCmdId,
          isLeader: Boolean(p.isLeader || p.isCommander),
          presenceStatus: PERM_ABSENT_KEYS.has(st) ? st : 'in_service'
        };
      }).filter(function(p) { return p.fullName.length > 0; });

      const rawTypes = Array.isArray(parsed.dutyTypes) && parsed.dutyTypes.length
        ? parsed.dutyTypes : JSON.parse(JSON.stringify(DEFAULT_DUTY_TYPES));
      const dutyTypes = rawTypes.map(function(dt, idx) {
        const shortN = String(dt.shortName || dt.name || 'Наряд').trim();
        const fullN = String(dt.shortName ? (dt.name || '') : (dt.desc || '')).trim();
        const isDn = shortN.toLowerCase() === 'дн' || fullN.toLowerCase().indexOf('днювальн') !== -1;
        return {
          id: dt.id || genId('dt'),
          shortName: shortN,
          name: fullN || shortN,
          maxCount: Math.min(10, Math.max(1, Number(dt.maxCount || dt.maxPeople) || (isDn ? 3 : 1))),
          color: dt.color || PALETTE[(idx + 4) % PALETTE.length]
        };
      });

      const duties = Array.isArray(parsed.duties) ? parsed.duties.map(function(d) {
        return {
          id: d.id || genId('d'),
          date: String(d.date || ''),
          soldierId: String(d.soldierId || ''),
          dutyTypeId: String(d.dutyTypeId || (dutyTypes[0] ? dutyTypes[0].id : 'chk'))
        };
      }).filter(function(d) { return d.date && d.soldierId; }) : [];

      const tasks = Array.isArray(parsed.tasks) ? parsed.tasks.map(function(t) {
        const isAll = t.recipientType === 'all_leaders' || t.targetType === 'all_commanders';
        return {
          id: t.id || genId('task'),
          recipientType: isAll ? 'all_leaders' : 'squad',
          squadId: isAll ? '' : String(t.squadId || t.targetSquadId || defaultNonCmdId),
          text: String(t.text || ''),
          author: String(t.author || t.issuer || ''),
          status: (t.status === 'done' || t.status === 'failed') ? t.status : 'received',
          remark: String(t.remark !== undefined ? t.remark : (t.note || '')),
          createdAt: String(t.createdAt || formatDateTimeNow())
        };
      }).filter(function(t) { return t.text.length > 0; }) : [];

      const scheduledAbsences = Array.isArray(parsed.scheduledAbsences) ? parsed.scheduledAbsences.map(function(a) {
        return {
          id: a.id || genId('sched'),
          soldierId: String(a.soldierId || ''),
          category: mapLegacyStatus(a.category),
          startDate: String(a.startDate || ''),
          endDate: String(a.endDate || ''),
          note: String(a.note || '')
        };
      }).filter(function(a) { return a.soldierId && a.startDate && a.category !== 'in_service'; }) : [];

      const rozkhidByDate = {};
      const rawRoz = parsed.rozkhidByDate || parsed.rozkhid || {};
      if (rawRoz && typeof rawRoz === 'object') {
        Object.keys(rawRoz).forEach(function(dk) {
          const item = rawRoz[dk];
          if (!item || typeof item !== 'object') return;
          const manual = {};
          const rm = item.manual || item.overrides || {};
          Object.keys(rm).forEach(function(sid) { manual[sid] = mapLegacyStatus(rm[sid]); });
          const offsets = {};
          const ro = item.offsets || item.extra || {};
          Object.keys(ro).forEach(function(k) {
            const mk = mapLegacyStatus(k);
            const num = Math.max(0, Number(ro[k]) || 0);
            if (mk !== 'in_service' && num > 0) offsets[mk] = num;
          });
          rozkhidByDate[dk] = { cleared: Boolean(item.cleared), manual: manual, offsets: offsets };
        });
      }

      return {
        groupNumber: (typeof parsed.groupNumber === 'string' && parsed.groupNumber.trim()) ? parsed.groupNumber.trim() : '223',
        squads: squads,
        personnel: personnel,
        dutyTypes: dutyTypes,
        duties: duties,
        tasks: tasks,
        scheduledAbsences: scheduledAbsences,
        rozkhidByDate: rozkhidByDate,
        lastBackupAt: parsed.lastBackupAt || null
      };
    }

    function loadState() {
      try {
        let raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          for (let i = 0; i < LEGACY_KEYS.length; i++) {
            const f = localStorage.getItem(LEGACY_KEYS[i]);
            if (f) { raw = f; break; }
          }
        }
        state = raw ? normalizeState(JSON.parse(raw)) : createFreshState();
        state.squads.forEach(function(sq) {
          if (ui.openPersonnelSquads[sq.id] === undefined) ui.openPersonnelSquads[sq.id] = true;
        });
        saveState();
      } catch (e) {
        state = createFreshState();
        saveState();
      }
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      catch (e) { showToast('Помилка збереження у браузері', 'error'); }
    }

    // =========================================================================
    // 4. СПОВІЩЕННЯ, МОДАЛКИ, КОПІЮВАННЯ
    // =========================================================================
    function showToast(msg, type) {
      const root = document.getElementById('toast-root');
      if (!root) return;
      const el = document.createElement('div');
      el.className = 'toast' + (type === 'error' ? ' error' : '');
      el.textContent = msg;
      root.appendChild(el);
      setTimeout(function() {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.2s';
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
      }, 2400);
    }

    function openModal(html) {
      document.getElementById('modal-box').innerHTML = html;
      document.getElementById('modal-root').classList.add('open');
    }

    function closeModal() { document.getElementById('modal-root').classList.remove('open'); }

    function showConfirm(title, message, btnText, onConfirm, isDanger) {
      openModal(
        '<div class="modal-header"><div class="modal-title">' + esc(title) + '</div>' +
        '<button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body"><div class="text-sm text-muted">' + esc(message) + '</div>' +
        '<div class="grid-2"><button class="btn btn-secondary" onclick="closeModal()">Скасувати</button>' +
        '<button id="confirm-ok-btn" class="btn ' + (isDanger ? 'btn-danger' : 'btn-primary') + '">' + esc(btnText) + '</button></div></div>'
      );
      document.getElementById('confirm-ok-btn').onclick = function() { closeModal(); onConfirm(); };
    }

    function copyText(text, successMsg) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        document.body.appendChild(ta);
        ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { showToast(successMsg || 'Скопійовано'); return; }
      } catch (e) {}
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() { showToast(successMsg || 'Скопійовано'); })
          .catch(function() { showToast('Не вдалося скопіювати', 'error'); });
      } else {
        showToast('Не вдалося скопіювати', 'error');
      }
    }

    // =========================================================================
    // 5. ВКЛАДКА 1: НАРЯДИ (ГРАФІК + ОБЛІК)
    // =========================================================================
    function switchTab(tab) { ui.activeTab = tab; render(); window.scrollTo(0, 0); }
    function setDutiesSubTab(sub) { ui.dutiesSubTab = sub; render(); }
    function setScheduleSquadFilter(id) { ui.scheduleSquadFilter = id; render(); }
    function selectCalDate(iso) { ui.selectedDate = iso; render(); }

    function changeMonth(delta) {
      ui.month += delta;
      if (ui.month < 0) { ui.month = 11; ui.year--; }
      else if (ui.month > 11) { ui.month = 0; ui.year++; }
      const n = new Date();
      ui.selectedDate = (ui.year === n.getFullYear() && ui.month === n.getMonth()) ? toISO(n) : (monthPrefix(ui.year, ui.month) + '-01');
      render();
    }

    function goTodayCalendar() {
      const n = new Date();
      ui.year = n.getFullYear(); ui.month = n.getMonth(); ui.selectedDate = toISO(n);
      render();
    }

    function renderMonthBar(showToday) {
      return '<div class="date-bar">' +
        '<button class="btn-icon" onclick="changeMonth(-1)">◀</button>' +
        '<div class="date-bar-title">' + MONTHS_UK[ui.month] + ' ' + ui.year + '</div>' +
        (showToday ? '<button class="btn btn-sm btn-secondary" onclick="goTodayCalendar()">Сьогодні</button>' : '') +
        '<button class="btn-icon" onclick="changeMonth(1)">▶</button></div>';
    }

    function renderDutiesTab() {
      const seg = '<div class="seg-control">' +
        '<button class="seg-btn ' + (ui.dutiesSubTab === 'schedule' ? 'active' : '') + '" onclick="setDutiesSubTab(\'schedule\')">Графік</button>' +
        '<button class="seg-btn ' + (ui.dutiesSubTab === 'stats' ? 'active' : '') + '" onclick="setDutiesSubTab(\'stats\')">Облік</button></div>';
      return seg + (ui.dutiesSubTab === 'schedule' ? renderScheduleView() : renderStatsView());
    }

    function renderScheduleView() {
      const y = ui.year, m = ui.month, pref = monthPrefix(y, m), td = todayISO();
      const firstDay = new Date(y, m, 1), daysInMonth = new Date(y, m + 1, 0).getDate();
      let offset = firstDay.getDay() - 1; if (offset < 0) offset = 6;

      const filterPills = '<div class="pills-scroll">' +
        [{ id: 'all', name: 'Усі', color: '#4ade80' }].concat(getOrderedSquads()).map(function(sq) {
          return '<button class="pill ' + (ui.scheduleSquadFilter === sq.id ? 'active' : '') + '" onclick="setScheduleSquadFilter(\'' + sq.id + '\')">' +
            '<span class="dot" style="background:' + sq.color + '"></span><span>' + esc(sq.name) + '</span></button>';
        }).join('') + '</div>';

      const byDate = {};
      state.duties.forEach(function(d) {
        if (!d.date || d.date.indexOf(pref) !== 0) return;
        const s = getSoldierById(d.soldierId);
        if (!s || (ui.scheduleSquadFilter !== 'all' && s.squadId !== ui.scheduleSquadFilter)) return;
        if (!byDate[d.date]) byDate[d.date] = [];
        byDate[d.date].push(d);
      });

      let cells = '';
      for (let i = 0; i < offset; i++) cells += '<div></div>';
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = pref + '-' + String(day).padStart(2, '0');
        const list = byDate[iso] || [];
        const dots = list.slice(0, 4).map(function(d) {
          return '<span class="cal-dot" style="background:' + getDutyTypeById(d.dutyTypeId).color + '"></span>';
        }).join('');
        cells += '<button class="cal-cell' + (iso === ui.selectedDate ? ' selected' : '') + (iso === td ? ' today' : '') + '" onclick="selectCalDate(\'' + iso + '\')">' +
          '<span class="cal-num">' + day + '</span><div class="cal-dots">' + dots + '</div></button>';
      }

      const dayDuties = state.duties.filter(function(d) {
        if (d.date !== ui.selectedDate) return false;
        const s = getSoldierById(d.soldierId);
        return s && (ui.scheduleSquadFilter === 'all' || s.squadId === ui.scheduleSquadFilter);
      });

      const grouped = [], seen = new Set();
      state.dutyTypes.forEach(function(dt) {
        const items = dayDuties.filter(function(d) { return d.dutyTypeId === dt.id; });
        if (items.length) { grouped.push({ dt: dt, items: items }); seen.add(dt.id); }
      });
      dayDuties.forEach(function(d) {
        if (!seen.has(d.dutyTypeId)) {
          grouped.push({ dt: getDutyTypeById(d.dutyTypeId), items: dayDuties.filter(function(x) { return x.dutyTypeId === d.dutyTypeId; }) });
          seen.add(d.dutyTypeId);
        }
      });

      const dayListHtml = grouped.length === 0
        ? '<div class="empty-state">На ' + formatHumanDate(ui.selectedDate) + ' нарядів не призначено.</div>'
        : '<div class="stack">' + grouped.map(function(g) {
            return '<div class="stack-sm">' +
              '<div class="row-between"><div class="row"><span class="dot" style="background:' + g.dt.color + '"></span>' +
              '<span class="section-title" style="color:' + g.dt.color + '">' + esc(g.dt.shortName) + (g.dt.name && g.dt.name !== g.dt.shortName ? ' — ' + esc(g.dt.name) : '') + '</span></div>' +
              '<span class="text-xs text-muted">' + g.items.length + (g.dt.maxCount > 1 ? ' / ' + g.dt.maxCount : '') + ' ос.</span></div>' +
              g.items.map(function(d) {
                const s = getSoldierById(d.soldierId), sq = getSquadById(s.squadId);
                return '<div class="soldier-row" style="border-radius:10px;border:1px solid var(--border);border-left:4px solid ' + sq.color + '">' +
                  '<div class="min0"><div class="row wrap"><span class="soldier-name">' + esc(s.fullName) + '</span>' +
                  (isCmdGroup(sq) ? '<span class="badge badge-kg">★ КГ</span>' : (s.isLeader ? '<span class="badge badge-kv">★ КВ</span>' : '')) + '</div>' +
                  '<div class="text-xs text-muted">' + esc(sq.name) + (s.rank ? ' • ' + esc(s.rank) : '') + '</div></div>' +
                  '<button class="btn-icon btn-icon-sm danger" onclick="removeDuty(\'' + d.id + '\')">✕</button></div>';
              }).join('') + '</div>';
          }).join('') + '</div>';

      return renderMonthBar(true) + filterPills +
        '<div class="card"><div class="cal-weekdays">' +
          WEEKDAYS_UK.map(function(w, i) { return '<div class="' + (i >= 5 ? 'wknd' : '') + '">' + w + '</div>'; }).join('') +
        '</div><div class="cal-grid">' + cells + '</div></div>' +
        '<div class="card stack"><div class="row-between"><div><div class="fw-800" style="color:#fff">' + formatHumanDate(ui.selectedDate) + '</div>' +
        '<div class="text-xs text-muted">Призначено: ' + dayDuties.length + '</div></div>' +
        '<button class="btn btn-sm btn-primary" onclick="openAssignDutyModal(\'' + ui.selectedDate + '\')">+ Призначити наряд</button></div>' +
        dayListHtml +
        (dayDuties.length ? '<div class="grid-2"><button class="btn btn-secondary" onclick="openDayDutiesPreview(\'' + ui.selectedDate + '\')">Перегляд тексту</button>' +
          '<button class="btn btn-primary" onclick="copyDayDuties(\'' + ui.selectedDate + '\')">Скопіювати наряд</button></div>' : '') + '</div>';
    }

    function generateDayDutiesText(isoDate) {
      const dayDuties = state.duties.filter(function(d) {
        if (d.date !== isoDate) return false;
        const s = getSoldierById(d.soldierId);
        return s && (ui.scheduleSquadFilter === 'all' || s.squadId === ui.scheduleSquadFilter);
      });
      if (!dayDuties.length) return '';
      const grp = (state.groupNumber || '223').trim() || '223';
      const order = state.dutyTypes.slice();
      const known = new Set(order.map(function(dt) { return dt.id; }));
      dayDuties.forEach(function(d) { if (!known.has(d.dutyTypeId)) { order.push(getDutyTypeById(d.dutyTypeId)); known.add(d.dutyTypeId); } });
      const blocks = [];
      order.forEach(function(dt) {
        const items = dayDuties.filter(function(d) { return d.dutyTypeId === dt.id; });
        if (!items.length) return;
        const lines = [dt.shortName + ':'];
        items.forEach(function(d) {
          const s = getSoldierById(d.soldierId);
          if (s) lines.push('-' + (s.rank ? s.rank + ' ' : '') + s.fullName);
        });
        blocks.push(lines.join('\n'));
      });
      return grp + ', ' + formatDotDate(isoDate) + '\n' + blocks.join('\n\n');
    }

    function openDayDutiesPreview(isoDate) {
      const txt = generateDayDutiesText(isoDate);
      if (!txt) return;
      openModal(
        '<div class="modal-header"><div class="modal-title">Наряд на ' + formatDotDate(isoDate) + '</div><button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body"><pre class="preview-pre">' + esc(txt) + '</pre>' +
        '<button class="btn btn-primary btn-full" onclick="copyDayDuties(\'' + isoDate + '\'); closeModal();">Скопіювати наряд</button></div>'
      );
    }

    function copyDayDuties(isoDate) {
      const txt = generateDayDutiesText(isoDate);
      if (!txt) { showToast('На цю дату нарядів немає', 'error'); return; }
      copyText(txt, 'Наряд скопійовано');
    }

    function removeDuty(id) {
      state.duties = state.duties.filter(function(d) { return d.id !== id; });
      saveState(); render(); showToast('Наряд видалено');
    }

    function openAssignDutyModal(isoDate) {
      if (!state.personnel.length) { showToast('Спочатку додайте бійців у «Склад»', 'error'); return; }
      assignModal = { date: isoDate, dutyTypeId: state.dutyTypes[0] ? state.dutyTypes[0].id : '', selectedIds: [] };
      renderAssignDutyModal();
    }

    function selectAssignDutyType(dtId) { assignModal.dutyTypeId = dtId; assignModal.selectedIds = []; renderAssignDutyModal(); }

    function toggleAssignSoldier(sid) {
      const dt = getDutyTypeById(assignModal.dutyTypeId);
      const maxC = Math.max(1, Number(dt.maxCount) || 1);
      const idx = assignModal.selectedIds.indexOf(sid);
      if (idx >= 0) assignModal.selectedIds.splice(idx, 1);
      else if (maxC === 1) assignModal.selectedIds = [sid];
      else if (assignModal.selectedIds.length >= maxC) { showToast('Для «' + dt.shortName + '» максимум ' + maxC + ' ос.', 'error'); return; }
      else assignModal.selectedIds.push(sid);
      renderAssignDutyModal();
    }

    function confirmAssignDuties() {
      if (!assignModal.dutyTypeId || !assignModal.selectedIds.length) { showToast('Оберіть військовослужбовця', 'error'); return; }
      assignModal.selectedIds.forEach(function(sid) {
        state.duties.push({ id: genId('d'), date: assignModal.date, soldierId: sid, dutyTypeId: assignModal.dutyTypeId });
      });
      const n = assignModal.selectedIds.length;
      saveState(); closeModal(); render();
      showToast(n > 1 ? ('Призначено бійців: ' + n) : 'Наряд призначено');
    }

    function renderAssignDutyModal() {
      const p = assignModal.date.split('-').map(Number), y = p[0], m = p[1] - 1;
      const yest = addDaysISO(assignModal.date, -1);
      const dt = getDutyTypeById(assignModal.dutyTypeId);
      const maxC = Math.max(1, Number(dt.maxCount) || 1);
      const pickedSet = new Set(assignModal.selectedIds);
      const busyToday = new Set(state.duties.filter(function(d) { return d.date === assignModal.date; }).map(function(d) { return d.soldierId; }));
      const busyYest = new Set(state.duties.filter(function(d) { return d.date === yest; }).map(function(d) { return d.soldierId; }));

      const groupsHtml = getOrderedSquads().map(function(sq) {
        const members = sortSquadPersonnel(state.personnel.filter(function(x) { return x.squadId === sq.id; }));
        if (!members.length) return '';
        return '<div class="stack-sm"><div class="row"><span class="dot" style="background:' + sq.color + '"></span>' +
          '<span class="section-title" style="color:' + sq.color + '">' + esc(sq.name) + '</span></div>' +
          members.map(function(s) {
            const st = getSoldierDutyStats(s.id, y, m), picked = pickedSet.has(s.id), pm = getPresenceMeta(s.presenceStatus);
            return '<button type="button" class="soldier-row" onclick="toggleAssignSoldier(\'' + s.id + '\')" style="width:100%;text-align:left;border-radius:10px;border:1px solid ' + (picked ? '#4ade80' : 'var(--border)') + ';border-left:4px solid ' + sq.color + ';background:' + (picked ? 'rgba(74,222,128,0.12)' : 'var(--bg)') + '">' +
              '<div style="width:22px;height:22px;border-radius:6px;border:2px solid ' + (picked ? '#4ade80' : 'var(--border-strong)') + ';background:' + (picked ? '#4ade80' : 'transparent') + ';color:#0b1015;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0">' + (picked ? '✓' : '') + '</div>' +
              '<div class="min0"><div class="row wrap"><span class="soldier-name">' + esc(s.fullName) + '</span>' +
                (isCmdGroup(sq) ? '<span class="badge badge-kg">★ КГ</span>' : (s.isLeader ? '<span class="badge badge-kv">★ КВ</span>' : '')) +
                (!pm.isOk ? '<span class="badge badge-err">' + esc(pm.shortLabel) + '</span>' : '') +
                (busyToday.has(s.id) ? '<span class="badge badge-warn">Вже сьогодні</span>' : '') +
                (busyYest.has(s.id) ? '<span class="badge badge-info">Вчора в наряді</span>' : '') +
              '</div>' + (s.rank ? '<div class="text-xs text-muted">' + esc(s.rank) + '</div>' : '') + '</div>' +
              '<div style="text-align:right;flex-shrink:0"><div class="fw-800" style="color:#fff">' + st.monthCount + ' <span class="text-xs text-muted">міс</span></div>' +
              '<div class="text-xs text-muted">' + st.totalCount + ' всього</div></div></button>';
          }).join('') + '</div>';
      }).join('');

      openModal(
        '<div class="modal-header"><div><div class="modal-title">Призначити наряд</div><div class="text-xs text-muted">' + formatHumanDate(assignModal.date) + '</div></div>' +
        '<button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body">' +
          '<div class="field"><div class="field-label">1. Оберіть вид наряду:</div><div class="chips-wrap">' +
            state.dutyTypes.map(function(t) {
              return '<button type="button" class="btn btn-sm ' + (t.id === assignModal.dutyTypeId ? 'btn-primary' : 'btn-secondary') + '" onclick="selectAssignDutyType(\'' + t.id + '\')">' +
                '<span class="dot" style="background:' + t.color + '"></span><span>' + esc(t.shortName) + '</span><span class="text-xs" style="opacity:0.8">(до ' + t.maxCount + ')</span></button>';
            }).join('') + '</div></div>' +
          '<div class="row-between"><span class="field-label">2. Особовий склад:</span><span class="badge badge-ok">Обрано: ' + assignModal.selectedIds.length + ' / ' + maxC + '</span></div>' +
          '<div class="stack">' + groupsHtml + '</div>' +
          '<div style="position:sticky;bottom:0;background:var(--card);padding-top:10px;border-top:1px solid var(--border)">' +
            '<button class="btn btn-primary btn-full" onclick="confirmAssignDuties()">Призначити (' + assignModal.selectedIds.length + ' / ' + maxC + ')</button></div></div>'
      );
    }

    function renderStatsView() {
      const pref = monthPrefix(ui.year, ui.month);
      const monthTotal = state.duties.filter(function(d) { return d.date && d.date.indexOf(pref) === 0 && Boolean(getSoldierById(d.soldierId)); }).length;
      const avg = state.personnel.length ? (monthTotal / state.personnel.length).toFixed(1) : '0.0';

      const blocks = getOrderedSquads().map(function(sq) {
        const members = sortSquadPersonnel(state.personnel.filter(function(p) { return p.squadId === sq.id; }));
        if (!members.length) return '';
        return '<div class="card-flush"><div class="row-between" style="padding:10px 12px;background:rgba(11,16,21,0.55);border-left:4px solid ' + sq.color + '">' +
          '<span class="section-title" style="color:' + sq.color + '">' + esc(sq.name) + '</span><span class="text-xs text-muted">Міс. / Всього</span></div>' +
          members.map(function(s) {
            const st = getSoldierDutyStats(s.id, ui.year, ui.month);
            return '<button type="button" class="soldier-row" onclick="openSoldierHistoryModal(\'' + s.id + '\')" style="width:100%;text-align:left;border-bottom:1px solid var(--border)">' +
              '<div class="min0"><div class="row wrap"><span class="soldier-name">' + esc(s.fullName) + '</span>' +
              (isCmdGroup(sq) ? '<span class="badge badge-kg">★ КГ</span>' : (s.isLeader ? '<span class="badge badge-kv">★ КВ</span>' : '')) + '</div>' +
              '<div class="text-xs text-muted">Останній: ' + (st.lastDate ? formatDotDate(st.lastDate) : 'немає') + '</div></div>' +
              '<div class="row" style="gap:14px;flex-shrink:0">' +
                '<div style="text-align:right"><div class="fw-800" style="color:#fff">' + st.monthCount + '</div><div class="text-xs text-muted">міс.</div></div>' +
                '<div style="text-align:right"><div class="fw-800" style="color:var(--accent)">' + st.totalCount + '</div><div class="text-xs text-muted">всього</div></div>' +
              '</div></button>';
          }).join('') + '</div>';
      }).join('');

      return renderMonthBar(false) +
        '<div class="grid-2"><div class="kpi-box"><div class="kpi-val">' + monthTotal + '</div><div class="kpi-lbl">Всього нарядів за місяць</div></div>' +
        '<div class="kpi-box"><div class="kpi-val" style="color:var(--accent)">' + avg + '</div><div class="kpi-lbl">Середнє на бійця</div></div></div>' +
        (blocks || '<div class="card empty-state">Додайте бійців у вкладці «Склад», щоб вести облік нарядів.</div>');
    }

    function openSoldierHistoryModal(sid) {
      const s = getSoldierById(sid); if (!s) return;
      const sq = getSquadById(s.squadId), st = getSoldierDutyStats(s.id, ui.year, ui.month);
      const hist = state.duties.filter(function(d) { return d.soldierId === s.id; }).sort(function(a, b) { return b.date.localeCompare(a.date); });
      openModal(
        '<div class="modal-header"><div><div class="modal-title">' + esc(s.fullName) + '</div><div class="text-xs text-muted">' + esc(sq.name) + (s.rank ? ' • ' + esc(s.rank) : '') + '</div></div>' +
        '<button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body"><div class="grid-2">' +
          '<div class="kpi-box"><div class="kpi-val">' + st.monthCount + '</div><div class="kpi-lbl">' + MONTHS_UK[ui.month] + ' ' + ui.year + '</div></div>' +
          '<div class="kpi-box"><div class="kpi-val" style="color:var(--accent)">' + st.totalCount + '</div><div class="kpi-lbl">За весь час</div></div></div>' +
        '<div class="section-title text-muted">Історія нарядів (' + hist.length + ')</div>' +
        (hist.length ? '<div class="stack-sm">' + hist.map(function(d) {
          const dt = getDutyTypeById(d.dutyTypeId);
          return '<div class="row-between" style="padding:9px 11px;border-radius:10px;background:var(--bg);border:1px solid var(--border)">' +
            '<span class="text-sm fw-bold">' + formatHumanDate(d.date) + '</span>' +
            '<span class="badge" style="background:' + dt.color + '26;color:' + dt.color + ';border:1px solid ' + dt.color + '55">' + esc(dt.shortName) + '</span></div>';
        }).join('') + '</div>' : '<div class="empty-state">Історія нарядів порожня.</div>') + '</div>'
      );
    }

    // =========================================================================
    // 6. ВКЛАДКА 2: ЗАДАЧІ (ЧИСТА ПОПЕРЕДНЯ ВЕРСІЯ З РУЧНИМ ВВОДОМ АВТОРА)
    // =========================================================================
    function setTaskRecipientFilter(val) { ui.taskRecipientFilter = val; render(); }
    function setTaskStatusFilter(val) { ui.taskStatusFilter = val; render(); }

    function renderTasksTab() {
      const nonCmd = getOrderedSquads().filter(function(sq) { return !isCmdGroup(sq); });
      const opts = nonCmd.map(function(sq) { return '<option value="squad:' + sq.id + '">' + esc(formatSquadRecipient(sq)) + '</option>'; }).join('') +
        '<option value="all_leaders">Усім командирам відділень</option>';

      const formCard =
        '<form class="card stack" onsubmit="submitNewTask(event)">' +
          '<div class="section-title" style="color:var(--accent)">Поставити задачу</div>' +
          '<div class="field"><label class="field-label" for="task-rec">Кому</label><select id="task-rec" class="select">' + opts + '</select></div>' +
          '<div class="field"><label class="field-label" for="task-text">Суть задачі</label><textarea id="task-text" class="textarea" required placeholder="Опишіть задачу..."></textarea></div>' +
          '<div class="field"><label class="field-label" for="task-author">Хто поставив</label><input id="task-author" class="input" type="text" required placeholder="Введіть вручну..." /></div>' +
          '<button type="submit" class="btn btn-primary btn-full">Поставити задачу</button>' +
        '</form>';

      const recPills = '<div class="pills-scroll">' +
        '<button class="pill ' + (ui.taskRecipientFilter === 'all' ? 'active' : '') + '" onclick="setTaskRecipientFilter(\'all\')">Усі</button>' +
        nonCmd.map(function(sq) {
          return '<button class="pill ' + (ui.taskRecipientFilter === sq.id ? 'active' : '') + '" onclick="setTaskRecipientFilter(\'' + sq.id + '\')">' +
            '<span class="dot" style="background:' + sq.color + '"></span><span>' + esc(formatSquadShortTab(sq)) + '</span></button>';
        }).join('') +
        '<button class="pill ' + (ui.taskRecipientFilter === 'all_leaders' ? 'active' : '') + '" onclick="setTaskRecipientFilter(\'all_leaders\')">Усім КВ</button></div>';

      const stPills = '<div class="pills-scroll">' +
        [{ id: 'all', l: 'Усі' }, { id: 'received', l: 'Отримав' }, { id: 'done', l: 'Виконано' }, { id: 'failed', l: 'Не виконано' }].map(function(f) {
          return '<button class="pill ' + (ui.taskStatusFilter === f.id ? 'active' : '') + '" onclick="setTaskStatusFilter(\'' + f.id + '\')">' + f.l + '</button>';
        }).join('') + '</div>';

      const filtered = state.tasks.filter(function(t) {
        if (ui.taskRecipientFilter === 'all_leaders' && t.recipientType !== 'all_leaders') return false;
        if (ui.taskRecipientFilter !== 'all' && ui.taskRecipientFilter !== 'all_leaders' && (t.recipientType !== 'squad' || t.squadId !== ui.taskRecipientFilter)) return false;
        if (ui.taskStatusFilter !== 'all' && t.status !== ui.taskStatusFilter) return false;
        return true;
      });

      const listHtml = filtered.length === 0
        ? '<div class="card empty-state">Задач за обраним фільтром немає.</div>'
        : filtered.map(function(t) {
            const isAll = t.recipientType === 'all_leaders';
            const sq = isAll ? { color: '#eab308' } : getSquadById(t.squadId);
            const recLbl = isAll ? 'Усім командирам відділень' : formatSquadRecipient(sq);
            const rOpen = Boolean(ui.openTaskRemarks[t.id]), hasRem = Boolean(t.remark && t.remark.trim());
            return '<div class="task-card" style="border-left:4px solid ' + sq.color + '">' +
              '<div class="row-between"><div class="stack-sm" style="gap:3px">' +
                '<span class="badge" style="background:' + sq.color + '24;color:' + sq.color + ';border:1px solid ' + sq.color + '55;align-self:flex-start">' + esc(recLbl) + '</span>' +
                '<div class="text-xs text-muted">' + esc(t.createdAt) + ' • Поставив: <strong style="color:var(--text)">' + esc(t.author || '—') + '</strong></div></div>' +
                '<button class="btn-icon btn-icon-sm danger" onclick="deleteTask(\'' + t.id + '\')">✕</button></div>' +
              '<div style="font-size:14.5px;font-weight:600;color:#fff;white-space:pre-wrap">' + esc(t.text) + '</div>' +
              '<div class="status-group">' +
                '<button class="status-btn ' + (t.status === 'received' ? 'st-received' : '') + '" onclick="setTaskStatus(\'' + t.id + '\',\'received\')">Отримав задачу</button>' +
                '<button class="status-btn ' + (t.status === 'done' ? 'st-done' : '') + '" onclick="setTaskStatus(\'' + t.id + '\',\'done\')">Виконано</button>' +
                '<button class="status-btn ' + (t.status === 'failed' ? 'st-failed' : '') + '" onclick="setTaskStatus(\'' + t.id + '\',\'failed\')">Не виконано</button></div>' +
              '<button class="btn btn-sm btn-secondary btn-full" onclick="toggleTaskRemark(\'' + t.id + '\')">' +
                (rOpen ? '▾ Приховати зауваження' : '▸ Зауваження') + (hasRem ? ' <span class="badge badge-warn">Є запис</span>' : '') + '</button>' +
              (rOpen ? '<div class="stack-sm"><textarea id="rem-' + t.id + '" class="textarea" placeholder="Причина невиконання або зауваження..." oninput="updateTaskRemark(\'' + t.id + '\',this.value)">' + esc(t.remark || '') + '</textarea>' +
                '<button type="button" class="btn btn-sm btn-primary btn-full" onclick="saveTaskRemarkBtn(\'' + t.id + '\')">Зберегти зауваження</button></div>' : '') +
            '</div>';
          }).join('');

      return formCard + recPills + stPills +
        (state.tasks.length ? '<button class="btn btn-sm btn-secondary btn-full" onclick="copyActiveTasks()">Скопіювати активні задачі</button>' : '') +
        listHtml;
    }

    function submitNewTask(e) {
      e.preventDefault();
      const rec = document.getElementById('task-rec').value;
      const text = document.getElementById('task-text').value.trim();
      const author = document.getElementById('task-author').value.trim();
      if (!text) return;
      const isAll = rec === 'all_leaders';
      state.tasks.unshift({
        id: genId('task'), recipientType: isAll ? 'all_leaders' : 'squad',
        squadId: isAll ? '' : rec.replace('squad:', ''), text: text, author: author,
        status: 'received', remark: '', createdAt: formatDateTimeNow()
      });
      saveState(); render(); showToast('Задачу поставлено');
    }

    function setTaskStatus(id, st) {
      const t = state.tasks.find(function(x) { return x.id === id; }); if (!t) return;
      t.status = st;
      if (st === 'failed') ui.openTaskRemarks[id] = true;
      saveState(); render();
    }
    function toggleTaskRemark(id) { ui.openTaskRemarks[id] = !ui.openTaskRemarks[id]; render(); }
    function updateTaskRemark(id, v) { const t = state.tasks.find(function(x) { return x.id === id; }); if (t) { t.remark = v; saveState(); } }
    function saveTaskRemarkBtn(id) { const el = document.getElementById('rem-' + id); if (el) updateTaskRemark(id, el.value); showToast('Зауваження збережено'); render(); }
    function deleteTask(id) {
      showConfirm('Видалити задачу?', 'Задача та зауваження будуть видалені.', 'Видалити', function() {
        state.tasks = state.tasks.filter(function(x) { return x.id !== id; });
        saveState(); render(); showToast('Задачу видалено');
      }, true);
    }
    function copyActiveTasks() {
      const active = state.tasks.filter(function(t) { return t.status !== 'done'; });
      if (!active.length) { showToast('Немає активних задач', 'error'); return; }
      const lines = ['Активні задачі (' + (state.groupNumber || '223') + '):'];
      active.forEach(function(t, i) {
        const rec = t.recipientType === 'all_leaders' ? 'Усім командирам відділень' : formatSquadRecipient(getSquadById(t.squadId));
        lines.push('\n' + (i + 1) + '. [' + rec + '] — ' + (t.status === 'failed' ? 'Не виконано' : 'Отримав задачу'));
        lines.push(t.text);
        if (t.author) lines.push('Поставив: ' + t.author);
        if (t.remark && t.remark.trim()) lines.push('Зауваження: ' + t.remark.trim());
      });
      copyText(lines.join('\n'), 'Активні задачі скопійовано');
    }

    // =========================================================================
    // 7. ВКЛАДКА 3: РОЗХІД + ПЛАНУВАННЯ НА МАЙБУТНІ ДАТИ
    // =========================================================================
    function ensureRozkhidDay(iso) {
      if (!state.rozkhidByDate[iso] || typeof state.rozkhidByDate[iso] !== 'object') {
        state.rozkhidByDate[iso] = { cleared: false, manual: {}, offsets: {} };
      }
      if (!state.rozkhidByDate[iso].manual) state.rozkhidByDate[iso].manual = {};
      if (!state.rozkhidByDate[iso].offsets) state.rozkhidByDate[iso].offsets = {};
      return state.rozkhidByDate[iso];
    }

    function getSurnameCounts() {
      const m = {};
      state.personnel.forEach(function(p) {
        const sn = (String(p.fullName || '').trim().split(/\s+/)[0] || '').toLowerCase();
        m[sn] = (m[sn] || 0) + 1;
      });
      return m;
    }

    function formatReportSurname(s, counts) {
      const parts = String(s.fullName || '').trim().split(/\s+/);
      const sn = parts[0] || '';
      return (counts[sn.toLowerCase()] > 1 && parts[1]) ? (sn + ' ' + parts[1].charAt(0).toUpperCase() + '.') : sn;
    }

    // Автосинхронізація з суворою унікальністю (1 боєць = макс. 1 категорія)
    function computeRozkhid(iso) {
      const yest = addDaysISO(iso, -1);
      const todayDuty = new Set(state.duties.filter(function(d) { return d.date === iso; }).map(function(d) { return d.soldierId; }));
      const yestDuty = new Set(state.duties.filter(function(d) { return d.date === yest; }).map(function(d) { return d.soldierId; }));
      const dayData = state.rozkhidByDate[iso] || { cleared: false, manual: {}, offsets: {} };
      const snCounts = getSurnameCounts();

      const schedMap = {};
      state.scheduledAbsences.forEach(function(a) {
        if (iso >= a.startDate && iso <= (a.endDate || a.startDate)) schedMap[a.soldierId] = a.category;
      });

      const statusBySoldier = {}, byCat = {};
      ROZKHID_CATS.forEach(function(c) { byCat[c.key] = []; });

      getOrderedSquads().forEach(function(sq) {
        sortSquadPersonnel(state.personnel.filter(function(p) { return p.squadId === sq.id; })).forEach(function(s) {
          let cat = 'in_service';
          if (dayData.manual && dayData.manual[s.id]) cat = dayData.manual[s.id];
          else if (dayData.cleared) cat = 'in_service';
          else if (schedMap[s.id]) cat = schedMap[s.id];
          else if (todayDuty.has(s.id)) cat = 'n';
          else if (yestDuty.has(s.id)) cat = 'starodobovyi';
          else if (PERM_ABSENT_KEYS.has(s.presenceStatus)) cat = s.presenceStatus;

          statusBySoldier[s.id] = cat;
          if (byCat[cat]) byCat[cat].push({ soldier: s, reportName: formatReportSurname(s, snCounts) });
        });
      });

      let totalAbsent = 0;
      const categories = ROZKHID_CATS.map(function(c) {
        const list = byCat[c.key] || [];
        const offset = Math.max(0, Number((dayData.offsets && dayData.offsets[c.key]) || 0));
        const count = list.length + offset;
        totalAbsent += count;
        return { key: c.key, label: c.label, hint: c.hint, soldiers: list, offset: offset, count: count };
      });

      const totalList = state.personnel.length;
      return { totalList: totalList, presentCount: Math.max(0, totalList - totalAbsent), totalAbsent: totalAbsent, categories: categories, statusBySoldier: statusBySoldier };
    }

    function generateRozkhidReport() {
      const data = computeRozkhid(ui.rozkhidDate);
      const lines = [(state.groupNumber || '223').trim() || '223', 'З/с - ' + data.totalList, 'Вн - ' + data.presentCount];
      data.categories.forEach(function(c) {
        if (ui.rozkhidHideZeros && c.count === 0) return;
        let line = c.label + ' - ' + c.count;
        if (ui.rozkhidShowNames && c.soldiers.length) {
          line += ' (' + c.soldiers.map(function(x) { return x.reportName; }).join(', ') + ')';
        }
        lines.push(line);
      });
      return lines.join('\n');
    }

    function setRozkhidDate(iso) { if (iso) { ui.rozkhidDate = iso; render(); } }
    function shiftRozkhidDate(d) { ui.rozkhidDate = addDaysISO(ui.rozkhidDate, d); render(); }
    function updateGroupNumber(v) {
      state.groupNumber = v.trim(); saveState();
      const pre = document.getElementById('rozkhid-preview'); if (pre) pre.textContent = generateRozkhidReport();
    }
    function toggleRozkhidOption(opt, checked) {
      if (opt === 'names') ui.rozkhidShowNames = checked;
      if (opt === 'hideZeros') ui.rozkhidHideZeros = checked;
      const pre = document.getElementById('rozkhid-preview'); if (pre) pre.textContent = generateRozkhidReport();
    }
    function adjustRozkhidOffset(k, d) {
      const day = ensureRozkhidDay(ui.rozkhidDate);
      day.offsets[k] = Math.max(0, (Number(day.offsets[k]) || 0) + d);
      saveState(); render();
    }
    function promptClearRozkhid() {
      showConfirm('Очистити розхід?', 'Усі відсутності на ' + formatHumanDate(ui.rozkhidDate) + ' будуть обнулені (Вн = З/с).', 'Очистити', function() {
        state.rozkhidByDate[ui.rozkhidDate] = { cleared: true, manual: {}, offsets: {} };
        saveState(); render(); showToast('Розхід очищено');
      }, true);
    }
    function autoSyncRozkhid() {
      delete state.rozkhidByDate[ui.rozkhidDate];
      saveState(); render(); showToast('Автопідтягнуто з нарядів, планів та складу');
    }
    function toggleUpcomingAccordion() { ui.rozkhidUpcomingOpen = !ui.rozkhidUpcomingOpen; render(); }
    function deleteScheduledAbsence(id) {
      state.scheduledAbsences = state.scheduledAbsences.filter(function(a) { return a.id !== id; });
      saveState(); render(); showToast('Запланований запис видалено');
    }

    function renderRozkhidTab() {
      const data = computeRozkhid(ui.rozkhidDate);
      const td = todayISO(), tmrw = addDaysISO(td, 1);

      const upcoming = state.scheduledAbsences
        .filter(function(a) { return (a.endDate || a.startDate) >= td && Boolean(getSoldierById(a.soldierId)); })
        .sort(function(a, b) { return a.startDate.localeCompare(b.startDate); });

      const upcomingHtml = !upcoming.length ? '' : (
        '<div class="card-flush" style="border-color:rgba(56,189,248,0.35)">' +
          '<div class="acc-header ' + (ui.rozkhidUpcomingOpen ? 'open' : '') + '" onclick="toggleUpcomingAccordion()">' +
            '<div class="row"><span class="chevron">▸</span><span class="section-title" style="color:var(--blue)">Заплановано на майбутні дати (' + upcoming.length + ')</span></div></div>' +
          (ui.rozkhidUpcomingOpen ? '<div class="acc-body" style="padding:10px;display:flex;flex-direction:column;gap:6px">' +
            upcoming.map(function(a) {
              const s = getSoldierById(a.soldierId), cat = getRozkhidCat(a.category);
              const dLbl = (a.endDate && a.endDate !== a.startDate) ? (formatDayMonth(a.startDate) + '–' + formatDayMonth(a.endDate)) : formatDayMonth(a.startDate);
              return '<div class="sched-item"><button type="button" class="min0" style="text-align:left" onclick="setRozkhidDate(\'' + a.startDate + '\')">' +
                '<div class="text-sm fw-bold" style="color:#fff">' + esc(dLbl) + ' — ' + esc(s.fullName) + ' <span class="badge badge-info">' + esc(cat.label) + '</span></div>' +
                (a.note ? '<div class="text-xs text-muted">' + esc(a.note) + '</div>' : '') + '</button>' +
                '<button type="button" class="btn-icon btn-icon-sm danger" onclick="deleteScheduledAbsence(\'' + a.id + '\')">✕</button></div>';
            }).join('') + '</div>' : '') + '</div>'
      );

      const catRows = data.categories.map(function(c) {
        const chips = c.soldiers.length ? '<div class="chips-wrap">' + c.soldiers.map(function(x) { return '<span class="name-chip">' + esc(x.reportName) + '</span>'; }).join('') + '</div>' : '';
        return '<div class="rozkhid-row ' + (c.count > 0 ? 'has-count' : '') + '">' +
          '<div class="row-between"><div class="min0">' +
            '<div class="text-sm fw-bold" style="color:' + (c.count > 0 ? '#fbbf24' : '#fff') + '">' + esc(c.label) + '</div>' +
            '<div class="text-xs text-muted">' + esc(c.hint) + '</div></div>' +
            '<div class="stepper">' +
              '<button type="button" class="step-btn" onclick="adjustRozkhidOffset(\'' + c.key + '\',-1)">−</button>' +
              '<span class="step-val" style="color:' + (c.count > 0 ? '#fbbf24' : 'var(--muted)') + '">' + c.count + '</span>' +
              '<button type="button" class="step-btn" onclick="adjustRozkhidOffset(\'' + c.key + '\',1)">+</button>' +
              '<button type="button" class="btn btn-xs btn-secondary" onclick="openRozkhidPicker(\'' + c.key + '\')">ПІБ</button>' +
            '</div></div>' + chips + '</div>';
      }).join('');

      return (
        '<div class="card stack">' +
          '<div class="row">' +
            '<button class="btn-icon" onclick="shiftRozkhidDate(-1)">◀</button>' +
            '<input type="date" class="input" style="flex:1;min-height:40px;padding:6px 10px" value="' + esc(ui.rozkhidDate) + '" onchange="setRozkhidDate(this.value)" />' +
            '<button class="btn-icon" onclick="shiftRozkhidDate(1)">▶</button></div>' +
          '<div class="row">' +
            '<button class="btn btn-sm ' + (ui.rozkhidDate === td ? 'btn-primary' : 'btn-secondary') + '" style="flex:1" onclick="setRozkhidDate(\'' + td + '\')">Сьогодні</button>' +
            '<button class="btn btn-sm ' + (ui.rozkhidDate === tmrw ? 'btn-primary' : 'btn-secondary') + '" style="flex:1" onclick="setRozkhidDate(\'' + tmrw + '\')">Завтра</button>' +
            '<input type="text" class="input" style="width:92px;min-height:36px;padding:6px 10px;text-align:center;font-weight:800" value="' + esc(state.groupNumber) + '" placeholder="223" oninput="updateGroupNumber(this.value)" /></div>' +
          '<div class="grid-3">' +
            '<button class="btn btn-sm btn-info" onclick="openScheduleAbsenceModal()">Запланувати</button>' +

            '<button class="btn btn-sm btn-danger" onclick="promptClearRozkhid()">Очистити</button></div>' +

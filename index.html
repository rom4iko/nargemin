<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1015" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Помічник взводу v2.7</title>
  <style>
    /* =========================================================================
       БАЗОВІ ЗМІННІ ТА ТЕМНА ТАКТИЧНА ТЕМА
       ========================================================================= */
    :root {
      --bg: #0b1015;
      --bg-elev: #131b24;
      --card: #161f2a;
      --card-hover: #1d2836;
      --border: #263342;
      --border-strong: #35475c;
      --text: #e7eef5;
      --muted: #8b9bb0;
      --olive: #4b7a3d;
      --olive-hover: #3e6632;
      --accent: #4ade80;
      --blue: #38bdf8;
      --amber: #f59e0b;
      --danger: #ef4444;
      --purple: #a855f7;
      --radius: 14px;
      --radius-sm: 10px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.42;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    input[type="date"] {
      color-scheme: dark;
    }

    /* =========================================================================
       КОНТЕЙНЕР, ШАПКА ТА НАВІГАЦІЯ
       ========================================================================= */
    .app {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(82px + var(--safe-bottom));
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: calc(10px + var(--safe-top)) 14px 10px;
      background: rgba(11, 16, 21, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(75, 122, 61, 0.22);
      border: 1px solid rgba(74, 222, 128, 0.35);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.2px;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.2;
    }

    .ver-pill {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent);
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.32);
      padding: 3px 9px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .main {
      flex: 1;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(19, 27, 36, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
    }

    .nav-inner {
      max-width: 600px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      height: 64px;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--muted);
      transition: color 0.15s;
      min-height: 44px;
    }

    .nav-btn.active {
      color: var(--accent);
    }

    /* =========================================================================
       КАРТКИ, СІТКИ ТА ТИПОГРАФІКА
       ========================================================================= */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }

    .card-flush {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .stack { display: flex; flex-direction: column; gap: 10px; }
    .stack-sm { display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .wrap { flex-wrap: wrap; }
    .min0 { min-width: 0; flex: 1; }

    .text-xs { font-size: 12px; }
    .text-sm { font-size: 13.5px; }
    .text-muted { color: var(--muted); }
    .fw-bold { font-weight: 700; }
    .fw-800 { font-weight: 800; }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .empty-state {
      text-align: center;
      padding: 22px 12px;
      color: var(--muted);
      font-size: 13.5px;
    }

    /* =========================================================================
       КНОПКИ ТА ПОЛЯ ВВОДУ (44px+ TOUCH TARGETS)
       ========================================================================= */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      padding: 9px 14px;
      border-radius: 11px;
      font-weight: 700;
      font-size: 13.5px;
      transition: transform 0.1s, background 0.15s, border-color 0.15s;
      text-align: center;
    }

    .btn:active { transform: scale(0.98); }
    .btn-sm { min-height: 36px; padding: 6px 11px; font-size: 12px; border-radius: 9px; }
    .btn-xs { min-height: 30px; padding: 4px 9px; font-size: 11.5px; border-radius: 8px; }
    .btn-full { width: 100%; }

    .btn-primary { background: var(--olive); color: #ffffff; }
    .btn-primary:hover { background: var(--olive-hover); }

    .btn-secondary {
      background: var(--bg-elev);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--card-hover); }

    .btn-info {
      background: rgba(56, 189, 248, 0.14);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .btn-warn {
      background: rgba(245, 158, 11, 0.14);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    .btn-icon-sm {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      font-size: 14px;
    }

    .btn-icon.danger {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field-label { font-size: 12px; font-weight: 700; color: var(--muted); }

    .input, .select, .textarea {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: #ffffff;
      outline: none;
      transition: border-color 0.15s;
    }

    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--accent);
    }

    .textarea {
      min-height: 84px;
      resize: vertical;
    }

    .chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* =========================================================================
       ПІДВКЛАДКИ, ФІЛЬТРИ ТА БЕЙДЖІ
       ========================================================================= */
    .seg-control {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: 12px;
    }

    .seg-btn {
      min-height: 38px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      transition: background 0.15s, color 0.15s;
    }

    .seg-btn.active {
      background: var(--olive);
      color: #ffffff;
    }

    .pills-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .pills-scroll::-webkit-scrollbar { display: none; }

    .pill {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .pill.active {
      background: var(--olive);
      border-color: var(--olive);
      color: #ffffff;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-kg { background: rgba(234, 179, 8, 0.2); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.4); }
    .badge-kv { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-ok { background: rgba(74, 222, 128, 0.16); color: #86efac; border: 1px solid rgba(74, 222, 128, 0.3); }
    .badge-info { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-warn { background: rgba(245, 158, 11, 0.18); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35); }
    .badge-err { background: rgba(239, 68, 68, 0.18); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }
    .badge-muted { background: rgba(139, 155, 176, 0.15); color: #cbd5e1; border: 1px solid rgba(139, 155, 176, 0.25); }

    /* =========================================================================
       КАЛЕНДАР ТА ПАНЕЛЬ ДАТИ
       ========================================================================= */
    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
    }

    .date-bar-title {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      flex: 1;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      margin-bottom: 6px;
    }

    .cal-weekdays div { font-size: 11px; font-weight: 700; color: var(--muted); }
    .cal-weekdays .wknd { color: #fbbf24; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-cell {
      height: 46px;
      border-radius: 9px;
      border: 1px solid transparent;
      background: rgba(11, 16, 21, 0.55);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 5px 2px;
    }

    .cal-cell.today { border-color: rgba(74, 222, 128, 0.55); }
    .cal-cell.selected {
      background: rgba(75, 122, 61, 0.38);
      border-color: var(--accent);
      color: #ffffff;
    }

    .cal-num { font-size: 12.5px; font-weight: 700; line-height: 1; }
    .cal-dots { display: flex; gap: 2px; height: 6px; align-items: center; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; }

    /* =========================================================================
       АКОРДЕОНИ, КАРТКИ БІЙЦІВ, СТАТУСИ ПРИСУТНОСТІ
       ========================================================================= */
    .acc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 48px;
      padding: 10px 12px;
      background: rgba(11, 16, 21, 0.55);
      cursor: pointer;
      user-select: none;
    }

    .chevron {
      display: inline-block;
      transition: transform 0.18s;
      color: var(--muted);
      flex-shrink: 0;
      font-size: 13px;
    }

    .acc-header.open .chevron {
      transform: rotate(90deg);
      color: #ffffff;
    }

    .acc-body {
      border-top: 1px solid var(--border);
    }

    .soldier-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg);
    }

    .soldier-name {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .presence-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .presence-btn {
      min-height: 36px;
      padding: 6px 8px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      transition: all 0.12s;
    }

    .presence-btn.active-ok {
      background: rgba(74, 222, 128, 0.2);
      border-color: var(--accent);
      color: #86efac;
    }

    .presence-btn.active-warn {
      background: rgba(245, 158, 11, 0.22);
      border-color: var(--amber);
      color: #fde68a;
    }

    /* =========================================================================
       ЗАДАЧІ
       ========================================================================= */
    .task-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .status-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .status-btn {
      min-height: 38px;
      padding: 6px 4px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 700;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
    }

    .status-btn.st-received {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--blue);
      color: #7dd3fc;
    }
    .status-btn.st-done {
      background: rgba(34, 197, 94, 0.22);
      border-color: #22c55e;
      color: #86efac;
    }
    .status-btn.st-failed {
      background: rgba(239, 68, 68, 0.22);
      border-color: var(--danger);
      color: #fca5a5;
    }

    /* =========================================================================
       РОЗХІД ТА KPI
       ========================================================================= */
    .kpi-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px;
      text-align: center;
    }

    .kpi-val { font-size: 20px; font-weight: 800; color: #ffffff; }
    .kpi-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .rozkhid-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 9px 10px;
      border-radius: 11px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .rozkhid-row.has-count {
      border-color: rgba(245, 158, 11, 0.45);
    }

    .stepper { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }

    .step-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .step-val {
      min-width: 24px;
      text-align: center;
      font-weight: 800;
      font-size: 14px;
    }

    .name-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fde68a;
    }

    .sched-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .preview-pre {
      margin: 0;
      padding: 12px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: #e7eef5;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.48;
    }

    .toggle-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-pill input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      flex-shrink: 0;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 48px;
      padding: 10px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: var(--accent);
      flex-shrink: 0;
    }

    /* =========================================================================
       МОДАЛЬНІ ВІКНА ТА СПОВІЩЕННЯ (TOAST)
       ========================================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open { display: flex; }

    @media (min-width: 520px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }

    .modal-box {
      width: 100%;
      max-width: 540px;
      max-height: 92vh;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px 18px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-bottom: var(--safe-bottom);
    }

    @media (min-width: 520px) {
      .modal-box { border-radius: 18px; padding-bottom: 0; }
    }

    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .modal-title { font-size: 16px; font-weight: 800; color: #ffffff; }

    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toast-root {
      position: fixed;
      top: calc(62px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      width: 92%;
      max-width: 390px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .toast {
      padding: 10px 14px;
      border-radius: 11px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      background: #1b2836;
      border: 1px solid rgba(74, 222, 128, 0.55);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .toast.error {
      background: #3a171c;
      border-color: rgba(239, 68, 68, 0.65);
      color: #fecaca;
    }

    .color-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
    }
    .color-swatch.selected {
      border-color: #ffffff;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Компактна верхня шапка -->
    <header class="header">
      <div class="brand">

  <!-- Модальне вікно -->
  <div id="modal-root" class="modal-backdrop" onclick="if(event.target.id==='modal-root') closeModal()">
    <div id="modal-box" class="modal-box"></div>
  </div>

  <!-- Сповіщення Toast -->
  <div id="toast-root" class="toast-root"></div>

  <!-- Прихований інпут імпорту JSON -->
  <input type="file" id="import-json-input" accept=".json,application/json" style="display:none" onchange="handleImportJSON(event)" />

  <script>
    // =========================================================================
    // КОНСТАНТИ, ДОВІДНИКИ ТА СХЕМА ДАНИХ
    // =========================================================================
    const APP_VERSION = 'v2.7';
    const APP_UPDATED = '20.11.2026';
    const STORAGE_KEY = 'pomichnyk_vzvodu_v27';
    const LEGACY_KEYS = [
      'pomichnyk_vzvodu_data',
      'pomichnyk_vzvodu_v3',
      'pomichnyk_vzvodu_v2',
      'pomichnyk_vzvodu_v1',
      'platoon_helper_state',
      'platoon_duty_tracker_v1'
    ];

    const MONTHS_UK = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
    const MONTHS_GEN = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
    const WEEKDAYS_UK = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
    const PALETTE = ['#eab308','#3b82f6','#10b981','#f97316','#ef4444','#38bdf8','#a855f7','#ec4899'];
    const QUICK_RANKS = ['солдат', 'ст. солдат', 'мол. сержант', 'сержант'];

    const DEFAULT_SQUADS = [
      { id: 'cmd', name: 'Командир групи', color: '#eab308', isCmdGroup: true },
      { id: 'sq1', name: '1-ше відділення', color: '#3b82f6', isCmdGroup: false },
      { id: 'sq2', name: '2-ге відділення', color: '#10b981', isCmdGroup: false },
      { id: 'sq3', name: '3-тє відділення', color: '#f97316', isCmdGroup: false }
    ];

    const DEFAULT_DUTY_TYPES = [
      { id: 'chk', shortName: 'ЧК', name: 'Черговий курсу', maxCount: 1, color: '#ef4444' },
      { id: 'dn', shortName: 'Дн', name: 'Днювальні курсу', maxCount: 3, color: '#38bdf8' }
    ];

    // Точний порядок категорій у Розході (без розшифрувань у звіті)
    const ROZKHID_CATS = [
      { key: 'priyom_shpytal', label: 'Прийом шпиталь', hint: 'Прийом у шпиталі', schedulable: true },
      { key: 'priyom_lazaret', label: 'Прийом лазарет', hint: 'Прийом у лазареті', schedulable: true },
      { key: 'sh', label: 'Ш', hint: 'Шпиталь', schedulable: true },
      { key: 'l', label: 'Л', hint: 'Лазарет', schedulable: true },
      { key: 'vd', label: 'Вд', hint: 'Відрядження', schedulable: true },
      { key: 'vp', label: 'Вп', hint: 'Відпустка', schedulable: true },
      { key: 'n', label: 'Н', hint: 'Наряд (авто з графіка)', schedulable: false },
      { key: 'g', label: 'Г', hint: 'Гуртожиток', schedulable: true },
      { key: 'pk', label: 'Пк', hint: 'Поза казармою', schedulable: true },
      { key: 'hv', label: 'Хв', hint: 'Хворий', schedulable: true },
      { key: 'starodobovyi', label: 'Стародобовий', hint: 'Вчорашній наряд (авто)', schedulable: false }
    ];

    // Статуси присутності в картці бійця ("Склад")
    const PRESENCE_STATUSES = [
      { key: 'in_service', shortLabel: 'В строю', fullLabel: 'В строю', isOk: true },
      { key: 'sh', shortLabel: 'Ш', fullLabel: 'Ш (Шпиталь)', isOk: false },
      { key: 'l', shortLabel: 'Л', fullLabel: 'Л (Лазарет)', isOk: false },
      { key: 'vd', shortLabel: 'Вд', fullLabel: 'Вд (Відрядження)', isOk: false },
      { key: 'vp', shortLabel: 'Вп', fullLabel: 'Вп (Відпустка)', isOk: false },
      { key: 'g', shortLabel: 'Г', fullLabel: 'Г (Гуртожиток)', isOk: false },
      { key: 'pk', shortLabel: 'Пк', fullLabel: 'Пк (Поза казармою)', isOk: false },
      { key: 'hv', shortLabel: 'Хв', fullLabel: 'Хв (Хворий)', isOk: false }
    ];

    const PERM_ABSENT_KEYS = new Set(['sh', 'l', 'vd', 'vp', 'g', 'pk', 'hv']);

    // =========================================================================
    // СТАН ЗАСТОСУНКУ ТА UI
    // =========================================================================
    const nowInit = new Date();

    let state = {
      groupNumber: '223',
      squads: [],
      personnel: [],
      dutyTypes: [],
      duties: [],
      tasks: [],
      scheduledAbsences: [],
      rozkhidByDate: {},
      lastBackupAt: null
    };

    let ui = {
      activeTab: 'duties',
      dutiesSubTab: 'schedule',
      year: nowInit.getFullYear(),
      month: nowInit.getMonth(),
      selectedDate: toISO(nowInit),
      scheduleSquadFilter: 'all',
      // Задачі
      taskFormOpen: false,
      taskRecipientFilter: 'all',
      taskStatusFilter: 'all',
      openTaskRemarks: {},
      // Розхід
      rozkhidDate: toISO(nowInit),
      rozkhidShowNames: true,
      rozkhidHideZeros: false,
      rozkhidUpcomingOpen: true,
      rozkhidModalCat: '',
      rozkhidModalSearch: '',
      rozkhidModalOpenSquads: {},
      // Склад
      personnelSearch: '',
      personnelSquadFilter: 'all',
      openPersonnelSquads: { cmd: true, sq1: true, sq2: true, sq3: true },
      openSoldiers: {}
    };

    let assignModal = { date: '', dutyTypeId: '', selectedIds: [] };
    let tempColor = '#3b82f6';

    // =========================================================================
    // ДОПОМІЖНІ ФУНКЦІЇ
    // =========================================================================
    function genId(prefix) {
      return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
    }

    function toISO(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function todayISO() {
      return toISO(new Date());
    }

    function addDaysISO(iso, delta) {
      const p = String(iso).split('-').map(Number);
      const d = new Date(p[0], p[1] - 1, p[2] + delta);
      return toISO(d);
    }

    function formatHumanDate(iso) {
      if (!iso) return '—';
      const p = String(iso).split('-').map(Number);
      return p[2] + ' ' + MONTHS_GEN[p[1] - 1] + ' ' + p[0];
    }

    function formatDotDate(iso) {
      if (!iso) return '—';
      const p = String(iso).split('-');
      if (p.length !== 3) return iso;
      return p[2] + '.' + p[1] + '.' + p[0];
    }

    function formatDayMonth(iso) {
      if (!iso) return '—';
      const p = String(iso).split('-');
      if (p.length !== 3) return iso;
      return p[2] + '.' + p[1];
    }

    function monthPrefix(y, m) {
      return y + '-' + String(m + 1).padStart(2, '0');
    }

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Автоматична велика літера на початку кожного слова (ПІБ)
    function capitalizePIB(str) {
      return String(str || '').replace(/(^|[\s-])([а-яіїєґa-z])/gi, function(m, sep, ch) {
        return sep + ch.toUpperCase();
      });
    }

    function isCmdGroup(sq) {
      return Boolean(sq && (sq.isCmdGroup || sq.isGroupCmd || sq.id === 'cmd' || sq.id === 'sq_group_cmd'));
    }

    // Універсальний порядок відділень: Командир групи → 1-ше → 2-ге → 3-тє → інші
    function getOrderedSquads() {
      const list = Array.isArray(state.squads) ? state.squads : [];
      const cmd = list.filter(isCmdGroup);
      const rest = list.filter(function(s) { return !isCmdGroup(s); });
      return cmd.concat(rest);
    }

    function getSquadById(id) {
      return state.squads.find(function(s) { return s.id === id; }) || { id: id, name: 'Без відділення', color: '#64748b', isCmdGroup: false };
    }

    function getSoldierById(id) {
      return state.personnel.find(function(p) { return p.id === id; });
    }

    function getDutyTypeById(id) {
      return state.dutyTypes.find(function(dt) { return dt.id === id; }) || { id: id, shortName: 'Наряд', name: 'Наряд', maxCount: 1, color: '#64748b' };
    }

    function getRozkhidCat(key) {
      return ROZKHID_CATS.find(function(c) { return c.key === key; }) || { key: key, label: key, hint: '' };
    }

    function getPresenceMeta(key) {
      return PRESENCE_STATUSES.find(function(p) { return p.key === key; }) || PRESENCE_STATUSES[0];
    }

    // Універсальне сортування всередині відділення: командир зверху, далі за алфавітом
    function sortSquadPersonnel(list) {
      return list.slice().sort(function(a, b) {
        if (a.isLeader && !b.isLeader) return -1;
        if (!a.isLeader && b.isLeader) return 1;
        return String(a.fullName || '').localeCompare(String(b.fullName || ''), 'uk');
      });
    }

    function getSoldierDutyStats(soldierId, y, m) {
      const pref = monthPrefix(y, m);
      let monthCount = 0;
      let totalCount = 0;
      let lastDate = '';
      for (let i = 0; i < state.duties.length; i++) {
        const d = state.duties[i];
        if (d.soldierId === soldierId) {
          totalCount++;
          if (d.date && d.date.indexOf(pref) === 0) monthCount++;
          if (d.date && (!lastDate || d.date > lastDate)) lastDate = d.date;
        }
      }
      return { monthCount: monthCount, totalCount: totalCount, lastDate: lastDate };
    }

    function getUpcomingAbsencesForSoldier(soldierId) {
      const td = todayISO();
      return state.scheduledAbsences
        .filter(function(a) {
          return a.soldierId === soldierId && (a.endDate || a.startDate) >= td;
        })
        .sort(function(a, b) { return a.startDate.localeCompare(b.startDate); });
    }

    function formatSquadRecipient(sq) {
      const m = String(sq.name || '').match(/^(\d+)/);
      if (m) return 'Командиру ' + m[1] + '-го відділення';
      return 'Командиру (' + sq.name + ')';
    }

    function formatSquadShortTab(sq) {
      const m = String(sq.name || '').match(/^(\d+-\S+)/);
      if (m) return m[1] + ' відд.';
      return sq.name;
    }

    // =========================================================================
    // БЕЗПЕЧНЕ ЗБЕРЕЖЕННЯ ТА МІГРАЦІЯ З ПОПЕРЕДНІХ ВЕРСІЙ (v2.3 – v2.6.1)
    // =========================================================================
    function createFreshState() {
      return {
        groupNumber: '223',
        squads: JSON.parse(JSON.stringify(DEFAULT_SQUADS)),
        personnel: [],
        dutyTypes: JSON.parse(JSON.stringify(DEFAULT_DUTY_TYPES)),
        duties: [],
        tasks: [],
        scheduledAbsences: [],
        rozkhidByDate: {},
        lastBackupAt: null
      };
    }

    function mapLegacyStatusToKey(val) {
      if (!val) return 'in_service';
      const v = String(val).trim();
      const map = {
        'active': 'in_service',
        'in_service': 'in_service',
        'Вн': 'in_service',
        'В строю': 'in_service',
        'Прийом шпиталь': 'priyom_shpytal',
        'priyom_shpytal': 'priyom_shpytal',
        'Прийом лазарет': 'priyom_lazaret',
        'priyom_lazaret': 'priyom_lazaret',
        'Ш': 'sh', 'sh': 'sh',
        'Л': 'l', 'l': 'l', 'medical': 'l',
        'Вд': 'vd', 'vd': 'vd', 'trip': 'vd',
        'Вп': 'vp', 'vp': 'vp', 'leave': 'vp',
        'Н': 'n', 'n': 'n',
        'Г': 'g', 'g': 'g',
        'Пк': 'pk', 'pk': 'pk',
        'Хв': 'hv', 'hv': 'hv',
        'Стародобовий': 'starodobovyi',
        'starodobovyi': 'starodobovyi'
      };
      return map[v] || 'in_service';
    }

    function normalizeStateObject(parsed) {
      if (!parsed || typeof parsed !== 'object') return createFreshState();

      // 1. Відділення
      let rawSquads = Array.isArray(parsed.squads) && parsed.squads.length
        ? parsed.squads.slice()
        : JSON.parse(JSON.stringify(DEFAULT_SQUADS));

      const hasCmd = rawSquads.some(isCmdGroup);
      if (!hasCmd) {
        rawSquads.unshift({ id: 'cmd', name: 'Командир групи', color: '#eab308', isCmdGroup: true });
      }
      const squads = rawSquads.map(function(sq, idx) {
        return {
          id: sq.id || genId('sq'),
          name: String(sq.name || ('Відділення ' + idx)),
          color: sq.color || PALETTE[idx % PALETTE.length],
          isCmdGroup: isCmdGroup(sq)
        };
      });

      // 2. Особовий склад (personnel або legacy soldiers)
      const rawPeople = Array.isArray(parsed.personnel)
        ? parsed.personnel
        : (Array.isArray(parsed.soldiers) ? parsed.soldiers : []);
      const defaultNonCmdId = (squads.find(function(s) { return !s.isCmdGroup; }) || squads[0]).id;

      const personnel = rawPeople.map(function(p) {
        const mappedSt = mapLegacyStatusToKey(p.presenceStatus || p.status);
        const safePresence = PERM_ABSENT_KEYS.has(mappedSt) ? mappedSt : 'in_service';
        return {
          id: p.id || genId('p'),
          fullName: capitalizePIB(String(p.fullName || p.name || '').trim()),
          rank: String(p.rank || '').trim(),
          squadId: p.squadId || defaultNonCmdId,
          isLeader: Boolean(p.isLeader || p.isCommander),
          presenceStatus: safePresence
        };
      }).filter(function(p) { return p.fullName.length > 0; });

      // 3. Види нарядів
      const rawTypes = Array.isArray(parsed.dutyTypes) && parsed.dutyTypes.length
        ? parsed.dutyTypes
        : JSON.parse(JSON.stringify(DEFAULT_DUTY_TYPES));
      const dutyTypes = rawTypes.map(function(dt, idx) {
        const shortN = String(dt.shortName || dt.name || 'Наряд').trim();
        const fullN = String(dt.shortName ? (dt.name || '') : (dt.desc || '')).trim();
        const isDn = shortN.toLowerCase() === 'дн' || fullN.toLowerCase().indexOf('днювальн') !== -1;
        const maxC = Math.min(10, Math.max(1, Number(dt.maxCount || dt.maxPeople) || (isDn ? 3 : 1)));
        return {
          id: dt.id || genId('dt'),
          shortName: shortN,
          name: fullN || shortN,
          maxCount: maxC,
          color: dt.color || PALETTE[(idx + 4) % PALETTE.length]
        };
      });

      // 4. Наряди
      const duties = Array.isArray(parsed.duties) ? parsed.duties.map(function(d) {
        return {
          id: d.id || genId('d'),
          date: String(d.date || ''),
          soldierId: String(d.soldierId || ''),
          dutyTypeId: String(d.dutyTypeId || (dutyTypes[0] ? dutyTypes[0].id : 'chk'))
        };
      }).filter(function(d) { return d.date && d.soldierId; }) : [];

      // 5. Задачі
      const tasks = Array.isArray(parsed.tasks) ? parsed.tasks.map(function(t) {
        const isAll = t.recipientType === 'all_leaders' || t.targetType === 'all_commanders';
        return {
          id: t.id || genId('task'),
          recipientType: isAll ? 'all_leaders' : 'squad',
          squadId: isAll ? '' : String(t.squadId || t.targetSquadId || defaultNonCmdId),
          text: String(t.text || ''),
          author: String(t.author || t.issuer || ''),
          status: (t.status === 'done' || t.status === 'failed') ? t.status : 'received',
          remark: String(t.remark !== undefined ? t.remark : (t.note || '')),
          createdAt: String(t.createdAt || formatDateTimeNow())
        };
      }).filter(function(t) { return t.text.length > 0; }) : [];

      // 6. Заплановані відсутності
      const scheduledAbsences = Array.isArray(parsed.scheduledAbsences) ? parsed.scheduledAbsences.map(function(a) {
        return {
          id: a.id || genId('sched'),
          soldierId: String(a.soldierId || ''),
          category: mapLegacyStatusToKey(a.category),
          startDate: String(a.startDate || ''),
          endDate: String(a.endDate || ''),
          note: String(a.note || '')
        };
      }).filter(function(a) { return a.soldierId && a.startDate && a.category !== 'in_service'; }) : [];

      // 7. Розхід по датах (rozkhidByDate або legacy rozkhid)
      const rozkhidByDate = {};
      const rawRoz = parsed.rozkhidByDate || parsed.rozkhid || {};
      if (rawRoz && typeof rawRoz === 'object') {
        Object.keys(rawRoz).forEach(function(dateKey) {
          const item = rawRoz[dateKey];
          if (!item || typeof item !== 'object') return;
          const manual = {};
          const rawManual = item.manual || item.overrides || {};
          Object.keys(rawManual).forEach(function(sid) {
            manual[sid] = mapLegacyStatusToKey(rawManual[sid]);
          });
          const offsets = {};
          const rawOff = item.offsets || item.extra || {};
          Object.keys(rawOff).forEach(function(k) {
            const mk = mapLegacyStatusToKey(k);
            const num = Math.max(0, Number(rawOff[k]) || 0);
            if (mk !== 'in_service' && num > 0) offsets[mk] = num;
          });
          rozkhidByDate[dateKey] = {
            cleared: Boolean(item.cleared),
            manual: manual,
            offsets: offsets
          };
        });
      }

      return {
        groupNumber: (typeof parsed.groupNumber === 'string' && parsed.groupNumber.trim()) ? parsed.groupNumber.trim() : '223',
        squads: squads,
        personnel: personnel,
        dutyTypes: dutyTypes,
        duties: duties,
        tasks: tasks,
        scheduledAbsences: scheduledAbsences,
        rozkhidByDate: rozkhidByDate,
        lastBackupAt: parsed.lastBackupAt || null
      };
    }

    function formatDateTimeNow() {
      const d = new Date();
      return formatDotDate(toISO(d)) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    function loadState() {
      try {
        let raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          for (let i = 0; i < LEGACY_KEYS.length; i++) {
            const found = localStorage.getItem(LEGACY_KEYS[i]);
            if (found) {
              raw = found;
              break;
            }
          }
        }
        if (!raw) {
          state = createFreshState();
          saveState();
          return;
        }
        const parsed = JSON.parse(raw);
        state = normalizeStateObject(parsed);
        // Ініціалізуємо відкриті акордеони відділень у Складі
        state.squads.forEach(function(sq) {
          if (ui.openPersonnelSquads[sq.id] === undefined) ui.openPersonnelSquads[sq.id] = true;
        });
        saveState();
      } catch (err) {
        console.error('loadState error:', err);
        state = createFreshState();
        saveState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error('saveState error:', err);
        showToast('Не вдалося зберегти дані у браузері', 'error');
      }
    }

    // =========================================================================
    // СПОВІЩЕННЯ, МОДАЛКИ, НАДІЙНЕ КОПІЮВАННЯ (iOS SAFARI + ANDROID)
    // =========================================================================
    function showToast(msg, type) {
      const root = document.getElementById('toast-root');
      if (!root) return;
      const el = document.createElement('div');
      el.className = 'toast' + (type === 'error' ? ' error' : '');
      el.textContent = msg;
      root.appendChild(el);
      setTimeout(function() {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.2s';
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
      }, 2400);
    }

    function openModal(html) {
      const root = document.getElementById('modal-root');
      const box = document.getElementById('modal-box');
      if (!root || !box) return;
      box.innerHTML = html;
      root.classList.add('open');
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      if (root) root.classList.remove('open');
    }

    function showConfirm(title, message, btnText, onConfirm, isDanger) {
      openModal(
        '<div class="modal-header">' +
          '<div class="modal-title">' + esc(title) + '</div>' +
          '<button class="btn-icon btn-icon-sm" onclick="closeModal()" aria-label="Закрити">✕</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<div class="text-sm text-muted">' + esc(message) + '</div>' +
          '<div class="grid-2">' +
            '<button class="btn btn-secondary" onclick="closeModal()">Скасувати</button>' +
            '<button id="confirm-ok-btn" class="btn ' + (isDanger ? 'btn-danger' : 'btn-primary') + '">' + esc(btnText) + '</button>' +
          '</div>' +
        '</div>'
      );
      const ok = document.getElementById('confirm-ok-btn');
      if (ok) ok.onclick = function() { closeModal(); onConfirm(); };
    }

    function copyText(text, successMsg) {
      // Надійний метод через textarea (працює у iOS Safari та iFrame)
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) {
          showToast(successMsg || 'Скопійовано');
          return;
        }
      } catch (e) {}

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
          showToast(successMsg || 'Скопійовано');
        }).catch(function() {
          showToast('Не вдалося скопіювати автоматично', 'error');
        });
      } else {
        showToast('Не вдалося скопіювати автоматично', 'error');
      }
    }

    // =========================================================================
    // НАВІГАЦІЯ
    // =========================================================================
    function switchTab(tab) {
      ui.activeTab = tab;
      render();
      window.scrollTo(0, 0);
    }

    function setDutiesSubTab(sub) {
      ui.dutiesSubTab = sub;
      render();
    }

    function changeMonth(delta) {
      ui.month += delta;
      if (ui.month < 0) { ui.month = 11; ui.year--; }
      else if (ui.month > 11) { ui.month = 0; ui.year++; }
      const now = new Date();
      ui.selectedDate = (ui.year === now.getFullYear() && ui.month === now.getMonth())
        ? toISO(now)
        : monthPrefix(ui.year, ui.month) + '-01';
      render();
    }

    function goTodayCalendar() {
      const now = new Date();
      ui.year = now.getFullYear();
      ui.month = now.getMonth();
      ui.selectedDate = toISO(now);
      render();
    }

    function renderMonthBar(showTodayBtn) {
      return (
        '<div class="date-bar">' +
          '<button class="btn-icon" onclick="changeMonth(-1)" aria-label="Попередній місяць">◀</button>' +
          '<div class="date-bar-title">' + MONTHS_UK[ui.month] + ' ' + ui.year + '</div>' +
          (showTodayBtn ? '<button class="btn btn-sm btn-secondary" onclick="goTodayCalendar()">Сьогодні</button>' : '') +
          '<button class="btn-icon" onclick="changeMonth(1)" aria-label="Наступний місяць">▶</button>' +
        '</div>'
      );
    }

    // =========================================================================
    // ВКЛАДКА 1: НАРЯДИ (1A: ГРАФІК + 1B: ОБЛІК)
    // =========================================================================
    function setScheduleSquadFilter(id) { ui.scheduleSquadFilter = id; render(); }
    function selectCalDate(iso) { ui.selectedDate = iso; render(); }

    function renderDutiesTab() {
      const seg =
        '<div class="seg-control">' +
          '<button class="seg-btn ' + (ui.dutiesSubTab === 'schedule' ? 'active' : '') + '" onclick="setDutiesSubTab(\'schedule\')">Графік</button>' +
          '<button class="seg-btn ' + (ui.dutiesSubTab === 'stats' ? 'active' : '') + '" onclick="setDutiesSubTab(\'stats\')">Облік</button>' +
        '</div>';
      return seg + (ui.dutiesSubTab === 'schedule' ? renderScheduleView() : renderStatsView());
    }

    function renderScheduleView() {
      const y = ui.year, m = ui.month;
      const pref = monthPrefix(y, m);
      const firstDay = new Date(y, m, 1);
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      let offset = firstDay.getDay() - 1;
      if (offset < 0) offset = 6;
      const tdISO = todayISO();

      // Фільтр по відділеннях
      const filterItems = [{ id: 'all', name: 'Усі', color: '#4ade80' }].concat(getOrderedSquads());
      const filterPills = '<div class="pills-scroll">' + filterItems.map(function(sq) {
        return '<button class="pill ' + (ui.scheduleSquadFilter === sq.id ? 'active' : '') + '" onclick="setScheduleSquadFilter(\'' + sq.id + '\')">' +
          '<span class="dot" style="background:' + sq.color + '"></span><span>' + esc(sq.name) + '</span></button>';
      }).join('') + '</div>';

      // Збір нарядів місяця по датах
      const byDate = {};
      state.duties.forEach(function(d) {
        if (!d.date || d.date.indexOf(pref) !== 0) return;
        const s = getSoldierById(d.soldierId);
        if (!s) return;
        if (ui.scheduleSquadFilter !== 'all' && s.squadId !== ui.scheduleSquadFilter) return;
        if (!byDate[d.date]) byDate[d.date] = [];
        byDate[d.date].push(d);
      });

      let cells = '';
      for (let i = 0; i < offset; i++) cells += '<div></div>';
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = pref + '-' + String(day).padStart(2, '0');
        const list = byDate[iso] || [];
        const cls = 'cal-cell' + (iso === ui.selectedDate ? ' selected' : '') + (iso === tdISO ? ' today' : '');
        const dots = list.slice(0, 4).map(function(d) {
          const dt = getDutyTypeById(d.dutyTypeId);
          return '<span class="cal-dot" style="background:' + dt.color + '"></span>';
        }).join('');
        cells += '<button class="' + cls + '" onclick="selectCalDate(\'' + iso + '\')">' +
          '<span class="cal-num">' + day + '</span><div class="cal-dots">' + dots + '</div></button>';
      }

      // Наряди на вибрану дату
      const dayDuties = state.duties.filter(function(d) {
        if (d.date !== ui.selectedDate) return false;
        const s = getSoldierById(d.soldierId);
        if (!s) return false;
        if (ui.scheduleSquadFilter !== 'all' && s.squadId !== ui.scheduleSquadFilter) return false;
        return true;
      });

      // Групування за типом наряду
      const grouped = [];
      const seenTypes = new Set();
      state.dutyTypes.forEach(function(dt) {
        const items = dayDuties.filter(function(d) { return d.dutyTypeId === dt.id; });
        if (items.length) { grouped.push({ dt: dt, items: items }); seenTypes.add(dt.id); }
      });
      dayDuties.forEach(function(d) {
        if (!seenTypes.has(d.dutyTypeId)) {
          const dt = getDutyTypeById(d.dutyTypeId);
          grouped.push({ dt: dt, items: dayDuties.filter(function(x) { return x.dutyTypeId === d.dutyTypeId; }) });
          seenTypes.add(d.dutyTypeId);
        }
      });

      const dayListHtml = grouped.length === 0
        ? '<div class="empty-state">На ' + formatHumanDate(ui.selectedDate) + ' нарядів не призначено.</div>'
        : '<div class="stack">' + grouped.map(function(g) {
            return '<div class="stack-sm">' +
              '<div class="row-between">' +
                '<div class="row">' +
                  '<span class="dot" style="background:' + g.dt.color + '"></span>' +
                  '<span class="section-title" style="color:' + g.dt.color + '">' + esc(g.dt.shortName) + (g.dt.name && g.dt.name !== g.dt.shortName ? ' — ' + esc(g.dt.name) : '') + '</span>' +
                '</div>' +
                '<span class="text-xs text-muted">' + g.items.length + (g.dt.maxCount > 1 ? ' / ' + g.dt.maxCount : '') + ' ос.</span>' +
              '</div>' +
              g.items.map(function(d) {
                const s = getSoldierById(d.soldierId);
                const sq = getSquadById(s.squadId);
                return '<div class="soldier-row" style="border-radius:10px;border:1px solid var(--border);border-left:4px solid ' + sq.color + '">' +
                  '<div class="min0">' +
                    '<div class="row wrap">' +
                      '<span class="soldier-name">' + esc(s.fullName) + '</span>' +
                      (isCmdGroup(sq) ? '<span class="badge badge-kg">★ КГ</span>' : (s.isLeader ? '<span class="badge badge-kv">★ КВ</span>' : '')) +
                    '</div>' +
                    '<div class="text-xs text-muted">' + esc(sq.name) + (s.rank ? ' • ' + esc(s.rank) : '') + '</div>' +
                  '</div>' +
                  '<button class="btn-icon btn-icon-sm danger" onclick="removeDuty(\'' + d.id + '\')" title="Видалити">✕</button>' +
                '</div>';
              }).join('') +
            '</div>';
          }).join('') + '</div>';

      return (
        renderMonthBar(true) +
        filterPills +
        '<div class="card">' +
          '<div class="cal-weekdays">' + WEEKDAYS_UK.map(function(w, i) { return '<div class="' + (i >= 5 ? 'wknd' : '') + '">' + w + '</div>'; }).join('') + '</div>' +
          '<div class="cal-grid">' + cells + '</div>' +
        '</div>' +
        '<div class="card stack">' +
          '<div class="row-between">' +
            '<div>' +
              '<div class="fw-800" style="color:#fff">' + formatHumanDate(ui.selectedDate) + '</div>' +
              '<div class="text-xs text-muted">Призначено нарядів: ' + dayDuties.length + '</div>' +
            '</div>' +
            '<button class="btn btn-sm btn-primary" onclick="openAssignDutyModal(\'' + ui.selectedDate + '\')">+ Призначити наряд</button>' +
          '</div>' +
          dayListHtml +
          (dayDuties.length > 0
            ? '<div class="grid-2">' +
                '<button class="btn btn-secondary" onclick="openDayDutiesPreview(\'' + ui.selectedDate + '\')">Перегляд тексту</button>' +
                '<button class="btn btn-primary" onclick="copyDayDuties(\'' + ui.selectedDate + '\')">Скопіювати наряд</button>' +
              '</div>'
            : '') +
        '</div>'
      );
    }

    function generateDayDutiesText(isoDate) {
      const dayDuties = state.duties.filter(function(d) {
        if (d.date !== isoDate) return false;
        const s = getSoldierById(d.soldierId);
        if (!s) return false;
        if (ui.scheduleSquadFilter !== 'all' && s.squadId !== ui.scheduleSquadFilter) return false;
        return true;
      });
      if (!dayDuties.length) return '';

      const grp = (state.groupNumber || '223').trim() || '223';
      const header = grp + ', ' + formatDotDate(isoDate);

      const order = state.dutyTypes.slice();
      const known = new Set(order.map(function(dt) { return dt.id; }));
      dayDuties.forEach(function(d) {
        if (!known.has(d.dutyTypeId)) {
          order.push(getDutyTypeById(d.dutyTypeId));
          known.add(d.dutyTypeId);
        }
      });

      const blocks = [];
      order.forEach(function(dt) {
        const items = dayDuties.filter(function(d) { return d.dutyTypeId === dt.id; });
        if (!items.length) return;
        const lines = [dt.shortName + ':'];
        items.forEach(function(d) {
          const s = getSoldierById(d.soldierId);
          if (!s) return;
          const rankPrefix = s.rank ? s.rank + ' ' : '';
          lines.push('-' + rankPrefix + s.fullName);
        });
        blocks.push(lines.join('\n'));
      });
      return header + '\n' + blocks.join('\n\n');
    }

    function openDayDutiesPreview(isoDate) {
      const txt = generateDayDutiesText(isoDate);
      if (!txt) return;
      openModal(
        '<div class="modal-header">' +
          '<div class="modal-title">Наряд на ' + formatDotDate(isoDate) + '</div>' +
          '<button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<pre class="preview-pre">' + esc(txt) + '</pre>' +
          '<button class="btn btn-primary btn-full" onclick="copyDayDuties(\'' + isoDate + '\'); closeModal();">Скопіювати наряд</button>' +
        '</div>'
      );
    }

    function copyDayDuties(isoDate) {
      const txt = generateDayDutiesText(isoDate);
      if (!txt) { showToast('На цю дату нарядів немає', 'error'); return; }
      copyText(txt, 'Наряд скопійовано');

    function removeDuty(dutyId) {
      state.duties = state.duties.filter(function(d) { return d.id !== dutyId; });
      saveState();
      render();
      showToast('Наряд видалено');
    }

    // Модальне вікно призначення наряду (ЧК — 1 ос., Дн — до 3 ос.)
    function openAssignDutyModal(isoDate) {
      if (state.personnel.length === 0) {
        showToast('Спочатку додайте бійців у вкладці «Склад»', 'error');
        return;
      }
      assignModal.date = isoDate;
      assignModal.dutyTypeId = state.dutyTypes[0] ? state.dutyTypes[0].id : '';
      assignModal.selectedIds = [];
      renderAssignDutyModal();
    }

    function selectAssignDutyType(dtId) {
      assignModal.dutyTypeId = dtId;
      assignModal.selectedIds = [];
      renderAssignDutyModal();
    }

    function toggleAssignSoldier(soldierId) {
      const dt = getDutyTypeById(assignModal.dutyTypeId);
      const maxC = Math.max(1, Number(dt.maxCount) || 1);
      const idx = assignModal.selectedIds.indexOf(soldierId);
      if (idx >= 0) {
        assignModal.selectedIds.splice(idx, 1);
      } else {
        if (maxC === 1) {
          assignModal.selectedIds = [soldierId];
        } else {
          if (assignModal.selectedIds.length >= maxC) {
            showToast('Для «' + dt.shortName + '» максимум ' + maxC + ' ос.', 'error');
            return;
          }
          assignModal.selectedIds.push(soldierId);
        }
      }
      renderAssignDutyModal();
    }

    function confirmAssignDuties() {
      if (!assignModal.dutyTypeId || assignModal.selectedIds.length === 0) {
        showToast('Оберіть хоча б одного військовослужбовця', 'error');
        return;
      }
      assignModal.selectedIds.forEach(function(sid) {
        state.duties.push({
          id: genId('d'),
          date: assignModal.date,
          soldierId: sid,
          dutyTypeId: assignModal.dutyTypeId
        });
      });
      const cnt = assignModal.selectedIds.length;
      saveState();
      closeModal();
      render();
      showToast(cnt > 1 ? 'Призначено бійців: ' + cnt : 'Наряд призначено');
    }

    function renderAssignDutyModal() {
      const parts = assignModal.date.split('-').map(Number);
      const y = parts[0], m = parts[1] - 1;
      const yestISO = addDaysISO(assignModal.date, -1);

      const pickedSet = new Set(assignModal.selectedIds);
      const busyToday = new Set(state.duties.filter(function(d) { return d.date === assignModal.date; }).map(function(d) { return d.soldierId; }));
      const busyYest = new Set(state.duties.filter(function(d) { return d.date === yestISO; }).map(function(d) { return d.soldierId; }));

      const groupsHtml = getOrderedSquads().map(function(sq) {

          const isYest = busyYest.has(s.id);
          return '<button type="button" class="soldier-row" onclick="toggleAssignSoldier(\'' + s.id + '\')" style="width:100%;text-align:left;border-radius:10px;border:1px solid ' + (picked ? '#4ade80' : 'var(--border)') + ';border-left:4px solid ' + sq.color + ';background:' + (picked ? 'rgba(74,222,128,0.12)' : 'var(--bg)') + '">' +
            '<div style="width:22px;height:22px;border-radius:6px;border:2px solid ' + (picked ? '#4ade80' : 'var(--border-strong)') + ';background:' + (picked ? '#4ade80' : 'transparent') + ';color:#0b1015;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0">' + (picked ? '✓' : '') + '</div>' +
            '<div class="min0">' +
              '<div class="row wrap">' +
                '<span class="soldier-name">' + esc(s.fullName) + '</span>' +
                (isCmdGroup(sq) ? '<span class="badge badge-kg">★ КГ</span>' : (s.isLeader ? '<span class="badge badge-kv">★ КВ</span>' : '')) +
                (!pm.isOk ? '<span class="badge badge-err">' + esc(pm.shortLabel) + '</span>' : '') +
                (isToday ? '<span class="badge badge-warn">Вже сьогодні</span>' : '') +
                (isYest ? '<span class="badge badge-info">Вчора в наряді</span>' : '') +
              '</div>' +
              (s.rank ? '<div class="text-xs text-muted">' + esc(s.rank) + '</div>' : '') +
            '</div>' +
            '<div style="text-align:right;flex-shrink:0">' +
              '<div class="fw-800" style="color:#fff">' + st.monthCount + ' <span class="text-xs text-muted">міс</span></div>' +
              '<div class="text-xs text-muted">' + st.totalCount + ' всього</div>' +
            '</div>' +
          '</button>';
        }).join('');

        return '<div class="stack-sm">' +
          '<div class="row"><span class="dot" style="background:' + sq.color + '"></span><span class="section-title" style="color:' + sq.color + '">' + esc(sq.name) + '</span></div>' +
          rows +
        '</div>';
      }).join('');

      openModal(
        '<div class="modal-header">' +
          '<div><div class="modal-title">Призначити наряд</div><div class="text-xs text-muted">' + formatHumanDate(assignModal.date) + '</div></div>' +
          '<button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<div class="field"><div class="field-label">1. Оберіть вид наряду:</div><div class="chips-wrap">' +
            state.dutyTypes.map(function(t) {
              const active = t.id === assignModal.dutyTypeId;
              return '<button type="button" class="btn btn-sm ' + (active ? 'btn-primary' : 'btn-secondary') + '" onclick="selectAssignDutyType(\'' + t.id + '\')">' +
                '<span class="dot" style="background:' + t.color + '"></span>' +
                '<span>' + esc(t.shortName) + '</span>' +
                '<span class="text-xs" style="opacity:0.8">(до ' + t.maxCount + ')</span>' +
              '</button>';
            }).join('') +
          '</div></div>' +
          '<div class="row-between">' +
            '<span class="field-label">2. Особовий склад:</span>' +
            '<span class="badge badge-ok">Обрано: ' + assignModal.selectedIds.length + ' / ' + maxC + '</span>' +
          '</div>' +
          '<div class="stack">' + groupsHtml + '</div>' +
          '<div style="position:sticky;bottom:0;background:var(--card);padding-top:10px;border-top:1px solid var(--border)">' +
            '<button class="btn btn-primary btn-full" onclick="confirmAssignDuties()">Призначити (' + assignModal.selectedIds.length + ' / ' + maxC + ')</button>' +
          '</div>' +
        '</div>'
      );
    }

    // 1B. ОБЛІК НАРЯДІВ
    function renderStatsView() {
      const pref = monthPrefix(ui.year, ui.month);
      const monthDutiesTotal = state.duties.filter(function(d) {
        return d.date && d.date.indexOf(pref) === 0 && Boolean(getSoldierById(d.soldierId));
      }).length;
      const totalPeople = state.personnel.length;
      const avgPerSoldier = totalPeople > 0 ? (monthDutiesTotal / totalPeople).toFixed(1) : '0.0';

      const blocks = getOrderedSquads().map(function(sq) {
        const members = sortSquadPersonnel(state.personnel.filter(function(p) { return p.squadId === sq.id; }));
        if (!members.length) return '';
        const rows = members.map(function(s) {

                '<button class="status-btn ' + (t.status === 'done' ? 'st-done' : '') + '" onclick="setTaskStatus(\'' + t.id + '\', \'done\')">Виконано</button>' +
                '<button class="status-btn ' + (t.status === 'failed' ? 'st-failed' : '') + '" onclick="setTaskStatus(\'' + t.id + '\', \'failed\')">Не виконано</button>' +
              '</div>' +
              '<button class="btn btn-sm btn-secondary btn-full" onclick="toggleTaskRemark(\'' + t.id + '\')">' +

                (hasRemark ? ' <span class="badge badge-warn">Є запис</span>' : '') +
              '</button>' +
              (remarkOpen
                ? '<div class="stack-sm">' +
                    '<textarea id="remark-' + t.id + '" class="textarea" placeholder="Вкажіть зауваження або причину, чому не можна виконати..." oninput="updateTaskRemark(\'' + t.id + '\', this.value)">' + esc(t.remark || '') + '</textarea>' +
                    '<div class="row-between">' +
                      '<span class="text-xs text-muted">Автоматично зберігається</span>' +
                      '<button type="button" class="btn btn-xs btn-primary" onclick="saveTaskRemarkBtn(\'' + t.id + '\')">Зберегти</button>' +

      return (

    function submitNewTask(e) {
      e.preventDefault();
      const recVal = document.getElementById('task-recipient').value;
      const text = document.getElementById('task-text').value.trim();
      const author = document.getElementById('task-author').value.trim();
      if (!text) return;
      const isAll = recVal === 'all_leaders';
      state.tasks.unshift({
        id: genId('task'),
        recipientType: isAll ? 'all_leaders' : 'squad',
        squadId: isAll ? '' : recVal.replace('squad:', ''),
        text: text,
        author: author,
        status: 'received',
        remark: '',
        createdAt: formatDateTimeNow()
      });
      ui.taskFormOpen = false;
      saveState();
      render();
      showToast('Задачу поставлено');
    }

    function setTaskStatus(taskId, status) {
      const t = state.tasks.find(function(x) { return x.id === taskId; });
      if (!t) return;
      t.status = status;
      if (status === 'failed') {
        ui.openTaskRemarks[taskId] = true;
      }
      saveState();
      render();
    }

    function toggleTaskRemark(taskId) {
      ui.openTaskRemarks[taskId] = !ui.openTaskRemarks[taskId];
      render();
    }

    function updateTaskRemark(taskId, val) {
      const t = state.tasks.find(function(x) { return x.id === taskId; });
      if (t) {
        t.remark = val;
        saveState();
      }
    }

    function saveTaskRemarkBtn(taskId) {
      const el = document.getElementById('remark-' + taskId);
      if (el) updateTaskRemark(taskId, el.value);
      showToast('Зауваження збережено');
      render();
    }

    function deleteTask(taskId) {
      showConfirm('Видалити задачу?', 'Задача та її зауваження будуть видалені.', 'Видалити', function() {
        state.tasks = state.tasks.filter(function(x) { return x.id !== taskId; });
        saveState();
        render();
        showToast('Задачу видалено');
      }, true);
    }

    function copyActiveTasks() {
      const active = state.tasks.filter(function(t) { return t.status !== 'done'; });
      if (!active.length) {
        showToast('Немає активних (невиконаних) задач', 'error');
        return;
      }
      const lines = ['Активні задачі (' + (state.groupNumber || '223') + '):'];
      active.forEach(function(t, idx) {
        const rec = t.recipientType === 'all_leaders' ? 'Усім командирам відділень' : formatSquadRecipient(getSquadById(t.squadId));
        const stLbl = t.status === 'failed' ? 'Не виконано' : 'Отримав задачу';
        lines.push('\n' + (idx + 1) + '. [' + rec + '] — ' + stLbl);
        lines.push(t.text);
        if (t.author) lines.push('Поставив: ' + t.author);
        if (t.remark && t.remark.trim()) lines.push('Зауваження: ' + t.remark.trim());
      });
      copyText(lines.join('\n'), 'Активні задачі скопійовано');

    // =========================================================================
    // ВКЛАДКА 3: РОЗХІД + ПЛАНУВАННЯ НА МАЙБУТНІ ДАТИ
    // =========================================================================
    function ensureRozkhidDay(iso) {
      if (!state.rozkhidByDate[iso] || typeof state.rozkhidByDate[iso] !== 'object') {
        state.rozkhidByDate[iso] = { cleared: false, manual: {}, offsets: {} };
      }
      if (!state.rozkhidByDate[iso].manual) state.rozkhidByDate[iso].manual = {};
      if (!state.rozkhidByDate[iso].offsets) state.rozkhidByDate[iso].offsets = {};
      return state.rozkhidByDate[iso];
    }

    function getSurnameCountMap() {
      const counts = {};
      state.personnel.forEach(function(p) {
        const sn = String(p.fullName || '').trim().split(/\s+/)[0] || '';
        const k = sn.toLowerCase();
        counts[k] = (counts[k] || 0) + 1;
      });
      return counts;
    }

    function formatReportSurname(soldier, surnameCounts) {
      const parts = String(soldier.fullName || '').trim().split(/\s+/);
      const sn = parts[0] || '';
      if (surnameCounts[sn.toLowerCase()] > 1 && parts[1]) {
        return sn + ' ' + parts[1].charAt(0).toUpperCase() + '.';
      }
      return sn;
    }

    // Автосинхронізація та обчислення розходу на будь-яку дату D (сувора унікальність: 1 боєць = 1 пункт)
    function computeRozkhid(iso) {
      const yestISO = addDaysISO(iso, -1);
      const todayDutySet = new Set(state.duties.filter(function(d) { return d.date === iso; }).map(function(d) { return d.soldierId; }));
      const yestDutySet = new Set(state.duties.filter(function(d) { return d.date === yestISO; }).map(function(d) { return d.soldierId; }));
      const dayData = state.rozkhidByDate[iso] || { cleared: false, manual: {}, offsets: {} };
      const snCounts = getSurnameCountMap();

      // Заплановані відсутності, що покривають дату D (якщо кілька — останній доданий має пріоритет)
      const scheduledMap = {};
      state.scheduledAbsences.forEach(function(a) {
        const end = a.endDate || a.startDate;
        if (iso >= a.startDate && iso <= end) {
          scheduledMap[a.soldierId] = a.category;
        }
      });

      const statusBySoldier = {};
      const byCat = {};
      ROZKHID_CATS.forEach(function(c) { byCat[c.key] = []; });

      // Сортуємо бійців у стандартному порядку відділень
      const orderedPeople = [];
      getOrderedSquads().forEach(function(sq) {
        sortSquadPersonnel(state.personnel.filter(function(p) { return p.squadId === sq.id; })).forEach(function(p) {
          orderedPeople.push(p);
        });
      });

      orderedPeople.forEach(function(s) {
        let cat = 'in_service';
        // Пріоритет 1: ручне призначення на дату D
        if (dayData.manual && dayData.manual[s.id]) {
          cat = dayData.manual[s.id];
        } else if (dayData.cleared) {
          cat = 'in_service';
        } else if (scheduledMap[s.id]) {
          // Пріоритет 2: запланована відсутність на дату/період
          cat = scheduledMap[s.id];
        } else if (todayDutySet.has(s.id)) {
          // Пріоритет 3а: наряд сьогодні
          cat = 'n';
        } else if (yestDutySet.has(s.id)) {
          // Пріоритет 3б: вчорашній наряд
          cat = 'starodobovyi';
        } else if (PERM_ABSENT_KEYS.has(s.presenceStatus)) {
          // Пріоритет 4: постійний статус присутності зі "Складу"
          cat = s.presenceStatus;
        }

        statusBySoldier[s.id] = cat;
        if (byCat[cat]) {
          byCat[cat].push({
            soldier: s,
            reportName: formatReportSurname(s, snCounts)
          });
        }
      });

      let totalAbsent = 0;
      const categories = ROZKHID_CATS.map(function(c) {
        const list = byCat[c.key] || [];
        const offset = Math.max(0, Number((dayData.offsets && dayData.offsets[c.key]) || 0));
        const count = list.length + offset;
        totalAbsent += count;
        return {
          key: c.key,
          label: c.label,
          hint: c.hint,
          soldiers: list,
          offset: offset,
          count: count
        };
      });

      const totalList = state.personnel.length;
      const presentCount = Math.max(0, totalList - totalAbsent);
      return {
        totalList: totalList,
        presentCount: presentCount,
        totalAbsent: totalAbsent,
        categories: categories,
        statusBySoldier: statusBySoldier
      };
    }

    function generateRozkhidReport() {
      const data = computeRozkhid(ui.rozkhidDate);
      const grp = (state.groupNumber || '223').trim() || '223';
      const lines = [
        grp,
        'З/с - ' + data.totalList,
        'Вн - ' + data.presentCount
      ];
      data.categories.forEach(function(c) {
        if (ui.rozkhidHideZeros && c.count === 0) return;
        let line = c.label + ' - ' + c.count;
        if (ui.rozkhidShowNames && c.soldiers.length > 0) {
          line += ' (' + c.soldiers.map(function(x) { return x.reportName; }).join(', ') + ')';
        }
        lines.push(line);
      });
      return lines.join('\n');
    }

    function setRozkhidDate(iso) {
      if (!iso) return;
      ui.rozkhidDate = iso;
      render();
    }

    function shiftRozkhidDate(delta) {
      ui.rozkhidDate = addDaysISO(ui.rozkhidDate, delta);
      render();
    }

    function updateGroupNumber(val) {
      state.groupNumber = val.trim();
      saveState();
      const pre = document.getElementById('rozkhid-preview');
      if (pre) pre.textContent = generateRozkhidReport();
    }

    function toggleRozkhidOption(opt, checked) {
      if (opt === 'names') ui.rozkhidShowNames = checked;
      if (opt === 'hideZeros') ui.rozkhidHideZeros = checked;
      const pre = document.getElementById('rozkhid-preview');
      if (pre) pre.textContent = generateRozkhidReport();
    }

    function adjustRozkhidOffset(catKey, delta) {
      const day = ensureRozkhidDay(ui.rozkhidDate);
      const cur = Math.max(0, Number(day.offsets[catKey] || 0));
      day.offsets[catKey] = Math.max(0, cur + delta);
      saveState();
      render();
    }

        'Очистити розхід',
        function() {
          state.rozkhidByDate[ui.rozkhidDate] = { cleared: true, manual: {}, offsets: {} };
          saveState();
          render();
          showToast('Розхід на дату очищено');

        true

      render();

    function deleteScheduledAbsence(id) {

      saveState();
      render();
      showToast('Запланований запис видалено');
    }

    function renderRozkhidTab() {
      const data = computeRozkhid(ui.rozkhidDate);
      const previewText = generateRozkhidReport();
      const td = todayISO();
      const tomorrow = addDaysISO(td, 1);

      // Заплановані відсутності (від сьогодні і далі)
      const upcoming = state.scheduledAbsences
        .filter(function(a) { return (a.endDate || a.startDate) >= td && Boolean(getSoldierById(a.soldierId)); })
        .sort(function(a, b) { return a.startDate.localeCompare(b.startDate); });

      const upcomingHtml = upcoming.length === 0 ? '' : (
        '<div class="card-flush" style="border-color:rgba(56,189,248,0.35)">' +
          '<div class="acc-header ' + (ui.rozkhidUpcomingOpen ? 'open' : '') + '" onclick="toggleUpcomingAccordion()">' +

        var isCore = sq.id === 'cmd' || sq.id === 'sq1' || sq.id === 'sq2' || sq.id === 'sq3';
        return '<div class="row-between" style="padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--border)">' +
          '<div class="row"><span class="dot" style="background:' + esc(sq.color) + '"></span><span class="fw-bold">' + esc(sq.name) + '</span></div>' +
          (!isCore ? '<button type="button" class="btn-icon btn-icon-sm danger" onclick="deleteSquad(\'' + sq.id + '\')">✕</button>' : '<span class="text-xs text-muted">Базове</span>') +
        '</div>';
      }).join('');

      var sqCard =
        '<div class="card stack">' +
          '<div class="row-between"><div class="section-title">' + ico('users', 14) + ' Відділення</div><button type="button" class="btn btn-xs btn-primary" onclick="openAddSquadModal()">+ Додати</button></div>' +
          squadsHtml +
        '</div>';

      var dangerCard =
        '<div class="card stack">' +
          '<div class="section-title" style="color:#fca5a5">' + ico('alert', 14) + ' Небезпечна зона</div>' +
          '<button type="button" class="btn btn-danger btn-full" onclick="confirmClearAllData()">' + ico('trash', 15) + ' Очистити всі дані</button>' +
        '</div>';

      return versionCard + themeCard + fbCard + pinsCard + permsCard + groupCard + dtCard + sqCard + backupCard + dangerCard;
    }

    function savePinsSettings() {
      if (!isAdmin()) return;
      var keys = ['admin', 'kg', 'kv1', 'kv2', 'kv3'];
      var nextPins = {};
      var used = {};
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        var val = (document.getElementById('pin-' + k).value || '').trim();
        if (!/^\d{4}$/.test(val)) { showToast('Усі PIN-коди мають містити рівно 4 цифри', true); return; }
        if (used[val]) { showToast('PIN-коди для різних ролей не можуть повторюватись', true); return; }
        used[val] = true;
        nextPins[k] = val;
      }
      state.pins = nextPins;
      saveState(true);
      showToast('PIN-коди збережено');
    }

    function setRolePerm(roleKey, field, val) {
      if (!isAdmin()) return;
      if (!state.permissions[roleKey]) state.permissions[roleKey] = Object.assign({}, DEFAULT_PERMISSIONS[roleKey]);
      state.permissions[roleKey][field] = val;
      saveState(true);
      showToast('Права оновлено');
    }

    function saveGroupNumber() {
      if (!isAdmin()) return;
      var val = (document.getElementById('set-group-num').value || '').trim();
      if (!val) return;
      state.groupNumber = val;
      saveState(true);
      showToast('Номер групи збережено');
    }

    function openAddDutyTypeModal() {
      if (!isAdmin()) return;
      var swatches = PALETTE.map(function(c, i) {
        return '<button type="button" class="color-swatch ' + (i === 4 ? 'selected' : '') + '" style="background:' + c + '" onclick="selectModalColor(this,\'' + c + '\')"></button>';
      }).join('');
      openModal(
        '<div class="modal-header"><div class="modal-title">Новий вид наряду</div><button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body">' +
          '<div class="field"><label class="field-label">Скорочення (напр. Пт)</label><input id="dt-short" class="input" type="text" placeholder="ЧК, Дн, Пт..." /></div>' +
          '<div class="field"><label class="field-label">Повна назва</label><input id="dt-name" class="input" type="text" placeholder="Патруль..." /></div>' +
          '<div class="field"><label class="field-label">Макс. кількість бійців</label><input id="dt-max" class="input" type="number" min="1" max="15" value="1" /></div>' +
          '<input id="dt-color" type="hidden" value="' + PALETTE[4] + '" />' +
          '<div class="color-row">' + swatches + '</div>' +
          '<button type="button" class="btn btn-primary btn-full" onclick="saveNewDutyType()">Додати</button>' +
        '</div>'
      );
    }

    function selectModalColor(btn, color) {
      btn.parentNode.querySelectorAll('.color-swatch').forEach(function(b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
      var inp = document.getElementById('dt-color') || document.getElementById('sq-color');
      if (inp) inp.value = color;
    }

    function saveNewDutyType() {
      var shortName = document.getElementById('dt-short').value.trim();
      var name = document.getElementById('dt-name').value.trim() || shortName;
      var maxCount = Math.max(1, Number(document.getElementById('dt-max').value) || 1);
      var color = document.getElementById('dt-color').value || '#38bdf8';
      if (!shortName) { showToast('Введіть скорочення', true); return; }
      state.dutyTypes.push({ id: genId('dt'), shortName: shortName, name: name, maxCount: maxCount, color: color });
      saveState(true);
      closeModal();
      showToast('Вид наряду додано');
      render();
    }

    function deleteDutyType(dtId) {
      if (!isAdmin() || state.dutyTypes.length <= 1) return;
      state.dutyTypes = state.dutyTypes.filter(function(x) { return x.id !== dtId; });
      saveState(true);
      render();
    }

    function openAddSquadModal() {
      if (!isAdmin()) return;
      var swatches = PALETTE.map(function(c, i) {
        return '<button type="button" class="color-swatch ' + (i === 5 ? 'selected' : '') + '" style="background:' + c + '" onclick="selectModalColor(this,\'' + c + '\')"></button>';
      }).join('');
      openModal(
        '<div class="modal-header"><div class="modal-title">Нове відділення</div><button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body">' +
          '<div class="field"><label class="field-label">Назва відділення</label><input id="sq-name" class="input" type="text" placeholder="4-те відділення" /></div>' +
          '<input id="sq-color" type="hidden" value="' + PALETTE[5] + '" />' +
          '<div class="color-row">' + swatches + '</div>' +
          '<button type="button" class="btn btn-primary btn-full" onclick="saveNewSquad()">Додати</button>' +
        '</div>'
      );
    }

    function saveNewSquad() {
      var name = document.getElementById('sq-name').value.trim();
      var color = document.getElementById('sq-color').value || '#38bdf8';
      if (!name) { showToast('Введіть назву відділення', true); return; }
      state.squads.push({ id: genId('sq'), name: name, color: color, isCmdGroup: false });
      saveState(true);
      closeModal();
      showToast('Відділення додано');
      render();
    }

    function deleteSquad(sqId) {
      if (!isAdmin()) return;
      state.squads = state.squads.filter(function(x) { return x.id !== sqId; });
      saveState(true);
      render();
    }

    // Експорт / Імпорт JSON та CSV
    function exportBackupJSON() {
      try {
        var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'pomichnyk_vzvodu_' + todayISO() + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('Файл резервної копії збережено');
      } catch (e) {
        showToast('Помилка збереження файлу', true);
      }
    }

    function exportPersonnelCSV() {
      var rows = [['Відділення', 'Звання', 'ПІБ', 'Командир', 'Примітка']];
      getOrderedSquads().forEach(function(sq) {
        getSoldiersBySquad(sq.id).forEach(function(s) {
          rows.push([sq.name, s.rank, s.name, s.isCommander ? 'Так' : 'Ні', s.note || '']);
        });
      });
      var csv = '\uFEFF' + rows.map(function(r) {
        return r.map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(';');
      }).join('\n');
      try {
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'sklad_' + state.groupNumber + '_' + todayISO() + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('CSV експортовано');
      } catch (e) {
        showToast('Помилка експорту CSV', true);
      }
    }

    function handleImportJSON(ev) {
      if (!isAdmin()) return;
      var file = ev.target && ev.target.files ? ev.target.files[0] : null;
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function() {
        try {
          state = normalizeState(JSON.parse(String(reader.result || '')));
          saveState(true);
          showToast('Відновлено з файлу: ' + state.personnel.length + ' осіб');
          render();
        } catch (e) {
          showToast('Невірний формат JSON файлу', true);
        }
      };
      reader.readAsText(file);
      ev.target.value = '';
    }

    function openTextBackupModal() {
      if (!isAdmin()) return;
      var jsonStr = JSON.stringify(state);
      openModal(
        '<div class="modal-header"><div class="modal-title">Резервна копія текстом</div><button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body">' +
          '<button type="button" class="btn btn-info btn-full" onclick="copyText(document.getElementById(\'txt-backup\').value,\'JSON скопійовано\')">' + ico('copy', 15) + ' Скопіювати поточний JSON</button>' +
          '<textarea id="txt-backup" class="textarea" style="min-height:150px;font-family:monospace;font-size:11.5px">' + esc(jsonStr) + '</textarea>' +
          '<button type="button" class="btn btn-primary btn-full" onclick="restoreFromTextBackup()">' + ico('upload', 15) + ' Відновити з тексту</button>' +
        '</div>'
      );
    }

    function restoreFromTextBackup() {
      try {
        var raw = document.getElementById('txt-backup').value.trim();
        state = normalizeState(JSON.parse(raw));
        saveState(true);
        closeModal();
        showToast('Дані відновлено');
        render();
      } catch (e) {
        showToast('Помилка формату JSON', true);
      }
    }

    function confirmClearAllData() {
      if (!isAdmin()) return;
      openModal(
        '<div class="modal-header"><div class="modal-title">Очистити всі дані?</div><button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body">' +
          '<div class="text-sm">Буде видалено весь особовий склад, наряди, задачі та розхід. Попередні PIN-коди буде скинуто до стандартних.</div>' +
          '<div class="grid-2">' +
            '<button type="button" class="btn btn-secondary" onclick="closeModal()">Скасувати</button>' +
            '<button type="button" class="btn btn-danger" onclick="clearAllDataNow()">Так, очистити</button>' +
          '</div>' +
        '</div>'
      );
    }

    function clearAllDataNow() {
      state = createDefaultState();
      saveState(true);
      closeModal();
      showToast('Усі дані очищено');
      render();
    }

    // =========================================================================
    // 13. МОДАЛКИ, БЕЙДЖ ЗАДАЧ, ГОЛОВНИЙ РЕНДЕР ТА ЗАПУСК
    // =========================================================================
    function openModal(html) {
      var box = document.getElementById('modal-box');
      var root = document.getElementById('modal-root');
      if (!box || !root) return;
      box.innerHTML = html;
      root.classList.add('open');
    }
    function closeModal() {
      var root = document.getElementById('modal-root');
      if (root) root.classList.remove('open');
    }

    function switchTab(tab) {
      openSection(tab);
      return;
      ui.tab = tab;
      render();
      var main = document.getElementById('main-content');
      if (main) {
        main.classList.remove('tab-enter');
        void main.offsetWidth;
        main.classList.add('tab-enter');
      }
      window.scrollTo(0, 0);
    }

    function updateTasksBadge() {
      var badge = document.getElementById('nav-tasks-badge');
      if (!badge || !currentRole) return;
      var activeCount = state.tasks.filter(function(t) {
        return !isTaskClosedOrInactive(t) && isTaskVisibleForRole(t, currentRole);
      }).length;
      if (activeCount <= 0) {
        badge.classList.add('hidden');
        badge.textContent = '0';
      } else {
        badge.classList.remove('hidden');
        badge.textContent = activeCount > 99 ? '99+' : String(activeCount);
      }
    }

    function getActiveTasksCountForRole() {
      if (!currentRole) return 0;
      return state.tasks.filter(function(t) {
        return !isTaskClosedOrInactive(t) && isTaskVisibleForRole(t, currentRole);
      }).length;
    }

    function openSection(tabName) {
      ui.tab = tabName;
      ui.screen = 'section';
      render();
      var main = document.getElementById('main-content');
      if (main) {
        main.classList.remove('tab-enter');
        void main.offsetWidth;
        main.classList.add('tab-enter');
      }
      window.scrollTo(0, 0);
    }

    function goToHub() {
      ui.screen = 'hub';
      render();
      var main = document.getElementById('main-content');
      if (main) {
        main.classList.remove('tab-enter');
        void main.offsetWidth;
        main.classList.add('tab-enter');
      }
      window.scrollTo(0, 0);
    }

    function renderHubScreen() {
      var dNow = new Date();
      var isoToday = toISO(dNow);
      var wdFull = ['Неділя','Понеділок','Вівторок','Середа','Четвер','Пʼятниця','Субота'][dNow.getDay()];
      var wdShort = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'][dNow.getDay()];
      var monGen = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'][dNow.getMonth()];

      var day = ensureRozkhidDay(isoToday);
      var total = state.personnel.length;
      var absentSum = 0;
      ROZKHID_CATS.forEach(function(c) { absentSum += (Number(day[c.key].count) || 0); });
      var present = Math.max(0, total - absentSum);

      var dutyIds = getDutyIdsForDate(isoToday);
      var dutySummary = dutyIds.length
        ? dutyIds.map(function(id) { var s = getSoldierById(id); return s ? s.name.split(/\s+/)[0] : ''; }).filter(Boolean).join(', ')
        : 'Нарядів на сьогодні не призначено';

      var activeTasks = getActiveTasksCountForRole();
      var meta = getRoleMeta(currentRole);

      var syncBadgeHtml = '';
      if (fbStatus === 'online') {
        var onlineCnt = getOnlineRolesList().length;
        syncBadgeHtml = '<button type="button" class="sync-pill online" onclick="onHeaderSyncPillClick()"><span class="status-dot online"></span> ' + (onlineCnt > 0 ? (onlineCnt + ' онлайн') : 'Онлайн') + '</button>';
      } else if (fbStatus === 'offline') {
        syncBadgeHtml = '<button type="button" class="sync-pill offline" onclick="onHeaderSyncPillClick()"><span class="status-dot offline"></span> Офлайн</button>';
      } else if (fbStatus === 'syncing') {
        syncBadgeHtml = '<button type="button" class="sync-pill syncing" onclick="onHeaderSyncPillClick()">' + ico('refresh', 13, 'spin') + ' Синхр...</button>';
      } else {
        syncBadgeHtml = '<button type="button" class="sync-pill" onclick="onHeaderSyncPillClick()"><span class="status-dot local"></span> Локально</button>';
      }

      return '<div class="hub-wrap">' +
        '<div class="hub-toprow">' +
          '<span class="role-pill ' + meta.cssClass + '">' + ico(meta.icon || 'shield', 12) + ' ' + esc(meta.label) + '</span>' +
          '<div class="row" style="gap:6px">' +
            syncBadgeHtml +
            '<button type="button" class="btn-icon btn-icon-sm" onclick="logoutSession()" title="Вийти / Змінити PIN">' + ico('logout', 15) + '</button>' +
          '</div>' +
        '</div>' +
        '<div>' +
          '<div class="hub-kicker">' + esc(wdFull) + ', ' + dNow.getDate() + ' ' + esc(monGen) + '</div>' +
          '<h1 class="hub-h1">Взвод • ' + esc(state.groupNumber) + '</h1>' +
        '</div>' +
        '<div class="hub-board" onclick="openSection(\'rozkhid\')">' +
          '<div class="hub-board-date">' +
            '<b>' + dNow.getDate() + '</b>' +
            '<span>' + esc(monGen) + '</span>' +
            '<em>' + esc(wdShort) + '</em>' +
          '</div>' +
          '<div class="min0 stack-sm">' +
            '<div class="text-xs" style="color:#AEB8AF;font-weight:700">РОЗХІД НА СЬОГОДНІ</div>' +
            '<div style="font-size:18px;font-weight:800;color:#fff">З/с: ' + total + ' • Вн: <span style="color:#4ade80">' + present + '</span></div>' +
            '<div class="text-xs" style="color:#D5DCD4">Відсутніх: ' + absentSum + ' • Наряд: ' + esc(dutySummary) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="hub-grid-2">' +
          '<button type="button" class="hub-tile" onclick="openSection(\'rozkhid\')">' +
            '<span class="hub-tile-ico">' + ico('chart', 20) + '</span>' +
            '<span class="hub-tile-title">Розхід</span>' +
            '<span class="hub-tile-sub">Вн: ' + present + ' з ' + total + ' ос.</span>' +
          '</button>' +
          '<button type="button" class="hub-tile" onclick="openSection(\'duties\')">' +
            '<span class="hub-tile-ico">' + ico('calendar', 20) + '</span>' +
            '<span class="hub-tile-title">Наряди</span>' +
            '<span class="hub-tile-sub">Сьогодні: ' + dutyIds.length + ' ос.</span>' +
          '</button>' +
          '<button type="button" class="hub-tile" onclick="openSection(\'tasks\')">' +
            (activeTasks > 0 ? ('<span class="hub-badge-red">' + (activeTasks > 99 ? '99+' : activeTasks) + '</span>') : '') +
            '<span class="hub-tile-ico">' + ico('sliders', 20) + '</span>' +
            '<span class="hub-tile-title">Задачі</span>' +
            '<span class="hub-tile-sub">' + (activeTasks > 0 ? ('Активних: ' + activeTasks) : 'Активних немає') + '</span>' +
          '</button>' +
          '<button type="button" class="hub-tile" onclick="openSection(\'personnel\')">' +
            '<span class="hub-tile-ico">' + ico('users', 20) + '</span>' +
            '<span class="hub-tile-title">Склад</span>' +
            '<span class="hub-tile-sub">' + total + ' осіб у взводі</span>' +
          '</button>' +
        '</div>' +
        '<button type="button" class="hub-row-card" onclick="openSection(\'settings\')">' +
          '<span class="hub-tile-ico" style="margin-bottom:0">' + ico('sliders', 19) + '</span>' +
          '<span class="min0">' +
            '<div class="fw-800 text-sm">Налаштування</div>' +
            '<div class="text-xs text-muted">Firebase, PIN-коди, права ролей, бекап</div>' +
          '</span>' +
          '<span class="text-muted" style="font-size:18px">›</span>' +
        '</button>' +
      '</div>';
    }

    function renderSectionTopBar() {
      var activeTasks = getActiveTasksCountForRole();
      var items = [
        { k: 'rozkhid', label: 'Розхід' },
        { k: 'duties', label: 'Наряди' },
        { k: 'tasks', label: 'Задачі', badge: activeTasks },
        { k: 'personnel', label: 'Склад' },
        { k: 'settings', label: 'Налашт.' }
      ];
      var chips = items.map(function(it) {
        var isAct = ui.tab === it.k;
        var bHtml = (it.badge && it.badge > 0) ? ('<span class="sec-chip-dot">' + (it.badge > 99 ? '99+' : it.badge) + '</span>') : '';
        return '<button type="button" class="sec-chip ' + (isAct ? 'active' : '') + '" onclick="openSection(\'' + it.k + '\')">' + esc(it.label) + bHtml + '</button>';
      }).join('');

      return '<div class="sec-topbar">' +
        '<button type="button" class="sec-back-btn" onclick="goToHub()">◀ Головна</button>' +
        '<div class="sec-switch-strip">' + chips + '</div>' +
      '</div>';
    }

    function render() {
      if (!currentRole) return;
      updateSyncPillUI();
      updateTasksBadge();

      var main = document.getElementById('main-content');
      if (!main) return;

      if (ui.screen === 'hub') {
        document.body.setAttribute('data-nav', 'hub');
        main.innerHTML = renderHubScreen();
        return;
      }

      document.body.setAttribute('data-nav', 'sec');
      var topBar = renderSectionTopBar();
      var bodyHtml = '';
      if (ui.tab === 'duties') bodyHtml = renderDutiesTab();
      else if (ui.tab === 'tasks') bodyHtml = renderTasksTab();
      else if (ui.tab === 'rozkhid') bodyHtml = renderRozkhidTab();
      else if (ui.tab === 'personnel') bodyHtml = renderPersonnelTab();
      else bodyHtml = renderSettingsTab();

      main.innerHTML = topBar + bodyHtml;
    }

    // Ініціалізація при завантаженні
    (function bootstrap() {
      try {
        // Автопідхоплення посилання ?fb=... або ?db=...
        var params = new URLSearchParams(window.location.search);
        var fbParam = params.get('fb') || params.get('db');
        if (fbParam) {
          var normalized = normalizeFirebaseBaseUrl(fbParam);
          if (normalized) {
            fbUrl = normalized;
            safeLSSet(FB_URL_STORAGE_KEY, fbUrl);
          }
        }
      } catch (e) {}

      if (fbUrl) {
        startFbPolling();
        fbPullAll(false, true);
      }

      var savedRole = safeSSGet(SESSION_ROLE_KEY) || safeLSGet(SESSION_ROLE_KEY);
      if (savedRole && ROLES_META[savedRole]) {
        loginAsRole(savedRole);
      } else {
        document.getElementById('pin-screen').classList.remove('hidden');
        renderPinScreen();
      }
    })();
  </script>
</body>
</html>

      var cells = '';
      for (var b = 0; b < startDow; b++) cells += '<div></div>';
      for (var d = 1; d <= daysInMonth; d++) {
        var iso = y + '-' + pad2(m + 1) + '-' + pad2(d);
        var dayDuties = state.duties[iso] || {};
        var dots = '';
        state.dutyTypes.forEach(function(dt) {
          if (dayDuties[dt.id] && dayDuties[dt.id].length > 0) {
            dots += '<span class="cal-dot" style="background:' + esc(dt.color) + '"></span>';
          }
        });
        var cls = 'cal-cell' + (iso === today ? ' today' : '') + (iso === ui.selectedDate ? ' selected' : '');
        cells += '<button type="button" class="' + cls + '" onclick="selectDutyDate(\'' + iso + '\')">' +
          '<span class="cal-num">' + d + '</span><span class="cal-dots">' + dots + '</span></button>';
      }

      var calendarCard =
        '<div class="card stack">' +
          '<div class="row-between">' +
            '<button type="button" class="btn-icon btn-icon-sm" onclick="changeCalMonth(-1)">◀</button>' +
            '<div class="fw-800" style="font-size:15px">' + MONTHS_NOM[m] + ' ' + y + '</div>' +
            '<button type="button" class="btn-icon btn-icon-sm" onclick="changeCalMonth(1)">▶</button>' +
          '</div>' +
          '<div class="cal-weekdays"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div class="wknd">Сб</div><div class="wknd">Нд</div></div>' +
          '<div class="cal-grid">' + cells + '</div>' +
        '</div>';

      // Наряди на обрану дату
      var selDay = state.duties[ui.selectedDate] || {};
      var editable = canEditDuties();
      var dutyBlocks = state.dutyTypes.map(function(dt) {
        var assigned = (selDay[dt.id] || []).map(getSoldierById).filter(Boolean);
        var listHtml = assigned.length
          ? assigned.map(function(s) {
              var sq = getSquadById(s.squadId);
              return '<div class="row-between" style="padding:7px 9px;border-radius:9px;background:var(--bg);border:1px solid var(--border);border-left:4px solid ' + esc(sq ? sq.color : 'var(--accent)') + '">' +
                '<div class="min0">' +
                  '<div class="fw-bold text-sm">' + esc(s.rank) + ' ' + esc(s.name) + '</div>' +
                  '<div class="text-xs text-muted">' + esc(sq ? sq.name : '') + '</div>' +
                '</div>' +
                (editable ? '<button type="button" class="btn-icon btn-icon-sm danger" onclick="removeSoldierFromDuty(\'' + ui.selectedDate + '\',\'' + dt.id + '\',\'' + s.id + '\')">✕</button>' : '') +
              '</div>';
            }).join('')
          : '<div class="text-xs text-muted">Не призначено</div>';

        return '<div class="stack-sm duty-group-box" style="padding:10px;border-radius:11px;background:rgba(11,16,21,0.5);border:1px solid var(--border)">' +
          '<div class="row-between">' +
            '<div class="row"><span class="dot" style="background:' + esc(dt.color) + '"></span><span class="fw-800">' + esc(dt.shortName) + '</span><span class="text-xs text-muted">(' + esc(dt.name) + ' • ' + assigned.length + '/' + (dt.maxCount || 1) + ')</span></div>' +
            (editable ? '<button type="button" class="btn btn-xs btn-primary" onclick="openAssignDutyModal(\'' + dt.id + '\')">+ Призначити</button>' : '') +
          '</div>' +
          listHtml +
        '</div>';
      }).join('');

      var dayCard =
        '<div class="card stack">' +
          '<div class="row-between">' +
            '<div class="fw-800">Наряд на ' + fmtUA(ui.selectedDate) + '</div>' +
            '<div class="row" style="gap:6px">' +
              '<button type="button" class="btn btn-sm btn-secondary" onclick="openDutyPreviewModal(\'' + ui.selectedDate + '\')">' + ico('eye', 14) + ' Перегляд</button>' +
              '<button type="button" class="btn btn-sm btn-info" onclick="copyDutyForDate(\'' + ui.selectedDate + '\')">' + ico('copy', 14) + ' Скопіювати</button>' +
            '</div>' +
          '</div>' +
          (!editable ? '<div class="info-banner">Режим перегляду нарядів (редагування дозволяється Адміном).</div>' : '') +
          dutyBlocks +
        '</div>';

      return sub + calendarCard + dayCard;
    }

    function renderDutiesStats() {
      var prefix = ui.calYear + '-' + pad2(ui.calMonth + 1);
      var monthCounts = {}, totalCounts = {};
      Object.keys(state.duties).forEach(function(iso) {
        var day = state.duties[iso] || {};
        var isThisMonth = iso.indexOf(prefix) === 0;
        Object.keys(day).forEach(function(dtId) {
          (day[dtId] || []).forEach(function(sid) {
            totalCounts[sid] = (totalCounts[sid] || 0) + 1;
            if (isThisMonth) monthCounts[sid] = (monthCounts[sid] || 0) + 1;
          });
        });
      });

      var header =
        '<div class="card row-between">' +
          '<button type="button" class="btn-icon btn-icon-sm" onclick="changeCalMonth(-1)">◀</button>' +
          '<div class="fw-800">Облік: ' + MONTHS_NOM[ui.calMonth] + ' ' + ui.calYear + '</div>' +
          '<button type="button" class="btn-icon btn-icon-sm" onclick="changeCalMonth(1)">▶</button>' +
        '</div>';

      if (!state.personnel.length) {
        return header + '<div class="card empty-state">Особовий склад ще порожній. Додайте бійців у вкладці «Склад».</div>';
      }

      var groups = getOrderedSquads().map(function(sq) {
        var list = getSoldiersBySquad(sq.id);
        if (!list.length) return '';
        var rows = list.map(function(s) {
          return '<div class="row-between" style="padding:9px 12px;border-bottom:1px solid var(--border);background:var(--bg)">' +
            '<div class="min0 row" style="gap:6px">' +
              getCommanderBadgeHtml(s, sq) +
              '<span class="fw-bold text-sm">' + esc(s.name) + '</span>' +
            '</div>' +
            '<div class="row" style="gap:6px;flex-shrink:0">' +
              '<span class="badge badge-info">Міс: ' + (monthCounts[s.id] || 0) + '</span>' +
              '<span class="badge badge-ok">Всього: ' + (totalCounts[s.id] || 0) + '</span>' +
            '</div>' +
          '</div>';
        }).join('');
        return '<div class="card-flush">' +
          '<div class="acc-header" style="cursor:default"><div class="row"><span class="dot" style="background:' + esc(sq.color) + '"></span><span class="fw-800">' + esc(sq.name) + '</span></div><span class="text-xs text-muted">' + list.length + ' ос.</span></div>' +
          '<div class="acc-body">' + rows + '</div>' +
        '</div>';
      }).join('');

      return header + groups;
    }

    function changeCalMonth(delta) {
      var d = new Date(ui.calYear, ui.calMonth + delta, 1);
      ui.calYear = d.getFullYear();
      ui.calMonth = d.getMonth();
      render();
    }

    function selectDutyDate(iso) { ui.selectedDate = iso; render(); }

    function removeSoldierFromDuty(iso, dtId, sid) {
      if (!canEditDuties()) return;
      if (!state.duties[iso] || !state.duties[iso][dtId]) return;
      state.duties[iso][dtId] = state.duties[iso][dtId].filter(function(x) { return x !== sid; });
      saveState();
      render();
    }

    function openAssignDutyModal(dtId) {
      if (!canEditDuties()) return;
      var dt = getDutyTypeById(dtId);
      if (!dt) return;
      var current = (state.duties[ui.selectedDate] && state.duties[ui.selectedDate][dtId]) ? state.duties[ui.selectedDate][dtId].slice() : [];
      ui.dutyModalSelection = current;
      renderAssignDutyModal(dtId);
    }

    function renderAssignDutyModal(dtId) {
      var dt = getDutyTypeById(dtId);
      if (!dt) return;
      var maxC = Math.max(1, Number(dt.maxCount) || 1);
      var sel = ui.dutyModalSelection;
      var prevBody = document.querySelector('#modal-box .modal-body');
      var prevScroll = prevBody ? prevBody.scrollTop : 0;

      var body = '';
      if (!state.personnel.length) {
        body = '<div class="empty-state">Спочатку додайте бійців у вкладці «Склад».</div>';
      } else {
        body = getOrderedSquads().map(function(sq) {
          var list = getSoldiersBySquad(sq.id);
          if (!list.length) return '';
          var rows = list.map(function(s) {
            var checked = sel.indexOf(s.id) !== -1;
            var locked = maxC > 1 && !checked && sel.length >= maxC;
            return '<label class="checkbox-row ' + (locked ? 'locked' : '') + '">' +
              '<div class="min0">' +
                '<div class="row" style="gap:6px">' + getCommanderBadgeHtml(s, sq) + '<span class="fw-bold text-sm">' + esc(s.rank) + ' ' + esc(s.name) + '</span></div>' +
              '</div>' +
              '<input type="checkbox" ' + (checked ? 'checked' : '') + ' ' + (locked ? 'disabled' : '') + ' onchange="toggleDutyModalSoldier(\'' + dtId + '\',\'' + s.id + '\')" />' +
            '</label>';
          }).join('');
          return '<div class="card-flush">' +
            '<div class="acc-header" style="cursor:default"><div class="row"><span class="dot" style="background:' + esc(sq.color) + '"></span><span class="fw-800 text-sm">' + esc(sq.name) + '</span></div></div>' +
            '<div class="acc-body">' + rows + '</div>' +
          '</div>';
        }).join('');
      }

      openModal(
        '<div class="modal-header">' +
          '<div><div class="modal-title">' + esc(dt.shortName) + ' — ' + fmtUA(ui.selectedDate) + '</div>' +
          '<div class="text-xs text-muted">Обрано: ' + sel.length + ' / ' + maxC + '</div></div>' +
          '<button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<div class="modal-body">' + body + '</div>' +
        '<div class="modal-footer">' +
          '<button type="button" class="btn btn-primary btn-full" onclick="saveAssignDutyModal(\'' + dtId + '\')">Зберегти наряд (' + sel.length + ' / ' + maxC + ')</button>' +
        '</div>'
      );

      var newBody = document.querySelector('#modal-box .modal-body');
      if (newBody && prevScroll > 0) newBody.scrollTop = prevScroll;
    }

    function toggleDutyModalSoldier(dtId, sid) {
      var dt = getDutyTypeById(dtId);
      var maxC = dt ? Math.max(1, Number(dt.maxCount) || 1) : 1;
      var idx = ui.dutyModalSelection.indexOf(sid);
      if (idx !== -1) {
        ui.dutyModalSelection.splice(idx, 1);
      } else if (maxC === 1) {
        ui.dutyModalSelection = [sid];
      } else if (ui.dutyModalSelection.length < maxC) {
        ui.dutyModalSelection.push(sid);
      }
      renderAssignDutyModal(dtId);
    }

    function saveAssignDutyModal(dtId) {
      if (!state.duties[ui.selectedDate]) state.duties[ui.selectedDate] = {};
      state.duties[ui.selectedDate][dtId] = ui.dutyModalSelection.slice();
      saveState(true);
      closeModal();
      showToast('Наряд збережено');
      render();
    }

    function buildDutyText(iso) {
      var day = state.duties[iso] || {};
      var lines = [state.groupNumber + ', ' + fmtUA(iso)];
      state.dutyTypes.forEach(function(dt, idx) {
        if (idx > 0) lines.push('');
        lines.push(dt.shortName + ':');
        var list = (day[dt.id] || []).map(getSoldierById).filter(Boolean);
        if (!list.length) lines.push('-');
        else list.forEach(function(s) { lines.push('-' + s.rank + ' ' + s.name); });
      });
      return lines.join('\n');
    }

    function openDutyPreviewModal(iso) {
      var txt = buildDutyText(iso);
      openModal(
        '<div class="modal-header">' +
          '<div class="modal-title">Наряд на ' + fmtUA(iso) + '</div>' +
          '<button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<pre class="preview-pre">' + esc(txt) + '</pre>' +
        '</div>' +
        '<div class="modal-footer">' +
          '<button type="button" class="btn btn-primary btn-full" onclick="copyDutyForDate(\'' + iso + '\');closeModal()">' + ico('copy', 15) + ' Скопіювати наряд</button>' +
        '</div>'
      );
    }

    function copyDutyForDate(iso) {
      copyText(buildDutyText(iso), 'Наряд скопійовано');
    }

    // =========================================================================
    // 9. ВКЛАДКА 2: ЗАДАЧІ (АНТИ-МОХЛЮВАННЯ + «БІЛЬШЕ НЕ АКТУАЛЬНО» + ПРАВА)
    // =========================================================================
    var PRIO_META = {
      high:   { label: 'Високий пріоритет', short: 'Терміново', rank: 0, cls: 'prio-high' },
      normal: { label: 'Звичайний пріоритет', short: 'Звичайний', rank: 1, cls: 'prio-normal' },
      low:    { label: 'Низький пріоритет', short: 'Низький', rank: 2, cls: 'prio-low' }
    };
    var pendingPhotoTaskId = null;

    function getPriorityMeta(p) {
      return PRIO_META[p] || PRIO_META.normal;
    }

    function canConfirmFinalDone() {
      return currentRole === 'admin' || currentRole === 'kg';
    }

    function canMoveToIrrelevant() {
      return currentRole === 'admin' || currentRole === 'kg';
    }

    function canDeleteTaskCompletely() {
      return currentRole === 'admin';
    }

    function isTaskDoneOrReviewOrIrrelevant(t) {
      return t && (t.status === 'done' || t.status === 'pending_review' || t.status === 'irrelevant');
    }

    function isTaskClosedOrInactive(t) {
      return !t || t.status === 'done' || t.status === 'irrelevant';
    }

    function appendTaskAudit(task, actionLabel) {
      if (!task) return;
      if (!Array.isArray(task.auditTrail)) task.auditTrail = [];
      var actor = (ROLES_META[currentRole] && ROLES_META[currentRole].short) || currentRole || 'Система';
      var nowStr = fmtTimeNow();
      task.statusChangedBy = actor;
      task.statusChangedAt = nowStr;
      task.auditTrail.push({
        by: actor,
        at: nowStr,
        action: actionLabel
      });
      if (task.auditTrail.length > 15) {
        task.auditTrail = task.auditTrail.slice(-15);
      }
    }

    function triggerTaskPhotoUpload(taskId) {
      if (!canUpdateTasks()) return;
      pendingPhotoTaskId = taskId;
      var inp = document.getElementById('task-photo-file-input');
      if (!inp) {
        inp = document.createElement('input');
        inp.type = 'file';
        inp.id = 'task-photo-file-input';
        inp.accept = 'image/*';
        inp.style.display = 'none';
        inp.onchange = handleTaskPhotoFileSelected;
        document.body.appendChild(inp);
      }
      inp.removeAttribute('capture');
      inp.value = '';
      inp.click();
    }

    function handleTaskPhotoFileSelected(ev) {
      var tid = pendingPhotoTaskId;
      pendingPhotoTaskId = null;
      var file = ev && ev.target && ev.target.files ? ev.target.files[0] : null;
      if (!tid || !file) return;
      if (file.size > 12 * 1024 * 1024) {
        showToast('Файл завеликий (макс. 12 МБ)', true);
        return;
      }
      var reader = new FileReader();
      reader.onload = function() {
        var img = new Image();
        img.onload = function() {
          try {
            var maxSide = 960;
            var w = img.width || 1;
            var h = img.height || 1;
            if (w > maxSide || h > maxSide) {
              if (w >= h) { h = Math.round(h * (maxSide / w)); w = maxSide; }
              else { w = Math.round(w * (maxSide / h)); h = maxSide; }
            }
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext('2d');
            if (!ctx) { showToast('Не вдалося обробити фото', true); return; }
            ctx.drawImage(img, 0, 0, w, h);
            var dataUrl = canvas.toDataURL('image/jpeg', 0.72);
            var t = state.tasks.find(function(x) { return x.id === tid; });
            if (t) {
              t.photoProof = dataUrl;
              t.photoUpdatedAt = fmtTimeNow();
              if (canConfirmFinalDone()) {
                t.status = 'done';
                t.verifiedBy = (ROLES_META[currentRole] && ROLES_META[currentRole].short) || currentRole;
                t.verifiedAt = fmtTimeNow();
                appendTaskAudit(t, 'Прикріпив фото та підтвердив «Виконано»');
              } else {
                t.status = 'pending_review';
                appendTaskAudit(t, 'Прикріпив фото та подав «На перевірку»');
              }
              saveState(true);
              showToast(canConfirmFinalDone() ? 'Фото прикріплено, задачу виконано' : 'Фото прикріплено, відправлено на перевірку');
              render();
            }
          } catch (err) {
            showToast('Помилка стиснення фото', true);
          }
        };
        img.onerror = function() { showToast('Не вдалося прочитати зображення', true); };
        img.src = String(reader.result || '');
      };
      reader.onerror = function() { showToast('Помилка читання файлу', true); };
      reader.readAsDataURL(file);
    }

    function removeTaskPhoto(taskId) {
      if (!canUpdateTasks()) return;
      var t = state.tasks.find(function(x) { return x.id === taskId; });
      if (!t) return;
      t.photoProof = '';
      t.photoUpdatedAt = '';
      if (t.requirePhoto && (t.status === 'done' || t.status === 'pending_review')) {
        t.status = 'received';
        appendTaskAudit(t, 'Видалив фотодоказ (статус повернуто до «Отримано»)');
      } else {
        appendTaskAudit(t, 'Видалив фотодоказ');
      }
      saveState(true);
      showToast('Фотодоказ видалено');
      render();
    }

    function openTaskPhotoPreview(taskId) {
      var t = state.tasks.find(function(x) { return x.id === taskId; });
      if (!t || !t.photoProof) return;
      openModal(
        '<div class="modal-header">' +
          '<div><div class="modal-title">Фотодоказ виконання</div><div class="text-xs text-muted">' + esc(t.target) + (t.photoUpdatedAt ? (' • ' + esc(t.photoUpdatedAt)) : '') + '</div></div>' +
          '<button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<img class="photo-full-img" src="' + t.photoProof + '" alt="Фотодоказ виконання задачі" />' +
          '<div class="text-sm" style="white-space:pre-wrap">' + esc(t.text) + '</div>' +
        '</div>' +
        '<div class="modal-footer">' +
          '<button type="button" class="btn btn-secondary btn-full" onclick="closeModal()">Закрити</button>' +
        '</div>'
      );
    }

    function renderTasksTab() {
      var canCreate = canCreateTasks();
      var canUpdate = canUpdateTasks();
      var canConfirm = canConfirmFinalDone();
      var canIrrelevant = canMoveToIrrelevant();
      var canDelete = canDeleteTaskCompletely();

      var createForm = '';
      if (canCreate) {
        var opts = TASK_RECIPIENTS.map(function(r, idx) {
          return '<option value="' + idx + '">' + esc(r.label) + '</option>';
        }).join('');
        createForm =
          '<div class="card stack">' +
            '<div class="section-title">Поставити задачу</div>' +
            '<div class="grid-2">' +
              '<div class="field">' +
                '<label class="field-label" for="task-rec">Кому</label>' +
                '<select id="task-rec" class="select">' + opts + '</select>' +
              '</div>' +
              '<div class="field">' +
                '<label class="field-label" for="task-prio">Пріоритетність</label>' +
                '<select id="task-prio" class="select">' +
                  '<option value="normal">Звичайний</option>' +
                  '<option value="high">Високий (Терміново)</option>' +
                  '<option value="low">Низький</option>' +
                '</select>' +
              '</div>' +
            '</div>' +
            '<div class="field">' +
              '<label class="field-label" for="task-text">Текст задачі</label>' +
              '<textarea id="task-text" class="textarea" placeholder="Опишіть задачу..."></textarea>' +
            '</div>' +
            '<div class="field">' +
              '<label class="field-label" for="task-author">Хто поставив</label>' +
              '<input id="task-author" class="input" type="text" placeholder="Прізвище або посада..." />' +
            '</div>' +
            '<label class="toggle-pill">' +
              '<input id="task-req-photo" type="checkbox" />' +
              '<span>Обов\'язковий фотодоказ після виконання</span>' +
            '</label>' +
            '<button type="button" class="btn btn-primary btn-full" onclick="createNewTask()">+ Поставити задачу</button>' +
          '</div>';
      }

      // Видимі задачі для поточної ролі
      var visibleTasks = state.tasks.filter(function(t) { return isTaskVisibleForRole(t, currentRole); });

      // Фільтри отримувачів
      var canSeeAll = isAdmin() || Boolean(getPerm().tasksViewAll);
      var recPills = '';
      if (canSeeAll) {
        var recOpts = [{ key: 'all', label: 'Усі отримувачі' }].concat(
          TASK_RECIPIENTS.map(function(r) { return { key: r.targetRole, label: r.label.replace('Командиру ', 'КВ ').replace('відділення', 'відд.') }; })
        );
        recPills = '<div class="pills-scroll">' + recOpts.map(function(o) {
          return '<button type="button" class="pill ' + (ui.tasksFilterRecipient === o.key ? 'active' : '') + '" onclick="ui.tasksFilterRecipient=\'' + o.key + '\';render()">' + esc(o.label) + '</button>';
        }).join('') + '</div>';
      }

      var irrelevantCount = visibleTasks.filter(function(t) { return t.status === 'irrelevant'; }).length;

      // Вкладки/фільтри статусів задач, включно з «Більше не актуально»
      var statusFilters = [
        { key: 'all', label: 'Усі (' + visibleTasks.length + ')' },
        { key: 'active', label: 'Активні' },
        { key: 'received', label: 'Отримано' },
        { key: 'pending_review', label: 'На перевірці' },
        { key: 'done', label: 'Виконано' },
        { key: 'failed', label: 'Не виконано' },
        { key: 'irrelevant', label: 'Більше не актуально (' + irrelevantCount + ')' }
      ];
      var statusPills = '<div class="pills-scroll">' + statusFilters.map(function(sf) {
        return '<button type="button" class="pill ' + (ui.tasksFilterStatus === sf.key ? 'active' : '') + '" onclick="ui.tasksFilterStatus=\'' + sf.key + '\';render()">' + esc(sf.label) + '</button>';
      }).join('') + '</div>';

      var filtered = visibleTasks
        .filter(function(t) {
          if (canSeeAll && ui.tasksFilterRecipient !== 'all' && t.targetRole !== ui.tasksFilterRecipient) return false;
          if (ui.tasksFilterStatus === 'active') return !isTaskClosedOrInactive(t);
          if (ui.tasksFilterStatus === 'all') return t.status !== 'irrelevant';
          if (ui.tasksFilterStatus !== t.status) return false;
          return true;
        })
        .sort(function(a, b) {
          var aDone = isTaskClosedOrInactive(a) ? 1 : 0;
          var bDone = isTaskClosedOrInactive(b) ? 1 : 0;
          if (aDone !== bDone) return aDone - bDone;
          var ra = getPriorityMeta(a.priority).rank;
          var rb = getPriorityMeta(b.priority).rank;
          if (ra !== rb) return ra - rb;
          return 0;
        });

      var copyBtn = '<button type="button" class="btn btn-sm btn-info btn-full" onclick="copyActiveTasks()">' + ico('copy', 14) + ' Скопіювати активні задачі</button>';

      var cards = filtered.length ? filtered.map(function(t) {
        var showRemark = t.status === 'failed' || Boolean(t.remark) || Boolean(ui.tasksExpandedRemarks[t.id]);
        var pm = getPriorityMeta(t.priority);
        var stBadge = t.status === 'done'
          ? '<span class="badge badge-ok">Виконано</span>'
          : t.status === 'pending_review'
            ? '<span class="badge badge-warn">На перевірці</span>'
            : t.status === 'irrelevant'
              ? '<span class="badge">Більше не актуально</span>'
              : t.status === 'failed'
                ? '<span class="badge badge-err">Не виконано</span>'
                : '<span class="badge badge-info">Отримав задачу</span>';

        var photoRequirementBadge = t.requirePhoto
          ? '<span class="badge badge-warn">Фото обов\'язкове</span>'
          : '<span class="badge badge-info">Фото не обов\'язкове</span>';

        var showPhotoBlock = Boolean(t.requirePhoto) || Boolean(t.photoProof) || isTaskDoneOrReviewOrIrrelevant(t);
        var missingReqPhoto = Boolean(t.requirePhoto) && !t.photoProof;
        var photoBlockHtml = '';
        if (showPhotoBlock) {
          var imgPreviewHtml = t.photoProof
            ? ('<img class="photo-thumb" src="' + t.photoProof + '" alt="Фотодоказ" onclick="openTaskPhotoPreview(\'' + t.id + '\')" />' +
               '<div class="row-between text-xs text-muted">' +
                 '<span>Додано: ' + esc(t.photoUpdatedAt || 'так') + '</span>' +
                 (canUpdate ? '<button type="button" style="color:#f87171;font-weight:700" onclick="removeTaskPhoto(\'' + t.id + '\')">Видалити фото</button>' : '') +
               '</div>')
            : ('<div class="text-xs ' + (missingReqPhoto ? 'fw-bold" style="color:#fcd34d' : 'text-muted') + '">' +
                (t.requirePhoto
                  ? 'Обов\'язково вкладіть фотодоказ перед подачею на перевірку.'
                  : 'Фотодоказ не обов\'язковий, але можна вкласти при виконанні.') +
               '</div>');

          photoBlockHtml =
            '<div class="photo-proof-box ' + (missingReqPhoto && (t.status === 'done' || t.status === 'pending_review') ? 'required-missing' : '') + '">' +
              '<div class="row-between">' +
                '<span class="fw-bold text-xs">Фотодоказ виконання</span>' +
                (canUpdate
                  ? ('<button type="button" class="btn btn-xs ' + (missingReqPhoto ? 'btn-warn' : 'btn-info') + '" onclick="triggerTaskPhotoUpload(\'' + t.id + '\')">' +
                      ico('upload', 12) + ' ' + (t.photoProof ? 'Замінити фото' : 'Вкласти фото') +
                    '</button>')
                  : '') +
              '</div>' +
              imgPreviewHtml +
            '</div>';
        }

        // Кнопки статусу: для КВ замість "Виконано" подається "На перевірку", фінальне "Виконано" підтверджує Адмін / КГ
        var doneBtnLabel = canConfirm ? 'Виконано' : 'На перевірку';
        var doneBtnTarget = canConfirm ? 'done' : 'pending_review';
        var isDoneOrReviewActive = canConfirm ? (t.status === 'done') : (t.status === 'pending_review' || t.status === 'done');

        var statusButtonsHtml = '';
        if (canUpdate && t.status !== 'irrelevant') {
          statusButtonsHtml =
            '<div class="status-group">' +
              '<button type="button" class="status-btn ' + (t.status === 'received' ? 'st-received' : '') + '" onclick="setTaskStatus(\'' + t.id + '\',\'received\')">Отримав задачу</button>' +
              '<button type="button" class="status-btn ' + (isDoneOrReviewActive ? (t.status === 'pending_review' ? 'st-pending-review' : 'st-done') : '') + '" onclick="setTaskStatus(\'' + t.id + '\',\'' + doneBtnTarget + '\')">' + doneBtnLabel + '</button>' +
              '<button type="button" class="status-btn ' + (t.status === 'failed' ? 'st-failed' : '') + '" onclick="setTaskStatus(\'' + t.id + '\',\'failed\')">Не виконано</button>' +
            '</div>' +
            (canConfirm && t.status === 'pending_review' ? (
              '<div class="row" style="gap:6px">' +
                '<button type="button" class="btn btn-xs btn-primary min0" onclick="setTaskStatus(\'' + t.id + '\',\'done\')">✓ Підтвердити виконання</button>' +
                '<button type="button" class="btn btn-xs btn-danger" onclick="setTaskStatus(\'' + t.id + '\',\'failed\')">✕ Відхилити</button>' +
              '</div>'
            ) : '');
        }

        // Перенесення у «Більше не актуально» або повернення — тільки для Адміна та КГ
        var irrelevantActionHtml = '';
        if (canIrrelevant) {
          if (t.status !== 'irrelevant') {
            irrelevantActionHtml = '<button type="button" class="btn btn-xs btn-secondary btn-full" onclick="moveTaskToIrrelevant(\'' + t.id + '\')">Перенести у «Більше не актуально»</button>';
          } else {
            irrelevantActionHtml = '<button type="button" class="btn btn-xs btn-info btn-full" onclick="restoreTaskFromIrrelevant(\'' + t.id + '\')">Повернути в активні задачі</button>';
          }
        }

        // Журнал змін статусу (хто і коли змінював)
        var auditHtml = '';
        if (Array.isArray(t.auditTrail) && t.auditTrail.length > 0) {
          var recentLogs = t.auditTrail.slice(-3).map(function(a) {
            return '<div class="audit-item"><span>' + esc(a.by) + ': ' + esc(a.action) + '</span><span>' + esc(a.at) + '</span></div>';
          }).join('');
          auditHtml = '<div class="audit-log-box">' + recentLogs + '</div>';
        }

        return '<div class="task-card st-' + esc(t.status) + (t.priority === 'high' ? ' prio-high-card' : '') + '">' +
          '<div class="row-between wrap">' +
            '<div class="row wrap" style="gap:5px">' +
              '<span class="badge badge-warn">' + esc(t.target) + '</span>' +
              '<span class="prio-badge ' + pm.cls + '">' + esc(pm.short) + '</span>' +
              photoRequirementBadge +
            '</div>' +
            '<div class="row" style="gap:6px">' + stBadge +
              (canDelete ? '<button type="button" class="btn-icon btn-icon-sm danger" onclick="deleteTask(\'' + t.id + '\')" title="Видалити повністю">✕</button>' : '') +
            '</div>' +
          '</div>' +
          '<div style="font-size:14.5px;color:#fff;white-space:pre-wrap">' + esc(t.text) + '</div>' +
          '<div class="row-between text-xs text-muted">' +
            '<span>' + (t.author ? ('Поставив: ' + esc(t.author)) : '') + '</span>' +
            '<span>' + esc(t.createdAt) + '</span>' +
          '</div>' +
          photoBlockHtml +
          statusButtonsHtml +
          (showRemark ? (
            '<div class="field">' +
              '<label class="field-label">Зауваження / Причина (обов\'язково для «Не виконано»)</label>' +
              '<div class="row">' +
                '<input id="rem-' + t.id + '" class="input" type="text" value="' + esc(t.remark) + '" placeholder="Вкажіть причину або зауваження..." ' + (canUpdate && t.status !== 'irrelevant' ? '' : 'disabled') + ' />' +
                (canUpdate && t.status !== 'irrelevant' ? '<button type="button" class="btn btn-sm btn-secondary" onclick="saveTaskRemark(\'' + t.id + '\')">Зберегти</button>' : '') +
              '</div>' +
            '</div>'
          ) : '') +
          irrelevantActionHtml +
          auditHtml +
        '</div>';
      }).join('') : '<div class="card empty-state">Задач за обраним фільтром немає.</div>';

      return createForm + recPills + statusPills + copyBtn + cards;
    }

    function createNewTask() {
      if (!canCreateTasks()) return;
      var recEl = document.getElementById('task-rec');
      var prioEl = document.getElementById('task-prio');
      var txtEl = document.getElementById('task-text');
      var authEl = document.getElementById('task-author');
      var reqPhotoEl = document.getElementById('task-req-photo');
      var text = txtEl ? txtEl.value.trim() : '';
      if (!text) { showToast('Введіть текст задачі', true); return; }
      var rec = TASK_RECIPIENTS[Number(recEl ? recEl.value : 0)] || TASK_RECIPIENTS[0];
      var prioVal = prioEl && (prioEl.value === 'high' || prioEl.value === 'low') ? prioEl.value : 'normal';
      var reqPhoto = Boolean(reqPhotoEl && reqPhotoEl.checked);
      var newTask = {
        id: genId('task'),
        text: text,
        target: rec.label,
        targetRole: rec.targetRole,
        targetSquadId: rec.targetSquadId,
        author: authEl ? authEl.value.trim() : '',
        priority: prioVal,
        requirePhoto: reqPhoto,
        photoProof: '',
        photoUpdatedAt: '',
        status: 'received',
        remark: '',
        createdAt: fmtTimeNow(),
        auditTrail: []
      };
      appendTaskAudit(newTask, 'Поставив задачу' + (reqPhoto ? ' (фото обов\'язкове)' : ''));
      state.tasks.unshift(newTask);
      saveState(true);
      showToast('Задачу поставлено');
      render();
    }

    function setTaskStatus(taskId, status) {
      if (!canUpdateTasks()) return;
      var t = state.tasks.find(function(x) { return x.id === taskId; });
      if (!t || t.status === 'irrelevant') return;

      // 1. Якщо вимагається фотодоказ — забороняємо подавати на перевірку або закривати без фото
      if ((status === 'done' || status === 'pending_review') && t.requirePhoto && !t.photoProof) {
        showToast('Спочатку вкладіть фотодоказ виконання задачі', true);
        render();
        return;
      }

      // 2. Якщо статус "Не виконано" — вимагаємо зауваження/причину
      if (status === 'failed') {
        ui.tasksExpandedRemarks[taskId] = true;
        var remInput = document.getElementById('rem-' + taskId);
        var currentRemark = remInput ? remInput.value.trim() : (t.remark || '').trim();
        if (!currentRemark) {
          render();
          showToast('Вкажіть причину в полі «Зауваження» перед статусом «Не виконано»', true);
          var focusInp = document.getElementById('rem-' + taskId);
          if (focusInp) focusInp.focus();
          return;
        }
        t.remark = currentRemark;
      }

      // 3. Командири відділень не закривають задачу напряму у "Виконано" — переводять у "На перевірці"
      if (status === 'done' && !canConfirmFinalDone()) {
        status = 'pending_review';
      }

      t.status = status;
      if (status === 'done') {
        t.verifiedBy = (ROLES_META[currentRole] && ROLES_META[currentRole].short) || currentRole;
        t.verifiedAt = fmtTimeNow();
      }

      var labelMap = {
        received: 'Позначив «Отримав задачу»',
        pending_review: 'Подав «На перевірку»',
        done: 'Підтвердив «Виконано»',
        failed: 'Позначив «Не виконано»'
      };
      appendTaskAudit(t, labelMap[status] || ('Статус: ' + status));
      saveState(true);
      render();
    }

    function moveTaskToIrrelevant(taskId) {
      if (!canMoveToIrrelevant()) {
        showToast('Переносити у «Більше не актуально» може лише Адмін або КГ', true);
        return;
      }
      var t = state.tasks.find(function(x) { return x.id === taskId; });
      if (!t) return;
      t.status = 'irrelevant';
      appendTaskAudit(t, 'Переніс у «Більше не актуально»');
      saveState(true);
      showToast('Перенесено у «Більше не актуально»');
      render();
    }

    function restoreTaskFromIrrelevant(taskId) {
      if (!canMoveToIrrelevant()) return;
      var t = state.tasks.find(function(x) { return x.id === taskId; });
      if (!t) return;
      t.status = 'received';
      appendTaskAudit(t, 'Повернув з «Більше не актуально» в роботу');
      saveState(true);
      showToast('Задачу повернуто в активні');
      render();
    }

    function saveTaskRemark(taskId) {
      if (!canUpdateTasks()) return;
      var t = state.tasks.find(function(x) { return x.id === taskId; });
      var inp = document.getElementById('rem-' + taskId);
      if (!t || !inp) return;
      var val = inp.value.trim();
      if (t.status === 'failed' && !val) {
        showToast('Для статусу «Не виконано» зауваження не може бути порожнім', true);
        return;
      }
      t.remark = val;
      appendTaskAudit(t, val ? ('Оновив зауваження: ' + val) : 'Очистив зауваження');
      saveState(true);
      showToast('Зауваження збережено');
      render();
    }

    function deleteTask(taskId) {
      if (!canDeleteTaskCompletely()) {
        showToast('Видаляти задачу повністю може лише Адмін', true);
        return;
      }
      state.tasks = state.tasks.filter(function(x) { return x.id !== taskId; });
      saveState(true);
      showToast('Задачу видалено');
      render();
    }

    function copyActiveTasks() {
      var list = state.tasks.filter(function(t) { return !isTaskClosedOrInactive(t) && isTaskVisibleForRole(t, currentRole); });
      if (!list.length) { showToast('Активних задач немає'); return; }
      var lines = ['Активні задачі (' + fmtUA(todayISO()) + '):'];
      list.forEach(function(t, i) {
        var st = t.status === 'failed' ? 'НЕ ВИКОНАНО' : (t.status === 'pending_review' ? 'НА ПЕРЕВІРЦІ' : 'В роботі');
        var pm = getPriorityMeta(t.priority);
        var line = (i + 1) + '. [' + pm.short + '] [' + t.target + '] ' + t.text + ' — ' + st;
        if (t.requirePhoto) line += ' [Фото обов\'язкове' + (t.photoProof ? ', додано' : ', немає') + ']';
        if (t.author) line += ' (від: ' + t.author + ')';
        if (t.remark) line += ' | Зауваження: ' + t.remark;
        lines.push(line);
      });
      copyText(lines.join('\n'), 'Активні задачі скопійовано');
    }

    // =========================================================================
    // 10. ВКЛАДКА 3: РОЗХІД (11 КАТЕГОРІЙ + ПЛАНУВАННЯ + УНІКАЛЬНІСТЬ)
    // =========================================================================
    function renderRozkhidTab() {
      var iso = ui.rozkhidDate;
      var day = ensureRozkhidDay(iso);
      var mode = getRozkhidMode(); // 'view' | 'own' | 'all'
      var total = state.personnel.length;
      var absentSum = 0;
      ROZKHID_CATS.forEach(function(c) { absentSum += (Number(day[c.key].count) || 0); });
      var present = Math.max(0, total - absentSum);

      // Панель дати
      var dateBar =
        '<div class="date-bar">' +
          '<button type="button" class="btn-icon btn-icon-sm" onclick="shiftRozkhidDate(-1)">◀</button>' +
          '<div class="date-bar-title">' + esc(state.groupNumber) + ' • ' + fmtUA(iso) + '</div>' +
          '<button type="button" class="btn-icon btn-icon-sm" onclick="shiftRozkhidDate(1)">▶</button>' +
        '</div>' +
        '<div class="row wrap">' +
          '<button type="button" class="btn btn-xs btn-secondary" onclick="ui.rozkhidDate=todayISO();render()">Сьогодні</button>' +
          '<button type="button" class="btn btn-xs btn-secondary" onclick="ui.rozkhidDate=shiftISO(todayISO(),1);render()">Завтра</button>' +
          (mode !== 'view' ? '<button type="button" class="btn btn-xs btn-info" onclick="openScheduleAbsenceModal(null)">' + ico('calendar', 13) + ' Запланувати на дату</button>' : '') +
          (mode === 'all' ? '<button type="button" class="btn btn-xs btn-primary" onclick="applyScheduledAndDutiesToRozkhid(\'' + iso + '\',true)">' + ico('bolt', 13) + ' Автопідтягнути</button>' : '') +
          (mode === 'all' ? '<button type="button" class="btn btn-xs btn-danger" onclick="clearRozkhidForDate(\'' + iso + '\')">' + ico('clear', 13) + ' Очистити</button>' : '') +
        '</div>';

      // Згортуваний список запланованих на майбутні дати
      var today = todayISO();
      var upcoming = state.scheduledAbsences
        .filter(function(sa) { return sa && getSoldierById(sa.soldierId) && (sa.toDate || sa.fromDate) >= today; })
        .sort(function(a, b) { return a.fromDate.localeCompare(b.fromDate); });

      var schedBanner = '';
      if (upcoming.length) {
        var schedItems = upcoming.map(function(sa) {
          var s = getSoldierById(sa.soldierId);
          var cat = ROZKHID_CATS.find(function(c) { return c.key === sa.catKey; });
          var range = sa.toDate && sa.toDate !== sa.fromDate ? (fmtUA(sa.fromDate) + ' – ' + fmtUA(sa.toDate)) : fmtUA(sa.fromDate);
          var canDel = mode === 'all' || (mode === 'own' && s && s.squadId === getMySquadId());
          return '<div class="sched-item">' +
            '<div class="min0">' +
              '<div class="fw-bold text-sm">' + esc(s ? s.name : '') + ' <span class="badge badge-warn">' + esc(cat ? cat.label : sa.catKey) + '</span></div>' +
              '<div class="text-xs text-muted">' + range + (sa.note ? (' • ' + esc(sa.note)) : '') + '</div>' +
            '</div>' +
            (canDel ? '<button type="button" class="btn-icon btn-icon-sm danger" onclick="deleteScheduledAbsence(\'' + sa.id + '\')">✕</button>' : '') +
          '</div>';
        }).join('');

        schedBanner =
          '<div class="card-flush">' +
            '<div class="acc-header ' + (ui.rozkhidSchedOpen ? 'open' : '') + '" onclick="ui.rozkhidSchedOpen=!ui.rozkhidSchedOpen;render()">' +
              '<div class="row"><span class="chevron">▶</span><span class="fw-800 text-sm row" style="gap:6px">' + ico('calendar', 14) + ' Заплановано на майбутні дати (' + upcoming.length + ')</span></div>' +
            '</div>' +
            (ui.rozkhidSchedOpen ? '<div class="acc-body stack-sm" style="padding:10px">' + schedItems + '</div>' : '') +
          '</div>';
      }

      // Підсумок З/с та Вн
      var kpi =
        '<div class="grid-2">' +
          '<div class="kpi-box"><div class="kpi-val">' + total + '</div><div class="kpi-lbl">З/с (За списком)</div></div>' +
          '<div class="kpi-box"><div class="kpi-val" style="color:var(--accent)">' + present + '</div><div class="kpi-lbl">Вн (В наявності)</div></div>' +
        '</div>';

      // 11 категорій
      var catRows = ROZKHID_CATS.map(function(c) {
        var entry = day[c.key];
        var cnt = Number(entry.count) || 0;
        var chips = entry.ids.map(function(id) {
          var s = getSoldierById(id);
          return s ? '<span class="name-chip">' + esc(s.name.split(/\s+/)[0]) + '</span>' : '';
        }).join('');

        return '<div class="rozkhid-row ' + (cnt > 0 ? 'has-count' : '') + '">' +
          '<div class="row-between">' +
            '<div class="fw-bold text-sm">' + esc(c.label) + (c.hint ? ' <span class="text-xs text-muted">(' + esc(c.hint) + ')</span>' : '') + '</div>' +
            '<div class="row" style="gap:6px">' +
              (mode !== 'view' ? '<button type="button" class="btn btn-xs btn-secondary" onclick="openRozkhidPickerModal(\'' + c.key + '\')">ПІБ (' + entry.ids.length + ')</button>' : '') +
              (mode === 'all' ? (
                '<div class="stepper">' +
                  '<button type="button" class="step-btn" onclick="stepRozkhidCount(\'' + c.key + '\',-1)">−</button>' +
                  '<span class="step-val">' + cnt + '</span>' +
                  '<button type="button" class="step-btn" onclick="stepRozkhidCount(\'' + c.key + '\',1)">+</button>' +
                '</div>'
              ) : '<span class="step-val">' + cnt + '</span>') +
            '</div>' +
          '</div>' +
          (chips ? '<div class="row wrap" style="gap:4px">' + chips + '</div>' : '') +
        '</div>';
      }).join('');

      // Прев'ю та копіювання
      var preview =
        '<div class="card stack">' +
          '<div class="section-title">Готовий розхід</div>' +
          '<div class="grid-2">' +
            '<label class="toggle-pill"><input type="checkbox" ' + (ui.rozkhidShowNames ? 'checked' : '') + ' onchange="ui.rozkhidShowNames=this.checked;render()" /><span>Прізвища в дужках</span></label>' +
            '<label class="toggle-pill"><input type="checkbox" ' + (ui.rozkhidHideZeros ? 'checked' : '') + ' onchange="ui.rozkhidHideZeros=this.checked;render()" /><span>Приховати нулі</span></label>' +
          '</div>' +
          '<pre class="preview-pre">' + esc(buildRozkhidText(iso)) + '</pre>' +
          '<button type="button" class="btn btn-primary btn-full" onclick="copyText(buildRozkhidText(\'' + iso + '\'),\'Розхід скопійовано\')">' + ico('copy', 15) + ' Скопіювати розхід</button>' +
        '</div>';

      return dateBar +
        (mode === 'own' ? '<div class="info-banner">Ви можете відмічати у розході бійців лише свого відділення через кнопку «ПІБ».</div>' : '') +
        (mode === 'view' ? '<div class="info-banner">Режим перегляду розходу.</div>' : '') +
        schedBanner + kpi +
        '<div class="card stack-sm">' + catRows + '</div>' + preview;
    }

    function shiftRozkhidDate(delta) {
      ui.rozkhidDate = shiftISO(ui.rozkhidDate, delta);
      render();
    }

    function stepRozkhidCount(catKey, delta) {
      if (getRozkhidMode() !== 'all') return;
      var day = ensureRozkhidDay(ui.rozkhidDate);
      var entry = day[catKey];
      var next = (Number(entry.count) || 0) + delta;
      entry.count = Math.max(entry.ids.length, next);
      saveState();
      render();
    }

    function openRozkhidPickerModal(catKey) {
      if (getRozkhidMode() === 'view') return;
      ui.rozkhidModalSearch = '';
      renderRozkhidPickerModal(catKey);
    }

    function renderRozkhidPickerModal(catKey) {
      var cat = ROZKHID_CATS.find(function(c) { return c.key === catKey; });
      if (!cat) return;
      var day = ensureRozkhidDay(ui.rozkhidDate);
      var entry = day[catKey];
      var mode = getRozkhidMode();
      var mySq = getMySquadId();

      var listHtml = getOrderedSquads().map(function(sq) {
        if (mode === 'own' && sq.id !== mySq) return '';
        var soldiers = getSoldiersBySquad(sq.id, ui.rozkhidModalSearch);
        if (!soldiers.length) return '';
        var isCollapsed = Boolean(ui.rozkhidModalCollapsed[sq.id]);
        var rows = isCollapsed ? '' : soldiers.map(function(s) {
          var checked = entry.ids.indexOf(s.id) !== -1;
          var otherCat = '';
          if (!checked) {
            for (var i = 0; i < ROZKHID_CATS.length; i++) {
              if (ROZKHID_CATS[i].key !== catKey && day[ROZKHID_CATS[i].key].ids.indexOf(s.id) !== -1) {
                otherCat = ROZKHID_CATS[i].label;
                break;
              }
            }
          }
          return '<label class="checkbox-row">' +
            '<div class="min0">' +
              '<div class="row" style="gap:6px">' + getCommanderBadgeHtml(s, sq) + '<span class="fw-bold text-sm">' + esc(s.name) + '</span></div>' +
              (otherCat ? '<div class="text-xs" style="color:#fcd34d">Зараз у: ' + esc(otherCat) + ' (переміститься)</div>' : '') +
            '</div>' +
            '<input type="checkbox" ' + (checked ? 'checked' : '') + ' onchange="toggleRozkhidSoldier(\'' + catKey + '\',\'' + s.id + '\')" />' +
          '</label>';
        }).join('');

        return '<div class="card-flush">' +
          '<div class="acc-header ' + (!isCollapsed ? 'open' : '') + '" onclick="ui.rozkhidModalCollapsed[\'' + sq.id + '\']=!ui.rozkhidModalCollapsed[\'' + sq.id + '\'];renderRozkhidPickerModal(\'' + catKey + '\')">' +
            '<div class="row"><span class="chevron">▶</span><span class="dot" style="background:' + esc(sq.color) + '"></span><span class="fw-800 text-sm">' + esc(sq.name) + '</span></div>' +
            '<span class="text-xs text-muted">' + soldiers.length + ' ос.</span>' +
          '</div>' +
          (!isCollapsed ? '<div class="acc-body">' + rows + '</div>' : '') +
        '</div>';
      }).join('');

      openModal(
        '<div class="modal-header">' +
          '<div><div class="modal-title">' + esc(cat.label) + (cat.hint ? ' (' + esc(cat.hint) + ')' : '') + ' • ' + fmtUA(ui.rozkhidDate) + '</div>' +
          '<div class="text-xs text-muted">Обрано: ' + entry.ids.length + ' ос.</div></div>' +
          '<button type="button" class="btn-icon btn-icon-sm" onclick="closeModal();render()">✕</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<input class="input" type="search" placeholder="Пошук за прізвищем..." value="' + esc(ui.rozkhidModalSearch) + '" oninput="ui.rozkhidModalSearch=this.value;renderRozkhidPickerModal(\'' + catKey + '\')" />' +
          (listHtml || '<div class="empty-state">Нікого не знайдено</div>') +
          '<button type="button" class="btn btn-primary btn-full" onclick="closeModal();render()">Готово</button>' +
        '</div>'
      );
    }

    function toggleRozkhidSoldier(catKey, soldierId) {
      var s = getSoldierById(soldierId);
      if (!s || !canEditSoldierInRozkhid(s)) return;
      var day = ensureRozkhidDay(ui.rozkhidDate);
      var entry = day[catKey];
      var idx = entry.ids.indexOf(soldierId);
      if (idx !== -1) {
        entry.ids.splice(idx, 1);
        if (entry.count > 0) entry.count = Math.max(entry.ids.length, entry.count - 1);
      } else {
        removeSoldierFromAllRozkhidCats(ui.rozkhidDate, soldierId, catKey);
        entry.ids.push(soldierId);
        entry.count = Math.max(entry.count, entry.ids.length);
      }
      saveState();
      renderRozkhidPickerModal(catKey);
    }

    // Планування відсутності на майбутню дату або період
    function openScheduleAbsenceModal(preselectedSoldierId) {
      var mode = getRozkhidMode();
      var pMode = getPersonnelMode();
      if (mode === 'view' && pMode === 'view') return;
      var mySq = getMySquadId();
      var restrictToOwn = (mode === 'own' && pMode !== 'all') || (pMode === 'own_status' && mode !== 'all');

      var eligible = [];
      getOrderedSquads().forEach(function(sq) {
        if (restrictToOwn && sq.id !== mySq) return;
        getSoldiersBySquad(sq.id).forEach(function(s) { eligible.push({ s: s, sq: sq }); });
      });

      if (!eligible.length) { showToast('Немає доступних бійців для планування', true); return; }

      var sOpts = eligible.map(function(item) {
        var sel = preselectedSoldierId === item.s.id ? 'selected' : '';
        return '<option value="' + item.s.id + '" ' + sel + '>' + esc(item.s.name) + ' (' + esc(item.sq.name) + ')</option>';
      }).join('');

      var cOpts = SCHEDULE_CATS.map(function(c) {
        return '<option value="' + c.key + '">' + esc(c.label) + (c.hint ? ' (' + esc(c.hint) + ')' : '') + '</option>';
      }).join('');

      var defDate = ui.rozkhidDate || todayISO();
      openModal(
        '<div class="modal-header">' +
          '<div class="modal-title">' + ico('calendar', 17) + ' Запланувати відсутність</div>' +
          '<button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<div class="field"><label class="field-label">Військовослужбовець</label><select id="sa-soldier" class="select">' + sOpts + '</select></div>' +
          '<div class="field"><label class="field-label">Причина / Категорія</label><select id="sa-cat" class="select">' + cOpts + '</select></div>' +
          '<div class="grid-2">' +
            '<div class="field"><label class="field-label">З дати</label><input id="sa-from" class="input" type="date" value="' + defDate + '" /></div>' +
            '<div class="field"><label class="field-label">По дату</label><input id="sa-to" class="input" type="date" value="' + defDate + '" /></div>' +
          '</div>' +
          '<div class="field"><label class="field-label">Примітка (необов\'язково)</label><input id="sa-note" class="input" type="text" placeholder="Наприклад: кардіолог, відрядження..." /></div>' +
          '<button type="button" class="btn btn-primary btn-full" onclick="saveScheduledAbsence()">Зберегти в план</button>' +
        '</div>'
      );
    }

    function saveScheduledAbsence() {
      var sid = document.getElementById('sa-soldier').value;
      var catKey = document.getElementById('sa-cat').value;
      var fromDate = document.getElementById('sa-from').value || todayISO();
      var toDate = document.getElementById('sa-to').value || fromDate;
      if (toDate < fromDate) toDate = fromDate;
      var note = document.getElementById('sa-note').value.trim();

      state.scheduledAbsences.push({
        id: genId('sa'),
        soldierId: sid,
        catKey: catKey,
        fromDate: fromDate,
        toDate: toDate,
        note: note
      });

      // Якщо поточна дата розходу потрапляє у період — одразу застосуємо

      } else {
        saveState(true);
      }
      closeModal();
      showToast('Заплановано на ' + fmtUA(fromDate) + (toDate !== fromDate ? (' – ' + fmtUA(toDate)) : ''));

    function deleteScheduledAbsence(saId) {
      state.scheduledAbsences = state.scheduledAbsences.filter(function(x) { return x.id !== saId; });

      showToast('Запис видалено');
      render();

    function renderPersonnelTab() {

        '</div>';

        if (ui.personnelSquadFilter !== 'all' && ui.personnelSquadFilter !== sq.id) return '';
        var list = getSoldiersBySquad(sq.id, ui.personnelSearch);
        var collapsed = Boolean(ui.collapsedSquads[sq.id]);

        var bodyHtml = collapsed ? '' : (list.length ? list.map(function(s) {
          var expanded = Boolean(ui.expandedSoldiers[s.id]);
          var curStatus = getSoldierPresenceOnDate(today, s.id);
          var curCatObj = ROZKHID_CATS.find(function(c) { return c.key === curStatus; });
          var statusBadge = curStatus === 'present'
            ? '<span class="badge badge-ok">В строю</span>'
            : '<span class="badge badge-warn">' + esc(curCatObj ? curCatObj.label : curStatus) + '</span>';

          var expandHtml = '';
          if (expanded) {
            var canPres = canEditSoldierPresence(s);
            var presBtns = PRESENCE_STATUSES.map(function(ps) {
              var active = curStatus === ps.key;
              var cls = 'presence-btn' + (active ? (ps.key === 'present' ? ' active-ok' : ' active-warn') : '');
              return '<button type="button" class="' + cls + '" ' + (canPres ? ('onclick="setSoldierPresenceQuick(\'' + s.id + '\',\'' + ps.key + '\')"') : 'disabled style="opacity:0.55"') + '>' + esc(ps.label) + '</button>';
            }).join('');

            var myUpcoming = state.scheduledAbsences.filter(function(sa) {
              return sa.soldierId === s.id && (sa.toDate || sa.fromDate) >= today;
            });
            var upHtml = myUpcoming.length ? '<div class="stack-sm">' + myUpcoming.map(function(sa) {
              var cat = ROZKHID_CATS.find(function(c) { return c.key === sa.catKey; });
              var rng = sa.toDate && sa.toDate !== sa.fromDate ? (fmtUA(sa.fromDate) + ' – ' + fmtUA(sa.toDate)) : fmtUA(sa.fromDate);
              return '<div class="row-between text-xs" style="padding:6px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">' +
                '<span class="row" style="gap:5px">' + ico('calendar', 12) + ' ' + esc(cat ? cat.label : sa.catKey) + ': ' + rng + (sa.note ? (' (' + esc(sa.note) + ')') : '') + '</span>' +
                (canPres ? '<button type="button" style="color:#f87171;font-weight:800;padding:2px 6px" onclick="deleteScheduledAbsence(\'' + sa.id + '\')">✕</button>' : '') +
              '</div>';
            }).join('') + '</div>' : '';

            expandHtml =
              '<div class="soldier-expand stack">' +
                '<div class="row-between text-xs text-muted"><span>Статус на сьогодні (' + fmtUA(today) + '):</span><span>Всього нарядів: <b style="color:#fff">' + (dutyCounts[s.id] || 0) + '</b></span></div>' +
                '<div class="presence-grid">' + presBtns + '</div>' +
                upHtml +
                (s.note ? '<div class="text-xs text-muted">Примітка: ' + esc(s.note) + '</div>' : '') +
                '<div class="row wrap">' +
                  (canPres ? '<button type="button" class="btn btn-xs btn-info" onclick="openScheduleAbsenceModal(\'' + s.id + '\')">' + ico('calendar', 13) + ' Запланувати на дату</button>' : '') +

                  (pMode === 'all' ? '<button type="button" class="btn btn-xs btn-danger" onclick="confirmDeleteSoldier(\'' + s.id + '\')">' + ico('trash', 13) + ' Видалити</button>' : '') +
                '</div>' +
              '</div>';

          return '<div class="soldier-item">' +
            '<div class="soldier-row" onclick="ui.expandedSoldiers[\'' + s.id + '\']=!ui.expandedSoldiers[\'' + s.id + '\'];render()">' +

              '</div>' +
              '<div class="row" style="gap:6px;flex-shrink:0">' + statusBadge + '<span class="chevron" style="' + (expanded ? 'transform:rotate(90deg);color:#fff' : '') + '">▶</span></div>' +

    function setSoldierPresenceQuick(soldierId, catKey) {
      var s = getSoldierById(soldierId);
      if (!s || !canEditSoldierPresence(s)) return;
      setSoldierPresenceForDate(todayISO(), soldierId, catKey);
      render();
    }

    function openSoldierModal(soldierId) {
      if (getPersonnelMode() !== 'all') return;
      var s = soldierId ? getSoldierById(soldierId) : null;
      var sqOpts = getOrderedSquads().map(function(sq) {
        var sel = (s ? s.squadId : 'sq1') === sq.id ? 'selected' : '';
        return '<option value="' + sq.id + '" ' + sel + '>' + esc(sq.name) + '</option>';
      }).join('');

      openModal(
        '<div class="modal-header">' +
          '<div class="modal-title">' + (s ? 'Редагувати бійця' : 'Додати бійця') + '</div>' +
          '<button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<div class="field"><label class="field-label">Прізвище та ініціали / ПІБ</label><input id="sol-name" class="input" type="text" value="' + esc(s ? s.name : '') + '" placeholder="Іваненко І.І." /></div>' +
          '<div class="field"><label class="field-label">Звання</label><input id="sol-rank" class="input" type="text" value="' + esc(s ? s.rank : 'курс.') + '" placeholder="курс., мол. с-нт..." /></div>' +
          '<div class="field"><label class="field-label">Відділення / Група</label><select id="sol-sq" class="select">' + sqOpts + '</select></div>' +
          '<label class="toggle-pill"><input id="sol-cmd" type="checkbox" ' + (s && s.isCommander ? 'checked' : '') + ' /><span>Командир відділення / групи (закріпити зверху)</span></label>' +
          '<div class="field"><label class="field-label">Примітка</label><input id="sol-note" class="input" type="text" value="' + esc(s ? s.note : '') + '" placeholder="Необов\'язково" /></div>' +
          '<button type="button" class="btn btn-primary btn-full" onclick="saveSoldierModal(\'' + (s ? s.id : '') + '\')">Зберегти</button>' +
        '</div>'
      );
    }

    function saveSoldierModal(existingId) {
      var name = document.getElementById('sol-name').value.trim();
      var rank = document.getElementById('sol-rank').value.trim() || 'курс.';
      var squadId = document.getElementById('sol-sq').value;
      var isCommander = document.getElementById('sol-cmd').checked;
      var note = document.getElementById('sol-note').value.trim();
      if (!name) { showToast('Введіть прізвище бійця', true); return; }

      if (existingId) {
        var s = getSoldierById(existingId);
        if (s) { s.name = name; s.rank = rank; s.squadId = squadId; s.isCommander = isCommander; s.note = note; }
      } else {
        state.personnel.push({ id: genId('p'), name: name, rank: rank, squadId: squadId, isCommander: isCommander, note: note });
      }
      saveState(true);
      closeModal();
      showToast(existingId ? 'Дані оновлено' : 'Бійця додано');
      render();
    }

    function confirmDeleteSoldier(sid) {
      var s = getSoldierById(sid);
      if (!s) return;
      openModal(
        '<div class="modal-header"><div class="modal-title">Видалити бійця?</div><button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body">' +
          '<div class="text-sm">Ви дійсно хочете видалити <b>' + esc(s.name) + '</b> зі складу?</div>' +
          '<div class="grid-2">' +
            '<button type="button" class="btn btn-secondary" onclick="closeModal()">Скасувати</button>' +
            '<button type="button" class="btn btn-danger" onclick="deleteSoldier(\'' + sid + '\')">Видалити</button>' +
          '</div>' +
        '</div>'
      );
    }

    function deleteSoldier(sid) {
      state.personnel = state.personnel.filter(function(p) { return p.id !== sid; });
      saveState(true);
      closeModal();
      showToast('Видалено зі складу');
      render();
    }

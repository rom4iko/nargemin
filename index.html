<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1217" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Помічник взводу</title>
  <style>
    /* =====================================================================
       БАЗОВІ ЗМІННІ ТА СКИДАННЯ (100% АВТОНОМНИЙ CSS, ZERO DEPENDENCIES)
       ===================================================================== */
    :root {
      --bg: #0d1217;
      --card: #151c24;
      --card-2: #1c2530;
      --border: #273240;
      --text: #e8eef5;
      --muted: #8b99a8;
      --accent: #4d7c3f;
      --accent-bright: #5e964d;
      --accent-soft: rgba(94, 150, 77, 0.16);
      --green: #10b981;
      --blue: #3b82f6;
      --amber: #f59e0b;
      --red: #ef4444;
      --purple: #a855f7;
      --cyan: #06b6d4;
      --radius: 14px;
      --radius-sm: 10px;
      --nav-h: 64px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      overflow-x: hidden;
      min-height: 100vh;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      outline: none;
    }

    /* >= 16px на інпутах щоб iPhone Safari не масштабував сторінку при фокусі */
    input, select, textarea {
      font-size: 16px;
    }

    button {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
    }

    /* Головний контейнер (mobile-first) */
    .app-shell {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 24px);
    }

    /* Верхня шапка */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(13, 18, 23, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid rgba(94, 150, 77, 0.45);
      color: #84cc16;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
    }

    /* Основний контент */
    .main-content {
      flex: 1;
      padding: 12px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Нижня фіксована навігація (5 вкладок) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(21, 28, 36, 0.97);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .bottom-nav-inner {
      max-width: 600px;
      margin: 0 auto;
      height: var(--nav-h);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      position: relative;
      min-height: 44px;
      padding: 4px 2px;
      transition: color 0.15s;
    }

    .nav-btn span.nav-lbl {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .nav-btn.active {
      color: #4ade80;
    }

    .nav-btn.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 18%;
      right: 18%;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background: #4ade80;
    }

    .nav-badge {
      position: absolute;
      top: 6px;
      right: calc(50% - 19px);
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--amber);
      color: #111;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Картки та секції */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px;
    }

    .card-flush {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card-header {
      padding: 11px 13px;
      background: rgba(13, 18, 23, 0.6);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Акордеон для відділень (Склад та Розхід) */
    .accordion-header {
      width: 100%;
      padding: 12px 13px;
      background: rgba(13, 18, 23, 0.65);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      min-height: 54px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .accordion-header:hover {
      background: rgba(28, 37, 48, 0.75);
    }

    .accordion-header.open {
      border-bottom: 1px solid var(--border);
    }

    .chevron {
      width: 18px;
      height: 18px;
      color: var(--muted);
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .accordion-header.open .chevron {
      transform: rotate(90deg);
      color: #fff;
    }

    /* Підвкладки (сегментований перемикач) */
    .subtabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px;
    }

    .subtab-btn {
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      min-height: 44px;
      transition: all 0.15s;
    }

    .subtab-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* Горизонтальні вкладки-пілюлі */
    .pills-row {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .pills-row::-webkit-scrollbar { display: none; }

    .pill-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s;
      min-height: 38px;
    }

    .pill-btn.active {
      background: var(--card-2);
      color: #fff;
      border-color: var(--pill-color, #4ade80);
      box-shadow: inset 0 0 0 1px var(--pill-color, #4ade80);
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .pill-count {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    /* Кнопки (мінімальна висота 44px для зручного тапу) */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      transition: background 0.15s, border-color 0.15s;
      min-height: 44px;
    }

    .btn-sm {
      padding: 7px 11px;
      font-size: 12px;
      min-height: 36px;
      border-radius: 8px;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-primary:hover { background: var(--accent-bright); }

    .btn-secondary {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #24303e; }

    .btn-danger {
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.22); }

    .btn-danger-solid {
      background: #dc2626;
      color: #fff;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      flex-shrink: 0;
    }
    .btn-icon:hover { color: #fff; background: var(--card-2); }
    .btn-icon.danger {
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.25);
    }

    .btn-full { width: 100%; }

    /* Поля вводу */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .input, .select, .textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 16px;
      color: #fff;
      min-height: 44px;
      transition: border-color 0.15s;
    }

    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--accent-bright);
    }

    .textarea {
      resize: vertical;
      min-height: 84px;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      flex: 1;
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      color: var(--muted);
      pointer-events: none;
    }

    .search-wrap .input {
      padding-left: 38px;
      padding-right: 36px;
    }

    .search-clear {
      position: absolute;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Чекбокс-картка та перемикачі */
    .checkbox-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg);
      border: 1px solid var(--border);
      cursor: pointer;
      min-height: 44px;
    }

    .checkbox-card input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #4ade80;
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      min-height: 40px;
    }

    .toggle-pill input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #4ade80;
    }

    /* Бейджі */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge-kv {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.45);
    }

    .badge-status-active { background: rgba(16, 185, 129, 0.14); color: #34d399; border-color: rgba(16, 185, 129, 0.3); }
    .badge-status-leave { background: rgba(59, 130, 246, 0.14); color: #60a5fa; border-color: rgba(59, 130, 246, 0.3); }
    .badge-status-medical { background: rgba(239, 68, 68, 0.14); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }
    .badge-status-trip { background: rgba(245, 158, 11, 0.14); color: #fbbf24; border-color: rgba(245, 158, 11, 0.3); }

    .badge-warn {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .badge-rec {
      background: rgba(34, 197, 94, 0.16);
      color: #86efac;
      border-color: rgba(34, 197, 94, 0.35);
    }

    /* Перемикач місяця / дати */
    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px;
    }

    .date-bar-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      flex: 1;
      line-height: 1.2;
    }

    /* Календар */
    .cal-weekdays, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-weekdays {
      margin-bottom: 6px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }

    .cal-weekdays .wknd { color: rgba(251, 191, 36, 0.85); }

    .cal-cell {
      min-height: 48px;
      border-radius: 9px;
      background: rgba(13, 18, 23, 0.65);
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 5px 2px;
      transition: background 0.12s, border-color 0.12s;
    }

    .cal-cell:hover { background: var(--card-2); }

    .cal-cell.today {
      border-color: rgba(74, 222, 128, 0.55);
      background: rgba(34, 197, 94, 0.08);
    }

    .cal-cell.selected {
      background: rgba(94, 150, 77, 0.25);
      border-color: #4ade80;
      box-shadow: inset 0 0 0 1px #4ade80;
    }

    .cal-day-num {
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }

    .cal-cell.today .cal-day-num { color: #4ade80; }

    .cal-dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
      min-height: 8px;
      max-width: 100%;
    }

    .cal-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* Рядок бійця */
    .soldier-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 13px;
      border-left: 4px solid var(--sq-color, #4ade80);
      border-bottom: 1px solid rgba(39, 50, 64, 0.65);
      background: var(--card);
    }
    .soldier-row:last-child { border-bottom: none; }
    .soldier-row.is-kv {
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.1) 0%, rgba(21, 28, 36, 1) 72%);
    }

    .soldier-info { min-width: 0; flex: 1; }

    .soldier-name-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .soldier-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .soldier-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Розхід: селектор статусу бійця */
    .rozkhid-select {
      width: 150px;
      max-width: 48%;
      flex-shrink: 0;
      padding: 8px 10px;
      min-height: 40px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    .rozkhid-select.is-present {
      border-color: rgba(16, 185, 129, 0.45);
      color: #34d399;
      background: rgba(16, 185, 129, 0.08);
    }

    .rozkhid-select.is-absent {
      border-color: rgba(245, 158, 11, 0.55);
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.1);
    }

    .rozkhid-preview {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #d7e2ec;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* KPI сітка */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .kpi-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 8px;
      text-align: center;
    }

    .kpi-val {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
    }

    .kpi-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Смужка навантаження */
    .bar-track {
      height: 5px;
      background: var(--bg);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.25s;
    }

    /* Картка задачі */
    .task-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--sq-color, #8b99a8);
      border-radius: var(--radius);
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-card.status-done { opacity: 0.85; }

    .task-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .task-text {
      font-size: 14px;
      color: #fff;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
    }

    .task-card.status-done .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .task-status-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .status-tap-btn {
      padding: 8px 6px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      text-align: center;
      transition: all 0.15s;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-tap-btn.active-received {
      background: rgba(59, 130, 246, 0.2);
      border-color: #3b82f6;
      color: #93c5fd;
    }

    .status-tap-btn.active-done {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #6ee7b7;
    }

    .status-tap-btn.active-failed {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #fca5a5;
    }

    /* Блок зауважень під задачею */
    .note-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 9px 11px;
      border-radius: 9px;
      background: rgba(13, 18, 23, 0.65);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      min-height: 40px;
    }

    .note-toggle-btn.has-note {
      border-color: rgba(245, 158, 11, 0.45);
      color: #fde68a;
    }

      background: rgba(13, 18, 23, 0.85);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Палітра кольорів */
    .color-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      transition: transform 0.12s;
    }

    .color-swatch.selected {
      border-color: #fff;
      transform: scale(1.12);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25);
    }

    .chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Модальні вікна */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    @media (min-width: 560px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }

    .modal-backdrop.open { display: flex; }

    .modal-panel {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.18s ease-out;
    }

    @media (min-width: 560px) {
      .modal-panel { border-radius: 18px; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Сповіщення (Toast) */
    .toast-wrap {
      position: fixed;
      top: calc(64px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 80;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      padding: 11px 14px;
      border-radius: 12px;
      background: #1d2834;
      border: 1px solid rgba(74, 222, 128, 0.55);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      animation: slideUp 0.18s ease-out;
    }

    .toast.error {
      background: #331619;
      border-color: rgba(239, 68, 68, 0.6);
      color: #fecaca;
    }

    /* Рядок версії сайту */
    .version-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
    }

    .version-pill {
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid rgba(94, 150, 77, 0.45);
      color: #86efac;
      font-size: 12px;
      font-weight: 700;
    }

    /* Допоміжні утиліти */
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row-gap { display: flex; align-items: center; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .empty-state { text-align: center; padding: 24px 14px; color: var(--muted); font-size: 13px; }
    .text-xs { font-size: 11px; }
    .text-sm { font-size: 13px; }
    .text-muted { color: var(--muted); }
    .hidden { display: none !important; }

</head>

  <script>
    // =========================================================================
    // КОНСТАНТИ ТА ДОВІДНИКИ
    // =========================================================================
    const APP_VERSION = 'v3.0';
    const STORAGE_KEY = 'pomichnyk_vzvodu_v3';

    const MONTHS_UK = [
      'Січень', 'Лютий', 'Березень', 'Квітень', 'Травень', 'Червень',
      'Липень', 'Серпень', 'Вересень', 'Жовтень', 'Листопад', 'Грудень'
    ];

    const MONTHS_GEN_UK = [
      'січня', 'лютого', 'березня', 'квітня', 'травня', 'червня',
      'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'
    ];

    const WEEKDAYS_UK = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];

    const GROUP_CMD_SQUAD_ID = 'group_cmd';

    const SQUAD_PALETTE = [
      '#eab308', // Золотий (Командир групи)
      '#10b981', // Смарагдовий (1-ше відділення)
      '#3b82f6', // Синій (2-ге відділення)
      '#f59e0b', // Бурштиновий (3-тє відділення)
      '#a855f7', // Фіолетовий
      '#06b6d4', // Бірюзовий
      '#f43f5e', // Малиновий
      '#84cc16', // Лаймовий
      '#ec4899'  // Рожевий
    ];

    const STATUS_LIST = [
      { id: 'active', label: 'В строю', cls: 'badge-status-active' },
      { id: 'leave', label: 'Відпустка', cls: 'badge-status-leave' },
      { id: 'medical', label: 'Лікування', cls: 'badge-status-medical' },
      { id: 'trip', label: 'Відрядження', cls: 'badge-status-trip' }
    ];

    // Точний порядок статусів Розходу (UI мітка + скорочення для експорту)
    const ROZKHID_STATUSES = [
      { code: 'Вн', uiLabel: 'Вн — В наявності' },
      { code: 'Прийом шпиталь', uiLabel: 'Прийом шпиталь' },
      { code: 'Прийом лазарет', uiLabel: 'Прийом лазарет' },
      { code: 'Ш', uiLabel: 'Ш — Шпиталь' },
      { code: 'Л', uiLabel: 'Л — Лазарет' },
      { code: 'Вд', uiLabel: 'Вд — Відрядження' },
      { code: 'Вп', uiLabel: 'Вп — Відпустка' },
      { code: 'Н', uiLabel: 'Н — Наряд' },
      { code: 'Г', uiLabel: 'Г — Гуртожиток' },
      { code: 'Пк', uiLabel: 'Пк — Проживання поза казармою' },
      { code: 'Хв', uiLabel: 'Хв — Хворий' },
      { code: 'Стародобовий', uiLabel: 'Стародобовий — Стародобовий наряд' }
    ];

    const DEFAULT_SQUADS = [
      { id: GROUP_CMD_SQUAD_ID, name: 'Командир групи', color: '#eab308', isGroupCmd: true },
      { id: 'sq_1', name: '1-ше відділення', color: '#10b981' },
      { id: 'sq_2', name: '2-ге відділення', color: '#3b82f6' },
      { id: 'sq_3', name: '3-тє відділення', color: '#f59e0b' }
    ];

    const DEFAULT_DUTY_TYPES = [
      { id: 'dt_1', name: 'Черговий' },
      { id: 'dt_2', name: 'Днювальний' },
      { id: 'dt_3', name: 'Патруль' },
      { id: 'dt_4', name: 'КПП' }
    ];

    // =========================================================================
    // СТАН ДАНИХ ТА UI (БЕЗ ДЕМО-ЗАПИСІВ)
    // =========================================================================
    let state = {
      groupNumber: '223',
      squads: [],       // [{ id, name, color }]
      soldiers: [],     // [{ id, name, rank, squadId, isCommander, status }]
      dutyTypes: [],    // [{ id, name }]
      duties: [],       // [{ id, date: 'YYYY-MM-DD', soldierId, dutyTypeId }]
      tasks: [],        // [{ id, targetType: 'squad'|'all_commanders', targetSquadId, text, issuer, deadline, status, note, createdAt }]
      rozkhid: {},      // { 'YYYY-MM-DD': { [soldierId]: statusCode } }
      lastBackupAt: null
    };

    const nowDate = new Date();
    let ui = {
      activeTab: 'duties',        // 'duties' | 'rozkhid' | 'tasks' | 'personnel' | 'settings'
      dutiesSubTab: 'schedule',   // 'schedule' | 'stats'
      year: nowDate.getFullYear(),
      month: nowDate.getMonth(),
      selectedDate: toISODate(nowDate),
      scheduleSquadFilter: 'all',
      statsSquadFilter: 'all',
      statsSort: 'month_desc',    // 'month_desc' | 'month_asc' | 'total_desc' | 'alpha'
      rozkhidDate: toISODate(nowDate),
      rozkhidIncludeNames: false,
      rozkhidHideZeros: false,
      expandedRozkhidSquads: {},  // { [squadId]: true/false }
      expandedPersonnelSquads: {},// { [squadId]: true/false } — за замовчуванням згорнуті як вкладки
      personnelSearch: '',
      tasksTargetFilter: 'all',
      tasksStatusFilter: 'all',
      openNotes: {}
    };

    let assignModal = { date: '', dutyTypeId: '' };

    // =========================================================================
    // УТИЛІТИ
    // =========================================================================
    function genId(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function toISODate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function toDateTimeHuman(d) {
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      const hh = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${dd}.${mm}.${yyyy} о ${hh}:${min}`;
    }

    function addDaysISO(iso, delta) {
      const [y, m, d] = iso.split('-').map(Number);
      return toISODate(new Date(y, m - 1, d + delta));
    }

    function diffDaysISO(isoA, isoB) {
      const [ya, ma, da] = isoA.split('-').map(Number);
      const [yb, mb, db] = isoB.split('-').map(Number);
      return Math.round((Date.UTC(ya, ma - 1, da) - Date.UTC(yb, mb - 1, db)) / 86400000);
    }

    function formatDateHuman(iso) {
      if (!iso) return '—';
      const [y, m, d] = iso.split('-').map(Number);
      return `${d} ${MONTHS_GEN_UK[m - 1]} ${y}`;
    }

    function formatDateShort(iso) {
      if (!iso) return 'Не було';
      const [y, m, d] = iso.split('-').map(Number);
      return `${String(d).padStart(2, '0')}.${String(m).padStart(2, '0')}.${y}`;
    }

    function formatDeadline(val) {
      if (!val) return '';
      const [datePart, timePart] = val.split('T');
      const [y, m, d] = datePart.split('-').map(Number);
      const base = `${String(d).padStart(2, '0')}.${String(m).padStart(2, '0')}.${y}`;
      return timePart ? `${base} о ${timePart.slice(0, 5)}` : base;
    }

    function getMonthPrefix(year, month) {
      return `${year}-${String(month + 1).padStart(2, '0')}`;
    }

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Автоматична велика літера для кожного слова та ініціалів у ПІБ
    function formatFullName(raw) {
      if (!raw) return '';
      return raw
        .trim()
        .replace(/\s+/g, ' ')
        .split(' ')
        .map(word =>
          word
            .split('-')
            .map(part =>
              part
                .split('.')
                .map(seg => seg ? seg.charAt(0).toUpperCase() + seg.slice(1) : '')
                .join('.')
            )
            .join('-')
        )
        .join(' ');
    }

    function capitalizeLive(inputEl) {
      const pos = inputEl.selectionStart;
      const val = inputEl.value;
      const formatted = val.replace(/(^|[\s\-\.])([a-zа-яіїєґ])/g, (m, sep, ch) => sep + ch.toUpperCase());
      if (formatted !== val) {
        inputEl.value = formatted;
        try { inputEl.setSelectionRange(pos, pos); } catch (e) {}
      }
    }

    // Копіювання в буфер обміну (надійно працює на iOS Safari та в iFrame)
    function copyToClipboard(text, successMsg = 'Скопійовано у буфер обміну') {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) {
          showToast(successMsg);
          return true;
        }
      } catch (e) {}

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(successMsg))
          .catch(() => showToast('Не вдалося скопіювати текст', 'error'));
        return true;
      }

      showToast('Не вдалося скопіювати текст', 'error');
      return false;
    }

    function getStatusObj(id) {
      return STATUS_LIST.find(s => s.id === id) || STATUS_LIST[0];
    }

    function getSquadById(id) {
      return state.squads.find(s => s.id === id) || { id, name: 'Без відділення', color: '#64748b' };
    }

    function getSquadTabLabel(sq) {
      if (!sq) return 'Відд.';
      if (sq.id === GROUP_CMD_SQUAD_ID || sq.isGroupCmd) return 'Ком. групи';
      const m = sq.name.match(/^(\d+)/);
      if (m) return `${m[1]} відд.`;
      return sq.name.length > 11 ? sq.name.slice(0, 10) + '…' : sq.name;
    }

    function formatCommanderTargetLabel(sq) {
      if (!sq) return 'Командиру відділення';
      if (sq.id === GROUP_CMD_SQUAD_ID || sq.isGroupCmd) return 'Командиру групи';
      const m = sq.name.match(/^(\d+)/);
      if (m) return `Командиру ${m[1]}-го відділення`;
      return `Командиру (${sq.name})`;
    }

    function isGroupCmdSquad(sq) {
      return Boolean(sq && (sq.id === GROUP_CMD_SQUAD_ID || sq.isGroupCmd));
    }

    function getOrderedSquads() {
      const cmd = [];
      const rest = [];
      for (const sq of state.squads) {
        if (isGroupCmdSquad(sq)) cmd.push(sq);
        else rest.push(sq);
      }
      return [...cmd, ...rest];
    }

    function getGroupCommanderSoldier() {
      return state.soldiers.find(s => s.squadId === GROUP_CMD_SQUAD_ID) || null;
    }

    function formatCommanderTargetLabel(sq) {
      if (!sq) return 'Командиру відділення';
      const m = sq.name.match(/^(\d+)/);
      if (m) return `Командиру ${m[1]}-го відділення`;
      return `Командиру (${sq.name})`;
    }

    function getSoldierById(id) {
      return state.soldiers.find(s => s.id === id);
    }

    function getDutyTypeById(id) {
      return state.dutyTypes.find(d => d.id === id) || { id, name: 'Наряд' };
    }

    function getSquadCommander(squadId) {
      return state.soldiers.find(s => s.squadId === squadId && s.isCommander) || null;
    }

    // Командир відділення завжди зверху, решта — за алфавітом
    function sortSquadMembers(list) {
      return [...list].sort((a, b) => {
        if (a.isCommander && !b.isCommander) return -1;
        if (!a.isCommander && b.isCommander) return 1;
        return a.name.localeCompare(b.name, 'uk');
      });
    }

    function getSoldierStats(soldierId, year, month, beforeOrOnDate = null) {
      const prefix = getMonthPrefix(year, month);
      let monthCount = 0;
      let totalCount = 0;
      let lastDate = null;

      for (const d of state.duties) {
        if (d.soldierId !== soldierId) continue;
        totalCount++;
        if (d.date.startsWith(prefix)) monthCount++;
        if (!beforeOrOnDate || d.date <= beforeOrOnDate) {
          if (!lastDate || d.date > lastDate) lastDate = d.date;
        }
      }
      return { monthCount, totalCount, lastDate };
    }

    // =========================================================================
    // ІНІЦІАЛІЗАЦІЯ ТА ЗБЕРЕЖЕННЯ (ПОРОЖНІЙ СТАРТ БЕЗ ДЕМО-ЗАПИСІВ + МІГРАЦІЯ)
    // =========================================================================
    const APP_VERSION = 'v2.4';
    const APP_UPDATED_DATE = '20.11.2026';

    function ensureGroupCmdSquad(squadsList) {
      const list = Array.isArray(squadsList) ? [...squadsList] : [];
      const existingIdx = list.findIndex(sq => sq && (sq.id === GROUP_CMD_SQUAD_ID || sq.isGroupCmd || (sq.name && sq.name.trim().toLowerCase() === 'командир групи')));
      if (existingIdx === -1) {
        list.unshift({ id: GROUP_CMD_SQUAD_ID, name: 'Командир групи', color: '#eab308', isGroupCmd: true });
      } else {
        const [item] = list.splice(existingIdx, 1);
        item.isGroupCmd = true;
        if (!item.color) item.color = '#eab308';
        list.unshift(item);
      }
      return list;
    }

    function createEmptyInitialState() {
      return {
        groupNumber: '223',
        squads: JSON.parse(JSON.stringify(DEFAULT_SQUADS)),
        soldiers: [],
        dutyTypes: JSON.parse(JSON.stringify(DEFAULT_DUTY_TYPES)),
        duties: [],
        tasks: [],
        rozkhid: {},
        lastBackupAt: null
      };
    }

    function loadState() {
      try {
        // Підтримка міграції зі старого ключа STORAGE_KEY та можливих попередніх ключів
        let raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          for (const legacyKey of ['pomichnyk_vzvodu_v2', 'pomichnyk_vzvodu_v1', 'platoon_duty_tracker_v1']) {
            const legacyRaw = localStorage.getItem(legacyKey);
            if (legacyRaw) {
              raw = legacyRaw;
              break;
            }
          }
        }
        if (!raw) {
          state = createEmptyInitialState();
          saveState();
          return;
        }
        const parsed = JSON.parse(raw);
        const migratedSquads = ensureGroupCmdSquad(
          Array.isArray(parsed.squads) && parsed.squads.length
            ? parsed.squads
            : JSON.parse(JSON.stringify(DEFAULT_SQUADS))
        );
        state = {
          groupNumber: typeof parsed.groupNumber === 'string' && parsed.groupNumber.trim() ? parsed.groupNumber : '223',
          squads: migratedSquads,
          soldiers: Array.isArray(parsed.soldiers) ? parsed.soldiers : [],
          dutyTypes: Array.isArray(parsed.dutyTypes) && parsed.dutyTypes.length
            ? parsed.dutyTypes
            : JSON.parse(JSON.stringify(DEFAULT_DUTY_TYPES)),
          duties: Array.isArray(parsed.duties) ? parsed.duties : [],
          tasks: Array.isArray(parsed.tasks) ? parsed.tasks : [],
          rozkhid: parsed.rozkhid && typeof parsed.rozkhid === 'object' ? parsed.rozkhid : {},
          lastBackupAt: parsed.lastBackupAt || null
        };
        saveState();
      } catch (e) {
        console.error('Помилка читання localStorage:', e);
        state = createEmptyInitialState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Помилка збереження:', e);
        showToast('Помилка збереження в пам\'ять пристрою', 'error');
      }
    }

    // =========================================================================
    // СПОВІЩЕННЯ ТА МОДАЛЬНІ ВІКНА (БЕЗ alert() / confirm())
    // =========================================================================
    function showToast(msg, type = 'success') {
      const root = document.getElementById('toast-root');
      const el = document.createElement('div');
      el.className = `toast ${type === 'error' ? 'error' : ''}`;
      el.textContent = msg;
      root.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.2s';
        setTimeout(() => el.remove(), 220);
      }, 2400);
    }

    function openModal(html) {
      const root = document.getElementById('modal-root');
      const panel = document.getElementById('modal-panel');
      panel.innerHTML = html;
      root.classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal-root').classList.remove('open');
    }

    document.getElementById('modal-root').addEventListener('click', (e) => {
      if (e.target.id === 'modal-root') closeModal();
    });

    function showConfirm(title, message, confirmLabel, onConfirm, danger = true) {
      openModal(`
        <div class="modal-header">
          <div class="modal-title">${esc(title)}</div>
          <button class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <p class="text-sm text-muted" style="line-height:1.5">${esc(message)}</p>
          <div class="grid-2" style="margin-top:4px">
            <button class="btn btn-secondary" onclick="closeModal()">Скасувати</button>
            <button id="confirm-ok-btn" class="btn ${danger ? 'btn-danger-solid' : 'btn-primary'}">${esc(confirmLabel)}</button>
          </div>
        </div>
      `);
      document.getElementById('confirm-ok-btn').onclick = () => {
        closeModal();
        onConfirm();
      };
    }

    // =========================================================================
    // НАВІГАЦІЯ ТА ЗАГАЛЬНІ КОМПОНЕНТИ
    // =========================================================================
    function switchTab(tab) {
      ui.activeTab = tab;
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function switchDutiesSubTab(sub) {
      ui.dutiesSubTab = sub;
      render();
    }

    function changeMonth(delta) {
      ui.month += delta;
      if (ui.month < 0) { ui.month = 11; ui.year--; }
      else if (ui.month > 11) { ui.month = 0; ui.year++; }

      if (ui.year === nowDate.getFullYear() && ui.month === nowDate.getMonth()) {
        ui.selectedDate = toISODate(nowDate);
      } else {
        ui.selectedDate = `${ui.year}-${String(ui.month + 1).padStart(2, '0')}-01`;
      }
      render();
    }

    function goToToday() {
      const t = new Date();
      ui.year = t.getFullYear();
      ui.month = t.getMonth();
      ui.selectedDate = toISODate(t);
      render();
    }

    function renderMonthBar(showTodayBtn = true) {
      return `
        <div class="date-bar">
          <button class="btn-icon" onclick="changeMonth(-1)" aria-label="Попередній місяць">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="date-bar-title" style="text-transform:uppercase">${MONTHS_UK[ui.month]} ${ui.year}</div>
          ${showTodayBtn ? `<button class="btn btn-sm btn-secondary" onclick="goToToday()">Сьогодні</button>` : ''}
          <button class="btn-icon" onclick="changeMonth(1)" aria-label="Наступний місяць">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      `;
    }
    function renderSquadPills(activeId, handlerName, excludeGroupCmd = false) {
      const allBtn = `
        <button class="pill-btn ${activeId === 'all' ? 'active' : ''}" style="--pill-color:#4ade80" onclick="${handlerName}('all')">
          <span>Всі</span>
        </button>
      `;
      const ordered = getOrderedSquads().filter(sq => !(excludeGroupCmd && isGroupCmdSquad(sq)));
      const squadBtns = ordered.map(sq => `
        <button class="pill-btn ${activeId === sq.id ? 'active' : ''}" style="--pill-color:${sq.color}" onclick="${handlerName}('${sq.id}')">
          <span class="pill-dot" style="background:${sq.color}"></span>
          <span>${esc(getSquadTabLabel(sq))}</span>
        </button>
      `).join('');
      return `<div class="pills-row">${allBtn}${squadBtns}</div>`;
    }

    // =========================================================================
    // ВКЛАДКА 1: НАРЯДИ (ГРАФІК + ОБЛІК)
    // =========================================================================
    function renderDutiesTab() {
      const subTabsHtml = `
        <div class="subtabs">
          <button class="subtab-btn ${ui.dutiesSubTab === 'schedule' ? 'active' : ''}" onclick="switchDutiesSubTab('schedule')">Графік</button>
          <button class="subtab-btn ${ui.dutiesSubTab === 'stats' ? 'active' : ''}" onclick="switchDutiesSubTab('stats')">Облік</button>
        </div>
      `;
      return subTabsHtml + (ui.dutiesSubTab === 'schedule' ? renderScheduleView() : renderStatsView());
    }

    function setScheduleSquadFilter(id) {
      ui.scheduleSquadFilter = id;
      render();
    }

    function selectCalendarDate(iso) {
      ui.selectedDate = iso;
      render();
    }

    function renderScheduleView() {
      const y = ui.year;
      const m = ui.month;
      const firstDay = new Date(y, m, 1);
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      let offset = firstDay.getDay() - 1;
      if (offset < 0) offset = 6;

      const todayISO = toISODate(nowDate);
      const monthPrefix = getMonthPrefix(y, m);

      const byDate = {};
      for (const d of state.duties) {
        if (!d.date.startsWith(monthPrefix)) continue;
        const soldier = getSoldierById(d.soldierId);
        if (!soldier) continue;
        if (ui.scheduleSquadFilter !== 'all' && soldier.squadId !== ui.scheduleSquadFilter) continue;
        if (!byDate[d.date]) byDate[d.date] = [];
        byDate[d.date].push({ duty: d, soldier });
      }

      let cells = '';
      for (let i = 0; i < offset; i++) cells += `<div></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = `${monthPrefix}-${String(day).padStart(2, '0')}`;
        const items = byDate[iso] || [];
        const isToday = iso === todayISO;
        const isSelected = iso === ui.selectedDate;

        const dots = items.slice(0, 5).map(item => {
          const sq = getSquadById(item.soldier.squadId);
          return `<span class="cal-dot" style="background:${sq.color}"></span>`;
        }).join('');

        cells += `
          <button class="cal-cell ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" onclick="selectCalendarDate('${iso}')">
            <span class="cal-day-num">${day}</span>
            <div class="cal-dots">${dots}${items.length > 5 ? '<span style="font-size:9px;color:#8b99a8;line-height:6px">+</span>' : ''}</div>
          </button>
        `;
      }

      const dayDuties = state.duties.filter(d => {
        if (d.date !== ui.selectedDate) return false;
        const s = getSoldierById(d.soldierId);
        if (!s) return false;
        if (ui.scheduleSquadFilter !== 'all' && s.squadId !== ui.scheduleSquadFilter) return false;
        return true;
      });

      const dayListHtml = dayDuties.length === 0
        ? `<div class="empty-state">На ${formatDateHuman(ui.selectedDate)} нарядів не призначено.</div>`
        : `<div class="stack">
            ${dayDuties.map(d => {
              const s = getSoldierById(d.soldierId);
              const sq = getSquadById(s.squadId);
              const dt = getDutyTypeById(d.dutyTypeId);
              const isKG = isGroupCmdSquad(sq);
              return `
                <div class="soldier-row" style="--sq-color:${sq.color}; border-radius:10px; border:1px solid var(--border); border-left:4px solid ${sq.color};">
                  <div class="soldier-info">
                    <div class="soldier-name-line">
                      <span class="badge" style="background:${sq.color}22; color:${sq.color}; border-color:${sq.color}55">${esc(dt.name)}</span>
                      <span class="soldier-name">${esc(s.name)}</span>
                      ${isKG ? `<span class="badge badge-kv">★ КГ</span>` : (s.isCommander ? `<span class="badge badge-kv">★ КВ</span>` : '')}
                    </div>
                    <div class="soldier-meta">
                      <span>${esc(sq.name)}</span>
                      ${s.rank ? `<span>• ${esc(s.rank)}</span>` : ''}
                    </div>
                  </div>
                  <button class="btn-icon danger" onclick="removeDuty('${d.id}')" title="Видалити наряд">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                  </button>
                </div>
              `;
            }).join('')}
          </div>`;

      return `
        ${renderMonthBar(true)}
        ${renderSquadPills(ui.scheduleSquadFilter, 'setScheduleSquadFilter')}

        <div class="card">
          <div class="cal-weekdays">
            ${WEEKDAYS_UK.map((w, i) => `<div class="${i >= 5 ? 'wknd' : ''}">${w}</div>`).join('')}
          </div>
          <div class="cal-grid">${cells}</div>
        </div>

        <div class="card stack">
          <div class="row-between">
            <div>
              <div style="font-size:15px;font-weight:700;color:#fff">${formatDateHuman(ui.selectedDate)}</div>
              <div class="text-xs text-muted">Призначено нарядів: ${dayDuties.length}</div>
            </div>
            <button class="btn btn-sm btn-primary" onclick="openAssignDutyModal('${ui.selectedDate}')">+ Призначити наряд</button>
          </div>
          ${dayListHtml}
          ${dayDuties.length > 0 ? `
            <button class="btn btn-secondary btn-full" onclick="copyDayDuties('${ui.selectedDate}')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>Скопіювати наряд на день</span>
            </button>
          ` : ''}
        </div>
      `;
    }

    function copyDayDuties(isoDate) {
      const dayDuties = state.duties.filter(d => {
        if (d.date !== isoDate) return false;
        const s = getSoldierById(d.soldierId);
        if (!s) return false;
        if (ui.scheduleSquadFilter !== 'all' && s.squadId !== ui.scheduleSquadFilter) return false;
        return true;
      });
      if (!dayDuties.length) return;

      const lines = [`Наряд на ${formatDateHuman(isoDate)}:`];
      dayDuties.forEach((d, idx) => {
        const s = getSoldierById(d.soldierId);
        const sq = getSquadById(s.squadId);
        const dt = getDutyTypeById(d.dutyTypeId);
        lines.push(`${idx + 1}. ${dt.name} — ${s.name}${s.rank ? ' (' + s.rank + ')' : ''} [${getSquadTabLabel(sq)}]`);
      });
      copyToClipboard(lines.join('\n'), 'Наряд на день скопійовано');
    }

    function removeDuty(id, reopenSoldierId = null) {
      state.duties = state.duties.filter(d => d.id !== id);
      saveState();
      render();
      if (reopenSoldierId) openSoldierHistoryModal(reopenSoldierId);
      showToast('Запис наряду видалено');
    }

    function openAssignDutyModal(isoDate) {
      if (state.soldiers.length === 0) {
        showToast('Спочатку додайте бійців у вкладці «Склад»', 'error');
        return;
      }
      assignModal.date = isoDate;
      assignModal.dutyTypeId = state.dutyTypes[0]?.id || '';
      renderAssignDutyModal();
    }

    function setAssignDutyType(id) {
      assignModal.dutyTypeId = id;
      renderAssignDutyModal();
    }

    function renderAssignDutyModal() {
      const [y, m] = assignModal.date.split('-').map(Number);
      const targetYear = y;
      const targetMonth = m - 1;
      const yesterdayISO = addDaysISO(assignModal.date, -1);

      const busyTodaySet = new Set(state.duties.filter(d => d.date === assignModal.date).map(d => d.soldierId));
      const busyYestSet = new Set(state.duties.filter(d => d.date === yesterdayISO).map(d => d.soldierId));

      const enriched = state.soldiers.map(s => {
        const stats = getSoldierStats(s.id, targetYear, targetMonth, yesterdayISO);
        const isToday = busyTodaySet.has(s.id);
        const isYesterday = busyYestSet.has(s.id);
        const restDays = stats.lastDate ? diffDaysISO(assignModal.date, stats.lastDate) : 99999;
        return { ...s, stats, isToday, isYesterday, restDays };
      });

      const eligible = enriched.filter(c => c.status === 'active' && !c.isToday && !c.isYesterday);
      const bestMonthCount = eligible.length ? Math.min(...eligible.map(c => c.stats.monthCount)) : -1;

      // Групування та сортування по відділеннях: спочатку «Командир групи», далі 1-ше, 2-ге, 3-тє відділення (КВ зверху)
      const orderedSquads = getOrderedSquads();
      const groupsHtml = orderedSquads.map(sq => {
        const isKG = isGroupCmdSquad(sq);
        const members = enriched
          .filter(s => s.squadId === sq.id)
          .sort((a, b) => {
            if (!isKG) {
              if (a.isCommander && !b.isCommander) return -1;
              if (!a.isCommander && b.isCommander) return 1;
            }
            const aActive = a.status === 'active';
            const bActive = b.status === 'active';
            if (aActive !== bActive) return aActive ? -1 : 1;
            if (a.isToday !== b.isToday) return a.isToday ? 1 : -1;
            if (a.isYesterday !== b.isYesterday) return a.isYesterday ? 1 : -1;
            if (a.stats.monthCount !== b.stats.monthCount) return a.stats.monthCount - b.stats.monthCount;
            if (a.restDays !== b.restDays) return b.restDays - a.restDays;
            return a.name.localeCompare(b.name, 'uk');
          });

        if (members.length === 0) return '';

        const rows = members.map(c => {
          const stObj = getStatusObj(c.status);
          const isRec = c.status === 'active' && !c.isToday && !c.isYesterday && c.stats.monthCount === bestMonthCount;

          return `
            <button class="soldier-row ${c.isCommander || isKG ? 'is-kv' : ''}" onclick="confirmAssignDuty('${c.id}')" style="--sq-color:${sq.color}; width:100%; text-align:left; border-radius:10px; border:1px solid ${isRec ? 'rgba(16,185,129,0.45)' : 'var(--border)'}; border-left:4px solid ${sq.color}; opacity:${c.status !== 'active' ? '0.6' : '1'}">
              <div class="soldier-info">
                <div class="soldier-name-line">
                  <span class="soldier-name">${esc(c.name)}</span>
                  ${isKG ? `<span class="badge badge-kv">★ КГ</span>` : (c.isCommander ? `<span class="badge badge-kv">★ КВ</span>` : '')}
                  ${isRec ? `<span class="badge badge-rec">Рекомендовано</span>` : ''}
                  ${c.isToday ? `<span class="badge badge-warn">Вже сьогодні</span>` : ''}
                  ${!c.isToday && c.isYesterday ? `<span class="badge badge-warn">Був учора</span>` : ''}
                  ${c.status !== 'active' ? `<span class="badge ${stObj.cls}">${stObj.label}</span>` : ''}
                </div>
                <div class="soldier-meta">
                  ${c.rank ? `<span>${esc(c.rank)} •</span>` : ''}
                  <span>Ост.: ${formatDateShort(c.stats.lastDate)}</span>
                </div>
              </div>
              <div style="text-align:right;flex-shrink:0">
                <div style="font-size:15px;font-weight:800;color:${isRec ? '#4ade80' : '#fff'}">${c.stats.monthCount} <span class="text-xs text-muted" style="font-weight:500">міс</span></div>
                <div class="text-xs text-muted">${c.stats.totalCount} всього</div>
              </div>
            </button>
          `;
        }).join('');

        return `
          <div class="stack" style="gap:6px">
            <div class="row-gap" style="padding:4px 2px 0">
              <span class="pill-dot" style="background:${sq.color}"></span>
              <span class="section-title" style="color:${sq.color}">${esc(sq.name)}</span>
            </div>
            ${rows}
          </div>
        `;
      }).join('');

      openModal(`
        <div class="modal-header">
          <div>
            <div class="modal-title">Призначити наряд</div>
            <div class="text-xs text-muted">${formatDateHuman(assignModal.date)}</div>
          </div>
          <button class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <div class="field-label">1. Оберіть вид наряду:</div>
            <div class="chips-wrap">
              ${state.dutyTypes.map(dt => `
                <button class="btn btn-sm ${assignModal.dutyTypeId === dt.id ? 'btn-primary' : 'btn-secondary'}" onclick="setAssignDutyType('${dt.id}')">
                  ${esc(dt.name)}
                </button>
              `).join('')}
            </div>
          </div>

          <div class="field-label">2. Оберіть військовослужбовця (по відділеннях):</div>
          <div class="stack" style="gap:12px">${groupsHtml}</div>
        </div>
      `);
    }

    function confirmAssignDuty(soldierId) {
      if (!assignModal.dutyTypeId) {
        showToast('Оберіть вид наряду', 'error');
        return;
      }
      state.duties.push({
        id: genId('d'),
        date: assignModal.date,
        soldierId,
        dutyTypeId: assignModal.dutyTypeId
      });
      saveState();
      closeModal();
      render();
      showToast('Наряд призначено');
    }

    // Підвкладка «ОБЛІК»
    function setStatsSquadFilter(id) {
      ui.statsSquadFilter = id;
      render();
    }

    function setStatsSort(val) {
      ui.statsSort = val;
      render();
    }

    function renderStatsView() {
      const y = ui.year;
      const m = ui.month;

      const filtered = state.soldiers
        .filter(s => ui.statsSquadFilter === 'all' || s.squadId === ui.statsSquadFilter)
        .map(s => ({ ...s, stats: getSoldierStats(s.id, y, m) }));

      const totalMonth = filtered.reduce((sum, s) => sum + s.stats.monthCount, 0);
      const totalAllTime = filtered.reduce((sum, s) => sum + s.stats.totalCount, 0);
      const avgPerSoldier = filtered.length > 0 ? (totalMonth / filtered.length).toFixed(1) : '0.0';
      const maxMonth = Math.max(1, ...filtered.map(s => s.stats.monthCount));

      const sortMembers = (arr, isKG) => [...arr].sort((a, b) => {
        if (!isKG) {
          if (a.isCommander && !b.isCommander) return -1;
          if (!a.isCommander && b.isCommander) return 1;
        }
        if (ui.statsSort === 'month_desc') return b.stats.monthCount - a.stats.monthCount || b.stats.totalCount - a.stats.totalCount || a.name.localeCompare(b.name, 'uk');
        if (ui.statsSort === 'month_asc') return a.stats.monthCount - b.stats.monthCount || a.stats.totalCount - b.stats.totalCount || a.name.localeCompare(b.name, 'uk');
        if (ui.statsSort === 'total_desc') return b.stats.totalCount - a.stats.totalCount || b.stats.monthCount - a.stats.monthCount || a.name.localeCompare(b.name, 'uk');
        return a.name.localeCompare(b.name, 'uk');
      });

      const orderedSquads = getOrderedSquads().filter(sq => ui.statsSquadFilter === 'all' || sq.id === ui.statsSquadFilter);

      let listHtml = '';
      if (filtered.length === 0) {
        listHtml = `<div class="card empty-state">Особового складу ще немає. Додайте бійців у вкладці «Склад».</div>`;
      } else {
        listHtml = orderedSquads.map(sq => {
          const isKG = isGroupCmdSquad(sq);
          const members = sortMembers(filtered.filter(s => s.squadId === sq.id), isKG);
          if (members.length === 0) return '';
          return `
            <div class="card-flush">
              <div class="card-header" style="border-left:4px solid ${sq.color}">
                <div class="row-gap">
                  <span class="pill-dot" style="background:${sq.color}"></span>
                  <span class="section-title">${esc(sq.name)} (${members.length})</span>
                </div>
                <span class="text-xs text-muted">Міс. / Всього</span>
              </div>
              <div>
                ${members.map(s => renderStatsRow(s, sq, maxMonth)).join('')}
              </div>
            </div>
          `;
        }).join('');
      }

      return `
        ${renderMonthBar(false)}

        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-val">${totalMonth}</div>
            <div class="kpi-label">За місяць</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-val" style="color:#60a5fa">${avgPerSoldier}</div>
            <div class="kpi-label">Середнє / боєць</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-val" style="color:#4ade80">${totalAllTime}</div>
            <div class="kpi-label">За весь час</div>
          </div>
        </div>

        ${renderSquadPills(ui.statsSquadFilter, 'setStatsSquadFilter')}

        <div class="row-between">
          <span class="text-xs text-muted" style="font-weight:600">Всередині відділення:</span>
          <select class="select" style="width:auto;min-height:38px;padding:6px 10px;font-size:13px" onchange="setStatsSort(this.value)">
            <option value="month_desc" ${ui.statsSort === 'month_desc' ? 'selected' : ''}>За місяць (більше → менше)</option>
            <option value="month_asc" ${ui.statsSort === 'month_asc' ? 'selected' : ''}>За місяць (менше → більше)</option>
            <option value="total_desc" ${ui.statsSort === 'total_desc' ? 'selected' : ''}>За весь час</option>
            <option value="alpha" ${ui.statsSort === 'alpha' ? 'selected' : ''}>За алфавітом</option>
          </select>
        </div>

        <div class="stack">${listHtml}</div>
      `;
    }

    function renderStatsRow(s, sq, maxMonth) {
      const pct = Math.round((s.stats.monthCount / maxMonth) * 100);
      const st = getStatusObj(s.status);
      const isKG = isGroupCmdSquad(sq);
      return `
        <button class="soldier-row ${s.isCommander || isKG ? 'is-kv' : ''}" onclick="openSoldierHistoryModal('${s.id}')" style="--sq-color:${sq.color}; width:100%; text-align:left;">
          <div class="soldier-info">
            <div class="soldier-name-line">
              <span class="pill-dot" style="background:${sq.color}"></span>
              <span class="soldier-name">${esc(s.name)}</span>
              ${isKG ? `<span class="badge badge-kv">★ КГ</span>` : (s.isCommander ? `<span class="badge badge-kv">★ КВ</span>` : '')}
              ${s.status !== 'active' ? `<span class="badge ${st.cls}">${st.label}</span>` : ''}
            </div>
            <div class="soldier-meta">
              <span>Останній: ${formatDateShort(s.stats.lastDate)}</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%; background:${sq.color}"></div>
            </div>
          </div>
          <div class="row-gap" style="flex-shrink:0">
            <div style="text-align:right">
              <div style="font-size:16px;font-weight:800;color:#fff;line-height:1">${s.stats.monthCount}</div>
              <div class="text-xs text-muted">міс.</div>
            </div>

            <div style="text-align:right;min-width:34px">
              <div style="font-size:14px;font-weight:700;color:#4ade80;line-height:1">${s.stats.totalCount}</div>
              <div class="text-xs text-muted">всього</div>

        </button>
      `;
    }

        .filter(d => d.soldierId === s.id)
        .sort((a, b) => b.date.localeCompare(a.date));

      openModal(`
        <div class="modal-header">
          <div>
            <div class="modal-title">${esc(s.name)} ${s.isCommander ? '★' : ''}</div>

          </div>
          <button class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="grid-2">

              <div class="kpi-val">${stats.monthCount}</div>
              <div class="kpi-label">${MONTHS_UK[ui.month]} ${ui.year}</div>

            <div class="kpi-card">

          <div class="field-label">Історія нарядів (${history.length}):</div>

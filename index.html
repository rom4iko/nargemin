<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Помічник взводу" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cpath d='M32 10L50 18V32C50 43.5 42.2 52 32 55C21.8 52 14 43.5 14 32V18L32 10Z' fill='%231e293b' stroke='%234ade80' stroke-width='3'/%3E%3Cpath d='M32 20L35.2 27.2L43 28L37 33.2L38.8 41L32 36.8L25.2 41L27 33.2L21 28L28.8 27.2L32 20Z' fill='%23eab308'/%3E%3C/svg%3E" />
  <title>Помічник взводу v3.12-tasks-irrelevant-tab</title>
  <style>
    /* =========================================================================
       ТЕМНА ТАКТИЧНА ТЕМА (ОПТИМІЗОВАНА ПІД IPHONE SAFARI / ANDROID CHROME)
       ========================================================================= */
    :root {
      --bg: #0b1015;
      --bg-elev: #131b24;
      --card: #161f2a;
      --card-hover: #1d2836;
      --border: #263342;
      --border-strong: #35475c;
      --text: #e7eef5;
      --muted: #8b9bb0;
      --olive: #4b7a3d;
      --accent: #4ade80;
      --blue: #38bdf8;
      --amber: #f59e0b;
      --danger: #ef4444;
      --radius: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px; line-height: 1.4;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font-family: inherit; font-size: 14px; color: var(--text); }
    button { cursor: pointer; border: none; background: none; padding: 0; }
    input[type="date"] { color-scheme: dark; }

    /* Аварійний банер помилок (захист від білого екрану) */
    #fatal-error-box {
      display: none; position: fixed; inset: 12px; z-index: 9999;
      background: #2b1115; border: 2px solid #ef4444; border-radius: 14px;
      padding: 16px; color: #fecaca; overflow: auto;
    }

    /* Екран входу за PIN-кодом */
    .pin-screen {
      min-height: 100vh; max-width: 440px; margin: 0 auto;
      padding: calc(28px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    }
    .pin-logo {
      width: 62px; height: 62px; border-radius: 18px;
      background: rgba(75, 122, 61, 0.22); border: 1.5px solid rgba(74, 222, 128, 0.45);
      color: var(--accent); display: flex; align-items: center; justify-content: center;
    }
    .pin-dots { display: flex; gap: 16px; justify-content: center; margin: 4px 0; }
    .pin-dot {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid var(--border-strong); background: transparent; transition: all 0.14s ease;
    }
    .pin-dot.filled { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }
    .pin-dot.err { background: var(--danger); border-color: var(--danger); }
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 280px; }
    .num-key {
      height: 60px; border-radius: 16px; background: var(--card); border: 1px solid var(--border);
      color: #fff; font-size: 22px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; transition: background 0.1s, transform 0.08s;
    }
    .num-key:active { background: var(--card-hover); transform: scale(0.95); }
    .num-key.fn { font-size: 14px; font-weight: 700; color: var(--muted); background: var(--bg-elev); }

    /* Головна оболонка */
    .app {
      max-width: 600px; margin: 0 auto; min-height: 100vh;
      display: flex; flex-direction: column; padding-bottom: calc(84px + var(--safe-bottom));
    }
    .header {
      position: sticky; top: 0; z-index: 30;
      padding: calc(8px + var(--safe-top)) 12px 8px;
      background: rgba(11, 16, 21, 0.95);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brand-icon {
      width: 34px; height: 34px; border-radius: 10px;
      background: rgba(75, 122, 61, 0.22); border: 1px solid rgba(74, 222, 128, 0.35);
      color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .brand-title { font-size: 14.5px; font-weight: 800; color: #fff; line-height: 1.15; white-space: nowrap; }
    .header-meta { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
    .role-pill {
      font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px;
      background: rgba(74, 222, 128, 0.16); color: #86efac; border: 1px solid rgba(74, 222, 128, 0.35); white-space: nowrap;
    }
    .role-pill.kg { background: rgba(234, 179, 8, 0.16); color: #fde047; border-color: rgba(234, 179, 8, 0.35); }
    .role-pill.kv { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.35); }
    .sync-pill {
      font-size: 11px; font-weight: 700; padding: 5px 9px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; min-height: 36px;
    }
    .sync-pill.online { border-color: rgba(74, 222, 128, 0.4); color: #86efac; }
    .sync-pill.offline { border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
    .sync-pill.syncing { border-color: rgba(56, 189, 248, 0.45); color: #7dd3fc; }

    .main { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }

    /* Нижня навігація + червоний бейдж задач */
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      background: rgba(19, 27, 36, 0.96);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border); padding-bottom: var(--safe-bottom);
    }
    .nav-inner { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: 64px; }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; font-size: 10.5px; font-weight: 700; color: var(--muted); min-height: 44px;
    }
    .nav-btn.active { color: var(--accent); }
    .nav-icon-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
    .nav-badge {
      position: absolute; top: -6px; right: -10px;
      min-width: 18px; height: 18px; padding: 0 4px;
      border-radius: 999px; background: #ef4444; color: #ffffff;
      border: 2px solid #131b24; font-size: 10px; font-weight: 800; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.45);
    }

    /* Картки, сітки, типографіка */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .card-flush { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .stack-sm { display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .wrap { flex-wrap: wrap; }
    .min0 { min-width: 0; flex: 1; }
    .text-xs { font-size: 12px; }
    .text-sm { font-size: 13.5px; }
    .text-muted { color: var(--muted); }
    .fw-bold { font-weight: 700; }
    .fw-800 { font-weight: 800; }
    .section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; color: #cbd5e1; }
    .empty-state { text-align: center; padding: 20px 12px; color: var(--muted); font-size: 13.5px; }
    .info-banner {
      padding: 9px 12px; border-radius: 11px; font-size: 12px; color: #bae6fd;
      background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* Кнопки та інпути (44px+ для зручного натискання) */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 44px; padding: 9px 14px; border-radius: 11px;
      font-weight: 700; font-size: 13.5px; text-align: center; transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-sm { min-height: 38px; padding: 6px 11px; font-size: 12px; border-radius: 9px; }
    .btn-xs { min-height: 34px; padding: 4px 9px; font-size: 11.5px; border-radius: 8px; }
    .btn-full { width: 100%; }
    .btn-primary { background: var(--olive); color: #fff; }
    .btn-secondary { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); }
    .btn-info { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.35); }
    .btn-warn { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }

    .btn-icon {
      width: 44px; height: 44px; border-radius: 10px; background: var(--bg-elev);
      border: 1px solid var(--border); color: var(--text);
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px;
    }
    .btn-icon-sm { width: 38px; height: 38px; border-radius: 9px; font-size: 13px; }
    .btn-icon.danger { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.3); color: #f87171; }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field-label { font-size: 12px; font-weight: 700; color: var(--muted); }
    .input, .select, .textarea {
      width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border); color: #fff; outline: none;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); }
    .textarea { min-height: 82px; resize: vertical; }

    /* Сегмент-кнопки, фільтри, бейджі */
    .seg-control {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
      background: var(--card); border: 1px solid var(--border); padding: 4px; border-radius: 12px;
    }
    .seg-btn { min-height: 38px; padding: 4px 6px; border-radius: 9px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
    .seg-btn.active { background: var(--olive); color: #fff; }

    .pills-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .pills-scroll::-webkit-scrollbar { display: none; }
    .pill {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
      min-height: 36px; padding: 6px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 700; background: var(--card); border: 1px solid var(--border); color: var(--muted);
    }
    .pill.active { background: var(--olive); border-color: var(--olive); color: #fff; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .badge {
      display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px;
      border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .badge-kg { background: rgba(234, 179, 8, 0.2); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.4); }
    .badge-kv { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-ok { background: rgba(74, 222, 128, 0.16); color: #86efac; border: 1px solid rgba(74, 222, 128, 0.3); }
    .badge-info { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-warn { background: rgba(245, 158, 11, 0.18); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35); }
    .badge-err { background: rgba(239, 68, 68, 0.18); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }

    /* Календар нарядів */
    .date-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 6px;
    }
    .date-bar-title { font-size: 14px; font-weight: 800; color: #fff; text-align: center; flex: 1; }
    .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-bottom: 6px; }
    .cal-weekdays div { font-size: 11px; font-weight: 700; color: var(--muted); }
    .cal-weekdays .wknd { color: #fbbf24; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-cell {
      height: 46px; border-radius: 9px; border: 1px solid transparent;
      background: rgba(11, 16, 21, 0.55); color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 5px 2px;
    }
    .cal-cell.today { border-color: rgba(74, 222, 128, 0.55); }
    .cal-cell.selected { background: rgba(75, 122, 61, 0.38); border-color: var(--accent); color: #fff; }
    .cal-num { font-size: 12.5px; font-weight: 700; line-height: 1; }
    .cal-dots { display: flex; gap: 2px; height: 6px; align-items: center; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; }

    /* Акордеони, склад, статуси присутності */
    .acc-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      min-height: 48px; padding: 10px 12px; background: rgba(11, 16, 21, 0.55); cursor: pointer; user-select: none;
    }
    .chevron { display: inline-block; transition: transform 0.18s; color: var(--muted); flex-shrink: 0; font-size: 13px; }
    .acc-header.open .chevron { transform: rotate(90deg); color: #fff; }
    .acc-body { border-top: 1px solid var(--border); }
    .soldier-item { border-bottom: 1px solid var(--border); background: var(--bg); }
    .soldier-item:last-child { border-bottom: none; }
    .soldier-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      min-height: 50px; padding: 10px 12px; cursor: pointer;
    }
    .soldier-expand { padding: 10px 12px 12px; background: rgba(19, 27, 36, 0.65); border-top: 1px dashed var(--border); }
    .soldier-name { font-size: 14px; font-weight: 700; color: #fff; }

    .presence-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .presence-btn {
      min-height: 36px; padding: 5px 4px; border-radius: 9px; font-size: 11.5px; font-weight: 700;
      background: var(--card); border: 1px solid var(--border); color: var(--muted); text-align: center;
    }
    .presence-btn.active-ok { background: rgba(74, 222, 128, 0.2); border-color: var(--accent); color: #86efac; }
    .presence-btn.active-warn { background: rgba(245, 158, 11, 0.22); border-color: var(--amber); color: #fde68a; }

    /* Задачі */
    .task-card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 13px; display: flex; flex-direction: column; gap: 10px;
    }
    .status-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .status-btn {
      min-height: 38px; padding: 6px 4px; border-radius: 9px; font-size: 11.5px; font-weight: 700;
      background: var(--bg); border: 1px solid var(--border); color: var(--muted); text-align: center;
    }
    .status-btn.st-received { background: rgba(56, 189, 248, 0.2); border-color: var(--blue); color: #7dd3fc; }
    .status-btn.st-done { background: rgba(34, 197, 94, 0.22); border-color: #22c55e; color: #86efac; }
    .status-btn.st-failed { background: rgba(239, 68, 68, 0.22); border-color: var(--danger); color: #fca5a5; }

    /* Розхід, KPI, прев'ю */
    .kpi-box { background: var(--bg); border: 1px solid var(--border); border-radius: 11px; padding: 10px; text-align: center; }
    .kpi-val { font-size: 20px; font-weight: 800; color: #fff; }
    .kpi-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .rozkhid-row {
      display: flex; flex-direction: column; gap: 6px; padding: 9px 10px;
      border-radius: 11px; background: var(--bg); border: 1px solid var(--border);
    }
    .rozkhid-row.has-count { border-color: rgba(245, 158, 11, 0.45); }
    .stepper { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .step-btn {
      width: 34px; height: 34px; border-radius: 8px; background: var(--card);
      border: 1px solid var(--border); color: #fff; font-size: 17px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .step-val { min-width: 24px; text-align: center; font-weight: 800; font-size: 14px; }
    .name-chip {
      display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 6px;
      font-size: 11px; font-weight: 600; background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.3); color: #fde68a;
    }
    .sched-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border);
    }
    .preview-pre {
      margin: 0; padding: 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px; white-space: pre-wrap; word-break: break-word; line-height: 1.48;
    }
    .toggle-pill {
      display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 12px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    }
    .toggle-pill input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; }
    .checkbox-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      min-height: 48px; padding: 10px 12px; background: var(--bg); border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .checkbox-row.locked { opacity: 0.48; cursor: not-allowed; }
    .checkbox-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); flex-shrink: 0; }

    /* Матриця прав та діагностика Firebase */
    .perm-block {
      padding: 10px; border-radius: 11px; background: var(--bg); border: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }
    .diag-box {
      padding: 9px 11px; border-radius: 10px; font-size: 12px; line-height: 1.4; word-break: break-word;
    }
    .diag-ok { background: rgba(74, 222, 128, 0.14); border: 1px solid rgba(74, 222, 128, 0.4); color: #bbf7d0; }
    .diag-err { background: rgba(239, 68, 68, 0.18); border: 1px solid rgba(239, 68, 68, 0.45); color: #fecaca; }
    .diag-info { background: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.4); color: #bae6fd; }

    /* Модальні вікна, Toast, кольори */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.78);
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    @media (min-width: 520px) { .modal-backdrop { align-items: center; padding: 16px; } }
    .modal-box {
      width: 100%; max-width: 540px; max-height: 92vh; background: var(--card);
      border: 1px solid var(--border); border-radius: 18px 18px 0 0;
      display: flex; flex-direction: column; overflow: hidden; padding-bottom: var(--safe-bottom);
    }
    @media (min-width: 520px) { .modal-box { border-radius: 18px; padding-bottom: 0; } }
    .modal-header {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0;
    }
    .modal-title { font-size: 16px; font-weight: 800; color: #fff; }
    .modal-body { padding: 14px 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
    .modal-body > * { flex-shrink: 0; }
    .modal-footer { padding: 12px 16px; border-top: 1px solid var(--border); background: var(--card); flex-shrink: 0; }

    .toast-root {
      position: fixed; top: calc(62px + var(--safe-top)); left: 50%; transform: translateX(-50%);
      z-index: 60; width: 92%; max-width: 390px; pointer-events: none; display: flex; flex-direction: column; gap: 6px;
    }
    .toast {
      padding: 10px 14px; border-radius: 11px; text-align: center; font-size: 13px; font-weight: 700;
      color: #fff; background: #1b2836; border: 1px solid rgba(74, 222, 128, 0.55); box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .toast.error { background: #3a171c; border-color: rgba(239, 68, 68, 0.65); color: #fecaca; }

    .color-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .color-swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; }
    .color-swatch.selected { border-color: #fff; transform: scale(1.1); }
    .svg-ico { display: inline-block; vertical-align: middle; flex-shrink: 0; }
    .svg-ico.spin { animation: icoSpin 1s linear infinite; }
    @keyframes icoSpin { to { transform: rotate(360deg); } }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .status-dot.online { background: #4ade80; box-shadow: 0 0 6px rgba(74, 222, 128, 0.75); }
    .status-dot.offline { background: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.65); }
    .status-dot.local { background: #94a3b8; }
    .role-pill { display: inline-flex; align-items: center; gap: 4px; }
    .section-title { display: flex; align-items: center; gap: 6px; }
    .field-label { display: flex; align-items: center; gap: 5px; }
    .modal-title { display: flex; align-items: center; gap: 7px; }
    .seg-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    /* Плавні iOS-переходи та анімації */
    @keyframes tabFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes modalBackdropIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes modalSheetUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes modalPopIn {
      from { opacity: 0; transform: scale(0.95) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes toastDrop {
      from { opacity: 0; transform: translateY(-10px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes expandFade {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .main.tab-enter { animation: tabFadeIn 0.2s cubic-bezier(0.22, 1, 0.36, 1); }
    .modal-backdrop.open { animation: modalBackdropIn 0.18s ease-out; }
    .modal-backdrop.open .modal-box { animation: modalSheetUp 0.24s cubic-bezier(0.22, 1, 0.36, 1); }
    @media (min-width: 520px) {
      .modal-backdrop.open .modal-box { animation: modalPopIn 0.2s cubic-bezier(0.22, 1, 0.36, 1); }
    }
    .toast { animation: toastDrop 0.22s cubic-bezier(0.22, 1, 0.36, 1); }
    .soldier-expand { animation: expandFade 0.18s ease-out; }
    .nav-btn { transition: color 0.18s ease, transform 0.12s ease; position: relative; }
    .nav-btn:active { transform: scale(0.92); }
    .nav-btn.active svg { transform: translateY(-1px); transition: transform 0.18s ease; }
    .btn, .btn-icon, .pill, .seg-btn, .cal-cell, .status-btn, .presence-btn, .step-btn, .sync-pill {
      transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.1s ease;
    }
    .btn-icon:active, .pill:active, .seg-btn:active, .cal-cell:active, .status-btn:active, .presence-btn:active, .step-btn:active, .sync-pill:active {
      transform: scale(0.95);
    }
    /* Кольорові смужки статусу в задачах */
    .task-card { border-left: 4px solid var(--blue); }
    .task-card.st-done { border-left-color: #22c55e; }
    .task-card.st-failed { border-left-color: var(--danger); }
    .task-card.st-received { border-left-color: var(--blue); }

    /* Тема: Нічна OLED (чисто чорний фон) */
    [data-theme="oled"] {
      --bg: #000000;
      --bg-elev: #0a0a0a;
      --card: #0e0e0e;
      --card-hover: #171717;
      --border: #1f1f1f;
      --border-strong: #333333;
      --text: #f1f5f9;
      --muted: #8a94a6;
    }
    [data-theme="oled"] .header { background: rgba(0, 0, 0, 0.96); }
    [data-theme="oled"] .nav { background: rgba(10, 10, 10, 0.97); }
    [data-theme="oled"] .nav-badge { border-color: #0a0a0a; }
    [data-theme="oled"] .cal-cell { background: rgba(20, 20, 20, 0.75); }
    [data-theme="oled"] .acc-header { background: #070707; }

    /* Тема: Денна світла (високий контраст для сонця) */
    [data-theme="light"] {
      --bg: #f1f5f9;
      --bg-elev: #e2e8f0;
      --card: #ffffff;
      --card-hover: #f8fafc;
      --border: #cbd5e1;
      --border-strong: #94a3b8;
      --text: #0f172a;
      --muted: #475569;
      --olive: #3f6a33;
      --accent: #16a34a;
      --blue: #0284c7;
      --amber: #d97706;
      --danger: #dc2626;
    }
    [data-theme="light"] input[type="date"] { color-scheme: light; }
    [data-theme="light"] .header { background: rgba(255, 255, 255, 0.95); }
    [data-theme="light"] .nav { background: rgba(255, 255, 255, 0.97); }
    [data-theme="light"] .nav-badge { border-color: #ffffff; }
    [data-theme="light"] .brand-title,
    [data-theme="light"] .modal-title,
    [data-theme="light"] .date-bar-title,
    [data-theme="light"] .soldier-name,
    [data-theme="light"] .kpi-val,
    [data-theme="light"] .num-key,
    [data-theme="light"] .step-btn,
    [data-theme="light"] .input,
    [data-theme="light"] .select,
    [data-theme="light"] .textarea { color: #0f172a; }
    [data-theme="light"] .section-title { color: #334155; }
    [data-theme="light"] .acc-header { background: #f8fafc; }
    [data-theme="light"] .acc-header.open .chevron { color: #0f172a; }
    [data-theme="light"] .cal-cell { background: #f8fafc; color: #0f172a; }
    [data-theme="light"] .cal-cell.selected { background: rgba(63, 106, 51, 0.16); color: #14532d; }
    [data-theme="light"] .soldier-expand { background: #f8fafc; }
    [data-theme="light"] .info-banner { color: #0369a1; background: rgba(2, 132, 199, 0.1); border-color: rgba(2, 132, 199, 0.28); }
    [data-theme="light"] .btn-info { color: #0369a1; background: rgba(2, 132, 199, 0.12); border-color: rgba(2, 132, 199, 0.35); }
    [data-theme="light"] .btn-warn { color: #b45309; background: rgba(217, 119, 6, 0.12); border-color: rgba(217, 119, 6, 0.35); }
    [data-theme="light"] .btn-danger { color: #b91c1c; background: rgba(220, 38, 38, 0.1); border-color: rgba(220, 38, 38, 0.3); }
    [data-theme="light"] .role-pill { color: #15803d; background: rgba(22, 163, 74, 0.12); }
    [data-theme="light"] .role-pill.kg { color: #a16207; background: rgba(202, 138, 4, 0.14); }
    [data-theme="light"] .role-pill.kv { color: #0369a1; background: rgba(2, 132, 199, 0.12); }
    [data-theme="light"] .sync-pill.online { color: #15803d; }
    [data-theme="light"] .sync-pill.offline { color: #b91c1c; }
    [data-theme="light"] .sync-pill.syncing { color: #0369a1; }
    [data-theme="light"] .badge-kg { color: #a16207; background: rgba(202, 138, 4, 0.16); }
    [data-theme="light"] .badge-kv { color: #1d4ed8; background: rgba(37, 99, 235, 0.14); }
    [data-theme="light"] .badge-ok { color: #15803d; background: rgba(22, 163, 74, 0.14); }
    [data-theme="light"] .badge-info { color: #0369a1; background: rgba(2, 132, 199, 0.14); }
    [data-theme="light"] .badge-warn { color: #b45309; background: rgba(217, 119, 6, 0.14); }
    [data-theme="light"] .badge-err { color: #b91c1c; background: rgba(220, 38, 38, 0.14); }
    [data-theme="light"] .name-chip { color: #92400e; background: rgba(217, 119, 6, 0.12); }
    [data-theme="light"] .status-btn.st-received { color: #0369a1; background: rgba(2, 132, 199, 0.14); }
    [data-theme="light"] .status-btn.st-done { color: #15803d; background: rgba(22, 163, 74, 0.14); }
    [data-theme="light"] .status-btn.st-failed { color: #b91c1c; background: rgba(220, 38, 38, 0.14); }
    [data-theme="light"] .presence-btn.active-ok { color: #15803d; background: rgba(22, 163, 74, 0.14); }
    [data-theme="light"] .presence-btn.active-warn { color: #b45309; background: rgba(217, 119, 6, 0.14); }
    [data-theme="light"] .diag-ok { color: #166534; background: rgba(22, 163, 74, 0.12); }
    [data-theme="light"] .diag-err { color: #991b1b; background: rgba(220, 38, 38, 0.12); }
    [data-theme="light"] .diag-info { color: #075985; background: rgba(2, 132, 199, 0.12); }
    [data-theme="light"] .toast { background: #ffffff; color: #0f172a; box-shadow: 0 8px 24px rgba(15,23,42,0.16); }
    [data-theme="light"] .toast.error { background: #fef2f2; color: #991b1b; }
    [data-theme="light"] .task-card [style*="color:#fff"],
    [data-theme="light"] .perm-block [style*="color:#fff"],
    [data-theme="light"] .card [style*="color:#fff"],
    [data-theme="light"] .pin-screen [style*="color:#fff"] { color: #0f172a !important; }
    [data-theme="light"] .duty-group-box { background: #f8fafc !important; }

    /* =========================================================================
       НОВА НАВІГАЦІЯ: ГОЛОВНИЙ ЕКРАН-ХАБ + ВЕРХНІЙ ШВИДКИЙ ПЕРЕМИКАЧ
       ========================================================================= */
    body[data-nav="hub"] .header { display: none; }
    body[data-nav="hub"] .app { padding-bottom: calc(28px + var(--safe-bottom)); }
    body[data-nav="sec"] .app { padding-bottom: calc(28px + var(--safe-bottom)); }

    .hub-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-top: calc(10px + var(--safe-top));
    }
    .hub-toprow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .hub-kicker {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    .hub-h1 {
      margin: 2px 0 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--text);
    }
    .hub-board {
      display: flex;
      gap: 16px;
      background: #161C18;
      color: #F1F4EF;
      border-radius: 22px;
      padding: 16px;
      cursor: pointer;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .hub-board-date {
      flex: 0 0 68px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-right: 14px;
      border-right: 1px solid rgba(255, 255, 255, 0.14);
    }
    .hub-board-date b {
      font-size: 46px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      color: #fff;
    }
    .hub-board-date span { font-size: 13px; color: #AEB8AF; margin-top: 4px; }
    .hub-board-date em {
      font-style: normal;
      font-size: 12px;
      font-weight: 700;
      color: #161C18;
      background: #D9A21B;
      border-radius: 6px;
      padding: 1px 7px;
      margin-top: 7px;
    }
    .hub-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .hub-tile {
      position: relative;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 118px;
      transition: transform 0.12s ease, border-color 0.15s ease;
    }
    .hub-tile:active { transform: scale(0.97); }
    .hub-tile-ico {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--olive);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }
    .hub-tile-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
    }
    .hub-tile-sub {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.3;
    }
    .hub-badge-red {
      position: absolute;
      top: 12px;
      right: 12px;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      background: #ef4444;
      color: #fff;
      font-size: 11.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .hub-row-card {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 14px;
    }
    .hub-row-card:active { transform: scale(0.99); }

    .sec-topbar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 4px;
    }
    .sec-back-btn {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 36px;
      padding: 4px 8px 4px 2px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
    }
    .sec-switch-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .sec-switch-strip::-webkit-scrollbar { display: none; }
    .sec-chip {
      flex-shrink: 0;
      min-height: 34px;
      padding: 4px 11px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .sec-chip.active {
      background: var(--olive);
      border-color: var(--olive);
      color: #fff;
    }
    .sec-chip-dot {
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: #ef4444;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================================================================
       ПРІОРИТЕТНІСТЬ ЗАДАЧ ТА ФОТОДОКАЗИ ВИКОНАННЯ (v3.10)
       ========================================================================= */
    .prio-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    .prio-high {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.45);
    }
    .prio-normal {
      background: rgba(56, 189, 248, 0.16);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .prio-low {
      background: rgba(148, 163, 184, 0.16);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }
    .task-card.prio-high-card {
      border-top: 2px solid rgba(239, 68, 68, 0.55);
    }
    .photo-proof-box {
      padding: 10px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .photo-proof-box.required-missing {
      border-color: rgba(245, 158, 11, 0.65);
      background: rgba(245, 158, 11, 0.08);
    }
    .photo-thumb {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .photo-full-img {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 10px;
      background: #000;
    }
    html:not([data-theme="dark"]):not([data-theme="oled"]) .prio-high {
      background: rgba(194, 59, 46, 0.12);
      color: #991b1b;
      border-color: rgba(194, 59, 46, 0.35);
    }
    html:not([data-theme="dark"]):not([data-theme="oled"]) .prio-normal {
      background: rgba(47, 111, 219, 0.12);
      color: #1e40af;
      border-color: rgba(47, 111, 219, 0.3);
    }
    html:not([data-theme="dark"]):not([data-theme="oled"]) .prio-low {
      background: rgba(100, 116, 139, 0.12);
      color: #334155;
      border-color: rgba(100, 116, 139, 0.3);
    }

    /* =========================================================================
       АНТИ-МОХЛЮВАННЯ ТА ВКЛАДКА «БІЛЬШЕ НЕ АКТУАЛЬНО» (v3.12)
       ========================================================================= */
    .st-pending-review {
      background: rgba(245, 158, 11, 0.22);
      border-color: var(--amber);
      color: #fde68a;
    }
    .st-irrelevant {
      background: rgba(148, 163, 184, 0.2);
      border-color: #94a3b8;
      color: #cbd5e1;
    }
    .task-card.st-pending_review { border-left-color: var(--amber); }
    .task-card.st-irrelevant { border-left-color: #94a3b8; opacity: 0.9; }
    .audit-log-box {
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .audit-item {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    html:not([data-theme="dark"]):not([data-theme="oled"]) .st-pending-review {
      color: #b45309;
      background: rgba(217, 119, 6, 0.14);
    }
    html:not([data-theme="dark"]):not([data-theme="oled"]) .st-irrelevant {
      color: #334155;
      background: rgba(100, 116, 139, 0.14);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Аварійний блок діагностики помилок -->
  <div id="fatal-error-box"></div>

  <!-- Екран входу за PIN-кодом -->
  <div id="pin-screen" class="pin-screen hidden"></div>

  <!-- Основна оболонка застосунку -->
  <div id="app-shell" class="app hidden">
    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <div class="min0">
          <div class="brand-title">Помічник взводу</div>
          <div class="header-meta">
            <span id="header-role-pill" class="role-pill"><svg class="svg-ico" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Адмін</span>
          </div>
        </div>
      </div>
      <div class="row" style="gap:6px;flex-shrink:0">
        <button id="header-sync-pill" class="sync-pill" onclick="onHeaderSyncPillClick()" title="Хто онлайн / Синхронізація"><span class="status-dot local"></span> Локально</button>
        <button class="btn-icon btn-icon-sm" onclick="logoutSession()" title="Вийти / Змінити PIN" aria-label="Вийти"><svg class="svg-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
    </header>

    <main id="main-content" class="main"></main>

    <!-- Нижній фіксований бар прибрано: навігація через Головний екран-хаб та верхню смугу розділу -->
  </div>

  <!-- Модальне вікно, Toast та прихований input для імпорту JSON -->
  <div id="modal-root" class="modal-backdrop" onclick="if(event.target.id==='modal-root') closeModal()">
    <div id="modal-box" class="modal-box"></div>
  </div>
  <div id="toast-root" class="toast-root"></div>
  <input type="file" id="import-json-input" accept=".json,application/json" style="display:none" onchange="handleImportJSON(event)" />

  <script>
    // =========================================================================

        }
      };

      var rawSquads = Array.isArray(raw.squads) ? raw.squads
        : (raw.squads && typeof raw.squads === 'object' ? Object.values(raw.squads).filter(Boolean) : []);
      var mappedSquads = rawSquads.length ? rawSquads.map(function(sq, idx) {
        var sid = mapLegacySquadId(sq.id || ('sq' + idx));
        return {
          id: sid,
          name: String(sq.name || ('Відділення ' + idx)),
          color: sq.color || PALETTE[idx % PALETTE.length],
          isCmdGroup: Boolean(sq.isCmdGroup || sq.isGroupCmd || sid === 'cmd')
        };
      }) : def.squads;

      var rawDutyTypes = Array.isArray(raw.dutyTypes) ? raw.dutyTypes
        : (raw.dutyTypes && typeof raw.dutyTypes === 'object' ? Object.values(raw.dutyTypes).filter(Boolean) : []);
      var mappedDutyTypes = rawDutyTypes.length ? rawDutyTypes.map(function(dt, idx) {
        return {
          id: String(dt.id || genId('dt')),
          shortName: String(dt.shortName || dt.name || 'Наряд').trim(),
          name: String(dt.name || dt.shortName || 'Наряд').trim(),
          maxCount: Math.max(1, Number(dt.maxCount || dt.maxPeople) || 1),
          color: dt.color || PALETTE[(idx + 4) % PALETTE.length]
        };
      }) : def.dutyTypes;

      var rawPersonnel = Array.isArray(raw.personnel) ? raw.personnel
        : (Array.isArray(raw.soldiers) ? raw.soldiers
        : (raw.personnel && typeof raw.personnel === 'object' ? Object.values(raw.personnel).filter(Boolean) : []));

      var rawTasks = Array.isArray(raw.tasks) ? raw.tasks
        : (raw.tasks && typeof raw.tasks === 'object' ? Object.values(raw.tasks).filter(Boolean) : []);

      var rawSched = Array.isArray(raw.scheduledAbsences) ? raw.scheduledAbsences
        : (raw.scheduledAbsences && typeof raw.scheduledAbsences === 'object' ? Object.values(raw.scheduledAbsences).filter(Boolean) : []);

      // Підтримка нарядів як об'єкта {date: {dtId: [ids]}} так і масиву [{date, soldierId, dutyTypeId}]
      var normalizedDuties = {};
      if (Array.isArray(raw.duties)) {
        raw.duties.forEach(function(d) {
          if (!d || !d.date || !d.soldierId) return;
          var dk = String(d.date);
          var dtId = String(d.dutyTypeId || (mappedDutyTypes[0] ? mappedDutyTypes[0].id : 'chk'));
          if (!normalizedDuties[dk]) normalizedDuties[dk] = {};
          if (!normalizedDuties[dk][dtId]) normalizedDuties[dk][dtId] = [];
          if (normalizedDuties[dk][dtId].indexOf(String(d.soldierId)) === -1) {
            normalizedDuties[dk][dtId].push(String(d.soldierId));
          }
        });
      } else if (raw.duties && typeof raw.duties === 'object') {
        normalizedDuties = JSON.parse(JSON.stringify(raw.duties));
      }

      var s = {
        groupNumber: typeof raw.groupNumber === 'string' && raw.groupNumber.trim() ? raw.groupNumber.trim() : def.groupNumber,
        squads: mappedSquads,
        dutyTypes: mappedDutyTypes,
        personnel: rawPersonnel,
        duties: normalizedDuties,
        tasks: rawTasks,
        rozkhid: raw.rozkhid && typeof raw.rozkhid === 'object' && !Array.isArray(raw.rozkhid) ? raw.rozkhid : {},
        scheduledAbsences: rawSched,
        pins: Object.assign({}, DEFAULT_PINS, raw.pins && typeof raw.pins === 'object' ? raw.pins : {}),
        permissions: JSON.parse(JSON.stringify(DEFAULT_PERMISSIONS)),
        updatedAt: Number(raw.updatedAt) || 0
      };

      // Нормалізація прав доступу (підтримка permissions та rolePermissions)
      var rawPerms = (raw.permissions && typeof raw.permissions === 'object') ? raw.permissions
        : ((raw.rolePermissions && typeof raw.rolePermissions === 'object') ? raw.rolePermissions : null);
      if (rawPerms) {
        ['kg', 'kv1', 'kv2', 'kv3'].forEach(function(rk) {
          if (rawPerms[rk] && typeof rawPerms[rk] === 'object') {
            var rp = rawPerms[rk];
            var pMode = rp.personnelMode || rp.skladMode || DEFAULT_PERMISSIONS[rk].personnelMode;
            if (pMode === 'all_edit') pMode = 'all';
            s.permissions[rk] = {
              dutiesEdit: rp.dutiesEdit !== undefined ? Boolean(rp.dutiesEdit) : DEFAULT_PERMISSIONS[rk].dutiesEdit,
              tasksCreate: rp.tasksCreate !== undefined ? Boolean(rp.tasksCreate) : DEFAULT_PERMISSIONS[rk].tasksCreate,
              tasksUpdate: rp.tasksUpdate !== undefined ? Boolean(rp.tasksUpdate) : (rp.tasksStatus !== undefined ? Boolean(rp.tasksStatus) : DEFAULT_PERMISSIONS[rk].tasksUpdate),
              tasksViewAll: rp.tasksViewAll !== undefined ? Boolean(rp.tasksViewAll) : DEFAULT_PERMISSIONS[rk].tasksViewAll,
              rozkhidMode: rp.rozkhidMode || DEFAULT_PERMISSIONS[rk].rozkhidMode,
              personnelMode: pMode
            };
          }
        });
      }

      // Гарантуємо валідні поля бійців (підтримка name і fullName, isCommander і isLeader)
      s.personnel = s.personnel.filter(function(p) {
        return p && (String(p.name || p.fullName || '').trim().length > 0);
      }).map(function(p) {
        return {
          id: String(p.id || genId('p')),
          name: String(p.name || p.fullName || '').trim(),
          rank: String(p.rank || 'курс.').trim(),
          squadId: mapLegacySquadId(p.squadId || 'sq1'),
          isCommander: Boolean(p.isCommander || p.isLeader),
          note: String(p.note || '')
        };
      });

      // Нормалізація задач (підтримка старих форматів)
      s.tasks = s.tasks.filter(function(t) { return t && t.text; }).map(function(t) {
        var sqId = t.targetSquadId ? mapLegacySquadId(t.targetSquadId) : (t.squadId ? mapLegacySquadId(t.squadId) : '');
        var inferredRole = t.targetRole || (t.recipientType === 'all_leaders' ? 'all' : (sqId === 'sq1' ? 'kv1' : sqId === 'sq2' ? 'kv2' : sqId === 'sq3' ? 'kv3' : sqId === 'cmd' ? 'kg' : ''));
        var matchedRec = TASK_RECIPIENTS.find(function(r) {
          return r.targetRole === inferredRole || r.label === t.target;
        });
        var normPrio = (t.priority === 'high' || t.priority === 'low' || t.priority === 'normal') ? t.priority : 'normal';
        return {
          id: String(t.id || genId('task')),
          text: String(t.text),
          target: t.target || (matchedRec ? matchedRec.label : 'Усім командирам відділень'),
          targetRole: inferredRole || (matchedRec ? matchedRec.targetRole : 'all'),
          targetSquadId: sqId || (matchedRec ? matchedRec.targetSquadId : 'all'),
          author: String(t.author || t.issuer || ''),
          priority: normPrio,
          requirePhoto: Boolean(t.requirePhoto),
          photoProof: typeof t.photoProof === 'string' ? t.photoProof : '',
          photoUpdatedAt: String(t.photoUpdatedAt || ''),
          status: (t.status === 'done' || t.status === 'pending_review' || t.status === 'irrelevant' || t.status === 'failed' || t.status === 'received') ? t.status : 'received',
          remark: String(t.remark || t.note || ''),
          statusChangedBy: String(t.statusChangedBy || ''),
          statusChangedAt: String(t.statusChangedAt || ''),
          verifiedBy: String(t.verifiedBy || ''),
          verifiedAt: String(t.verifiedAt || ''),
          auditTrail: Array.isArray(t.auditTrail) ? t.auditTrail.slice(-15) : [],
          createdAt: t.createdAt || fmtTimeNow()
        };
      });

      // Нормалізація запланованих відсутностей (підтримка startDate/endDate/category)
      s.scheduledAbsences = s.scheduledAbsences.filter(function(sa) {
        return sa && sa.soldierId && (sa.fromDate || sa.startDate);
      }).map(function(sa) {
        var fromD = String(sa.fromDate || sa.startDate);
        var toD = String(sa.toDate || sa.endDate || fromD);
        var catK = String(sa.catKey || sa.category || 'sh');
        if (catK === 'priyom_shpytal') catK = 'priyom_shp';
        if (catK === 'priyom_lazaret') catK = 'priyom_laz';
        return {
          id: String(sa.id || genId('sa')),
          soldierId: String(sa.soldierId),
          catKey: catK,
          fromDate: fromD,
          toDate: toD,
          note: String(sa.note || '')
        };
      });

      // Нормалізація нарядів (масив IDs)
      Object.keys(s.duties).forEach(function(dk) {
        var dayObj = s.duties[dk];
        if (!dayObj || typeof dayObj !== 'object') { delete s.duties[dk]; return; }
        Object.keys(dayObj).forEach(function(dtId) {
          var v = dayObj[dtId];
          if (Array.isArray(v)) dayObj[dtId] = v.filter(Boolean);
          else if (typeof v === 'string' && v) dayObj[dtId] = [v];
          else if (v && typeof v === 'object') dayObj[dtId] = Object.values(v).filter(Boolean);
          else dayObj[dtId] = [];
        });
      });

      return s;
    }

    function loadLocalState() {
      var rawStr = safeLSGet(STORAGE_KEY);
      if (!rawStr) return createDefaultState();
      try {
        return normalizeState(JSON.parse(rawStr));
      } catch (e) {
        return createDefaultState();
      }
    }

    var state = loadLocalState();
    var currentRole = null;
    var pinBuffer = '';
    var pinError = false;

    // UI-стан (не зберігається в базу)
    var ui = {
      screen: 'hub',
      tab: 'duties',
      dutiesSubtab: 'calendar',
      calYear: new Date().getFullYear(),
      calMonth: new Date().getMonth(),
      selectedDate: todayISO(),
      rozkhidDate: todayISO(),
      rozkhidShowNames: true,
      rozkhidHideZeros: false,
      rozkhidSchedOpen: false,
      tasksFilterRecipient: 'all',
      tasksFilterStatus: 'all',
      tasksExpandedRemarks: {},
      personnelSearch: '',
      personnelSquadFilter: 'all',
      expandedSoldiers: {},
      collapsedSquads: {},
      dutyModalSelection: [],
      rozkhidModalSearch: '',
      rozkhidModalCollapsed: {}
    };

    // Стан синхронізації Firebase
    var fbUrl = safeLSGet(FB_URL_STORAGE_KEY) || '';
    var fbStatus = fbUrl ? 'offline' : 'local'; // 'local' | 'online' | 'offline' | 'syncing'
    var fbDiag = { type: 'info', text: fbUrl ? 'Очікується перевірка підключення...' : 'Хмарну базу ще не підключено.' };
    var fbLastSyncText = '';
    var fbPollTimer = null;
    var fbPushTimer = null;
    var fbPresenceMap = {};
    var fbPresenceTimer = null;
    var PRESENCE_ONLINE_MS = 65000;

    function saveState(immediatePush) {
      state.updatedAt = Date.now();
      try {
        safeLSSet(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      updateTasksBadge();
      if (fbUrl) {
        if (immediatePush) {
          clearTimeout(fbPushTimer);
          fbPushAll(true);
        } else {
          clearTimeout(fbPushTimer);
          fbPushTimer = setTimeout(function() { fbPushAll(true); }, 650);
        }
      }
    }

    // Хелпери прав доступу
    function getRoleMeta(role) { return ROLES_META[role] || ROLES_META.kv1; }
    function isAdmin() { return currentRole === 'admin'; }
    function getPerm(role) {
      var r = role || currentRole;
      if (r === 'admin') {
        return { dutiesEdit: true, tasksCreate: true, tasksUpdate: true, tasksViewAll: true, rozkhidMode: 'all', personnelMode: 'all' };
      }
      return (state.permissions && state.permissions[r]) ? state.permissions[r] : DEFAULT_PERMISSIONS.kv1;
    }
    function canEditDuties() { return isAdmin() || Boolean(getPerm().dutiesEdit); }
    function canCreateTasks() { return isAdmin() || Boolean(getPerm().tasksCreate); }
    function canUpdateTasks() { return isAdmin() || Boolean(getPerm().tasksUpdate); }
    function getRozkhidMode() { return isAdmin() ? 'all' : (getPerm().rozkhidMode || 'view'); }
    function getPersonnelMode() { return isAdmin() ? 'all' : (getPerm().personnelMode || 'view'); }
    function getMySquadId() { return getRoleMeta(currentRole).squadId; }

    function canEditSoldierPresence(soldier) {
      var mode = getPersonnelMode();
      if (mode === 'all') return true;
      if (mode === 'own_status') return Boolean(soldier && soldier.squadId === getMySquadId());
      return false;
    }

    function canEditSoldierInRozkhid(soldier) {
      var mode = getRozkhidMode();
      if (mode === 'all') return true;
      if (mode === 'own') return Boolean(soldier && soldier.squadId === getMySquadId());
      return false;
    }

    // Чітка перевірка видимості задач для кожної ролі (ВИПРАВЛЕНО)
    function isTaskVisibleForRole(task, role) {
      if (!task) return false;
      var r = role || currentRole;
      if (!r) return false;
      if (r === 'admin') return true;
      var perm = getPerm(r);
      if (perm && perm.tasksViewAll) return true;

      if (task.targetRole === 'all' || task.targetSquadId === 'all' || task.target === 'Усім командирам відділень') {
        return true;
      }
      if (task.targetRole && task.targetRole === r) return true;

      var roleSquadId = getRoleMeta(r).squadId;
      if (roleSquadId && task.targetSquadId && task.targetSquadId === roleSquadId) return true;

      var labelMap = {
        kv1: 'Командиру 1-го відділення',
        kv2: 'Командиру 2-го відділення',
        kv3: 'Командиру 3-го відділення',
        kg:  'Командиру групи'
      };
      if (labelMap[r] && task.target === labelMap[r]) return true;
      return false;
    }

    // =========================================================================
    // 4. FIREBASE REALTIME DATABASE REST API (НОРМАЛІЗАЦІЯ + ОЧИЩЕННЯ КЛЮЧІВ)
    // =========================================================================
    function normalizeFirebaseBaseUrl(raw) {
      var str = String(raw || '').trim();
      if (!str) return '';
      // Якщо випадково вставили подвійне посилання типу "Https://a](https://a"
      var match = str.match(/https?:\/\/[a-zA-Z0-9._-]+(?:\.firebaseio\.com|\.firebasedatabase\.app)/i);
      if (match && match[0]) {
        str = match[0];
      }
      str = str.replace(/^https?:\/\//i, function(m) { return m.toLowerCase(); });
      if (!/^https?:\/\//i.test(str)) str = 'https://' + str;
      str = str.replace(/\/platoon_data\.json.*$/i, '');
      str = str.replace(/\/\.json.*$/i, '');
      str = str.replace(/\.json.*$/i, '');
      str = str.replace(/\/+$/, '');
      return str;
    }

    function sanitizeForFirebase(val) {
      if (val === undefined) return null;
      if (typeof val === 'number' && !isFinite(val)) return null;
      if (val === null || typeof val !== 'object') return val;
      if (Array.isArray(val)) {
        return val.map(function(item) { return sanitizeForFirebase(item); });
      }
      var out = {};
      Object.keys(val).forEach(function(k) {
        var cleanKey = String(k).replace(/[.$#\[\]\/]/g, '_');
        if (!cleanKey) cleanKey = '_empty';
        out[cleanKey] = sanitizeForFirebase(val[k]);
      });
      return out;
    }

    function getOnlineRolesList() {
      var now = Date.now();
      var list = [];
      ['admin', 'kg', 'kv1', 'kv2', 'kv3'].forEach(function(rk) {
        var rec = fbPresenceMap && fbPresenceMap[rk];
        var lastSeen = rec ? Number(rec.lastSeen) || 0 : 0;
        var isMeOnline = (rk === currentRole && fbStatus === 'online');
        if (isMeOnline || (lastSeen > 0 && (now - lastSeen) <= PRESENCE_ONLINE_MS)) {
          list.push(rk);
        }
      });
      return list;
    }

    function updateSyncPillUI() {
      var pill = document.getElementById('header-sync-pill');
      if (!pill) return;
      pill.className = 'sync-pill ' + (fbStatus === 'online' ? 'online' : fbStatus === 'offline' ? 'offline' : fbStatus === 'syncing' ? 'syncing' : '');
      if (fbStatus === 'online') {
        var onlineCnt = getOnlineRolesList().length;
        pill.innerHTML = '<span class="status-dot online"></span> ' + (onlineCnt > 0 ? (onlineCnt + ' онлайн') : 'Онлайн');
      } else if (fbStatus === 'offline') pill.innerHTML = '<span class="status-dot offline"></span> Офлайн';
      else if (fbStatus === 'syncing') pill.innerHTML = ico('refresh', 13, 'spin') + ' Синхр...';
      else pill.innerHTML = '<span class="status-dot local"></span> Локально';
    }

    function fbSendPresenceHeartbeat() {
      try {
        var base = normalizeFirebaseBaseUrl(fbUrl);
        if (!base || !currentRole || document.hidden) return;
        var now = Date.now();
        fbPresenceMap[currentRole] = { role: currentRole, lastSeen: now };
        fetch(base + '/presence/' + currentRole + '.json', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role: currentRole, lastSeen: now })
        }).catch(function() {});
      } catch (e) {}
    }

    function fbFetchPresence() {
      try {
        var base = normalizeFirebaseBaseUrl(fbUrl);
        if (!base) return Promise.resolve();
        return fetch(base + '/presence.json', { method: 'GET', cache: 'no-store' })
          .then(function(r) { return r.ok ? r.json() : null; })
          .then(function(data) {
            if (data && typeof data === 'object') {
              fbPresenceMap = data;
              updateSyncPillUI();
            }
          })
          .catch(function() {});
      } catch (e) { return Promise.resolve(); }
    }

    function startPresenceTracking() {
      stopPresenceTracking();
      if (!fbUrl || !currentRole) return;
      fbSendPresenceHeartbeat();
      fbFetchPresence();
      fbPresenceTimer = setInterval(function() {
        if (fbUrl && currentRole && !document.hidden) {
          fbSendPresenceHeartbeat();
          fbFetchPresence();
        }
      }, 25000);
    }

    function stopPresenceTracking() {
      if (fbPresenceTimer) { clearInterval(fbPresenceTimer); fbPresenceTimer = null; }
    }

    function formatLastSeenUA(ts) {
      if (!ts) return 'Ще не заходив';
      var diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
      if (diffSec <= 65) return 'Онлайн зараз';
      var mins = Math.floor(diffSec / 60);
      if (mins < 60) return 'Був ' + mins + ' хв тому';
      var hrs = Math.floor(mins / 60);
      if (hrs < 24) return 'Був ' + hrs + ' год тому';
      var days = Math.floor(hrs / 24);
      return 'Був ' + days + ' дн тому';
    }

    function openPresenceModal() {
      fbSendPresenceHeartbeat();
      fbFetchPresence().then(function() {
        var now = Date.now();
        var onlineCount = getOnlineRolesList().length;
        var rows = ['admin', 'kg', 'kv1', 'kv2', 'kv3'].map(function(rk) {
          var meta = ROLES_META[rk];
          var rec = fbPresenceMap && fbPresenceMap[rk];
          var lastSeen = rec ? Number(rec.lastSeen) || 0 : 0;
          var isMe = rk === currentRole;
          var isOnline = (isMe && fbStatus === 'online') || (lastSeen > 0 && (now - lastSeen) <= PRESENCE_ONLINE_MS);
          var badge = isOnline
            ? '<span class="badge badge-ok"><span class="status-dot online"></span> Онлайн</span>'
            : '<span class="text-xs text-muted">' + esc(formatLastSeenUA(lastSeen)) + '</span>';
          return '<div class="row-between" style="padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--border)">' +
            '<div class="fw-bold text-sm">' + esc(meta.label) + (isMe ? ' <span class="text-xs text-muted">(ви)</span>' : '') + '</div>' +
            '<div>' + badge + '</div>' +
          '</div>';
        }).join('');

        openModal(
          '<div class="modal-header">' +
            '<div><div class="modal-title">Хто онлайн (' + onlineCount + ')</div>' +
            '<div class="text-xs text-muted">' + (fbLastSyncText ? ('Синхр.: ' + esc(fbLastSyncText)) : 'Оновлюється кожні 25 сек') + '</div></div>' +
            '<button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button>' +
          '</div>' +
          '<div class="modal-body">' +
            '<div class="stack-sm">' + rows + '</div>' +
            '<button type="button" class="btn btn-info btn-full" onclick="closeModal();manualSyncFromHeader()">' + ico('refresh', 15) + ' Оновити дані з хмари</button>' +
          '</div>'
        );
      });
    }

    function onHeaderSyncPillClick() {
      if (fbUrl && fbStatus === 'online') {
        openPresenceModal();
      } else {
        manualSyncFromHeader();
      }
    }

    function setFbDiag(type, text) {
      fbDiag = { type: type, text: text };
      var el = document.getElementById('fb-diag-box');
      if (el) {
        el.className = 'diag-box ' + (type === 'ok' ? 'diag-ok' : type === 'err' ? 'diag-err' : 'diag-info');
        el.textContent = text;
      }
    }

    function isUserActivelyEditing() {
      var a = document.activeElement;
      if (!a) return false;
      var tag = a.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    }

    function fbFetchJSON(url, options) {
      return fetch(url, options).then(function(resp) {
        return resp.text().then(function(txt) {
          var parsed = null;
          try { parsed = txt ? JSON.parse(txt) : null; } catch (e) {}
          if (!resp.ok) {
            var errMsg = (parsed && parsed.error) ? parsed.error : (txt || resp.statusText || 'Помилка сервера');
            return { ok: false, status: resp.status, message: 'HTTP ' + resp.status + ': ' + errMsg, data: parsed };
          }
          return { ok: true, status: resp.status, message: 'HTTP ' + resp.status + ' OK', data: parsed };
        });
      }).catch(function(err) {
        return { ok: false, status: 0, message: 'Мережа: ' + (err && err.message ? err.message : String(err)), data: null };
      });
    }

    function applyRemoteSnapshot(remoteData, forceApply) {
      if (!remoteData || typeof remoteData !== 'object') return false;
      var remoteTs = Number(remoteData.updatedAt) || 0;
      if (!forceApply && remoteTs <= (Number(state.updatedAt) || 0)) return false;
      state = normalizeState(remoteData);
      try { safeLSSet(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      return true;
    }

    function fbPullAll(forceApply, silent) {
      var base = normalizeFirebaseBaseUrl(fbUrl);
      if (!base) {
        fbStatus = 'local';
        updateSyncPillUI();
        return Promise.resolve({ ok: false, message: 'URL не задано' });
      }
      if (!silent) {
        fbStatus = 'syncing';
        updateSyncPillUI();
      }
      return fbFetchJSON(base + '/platoon_data.json', { method: 'GET', cache: 'no-store' }).then(function(res) {
        if (!res.ok) {
          fbStatus = 'offline';
          updateSyncPillUI();
          setFbDiag('err', 'Помилка читання — ' + res.message);
          if (!silent) showToast('Помилка читання: ' + res.message, true);
          return res;
        }
        fbStatus = 'online';
        fbLastSyncText = fmtTimeNow();
        updateSyncPillUI();
        if (res.data === null) {
          setFbDiag('info', 'Підключено (HTTP 200). База порожня — натисніть «Завантажити мої дані в хмару».');
          return res;
        }
        var changed = applyRemoteSnapshot(res.data, Boolean(forceApply));
        setFbDiag('ok', 'Онлайн (HTTP ' + res.status + '). Синхронізовано: ' + fbLastSyncText);
        if (changed && currentRole) {
          updateTasksBadge();
          if (!isUserActivelyEditing()) render();
        }
        if (!silent && forceApply) showToast('Дані завантажено з хмари');
        return res;
      });
    }

    function fbPushAll(silent) {
      var base = normalizeFirebaseBaseUrl(fbUrl);
      if (!base) {
        if (!silent) showToast('Спочатку вкажіть посилання Firebase', true);
        return Promise.resolve({ ok: false, message: 'URL не задано' });
      }
      if (!silent) {
        fbStatus = 'syncing';
        updateSyncPillUI();
      }
      var payload = sanitizeForFirebase(state);
      return fbFetchJSON(base + '/platoon_data.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(function(res) {
        if (!res.ok) {
          fbStatus = 'offline';
          updateSyncPillUI();
          setFbDiag('err', 'Помилка запису — ' + res.message);
          if (!silent) showToast('Помилка запису: ' + res.message, true);
          return res;
        }
        fbStatus = 'online';
        fbLastSyncText = fmtTimeNow();
        updateSyncPillUI();
        setFbDiag('ok', 'Завантажено в хмару (HTTP ' + res.status + ') • ' + fbLastSyncText);
        if (!silent) showToast('Дані успішно завантажено в хмару');
        return res;
      });
    }

    function fbConnectFromSettings() {
      var input = document.getElementById('set-fb-url');
      var clean = normalizeFirebaseBaseUrl(input ? input.value : '');
      if (!clean) {
        fbUrl = '';
        safeLSRemove(FB_URL_STORAGE_KEY);
        fbStatus = 'local';
        updateSyncPillUI();
        setFbDiag('info', 'Хмарну синхронізацію вимкнено (локальний режим).');
        showToast('Локальний режим');
        return;
      }
      fbUrl = clean;
      safeLSSet(FB_URL_STORAGE_KEY, fbUrl);
      if (input) input.value = fbUrl;
      startFbPolling();
      startPresenceTracking();
      fbPullAll(false, false).then(function(res) {
        if (res.ok) showToast('Firebase підключено!');
      });
    }

    function manualSyncFromHeader() {
      if (!fbUrl) {
        switchTab('settings');
        showToast('Підключіть Firebase у Налаштуваннях');
        return;
      }
      fbPullAll(true, false);
    }

    function startFbPolling() {
      if (fbPollTimer) clearInterval(fbPollTimer);
      if (!fbUrl) return;
      fbPollTimer = setInterval(function() {
        if (fbUrl && !document.hidden) fbPullAll(false, true);
      }, 15000);
    }

    function copyShareLinkForKV() {
      var base = normalizeFirebaseBaseUrl(fbUrl);
      if (!base) { showToast('Спочатку підключіть Firebase', true); return; }
      var pageUrl = window.location.origin + window.location.pathname;
      var full = pageUrl + '?fb=' + encodeURIComponent(base);
      copyText(full, 'Посилання для КВ скопійовано!');
    }

    // =========================================================================
    // 5. УНІВЕРСАЛЬНЕ ГРУПУВАННЯ ТА СОРТУВАННЯ ОСОБОВОГО СКЛАДУ
    // =========================================================================
    function getOrderedSquads() {
      return state.squads.slice().sort(function(a, b) {
        var rankA = a.isCmdGroup || a.id === 'cmd' ? 0 : (a.id === 'sq1' ? 1 : a.id === 'sq2' ? 2 : a.id === 'sq3' ? 3 : 10);
        var rankB = b.isCmdGroup || b.id === 'cmd' ? 0 : (b.id === 'sq1' ? 1 : b.id === 'sq2' ? 2 : b.id === 'sq3' ? 3 : 10);
        if (rankA !== rankB) return rankA - rankB;
        return a.name.localeCompare(b.name, 'uk');
      });
    }

    function getSoldiersBySquad(squadId, searchQuery) {
      var q = String(searchQuery || '').trim().toLowerCase();
      return state.personnel
        .filter(function(p) {
          if (p.squadId !== squadId) return false;
          if (!q) return true;
          return p.name.toLowerCase().indexOf(q) !== -1 || p.rank.toLowerCase().indexOf(q) !== -1;
        })
        .sort(function(a, b) {
          if (a.isCommander && !b.isCommander) return -1;
          if (!a.isCommander && b.isCommander) return 1;
          return a.name.localeCompare(b.name, 'uk');
        });
    }

    function getSoldierById(id) {
      return state.personnel.find(function(p) { return p.id === id; }) || null;
    }

    function getSquadById(id) {
      return state.squads.find(function(sq) { return sq.id === id; }) || null;
    }

    function getDutyTypeById(id) {
      return state.dutyTypes.find(function(dt) { return dt.id === id; }) || null;
    }

    function getCommanderBadgeHtml(soldier, squad) {
      if (!soldier || !soldier.isCommander) return '';
      if (squad && (squad.isCmdGroup || squad.id === 'cmd')) {
        return '<span class="badge badge-kg">★ КГ</span>';
      }
      return '<span class="badge badge-kv">★ КВ</span>';
    }

    // =========================================================================
    // 6. ЛОГІКА РОЗХОДУ, СТАТУСІВ ПРИСУТНОСТІ ТА ЗАПЛАНОВАНИХ ДАТ
    // =========================================================================
    function ensureRozkhidDay(iso) {
      if (!state.rozkhid[iso] || typeof state.rozkhid[iso] !== 'object') {
        state.rozkhid[iso] = {};
      }
      ROZKHID_CATS.forEach(function(c) {
        if (!state.rozkhid[iso][c.key] || typeof state.rozkhid[iso][c.key] !== 'object') {
          state.rozkhid[iso][c.key] = { count: 0, ids: [] };
        }
        var entry = state.rozkhid[iso][c.key];
        if (!Array.isArray(entry.ids)) entry.ids = entry.ids && typeof entry.ids === 'object' ? Object.values(entry.ids).filter(Boolean) : [];
        // Фільтруємо видалених бійців
        entry.ids = entry.ids.filter(function(id) { return Boolean(getSoldierById(id)); });
        entry.count = Math.max(Number(entry.count) || 0, entry.ids.length);
      });
      return state.rozkhid[iso];
    }

    function getDutyIdsForDate(iso) {
      var day = state.duties[iso];
      if (!day) return [];
      var set = {};
      Object.keys(day).forEach(function(dtId) {
        (day[dtId] || []).forEach(function(sid) { if (getSoldierById(sid)) set[sid] = true; });
      });
      return Object.keys(set);
    }

    function removeSoldierFromAllRozkhidCats(iso, soldierId, exceptCatKey) {
      var day = ensureRozkhidDay(iso);
      ROZKHID_CATS.forEach(function(c) {
        if (c.key === exceptCatKey) return;
        var entry = day[c.key];
        var idx = entry.ids.indexOf(soldierId);
        if (idx !== -1) {
          entry.ids.splice(idx, 1);
          if (entry.count > 0) entry.count = Math.max(entry.ids.length, entry.count - 1);
        }
      });
    }

    function setSoldierPresenceForDate(iso, soldierId, catKey) {
      var day = ensureRozkhidDay(iso);
      removeSoldierFromAllRozkhidCats(iso, soldierId, null);
      if (catKey && catKey !== 'present' && day[catKey]) {
        if (day[catKey].ids.indexOf(soldierId) === -1) {
          day[catKey].ids.push(soldierId);
          day[catKey].count = Math.max(day[catKey].count, day[catKey].ids.length);
        }
      }
      saveState();
    }

    function getSoldierPresenceOnDate(iso, soldierId) {
      var day = ensureRozkhidDay(iso);
      for (var i = 0; i < ROZKHID_CATS.length; i++) {
        var c = ROZKHID_CATS[i];
        if (day[c.key].ids.indexOf(soldierId) !== -1) return c.key;
      }
      return 'present';
    }

    function applyScheduledAndDutiesToRozkhid(iso, showFeedback) {
      var day = ensureRozkhidDay(iso);
      // 1. Заплановані відсутності на дату iso
      state.scheduledAbsences.forEach(function(sa) {
        if (!sa || !sa.soldierId || !getSoldierById(sa.soldierId)) return;
        if (iso >= sa.fromDate && iso <= (sa.toDate || sa.fromDate)) {
          if (day[sa.catKey]) {
            removeSoldierFromAllRozkhidCats(iso, sa.soldierId, sa.catKey);
            if (day[sa.catKey].ids.indexOf(sa.soldierId) === -1) {
              day[sa.catKey].ids.push(sa.soldierId);
              day[sa.catKey].count = Math.max(day[sa.catKey].count, day[sa.catKey].ids.length);
            }
          }
        }
      });

      // 2. Сьогоднішні наряди -> Н
      var todayDuties = getDutyIdsForDate(iso);
      todayDuties.forEach(function(sid) {
        removeSoldierFromAllRozkhidCats(iso, sid, 'n');
        if (day.n.ids.indexOf(sid) === -1) {
          day.n.ids.push(sid);
        }
      });
      day.n.count = Math.max(day.n.count, day.n.ids.length);

      // 3. Вчорашні наряди -> Стародобовий (якщо не заступив сьогодні знову)
      var yestDuties = getDutyIdsForDate(shiftISO(iso, -1));
      yestDuties.forEach(function(sid) {
        if (todayDuties.indexOf(sid) !== -1) return;
        removeSoldierFromAllRozkhidCats(iso, sid, 'starodob');
        if (day.starodob.ids.indexOf(sid) === -1) {
          day.starodob.ids.push(sid);
        }
      });
      day.starodob.count = Math.max(day.starodob.count, day.starodob.ids.length);

      saveState();
      if (showFeedback) {
        showToast('Автопідтягнуто наряди та заплановані відсутності');
        render();
      }
    }

    function clearRozkhidForDate(iso) {
      if (getRozkhidMode() !== 'all') { showToast('Очищати весь розхід може лише Адмін / КГ', true); return; }
      state.rozkhid[iso] = {};
      ensureRozkhidDay(iso);
      saveState();
      showToast('Розхід на ' + fmtUA(iso) + ' очищено');
      render();
    }

    function buildRozkhidText(iso) {
      var day = ensureRozkhidDay(iso);
      var total = state.personnel.length;
      var absentSum = 0;
      ROZKHID_CATS.forEach(function(c) { absentSum += (Number(day[c.key].count) || 0); });
      var present = Math.max(0, total - absentSum);

      var lines = [];
      lines.push(state.groupNumber + ', ' + fmtUA(iso));
      lines.push('З/с - ' + total);
      lines.push('Вн - ' + present);

      ROZKHID_CATS.forEach(function(c) {
        var entry = day[c.key];
        var cnt = Number(entry.count) || 0;
        if (ui.rozkhidHideZeros && cnt === 0) return;
        var line = c.label + ' - ' + cnt;
        if (ui.rozkhidShowNames && entry.ids.length > 0) {
          var surnames = entry.ids.map(function(id) {
            var s = getSoldierById(id);
            return s ? s.name.split(/\s+/)[0] : '';
          }).filter(Boolean);
          if (surnames.length) line += ' (' + surnames.join(', ') + ')';
        }
        lines.push(line);
      });
      return lines.join('\n');
    }

    // =========================================================================
    // 7. ЕКРАН ВХОДУ ЗА PIN-КОДОМ
    // =========================================================================
    function renderPinScreen() {
      var el = document.getElementById('pin-screen');
      var dots = '';
      for (var i = 0; i < 4; i++) {
        var cls = 'pin-dot' + (pinError ? ' err' : (i < pinBuffer.length ? ' filled' : ''));
        dots += '<div class="' + cls + '"></div>';
      }
      var keys = ['1','2','3','4','5','6','7','8','9','C','0','⌫'];
      var pad = keys.map(function(k) {
        var cls = 'num-key' + (k === 'C' || k === '⌫' ? ' fn' : '');
        return '<button type="button" class="' + cls + '" onclick="onPinKey(\'' + k + '\')">' + k + '</button>';
      }).join('');

      var fbNote = fbUrl
        ? '<span class="badge badge-ok">' + ico('cloud', 13) + ' База підключена</span>'
        : '<span class="badge badge-info">' + ico('phone', 13) + ' Локальний режим</span>';

      el.innerHTML =
        '<div class="pin-logo">' +
          '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>' +
          '</svg>' +
        '</div>' +
        '<div style="text-align:center">' +
          '<div style="font-size:21px;font-weight:800;color:#fff">Помічник взводу</div>' +
          '<div class="text-xs text-muted" style="margin-top:4px">Введіть ваш 4-значний PIN-код доступу</div>' +
          '<div style="margin-top:8px">' + fbNote + '</div>' +
        '</div>' +
        '<div class="pin-dots">' + dots + '</div>' +
        '<div class="text-xs" style="min-height:18px;color:' + (pinError ? '#fca5a5' : 'var(--muted)') + '">' +
          (pinError ? 'Невірний PIN-код. Спробуйте ще раз.' : 'Версія ' + APP_VERSION) +
        '</div>' +
        '<div class="numpad">' + pad + '</div>';
    }

    function onPinKey(k) {
      if (k === 'C') { pinBuffer = ''; pinError = false; renderPinScreen(); return; }
      if (k === '⌫') { pinBuffer = pinBuffer.slice(0, -1); pinError = false; renderPinScreen(); return; }
      if (pinBuffer.length >= 4) return;
      pinError = false;
      pinBuffer += k;
      renderPinScreen();
      if (pinBuffer.length === 4) {
        setTimeout(verifyPin, 120);
      }
    }

    function verifyPin() {
      var pins = state.pins || DEFAULT_PINS;
      var matched = null;
      ['admin', 'kg', 'kv1', 'kv2', 'kv3'].forEach(function(rk) {
        if (!matched && String(pins[rk] || DEFAULT_PINS[rk]) === pinBuffer) matched = rk;
      });
      if (!matched) {
        pinError = true;
        pinBuffer = '';
        renderPinScreen();
        return;
      }
      loginAsRole(matched);
    }

    function loginAsRole(role) {
      currentRole = role;
      pinBuffer = '';
      pinError = false;
      safeSSSet(SESSION_ROLE_KEY, role);
      safeLSSet(SESSION_ROLE_KEY, role);

      var meta = getRoleMeta(role);
      var rp = document.getElementById('header-role-pill');
      if (rp) {
        rp.className = 'role-pill ' + meta.cssClass;
        rp.innerHTML = ico(meta.icon || 'shield', 12) + ' ' + esc(meta.short);
      }

      document.getElementById('pin-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      updateTasksBadge();
      render();
      if (fbUrl) { fbPullAll(false, true); startPresenceTracking(); }
    }

    function logoutSession() {
      stopPresenceTracking();
      currentRole = null;
      pinBuffer = '';
      pinError = false;
      safeSSRemove(SESSION_ROLE_KEY);
      safeLSRemove(SESSION_ROLE_KEY);
      document.getElementById('app-shell').classList.add('hidden');
      document.getElementById('pin-screen').classList.remove('hidden');
      renderPinScreen();
    }

    // =========================================================================
    // 8. ВКЛАДКА 1: НАРЯДИ (ГРАФІК + ОБЛІК)
    // =========================================================================
    function renderDutiesTab() {
      var sub =
        '<div class="seg-control">' +
          '<button type="button" class="seg-btn ' + (ui.dutiesSubtab === 'calendar' ? 'active' : '') + '" onclick="ui.dutiesSubtab=\'calendar\';render()">' + ico('calendar', 14) + ' Графік</button>' +
          '<button type="button" class="seg-btn ' + (ui.dutiesSubtab === 'stats' ? 'active' : '') + '" onclick="ui.dutiesSubtab=\'stats\';render()">' + ico('chart', 14) + ' Облік</button>' +
        '</div>';

      if (ui.dutiesSubtab === 'stats') return sub + renderDutiesStats();

      // Календар місяця
      var y = ui.calYear, m = ui.calMonth;
      var firstDay = new Date(y, m, 1);
      var daysInMonth = new Date(y, m + 1, 0).getDate();
      var startDow = (firstDay.getDay() + 6) % 7; // Пн = 0
      var today = todayISO();

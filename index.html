<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1015" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Помічник взводу v3.0.3</title>
  <style>
    /* =========================================================================
       ТЕМНА ТАКТИЧНА ТЕМА (ОПТИМІЗОВАНА ПІД IPHONE SAFARI, БЕЗ ЗОВНІШНІХ CDN)
       ========================================================================= */
    :root {
      --bg: #0b1015;
      --bg-elev: #131b24;
      --card: #161f2a;
      --card-hover: #1d2836;
      --border: #263342;
      --border-strong: #35475c;
      --text: #e7eef5;
      --muted: #8b9bb0;
      --olive: #4b7a3d;
      --accent: #4ade80;
      --blue: #38bdf8;
      --amber: #f59e0b;
      --danger: #ef4444;
      --radius: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px; line-height: 1.4;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font-family: inherit; font-size: 14px; color: var(--text); }
    button { cursor: pointer; border: none; background: none; padding: 0; }
    input[type="date"] { color-scheme: dark; }

    /* Банер аварійної діагностики (щоб ніколи не було мовчазного білого екрану) */
    #fatal-error-box {
      display: none; position: fixed; inset: 12px; z-index: 9999;
      background: #2b1115; border: 2px solid #ef4444; border-radius: 14px;
      padding: 16px; color: #fecaca; overflow: auto;
    }

    /* Екран входу за PIN-кодом */
    .pin-screen {
      min-height: 100vh; max-width: 440px; margin: 0 auto;
      padding: calc(28px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    }
    .pin-logo {
      width: 60px; height: 60px; border-radius: 18px;
      background: rgba(75, 122, 61, 0.22); border: 1.5px solid rgba(74, 222, 128, 0.45);
      color: var(--accent); display: flex; align-items: center; justify-content: center;
    }
    .pin-dots { display: flex; gap: 16px; justify-content: center; margin: 4px 0; }
    .pin-dot {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid var(--border-strong); background: transparent; transition: all 0.14s ease;
    }
    .pin-dot.filled { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }
    .pin-dot.err { background: var(--danger); border-color: var(--danger); }
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 280px; }
    .num-key {
      height: 60px; border-radius: 16px; background: var(--card); border: 1px solid var(--border);
      color: #fff; font-size: 22px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; transition: background 0.1s, transform 0.08s;
    }
    .num-key:active { background: var(--card-hover); transform: scale(0.95); }
    .num-key.fn { font-size: 14px; font-weight: 700; color: var(--muted); background: var(--bg-elev); }

    /* Головна оболонка */
    .app {
      max-width: 600px; margin: 0 auto; min-height: 100vh;
      display: flex; flex-direction: column; padding-bottom: calc(82px + var(--safe-bottom));
    }
    .header {
      position: sticky; top: 0; z-index: 30;
      padding: calc(8px + var(--safe-top)) 12px 8px;
      background: rgba(11, 16, 21, 0.95);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brand-icon {
      width: 34px; height: 34px; border-radius: 10px;
      background: rgba(75, 122, 61, 0.22); border: 1px solid rgba(74, 222, 128, 0.35);
      color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .brand-title { font-size: 14.5px; font-weight: 800; color: #fff; line-height: 1.15; white-space: nowrap; }
    .header-meta { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
    .role-pill {
      font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px;
      background: rgba(234, 179, 8, 0.16); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.35); white-space: nowrap;
    }
    .role-pill.kv { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.35); }
    .sync-pill {
      font-size: 11px; font-weight: 700; padding: 5px 9px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; min-height: 32px;
    }
    .sync-pill.online { border-color: rgba(74, 222, 128, 0.4); color: #86efac; }
    .sync-pill.offline { border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
    .sync-pill.syncing { border-color: rgba(56, 189, 248, 0.45); color: #7dd3fc; }

    .main { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }

    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      background: rgba(19, 27, 36, 0.96);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border); padding-bottom: var(--safe-bottom);
    }
    .nav-inner { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: 64px; }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; font-size: 10.5px; font-weight: 700; color: var(--muted); min-height: 44px;
    }
    .nav-btn.active { color: var(--accent); }

    /* Картки та утиліти */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .card-flush { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .stack-sm { display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .wrap { flex-wrap: wrap; }
    .min0 { min-width: 0; flex: 1; }
    .text-xs { font-size: 12px; }
    .text-sm { font-size: 13.5px; }
    .text-muted { color: var(--muted); }
    .fw-bold { font-weight: 700; }
    .fw-800 { font-weight: 800; }
    .section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; }
    .empty-state { text-align: center; padding: 20px 12px; color: var(--muted); font-size: 13.5px; }
    .info-banner {
      padding: 9px 12px; border-radius: 11px; font-size: 12px; color: #bae6fd;
      background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* Кнопки та поля вводу (touch-friendly 44px+) */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 44px; padding: 9px 14px; border-radius: 11px;
      font-weight: 700; font-size: 13.5px; text-align: center; transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-sm { min-height: 38px; padding: 6px 11px; font-size: 12px; border-radius: 9px; }
    .btn-xs { min-height: 32px; padding: 4px 9px; font-size: 11.5px; border-radius: 8px; }
    .btn-full { width: 100%; }
    .btn-primary { background: var(--olive); color: #fff; }
    .btn-secondary { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); }
    .btn-info { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.35); }
    .btn-warn { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }

    .btn-icon {
      width: 42px; height: 42px; border-radius: 10px; background: var(--bg-elev);
      border: 1px solid var(--border); color: var(--text);
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px;
    }
    .btn-icon-sm { width: 34px; height: 34px; border-radius: 9px; font-size: 13px; }
    .btn-icon.danger { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.3); color: #f87171; }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field-label { font-size: 12px; font-weight: 700; color: var(--muted); }
    .input, .select, .textarea {
      width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border); color: #fff; outline: none;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); }
    .textarea { min-height: 82px; resize: vertical; }
    .chips-wrap { display: flex; flex-wrap: wrap; gap: 6px; }

    /* Фільтри, вкладки, бейджі */
    .seg-control {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
      background: var(--card); border: 1px solid var(--border); padding: 4px; border-radius: 12px;
    }
    .seg-btn { min-height: 38px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--muted); }
    .seg-btn.active { background: var(--olive); color: #fff; }

    .pills-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .pills-scroll::-webkit-scrollbar { display: none; }
    .pill {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
      min-height: 36px; padding: 6px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 700; background: var(--card); border: 1px solid var(--border); color: var(--muted);
    }
    .pill.active { background: var(--olive); border-color: var(--olive); color: #fff; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .badge {
      display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px;
      border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .badge-kg { background: rgba(234, 179, 8, 0.2); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.4); }
    .badge-kv { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-ok { background: rgba(74, 222, 128, 0.16); color: #86efac; border: 1px solid rgba(74, 222, 128, 0.3); }
    .badge-info { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-warn { background: rgba(245, 158, 11, 0.18); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35); }
    .badge-err { background: rgba(239, 68, 68, 0.18); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }

    /* Календар */
    .date-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 6px;
    }
    .date-bar-title { font-size: 14px; font-weight: 800; color: #fff; text-align: center; flex: 1; }
    .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-bottom: 6px; }
    .cal-weekdays div { font-size: 11px; font-weight: 700; color: var(--muted); }
    .cal-weekdays .wknd { color: #fbbf24; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-cell {
      height: 46px; border-radius: 9px; border: 1px solid transparent;
      background: rgba(11, 16, 21, 0.55); color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 5px 2px;
    }
    .cal-cell.today { border-color: rgba(74, 222, 128, 0.55); }
    .cal-cell.selected { background: rgba(75, 122, 61, 0.38); border-color: var(--accent); color: #fff; }
    .cal-num { font-size: 12.5px; font-weight: 700; line-height: 1; }
    .cal-dots { display: flex; gap: 2px; height: 6px; align-items: center; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; }

    /* Акордеони, склад, статуси присутності */
    .acc-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      min-height: 48px; padding: 10px 12px; background: rgba(11, 16, 21, 0.55); cursor: pointer; user-select: none;
    }
    .chevron { display: inline-block; transition: transform 0.18s; color: var(--muted); flex-shrink: 0; font-size: 13px; }
    .acc-header.open .chevron { transform: rotate(90deg); color: #fff; }
    .acc-body { border-top: 1px solid var(--border); }
    .soldier-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--bg); }
    .soldier-name { font-size: 14px; font-weight: 700; color: #fff; }

    .presence-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .presence-btn {
      min-height: 38px; padding: 6px 8px; border-radius: 9px; font-size: 12px; font-weight: 700;
      background: var(--card); border: 1px solid var(--border); color: var(--muted); text-align: center;
    }
    .presence-btn.active-ok { background: rgba(74, 222, 128, 0.2); border-color: var(--accent); color: #86efac; }
    .presence-btn.active-warn { background: rgba(245, 158, 11, 0.22); border-color: var(--amber); color: #fde68a; }

    /* Задачі */
    .task-card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 13px; display: flex; flex-direction: column; gap: 10px;
    }
    .status-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .status-btn {
      min-height: 38px; padding: 6px 4px; border-radius: 9px; font-size: 11.5px; font-weight: 700;
      background: var(--bg); border: 1px solid var(--border); color: var(--muted); text-align: center;
    }
    .status-btn.st-received { background: rgba(56, 189, 248, 0.2); border-color: var(--blue); color: #7dd3fc; }
    .status-btn.st-done { background: rgba(34, 197, 94, 0.22); border-color: #22c55e; color: #86efac; }
    .status-btn.st-failed { background: rgba(239, 68, 68, 0.22); border-color: var(--danger); color: #fca5a5; }

    /* Розхід, KPI, прев'ю */
    .kpi-box { background: var(--bg); border: 1px solid var(--border); border-radius: 11px; padding: 10px; text-align: center; }
    .kpi-val { font-size: 20px; font-weight: 800; color: #fff; }
    .kpi-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .rozkhid-row {
      display: flex; flex-direction: column; gap: 6px; padding: 9px 10px;
      border-radius: 11px; background: var(--bg); border: 1px solid var(--border);
    }
    .rozkhid-row.has-count { border-color: rgba(245, 158, 11, 0.45); }
    .stepper { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .step-btn {
      width: 34px; height: 34px; border-radius: 8px; background: var(--card);
      border: 1px solid var(--border); color: #fff; font-size: 17px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .step-val { min-width: 24px; text-align: center; font-weight: 800; font-size: 14px; }
    .name-chip {
      display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 6px;
      font-size: 11px; font-weight: 600; background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.3); color: #fde68a;
    }
    .sched-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border);
    }
    .preview-pre {
      margin: 0; padding: 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px; white-space: pre-wrap; word-break: break-word; line-height: 1.48;
    }
    .toggle-pill {
      display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 10px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .toggle-pill input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
    .checkbox-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      min-height: 48px; padding: 10px 12px; background: var(--bg); border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .checkbox-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); flex-shrink: 0; }

    /* Діагностика Firebase */
    .diag-box {
      padding: 9px 11px; border-radius: 10px; font-size: 12px; line-height: 1.4; word-break: break-word;
    }
    .diag-ok { background: rgba(74, 222, 128, 0.14); border: 1px solid rgba(74, 222, 128, 0.4); color: #bbf7d0; }
    .diag-err { background: rgba(239, 68, 68, 0.18); border: 1px solid rgba(239, 68, 68, 0.45); color: #fecaca; }
    .diag-info { background: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.4); color: #bae6fd; }

    /* Модальні вікна, Toast, кольори */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.78);
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    @media (min-width: 520px) { .modal-backdrop { align-items: center; padding: 16px; } }
    .modal-box {
      width: 100%; max-width: 540px; max-height: 92vh; background: var(--card);
      border: 1px solid var(--border); border-radius: 18px 18px 0 0;
      display: flex; flex-direction: column; overflow: hidden; padding-bottom: var(--safe-bottom);
    }
    @media (min-width: 520px) { .modal-box { border-radius: 18px; padding-bottom: 0; } }
    .modal-header {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0;
    }
    .modal-title { font-size: 16px; font-weight: 800; color: #fff; }
    .modal-body { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

    .toast-root {
      position: fixed; top: calc(62px + var(--safe-top)); left: 50%; transform: translateX(-50%);
      z-index: 60; width: 92%; max-width: 390px; pointer-events: none; display: flex; flex-direction: column; gap: 6px;
    }
    .toast {
      padding: 10px 14px; border-radius: 11px; text-align: center; font-size: 13px; font-weight: 700;
      color: #fff; background: #1b2836; border: 1px solid rgba(74, 222, 128, 0.55); box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .toast.error { background: #3a171c; border-color: rgba(239, 68, 68, 0.65); color: #fecaca; }

    .color-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .color-swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; }
    .color-swatch.selected { border-color: #fff; transform: scale(1.1); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Видимий блок критичних помилок (захист від білого екрану) -->
  <div id="fatal-error-box"></div>

  <!-- Екран входу за PIN-кодом -->
  <div id="pin-screen" class="pin-screen hidden"></div>

  <!-- Основний інтерфейс застосунку -->
  <div id="app-shell" class="app hidden">
    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <div class="min0">
          <div class="brand-title">Помічник взводу</div>
          <div class="header-meta">
            <span id="header-role-pill" class="role-pill">★ Адмін</span>
          </div>
        </div>
      </div>
      <div class="row" style="gap:6px;flex-shrink:0">
        <button id="header-sync-pill" class="sync-pill" onclick="manualSyncFromHeader()" title="Оновити з хмари">⚪ Локально</button>
        <button class="btn-icon btn-icon-sm" onclick="logoutSession()" title="Вийти / Змінити PIN" aria-label="Вийти">

  <script>
    // =========================================================================
    // 0. ГЛОБАЛЬНИЙ ЗАХИСТ ВІД БІЛОГО ЕКРАНУ (RUNTIME ERROR HANDLER)
    // =========================================================================
    function showFatalError(msg) {
      var box = document.getElementById('fatal-error-box');
      if (!box) return;
      box.style.display = 'block';
      box.innerHTML =
        '<div style="font-size:16px;font-weight:800;margin-bottom:8px">Помилка запуску Помічника взводу</div>' +
        '<div style="font-size:13px;font-family:monospace;white-space:pre-wrap;margin-bottom:14px">' + String(msg || 'Невідома помилка') + '</div>' +
        '<button type="button" onclick="location.reload()" style="padding:10px 14px;border-radius:10px;background:#ef4444;color:#fff;font-weight:700">Перезавантажити сторінку</button>';
    }
    window.onerror = function(message, source, lineno, colno) {
      showFatalError(message + (lineno ? (' (рядок ' + lineno + ':' + colno + ')') : ''));
      return false;
    };
    window.onunhandledrejection = function(ev) {
      var r = ev && ev.reason ? (ev.reason.message || String(ev.reason)) : 'Unhandled promise rejection';
      showFatalError(r);
    };

    // =========================================================================
    // 1. КОНСТАНТИ ТА ДОВІДНИКИ
    // =========================================================================
    var APP_VERSION = 'v3.0.3';
    var APP_UPDATED = '20.11.2026';
    var STORAGE_KEY = 'pomichnyk_vzvodu_v30';
    var FB_URL_STORAGE_KEY = 'pomichnyk_vzvodu_fb_url';
    var SESSION_ROLE_KEY = 'pomichnyk_vzvodu_role';
    var LEGACY_KEYS = [
      'pomichnyk_vzvodu_v27', 'pomichnyk_vzvodu_v3', 'pomichnyk_vzvodu_data',
      'pomichnyk_vzvodu_v2', 'pomichnyk_vzvodu_v1', 'platoon_helper_state', 'platoon_duty_tracker_v1'
    ];

    var MONTHS_UK = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
    var MONTHS_GEN = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
    var WEEKDAYS_UK = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
    var PALETTE = ['#eab308','#3b82f6','#10b981','#f97316','#ef4444','#38bdf8','#a855f7','#ec4899'];
    var QUICK_RANKS = ['солдат', 'ст. солдат', 'мол. сержант', 'сержант'];

    var DEFAULT_SQUADS = [
      { id: 'cmd', name: 'Командир групи', color: '#eab308', isCmdGroup: true },
      { id: 'sq1', name: '1-ше відділення', color: '#3b82f6', isCmdGroup: false },
      { id: 'sq2', name: '2-ге відділення', color: '#10b981', isCmdGroup: false },
      { id: 'sq3', name: '3-тє відділення', color: '#f97316', isCmdGroup: false }
    ];

    var DEFAULT_DUTY_TYPES = [
      { id: 'chk', shortName: 'ЧК', name: 'Черговий курсу', maxCount: 1, color: '#ef4444' },
      { id: 'dn', shortName: 'Дн', name: 'Днювальні курсу', maxCount: 3, color: '#38bdf8' }
    ];

    var DEFAULT_PINS = { admin: '1111', sq1: '1001', sq2: '2002', sq3: '3003' };

    var ROZKHID_CATS = [
      { key: 'priyom_shpytal', label: 'Прийом шпиталь', hint: 'Прийом у шпиталі', schedulable: true, kvEditable: true },
      { key: 'priyom_lazaret', label: 'Прийом лазарет', hint: 'Прийом у лазареті', schedulable: true, kvEditable: true },
      { key: 'sh', label: 'Ш', hint: 'Шпиталь', schedulable: true, kvEditable: true },
      { key: 'l', label: 'Л', hint: 'Лазарет', schedulable: true, kvEditable: true },
      { key: 'vd', label: 'Вд', hint: 'Відрядження', schedulable: true, kvEditable: true },
      { key: 'vp', label: 'Вп', hint: 'Відпустка', schedulable: true, kvEditable: true },
      { key: 'n', label: 'Н', hint: 'Наряд (авто)', schedulable: false, kvEditable: false },
      { key: 'g', label: 'Г', hint: 'Гуртожиток', schedulable: true, kvEditable: true },
      { key: 'pk', label: 'Пк', hint: 'Поза казармою', schedulable: true, kvEditable: true },
      { key: 'hv', label: 'Хв', hint: 'Хворий', schedulable: true, kvEditable: true },
      { key: 'starodobovyi', label: 'Стародобовий', hint: 'Вчорашній наряд (авто)', schedulable: false, kvEditable: false }
    ];

    var PRESENCE_STATUSES = [
      { key: 'in_service', shortLabel: 'В строю', fullLabel: 'В строю', isOk: true },
      { key: 'sh', shortLabel: 'Ш', fullLabel: 'Ш (Шпиталь)', isOk: false },
      { key: 'l', shortLabel: 'Л', fullLabel: 'Л (Лазарет)', isOk: false },
      { key: 'vd', shortLabel: 'Вд', fullLabel: 'Вд (Відрядження)', isOk: false },
      { key: 'vp', shortLabel: 'Вп', fullLabel: 'Вп (Відпустка)', isOk: false },
      { key: 'g', shortLabel: 'Г', fullLabel: 'Г (Гуртожиток)', isOk: false },
      { key: 'pk', shortLabel: 'Пк', fullLabel: 'Пк (Поза казармою)', isOk: false },
      { key: 'hv', shortLabel: 'Хв', fullLabel: 'Хв (Хворий)', isOk: false }
    ];
    var PERM_ABSENT_KEYS = { sh: true, l: true, vd: true, vp: true, g: true, pk: true, hv: true };

    // =========================================================================
    // 2. БАЗОВІ УТИЛІТИ ДАТ, ТЕКСТУ, РОЛЕЙ ТА СХОВИЩА
    // =========================================================================
    function pad2(n) { return String(n).padStart(2, '0'); }
    function toISO(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
    function todayISO() { return toISO(new Date()); }
    function monthPrefix(y, m) { return y + '-' + pad2(m + 1); }

    function addDaysISO(iso, delta) {
      var p = String(iso || todayISO()).split('-').map(Number);
      var dt = new Date(p[0], (p[1] || 1) - 1, (p[2] || 1) + delta);
      return toISO(dt);
    }

    function formatDotDate(iso) {
      if (!iso) return '';
      var p = String(iso).split('-');
      return p.length === 3 ? (p[2] + '.' + p[1] + '.' + p[0]) : iso;
    }

    function formatDayMonth(iso) {
      if (!iso) return '';
      var p = String(iso).split('-');
      return p.length === 3 ? (p[2] + '.' + p[1]) : iso;
    }

    function formatHumanDate(iso) {
      if (!iso) return '';
      var p = String(iso).split('-').map(Number);
      return p.length === 3 ? (p[2] + ' ' + MONTHS_GEN[(p[1] || 1) - 1] + ' ' + p[0]) : iso;
    }

    function formatDateTimeNow() {
      var d = new Date();
      return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function genId(prefix) {
      return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    }

    function capitalizePIB(val) {
      return String(val || '').replace(/(^|\s|-)([a-zа-яіїєґ])/gi, function(m, sep, ch) {
        return sep + ch.toUpperCase();
      });
    }

    function cloneDefaults(arr) {
      return arr.map(function(item) { return Object.assign({}, item); });
    }

    function createFreshState() {
      return {
        groupNumber: '223',
        squads: cloneDefaults(DEFAULT_SQUADS),
        dutyTypes: cloneDefaults(DEFAULT_DUTY_TYPES),
        pins: Object.assign({}, DEFAULT_PINS),
        personnel: [],
        duties: [],
        tasks: [],
        scheduledAbsences: [],
        rozkhidManual: {},
        rozkhidNumeric: {},
        rozkhidCleared: {},
        lastBackupAt: '',
        updatedAt: 0
      };
    }

    function normalizeState(raw) {
      var base = createFreshState();
      if (!raw || typeof raw !== 'object') return base;
      base.groupNumber = String(raw.groupNumber || '223').trim() || '223';
      base.squads = (Array.isArray(raw.squads) && raw.squads.length) ? raw.squads : cloneDefaults(DEFAULT_SQUADS);
      base.dutyTypes = (Array.isArray(raw.dutyTypes) && raw.dutyTypes.length) ? raw.dutyTypes.map(function(dt) {
        return {
          id: String(dt.id || genId('dt')),
          shortName: String(dt.shortName || dt.name || 'Н'),
          name: String(dt.name || dt.shortName || 'Наряд'),
          maxCount: Math.max(1, Number(dt.maxCount) || 1),
          color: String(dt.color || '#38bdf8')
        };
      }) : cloneDefaults(DEFAULT_DUTY_TYPES);
      base.pins = (raw.pins && typeof raw.pins === 'object') ? Object.assign({}, DEFAULT_PINS, raw.pins) : Object.assign({}, DEFAULT_PINS);
      base.personnel = Array.isArray(raw.personnel) ? raw.personnel.filter(function(p) { return p && p.id && p.fullName; }).map(function(p) {
        return {
          id: String(p.id),
          fullName: String(p.fullName),
          rank: String(p.rank || ''),
          squadId: String(p.squadId || 'sq1'),
          isLeader: Boolean(p.isLeader),
          presenceStatus: String(p.presenceStatus || 'in_service')
        };
      }) : [];
      base.duties = Array.isArray(raw.duties) ? raw.duties.filter(function(d) { return d && d.date && d.soldierId; }).map(function(d) {
        return {
          id: String(d.id || genId('d')),
          date: String(d.date),
          soldierId: String(d.soldierId),
          dutyTypeId: String(d.dutyTypeId || (base.dutyTypes[0] ? base.dutyTypes[0].id : 'chk'))
        };
      }) : [];
      base.tasks = Array.isArray(raw.tasks) ? raw.tasks.filter(function(t) { return t && t.text; }).map(function(t) {
        return {
          id: String(t.id || genId('task')),
          recipientType: t.recipientType === 'all_leaders' ? 'all_leaders' : 'squad',
          squadId: String(t.squadId || ''),
          text: String(t.text),
          author: String(t.author || ''),
          status: (t.status === 'done' || t.status === 'failed') ? t.status : 'received',
          remark: String(t.remark || ''),
          createdAt: String(t.createdAt || '')
        };
      }) : [];
      base.scheduledAbsences = Array.isArray(raw.scheduledAbsences) ? raw.scheduledAbsences.filter(function(a) { return a && a.soldierId && a.startDate; }).map(function(a) {
        return {
          id: String(a.id || genId('sched')),
          soldierId: String(a.soldierId),
          category: String(a.category || 'priyom_shpytal'),
          startDate: String(a.startDate),
          endDate: String(a.endDate || ''),
          note: String(a.note || '')
        };
      }) : [];
      base.rozkhidManual = (raw.rozkhidManual && typeof raw.rozkhidManual === 'object') ? raw.rozkhidManual : {};
      base.rozkhidNumeric = (raw.rozkhidNumeric && typeof raw.rozkhidNumeric === 'object') ? raw.rozkhidNumeric : {};
      base.rozkhidCleared = (raw.rozkhidCleared && typeof raw.rozkhidCleared === 'object') ? raw.rozkhidCleared : {};
      base.lastBackupAt = String(raw.lastBackupAt || '');
      base.updatedAt = Number(raw.updatedAt || 0);
      return base;
    }

    function saveLocalState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function loadLocalState() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          state = normalizeState(JSON.parse(raw));
          return;
        }
        // Безпечна міграція зі старих версій
        for (var i = 0; i < LEGACY_KEYS.length; i++) {
          var legacy = localStorage.getItem(LEGACY_KEYS[i]);
          if (legacy) {
            state = normalizeState(JSON.parse(legacy));
            saveLocalState();
            return;
          }
        }
      } catch (e) {}
      state = createFreshState();
    }

    // =========================================================================
    // 3. ГЛОБАЛЬНИЙ СТАН ТА ФУНКЦІЇ ПОШУКУ / СОРТУВАННЯ
    // =========================================================================
    var nowInit = new Date();
    var state = createFreshState();
    var sessionRole = null; // 'admin' | 'sq1' | 'sq2' | 'sq3' | null
    var pinEntry = '';
    var pinRemember = true;
    var pinError = false;

    var syncStatus = 'local'; // 'local' | 'syncing' | 'online' | 'offline'
    var fbPollTimer = null;
    var fbPushDebounce = null;
    var lastSyncAt = '';
    var lastSyncDiag = null; // { type: 'ok' | 'err' | 'info', text: string }

    var ui = {
      activeTab: 'duties',
      dutiesSubTab: 'schedule',
      year: nowInit.getFullYear(),
      month: nowInit.getMonth(),
      selectedDate: toISO(nowInit),
      scheduleSquadFilter: 'all',
      taskRecipientFilter: 'all',
      taskStatusFilter: 'all',
      openTaskRemarks: {},
      rozkhidDate: toISO(nowInit),
      rozkhidShowNames: true,
      rozkhidHideZeros: false,
      rozkhidUpcomingOpen: true,
      rozkhidModalCat: '',
      rozkhidModalSearch: '',
      rozkhidModalOpenSquads: {},
      personnelSearch: '',
      personnelSquadFilter: 'all',
      openPersonnelSquads: { cmd: true, sq1: true, sq2: true, sq3: true },
      openSoldiers: {}
    };

    var assignModal = { date: '', dutyTypeId: '', selectedIds: [] };
    var tempColor = '#3b82f6';

    function isAdmin() { return sessionRole === 'admin'; }
    function mySquadId() { return isAdmin() ? null : sessionRole; }
    function getRoleLabel(role) {
      if (role === 'admin') return '★ Адмін';
      if (role === 'sq1') return 'КВ 1-го відд.';
      if (role === 'sq2') return 'КВ 2-го відд.';
      if (role === 'sq3') return 'КВ 3-го відд.';
      return 'Гість';
    }
    function canEditSoldier(s) {
      if (!s) return false;
      return isAdmin() || s.squadId === mySquadId();
    }

    function isCmdGroup(sq) {
      return Boolean(sq && (sq.isCmdGroup || sq.id === 'cmd' || /командир\s+групи/i.test(sq.name || '')));
    }

    function getOrderedSquads() {
      var order = { cmd: 0, sq1: 1, sq2: 2, sq3: 3 };
      return state.squads.slice().sort(function(a, b) {
        var oa = isCmdGroup(a) ? 0 : (order[a.id] !== undefined ? order[a.id] : 10);
        var ob = isCmdGroup(b) ? 0 : (order[b.id] !== undefined ? order[b.id] : 10);
        if (oa !== ob) return oa - ob;
        return String(a.name || '').localeCompare(String(b.name || ''), 'uk');
      });
    }

    function getSquadById(id) {
      return state.squads.find(function(sq) { return sq.id === id; }) || { id: id || '', name: 'Без відділення', color: '#8b9bb0', isCmdGroup: false };
    }

    function getSoldierById(id) {
      return state.personnel.find(function(p) { return p.id === id; }) || null;
    }

    function getDutyTypeById(id) {
      return state.dutyTypes.find(function(dt) { return dt.id === id; }) || { id: id || '', shortName: 'Н', name: 'Наряд', maxCount: 1, color: '#38bdf8' };
    }

    function getRozkhidCat(key) {
      return ROZKHID_CATS.find(function(c) { return c.key === key; }) || { key: key, label: key, hint: '', schedulable: true, kvEditable: true };
    }

    function getPresenceMeta(key) {
      return PRESENCE_STATUSES.find(function(p) { return p.key === key; }) || PRESENCE_STATUSES[0];
    }

    function sortSquadPersonnel(list) {
      return list.slice().sort(function(a, b) {
        if (Boolean(a.isLeader) !== Boolean(b.isLeader)) return a.isLeader ? -1 : 1;
        return String(a.fullName || '').localeCompare(String(b.fullName || ''), 'uk');
      });
    }

    function formatSquadRecipient(sq) {
      if (!sq) return 'Командиру відділення';
      if (sq.id === 'sq1' || /^1/.test(sq.name)) return 'Командиру 1-го відділення';
      if (sq.id === 'sq2' || /^2/.test(sq.name)) return 'Командиру 2-го відділення';
      if (sq.id === 'sq3' || /^3/.test(sq.name)) return 'Командиру 3-го відділення';
      return 'Командиру (' + sq.name + ')';
    }

    function formatSquadShortTab(sq) {
      if (!sq) return '';
      if (isCmdGroup(sq)) return 'КГ';
      if (sq.id === 'sq1' || /^1/.test(sq.name)) return '1 відд.';
      if (sq.id === 'sq2' || /^2/.test(sq.name)) return '2 відд.';
      if (sq.id === 'sq3' || /^3/.test(sq.name)) return '3 відд.';
      return sq.name;
    }

    function getSoldierDutyStats(soldierId, year, month) {
      var pref = monthPrefix(year, month);
      var monthCount = 0, totalCount = 0, lastDate = '';
      state.duties.forEach(function(d) {
        if (d.soldierId !== soldierId) return;
        totalCount++;
        if (d.date && d.date.indexOf(pref) === 0) monthCount++;
        if (d.date && (!lastDate || d.date > lastDate)) lastDate = d.date;
      });
      return { monthCount: monthCount, totalCount: totalCount, lastDate: lastDate };
    }

    function getUpcomingAbsencesForSoldier(soldierId) {
      var td = todayISO();
      return state.scheduledAbsences
        .filter(function(a) { return a.soldierId === soldierId && (a.endDate || a.startDate) >= td; })
        .sort(function(a, b) { return a.startDate.localeCompare(b.startDate); });
    }

    // =========================================================================
    // 4. FIREBASE REALTIME DATABASE SYNC (НАДІЙНИЙ REST API + ДІАГНОСТИКА)
    // =========================================================================
    function normalizeFbUrl(raw) {
      var s = String(raw || '').trim();
      if (!s) return '';
      // Витягуємо перше коректне посилання Firebase (захист від дублів, Https://, ](, .json, пробілів)
      var match = s.match(/https?:\/\/[a-z0-9\-._]+\.(?:firebasedatabase\.app|firebaseio\.com)/i);
      if (match && match[0]) {
        return match[0].replace(/^https?:\/\//i, 'https://').replace(/\/+$/, '');
      }
      if (s.indexOf('](') !== -1) s = s.split('](')[0];
      s = s.replace(/\s+/g, '').replace(/^https?:\/\//i, 'https://');
      s = s.replace(/\/(platoon_data|test_ping)\.json$/i, '').replace(/\.json$/i, '').replace(/\/+$/, '');
      return s;
    }

    function getFirebaseUrl() {
      try { return normalizeFbUrl(localStorage.getItem(FB_URL_STORAGE_KEY)); } catch (e) { return ''; }
    }

    function setFirebaseUrl(url) {
      var clean = normalizeFbUrl(url);
      try {
        if (clean) localStorage.setItem(FB_URL_STORAGE_KEY, clean);
        else localStorage.removeItem(FB_URL_STORAGE_KEY);
      } catch (e) {}
      return clean;
    }

    function initFirebaseUrlFromQuery() {
      try {
        var params = new URLSearchParams(window.location.search);
        var q = normalizeFbUrl(params.get('fb') || params.get('db'));
        if (q && q.indexOf('https://') === 0) setFirebaseUrl(q);
      } catch (e) {}
    }

    function getPlatoonEndpoint(url) {
      var base = normalizeFbUrl(url || getFirebaseUrl());
      return base ? (base + '/platoon_data.json') : '';
    }

    function setDiag(type, text) {
      lastSyncDiag = text ? { type: type, text: text } : null;
    }

    function setSyncStatus(st) {
      syncStatus = st;
      updateSyncPillUI();
    }

    function updateSyncPillUI() {
      var el = document.getElementById('header-sync-pill');
      if (!el) return;
      el.className = 'sync-pill ' + (syncStatus === 'online' ? 'online' : (syncStatus === 'offline' ? 'offline' : (syncStatus === 'syncing' ? 'syncing' : '')));
      if (syncStatus === 'online') el.textContent = '🟢 Онлайн';
      else if (syncStatus === 'syncing') el.textContent = '🔄 Синхр...';
      else if (syncStatus === 'offline') el.textContent = '🔴 Офлайн';
      else el.textContent = '⚪ Локально';
    }

    // Глибоке очищення ключів та значень під суворі правила Firebase
    function sanitizeForFirebase(val) {
      if (val === undefined) return null;
      if (typeof val === 'number' && isNaN(val)) return null;
      if (val === null || typeof val !== 'object') return val;
      if (Array.isArray(val)) return val.map(sanitizeForFirebase);
      var out = {};
      Object.keys(val).forEach(function(k) {
        var safeKey = String(k).replace(/[.#$\[\]\/]/g, '_');
        if (!safeKey) safeKey = '_empty';
        out[safeKey] = sanitizeForFirebase(val[k]);
      });
      return out;
    }

    function parseFirebaseError(res) {
      return res.text().then(function(txt) {
        var msg = '';
        try {
          var parsed = JSON.parse(txt);
          if (parsed && parsed.error) msg = String(parsed.error);
        } catch (e) {
          msg = txt ? txt.slice(0, 140) : '';
        }
        var hint = (res.status === 401 || res.status === 403) ? ' — відкрийте Rules у Firebase і натисніть Publish' : '';
        return 'HTTP ' + res.status + (msg ? ': ' + msg : '') + hint;
      }).catch(function() { return 'HTTP ' + res.status; });
    }

    function objMapToArray(obj) {
      if (!obj || typeof obj !== 'object') return [];
      if (Array.isArray(obj)) return obj.filter(Boolean);
      return Object.keys(obj).map(function(k) {
        var v = obj[k];
        return (v && typeof v === 'object') ? Object.assign({ id: k }, v) : null;
      }).filter(Boolean);
    }

    function arrayToObjMap(arr) {
      var out = {};
      (arr || []).forEach(function(item) { if (item && item.id) out[item.id] = item; });
      return out;
    }

    function buildCloudPayload() {
      state.updatedAt = Date.now();
      saveLocalState();
      return sanitizeForFirebase({
        updatedAt: state.updatedAt,
        meta: {
          groupNumber: state.groupNumber,
          squads: state.squads,
          dutyTypes: state.dutyTypes,
          updatedAt: state.updatedAt
        },
        pins: state.pins,
        personnel: arrayToObjMap(state.personnel),
        duties: arrayToObjMap(state.duties),
        tasks: arrayToObjMap(state.tasks),
        scheduledAbsences: arrayToObjMap(state.scheduledAbsences),
        rozkhidManual: state.rozkhidManual,
        rozkhidNumeric: state.rozkhidNumeric,
        rozkhidCleared: state.rozkhidCleared
      });
    }

    function applyRemoteSnapshot(remote, forceApply) {
      if (!remote || typeof remote !== 'object') return false;
      var hasData = remote.meta || remote.personnel || remote.duties || remote.tasks || remote.pins || remote.rozkhidManual;
      if (!hasData) return false;

      var remoteTs = Number(remote.updatedAt || (remote.meta && remote.meta.updatedAt) || 0);
      if (!forceApply && remoteTs && state.updatedAt && remoteTs <= state.updatedAt) return false;

      var meta = remote.meta || {};
      var next = {
        groupNumber: meta.groupNumber || state.groupNumber || '223',
        squads: (Array.isArray(meta.squads) && meta.squads.length) ? meta.squads : state.squads,
        dutyTypes: (Array.isArray(meta.dutyTypes) && meta.dutyTypes.length) ? meta.dutyTypes : state.dutyTypes,
        pins: remote.pins ? Object.assign({}, DEFAULT_PINS, remote.pins) : state.pins,
        personnel: objMapToArray(remote.personnel),
        duties: objMapToArray(remote.duties),
        tasks: objMapToArray(remote.tasks).sort(function(a, b) { return String(b.id).localeCompare(String(a.id)); }),
        scheduledAbsences: objMapToArray(remote.scheduledAbsences),
        rozkhidManual: (remote.rozkhidManual && typeof remote.rozkhidManual === 'object') ? remote.rozkhidManual : {},
        rozkhidNumeric: (remote.rozkhidNumeric && typeof remote.rozkhidNumeric === 'object') ? remote.rozkhidNumeric : {},
        rozkhidCleared: (remote.rozkhidCleared && typeof remote.rozkhidCleared === 'object') ? remote.rozkhidCleared : {},
        lastBackupAt: state.lastBackupAt,
        updatedAt: remoteTs || Date.now()
      };
      state = normalizeState(next);
      saveLocalState();
      return true;
    }

    function isUserActivelyEditing() {
      var modal = document.getElementById('modal-root');
      if (modal && modal.classList.contains('open')) return true;
      var ae = document.activeElement;
      if (!ae) return false;
      return ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT';
    }

    function scheduleCloudPush() {
      state.updatedAt = Date.now();
      saveLocalState();
      if (!getFirebaseUrl()) { setSyncStatus('local'); return; }
      clearTimeout(fbPushDebounce);
      fbPushDebounce = setTimeout(function() { fbPushAll(true); }, 800);
    }

    function fbPullAll(silent, forceApply) {
      var endpoint = getPlatoonEndpoint();
      if (!endpoint) { setSyncStatus('local'); return Promise.resolve({ ok: false, error: 'Не вказано посилання Firebase' }); }
      if (!silent) setSyncStatus('syncing');
      return fetch(endpoint)
        .then(function(res) {
          if (!res.ok) return parseFirebaseError(res).then(function(e) { throw new Error(e); });
          return res.json().then(function(data) { return { status: res.status, data: data }; });
        })
        .then(function(result) {
          lastSyncAt = formatDateTimeNow();
          setSyncStatus('online');
          if (!silent) setDiag('ok', '✅ Отримано з хмари (HTTP ' + result.status + ')');
          var updated = applyRemoteSnapshot(result.data, Boolean(forceApply));
          if (updated && sessionRole && !isUserActivelyEditing()) render();
          return { ok: true, status: result.status, data: result.data };
        })
        .catch(function(err) {
          var msg = (err && err.message) ? err.message : 'Помилка мережі (Failed to fetch)';
          setSyncStatus('offline');
          if (!silent) {
            setDiag('err', '❌ Помилка читання: ' + msg);
            if (sessionRole && ui.activeTab === 'settings') render();
          }
          return { ok: false, error: msg };
        });
    }

    function fbPushAll(silent) {
      var endpoint = getPlatoonEndpoint();
      if (!endpoint) {
        var msg = 'Спочатку вставте посилання Firebase';
        if (!silent) { setDiag('err', '❌ ' + msg); showToast(msg, 'error'); }
        return Promise.resolve({ ok: false, error: msg });
      }
      if (!silent) setSyncStatus('syncing');
      var payload = buildCloudPayload();
      return fetch(endpoint, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then(function(res) {
          if (!res.ok) return parseFirebaseError(res).then(function(e) { throw new Error(e); });
          return res.json().then(function() { return res.status; });
        })
        .then(function(status) {
          lastSyncAt = formatDateTimeNow();
          setSyncStatus('online');
          setDiag('ok', '✅ Завантажено в хмару (HTTP ' + status + ')');
          if (!silent && sessionRole && ui.activeTab === 'settings') render();
          return { ok: true, status: status };
        })
        .catch(function(err) {
          var msg = (err && err.message) ? err.message : 'Помилка мережі при записі (Failed to fetch)';
          setSyncStatus('offline');
          setDiag('err', '❌ Помилка запису (' + msg + ')');
          if (sessionRole && ui.activeTab === 'settings') render();
          return { ok: false, error: msg };
        });
    }

    function fbTestWrite() {
      var base = getFirebaseUrl();
      if (!base) {
        var msg = 'Спочатку вставте та підключіть посилання Firebase';
        setDiag('err', '❌ ' + msg);
        showToast(msg, 'error');
        render();
        return;
      }
      setSyncStatus('syncing');
      setDiag('info', '⏳ Тестування запису у /test_ping.json...');
      render();
      fetch(base + '/test_ping.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ok: true, ts: Date.now() })
      })
        .then(function(res) {
          if (!res.ok) return parseFirebaseError(res).then(function(e) { throw new Error(e); });
          return res.json().then(function() { return res.status; });
        })
        .then(function(status) {
          lastSyncAt = formatDateTimeNow();
          setSyncStatus('online');
          setDiag('ok', '✅ Тест запису пройдено (HTTP ' + status + ') — запис у базу відкритий!');
          showToast('Тест запису пройдено (HTTP ' + status + ')');
          render();
        })
        .catch(function(err) {
          var msg = (err && err.message) ? err.message : 'Помилка мережі (Failed to fetch)';
          setSyncStatus('offline');
          setDiag('err', '❌ Помилка тесту запису (' + msg + ')');
          showToast('Тест запису: ' + msg, 'error');
          render();
        });
    }

    function fbPreloadBeforeLogin() {
      var endpoint = getPlatoonEndpoint();
      if (!endpoint) return Promise.resolve();
      return fetch(endpoint)
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(data) {
          if (data && typeof data === 'object') applyRemoteSnapshot(data, true);
        })
        .catch(function() {});
    }

    function startLiveSync() {
      stopLiveSync();
      if (!getFirebaseUrl()) { setSyncStatus('local'); return; }
      fbPullAll(true, false);
      fbPollTimer = setInterval(function() {
        if (document.visibilityState === 'visible') fbPullAll(true, false);
      }, 15000);
    }

    function stopLiveSync() {
      if (fbPollTimer) { clearInterval(fbPollTimer); fbPollTimer = null; }
      clearTimeout(fbPushDebounce);
    }

    function manualSyncFromHeader() {
      if (!getFirebaseUrl()) { showToast('Локальний режим. Підключіть Firebase у Налаштуваннях'); return; }
      fbPullAll(false, true).then(function(res) {
        showToast(res.ok ? 'Дані оновлено з хмари' : (res.error || 'Помилка оновлення'), res.ok ? 'success' : 'error');
      });
    }

    // =========================================================================
    // 5. ЕКРАН ВХОДУ ЗА PIN-КОДОМ ТА СЕСІЯ
    // =========================================================================
    function getSavedSessionRole() {
      try { return localStorage.getItem(SESSION_ROLE_KEY) || sessionStorage.getItem(SESSION_ROLE_KEY) || null; } catch (e) { return null; }
    }

    function saveSessionRole(role, remember) {
      sessionRole = role;
      try {
        localStorage.removeItem(SESSION_ROLE_KEY);
        sessionStorage.removeItem(SESSION_ROLE_KEY);
        if (role) {
          if (remember) localStorage.setItem(SESSION_ROLE_KEY, role);
          else sessionStorage.setItem(SESSION_ROLE_KEY, role);
        }
      } catch (e) {}
    }

    function logoutSession() {
      stopLiveSync();
      saveSessionRole(null, false);
      pinEntry = '';
      pinError = false;
      document.getElementById('app-shell').classList.add('hidden');
      document.getElementById('pin-screen').classList.remove('hidden');
      renderPinScreen();
    }

    function enterAppWithRole(role) {
      sessionRole = role;
      document.getElementById('pin-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');

      if (!isAdmin()) {
        ui.openPersonnelSquads = {};
        ui.openPersonnelSquads[role] = true;
        ui.personnelSquadFilter = role;
      } else {
        ui.personnelSquadFilter = 'all';
        state.squads.forEach(function(sq) { ui.openPersonnelSquads[sq.id] = true; });
      }

      var rolePill = document.getElementById('header-role-pill');
      if (rolePill) {
        rolePill.textContent = getRoleLabel(role);
        rolePill.className = 'role-pill' + (isAdmin() ? '' : ' kv');
      }

      render();
      startLiveSync();
    }

    function renderPinScreen() {
      var root = document.getElementById('pin-screen');
      if (!root) return;
      var hasFb = Boolean(getFirebaseUrl());
      var dots = '';
      for (var i = 0; i < 4; i++) {
        dots += '<div class="pin-dot' + (i < pinEntry.length ? ' filled' : '') + (pinError ? ' err' : '') + '"></div>';
      }
      root.innerHTML =
        '<div class="pin-logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></div>' +
        '<div style="text-align:center">' +

        '</div>' +

        '<div class="numpad">' +
          ['1','2','3','4','5','6','7','8','9'].map(function(n) {

          }).join('') +
          '<button type="button" class="num-key fn" onclick="pinClear()">Скид</button>' +
          '<button type="button" class="num-key" onclick="pinPress(\'0\')">0</button>' +
          '<button type="button" class="num-key fn" onclick="pinBackspace()">⌫</button>' +
        '</div>' +

        '</div>';
    }

    function pinPress(d) {
      if (pinEntry.length >= 4) return;
      pinError = false;
      pinEntry += d;
      renderPinScreen();
      if (pinEntry.length === 4) setTimeout(verifyPin, 120);
    }
    function pinBackspace() { pinError = false; pinEntry = pinEntry.slice(0, -1); renderPinScreen(); }
    function pinClear() { pinError = false; pinEntry = ''; renderPinScreen(); }

    function verifyPin() {
      var pins = state.pins || DEFAULT_PINS;
      var roles = ['admin', 'sq1', 'sq2', 'sq3'];
      var matched = null;
      for (var i = 0; i < roles.length; i++) {
        if (String(pins[roles[i]]) === pinEntry) { matched = roles[i]; break; }
      }
      if (matched) {
        saveSessionRole(matched, pinRemember);
        pinEntry = ''; pinError = false;
        enterAppWithRole(matched);
        showToast('Вхід виконано: ' + getRoleLabel(matched));
      } else {
        pinError = true;
        renderPinScreen();
        showToast('Невірний PIN-код', 'error');
        setTimeout(function() { pinEntry = ''; pinError = false; renderPinScreen(); }, 500);
      }
    }

    // =========================================================================
    // 6. СПОВІЩЕННЯ, МОДАЛЬНІ ВІКНА, КОПІЮВАННЯ
    // =========================================================================
    function showToast(msg, type) {
      var root = document.getElementById('toast-root');
      if (!root) return;
      var el = document.createElement('div');
      el.className = 'toast' + (type === 'error' ? ' error' : '');
      el.textContent = msg;
      root.appendChild(el);
      setTimeout(function() {
        el.style.opacity = '0'; el.style.transition = 'opacity 0.2s';
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
      }, 2400);
    }

    function openModal(html) {
      document.getElementById('modal-box').innerHTML = html;
      document.getElementById('modal-root').classList.add('open');

    function showConfirm(title, message, btnText, onConfirm, isDanger) {
      openModal(
        '<div class="modal-header"><div class="modal-title">' + esc(title) + '</div>' +
        '<button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body"><div class="text-sm text-muted">' + esc(message) + '</div>' +
        '<div class="grid-2"><button class="btn btn-secondary" onclick="closeModal()">Скасувати</button>' +
        '<button id="confirm-ok-btn" class="btn ' + (isDanger ? 'btn-danger' : 'btn-primary') + '">' + esc(btnText) + '</button></div></div>'
      );
      document.getElementById('confirm-ok-btn').onclick = function() { closeModal(); onConfirm(); };
    }

    function copyText(text, successMsg) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.top = '-9999px';
        document.body.appendChild(ta);
        ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { showToast(successMsg || 'Скопійовано'); return; }
      } catch (e) {}
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(function() { showToast(successMsg || 'Скопійовано'); })
          .catch(function() { showToast('Не вдалося скопіювати', 'error'); });
      } else {
        showToast('Не вдалося скопіювати', 'error');
      }
    }

      return seg + roNote + (ui.dutiesSubTab === 'schedule' ? renderScheduleView() : renderStatsView());

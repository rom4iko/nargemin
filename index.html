    // Генерація тексту наряду на день за строгим шаблоном v2.6
    function generateDayDutiesText(isoDate) {
      const dayDuties = state.duties.filter(d => {
        if (d.date !== isoDate) return false;
        const s = getSoldierById(d.soldierId);
        if (!s) return false;

      // Впорядковуємо види нарядів: спочатку ЧК, потім Дн, далі решта
      const typeOrder = [...state.dutyTypes];
      const knownIds = new Set(typeOrder.map(dt => dt.id));
      dayDuties.forEach(d => {
        if (!knownIds.has(d.dutyTypeId)) {
          typeOrder.push(getDutyTypeById(d.dutyTypeId));
          knownIds.add(d.dutyTypeId);
        }
      });

      const blocks = [];
      for (const dt of typeOrder) {
        const items = dayDuties.filter(d => d.dutyTypeId === dt.id);
        if (!items.length) continue;
        const lines = [`${dt.name}:`];
        items.forEach(d => {
          const s = getSoldierById(d.soldierId);
          if (!s) return;
          const rankPrefix = s.rank && s.rank.trim() ? `${s.rank.trim()} ` : '';
          lines.push(`-${rankPrefix}${s.name}`);
        });
        blocks.push(lines.join('\n'));
      }

      return `${header}\n${blocks.join('\n\n')}`;

    function ensureRozkhidDay(dateISO) {
      if (!state.rozkhid[dateISO] || typeof state.rozkhid[dateISO] !== 'object') {
        state.rozkhid[dateISO] = { cleared: false, overrides: {}, extra: {} };
      }
      if (!state.rozkhid[dateISO].overrides) state.rozkhid[dateISO].overrides = {};
      if (!state.rozkhid[dateISO].extra) state.rozkhid[dateISO].extra = {};
      return state.rozkhid[dateISO];
    }

    // Ефективний статус бійця на конкретну дату (суворо ОДИН статус — жодних пересічень):
    // 1) Ручна відмітка на цей день (overrides)
    // 2) Якщо дата очищена кнопкою «Очистити розхід» -> 'Вн'
    // 3) Авто: сьогоднішній наряд -> 'Н'
    // 4) Авто: вчорашній наряд -> 'Стародобовий'
    // 5) Авто: постійний статус зі «Складу» (Ш, Л, Вд, Вп, Г, Пк, Хв)
    // 6) Інакше -> 'Вн'
    function getEffectiveRozkhidStatus(dateISO, soldier, todayDutySet, yestDutySet) {
      const dayData = state.rozkhid[dateISO];
      if (dayData && dayData.overrides && dayData.overrides[soldier.id]) {
        return dayData.overrides[soldier.id];
      }
      if (dayData && dayData.cleared) {
        return 'Вн';
      }
      if (todayDutySet.has(soldier.id)) return 'Н';
      if (yestDutySet.has(soldier.id)) return 'Стародобовий';
      const perm = normalizeSoldierStatus(soldier.status);
      if (PERMANENT_ABSENT_CODES.has(perm)) return perm;
      return 'Вн';
    }

    function openDutyTypeModal(dtId = null) {
      const existing = dtId ? state.dutyTypes.find(d => d.id === dtId) : null;
      tempDutyTypeColor = existing?.color || '#3b82f6';
      openModal(`
        <div class="modal-header">
          <div class="modal-title">${existing ? 'Редагувати вид наряду' : 'Новий вид наряду'}</div>
          <button class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <form class="modal-body" onsubmit="saveDutyType(event, '${dtId || ''}')">
          <div class="field">
            <label class="field-label" for="dt-name">Скорочена назва (виводиться при копіюванні)</label>
            <input id="dt-name" class="input" type="text" required value="${esc(existing?.name || '')}" placeholder="Наприклад: ЧК, Дн, КПП" />
          </div>
          <div class="field">
            <label class="field-label" for="dt-desc">Опис (необов'язково)</label>
            <input id="dt-desc" class="input" type="text" value="${esc(existing?.desc || '')}" placeholder="Наприклад: Днювальні курсу" />
          </div>
          <div class="field">
            <label class="field-label" for="dt-max">Кількість людей на наряд (1–10)</label>
            <input id="dt-max" class="input" type="number" min="1" max="10" required value="${existing ? existing.maxPeople : 1}" />
          </div>
          <div class="field">
            <div class="field-label">Колір</div>
            <div class="color-palette" id="dt-color-palette">
              ${SQUAD_PALETTE.map(c => `
                <button type="button" class="color-swatch ${c === tempDutyTypeColor ? 'selected' : ''}" style="background:${c}" onclick="pickDutyTypeColor('${c}', this)" aria-label="Колір"></button>
              `).join('')}
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-full">${existing ? 'Зберегти' : 'Додати'}</button>
        </form>
      `);
      setTimeout(() => document.getElementById('dt-name')?.focus(), 50);
    }

    function pickDutyTypeColor(hex, btn) {
      tempDutyTypeColor = hex;
      document.querySelectorAll('#dt-color-palette .color-swatch').forEach(el => el.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function saveDutyType(e, dtId = '') {
      e.preventDefault();
      const name = document.getElementById('dt-name').value.trim();
      const desc = document.getElementById('dt-desc').value.trim();
      const maxPeople = Math.min(10, Math.max(1, parseInt(document.getElementById('dt-max').value, 10) || 1));
      if (!name) return;

      if (dtId) {
        const dt = state.dutyTypes.find(x => x.id === dtId);
        if (dt) {
          dt.name = name;
          dt.desc = desc;
          dt.maxPeople = maxPeople;
          dt.color = tempDutyTypeColor;
        }
      } else {
        state.dutyTypes.push({ id: genId('dt'), name, desc, maxPeople, color: tempDutyTypeColor });
      }
      saveState();
      closeModal();
      render();
      showToast(dtId ? 'Вид наряду оновлено' : 'Вид наряду додано');
    }

    function deleteDutyType(id) {
      if (state.dutyTypes.length <= 1) return;
      state.dutyTypes = state.dutyTypes.filter(d => d.id !== id);
      saveState();
      render();
      showToast('Вид наряду видалено');
    }

    function parseAndValidateBackup(rawText) {
      const parsed = JSON.parse(rawText);
      if (!parsed || !Array.isArray(parsed.squads) || !Array.isArray(parsed.soldiers) || !Array.isArray(parsed.duties)) {
        throw new Error('Некоректна структура резервної копії');
      }
      return {
        groupNumber: typeof parsed.groupNumber === 'string' && parsed.groupNumber.trim() ? parsed.groupNumber : '223',
        squads: ensureGroupCmdSquad(parsed.squads),
        soldiers: parsed.soldiers.map(s => ({ ...s, status: normalizeSoldierStatus(s.status) })),
        dutyTypes: normalizeDutyTypes(parsed.dutyTypes),
        duties: parsed.duties,
        tasks: Array.isArray(parsed.tasks) ? parsed.tasks : [],
        rozkhid: migrateRozkhidMap(parsed.rozkhid),
        lastBackupAt: state.lastBackupAt
      };
    }

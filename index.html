<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1217" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Помічник взводу</title>
  <style>
    /* =====================================================================
       БАЗОВІ ЗМІННІ ТА СКИДАННЯ (100% АВТОНОМНИЙ CSS, ZERO DEPENDENCIES)
       ===================================================================== */
    :root {
      --bg: #0d1217;
      --card: #151c24;
      --card-2: #1c2530;
      --border: #273240;
      --text: #e8eef5;
      --muted: #8b99a8;
      --accent: #4d7c3f;
      --accent-bright: #5e964d;
      --accent-soft: rgba(94, 150, 77, 0.16);
      --green: #10b981;
      --blue: #3b82f6;
      --amber: #f59e0b;
      --red: #ef4444;
      --purple: #a855f7;
      --cyan: #06b6d4;
      --gold: #eab308;
      --radius: 14px;
      --radius-sm: 10px;
      --nav-h: 64px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      overflow-x: hidden;
      min-height: 100vh;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      outline: none;
    }

    /* >= 16px на полях вводу, щоб Safari на iPhone не збільшував масштаб при фокусі */
    input, select, textarea {
      font-size: 16px;
    }

    button {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
    }

    /* Головний контейнер (mobile-first) */
    .app-shell {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 24px);
    }

    /* Верхня шапка */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(13, 18, 23, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid rgba(94, 150, 77, 0.45);
      color: #84cc16;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
    }

    .header-ver-badge {
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid rgba(94, 150, 77, 0.45);
      color: #86efac;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* Основний контент */
    .main-content {
      flex: 1;
      padding: 12px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Нижня фіксована навігація (5 вкладок) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(21, 28, 36, 0.97);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .bottom-nav-inner {
      max-width: 600px;
      margin: 0 auto;
      height: var(--nav-h);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      position: relative;
      min-height: 44px;
      padding: 4px 2px;
      transition: color 0.15s;
    }

    .nav-btn span.nav-lbl {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .nav-btn.active {
      color: #4ade80;
    }

    .nav-btn.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 18%;
      right: 18%;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background: #4ade80;
    }

    .nav-badge {
      position: absolute;
      top: 6px;
      right: calc(50% - 19px);
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--amber);
      color: #111;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Картки та секції */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px;
    }

    .card-flush {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card-header {
      padding: 11px 13px;
      background: rgba(13, 18, 23, 0.6);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Акордеон-вкладки */
    .accordion-header {
      width: 100%;
      padding: 12px 13px;
      background: rgba(13, 18, 23, 0.65);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      min-height: 54px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .accordion-header:hover {
      background: rgba(28, 37, 48, 0.75);
    }

    .accordion-header.open {
      border-bottom: 1px solid var(--border);
    }

    .chevron {
      width: 18px;
      height: 18px;
      color: var(--muted);
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .accordion-header.open .chevron {
      transform: rotate(90deg);
      color: #fff;
    }

    /* Підвкладки */
    .subtabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px;
    }

    .subtab-btn {
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      min-height: 44px;
      transition: all 0.15s;
    }

    .subtab-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* Горизонтальні фільтр-пілюлі */
    .pills-row {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .pills-row::-webkit-scrollbar { display: none; }

    .pill-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s;
      min-height: 38px;
    }

    .pill-btn.active {
      background: var(--card-2);
      color: #fff;
      border-color: var(--pill-color, #4ade80);
      box-shadow: inset 0 0 0 1px var(--pill-color, #4ade80);
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .pill-count {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    /* Кнопки (мінімальна висота 44px для зручного тапу) */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      transition: background 0.15s, border-color 0.15s;
      min-height: 44px;
    }

    .btn-sm {
      padding: 7px 11px;
      font-size: 12px;
      min-height: 36px;
      border-radius: 8px;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-primary:hover { background: var(--accent-bright); }

    .btn-secondary {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #24303e; }

    .btn-danger {
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.22); }

    .btn-danger-solid {
      background: #dc2626;
      color: #fff;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      flex-shrink: 0;
    }
    .btn-icon:hover { color: #fff; background: var(--card-2); }
    .btn-icon.danger {
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.25);
    }

    .btn-full { width: 100%; }

    /* Поля вводу */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .input, .select, .textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 16px;
      color: #fff;
      min-height: 44px;
      transition: border-color 0.15s;
    }

    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--accent-bright);
    }

    .textarea {
      resize: vertical;
      min-height: 84px;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      flex: 1;
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      color: var(--muted);
      pointer-events: none;
    }

    .search-wrap .input {
      padding-left: 38px;
      padding-right: 36px;
    }

    .search-clear {
      position: absolute;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Чекбокси та перемикачі */
    .checkbox-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg);
      border: 1px solid var(--border);
      cursor: pointer;
      min-height: 44px;
    }

    .checkbox-card input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #4ade80;
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      min-height: 40px;
    }

    .toggle-pill input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #4ade80;
      flex-shrink: 0;
    }

    /* Бейджі */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge-kv {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.45);
    }

    .badge-kg {
      background: rgba(234, 179, 8, 0.22);
      color: #fde047;
      border-color: rgba(234, 179, 8, 0.55);
    }

    .badge-status-active { background: rgba(16, 185, 129, 0.14); color: #34d399; border-color: rgba(16, 185, 129, 0.3); }
    .badge-status-absent { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border-color: rgba(245, 158, 11, 0.35); }
    .badge-status-med { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.35); }
    .badge-status-leave { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border-color: rgba(59, 130, 246, 0.35); }
    .badge-status-other { background: rgba(168, 85, 247, 0.15); color: #c084fc; border-color: rgba(168, 85, 247, 0.35); }

    .badge-warn {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .badge-rec {
      background: rgba(34, 197, 94, 0.16);
      color: #86efac;
      border-color: rgba(34, 197, 94, 0.35);
    }

    /* Перемикач місяця / дати */
    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px;
    }

    .date-bar-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      flex: 1;
      line-height: 1.2;
    }

    /* Календар */
    .cal-weekdays, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-weekdays {
      margin-bottom: 6px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }

    .cal-weekdays .wknd { color: rgba(251, 191, 36, 0.85); }

    .cal-cell {
      min-height: 48px;
      border-radius: 9px;
      background: rgba(13, 18, 23, 0.65);
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 5px 2px;
      transition: background 0.12s, border-color 0.12s;
    }

    .cal-cell:hover { background: var(--card-2); }

    .cal-cell.today {
      border-color: rgba(74, 222, 128, 0.55);
      background: rgba(34, 197, 94, 0.08);
    }

    .cal-cell.selected {
      background: rgba(94, 150, 77, 0.25);
      border-color: #4ade80;
      box-shadow: inset 0 0 0 1px #4ade80;
    }

    .cal-day-num {
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }

    .cal-cell.today .cal-day-num { color: #4ade80; }

    .cal-dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
      min-height: 8px;
      max-width: 100%;
    }

    .cal-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* Рядок бійця */
    .soldier-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 13px;
      border-left: 4px solid var(--sq-color, #4ade80);
      border-bottom: 1px solid rgba(39, 50, 64, 0.65);
      background: var(--card);
    }
    .soldier-row:last-child { border-bottom: none; }
    .soldier-row.is-kv {
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.1) 0%, rgba(21, 28, 36, 1) 72%);
    }

    .soldier-info { min-width: 0; flex: 1; }

    .soldier-name-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .soldier-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .soldier-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Швидкі кнопки статусів у розгорнутій картці бійця */
    .status-chips-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .status-chip-btn {
      padding: 7px 4px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      text-align: center;
      min-height: 36px;
    }

    .status-chip-btn.active {
      background: rgba(94, 150, 77, 0.22);
      border-color: #4ade80;
      color: #fff;
    }

    .status-chip-btn.active-absent {
      background: rgba(245, 158, 11, 0.22);
      border-color: #f59e0b;
      color: #fde68a;
    }

    /* Розхід: рядки категорій з лічильниками - / + та кнопкою ПІБ */
    .rozkhid-cat-row {
      padding: 10px 11px;
      border-radius: 11px;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .rozkhid-cat-row.has-val {
      border-color: rgba(245, 158, 11, 0.45);
      background: rgba(245, 158, 11, 0.05);
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .step-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--card-2);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .step-btn:hover { background: #263342; }

    .step-val {
      min-width: 24px;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }

    .rozkhid-preview {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.55;
      color: #d7e2ec;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* KPI сітка */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .kpi-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 8px;
      text-align: center;
    }

    .kpi-val {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
    }

    .kpi-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Смужка навантаження */
    .bar-track {
      height: 5px;
      background: var(--bg);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.25s;
    }

    /* Картка задачі */
    .task-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--sq-color, #8b99a8);
      border-radius: var(--radius);
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-card.status-done { opacity: 0.85; }

    .task-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .task-text {
      font-size: 14px;
      color: #fff;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
    }

    .task-card.status-done .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .task-status-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .status-tap-btn {
      padding: 8px 6px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      text-align: center;
      transition: all 0.15s;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;

    .status-tap-btn.active-received {
      background: rgba(59, 130, 246, 0.2);
      border-color: #3b82f6;
      color: #93c5fd;
    }

    .status-tap-btn.active-done {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #6ee7b7;
    }

    .status-tap-btn.active-failed {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #fca5a5;
    }

    /* Зауваження під задачею */
    .note-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 9px 11px;
      border-radius: 9px;
      background: rgba(13, 18, 23, 0.65);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      min-height: 40px;

      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Палітра кольорів */
    .color-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      transition: transform 0.12s;
    }

    .color-swatch.selected {
      border-color: #fff;
      transform: scale(1.12);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25);
    }

    .chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Модальні вікна */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    @media (min-width: 560px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }

    .modal-backdrop.open { display: flex; }

    .modal-panel {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.18s ease-out;
    }

    @media (min-width: 560px) {
      .modal-panel { border-radius: 18px; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Сповіщення (Toast) */
    .toast-wrap {
      position: fixed;
      top: calc(64px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 80;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      padding: 11px 14px;
      border-radius: 12px;
      background: #1d2834;
      border: 1px solid rgba(74, 222, 128, 0.55);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      animation: slideUp 0.18s ease-out;
    }

    .toast.error {
      background: #331619;
      border-color: rgba(239, 68, 68, 0.6);
      color: #fecaca;
    }

    /* Рядок версії сайту */
    .version-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;

      border: 1px solid rgba(94, 150, 77, 0.45);
      font-size: 13px;
      color: var(--text);

    }

    .version-pill {

      border: 1px solid rgba(94, 150, 77, 0.45);
      color: #86efac;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* Допоміжні утиліти */
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row-gap { display: flex; align-items: center; gap: 8px; }

    .empty-state { text-align: center; padding: 24px 14px; color: var(--muted); font-size: 13px; }
    .text-xs { font-size: 11px; }
    .text-sm { font-size: 13px; }
    .text-muted { color: var(--muted); }
    .hidden { display: none !important; }
  </style>
</head>

  <script>
    // =========================================================================
    // КОНСТАНТИ, ВЕРСІЯ ТА ДОВІДНИКИ
    // =========================================================================
    const APP_VERSION = 'v2.5';
    const APP_UPDATED_DATE = '20.11.2026';
    const STORAGE_KEY = 'pomichnyk_vzvodu_v3';

    const MONTHS_UK = [
      'Січень', 'Лютий', 'Березень', 'Квітень', 'Травень', 'Червень',

    const MONTHS_GEN_UK = [
      'січня', 'лютого', 'березня', 'квітня', 'травня', 'червня',
      'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'
    ];

    const WEEKDAYS_UK = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];

    const GROUP_CMD_SQUAD_ID = 'group_cmd';

    const SQUAD_PALETTE = [
      '#eab308', // Золотий (Командир групи)
      '#10b981', // Смарагдовий (1-ше відділення)
      '#3b82f6', // Синій (2-ге відділення)

      '#f43f5e', // Малиновий
      '#84cc16', // Лаймовий
      '#ec4899'  // Рожевий
    ];

    // Постійні статуси військовослужбовця у «Складі» (автоматично підтягуються в «Розхід»)
    const SOLDIER_STATUSES = [
      { id: 'active', short: 'В строю', label: 'В строю', cls: 'badge-status-active' },
      { id: 'Ш',      short: 'Ш',       label: 'Ш (Шпиталь)', cls: 'badge-status-med' },

    ];

    const PERMANENT_ABSENT_CODES = new Set(['Ш', 'Л', 'Вд', 'Вп', 'Г', 'Пк', 'Хв']);

    // Точний порядок категорій відсутності в «Розході» (БЕЗ розшифрувань у рапорті)
    const ROZKHID_ABSENT_CATEGORIES = [
      { code: 'Прийом шпиталь', hint: 'Прийом шпиталь' },
      { code: 'Прийом лазарет', hint: 'Прийом лазарет' },
      { code: 'Ш',              hint: 'Шпиталь' },
      { code: 'Л',              hint: 'Лазарет' },
      { code: 'Вд',             hint: 'Відрядження' },

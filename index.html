<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Помічник взводу" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cpath d='M32 10L50 18V32C50 43.5 42.2 52 32 55C21.8 52 14 43.5 14 32V18L32 10Z' fill='%231e293b' stroke='%2310b981' stroke-width='3'/%3E%3Cpath d='M32 20L35.2 27.2L43 28L37 33.2L38.8 41L32 36.8L25.2 41L27 33.2L21 28L28.8 27.2L32 20Z' fill='%23f59e0b'/%3E%3C/svg%3E" />
  <title>Помічник взводу v3.3</title>
  <style>
    /* =========================================================================
       ТЕМНА ТАКТИЧНА ТЕМА (SLATE / EMERALD / AMBER — IPHONE SAFARI / ANDROID)
       ========================================================================= */
    :root {
      --bg: #0b1120;
      --bg-elev: #111827;
      --card: #162032;
      --card-hover: #1e293b;
      --border: #263449;
      --border-strong: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --emerald: #10b981;
      --emerald-dark: #059669;
      --amber: #f59e0b;
      --blue: #38bdf8;
      --danger: #ef4444;
      --radius: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px; line-height: 1.4;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font-family: inherit; font-size: 14px; color: var(--text); }
    button { cursor: pointer; border: none; background: none; padding: 0; }
    input[type="date"] { color-scheme: dark; }

    /* Аварійний банер помилок */
    #fatal-error-box {
      display: none; position: fixed; inset: 12px; z-index: 9999;
      background: #2b1115; border: 2px solid #ef4444; border-radius: 14px;
      padding: 16px; color: #fecaca; overflow: auto;
    }

    /* Екран входу за PIN-кодом */
    .pin-screen {
      min-height: 100vh; max-width: 440px; margin: 0 auto;
      padding: calc(28px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    }
    .pin-logo {
      width: 64px; height: 64px; border-radius: 18px;
      background: rgba(16, 185, 129, 0.16); border: 1.5px solid rgba(16, 185, 129, 0.5);
      color: var(--emerald); display: flex; align-items: center; justify-content: center;
    }
    .pin-dots { display: flex; gap: 16px; justify-content: center; margin: 4px 0; }
    .pin-dot {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid var(--border-strong); background: transparent; transition: all 0.14s ease;
    }
    .pin-dot.filled { background: var(--emerald); border-color: var(--emerald); transform: scale(1.1); }
    .pin-dot.err { background: var(--danger); border-color: var(--danger); }
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 280px; }
    .num-key {
      height: 60px; border-radius: 16px; background: var(--card); border: 1px solid var(--border);
      color: #fff; font-size: 22px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; transition: background 0.1s, transform 0.08s;
    }
    .num-key:active { background: var(--card-hover); transform: scale(0.95); }
    .num-key.fn { font-size: 14px; font-weight: 700; color: var(--muted); background: var(--bg-elev); }

    /* Головна оболонка */
    .app {
      max-width: 600px; margin: 0 auto; min-height: 100vh;
      display: flex; flex-direction: column; padding-bottom: calc(84px + var(--safe-bottom));
    }
    .header {
      position: sticky; top: 0; z-index: 30;
      padding: calc(8px + var(--safe-top)) 12px 8px;
      background: rgba(11, 17, 32, 0.94);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brand-icon {
      width: 34px; height: 34px; border-radius: 10px;
      background: rgba(16, 185, 129, 0.16); border: 1px solid rgba(16, 185, 129, 0.4);
      color: var(--emerald); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .brand-title { font-size: 14.5px; font-weight: 800; color: #fff; line-height: 1.15; white-space: nowrap; }
    .header-meta { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
    .role-pill {
      font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px;
      background: rgba(16, 185, 129, 0.16); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); white-space: nowrap;
    }
    .role-pill.kg { background: rgba(245, 158, 11, 0.18); color: #fde68a; border-color: rgba(245, 158, 11, 0.4); }
    .role-pill.kv { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.4); }

    .sync-pill {
      font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; min-height: 36px;
    }
    .sync-pill.online { border-color: rgba(16, 185, 129, 0.5); color: #6ee7b7; background: rgba(16, 185, 129, 0.1); }
    .sync-pill.offline { border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
    .sync-pill.syncing { border-color: rgba(56, 189, 248, 0.45); color: #7dd3fc; }

    .main { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }

    /* Нижня навігація + червоний бейдж задач */
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      background: rgba(17, 24, 39, 0.96);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border); padding-bottom: var(--safe-bottom);
    }
    .nav-inner { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: 64px; }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; font-size: 10.5px; font-weight: 700; color: var(--muted); min-height: 44px;
    }
    .nav-btn.active { color: var(--emerald); }
    .nav-icon-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
    .nav-badge {
      position: absolute; top: -6px; right: -10px;
      min-width: 18px; height: 18px; padding: 0 4px;
      border-radius: 999px; background: #ef4444; color: #ffffff;
      border: 2px solid #111827; font-size: 10px; font-weight: 800; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.5);
    }

    /* Картки, сітки, типографіка */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .card-flush { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .stack-sm { display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .wrap { flex-wrap: wrap; }
    .min0 { min-width: 0; flex: 1; }
    .text-xs { font-size: 12px; }
    .text-sm { font-size: 13.5px; }
    .text-muted { color: var(--muted); }
    .fw-bold { font-weight: 700; }
    .fw-800 { font-weight: 800; }
    .section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: #cbd5e1; }
    .empty-state { text-align: center; padding: 20px 12px; color: var(--muted); font-size: 13.5px; }
    .info-banner {
      padding: 9px 12px; border-radius: 11px; font-size: 12px; color: #bae6fd;
      background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* Кнопки та поля вводу */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 44px; padding: 9px 14px; border-radius: 11px;
      font-weight: 700; font-size: 13.5px; text-align: center; transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-sm { min-height: 38px; padding: 6px 11px; font-size: 12px; border-radius: 9px; }
    .btn-xs { min-height: 34px; padding: 4px 9px; font-size: 11.5px; border-radius: 8px; }
    .btn-full { width: 100%; }
    .btn-primary { background: var(--emerald-dark); color: #fff; }
    .btn-secondary { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); }
    .btn-info { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.35); }
    .btn-warn { background: rgba(245, 158, 11, 0.16); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.4); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }

    .btn-icon {
      width: 44px; height: 44px; border-radius: 10px; background: var(--bg-elev);
      border: 1px solid var(--border); color: var(--text);
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px;
    }
    .btn-icon-sm { width: 38px; height: 38px; border-radius: 9px; font-size: 13px; }
    .btn-icon.danger { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.3); color: #f87171; }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field-label { font-size: 12px; font-weight: 700; color: var(--muted); }
    .input, .select, .textarea {
      width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border); color: #fff; outline: none;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--emerald); }
    .textarea { min-height: 76px; resize: vertical; }

    /* Сегмент-кнопки, фільтри, бейджі */
    .seg-control {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
      background: var(--card); border: 1px solid var(--border); padding: 4px; border-radius: 12px;
    }
    .seg-btn { min-height: 38px; padding: 4px 6px; border-radius: 9px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
    .seg-btn.active { background: var(--emerald-dark); color: #fff; }

    .pills-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .pills-scroll::-webkit-scrollbar { display: none; }
    .pill {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
      min-height: 36px; padding: 6px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 700; background: var(--card); border: 1px solid var(--border); color: var(--muted);
    }
    .pill.active { background: var(--emerald-dark); border-color: var(--emerald-dark); color: #fff; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .badge {
      display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px;
      border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .badge-kg { background: rgba(245, 158, 11, 0.2); color: #fde047; border: 1px solid rgba(245, 158, 11, 0.45); }
    .badge-kv { background: rgba(56, 189, 248, 0.2); color: #93c5fd; border: 1px solid rgba(56, 189, 248, 0.4); }
    .badge-ok { background: rgba(16, 185, 129, 0.16); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.35); }
    .badge-info { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.35); }
    .badge-warn { background: rgba(245, 158, 11, 0.18); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.38); }
    .badge-err { background: rgba(239, 68, 68, 0.18); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.38); }
    .badge-muted { background: rgba(148, 163, 184, 0.14); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.28); }

    /* Календар нарядів */
    .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-bottom: 6px; }
    .cal-weekdays div { font-size: 11px; font-weight: 700; color: var(--muted); }
    .cal-weekdays .wknd { color: #fbbf24; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-cell {
      height: 46px; border-radius: 9px; border: 1px solid transparent;
      background: rgba(11, 17, 32, 0.65); color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 5px 2px;
    }
    .cal-cell.today { border-color: rgba(16, 185, 129, 0.6); }
    .cal-cell.selected { background: rgba(16, 185, 129, 0.28); border-color: var(--emerald); color: #fff; }
    .cal-num { font-size: 12.5px; font-weight: 700; line-height: 1; }
    .cal-dots { display: flex; gap: 2px; height: 6px; align-items: center; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; }

    /* Акордеони, склад, статуси присутності */
    .acc-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      min-height: 48px; padding: 10px 12px; background: rgba(11, 17, 32, 0.6); cursor: pointer; user-select: none;
    }
    .chevron { display: inline-block; transition: transform 0.18s; color: var(--muted); flex-shrink: 0; font-size: 13px; }
    .acc-header.open .chevron { transform: rotate(90deg); color: #fff; }
    .acc-body { border-top: 1px solid var(--border); }
    .soldier-item { border-bottom: 1px solid var(--border); background: var(--bg); }
    .soldier-item:last-child { border-bottom: none; }
    .soldier-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      min-height: 50px; padding: 10px 12px; cursor: pointer;
    }
    .soldier-expand { padding: 10px 12px 12px; background: rgba(22, 32, 50, 0.72); border-top: 1px dashed var(--border); }
    .soldier-name { font-size: 14px; font-weight: 700; color: #fff; }

    .presence-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .presence-btn {
      min-height: 36px; padding: 6px 8px; border-radius: 9px; font-size: 11.5px; font-weight: 700;
      background: var(--card); border: 1px solid var(--border); color: var(--muted); text-align: center;
    }
    .presence-btn.active-ok { background: rgba(16, 185, 129, 0.22); border-color: var(--emerald); color: #6ee7b7; }
    .presence-btn.active-warn { background: rgba(245, 158, 11, 0.22); border-color: var(--amber); color: #fde68a; }

    /* Задачі */
    .task-card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 13px; display: flex; flex-direction: column; gap: 10px;
    }
    .status-group-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .status-btn {
      min-height: 36px; padding: 6px 6px; border-radius: 9px; font-size: 11.5px; font-weight: 700;
      background: var(--bg); border: 1px solid var(--border); color: var(--muted); text-align: center;
    }
    .status-btn.st-new { background: rgba(148, 163, 184, 0.2); border-color: #94a3b8; color: #f1f5f9; }
    .status-btn.st-in_progress { background: rgba(56, 189, 248, 0.2); border-color: var(--blue); color: #7dd3fc; }
    .status-btn.st-done { background: rgba(16, 185, 129, 0.22); border-color: var(--emerald); color: #6ee7b7; }
    .status-btn.st-failed { background: rgba(239, 68, 68, 0.22); border-color: var(--danger); color: #fca5a5; }

    /* Розхід, KPI, прев'ю */
    .kpi-box { background: var(--bg); border: 1px solid var(--border); border-radius: 11px; padding: 10px; text-align: center; }
    .kpi-val { font-size: 20px; font-weight: 800; color: #fff; }
    .kpi-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .preview-pre {
      margin: 0; padding: 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px; white-space: pre-wrap; word-break: break-word; line-height: 1.48;
    }
    .toggle-pill {
      display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 8px 10px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .toggle-pill input[type="checkbox"] { width: 19px; height: 19px; accent-color: var(--emerald); flex-shrink: 0; }
    .checkbox-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      min-height: 46px; padding: 10px 12px; background: var(--bg); border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .checkbox-row.locked { opacity: 0.48; cursor: not-allowed; }
    .checkbox-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--emerald); flex-shrink: 0; }

    /* Матриця прав та діагностика Firebase */
    .perm-block {
      padding: 10px; border-radius: 11px; background: var(--bg); border: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }
    .diag-box {
      padding: 9px 11px; border-radius: 10px; font-size: 12px; line-height: 1.4; word-break: break-word;
    }
    .diag-ok { background: rgba(16, 185, 129, 0.14); border: 1px solid rgba(16, 185, 129, 0.4); color: #a7f3d0; }
    .diag-err { background: rgba(239, 68, 68, 0.18); border: 1px solid rgba(239, 68, 68, 0.45); color: #fecaca; }
    .diag-info { background: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.4); color: #bae6fd; }

    /* Присутність (Хто онлайн) */
    .presence-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; border-radius: 11px; background: var(--bg); border: 1px solid var(--border);
    }
    .presence-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .presence-dot.on { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.75); }
    .presence-dot.off { background: #475569; }

    /* Модальні вікна та Toast */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.78);
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    @media (min-width: 520px) { .modal-backdrop { align-items: center; padding: 16px; } }
    .modal-box {
      width: 100%; max-width: 540px; max-height: 92vh; background: var(--card);
      border: 1px solid var(--border); border-radius: 18px 18px 0 0;
      display: flex; flex-direction: column; overflow: hidden; padding-bottom: var(--safe-bottom);
    }
    @media (min-width: 520px) { .modal-box { border-radius: 18px; padding-bottom: 0; } }
    .modal-header {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0;
    }
    .modal-title { font-size: 16px; font-weight: 800; color: #fff; }
    .modal-body { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

    .toast-root {
      position: fixed; top: calc(62px + var(--safe-top)); left: 50%; transform: translateX(-50%);
      z-index: 60; width: 92%; max-width: 390px; pointer-events: none; display: flex; flex-direction: column; gap: 6px;
    }
    .toast {
      padding: 10px 14px; border-radius: 11px; text-align: center; font-size: 13px; font-weight: 700;
      color: #fff; background: #1e293b; border: 1px solid rgba(16, 185, 129, 0.6); box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .toast.error { background: #3a171c; border-color: rgba(239, 68, 68, 0.65); color: #fecaca; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Аварійний блок діагностики помилок -->
  <div id="fatal-error-box"></div>

  <!-- Екран входу за PIN-кодом -->
  <div id="pin-screen" class="pin-screen hidden"></div>

  <!-- Основна оболонка застосунку -->
  <div id="app-shell" class="app hidden">

  <script>
    // =========================================================================
    // 0. ГЛОБАЛЬНИЙ ЗАХИСТ ВІД БІЛОГО ЕКРАНУ (WINDOW.ONERROR)
    // =========================================================================
    function showFatalError(msg) {
      var box = document.getElementById('fatal-error-box');
      if (!box) return;
      box.style.display = 'block';
      box.innerHTML =
        '<div style="font-size:16px;font-weight:800;margin-bottom:8px">Помилка запуску «Помічника взводу»</div>' +
        '<div style="font-size:13px;font-family:monospace;white-space:pre-wrap;margin-bottom:14px">' + String(msg || 'Невідома помилка') + '</div>' +
        '<button type="button" onclick="location.reload()" style="padding:10px 14px;border-radius:10px;background:#ef4444;color:#fff;font-weight:700">Перезавантажити</button>';
    }
    window.onerror = function(message, source, lineno, colno) {
      showFatalError(message + (lineno ? (' (рядок ' + lineno + ':' + colno + ')') : ''));
      return false;
    };
    window.onunhandledrejection = function(ev) {
      var r = ev && ev.reason ? (ev.reason.message || String(ev.reason)) : 'Unhandled promise rejection';
      showFatalError(r);
    };

    // =========================================================================
    // 0.5. PWA-ІКОНКА 512x512 (PNG) ТА МАНІФЕСТ (TRY/CATCH)
    // =========================================================================
    (function initPwaIconAndManifest() {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        var ctx = canvas.getContext('2d');
        if (!ctx) return;

        var bgGrad = ctx.createLinearGradient(0, 0, 512, 512);
        bgGrad.addColorStop(0, '#0f172a');
        bgGrad.addColorStop(1, '#1e293b');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 512, 512);

        ctx.strokeStyle = 'rgba(16, 185, 129, 0.08)';
        ctx.lineWidth = 2;
        for (var g = 64; g < 512; g += 64) {
          ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, 512); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(512, g); ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(256, 256, 212, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(16, 185, 129, 0.25)';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.save();
        ctx.shadowColor = 'rgba(16, 185, 129, 0.35)';
        ctx.shadowBlur = 22;
        ctx.beginPath();
        ctx.moveTo(256, 76);
        ctx.lineTo(398, 134);
        ctx.lineTo(398, 254);
        ctx.bezierCurveTo(398, 352, 332, 416, 256, 444);
        ctx.bezierCurveTo(180, 416, 114, 352, 114, 254);
        ctx.lineTo(114, 134);
        ctx.closePath();
        var shieldGrad = ctx.createLinearGradient(114, 76, 398, 444);
        shieldGrad.addColorStop(0, '#1e293b');
        shieldGrad.addColorStop(1, '#0b1120');
        ctx.fillStyle = shieldGrad;
        ctx.fill();
        ctx.lineWidth = 14;
        ctx.strokeStyle = '#10b981';
        ctx.stroke();
        ctx.restore();

        var cx = 256, cy = 224, spikes = 5, outerR = 68, innerR = 29;
        var rot = (Math.PI / 2) * 3;
        var step = Math.PI / spikes;
        ctx.beginPath();
        ctx.moveTo(cx, cy - outerR);
        for (var i = 0; i < spikes; i++) {
          ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
          rot += step;
          ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
          rot += step;
        }
        ctx.closePath();
        var starGrad = ctx.createLinearGradient(cx, cy - outerR, cx, cy + outerR);
        starGrad.addColorStop(0, '#fde047');
        starGrad.addColorStop(1, '#f59e0b');
        ctx.fillStyle = starGrad;
        ctx.fill();

        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(196, 326);
        ctx.lineTo(256, 366);
        ctx.lineTo(316, 326);
        ctx.stroke();

        var pngDataUrl = canvas.toDataURL('image/png');
        var head = document.head || document.getElementsByTagName('head')[0];
        if (!head) return;

        var appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.sizes = '512x512';
        appleIcon.href = pngDataUrl;
        head.appendChild(appleIcon);

        var pngIcon = document.createElement('link');
        pngIcon.rel = 'icon';
        pngIcon.type = 'image/png';
        pngIcon.sizes = '512x512';
        pngIcon.href = pngDataUrl;
        head.appendChild(pngIcon);

        var manifestObj = {
          name: 'Помічник взводу',
          short_name: 'Помічник',
          start_url: window.location.href,
          display: 'standalone',
          background_color: '#0f172a',
          theme_color: '#0f172a',
          icons: [{ src: pngDataUrl, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }]
        };
        var blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        var manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(blob);
        head.appendChild(manifestLink);
      } catch (e) {}
    })();

    // =========================================================================
    // 1. КОНСТАНТИ, РОЛІ, ПРАВА ДОСТУПУ ТА ДОВІДНИКИ
    // =========================================================================
    var APP_VERSION = 'v3.3';
    var APP_UPDATED = '20.11.2026';
    var STORAGE_KEY = 'pomichnyk_vzvodu_v33';
    var FB_URL_STORAGE_KEY = 'pomichnyk_vzvodu_fb_url';
    var SESSION_ROLE_KEY = 'pomichnyk_vzvodu_role_v33';
    var LEGACY_KEYS = [
      'pomichnyk_vzvodu_v321', 'pomichnyk_vzvodu_v32', 'pomichnyk_vzvodu_v31',
      'pomichnyk_vzvodu_v30', 'pomichnyk_vzvodu_v3', 'pomichnyk_vzvodu_v27',
      'pomichnyk_vzvodu_data', 'platoon_helper_state'
    ];

    var ROLE_ORDER = ['admin', 'kg', 'kv1', 'kv2', 'kv3'];
    var ROLES_META = {
      admin: { key: 'admin', label: 'Адмін', short: '🛡️ Адмін', squadId: null, cssClass: '' },
      kg:    { key: 'kg',    label: 'КГ (Командир групи)', short: '⭐ КГ', squadId: 'group_cmd', cssClass: 'kg' },
      kv1:   { key: 'kv1',   label: 'КВ 1-го відділення', short: '🔹 КВ 1', squadId: 'sq_1', cssClass: 'kv' },

      kv3:   { key: 'kv3',   label: 'КВ 3-го відділення', short: '🔹 КВ 3', squadId: 'sq_3', cssClass: 'kv' }
    };

    var DEFAULT_PINS = { admin: '1111', kg: '1222', kv1: '1001', kv2: '2002', kv3: '3003' };

    var DEFAULT_ROLE_PERMISSIONS = {

      kv1: { dutiesEdit: true,  tasksCreate: true,  tasksStatus: true, tasksViewAll: true,  rozkhidMode: 'all', skladMode: 'view' },

    var PRESENCE_STATUSES = [
      { key: 'in_service',    label: 'В строю',                 short: 'В строю',    badgeClass: 'badge-ok' },
      { key: 'duty',          label: 'Наряд',                   short: 'Наряд',      badgeClass: 'badge-info' },
      { key: 'sick',          label: 'Хворий / Санчастина',     short: 'Хворий',     badgeClass: 'badge-err' },
      { key: 'leave',         label: 'Відпустка / Звільнення',  short: 'Відпустка',  badgeClass: 'badge-warn' },
      { key: 'business_trip', label: 'Відрядження',             short: 'Відрядж.',   badgeClass: 'badge-warn' },
      { key: 'other',         label: 'Інше',                    short: 'Інше',       badgeClass: 'badge-muted' }
    ];

    var TASK_RECIPIENTS = [
      { label: 'Усім командирам відділень', targetRole: 'all', targetSquadId: 'all' },
      { label: 'Командиру групи (КГ)',      targetRole: 'kg',  targetSquadId: 'group_cmd' },
      { label: 'Командиру 1-го відділення', targetRole: 'kv1', targetSquadId: 'sq_1' },
      { label: 'Командиру 2-го відділення', targetRole: 'kv2', targetSquadId: 'sq_2' },
      { label: 'Командиру 3-го відділення', targetRole: 'kv3', targetSquadId: 'sq_3' }
    ];

    var TASK_STATUSES = [
      { key: 'new',         label: 'Нова',        badgeClass: 'badge-muted' },
      { key: 'in_progress', label: 'В роботі',    badgeClass: 'badge-info' },
      { key: 'done',        label: 'Виконано',    badgeClass: 'badge-ok' },
      { key: 'failed',      label: 'Не виконано', badgeClass: 'badge-err' }
    ];

    var MONTHS_NOM = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];

    // =========================================================================
    // 2. УТИЛІТИ ДАТ, HTML, КЛІПБОРДУ ТА БЕЗПЕЧНОГО СХОВИЩА
    // =========================================================================
    function pad2(n) { return String(n).padStart(2, '0'); }
    function toISO(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
    function todayISO() { return toISO(new Date()); }
    function fmtUA(iso) {
      if (!iso) return '';
      var p = String(iso).split('-');
      return p.length === 3 ? (p[2] + '.' + p[1] + '.' + p[0]) : iso;
    }
    function fmtTimeNow() {
      var d = new Date();
      return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }
    function genId(prefix) { return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7); }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function showToast(msg, isError) {
      var root = document.getElementById('toast-root');
      if (!root) return;
      var el = document.createElement('div');
      el.className = 'toast' + (isError ? ' error' : '');
      el.textContent = String(msg || '');
      root.appendChild(el);
      setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, isError ? 3600 : 2500);
    }

    function copyText(text, successMsg) {
      var done = function() { showToast(successMsg || 'Скопійовано'); };
      var fallbackCopy = function() {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          ta.style.top = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, text.length);
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) done(); else showToast('Не вдалося скопіювати', true);
        } catch (e) {
          showToast('Помилка копіювання', true);
        }
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    }

    function safeLSGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function safeLSSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
    function safeLSRemove(key) { try { localStorage.removeItem(key); } catch (e) {} }
    function safeSSGet(key) { try { return sessionStorage.getItem(key); } catch (e) { return null; } }
    function safeSSSet(key, val) { try { sessionStorage.setItem(key, val); } catch (e) {} }
    function safeSSRemove(key) { try { sessionStorage.removeItem(key); } catch (e) {} }

    // =========================================================================
    // 3. ТОЧНА СХЕМА ДАНИХ ТА УНІВЕРСАЛЬНА НОРМАЛІЗАЦІЯ
    // =========================================================================
    function createDefaultState() {
      return {
        groupNumber: '223',
        squads: [
          { id: 'group_cmd', name: 'Командир групи',  color: '#f43f5e', isCmdGroup: true },
          { id: 'sq_1',      name: '1-ше відділення', color: '#10b981', isCmdGroup: false },
          { id: 'sq_2',      name: '2-ге відділення', color: '#3b82f6', isCmdGroup: false },
          { id: 'sq_3',      name: '3-тє відділення', color: '#f59e0b', isCmdGroup: false }
        ],
        dutyTypes: [
          { id: 'dt_1', shortName: 'Черговий',   name: 'Черговий',   maxCount: 1, color: '#3b82f6' },
          { id: 'dt_2', shortName: 'Днювальний', name: 'Днювальний', maxCount: 3, color: '#10b981' }
        ],
        pins: Object.assign({}, DEFAULT_PINS),
        rolePermissions: JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMISSIONS)),
        personnel: [],
        duties: [],
        tasks: [],
        scheduledAbsences: [],
        rozkhidManual: {},
        rozkhidNumeric: {},
        rozkhidCleared: {},
        lastBackupAt: '',
        updatedAt: 0
      };
    }

    function toArraySafe(val) {
      if (Array.isArray(val)) return val.filter(Boolean);
      if (val && typeof val === 'object') return Object.values(val).filter(Boolean);
      return [];
    }

    function mapLegacySquadId(rawId) {
      var id = String(rawId || 'sq_1');
      if (id === 'cmd') return 'group_cmd';
      if (id === 'sq1') return 'sq_1';
      if (id === 'sq2') return 'sq_2';
      if (id === 'sq3') return 'sq_3';
      return id;
    }

    function normalizePresenceStatus(rawStatus) {
      var s = String(rawStatus || 'in_service');
      var valid = PRESENCE_STATUSES.some(function(p) { return p.key === s; });
      if (valid) return s;
      if (s === 'present') return 'in_service';
      if (s === 'sh' || s === 'l' || s === 'hv') return 'sick';
      if (s === 'vd') return 'business_trip';
      if (s === 'vp') return 'leave';
      if (s === 'n') return 'duty';
      return 'in_service';
    }

    function normalizeState(raw) {
      var def = createDefaultState();
      if (!raw || typeof raw !== 'object') return def;

      // Підтримка squads
      var rawSquads = toArraySafe(raw.squads);
      var squads = rawSquads.length ? rawSquads.map(function(sq) {
        return {
          id: mapLegacySquadId(sq.id),
          name: String(sq.name || 'Відділення'),
          color: String(sq.color || '#10b981'),
          isCmdGroup: Boolean(sq.isCmdGroup || sq.id === 'group_cmd' || sq.id === 'cmd')
        };
      }) : def.squads;

      // Підтримка dutyTypes
      var rawDutyTypes = toArraySafe(raw.dutyTypes);
      var dutyTypes = rawDutyTypes.length ? rawDutyTypes.map(function(dt) {
        return {
          id: String(dt.id || genId('dt')),
          shortName: String(dt.shortName || dt.name || 'Наряд'),
          name: String(dt.name || dt.shortName || 'Наряд'),
          maxCount: Math.max(1, Number(dt.maxCount) || 1),
          color: String(dt.color || '#3b82f6')
        };
      }) : def.dutyTypes;

      // Підтримка rolePermissions (та fallback зі старого поля permissions)
      var rolePermissions = JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMISSIONS));
      var srcPerms = raw.rolePermissions || raw.permissions;
      if (srcPerms && typeof srcPerms === 'object') {
        ['kg', 'kv1', 'kv2', 'kv3'].forEach(function(rk) {
          var p = srcPerms[rk];
          if (p && typeof p === 'object') {
            rolePermissions[rk] = {
              dutiesEdit: p.dutiesEdit !== undefined ? Boolean(p.dutiesEdit) : DEFAULT_ROLE_PERMISSIONS[rk].dutiesEdit,
              tasksCreate: p.tasksCreate !== undefined ? Boolean(p.tasksCreate) : DEFAULT_ROLE_PERMISSIONS[rk].tasksCreate,
              tasksStatus: p.tasksStatus !== undefined ? Boolean(p.tasksStatus) : (p.tasksUpdate !== undefined ? Boolean(p.tasksUpdate) : DEFAULT_ROLE_PERMISSIONS[rk].tasksStatus),
              tasksViewAll: p.tasksViewAll !== undefined ? Boolean(p.tasksViewAll) : DEFAULT_ROLE_PERMISSIONS[rk].tasksViewAll,
              rozkhidMode: p.rozkhidMode || DEFAULT_ROLE_PERMISSIONS[rk].rozkhidMode,
              skladMode: p.skladMode || (p.personnelMode === 'all' ? 'all_edit' : (p.personnelMode || DEFAULT_ROLE_PERMISSIONS[rk].skladMode))
            };
          }
        });
      }

      // Універсальна підтримка personnel (personnel / people / soldiers)
      var rawPeople = toArraySafe(raw.personnel);
      if (!rawPeople.length) rawPeople = toArraySafe(raw.people);
      if (!rawPeople.length) rawPeople = toArraySafe(raw.soldiers);

      var personnel = rawPeople.filter(function(p) {
        return p && (p.fullName || p.name);
      }).map(function(p) {
        return {
          id: String(p.id || genId('s')),
          fullName: String(p.fullName || p.name).trim(),
          rank: String(p.rank || 'солдат').trim(),
          squadId: mapLegacySquadId(p.squadId || 'sq_1'),
          isLeader: Boolean(p.isLeader !== undefined ? p.isLeader : p.isCommander),
          presenceStatus: normalizePresenceStatus(p.presenceStatus || p.status || 'in_service')
        };
      });

      // Універсальна підтримка duties (масив записів {id, date, dutyTypeId, personId, note} або старий об'єкт за датами)
      var duties = [];
      if (Array.isArray(raw.duties)) {
        duties = raw.duties.filter(function(d) { return d && d.date && d.dutyTypeId && d.personId; }).map(function(d) {
          return {
            id: String(d.id || genId('d')),
            date: String(d.date),
            dutyTypeId: String(d.dutyTypeId),
            personId: String(d.personId),
            note: String(d.note || '')
          };
        });
      } else if (raw.duties && typeof raw.duties === 'object') {
        Object.keys(raw.duties).forEach(function(dateKey) {
          var dayObj = raw.duties[dateKey];
          if (dayObj && typeof dayObj === 'object') {
            Object.keys(dayObj).forEach(function(dtId) {
              toArraySafe(dayObj[dtId]).forEach(function(pid) {
                if (typeof pid === 'string') {
                  duties.push({ id: genId('d'), date: dateKey, dutyTypeId: dtId, personId: pid, note: '' });
                }
              });
            });
          }
        });
      }

      // Універсальна підтримка tasks
      var rawTasks = toArraySafe(raw.tasks);
      var tasks = rawTasks.filter(function(t) { return t && (t.title || t.text); }).map(function(t) {
        var matchedRec = TASK_RECIPIENTS.find(function(r) {
          return r.targetRole === t.targetRole || r.label === t.target;
        });
        var st = String(t.status || 'new');
        if (st === 'received') st = 'in_progress';
        if (['new', 'in_progress', 'done', 'failed'].indexOf(st) === -1) st = 'new';
        return {
          id: String(t.id || genId('t')),
          title: String(t.title || t.text || '').trim(),
          description: String(t.description || t.remark || '').trim(),
          target: String(t.target || (matchedRec ? matchedRec.label : 'Усім командирам відділень')),
          targetRole: String(t.targetRole || (matchedRec ? matchedRec.targetRole : 'all')),
          targetSquadId: mapLegacySquadId(t.targetSquadId || (matchedRec ? matchedRec.targetSquadId : 'all')),
          priority: (t.priority === 'high' || t.priority === 'low') ? t.priority : 'normal',
          status: st,
          createdBy: String(t.createdBy || t.author || ''),
          createdAt: t.createdAt || fmtTimeNow(),
          updatedAt: t.updatedAt || t.createdAt || fmtTimeNow()
        };
      });

      return {
        groupNumber: typeof raw.groupNumber === 'string' && raw.groupNumber.trim() ? raw.groupNumber.trim() : def.groupNumber,
        squads: squads,
        dutyTypes: dutyTypes,
        pins: Object.assign({}, DEFAULT_PINS, raw.pins && typeof raw.pins === 'object' ? raw.pins : {}),
        rolePermissions: rolePermissions,
        personnel: personnel,
        duties: duties,
        tasks: tasks,
        scheduledAbsences: toArraySafe(raw.scheduledAbsences),
        rozkhidManual: raw.rozkhidManual && typeof raw.rozkhidManual === 'object' ? raw.rozkhidManual : {},
        rozkhidNumeric: raw.rozkhidNumeric && typeof raw.rozkhidNumeric === 'object' ? raw.rozkhidNumeric : {},
        rozkhidCleared: raw.rozkhidCleared && typeof raw.rozkhidCleared === 'object' ? raw.rozkhidCleared : {},
        lastBackupAt: String(raw.lastBackupAt || ''),
        updatedAt: Number(raw.updatedAt) || 0
      };
    }

    function loadLocalState() {

      if (!rawStr) {
        for (var i = 0; i < LEGACY_KEYS.length; i++) {
          var cand = safeLSGet(LEGACY_KEYS[i]);
          if (cand) { rawStr = cand; break; }
        }
      }
      if (!rawStr) return createDefaultState();
      try {
        return normalizeState(JSON.parse(rawStr));
      } catch (e) {
        return createDefaultState();
      }
    }

    };

    // Стан синхронізації Firebase та Присутності ("Хто онлайн")
    var fbUrl = safeLSGet(FB_URL_STORAGE_KEY) || '';

    // Хелпери прав доступу
    function getRoleMeta(role) { return ROLES_META[role] || ROLES_META.kv1; }
    function isAdmin() { return currentRole === 'admin'; }
    function getPerm(role) {
      var r = role || currentRole;
      if (r === 'admin') {
        return { dutiesEdit: true, tasksCreate: true, tasksStatus: true, tasksViewAll: true, rozkhidMode: 'all', skladMode: 'all_edit' };
      }
      return (state.rolePermissions && state.rolePermissions[r]) ? state.rolePermissions[r] : DEFAULT_ROLE_PERMISSIONS.kv2;
    }

    function canCreateTasks() { return isAdmin() || Boolean(getPerm().tasksCreate); }
    function canUpdateTaskStatus() { return isAdmin() || Boolean(getPerm().tasksStatus); }
    function getRozkhidMode() { return isAdmin() ? 'all' : (getPerm().rozkhidMode || 'view'); }
    function getSkladMode() { return isAdmin() ? 'all_edit' : (getPerm().skladMode || 'view'); }
    function getMySquadId() { return getRoleMeta(currentRole).squadId; }

    function canEditPersonPresence(person) {
      var rMode = getRozkhidMode();
      var sMode = getSkladMode();
      if (rMode === 'all' || sMode === 'all_edit') return true;
      if ((rMode === 'own' || sMode === 'own_status') && person && person.squadId === getMySquadId()) return true;
      return false;
    }

    function isTaskVisibleForRole(task, role) {
      if (!task) return false;
      var r = role || currentRole;
      if (!r) return false;
      if (r === 'admin') return true;
      var perm = getPerm(r);
      if (perm && perm.tasksViewAll) return true;
      if (task.targetRole === 'all' || task.targetSquadId === 'all') return true;
      if (task.targetRole && task.targetRole === r) return true;
      var mySq = getRoleMeta(r).squadId;
      if (mySq && task.targetSquadId && task.targetSquadId === mySq) return true;
      return false;
    }

    // =========================================================================
    // 4. FIREBASE REALTIME DATABASE REST API + PRESENCE ("ХТО ОНЛАЙН")
    // =========================================================================
    function normalizeFirebaseBaseUrl(raw) {
      var str = String(raw || '').trim();
      if (!str) return '';
      var match = str.match(/https?:\/\/[a-zA-Z0-9._-]+(?:\.firebaseio\.com|\.firebasedatabase\.app)/i);
      if (match && match[0]) str = match[0];
      str = str.replace(/^https?:\/\//i, function(m) { return m.toLowerCase(); });
      if (!/^https?:\/\//i.test(str)) str = 'https://' + str;
      str = str.replace(/\/platoon_data\.json.*$/i, '').replace(/\/\.json.*$/i, '').replace(/\.json.*$/i, '').replace(/\/+$/, '');
      return str;
    }

    function sanitizeForFirebase(val) {
      if (val === undefined) return null;
      if (typeof val === 'number' && !isFinite(val)) return null;
      if (val === null || typeof val !== 'object') return val;
      if (Array.isArray(val)) return val.map(sanitizeForFirebase);
      var out = {};
      Object.keys(val).forEach(function(k) {
        var cleanKey = String(k).replace(/[.$#\[\]\/]/g, '_');
        if (!cleanKey) cleanKey = '_empty';
        out[cleanKey] = sanitizeForFirebase(val[k]);
      });
      return out;
    }

    function getOnlineCount() {
      var now = Date.now();
      var count = 0;
      ROLE_ORDER.forEach(function(rk) {
        var rec = fbPresenceMap[rk];
        if (rec && rec.lastSeen && (now - Number(rec.lastSeen)) <= 75000) count++;
      });
      if (fbStatus === 'online' && currentRole && count === 0) count = 1;
      return count;
    }

    function updateSyncPillUI() {
      var pill = document.getElementById('header-sync-pill');
      if (!pill) return;
      pill.className = 'sync-pill ' + (fbStatus === 'online' ? 'online' : fbStatus === 'offline' ? 'offline' : fbStatus === 'syncing' ? 'syncing' : '');
      if (fbStatus === 'online') {
        pill.textContent = '🟢 ' + getOnlineCount() + ' онлайн';
      } else if (fbStatus === 'offline') {
        pill.textContent = '🔴 Офлайн';
      } else if (fbStatus === 'syncing') {
        pill.textContent = '🔄 Синхр...';
      } else {
        pill.textContent = '⚪ Локально';
      }
    }

    function setFbDiag(type, text) {
      fbDiag = { type: type, text: text };
      var el = document.getElementById('fb-diag-box');
      if (el) {
        el.className = 'diag-box ' + (type === 'ok' ? 'diag-ok' : type === 'err' ? 'diag-err' : 'diag-info');
        el.textContent = text;

    function isUserActivelyEditing() {
      var a = document.activeElement;
      if (!a) return false;
      var tag = a.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    }

    function fbFetchJSON(url, options) {
      return fetch(url, options).then(function(resp) {
        return resp.text().then(function(txt) {
          var parsed = null;
          try { parsed = txt ? JSON.parse(txt) : null; } catch (e) {}
          if (!resp.ok) {
            var errMsg = (parsed && parsed.error) ? parsed.error : (txt || resp.statusText || 'Помилка сервера');
            return { ok: false, status: resp.status, message: 'HTTP ' + resp.status + ': ' + errMsg, data: parsed };
          }
          return { ok: true, status: resp.status, message: 'HTTP ' + resp.status + ' OK', data: parsed };
        });
      }).catch(function(err) {
        return { ok: false, status: 0, message: 'Мережа: ' + (err && err.message ? err.message : String(err)), data: null };
      });
    }

    function sendPresenceHeartbeat() {
      var base = normalizeFirebaseBaseUrl(fbUrl);
      if (!base || !currentRole) return;
      var meta = getRoleMeta(currentRole);
      var now = Date.now();
      fbPresenceMap[currentRole] = { role: currentRole, label: meta.label, lastSeen: now };
      fbFetchJSON(base + '/presence/' + currentRole + '.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role: currentRole, label: meta.label, lastSeen: now })
      }).then(function(res) {
        if (res.ok) updateSyncPillUI();
      });
    }

    function fetchPresenceMap() {
      var base = normalizeFirebaseBaseUrl(fbUrl);
      if (!base) return Promise.resolve();
      return fbFetchJSON(base + '/presence.json', { method: 'GET', cache: 'no-store' }).then(function(res) {
        if (res.ok && res.data && typeof res.data === 'object') {
          fbPresenceMap = res.data;
          updateSyncPillUI();
        }
      });
    }

    function openPresenceModal() {
      if (!fbUrl) {
        switchTab('settings');
        showToast('Підключіть Firebase у Налаштуваннях, щоб бачити, хто онлайн');
        return;
      }
      fetchPresenceMap().then(function() {
        var now = Date.now();
        var rows = ROLE_ORDER.map(function(rk) {
          var meta = ROLES_META[rk];
          var rec = fbPresenceMap[rk];
          var lastSeen = rec && rec.lastSeen ? Number(rec.lastSeen) : 0;
          var isOnline = lastSeen > 0 && (now - lastSeen) <= 75000;
          var statusText = 'Ще не заходив(ла)';
          if (isOnline) {
            statusText = 'Онлайн зараз';
          } else if (lastSeen > 0) {
            var mins = Math.max(1, Math.round((now - lastSeen) / 60000));
            if (mins < 60) statusText = 'Був(ла) ' + mins + ' хв тому';
            else if (mins < 1440) statusText = 'Був(ла) ' + Math.round(mins / 60) + ' год тому';
            else statusText = 'Був(ла) ' + Math.round(mins / 1440) + ' дн тому';
          }
          var isMe = rk === currentRole;
          return '<div class="presence-row">' +
            '<div class="row min0">' +
              '<span class="presence-dot ' + (isOnline ? 'on' : 'off') + '"></span>' +
              '<div class="min0">' +
                '<div class="fw-bold text-sm">' + esc(meta.label) + (isMe ? ' <span class="badge badge-ok">Ви</span>' : '') + '</div>' +
                '<div class="text-xs" style="color:' + (isOnline ? '#6ee7b7' : 'var(--muted)') + '">' + esc(statusText) + '</div>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');

        openModal(
          '<div class="modal-header">' +
            '<div class="modal-title">🟢 Хто зараз онлайн (' + getOnlineCount() + ')</div>' +
            '<button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button>' +
          '</div>' +
          '<div class="modal-body">' +
            '<div class="stack-sm">' + rows + '</div>' +
            '<button type="button" class="btn btn-sm btn-info btn-full" onclick="fbPullAll(true,false);closeModal()">🔄 Оновити дані з хмари</button>' +
          '</div>'
        );
      });
    }

    function onHeaderSyncPillClick() {
      if (!fbUrl) {
        switchTab('settings');
        showToast('Підключіть Firebase у Налаштуваннях');
        return;
      }
      openPresenceModal();
    }

    function fbPullAll(forceApply, silent) {
      var base = normalizeFirebaseBaseUrl(fbUrl);
      if (!base) {
        fbStatus = 'local';
        updateSyncPillUI();
        return Promise.resolve({ ok: false, message: 'URL не задано' });
      }
      if (!silent) {
        fbStatus = 'syncing';
        updateSyncPillUI();
      }
      return fbFetchJSON(base + '/platoon_data.json', { method: 'GET', cache: 'no-store' }).then(function(res) {
        if (!res.ok) {
          fbStatus = 'offline';
          updateSyncPillUI();
          setFbDiag('err', 'Помилка читання — ' + res.message);
          if (!silent) showToast('Помилка читання: ' + res.message, true);
          return res;
        }
        fbStatus = 'online';
        fbLastSyncText = fmtTimeNow();
        fetchPresenceMap();
        updateSyncPillUI();
        if (res.data === null) {
          setFbDiag('info', 'Підключено (HTTP 200). База порожня — натисніть «Завантажити мої дані в хмару».');
          return res;
        }
        var remoteTs = Number(res.data.updatedAt) || 0;
        var changed = false;
        if (forceApply || remoteTs > (Number(state.updatedAt) || 0)) {
          state = normalizeState(res.data);
          try { safeLSSet(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
          changed = true;
        }
        setFbDiag('ok', 'Онлайн (HTTP ' + res.status + '). Синхронізовано: ' + fbLastSyncText);
        if (changed && currentRole) {
          updateTasksBadge();
          if (!isUserActivelyEditing()) render();
        }
        if (!silent && forceApply) showToast('Дані завантажено з хмари (' + state.personnel.length + ' осіб)');
        return res;
      });
    }

    function fbPushAll(silent) {
      var base = normalizeFirebaseBaseUrl(fbUrl);
      if (!base) {
        if (!silent) showToast('Спочатку вкажіть посилання Firebase', true);
        return Promise.resolve({ ok: false, message: 'URL не задано' });
      }
      if (!silent) {
        fbStatus = 'syncing';
        updateSyncPillUI();
      }
      var payload = sanitizeForFirebase(state);
      return fbFetchJSON(base + '/platoon_data.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(function(res) {
        if (!res.ok) {
          fbStatus = 'offline';
          updateSyncPillUI();
          setFbDiag('err', 'Помилка запису — ' + res.message);
          if (!silent) showToast('Помилка запису: ' + res.message, true);
          return res;
        }
        fbStatus = 'online';
        fbLastSyncText = fmtTimeNow();
        updateSyncPillUI();
        setFbDiag('ok', 'Завантажено в хмару (HTTP ' + res.status + ') • ' + fbLastSyncText);
        if (!silent) showToast('Дані завантажено в хмару');
        return res;
      });
    }

    function fbConnectFromSettings() {
      var input = document.getElementById('set-fb-url');
      var clean = normalizeFirebaseBaseUrl(input ? input.value : '');
      if (!clean) {
        fbUrl = '';
        safeLSRemove(FB_URL_STORAGE_KEY);
        fbStatus = 'local';
        stopFbTimers();
        updateSyncPillUI();
        setFbDiag('info', 'Локальний режим (хмарну синхронізацію вимкнено).');
        showToast('Локальний режим');
        return;
      }
      fbUrl = clean;
      safeLSSet(FB_URL_STORAGE_KEY, fbUrl);
      if (input) input.value = fbUrl;
      startFbTimers();
      sendPresenceHeartbeat();
      fbPullAll(false, false).then(function(res) {

    function stopFbTimers() {
      if (fbPollTimer) clearInterval(fbPollTimer);

      fbHeartbeatTimer = null;
    }

    function startFbTimers() {
      stopFbTimers();
      if (!fbUrl) return;
      fbPollTimer = setInterval(function() {
        if (fbUrl && !document.hidden) fbPullAll(false, true);
      }, 15000);
      fbHeartbeatTimer = setInterval(function() {
        if (fbUrl && currentRole && !document.hidden) sendPresenceHeartbeat();

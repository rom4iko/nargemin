    // --- Резервне копіювання ---
    function buildBackupPayload() {
      return {
        app: 'pomichnyk_vzvodu',
        version: APP_VERSION,
        exportedAt: toDateTimeHuman(new Date()),
        groupNumber: state.groupNumber,
        squads: state.squads,
        soldiers: state.soldiers,
        dutyTypes: state.dutyTypes,
        duties: state.duties,
        tasks: state.tasks,
        rozkhid: state.rozkhid
      };
    }

    function downloadFile(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportBackupJSON() {
      const now = new Date();
      state.lastBackupAt = toDateTimeHuman(now);
      saveState();
      downloadFile(JSON.stringify(buildBackupPayload(), null, 2), `pomichnyk_vzvodu_backup_${toISODate(now)}.json`, 'application/json');
      render();
      showToast('Резервну копію JSON збережено');
    }

    function copyBackupText() {
      const now = new Date();
      const text = JSON.stringify(buildBackupPayload());
      if (copyToClipboard(text, 'Код резервної копії скопійовано')) {
        state.lastBackupAt = toDateTimeHuman(now);
        saveState();
        render();
      }
    }

    function parseAndValidateBackup(rawText) {
      const parsed = JSON.parse(rawText);
      if (!parsed || !Array.isArray(parsed.squads) || !Array.isArray(parsed.soldiers) || !Array.isArray(parsed.duties)) {
        throw new Error('Некоректна структура резервної копії');
      }
      return {
        groupNumber: typeof parsed.groupNumber === 'string' && parsed.groupNumber.trim() ? parsed.groupNumber : '223',
        squads: ensureGroupCmdSquad(parsed.squads),
        soldiers: parsed.soldiers.map(s => ({ ...s, status: normalizeSoldierStatus(s.status) })),
        dutyTypes: Array.isArray(parsed.dutyTypes) && parsed.dutyTypes.length
          ? parsed.dutyTypes
          : JSON.parse(JSON.stringify(DEFAULT_DUTY_TYPES)),
        duties: parsed.duties,
        tasks: Array.isArray(parsed.tasks) ? parsed.tasks : [],
        rozkhid: migrateRozkhidMap(parsed.rozkhid),
        lastBackupAt: state.lastBackupAt
      };
    }

    function confirmApplyBackup(validatedState) {
      showConfirm(
        'Відновити дані з резервної копії?',
        `Поточні дані будуть замінені. У копії: підрозділів — ${validatedState.squads.length}, о/с — ${validatedState.soldiers.length}, нарядів — ${validatedState.duties.length}, задач — ${validatedState.tasks.length}.`,
        'Відновити',
        () => {
          state = validatedState;
          saveState();
          render();
          showToast('Дані успішно відновлено');
        },
        false
      );
    }

    function handleImportJSONFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const validated = parseAndValidateBackup(e.target.result);
          confirmApplyBackup(validated);
        } catch (err) {
          showToast('Помилка: некоректний файл резервної копії', 'error');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    function openPasteBackupModal() {
      openModal(`
        <div class="modal-header">
          <div class="modal-title">Вставити резервну копію з тексту</div>
          <button class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <form class="modal-body" onsubmit="submitPasteBackup(event)">
          <div class="field">
            <label class="field-label" for="paste-backup-area">Вставте раніше скопійований код JSON:</label>
            <textarea id="paste-backup-area" class="textarea" style="min-height:130px;font-family:monospace;font-size:13px" required placeholder='{"app":"pomichnyk_vzvodu", ...}'></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Перевірити та відновити</button>
        </form>
      `);
      setTimeout(() => document.getElementById('paste-backup-area')?.focus(), 50);
    }

    function submitPasteBackup(e) {
      e.preventDefault();
      const raw = document.getElementById('paste-backup-area').value.trim();
      try {
        const validated = parseAndValidateBackup(raw);
        confirmApplyBackup(validated);
      } catch (err) {
        showToast('Помилка: некоректний код резервної копії', 'error');
      }
    }

    function exportCSV() {
      const y = ui.year;
      const m = ui.month;
      const header = ['Підрозділ / Відділення', 'ПІБ', 'Звання/Посада', 'Посада (КГ/КВ)', 'Статус', `За ${MONTHS_UK[m]} ${y}`, 'За весь час', 'Останній наряд'];
      const rows = [header];

      for (const sq of getOrderedSquads()) {
        const isKG = isGroupCmdSquad(sq);
        const members = sortSquadMembers(state.soldiers.filter(s => s.squadId === sq.id));
        for (const s of members) {
          const st = getSoldierStats(s.id, y, m);
          rows.push([
            sq.name,
            s.name,
            s.rank || '',
            isKG ? 'КГ' : (s.isCommander ? 'КВ' : ''),
            getStatusObj(s.status).label,
            st.monthCount,
            st.totalCount,
            formatDateShort(st.lastDate)
          ]);
        }
      }

      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
      downloadFile('\uFEFF' + csv, `oblik_naryadiv_${y}_${String(m + 1).padStart(2, '0')}.csv`, 'text/csv;charset=utf-8;');
      showToast('CSV-файл збережено');
    }

    function promptResetAllStep1() {
      showConfirm(
        'Очистити всі дані? (Крок 1 з 2)',
        'Будуть видалені всі бійці, графік нарядів, розхід та задачі. Рекомендуємо спочатку зберегти резервну копію.',
        'Продовжити',
        () => setTimeout(() => promptResetAllStep2(), 120),
        true
      );
    }

    function promptResetAllStep2() {
      showConfirm(
        'Точно видалити все? (Крок 2 з 2)',
        'Цю дію неможливо скасувати. Залишаться лише базові порожні підрозділи, види нарядів та номер групи 223.',
        'Так, очистити все',
        () => {
          state = createEmptyInitialState();
          saveState();
          render();
          showToast('Усі дані очищено');
        },
        true
      );
    }

    // =========================================================================
    // ГОЛОВНИЙ РЕНДЕР
    // =========================================================================
    function render() {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const activeNav = document.getElementById(`nav-${ui.activeTab}`);
      if (activeNav) activeNav.classList.add('active');

      const activeTasksCnt = state.tasks.filter(t => t.status !== 'done').length;
      const badge = document.getElementById('nav-tasks-badge');
      if (activeTasksCnt > 0) {
        badge.textContent = activeTasksCnt > 99 ? '99+' : activeTasksCnt;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      const main = document.getElementById('main-content');
      if (ui.activeTab === 'duties') {
        main.innerHTML = renderDutiesTab();
      } else if (ui.activeTab === 'tasks') {
        main.innerHTML = renderTasksTab();
      } else if (ui.activeTab === 'rozkhid') {
        main.innerHTML = renderRozkhidTab();
      } else if (ui.activeTab === 'personnel') {
        main.innerHTML = renderPersonnelTab();
      } else if (ui.activeTab === 'settings') {
        main.innerHTML = renderSettingsTab();
      }
    }

    // Ініціалізація при завантаженні
    loadState();
    render();
  </script>
</body>
</html>

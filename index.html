<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0e1318" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Помічник взводу</title>
  <style>
    /* =====================================================================
       БАЗОВІ ЗМІННІ ТА СКИДАННЯ (100% АВТОНОМНИЙ CSS БЕЗ ЗОВНІШНІХ CDN)
       ===================================================================== */
    :root {
      --bg: #0e1318;
      --card: #161d25;
      --card-2: #1c2530;
      --border: #273240;
      --text: #e8eef5;
      --muted: #8b99a8;
      --accent: #4d7c3f;
      --accent-bright: #5e964d;
      --accent-soft: rgba(94, 150, 77, 0.16);
      --green: #10b981;
      --blue: #3b82f6;
      --amber: #f59e0b;
      --red: #ef4444;
      --purple: #a855f7;
      --cyan: #06b6d4;
      --radius: 14px;
      --radius-sm: 10px;
      --nav-h: 66px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      overflow-x: hidden;
      min-height: 100vh;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      outline: none;
    }

    button {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    button:active {
      transform: scale(0.98);
    }

    /* Головний контейнер (mobile-first) */
    .app-shell {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(var(--nav-h) + 24px);
    }

    /* Верхня шапка */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(14, 19, 24, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid rgba(94, 150, 77, 0.45);
      color: #84cc16;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
    }

    /* Основний контент */
    .main-content {
      flex: 1;
      padding: 14px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Нижня навігація */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(22, 29, 37, 0.97);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .bottom-nav-inner {
      max-width: 600px;
      margin: 0 auto;
      height: var(--nav-h);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      position: relative;
      transition: color 0.15s;
    }

    .nav-btn.active {
      color: #4ade80;
    }

    .nav-btn.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 22%;
      right: 22%;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background: #4ade80;
    }

    .nav-badge {
      position: absolute;
      top: 7px;
      right: calc(50% - 21px);
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--amber);
      color: #111;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Картки та секції */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }

    .card-flush {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card-header {
      padding: 11px 14px;
      background: rgba(14, 19, 24, 0.6);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Підвкладки (сегментований перемикач) */
    .subtabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px;
    }

    .subtab-btn {
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      transition: all 0.15s;
    }

    .subtab-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* Горизонтальні вкладки-пілюлі */
    .pills-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .pills-row::-webkit-scrollbar { display: none; }

    .pill-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s;
      min-height: 36px;
    }

    .pill-btn.active {
      background: var(--card-2);
      color: #fff;
      border-color: var(--pill-color, #4ade80);
      box-shadow: inset 0 0 0 1px var(--pill-color, #4ade80);
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .pill-count {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    /* Кнопки */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      transition: background 0.15s, border-color 0.15s;
      min-height: 42px;
    }

    .btn-sm {
      padding: 7px 11px;
      font-size: 12px;
      min-height: 34px;
      border-radius: 8px;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-primary:hover { background: var(--accent-bright); }

    .btn-secondary {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #24303e; }

    .btn-danger {
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.22); }

    .btn-danger-solid {
      background: #dc2626;
      color: #fff;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      flex-shrink: 0;
    }
    .btn-icon:hover { color: #fff; background: var(--card-2); }
    .btn-icon.danger {
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.25);
    }

    .btn-full { width: 100%; }

    /* Поля вводу */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .input, .select, .textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 12px;
      font-size: 14px;
      color: #fff;
      transition: border-color 0.15s;
    }

    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--accent-bright);
    }

    .textarea {
      resize: vertical;
      min-height: 84px;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      color: var(--muted);
      pointer-events: none;
    }

    .search-wrap .input {
      padding-left: 38px;
      padding-right: 36px;
    }

    .search-clear {
      position: absolute;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Чекбокс-картка */
    .checkbox-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg);
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .checkbox-card input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #f59e0b;
      cursor: pointer;
    }

    /* Бейджі */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge-kv {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.45);
    }

    .badge-status-active { background: rgba(16, 185, 129, 0.14); color: #34d399; border-color: rgba(16, 185, 129, 0.3); }
    .badge-status-leave { background: rgba(59, 130, 246, 0.14); color: #60a5fa; border-color: rgba(59, 130, 246, 0.3); }
    .badge-status-medical { background: rgba(239, 68, 68, 0.14); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }
    .badge-status-trip { background: rgba(245, 158, 11, 0.14); color: #fbbf24; border-color: rgba(245, 158, 11, 0.3); }

    .badge-warn {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .badge-rec {
      background: rgba(34, 197, 94, 0.16);
      color: #86efac;
      border-color: rgba(34, 197, 94, 0.35);
    }

    /* Перемикач місяця */
    .month-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px;
    }

    .month-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #fff;
      text-align: center;
      flex: 1;
    }

    /* Календар */
    .cal-weekdays, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-weekdays {
      margin-bottom: 6px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }

    .cal-weekdays .wknd { color: rgba(251, 191, 36, 0.85); }

    .cal-cell {
      min-height: 48px;
      border-radius: 9px;
      background: rgba(14, 19, 24, 0.65);
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 5px 2px;
      transition: background 0.12s, border-color 0.12s;
    }

    .cal-cell:hover { background: var(--card-2); }

    .cal-cell.today {
      border-color: rgba(74, 222, 128, 0.55);
      background: rgba(34, 197, 94, 0.08);
    }

    .cal-cell.selected {
      background: rgba(94, 150, 77, 0.25);
      border-color: #4ade80;
      box-shadow: inset 0 0 0 1px #4ade80;
    }

    .cal-day-num {
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }

    .cal-cell.today .cal-day-num { color: #4ade80; }

    .cal-dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
      min-height: 8px;
      max-width: 100%;
    }

    .cal-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* Рядок бійця */
    .soldier-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-left: 4px solid var(--sq-color, #4ade80);
      border-bottom: 1px solid rgba(39, 50, 64, 0.65);
      background: var(--card);
    }
    .soldier-row:last-child { border-bottom: none; }
    .soldier-row.is-kv {
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.1) 0%, rgba(22, 29, 37, 1) 72%);
    }

    .soldier-info { min-width: 0; flex: 1; }

    .soldier-name-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .soldier-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .soldier-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* KPI сітка */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 8px;
      text-align: center;
    }

    .kpi-val {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
    }

    .kpi-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Смужка навантаження */
    .bar-track {
      height: 5px;
      background: var(--bg);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.25s;
    }

    /* Картка задачі */
    .task-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--sq-color, #8b99a8);
      border-radius: var(--radius);
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-card.status-done { opacity: 0.85; }

    .task-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .task-text {
      font-size: 14px;
      color: #fff;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
    }

    .task-card.status-done .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .task-status-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .status-tap-btn {
      padding: 9px 6px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      text-align: center;
      transition: all 0.15s;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-tap-btn.active-received {
      background: rgba(59, 130, 246, 0.2);
      border-color: #3b82f6;
      color: #93c5fd;
    }

    .status-tap-btn.active-done {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #6ee7b7;
    }

    .status-tap-btn.active-failed {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #fca5a5;
    }

    /* Блок зауважень під задачею */
    .note-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 10px;
      border-radius: 9px;
      background: rgba(14, 19, 24, 0.65);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .note-toggle-btn.has-note {
      border-color: rgba(245, 158, 11, 0.45);
      color: #fde68a;
    }

    .note-box {
      background: rgba(14, 19, 24, 0.8);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Палітра кольорів */
    .color-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .color-swatch {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid transparent;
      transition: transform 0.12s;
    }

    .color-swatch.selected {
      border-color: #fff;
      transform: scale(1.12);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25);
    }

    .chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Модальні вікна */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    @media (min-width: 560px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }

    .modal-backdrop.open { display: flex; }

    .modal-panel {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.18s ease-out;
    }

    @media (min-width: 560px) {
      .modal-panel { border-radius: 18px; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Сповіщення (Toast) */
    .toast-wrap {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 80;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      padding: 11px 14px;
      border-radius: 12px;
      background: #1d2834;
      border: 1px solid rgba(74, 222, 128, 0.55);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      animation: slideUp 0.18s ease-out;
    }

    .toast.error {
      background: #331619;
      border-color: rgba(239, 68, 68, 0.6);
      color: #fecaca;
    }

    /* Допоміжні утиліти */
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row-gap { display: flex; align-items: center; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .empty-state { text-align: center; padding: 26px 14px; color: var(--muted); font-size: 13px; }
    .text-xs { font-size: 11px; }
    .text-sm { font-size: 13px; }
    .text-muted { color: var(--muted); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Верхня шапка -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

          <div class="brand-title">Помічник взводу</div>

    <!-- Основний контент активної вкладки -->

    <!-- Нижня фіксована навігація (4 вкладки) -->

            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>

          <span>Наряди</span>

        <button class="nav-btn" id="nav-tasks" onclick="switchTab('tasks')">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>

          <span id="nav-tasks-badge" class="nav-badge hidden">0</span>

        <button class="nav-btn" id="nav-personnel" onclick="switchTab('personnel')">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

            <circle cx="9" cy="7" r="4"/>

            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>

        </button>

        <button class="nav-btn" id="nav-settings" onclick="switchTab('settings')">

            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>

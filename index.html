    function renderScheduleView() {
      var y = ui.year, m = ui.month, pref = monthPrefix(y, m), td = todayISO();
      var firstDay = new Date(y, m, 1), daysInMonth = new Date(y, m + 1, 0).getDate();
      var offset = firstDay.getDay() - 1; if (offset < 0) offset = 6;

      var filterPills = '<div class="pills-scroll">' +
        [{ id: 'all', name: 'Усі', color: '#4ade80' }].concat(getOrderedSquads()).map(function(sq) {
          return '<button class="pill ' + (ui.scheduleSquadFilter === sq.id ? 'active' : '') + '" onclick="setScheduleSquadFilter(\'' + sq.id + '\')">' +
            '<span class="dot" style="background:' + sq.color + '"></span><span>' + esc(sq.name) + '</span></button>';
        }).join('') + '</div>';

      var byDate = {};
      state.duties.forEach(function(d) {
        if (!d.date || d.date.indexOf(pref) !== 0) return;
        var s = getSoldierById(d.soldierId);
        if (!s || (ui.scheduleSquadFilter !== 'all' && s.squadId !== ui.scheduleSquadFilter)) return;
        if (!byDate[d.date]) byDate[d.date] = [];
        byDate[d.date].push(d);
      });

      var cells = '';
      for (var i = 0; i < offset; i++) cells += '<div></div>';
      for (var day = 1; day <= daysInMonth; day++) {
        var iso = pref + '-' + pad2(day);
        var list = byDate[iso] || [];
        var dots = list.slice(0, 4).map(function(d) {
          return '<span class="cal-dot" style="background:' + getDutyTypeById(d.dutyTypeId).color + '"></span>';
        }).join('');
        cells += '<button class="cal-cell' + (iso === ui.selectedDate ? ' selected' : '') + (iso === td ? ' today' : '') + '" onclick="selectCalDate(\'' + iso + '\')">' +
          '<span class="cal-num">' + day + '</span><div class="cal-dots">' + dots + '</div></button>';
      }

      var dayDuties = state.duties.filter(function(d) {
        if (d.date !== ui.selectedDate) return false;
        var s = getSoldierById(d.soldierId);
        return s && (ui.scheduleSquadFilter === 'all' || s.squadId === ui.scheduleSquadFilter);
      });

      var grouped = [], seen = {};
      state.dutyTypes.forEach(function(dt) {
        var items = dayDuties.filter(function(d) { return d.dutyTypeId === dt.id; });
        if (items.length) { grouped.push({ dt: dt, items: items }); seen[dt.id] = true; }
      });
      dayDuties.forEach(function(d) {
        if (!seen[d.dutyTypeId]) {
          grouped.push({ dt: getDutyTypeById(d.dutyTypeId), items: dayDuties.filter(function(x) { return x.dutyTypeId === d.dutyTypeId; }) });
          seen[d.dutyTypeId] = true;
        }
      });

      var dayListHtml = grouped.length === 0
        ? '<div class="empty-state">На ' + formatHumanDate(ui.selectedDate) + ' нарядів не призначено.</div>'
        : '<div class="stack">' + grouped.map(function(g) {
            return '<div class="stack-sm">' +
              '<div class="row-between"><div class="row"><span class="dot" style="background:' + g.dt.color + '"></span>' +
              '<span class="section-title" style="color:' + g.dt.color + '">' + esc(g.dt.shortName) + (g.dt.name && g.dt.name !== g.dt.shortName ? ' — ' + esc(g.dt.name) : '') + '</span></div>' +
              '<span class="text-xs text-muted">' + g.items.length + (g.dt.maxCount > 1 ? ' / ' + g.dt.maxCount : '') + ' ос.</span></div>' +
              g.items.map(function(d) {
                var s = getSoldierById(d.soldierId), sq = getSquadById(s.squadId);
                return '<div class="soldier-row" style="border-radius:10px;border:1px solid var(--border);border-left:4px solid ' + sq.color + '">' +
                  '<div class="min0"><div class="row wrap"><span class="soldier-name">' + esc(s.fullName) + '</span>' +
                  (isCmdGroup(sq) ? '<span class="badge badge-kg">★ КГ</span>' : (s.isLeader ? '<span class="badge badge-kv">★ КВ</span>' : '')) + '</div>' +
                  '<div class="text-xs text-muted">' + esc(sq.name) + (s.rank ? ' • ' + esc(s.rank) : '') + '</div></div>' +
                  (isAdmin() ? '<button class="btn-icon btn-icon-sm danger" onclick="removeDuty(\'' + d.id + '\')">✕</button>' : '') + '</div>';
              }).join('') + '</div>';
          }).join('') + '</div>';

      return renderMonthBar(true) + filterPills +
        '<div class="card"><div class="cal-weekdays">' +
          WEEKDAYS_UK.map(function(w, i) { return '<div class="' + (i >= 5 ? 'wknd' : '') + '">' + w + '</div>'; }).join('') +
        '</div><div class="cal-grid">' + cells + '</div></div>' +
        '<div class="card stack"><div class="row-between"><div><div class="fw-800" style="color:#fff">' + formatHumanDate(ui.selectedDate) + '</div>' +
        '<div class="text-xs text-muted">Призначено: ' + dayDuties.length + '</div></div>' +
        (isAdmin() ? '<button class="btn btn-sm btn-primary" onclick="openAssignDutyModal(\'' + ui.selectedDate + '\')">+ Призначити наряд</button>' : '') + '</div>' +
        dayListHtml +
        (dayDuties.length ? '<div class="grid-2"><button class="btn btn-secondary" onclick="openDayDutiesPreview(\'' + ui.selectedDate + '\')">Перегляд тексту</button>' +
          '<button class="btn btn-primary" onclick="copyDayDuties(\'' + ui.selectedDate + '\')">Скопіювати наряд</button></div>' : '') + '</div>';
    }

    function generateDayDutiesText(isoDate) {
      var dayDuties = state.duties.filter(function(d) {
        if (d.date !== isoDate) return false;
        var s = getSoldierById(d.soldierId);
        return s && (ui.scheduleSquadFilter === 'all' || s.squadId === ui.scheduleSquadFilter);
      });
      if (!dayDuties.length) return '';
      var grp = (state.groupNumber || '223').trim() || '223';
      var order = state.dutyTypes.slice();
      var known = {};
      order.forEach(function(dt) { known[dt.id] = true; });
      dayDuties.forEach(function(d) {
        if (!known[d.dutyTypeId]) { order.push(getDutyTypeById(d.dutyTypeId)); known[d.dutyTypeId] = true; }
      });
      var blocks = [];
      order.forEach(function(dt) {
        var items = dayDuties.filter(function(d) { return d.dutyTypeId === dt.id; });
        if (!items.length) return;
        var lines = [dt.shortName + ':'];
        items.forEach(function(d) {
          var s = getSoldierById(d.soldierId);
          if (s) lines.push('-' + (s.rank ? s.rank + ' ' : '') + s.fullName);
        });
        blocks.push(lines.join('\n'));
      });
      return grp + ', ' + formatDotDate(isoDate) + '\n' + blocks.join('\n\n');
    }

    function openDayDutiesPreview(isoDate) {
      var txt = generateDayDutiesText(isoDate); if (!txt) return;
      openModal(
        '<div class="modal-header"><div class="modal-title">Наряд на ' + formatDotDate(isoDate) + '</div><button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body"><pre class="preview-pre">' + esc(txt) + '</pre>' +
        '<button class="btn btn-primary btn-full" onclick="copyDayDuties(\'' + isoDate + '\'); closeModal();">Скопіювати наряд</button></div>'
      );
    }

    function copyDayDuties(isoDate) {
      var txt = generateDayDutiesText(isoDate);
      if (!txt) { showToast('На цю дату нарядів немає', 'error'); return; }
      copyText(txt, 'Наряд скопійовано');
    }

    function removeDuty(id) {
      if (!isAdmin()) return;
      state.duties = state.duties.filter(function(d) { return d.id !== id; });
      scheduleCloudPush();
      render(); showToast('Наряд видалено');
    }

    function openAssignDutyModal(isoDate) {
      if (!isAdmin()) return;
      if (!state.personnel.length) { showToast('Спочатку додайте бійців у «Склад»', 'error'); return; }
      assignModal = { date: isoDate, dutyTypeId: state.dutyTypes[0] ? state.dutyTypes[0].id : '', selectedIds: [] };
      renderAssignDutyModal();
    }

    function selectAssignDutyType(dtId) { assignModal.dutyTypeId = dtId; assignModal.selectedIds = []; renderAssignDutyModal(); }

    function toggleAssignSoldier(sid) {
      var dt = getDutyTypeById(assignModal.dutyTypeId);
      var maxC = Math.max(1, Number(dt.maxCount) || 1);
      var idx = assignModal.selectedIds.indexOf(sid);
      if (idx >= 0) assignModal.selectedIds.splice(idx, 1);
      else if (maxC === 1) assignModal.selectedIds = [sid];
      else if (assignModal.selectedIds.length >= maxC) { showToast('Для «' + dt.shortName + '» максимум ' + maxC + ' ос.', 'error'); return; }
      else assignModal.selectedIds.push(sid);
      renderAssignDutyModal();
    }

    function confirmAssignDuties() {
      if (!isAdmin()) return;
      if (!assignModal.dutyTypeId || !assignModal.selectedIds.length) { showToast('Оберіть військовослужбовця', 'error'); return; }
      assignModal.selectedIds.forEach(function(sid) {
        state.duties.push({ id: genId('d'), date: assignModal.date, soldierId: sid, dutyTypeId: assignModal.dutyTypeId });
      });
      var n = assignModal.selectedIds.length;
      scheduleCloudPush();
      closeModal(); render();
      showToast(n > 1 ? ('Призначено бійців: ' + n) : 'Наряд призначено');
    }

    function renderAssignDutyModal() {
      var p = assignModal.date.split('-').map(Number), y = p[0], m = p[1] - 1;
      var yest = addDaysISO(assignModal.date, -1);
      var dt = getDutyTypeById(assignModal.dutyTypeId);
      var maxC = Math.max(1, Number(dt.maxCount) || 1);
      var busyToday = {}, busyYest = {};
      state.duties.forEach(function(d) {
        if (d.date === assignModal.date) busyToday[d.soldierId] = true;
        if (d.date === yest) busyYest[d.soldierId] = true;
      });

      var groupsHtml = getOrderedSquads().map(function(sq) {
        var members = sortSquadPersonnel(state.personnel.filter(function(x) { return x.squadId === sq.id; }));
        if (!members.length) return '';
        return '<div class="stack-sm"><div class="row"><span class="dot" style="background:' + sq.color + '"></span>' +
          '<span class="section-title" style="color:' + sq.color + '">' + esc(sq.name) + '</span></div>' +
          members.map(function(s) {
            var st = getSoldierDutyStats(s.id, y, m), picked = assignModal.selectedIds.indexOf(s.id) !== -1, pm = getPresenceMeta(s.presenceStatus);
            return '<button type="button" class="soldier-row" onclick="toggleAssignSoldier(\'' + s.id + '\')" style="width:100%;text-align:left;border-radius:10px;border:1px solid ' + (picked ? '#4ade80' : 'var(--border)') + ';border-left:4px solid ' + sq.color + ';background:' + (picked ? 'rgba(74,222,128,0.12)' : 'var(--bg)') + '">' +
              '<div style="width:22px;height:22px;border-radius:6px;border:2px solid ' + (picked ? '#4ade80' : 'var(--border-strong)') + ';background:' + (picked ? '#4ade80' : 'transparent') + ';color:#0b1015;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0">' + (picked ? '✓' : '') + '</div>' +
              '<div class="min0"><div class="row wrap"><span class="soldier-name">' + esc(s.fullName) + '</span>' +
                (isCmdGroup(sq) ? '<span class="badge badge-kg">★ КГ</span>' : (s.isLeader ? '<span class="badge badge-kv">★ КВ</span>' : '')) +
                (!pm.isOk ? '<span class="badge badge-err">' + esc(pm.shortLabel) + '</span>' : '') +
                (busyToday[s.id] ? '<span class="badge badge-warn">Вже сьогодні</span>' : '') +
                (busyYest[s.id] ? '<span class="badge badge-info">Вчора в наряді</span>' : '') +
              '</div>' + (s.rank ? '<div class="text-xs text-muted">' + esc(s.rank) + '</div>' : '') + '</div>' +
              '<div style="text-align:right;flex-shrink:0"><div class="fw-800" style="color:#fff">' + st.monthCount + ' <span class="text-xs text-muted">міс</span></div>' +
              '<div class="text-xs text-muted">' + st.totalCount + ' всього</div></div></button>';
          }).join('') + '</div>';
      }).join('');

      openModal(
        '<div class="modal-header"><div><div class="modal-title">Призначити наряд</div><div class="text-xs text-muted">' + formatHumanDate(assignModal.date) + '</div></div>' +
        '<button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body">' +
          '<div class="field"><div class="field-label">1. Оберіть вид наряду:</div><div class="chips-wrap">' +
            state.dutyTypes.map(function(t) {
              return '<button type="button" class="btn btn-sm ' + (t.id === assignModal.dutyTypeId ? 'btn-primary' : 'btn-secondary') + '" onclick="selectAssignDutyType(\'' + t.id + '\')">' +
                '<span class="dot" style="background:' + t.color + '"></span><span>' + esc(t.shortName) + '</span><span class="text-xs" style="opacity:0.8">(до ' + t.maxCount + ')</span></button>';
            }).join('') + '</div></div>' +
          '<div class="row-between"><span class="field-label">2. Особовий склад:</span><span class="badge badge-ok">Обрано: ' + assignModal.selectedIds.length + ' / ' + maxC + '</span></div>' +
          '<div class="stack">' + groupsHtml + '</div>' +
          '<div style="position:sticky;bottom:0;background:var(--card);padding-top:10px;border-top:1px solid var(--border)">' +
            '<button class="btn btn-primary btn-full" onclick="confirmAssignDuties()">Призначити (' + assignModal.selectedIds.length + ' / ' + maxC + ')</button></div></div>'
      );
    }

    function renderStatsView() {
      var pref = monthPrefix(ui.year, ui.month);
      var monthTotal = state.duties.filter(function(d) { return d.date && d.date.indexOf(pref) === 0 && Boolean(getSoldierById(d.soldierId)); }).length;
      var avg = state.personnel.length ? (monthTotal / state.personnel.length).toFixed(1) : '0.0';

      var blocks = getOrderedSquads().map(function(sq) {
        var members = sortSquadPersonnel(state.personnel.filter(function(p) { return p.squadId === sq.id; }));
        if (!members.length) return '';
        return '<div class="card-flush"><div class="row-between" style="padding:10px 12px;background:rgba(11,16,21,0.55);border-left:4px solid ' + sq.color + '">' +
          '<span class="section-title" style="color:' + sq.color + '">' + esc(sq.name) + '</span><span class="text-xs text-muted">Міс. / Всього</span></div>' +
          members.map(function(s) {
            var st = getSoldierDutyStats(s.id, ui.year, ui.month);
            return '<button type="button" class="soldier-row" onclick="openSoldierHistoryModal(\'' + s.id + '\')" style="width:100%;text-align:left;border-bottom:1px solid var(--border)">' +
              '<div class="min0"><div class="row wrap"><span class="soldier-name">' + esc(s.fullName) + '</span>' +
              (isCmdGroup(sq) ? '<span class="badge badge-kg">★ КГ</span>' : (s.isLeader ? '<span class="badge badge-kv">★ КВ</span>' : '')) + '</div>' +
              '<div class="text-xs text-muted">Останній: ' + (st.lastDate ? formatDotDate(st.lastDate) : 'немає') + '</div></div>' +
              '<div class="row" style="gap:14px;flex-shrink:0">' +
                '<div style="text-align:right"><div class="fw-800" style="color:#fff">' + st.monthCount + '</div><div class="text-xs text-muted">міс.</div></div>' +
                '<div style="text-align:right"><div class="fw-800" style="color:var(--accent)">' + st.totalCount + '</div><div class="text-xs text-muted">всього</div></div>' +
              '</div></button>';
          }).join('') + '</div>';
      }).join('');

      return renderMonthBar(false) +
        '<div class="grid-2"><div class="kpi-box"><div class="kpi-val">' + monthTotal + '</div><div class="kpi-lbl">Всього нарядів за місяць</div></div>' +
        '<div class="kpi-box"><div class="kpi-val" style="color:var(--accent)">' + avg + '</div><div class="kpi-lbl">Середнє на бійця</div></div></div>' +
        (blocks || '<div class="card empty-state">Особовий склад ще не доданий.</div>');
    }

    function openSoldierHistoryModal(sid) {
      var s = getSoldierById(sid); if (!s) return;
      var sq = getSquadById(s.squadId), st = getSoldierDutyStats(s.id, ui.year, ui.month);
      var hist = state.duties.filter(function(d) { return d.soldierId === s.id; }).sort(function(a, b) { return b.date.localeCompare(a.date); });
      openModal(
        '<div class="modal-header"><div><div class="modal-title">' + esc(s.fullName) + '</div><div class="text-xs text-muted">' + esc(sq.name) + (s.rank ? ' • ' + esc(s.rank) : '') + '</div></div>' +
        '<button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body"><div class="grid-2">' +
          '<div class="kpi-box"><div class="kpi-val">' + st.monthCount + '</div><div class="kpi-lbl">' + MONTHS_UK[ui.month] + ' ' + ui.year + '</div></div>' +
          '<div class="kpi-box"><div class="kpi-val" style="color:var(--accent)">' + st.totalCount + '</div><div class="kpi-lbl">За весь час</div></div></div>' +
        '<div class="section-title text-muted">Історія нарядів (' + hist.length + ')</div>' +
        (hist.length ? '<div class="stack-sm">' + hist.map(function(d) {
          var dt = getDutyTypeById(d.dutyTypeId);
          return '<div class="row-between" style="padding:9px 11px;border-radius:10px;background:var(--bg);border:1px solid var(--border)">' +
            '<span class="text-sm fw-bold">' + formatHumanDate(d.date) + '</span>' +
            '<span class="badge" style="background:' + dt.color + '26;color:' + dt.color + ';border:1px solid ' + dt.color + '55">' + esc(dt.shortName) + '</span></div>';
        }).join('') + '</div>' : '<div class="empty-state">Історія нарядів порожня.</div>') + '</div>'
      );
    }

    // =========================================================================
    // 8. ВКЛАДКА 2: ЗАДАЧІ
    // =========================================================================
    function setTaskRecipientFilter(val) { ui.taskRecipientFilter = val; render(); }
    function setTaskStatusFilter(val) { ui.taskStatusFilter = val; render(); }

    function renderTasksTab() {
      var nonCmd = getOrderedSquads().filter(function(sq) { return !isCmdGroup(sq); });
      var formCard = '', recPills = '';

      if (isAdmin()) {
        var opts = nonCmd.map(function(sq) { return '<option value="squad:' + sq.id + '">' + esc(formatSquadRecipient(sq)) + '</option>'; }).join('') +
          '<option value="all_leaders">Усім командирам відділень</option>';
        formCard =
          '<form class="card stack" onsubmit="submitNewTask(event)">' +
            '<div class="section-title" style="color:var(--accent)">Поставити задачу</div>' +
            '<div class="field"><label class="field-label" for="task-rec">Кому</label><select id="task-rec" class="select">' + opts + '</select></div>' +
            '<div class="field"><label class="field-label" for="task-text">Суть задачі</label><textarea id="task-text" class="textarea" required placeholder="Опишіть задачу..."></textarea></div>' +
            '<div class="field"><label class="field-label" for="task-author">Хто поставив</label><input id="task-author" class="input" type="text" required placeholder="Введіть вручну..." /></div>' +
            '<button type="submit" class="btn btn-primary btn-full">Поставити задачу</button>' +
          '</form>';
        recPills = '<div class="pills-scroll">' +
          '<button class="pill ' + (ui.taskRecipientFilter === 'all' ? 'active' : '') + '" onclick="setTaskRecipientFilter(\'all\')">Усі</button>' +
          nonCmd.map(function(sq) {
            return '<button class="pill ' + (ui.taskRecipientFilter === sq.id ? 'active' : '') + '" onclick="setTaskRecipientFilter(\'' + sq.id + '\')">' +
              '<span class="dot" style="background:' + sq.color + '"></span><span>' + esc(formatSquadShortTab(sq)) + '</span></button>';
          }).join('') +
          '<button class="pill ' + (ui.taskRecipientFilter === 'all_leaders' ? 'active' : '') + '" onclick="setTaskRecipientFilter(\'all_leaders\')">Усім КВ</button></div>';
      } else {
        formCard = '<div class="info-banner">Показано задачі для <strong>' + esc(formatSquadRecipient(getSquadById(mySquadId()))) + '</strong> та загальні для всіх КВ.</div>';
      }

      var stPills = '<div class="pills-scroll">' +
        [{ id: 'all', l: 'Усі' }, { id: 'received', l: 'Отримав' }, { id: 'done', l: 'Виконано' }, { id: 'failed', l: 'Не виконано' }].map(function(f) {
          return '<button class="pill ' + (ui.taskStatusFilter === f.id ? 'active' : '') + '" onclick="setTaskStatusFilter(\'' + f.id + '\')">' + f.l + '</button>';
        }).join('') + '</div>';

      var filtered = state.tasks.filter(function(t) {
        if (!isAdmin()) {
          if (t.recipientType !== 'all_leaders' && !(t.recipientType === 'squad' && t.squadId === mySquadId())) return false;
        } else {
          if (ui.taskRecipientFilter === 'all_leaders' && t.recipientType !== 'all_leaders') return false;
          if (ui.taskRecipientFilter !== 'all' && ui.taskRecipientFilter !== 'all_leaders' && (t.recipientType !== 'squad' || t.squadId !== ui.taskRecipientFilter)) return false;
        }
        if (ui.taskStatusFilter !== 'all' && t.status !== ui.taskStatusFilter) return false;
        return true;
      });

      var listHtml = !filtered.length
        ? '<div class="card empty-state">Задач за обраним фільтром немає.</div>'
        : filtered.map(function(t) {
            var isAll = t.recipientType === 'all_leaders';
            var sq = isAll ? { color: '#eab308' } : getSquadById(t.squadId);
            var recLbl = isAll ? 'Усім командирам відділень' : formatSquadRecipient(sq);
            var rOpen = Boolean(ui.openTaskRemarks[t.id]), hasRem = Boolean(t.remark && t.remark.trim());
            return '<div class="task-card" style="border-left:4px solid ' + sq.color + '">' +
              '<div class="row-between"><div class="stack-sm" style="gap:3px">' +
                '<span class="badge" style="background:' + sq.color + '24;color:' + sq.color + ';border:1px solid ' + sq.color + '55;align-self:flex-start">' + esc(recLbl) + '</span>' +
                '<div class="text-xs text-muted">' + esc(t.createdAt) + ' • Поставив: <strong style="color:var(--text)">' + esc(t.author || '—') + '</strong></div></div>' +
                (isAdmin() ? '<button class="btn-icon btn-icon-sm danger" onclick="deleteTask(\'' + t.id + '\')">✕</button>' : '') + '</div>' +
              '<div style="font-size:14.5px;font-weight:600;color:#fff;white-space:pre-wrap">' + esc(t.text) + '</div>' +
              '<div class="status-group">' +
                '<button class="status-btn ' + (t.status === 'received' ? 'st-received' : '') + '" onclick="setTaskStatus(\'' + t.id + '\',\'received\')">Отримав задачу</button>' +
                '<button class="status-btn ' + (t.status === 'done' ? 'st-done' : '') + '" onclick="setTaskStatus(\'' + t.id + '\',\'done\')">Виконано</button>' +
                '<button class="status-btn ' + (t.status === 'failed' ? 'st-failed' : '') + '" onclick="setTaskStatus(\'' + t.id + '\',\'failed\')">Не виконано</button></div>' +
              '<button class="btn btn-sm btn-secondary btn-full" onclick="toggleTaskRemark(\'' + t.id + '\')">' +
                (rOpen ? '▾ Приховати зауваження' : '▸ Зауваження') + (hasRem ? ' <span class="badge badge-warn">Є запис</span>' : '') + '</button>' +
              (rOpen ? '<div class="stack-sm"><textarea id="rem-' + t.id + '" class="textarea" placeholder="Причина невиконання або зауваження...">' + esc(t.remark || '') + '</textarea>' +
                '<button type="button" class="btn btn-sm btn-primary btn-full" onclick="saveTaskRemarkBtn(\'' + t.id + '\')">Зберегти зауваження</button></div>' : '') +
            '</div>';
          }).join('');

      return formCard + recPills + stPills +
        (filtered.length ? '<button class="btn btn-sm btn-secondary btn-full" onclick="copyActiveTasks()">Скопіювати активні задачі</button>' : '') +
        listHtml;
    }

    function submitNewTask(e) {
      e.preventDefault();
      if (!isAdmin()) return;
      var rec = document.getElementById('task-rec').value;
      var text = document.getElementById('task-text').value.trim();
      var author = document.getElementById('task-author').value.trim();
      if (!text) return;
      var isAll = rec === 'all_leaders';
      state.tasks.unshift({
        id: genId('task'), recipientType: isAll ? 'all_leaders' : 'squad',
        squadId: isAll ? '' : rec.replace('squad:', ''), text: text, author: author,

    // =========================================================================
    // 9. ВКЛАДКА 3: РОЗХІД

    function getSurnameCounts() {
      var m = {};
      state.personnel.forEach(function(p) {
        var sn = (String(p.fullName || '').trim().split(/\s+/)[0] || '').toLowerCase();
        m[sn] = (m[sn] || 0) + 1;
      });
      return m;
    }

    function formatReportSurname(s, counts) {
      var parts = String(s.fullName || '').trim().split(/\s+/);
      var sn = parts[0] || '';
      return (counts[sn.toLowerCase()] > 1 && parts[1]) ? (sn + ' ' + parts[1].charAt(0).toUpperCase() + '.') : sn;
    }

    function computeRozkhid(iso) {
      var yest = addDaysISO(iso, -1);
      var todayDuty = {}, yestDuty = {};
      state.duties.forEach(function(d) {
        if (d.date === iso) todayDuty[d.soldierId] = true;
        if (d.date === yest) yestDuty[d.soldierId] = true;
      });
      var dayManual = state.rozkhidManual[iso] || {};
      var dayNumeric = state.rozkhidNumeric[iso] || {};
      var isCleared = Boolean(state.rozkhidCleared[iso]);
      var snCounts = getSurnameCounts();

      var schedMap = {};
      state.scheduledAbsences.forEach(function(a) {
        if (iso >= a.startDate && iso <= (a.endDate || a.startDate)) schedMap[a.soldierId] = a.category;
      });

      var statusBySoldier = {}, byCat = {};
      ROZKHID_CATS.forEach(function(c) { byCat[c.key] = []; });

      getOrderedSquads().forEach(function(sq) {
        sortSquadPersonnel(state.personnel.filter(function(p) { return p.squadId === sq.id; })).forEach(function(s) {
          var cat = 'in_service';
          if (dayManual[s.id]) {
            cat = dayManual[s.id] === '__present__' ? 'in_service' : dayManual[s.id];
          } else if (isCleared) {
            cat = 'in_service';
          } else if (schedMap[s.id]) {
            cat = schedMap[s.id];
          } else if (todayDuty[s.id]) {
            cat = 'n';
          } else if (yestDuty[s.id]) {
            cat = 'starodobovyi';
          } else if (PERM_ABSENT_KEYS[s.presenceStatus]) {
            cat = s.presenceStatus;
          }
          statusBySoldier[s.id] = cat;
          if (byCat[cat]) byCat[cat].push({ soldier: s, reportName: formatReportSurname(s, snCounts) });
        });
      });

      var totalAbsent = 0;
      var categories = ROZKHID_CATS.map(function(c) {
        var list = byCat[c.key] || [];
        var offset = Math.max(0, Number(dayNumeric[c.key] || 0));
        var count = list.length + offset;
        totalAbsent += count;
        return { key: c.key, label: c.label, hint: c.hint, kvEditable: c.kvEditable, soldiers: list, offset: offset, count: count };
      });

      var totalList = state.personnel.length;
      return { totalList: totalList, presentCount: Math.max(0, totalList - totalAbsent), totalAbsent: totalAbsent, categories: categories, statusBySoldier: statusBySoldier };
    }

    function generateRozkhidReport() {
      var data = computeRozkhid(ui.rozkhidDate);
      var lines = [(state.groupNumber || '223').trim() || '223', 'З/с - ' + data.totalList, 'Вн - ' + data.presentCount];
      data.categories.forEach(function(c) {
        if (ui.rozkhidHideZeros && c.count === 0) return;
        var line = c.label + ' - ' + c.count;
        if (ui.rozkhidShowNames && c.soldiers.length) {
          line += ' (' + c.soldiers.map(function(x) { return x.reportName; }).join(', ') + ')';
        }
        lines.push(line);
      });
      return lines.join('\n');
    }

    function adjustRozkhidOffset(k, d) {

      render();

    function connectFirebaseFromInput() {
      var inp = document.getElementById('fb-url-input');
      var url = normalizeFbUrl(inp ? inp.value : '');
      if (inp) inp.value = url;
      if (!url) {
        setFirebaseUrl('');
        setDiag('info', '⚪ Перемкнуто на локальний режим');
        stopLiveSync(); setSyncStatus('local');
        showToast('Локальний режим'); render(); return;
      }
      if (url.indexOf('https://') !== 0) {
        setDiag('err', '❌ Посилання має починатися з https://');
        showToast('Некоректне посилання', 'error'); render(); return;
      }
      setSyncStatus('syncing');
      setDiag('info', '⏳ Перевірка підключення до ' + url + '...');
      render();
      fetch(getPlatoonEndpoint(url))
        .then(function(r) {
          if (!r.ok) return parseFirebaseError(r).then(function(e) { throw new Error(e); });
          return r.json().then(function(data) { return { status: r.status, data: data }; });
        })
        .then(function(result) {
          setFirebaseUrl(url);
          lastSyncAt = formatDateTimeNow();
          setSyncStatus('online');
          if (result.data && typeof result.data === 'object' && (result.data.meta || result.data.personnel)) {
            applyRemoteSnapshot(result.data, true);
            setDiag('ok', '✅ Підключено (HTTP ' + result.status + '). Дані завантажено з хмари');
            showToast('Підключено! Дані завантажено з хмари');
          } else {
            setDiag('ok', '✅ Підключено (HTTP ' + result.status + '). База порожня — натисніть «Завантажити мої дані в хмару»');
            showToast('Підключено! Тепер завантажте дані в хмару');
          }
          startLiveSync(); render();
        })
        .catch(function(err) {
          var msg = (err && err.message) ? err.message : 'Помилка підключення';
          setSyncStatus('offline');
          setDiag('err', '❌ Помилка підключення (' + msg + ')');
          showToast(msg, 'error'); render();
        });
    }

    function pushLocalToCloudPrompt() {
      if (!getFirebaseUrl()) { showToast('Спочатку підключіть посилання Firebase', 'error'); return; }
      showConfirm(
        'Завантажити дані в хмару?',
        'Усі поточні бійці, графік нарядів, задачі, розхід і PIN-коди з цього телефону будуть записані у Firebase.',
        'Завантажити в хмару',
        function() {
          fbPushAll(false).then(function(res) {
            showToast(res.ok ? 'Дані успішно завантажено в Firebase!' : ('Помилка: ' + (res.error || '')), res.ok ? 'success' : 'error');
            render();
          });
        },
        false
      );
    }

    function pullCloudToLocal() {
      if (!getFirebaseUrl()) { showToast('Спочатку підключіть посилання Firebase', 'error'); return; }
      fbPullAll(false, true).then(function(res) {
        showToast(res.ok ? 'Дані завантажено з хмари' : ('Помилка: ' + (res.error || '')), res.ok ? 'success' : 'error');
        render();
      });
    }

    function copyInviteLinkForKV() {
      var fbUrl = getFirebaseUrl();
      if (!fbUrl) { showToast('Спочатку підключіть базу Firebase', 'error'); return; }
      var link = window.location.origin + window.location.pathname + '?fb=' + encodeURIComponent(fbUrl);
      copyText(link, 'Посилання для КВ скопійовано!');
    }

    function savePinsFromForm() {
      var pAdmin = (document.getElementById('pin-admin').value || '').trim();
      var p1 = (document.getElementById('pin-sq1').value || '').trim();
      var p2 = (document.getElementById('pin-sq2').value || '').trim();
      var p3 = (document.getElementById('pin-sq3').value || '').trim();
      var all = [pAdmin, p1, p2, p3];
      for (var i = 0; i < all.length; i++) {
        if (!/^\d{4}$/.test(all[i])) { showToast('Кожен PIN має складатися рівно з 4 цифр', 'error'); return; }
      }
      if (new Set(all).size < 4) { showToast('Усі 4 PIN-коди мають бути різними', 'error'); return; }
      state.pins = { admin: pAdmin, sq1: p1, sq2: p2, sq3: p3 };
      scheduleCloudPush();
      showToast('PIN-коди збережено та синхронізовано');
    }

    function pickColor(c) {
      tempColor = c;
      document.querySelectorAll('.color-swatch').forEach(function(el) {
        el.classList.toggle('selected', el.getAttribute('data-c') === c);
      });
    }
    function renderColorSwatches(selected) {
      tempColor = selected || PALETTE[0];
      return '<div class="color-row">' + PALETTE.map(function(c) {
        return '<button type="button" class="color-swatch ' + (c === tempColor ? 'selected' : '') + '" data-c="' + c + '" style="background:' + c + '" onclick="pickColor(\'' + c + '\')"></button>';
      }).join('') + '</div>';
    }

    function openDutyTypeModal(dtId) {
      if (!isAdmin()) return;
      var ex = dtId ? state.dutyTypes.find(function(x) { return x.id === dtId; }) : null;
      openModal(
        '<div class="modal-header"><div class="modal-title">' + (ex ? 'Редагувати вид наряду' : 'Новий вид наряду') + '</div><button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<form class="modal-body" onsubmit="saveDutyType(event,\'' + (dtId || '') + '\')">' +
          '<div class="field"><label class="field-label">Скорочення (для звіту)</label><input id="dt-short" class="input" required placeholder="ЧК, Дн, КПП..." value="' + esc(ex ? ex.shortName : '') + '" /></div>' +
          '<div class="field"><label class="field-label">Повна назва</label><input id="dt-full" class="input" placeholder="Черговий курсу" value="' + esc(ex ? ex.name : '') + '" /></div>' +
          '<div class="field"><label class="field-label">Макс. кількість людей (1–10)</label><input id="dt-max" class="input" type="number" min="1" max="10" required value="' + (ex ? ex.maxCount : 1) + '" /></div>' +
          '<div class="field"><label class="field-label">Колір мітки</label>' + renderColorSwatches(ex ? ex.color : '#38bdf8') + '</div>' +
          '<button type="submit" class="btn btn-primary btn-full">Зберегти</button></form>'
      );
    }

    function saveDutyType(e, dtId) {
      e.preventDefault();
      if (!isAdmin()) return;
      var shortName = document.getElementById('dt-short').value.trim();
      var name = document.getElementById('dt-full').value.trim() || shortName;
      var maxCount = Math.min(10, Math.max(1, Number(document.getElementById('dt-max').value) || 1));
      if (!shortName) return;
      if (dtId) {
        var dt = state.dutyTypes.find(function(x) { return x.id === dtId; });
        if (dt) { dt.shortName = shortName; dt.name = name; dt.maxCount = maxCount; dt.color = tempColor; }
      } else {
        state.dutyTypes.push({ id: genId('dt'), shortName: shortName, name: name, maxCount: maxCount, color: tempColor });
      }
      scheduleCloudPush(); closeModal(); render(); showToast('Вид наряду збережено');
    }

    function deleteDutyType(dtId) {
      if (!isAdmin() || state.dutyTypes.length <= 1) return;
      state.dutyTypes = state.dutyTypes.filter(function(x) { return x.id !== dtId; });
      scheduleCloudPush(); render(); showToast('Вид наряду видалено');
    }

    function openSquadModal(sqId) {
      if (!isAdmin()) return;
      var ex = sqId ? state.squads.find(function(x) { return x.id === sqId; }) : null;
      openModal(
        '<div class="modal-header"><div class="modal-title">' + (ex ? 'Редагувати відділення' : 'Нове відділення') + '</div><button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<form class="modal-body" onsubmit="saveSquad(event,\'' + (sqId || '') + '\')">' +
          '<div class="field"><label class="field-label">Назва</label><input id="sq-name" class="input" required placeholder="4-те відділення" value="' + esc(ex ? ex.name : '') + '" /></div>' +
          '<div class="field"><label class="field-label">Колір</label>' + renderColorSwatches(ex ? ex.color : '#a855f7') + '</div>' +
          '<button type="submit" class="btn btn-primary btn-full">Зберегти</button></form>'
      );
    }

    function saveSquad(e, sqId) {
      e.preventDefault();
      if (!isAdmin()) return;
      var name = document.getElementById('sq-name').value.trim(); if (!name) return;
      if (sqId) {
        var sq = state.squads.find(function(x) { return x.id === sqId; });
        if (sq) { sq.name = name; sq.color = tempColor; }
      } else {
        var nid = genId('sq');
        state.squads.push({ id: nid, name: name, color: tempColor, isCmdGroup: false });
        ui.openPersonnelSquads[nid] = true;
      }
      scheduleCloudPush(); closeModal(); render(); showToast('Відділення збережено');
    }

    function downloadFile(content, filename, mime) {
      var blob = new Blob([content], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    }

    function exportBackupJSON() {
      state.lastBackupAt = formatDateTimeNow(); saveLocalState();
      downloadFile(JSON.stringify(state, null, 2), 'pomichnyk_vzvodu_backup_' + todayISO() + '.json', 'application/json');
      render(); showToast('Бекап збережено у файл');
    }

    function handleImportJSON(e) {
      var file = e.target.files && e.target.files[0]; if (!file) return;
      var r = new FileReader();
      r.onload = function(ev) {
        try {
          state = normalizeState(JSON.parse(ev.target.result));
          scheduleCloudPush();
          render(); showToast('Дані відновлено з файлу');
        } catch (err) { showToast('Некоректний файл резервної копії', 'error'); }
        finally { e.target.value = ''; }
      };
      r.readAsText(file);
    }

    function copyBackupAsText() {
      state.lastBackupAt = formatDateTimeNow(); saveLocalState();
      copyText(JSON.stringify(state), 'Бекап скопійовано як текст');
      render();
    }

    function openRestoreTextModal() {
      openModal(
        '<div class="modal-header"><div class="modal-title">Відновити з тексту</div><button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body"><textarea id="restore-txt" class="textarea" style="min-height:130px" placeholder="Вставте сюди скопійований текст резервної копії..."></textarea>' +
        '<button class="btn btn-primary btn-full" onclick="restoreFromText()">Відновити дані</button></div>'
      );
    }

    function restoreFromText() {
      var raw = (document.getElementById('restore-txt').value || '').trim();
      try {
        state = normalizeState(JSON.parse(raw));
        scheduleCloudPush();
        closeModal(); render(); showToast('Дані успішно відновлено');
      } catch (err) { showToast('Помилка: некоректний формат тексту', 'error'); }
    }

    function exportMonthlyCSV() {
      var rows = [['Відділення', 'ПІБ', 'Звання', 'Статус', 'За ' + MONTHS_UK[ui.month] + ' ' + ui.year, 'Всього', 'Останній наряд']];
      getOrderedSquads().forEach(function(sq) {
        sortSquadPersonnel(state.personnel.filter(function(p) { return p.squadId === sq.id; })).forEach(function(s) {
          var st = getSoldierDutyStats(s.id, ui.year, ui.month);
          rows.push([sq.name, s.fullName, s.rank || '', getPresenceMeta(s.presenceStatus).fullLabel, st.monthCount, st.totalCount, st.lastDate ? formatDotDate(st.lastDate) : '']);
        });
      });
      var csv = '\uFEFF' + rows.map(function(r) {
        return r.map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(';');
      }).join('\r\n');
      downloadFile(csv, 'oblik_' + ui.year + '_' + pad2(ui.month + 1) + '.csv', 'text/csv;charset=utf-8;');
      showToast('CSV-файл експортовано');
    }

    function promptResetStep1() {
      if (!isAdmin()) return;
      showConfirm('Очистити всі дані? (Крок 1/2)', 'Буде видалено весь особовий склад, графік нарядів, задачі та розхід.', 'Продовжити', function() {
        showConfirm('Точно видалити все? (Крок 2/2)', 'Цю дію неможливо скасувати, якщо у вас немає резервної копії.', 'Так, очистити все', function() {
          var keepPins = state.pins;
          state = createFreshState();
          state.pins = keepPins;
          scheduleCloudPush();
          render(); showToast('Усі дані очищено');
        }, true);
      }, true);
    }

    // =========================================================================
    // 12. ГОЛОВНИЙ РЕНДЕР ТА ЗАПУСК
    // =========================================================================
    function render() {
      if (!sessionRole) return;
      updateSyncPillUI();
      document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
      var act = document.getElementById('nav-' + ui.activeTab);
      if (act) act.classList.add('active');

      var main = document.getElementById('main-content');
      if (!main) return;
      if (ui.activeTab === 'duties') main.innerHTML = renderDutiesTab();
      else if (ui.activeTab === 'tasks') main.innerHTML = renderTasksTab();
      else if (ui.activeTab === 'rozkhid') main.innerHTML = renderRozkhidTab();
      else if (ui.activeTab === 'personnel') main.innerHTML = renderPersonnelTab();
      else if (ui.activeTab === 'settings') main.innerHTML = renderSettingsTab();
    }

    function boot() {
      initFirebaseUrlFromQuery();
      loadLocalState();
      var savedRole = getSavedSessionRole();
      if (savedRole) {
        enterAppWithRole(savedRole);
      } else {
        document.getElementById('pin-screen').classList.remove('hidden');
        renderPinScreen();
        fbPreloadBeforeLogin().then(function() { renderPinScreen(); });
      }
    }

    boot();
  </script>
</body>
</html>

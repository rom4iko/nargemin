<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Помічник взводу" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1117'/%3E%3Cpath d='M32 10L50 18V32C50 43.5 42.2 52 32 55C21.8 52 14 43.5 14 32V18L32 10Z' fill='%23131c26' stroke='%2310b981' stroke-width='3'/%3E%3Cpath d='M32 20L35.2 27.2L43 28L37 33.2L38.8 41L32 36.8L25.2 41L27 33.2L21 28L28.8 27.2L32 20Z' fill='%23f59e0b'/%3E%3C/svg%3E" />
  <title>Помічник взводу v3.3.1</title>
  <style>
    /* =========================================================================
       ТЕМНА ТАКТИЧНА ТЕМА (MOBILE-FIRST, SAFE-AREA IPHONE / ANDROID)
       ========================================================================= */
    :root {
      --bg: #0b1117;
      --bg-elev: #101822;
      --card: #131c26;
      --card-hover: #1b2736;
      --border: #233244;
      --border-strong: #32465e;
      --text: #f1f5f9;
      --muted: #8ea1b8;
      --emerald: #10b981;
      --emerald-dark: #059669;
      --amber: #f59e0b;
      --blue: #38bdf8;
      --danger: #ef4444;
      --radius: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px; line-height: 1.4;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font-family: inherit; font-size: 14px; color: var(--text); }
    button { cursor: pointer; border: none; background: none; padding: 0; }
    input[type="date"] { color-scheme: dark; }

    /* Аварійний банер помилок */
    #fatal-error-bar {
      display: none; position: fixed; top: calc(6px + var(--safe-top)); left: 10px; right: 10px; z-index: 9999;
      background: #3b1219; border: 1.5px solid var(--danger); border-radius: 12px;
      padding: 10px 12px; color: #fecaca; font-size: 12.5px; box-shadow: 0 10px 28px rgba(0,0,0,0.6);
    }

    /* Екран входу за PIN-кодом */
    .pin-screen {
      min-height: 100vh; max-width: 440px; margin: 0 auto;
      padding: calc(28px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    }
    .pin-logo {
      width: 66px; height: 66px; border-radius: 18px;
      background: rgba(16, 185, 129, 0.14); border: 1.5px solid rgba(16, 185, 129, 0.5);
      color: var(--emerald); display: flex; align-items: center; justify-content: center;
    }
    .pin-dots { display: flex; gap: 16px; justify-content: center; margin: 4px 0; }
    .pin-dot {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid var(--border-strong); background: transparent; transition: all 0.14s ease;
    }
    .pin-dot.filled { background: var(--emerald); border-color: var(--emerald); transform: scale(1.1); }
    .pin-dot.err { background: var(--danger); border-color: var(--danger); }
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 280px; }
    .num-key {
      height: 60px; border-radius: 16px; background: var(--card); border: 1px solid var(--border);
      color: #fff; font-size: 22px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; transition: background 0.1s, transform 0.08s;
    }
    .num-key:active { background: var(--card-hover); transform: scale(0.95); }
    .num-key.fn { font-size: 14px; font-weight: 700; color: var(--muted); background: var(--bg-elev); }

    /* Головна оболонка */
    .app {
      max-width: 620px; margin: 0 auto; min-height: 100vh;
      display: flex; flex-direction: column; padding-bottom: calc(86px + var(--safe-bottom));
    }
    .header {
      position: sticky; top: 0; z-index: 30;
      padding: calc(8px + var(--safe-top)) 12px 8px;
      background: rgba(11, 17, 23, 0.94);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brand-icon {
      width: 34px; height: 34px; border-radius: 10px;
      background: rgba(16, 185, 129, 0.14); border: 1px solid rgba(16, 185, 129, 0.45);
      color: var(--emerald); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .brand-title { font-size: 14.5px; font-weight: 800; color: #fff; line-height: 1.15; white-space: nowrap; }
    .header-meta { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
    .role-pill {
      font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px;
      background: rgba(16, 185, 129, 0.16); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); white-space: nowrap;
    }
    .role-pill.kg { background: rgba(245, 158, 11, 0.18); color: #fde68a; border-color: rgba(245, 158, 11, 0.4); }
    .role-pill.kv { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.4); }

    .sync-pill {
      font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; min-height: 36px;
    }
    .sync-pill.online { border-color: rgba(16, 185, 129, 0.55); color: #6ee7b7; background: rgba(16, 185, 129, 0.12); }
    .sync-pill.offline { border-color: rgba(239, 68, 68, 0.5); color: #fca5a5; background: rgba(239, 68, 68, 0.1); }
    .sync-pill.syncing { border-color: rgba(56, 189, 248, 0.5); color: #7dd3fc; }

    .main { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }

    /* Нижня навігація */
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      background: rgba(16, 24, 34, 0.97);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border); padding-bottom: var(--safe-bottom);
    }
    .nav-inner { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: 64px; }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; font-size: 10.5px; font-weight: 700; color: var(--muted); min-height: 44px;
    }
    .nav-btn.active { color: var(--emerald); }
    .nav-icon-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
    .nav-badge {
      position: absolute; top: -6px; right: -10px;
      min-width: 18px; height: 18px; padding: 0 4px;
      border-radius: 999px; background: var(--danger); color: #ffffff;
      border: 2px solid #101822; font-size: 10px; font-weight: 800; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.5);
    }

    /* Картки, сітки, типографіка */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px; }
    .card-flush { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .stack-sm { display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .wrap { flex-wrap: wrap; }
    .min0 { min-width: 0; flex: 1; }
    .text-xs { font-size: 12px; }
    .text-sm { font-size: 13.5px; }
    .text-muted { color: var(--muted); }
    .fw-bold { font-weight: 700; }
    .fw-800 { font-weight: 800; }
    .section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: #cbd5e1; }
    .empty-state { text-align: center; padding: 18px 12px; color: var(--muted); font-size: 13.5px; }
    .info-banner {
      padding: 9px 12px; border-radius: 11px; font-size: 12px; color: #bae6fd;
      background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* Кнопки та поля вводу */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 44px; padding: 9px 14px; border-radius: 11px;
      font-weight: 700; font-size: 13.5px; text-align: center; transition: transform 0.08s, background 0.12s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-sm { min-height: 38px; padding: 6px 11px; font-size: 12.5px; border-radius: 9px; }
    .btn-xs { min-height: 34px; padding: 4px 9px; font-size: 11.5px; border-radius: 8px; }
    .btn-full { width: 100%; }
    .btn-primary { background: var(--emerald-dark); color: #fff; }
    .btn-secondary { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); }
    .btn-info { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.35); }
    .btn-warn { background: rgba(245, 158, 11, 0.16); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.4); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.38); }

    .btn-icon {
      width: 44px; height: 44px; border-radius: 10px; background: var(--bg-elev);
      border: 1px solid var(--border); color: var(--text);
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px;
    }
    .btn-icon-sm { width: 36px; height: 36px; border-radius: 9px; font-size: 13px; }
    .btn-icon.danger { background: rgba(239, 68, 68, 0.14); border-color: rgba(239, 68, 68, 0.35); color: #fca5a5; }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field-label { font-size: 12px; font-weight: 700; color: var(--muted); }
    .input, .select, .textarea {
      width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border); color: #fff; outline: none;
    }
    .input-sm, .select-sm { min-height: 38px; padding: 6px 10px; font-size: 13px; }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--emerald); }
    .textarea { min-height: 76px; resize: vertical; }

    /* Фільтри, бейджі, чіпи */
    .pills-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .pills-scroll::-webkit-scrollbar { display: none; }
    .pill {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
      min-height: 36px; padding: 6px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 700; background: var(--card); border: 1px solid var(--border); color: var(--muted);
    }
    .pill.active { background: var(--emerald-dark); border-color: var(--emerald-dark); color: #fff; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .badge {
      display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px;
      border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .badge-kg { background: rgba(245, 158, 11, 0.2); color: #fde047; border: 1px solid rgba(245, 158, 11, 0.45); }
    .badge-kv { background: rgba(56, 189, 248, 0.2); color: #93c5fd; border: 1px solid rgba(56, 189, 248, 0.4); }
    .badge-ok { background: rgba(16, 185, 129, 0.16); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.35); }
    .badge-info { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.35); }
    .badge-warn { background: rgba(245, 158, 11, 0.18); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.38); }
    .badge-err { background: rgba(239, 68, 68, 0.18); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.38); }
    .badge-muted { background: rgba(148, 163, 184, 0.14); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.28); }

    .name-chip {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px;
      border-radius: 7px; font-size: 11px; font-weight: 600;
      background: var(--bg-elev); border: 1px solid var(--border); color: #cbd5e1;
    }

    /* Календар нарядів */
    .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-bottom: 5px; }
    .cal-weekdays div { font-size: 11px; font-weight: 700; color: var(--muted); }
    .cal-weekdays .wknd { color: #fbbf24; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-cell {
      height: 48px; border-radius: 9px; border: 1px solid transparent;
      background: rgba(11, 17, 23, 0.72); color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 4px 2px;
    }
    .cal-cell.today { border-color: rgba(16, 185, 129, 0.65); }
    .cal-cell.selected { background: rgba(16, 185, 129, 0.26); border-color: var(--emerald); color: #fff; }
    .cal-num { font-size: 12.5px; font-weight: 700; line-height: 1; }
    .cal-bottom { display: flex; align-items: center; gap: 2px; min-height: 12px; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; }
    .cal-cnt { font-size: 9.5px; font-weight: 800; color: #6ee7b7; }

    /* Картки типів нарядів */
    .duty-type-card {
      background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 11px; border-left-width: 4px; display: flex; flex-direction: column; gap: 8px;
    }
    .picker-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; border-radius: 11px; background: var(--bg); border: 1px solid var(--border);
      cursor: pointer; transition: border-color 0.12s, background 0.12s;
    }
    .picker-row.assigned { background: rgba(16, 185, 129, 0.14); border-color: var(--emerald); }
    .picker-row:active { background: var(--card-hover); }

    /* Розхід: KPI та швидкий редактор категорій */
    .kpi-box { background: var(--card); border: 1px solid var(--border); border-radius: 11px; padding: 9px 6px; text-align: center; }
    .kpi-val { font-size: 19px; font-weight: 800; color: #fff; line-height: 1.1; }
    .kpi-lbl { font-size: 10.5px; color: var(--muted); margin-top: 3px; font-weight: 600; }

    .cat-row {
      background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 11px; display: flex; flex-direction: column; gap: 7px;
    }
    .cat-row.overridden { border-color: rgba(245, 158, 11, 0.55); }
    .stepper { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .step-btn {
      width: 36px; height: 36px; border-radius: 9px; background: var(--card); border: 1px solid var(--border-strong);
      color: #fff; font-size: 18px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center;
    }
    .step-btn:active { background: var(--emerald-dark); border-color: var(--emerald); }
    .step-val {
      min-width: 30px; text-align: center; font-size: 16px; font-weight: 800; color: #fff;
    }
    .step-val.manual { color: #fde047; }

    /* Акордеони, таблиці, списки */
    .acc-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      min-height: 46px; padding: 10px 12px; background: rgba(11, 17, 23, 0.65); cursor: pointer; user-select: none;
    }
    .chevron { display: inline-block; transition: transform 0.16s; color: var(--muted); flex-shrink: 0; font-size: 12px; }
    .acc-header.open .chevron { transform: rotate(90deg); color: #fff; }
    .acc-body { border-top: 1px solid var(--border); }

    .soldier-item { border-bottom: 1px solid var(--border); background: var(--bg); }
    .soldier-item:last-child { border-bottom: none; }
    .soldier-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      min-height: 48px; padding: 9px 12px; cursor: pointer;
    }
    .soldier-expand { padding: 10px 12px 12px; background: rgba(19, 28, 38, 0.85); border-top: 1px dashed var(--border); }

    .checkbox-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      min-height: 46px; padding: 9px 12px; background: var(--bg); border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .checkbox-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--emerald); flex-shrink: 0; }

    /* Задачі */
    .task-card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 13px; display: flex; flex-direction: column; gap: 9px;
    }
    .status-group-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .status-btn {
      min-height: 36px; padding: 5px 4px; border-radius: 9px; font-size: 11.5px; font-weight: 700;
      background: var(--bg); border: 1px solid var(--border); color: var(--muted); text-align: center;
    }
    .status-btn.st-in_progress { background: rgba(56, 189, 248, 0.2); border-color: var(--blue); color: #7dd3fc; }
    .status-btn.st-done { background: rgba(16, 185, 129, 0.22); border-color: var(--emerald); color: #6ee7b7; }
    .status-btn.st-failed { background: rgba(239, 68, 68, 0.22); border-color: var(--danger); color: #fca5a5; }

    .preview-pre {
      margin: 0; padding: 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px; white-space: pre-wrap; word-break: break-word; line-height: 1.48;
    }

    .toggle-pill {
      display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 7px 10px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .toggle-pill input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--emerald); flex-shrink: 0; }
    .perm-block {
      padding: 10px; border-radius: 11px; background: var(--bg); border: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }
    .diag-box { padding: 9px 11px; border-radius: 10px; font-size: 12px; line-height: 1.4; word-break: break-word; }
    .diag-ok { background: rgba(16, 185, 129, 0.14); border: 1px solid rgba(16, 185, 129, 0.4); color: #a7f3d0; }
    .diag-err { background: rgba(239, 68, 68, 0.18); border: 1px solid rgba(239, 68, 68, 0.45); color: #fecaca; }
    .diag-info { background: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.4); color: #bae6fd; }

    /* Presence */
    .presence-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; border-radius: 11px; background: var(--bg); border: 1px solid var(--border);
    }
    .presence-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .presence-dot.on { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.75); }
    .presence-dot.off { background: #475569; }

    /* Таблиця обліку нарядів */
    .stats-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .stats-table th, .stats-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); text-align: left; }
    .stats-table th { color: var(--muted); font-size: 11px; font-weight: 700; background: var(--bg-elev); }
    .stats-table td.num, .stats-table th.num { text-align: center; }

    /* Модальні вікна та Toast */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.78);
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    @media (min-width: 520px) { .modal-backdrop { align-items: center; padding: 16px; } }
    .modal-box {
      width: 100%; max-width: 540px; max-height: 92vh; background: var(--card);
      border: 1px solid var(--border); border-radius: 18px 18px 0 0;
      display: flex; flex-direction: column; overflow: hidden; padding-bottom: var(--safe-bottom);
    }
    @media (min-width: 520px) { .modal-box { border-radius: 18px; padding-bottom: 0; } }
    .modal-header {
      padding: 13px 15px; border-bottom: 1px solid var(--border);

    function addDaysISO(iso, days) {

      var done = function() { showToast(successMsg || 'Скопійовано'); };

          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          ta.style.top = '0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, text.length);
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);

      var s = String(rawStatus || 'in_service');
      if (s === 'business_trip' || s === 'vd') return 'trip';
      if (s === 'present') return 'in_service';
      if (s === 'sh' || s === 'hv') return 'sick';
      if (s === 'l') return 'hospital';
      if (s === 'vp') return 'leave';
      var valid = PRESENCE_STATUSES.some(function(p) { return p.key === s; });
      return valid ? s : 'in_service';
    }

    function normalizeReasonKey(raw) {
      var s = String(raw || 'other');
      if (s === 'business_trip' || s === 'vd') return 'trip';
      if (s === 'in_service' || s === 'present') return 'in_service';
      if (ROZKHID_CATEGORIES.some(function(c) { return c.key === s; })) return s;
      return 'other';
    }

    function normalizeState(raw) {
      var def = createDefaultState();
      if (!raw || typeof raw !== 'object') return def;

      var rawSquads = toArraySafe(raw.squads);
      var squads = rawSquads.length ? rawSquads.map(function(sq) {
        return {
          id: mapLegacySquadId(sq.id),
          name: String(sq.name || 'Відділення'),
          color: String(sq.color || '#10b981'),
          isCmdGroup: Boolean(sq.isCmdGroup || sq.id === 'group_cmd' || sq.id === 'cmd')
        };
      }) : def.squads;

      var rawDutyTypes = toArraySafe(raw.dutyTypes);
      var dutyTypes = rawDutyTypes.length ? rawDutyTypes.map(function(dt) {
        return {
          id: String(dt.id || genId('dt')),
          shortName: String(dt.shortName || dt.name || 'Наряд'),
          name: String(dt.name || dt.shortName || 'Наряд'),
          maxCount: Math.max(1, Number(dt.maxCount) || 1),
          color: String(dt.color || '#3b82f6')
        };
      }) : def.dutyTypes;

      var rolePermissions = JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMISSIONS));
      var srcPerms = raw.rolePermissions || raw.permissions;
      if (srcPerms && typeof srcPerms === 'object') {
        ['kg', 'kv1', 'kv2', 'kv3'].forEach(function(rk) {
          var p = srcPerms[rk];
          if (p && typeof p === 'object') {
            var rMode = p.rozkhidMode || DEFAULT_ROLE_PERMISSIONS[rk].rozkhidMode;
            if (rMode === 'own') rMode = 'squad';
            var sMode = p.skladMode || p.personnelMode || DEFAULT_ROLE_PERMISSIONS[rk].skladMode;
            if (sMode === 'own_status') sMode = 'squad_status';
            if (sMode === 'all') sMode = 'all_edit';
            rolePermissions[rk] = {
              dutiesEdit: p.dutiesEdit !== undefined ? Boolean(p.dutiesEdit) : DEFAULT_ROLE_PERMISSIONS[rk].dutiesEdit,
              tasksCreate: p.tasksCreate !== undefined ? Boolean(p.tasksCreate) : DEFAULT_ROLE_PERMISSIONS[rk].tasksCreate,
              tasksStatus: p.tasksStatus !== undefined ? Boolean(p.tasksStatus) : (p.tasksUpdate !== undefined ? Boolean(p.tasksUpdate) : DEFAULT_ROLE_PERMISSIONS[rk].tasksStatus),
              tasksViewAll: p.tasksViewAll !== undefined ? Boolean(p.tasksViewAll) : DEFAULT_ROLE_PERMISSIONS[rk].tasksViewAll,
              rozkhidMode: rMode,
              skladMode: sMode
            };
          }
        });
      }

      var rawPeople = toArraySafe(raw.personnel);
      if (!rawPeople.length) rawPeople = toArraySafe(raw.people);
      if (!rawPeople.length) rawPeople = toArraySafe(raw.soldiers);

      var personnel = rawPeople.filter(function(p) {
        return p && (p.fullName || p.name);
      }).map(function(p) {
        return {
          id: String(p.id || genId('s')),
          fullName: String(p.fullName || p.name).trim(),
          rank: String(p.rank || 'солдат').trim(),
          squadId: mapLegacySquadId(p.squadId || 'sq_1'),
          isLeader: Boolean(p.isLeader !== undefined ? p.isLeader : p.isCommander),
          presenceStatus: normalizePresenceStatus(p.presenceStatus || p.status || 'in_service')
        };
      });

      var duties = [];
      if (Array.isArray(raw.duties)) {
        duties = raw.duties.filter(function(d) { return d && d.date && d.dutyTypeId && d.personId; }).map(function(d) {
          return {
            id: String(d.id || genId('d')),
            date: String(d.date),
            dutyTypeId: String(d.dutyTypeId),
            personId: String(d.personId)
          };
        });
      } else if (raw.duties && typeof raw.duties === 'object') {
        Object.keys(raw.duties).forEach(function(dateKey) {
          var dayObj = raw.duties[dateKey];
          if (dayObj && typeof dayObj === 'object') {
            Object.keys(dayObj).forEach(function(dtId) {
              toArraySafe(dayObj[dtId]).forEach(function(pid) {
                if (typeof pid === 'string') {
                  duties.push({ id: genId('d'), date: dateKey, dutyTypeId: dtId, personId: pid });
                }
              });
            });
          }
        });
      }

      var rawTasks = toArraySafe(raw.tasks);
      var tasks = rawTasks.filter(function(t) { return t && (t.title || t.text); }).map(function(t) {
        var matchedRec = TASK_RECIPIENTS.find(function(r) {
          return r.targetRole === t.targetRole || r.label === t.target;
        });
        var st = String(t.status || 'in_progress');
        if (st === 'new' || st === 'received') st = 'in_progress';
        if (['in_progress', 'done', 'failed'].indexOf(st) === -1) st = 'in_progress';
        return {
          id: String(t.id || genId('t')),
          title: String(t.title || t.text || '').trim(),
          description: String(t.description || t.remark || '').trim(),
          target: String(t.target || (matchedRec ? matchedRec.label : 'Усім командирам відділень')),
          targetRole: String(t.targetRole || (matchedRec ? matchedRec.targetRole : 'all')),
          targetSquadId: mapLegacySquadId(t.targetSquadId || (matchedRec ? matchedRec.targetSquadId : 'all')),
          priority: (t.priority === 'high' || t.priority === 'low') ? t.priority : 'normal',
          dueDate: String(t.dueDate || ''),
          status: st,
          createdBy: String(t.createdBy || t.author || ''),
          createdAt: t.createdAt || fmtTimeNow(),
          updatedAt: t.updatedAt || t.createdAt || fmtTimeNow()
        };
      });

      var scheduledAbsences = toArraySafe(raw.scheduledAbsences).filter(function(a) {
        return a && a.personId && a.startDate && a.endDate;
      }).map(function(a) {
        return {
          id: String(a.id || genId('abs')),
          personId: String(a.personId),
          reason: normalizeReasonKey(a.reason || 'other'),
          startDate: String(a.startDate),
          endDate: String(a.endDate),
          note: String(a.note || '')
        };
      });

      return {
        groupNumber: typeof raw.groupNumber === 'string' && raw.groupNumber.trim() ? raw.groupNumber.trim() : def.groupNumber,
        squads: squads,
        dutyTypes: dutyTypes,
        pins: Object.assign({}, DEFAULT_PINS, raw.pins && typeof raw.pins === 'object' ? raw.pins : {}),
        rolePermissions: rolePermissions,
        personnel: personnel,
        duties: duties,
        tasks: tasks,
        scheduledAbsences: scheduledAbsences,
        rozkhidManual: raw.rozkhidManual && typeof raw.rozkhidManual === 'object' ? raw.rozkhidManual : {},
        rozkhidNumeric: raw.rozkhidNumeric && typeof raw.rozkhidNumeric === 'object' ? raw.rozkhidNumeric : {},
        rozkhidCleared: raw.rozkhidCleared && typeof raw.rozkhidCleared === 'object' ? raw.rozkhidCleared : {},
        lastBackupAt: String(raw.lastBackupAt || ''),
        updatedAt: Number(raw.updatedAt) || 0
      };
    }

    function loadLocalState() {
      var rawStr = safeLSGet(STORAGE_KEY);
      if (!rawStr) {
        for (var i = 0; i < LEGACY_KEYS.length; i++) {
          var cand = safeLSGet(LEGACY_KEYS[i]);
          if (cand) { rawStr = cand; break; }
        }
      }
      if (!rawStr) return createDefaultState();
      try {
        return normalizeState(JSON.parse(rawStr));
      } catch (e) {
        return createDefaultState();
      }
    }

    var state = loadLocalState();
    var currentRole = null;
    var pinBuffer = '';
    var pinError = false;

    var ui = {
      tab: 'duties',
      calYear: new Date().getFullYear(),
      calMonth: new Date().getMonth(),
      selectedDate: todayISO(),
      showDutiesTable: false,
      dutyPicker: { dtId: null, search: '', squad: 'all' },
      tasksFilter: 'active',
      rozkhidDate: todayISO(),
      showRozkhidRoster: false,
      rozkhidPicker: { catKey: null, search: '', squad: 'all' },
      personnelSearch: '',
      personnelSquadFilter: 'all',
      expandedSoldiers: {},
      collapsedSquads: {}
    };

    // Стан Firebase та Присутності
    var fbUrl = safeLSGet(FB_URL_STORAGE_KEY) || '';
    var fbStatus = fbUrl ? 'offline' : 'local';
    var fbDiag = { type: 'info', text: fbUrl ? 'Очікується перевірка підключення...' : 'Хмарну базу ще не підключено.' };
    var fbLastSyncText = '';
    var fbPresenceMap = {};
    var fbPollTimer = null;
    var fbHeartbeatTimer = null;
    var fbPushTimer = null;

    function saveState(immediatePush) {
      state.updatedAt = Date.now();
      try { safeLSSet(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      updateTasksBadge();
      if (fbUrl) {
        clearTimeout(fbPushTimer);
        if (immediatePush) fbPushAll(true);
        else fbPushTimer = setTimeout(function() { fbPushAll(true); }, 650);
      }
    }

    // =========================================================================
    // 4. ПРАВА ДОСТУПУ ТА РОЛЬОВА ФІЛЬТРАЦІЯ
    // =========================================================================
    function getRoleMeta(role) { return ROLES_META[role] || ROLES_META.kv1; }
    function isAdmin() { return currentRole === 'admin'; }
    function getPerm(role) {
      var r = role || currentRole;
      if (r === 'admin') {
        return { dutiesEdit: true, tasksCreate: true, tasksStatus: true, tasksViewAll: true, rozkhidMode: 'all', skladMode: 'all_edit' };
      }
      return (state.rolePermissions && state.rolePermissions[r]) ? state.rolePermissions[r] : DEFAULT_ROLE_PERMISSIONS.kv2;
    }
    function canEditDuties() { return isAdmin() || Boolean(getPerm().dutiesEdit); }
    function canCreateTasks() { return isAdmin() || Boolean(getPerm().tasksCreate); }
    function canUpdateTaskStatus() { return isAdmin() || Boolean(getPerm().tasksStatus); }
    function getRozkhidMode() { return isAdmin() ? 'all' : (getPerm().rozkhidMode || 'view'); }
    function getSkladMode() { return isAdmin() ? 'all_edit' : (getPerm().skladMode || 'view'); }
    function getMySquadId() { return getRoleMeta(currentRole).squadId; }

    function canEditRozkhid() {
      var m = getRozkhidMode();
      return m === 'all' || m === 'squad';
    }

    function canEditPersonPresence(person) {
      var sMode = getSkladMode();
      if (sMode === 'all_edit') return true;
      if (sMode === 'squad_status' && person && person.squadId === getMySquadId()) return true;
      return false;
    }

    function isTaskVisibleForRole(task, role) {
      if (!task) return false;
      var r = role || currentRole;
      if (!r) return false;
      if (r === 'admin') return true;
      var perm = getPerm(r);
      if (perm && perm.tasksViewAll) return true;
      if (task.targetRole === 'all' || task.targetSquadId === 'all') return true;
      if (task.targetRole && task.targetRole === r) return true;
      var mySq = getRoleMeta(r).squadId;
      if (mySq && task.targetSquadId && task.targetSquadId === mySq) return true;
      var myLabel = getRoleMeta(r).label.toLowerCase();
      if (task.target && task.target.toLowerCase().indexOf(myLabel.slice(0, 6)) !== -1) return true;
      return false;
    }

    // =========================================================================
    // 5. FIREBASE REALTIME DATABASE REST API + PRESENCE ("ХТО ОНЛАЙН")
    // =========================================================================
    function normalizeFirebaseBaseUrl(raw) {
      var str = String(raw || '').trim();
      if (!str) return '';
      var match = str.match(/https?:\/\/[a-zA-Z0-9._-]+(?:\.firebaseio\.com|\.firebasedatabase\.app)/i);
      if (match && match[0]) str = match[0];
      str = str.replace(/^https?:\/\//i, function(m) { return m.toLowerCase(); });
      if (!/^https?:\/\//i.test(str)) str = 'https://' + str;
      str = str.replace(/\/platoon_data\.json.*$/i, '').replace(/\/\.json.*$/i, '').replace(/\.json.*$/i, '').replace(/\/+$/, '');
      return str;
    }

    function sanitizeForFirebase(val) {
      if (val === undefined) return null;
      if (typeof val === 'number' && !isFinite(val)) return null;
      if (val === null || typeof val !== 'object') return val;
      if (Array.isArray(val)) return val.map(sanitizeForFirebase);
      var out = {};
      Object.keys(val).forEach(function(k) {
        var cleanKey = String(k).replace(/[.$#\[\]\/]/g, '_');
        if (!cleanKey) cleanKey = '_empty';
        out[cleanKey] = sanitizeForFirebase(val[k]);
      });
      return out;
    }

    function getOnlineCount() {
      var now = Date.now();
      var count = 0;
      ROLE_ORDER.forEach(function(rk) {
        var rec = fbPresenceMap[rk];
        var ts = rec ? Number(rec.ts || rec.lastSeen || 0) : 0;
        if (ts > 0 && (now - ts) < 70000) count++;
      });
      if (fbStatus === 'online' && currentRole && count === 0) count = 1;
      return count;
    }

    function updateSyncPillUI() {
      var pill = document.getElementById('header-sync-pill');
      if (!pill) return;
      pill.className = 'sync-pill ' + (fbStatus === 'online' ? 'online' : fbStatus === 'offline' ? 'offline' : fbStatus === 'syncing' ? 'syncing' : '');
      if (fbStatus === 'online') pill.textContent = '🟢 ' + getOnlineCount() + ' онлайн';
      else if (fbStatus === 'offline') pill.textContent = '🔴 Офлайн';
      else if (fbStatus === 'syncing') pill.textContent = '🔄 Синхр...';
      else pill.textContent = '⚪ Локально';
    }

    function setFbDiag(type, text) {
      fbDiag = { type: type, text: text };
      var el = document.getElementById('fb-diag-box');
      if (el) {
        el.className = 'diag-box ' + (type === 'ok' ? 'diag-ok' : type === 'err' ? 'diag-err' : 'diag-info');
        el.textContent = text;
      }
    }

    function isUserActivelyEditing() {
      var a = document.activeElement;
      if (!a) return false;
      return a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT';
    }

    function fbFetchJSON(url, options) {
      return fetch(url, options).then(function(resp) {
        return resp.text().then(function(txt) {
          var parsed = null;
          try { parsed = txt ? JSON.parse(txt) : null; } catch (e) {}
          if (!resp.ok) {
            var errMsg = (parsed && parsed.error) ? parsed.error : (txt || resp.statusText || 'Помилка сервера');
            return { ok: false, status: resp.status, message: 'HTTP ' + resp.status + ': ' + errMsg, data: parsed };
          }
          return { ok: true, status: resp.status, message: 'HTTP ' + resp.status + ' OK', data: parsed };
        });
      }).catch(function(err) {
        return { ok: false, status: 0, message: 'Мережа: ' + (err && err.message ? err.message : String(err)), data: null };
      });
    }

    function sendPresenceHeartbeat() {
      var base = normalizeFirebaseBaseUrl(fbUrl);
      if (!base || !currentRole) return;
      var meta = getRoleMeta(currentRole);
      var now = Date.now();
      fbPresenceMap[currentRole] = { role: currentRole, label: meta.label, ts: now };
      fbFetchJSON(base + '/presence/' + currentRole + '.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role: currentRole, label: meta.label, ts: now })
      }).then(function(res) {
        if (res.ok) updateSyncPillUI();
      });
    }

    function fetchPresenceMap() {
      var base = normalizeFirebaseBaseUrl(fbUrl);
      if (!base) return Promise.resolve();
      return fbFetchJSON(base + '/presence.json', { method: 'GET', cache: 'no-store' }).then(function(res) {
        if (res.ok && res.data && typeof res.data === 'object') {
          fbPresenceMap = res.data;
          updateSyncPillUI();
        }
      });
    }

    function openPresenceModal() {
      if (!fbUrl) {
        switchTab('settings');
        showToast('Підключіть Firebase у Налаштуваннях');
        return;
      }
      fetchPresenceMap().then(function() {
        var now = Date.now();
        var rows = ROLE_ORDER.map(function(rk) {
          var meta = ROLES_META[rk];
          var rec = fbPresenceMap[rk];
          var ts = rec ? Number(rec.ts || rec.lastSeen || 0) : 0;
          var isOnline = ts > 0 && (now - ts) < 70000;
          var statusText = 'Не заходив(ла)';
          if (isOnline) {
            statusText = 'Онлайн зараз';
          } else if (ts > 0) {
            var mins = Math.max(1, Math.round((now - ts) / 60000));
            if (mins < 60) statusText = 'Був(ла) ' + mins + ' хв тому';
            else if (mins < 1440) statusText = 'Був(ла) ' + Math.round(mins / 60) + ' год тому';
            else statusText = 'Був(ла) ' + Math.round(mins / 1440) + ' дн тому';
          }
          var isMe = rk === currentRole;
          return '<div class="presence-row">' +
            '<div class="row min0">' +
              '<span class="presence-dot ' + (isOnline ? 'on' : 'off') + '"></span>' +
              '<div class="min0">' +
                '<div class="fw-bold text-sm">' + esc(meta.label) + (isMe ? ' <span class="badge badge-ok">Ви</span>' : '') + '</div>' +
                '<div class="text-xs" style="color:' + (isOnline ? '#6ee7b7' : 'var(--muted)') + '">' + esc(statusText) + '</div>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');

        openModal(
          '<div class="modal-header">' +
            '<div class="modal-title">🟢 Хто зараз онлайн (' + getOnlineCount() + ')</div>' +
            '<button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button>' +
          '</div>' +
          '<div class="modal-body">' +
            '<div class="stack-sm">' + rows + '</div>' +
            '<button type="button" class="btn btn-sm btn-info btn-full" onclick="fbPullAll(true,false);closeModal()">🔄 Оновити дані з хмари</button>' +
          '</div>'
        );
      });
    }

    function onHeaderSyncPillClick() {
      if (!fbUrl) {
        switchTab('settings');
        showToast('Підключіть Firebase у Налаштуваннях');
        return;
      }
      openPresenceModal();
    }

    function fbPullAll(forceApply, silent) {
      var base = normalizeFirebaseBaseUrl(fbUrl);
      if (!base) {
        fbStatus = 'local';
        updateSyncPillUI();
        return Promise.resolve({ ok: false, message: 'URL не задано' });
      }
      if (!silent) {
        fbStatus = 'syncing';
        updateSyncPillUI();
      }
      return fbFetchJSON(base + '/platoon_data.json', { method: 'GET', cache: 'no-store' }).then(function(res) {
        if (!res.ok) {
          fbStatus = 'offline';
          updateSyncPillUI();
          setFbDiag('err', 'Помилка читання — ' + res.message);
          if (!silent) showToast('Помилка читання: ' + res.message, true);
          return res;
        }
        fbStatus = 'online';
        fbLastSyncText = fmtTimeNow();
        fetchPresenceMap();
        updateSyncPillUI();
        if (res.data === null) {
          setFbDiag('info', 'Підключено (HTTP 200). База порожня — натисніть «Завантажити мої дані в хмару».');
          return res;
        }
        var remoteTs = Number(res.data.updatedAt) || 0;
        var changed = false;
        if (forceApply || remoteTs > (Number(state.updatedAt) || 0)) {
          state = normalizeState(res.data);
          try { safeLSSet(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
          changed = true;
        }
        setFbDiag('ok', 'Онлайн (HTTP ' + res.status + '). Синхронізовано: ' + fbLastSyncText);
        if (changed && currentRole) {
          updateTasksBadge();
          if (!isUserActivelyEditing() && !isModalOpen()) render();
        }
        if (!silent && forceApply) showToast('Завантажено з хмари (' + state.personnel.length + ' осіб)');
        return res;
      });
    }

    function fbPushAll(silent) {
      var base = normalizeFirebaseBaseUrl(fbUrl);
      if (!base) {
        if (!silent) showToast('Спочатку вкажіть посилання Firebase', true);
        return Promise.resolve({ ok: false, message: 'URL не задано' });
      }
      if (!silent) {
        fbStatus = 'syncing';
        updateSyncPillUI();
      }
      var payload = sanitizeForFirebase(state);
      return fbFetchJSON(base + '/platoon_data.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(function(res) {
        if (!res.ok) {
          fbStatus = 'offline';
          updateSyncPillUI();
          setFbDiag('err', 'Помилка запису — ' + res.message);
          if (!silent) showToast('Помилка запису: ' + res.message, true);
          return res;
        }
        fbStatus = 'online';
        fbLastSyncText = fmtTimeNow();
        updateSyncPillUI();
        setFbDiag('ok', 'Завантажено в хмару (HTTP ' + res.status + ') • ' + fbLastSyncText);
        if (!silent) showToast('Дані завантажено в хмару');
        return res;
      });
    }

    function fbTestWrite() {
      var input = document.getElementById('set-fb-url');
      var candidate = normalizeFirebaseBaseUrl(input ? input.value : fbUrl);
      if (!candidate) { showToast('Введіть посилання Firebase', true); return; }
      fbUrl = candidate;
      safeLSSet(FB_URL_STORAGE_KEY, fbUrl);
      if (input) input.value = fbUrl;
      setFbDiag('info', 'Тест запису (PUT /test_ping.json)...');
      fbFetchJSON(fbUrl + '/test_ping.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ping: Date.now(), app: APP_VERSION })
      }).then(function(res) {
        if (!res.ok) {
          fbStatus = 'offline';
          updateSyncPillUI();
          setFbDiag('err', 'Тест провалено — ' + res.message);
          showToast('Тест запису: ' + res.message, true);
        } else {
          fbStatus = 'online';
          updateSyncPillUI();
          setFbDiag('ok', 'Тест запису пройдено! (HTTP ' + res.status + ').');
          showToast('Тест запису пройдено (HTTP 200)');
        }
      });
    }

    function fbConnectFromSettings() {
      var input = document.getElementById('set-fb-url');
      var clean = normalizeFirebaseBaseUrl(input ? input.value : '');
      if (!clean) {
        fbUrl = '';
        safeLSRemove(FB_URL_STORAGE_KEY);
        fbStatus = 'local';
        stopFbTimers();
        updateSyncPillUI();
        setFbDiag('info', 'Локальний режим (хмарну синхронізацію вимкнено).');
        showToast('Локальний режим');
        return;
      }
      fbUrl = clean;
      safeLSSet(FB_URL_STORAGE_KEY, fbUrl);
      if (input) input.value = fbUrl;
      startFbTimers();
      sendPresenceHeartbeat();
      fbPullAll(false, false).then(function(res) {
        if (res.ok) showToast('Firebase підключено!');
      });
    }

    function stopFbTimers() {
      if (fbPollTimer) clearInterval(fbPollTimer);
      if (fbHeartbeatTimer) clearInterval(fbHeartbeatTimer);
      fbPollTimer = null;
      fbHeartbeatTimer = null;
    }

    function startFbTimers() {
      stopFbTimers();
      if (!fbUrl) return;
      fbPollTimer = setInterval(function() {
        if (fbUrl && !document.hidden) fbPullAll(false, true);
      }, 15000);
      fbHeartbeatTimer = setInterval(function() {
        if (fbUrl && currentRole && !document.hidden) sendPresenceHeartbeat();
      }, 25000);
    }

    function copyShareLinkForKV() {
      var base = normalizeFirebaseBaseUrl(fbUrl);
      if (!base) { showToast('Спочатку підключіть Firebase', true); return; }
      var full = window.location.origin + window.location.pathname + '?fb=' + encodeURIComponent(base);
      copyText(full, 'Посилання для КВ скопійовано!');
    }

    // =========================================================================
    // 6. ХЕЛПЕРИ СКЛАДУ, ВІДДІЛЕНЬ ТА РОЗРАХУНКУ ВІДСУТНОСТІ НА ДАТУ
    // =========================================================================
    function getOrderedSquads() {
      return state.squads.slice().sort(function(a, b) {
        var rA = a.isCmdGroup || a.id === 'group_cmd' ? 0 : (a.id === 'sq_1' ? 1 : a.id === 'sq_2' ? 2 : a.id === 'sq_3' ? 3 : 10);
        var rB = b.isCmdGroup || b.id === 'group_cmd' ? 0 : (b.id === 'sq_1' ? 1 : b.id === 'sq_2' ? 2 : b.id === 'sq_3' ? 3 : 10);
        if (rA !== rB) return rA - rB;
        return a.name.localeCompare(b.name, 'uk');
      });
    }

    function getPeopleBySquad(squadId, searchQuery) {
      var q = String(searchQuery || '').trim().toLowerCase();
      return state.personnel.filter(function(p) {
        if (p.squadId !== squadId) return false;
        if (!q) return true;
        return p.fullName.toLowerCase().indexOf(q) !== -1 || p.rank.toLowerCase().indexOf(q) !== -1;
      }).sort(function(a, b) {
        if (a.isLeader && !b.isLeader) return -1;
        if (!a.isLeader && b.isLeader) return 1;
        return a.fullName.localeCompare(b.fullName, 'uk');
      });
    }

    function getPersonById(id) { return state.personnel.find(function(p) { return p.id === id; }) || null; }
    function getSquadById(id) { return state.squads.find(function(sq) { return sq.id === id; }) || null; }
    function getDutyTypeById(id) { return state.dutyTypes.find(function(dt) { return dt.id === id; }) || null; }
    function getPresenceMeta(key) {
      return PRESENCE_STATUSES.find(function(x) { return x.key === key; }) || PRESENCE_STATUSES[0];
    }
    function getRozkhidCatMeta(key) {
      return ROZKHID_CATEGORIES.find(function(x) { return x.key === key; }) || ROZKHID_CATEGORIES[ROZKHID_CATEGORIES.length - 1];
    }

    function getLeaderBadgeHtml(person, squad) {
      if (!person || !person.isLeader) return '';
      if (squad && (squad.isCmdGroup || squad.id === 'group_cmd')) {
        return '<span class="badge badge-kg">★ КГ</span>';
      }
      return '<span class="badge badge-kv">★ КВ</span>';
    }

    // Ефективний статус бійця на конкретну дату (для Нарядів і Розходу)
    function getPersonEffectiveReasonOnDate(person, dateIso) {
      if (!person) return 'in_service';
      var manualDay = state.rozkhidManual && state.rozkhidManual[dateIso];
      if (manualDay && manualDay[person.id]) {
        return normalizeReasonKey(manualDay[person.id]);
      }
      var isCleared = Boolean(state.rozkhidCleared && state.rozkhidCleared[dateIso]);
      if (!isCleared) {
        // 1. Перевірка запланованих відсутностей на період
        for (var i = 0; i < state.scheduledAbsences.length; i++) {
          var abs = state.scheduledAbsences[i];
          if (abs.personId === person.id && dateIso >= abs.startDate && dateIso <= abs.endDate) {
            return normalizeReasonKey(abs.reason);
          }
        }
        // 2. Постійний статус зі Складу
        var permSt = normalizePresenceStatus(person.presenceStatus);
        if (permSt !== 'in_service') return permSt;
      }
      return 'in_service';
    }

    function isPersonOnDutyOnDate(personId, dateIso) {
      return state.duties.some(function(d) { return d.date === dateIso && d.personId === personId; });
    }

    // =========================================================================
    // 7. ЕКРАН ВХОДУ ЗА PIN-КОДОМ
    // =========================================================================
    function renderPinScreen() {
      var el = document.getElementById('pin-screen');
      var dots = '';
      for (var i = 0; i < 4; i++) {
        dots += '<div class="pin-dot' + (pinError ? ' err' : (i < pinBuffer.length ? ' filled' : '')) + '"></div>';
      }
      var keys = ['1','2','3','4','5','6','7','8','9','C','0','⌫'];
      var pad = keys.map(function(k) {
        var cls = 'num-key' + (k === 'C' || k === '⌫' ? ' fn' : '');
        return '<button type="button" class="' + cls + '" onclick="onPinKey(\'' + k + '\')">' + k + '</button>';
      }).join('');

      el.innerHTML =
        '<div class="pin-logo">' +
          '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>' +
          '</svg>' +
        '</div>' +
        '<div style="text-align:center">' +
          '<div style="font-size:21px;font-weight:800;color:#fff">Помічник взводу</div>' +
          '<div class="text-xs text-muted" style="margin-top:4px">Введіть 4-значний PIN-код доступу</div>' +
          '<div style="margin-top:8px">' + (fbUrl ? '<span class="badge badge-ok">☁️ База підключена</span>' : '<span class="badge badge-info">📱 Локальний режим</span>') + '</div>' +
        '</div>' +
        '<div class="pin-dots">' + dots + '</div>' +
        '<div class="text-xs" style="min-height:18px;color:' + (pinError ? '#fca5a5' : 'var(--muted)') + '">' +
          (pinError ? 'Невірний PIN-код. Спробуйте ще раз.' : 'Версія ' + APP_VERSION + ' (оновлено ' + APP_UPDATED + ')') +
        '</div>' +
        '<div class="numpad">' + pad + '</div>';
    }

    function onPinKey(k) {
      if (k === 'C') { pinBuffer = ''; pinError = false; renderPinScreen(); return; }
      if (k === '⌫') { pinBuffer = pinBuffer.slice(0, -1); pinError = false; renderPinScreen(); return; }
      if (pinBuffer.length >= 4) return;
      pinError = false;
      pinBuffer += k;
      renderPinScreen();
      if (pinBuffer.length === 4) setTimeout(verifyPin, 120);
    }

    function verifyPin() {
      var pins = state.pins || DEFAULT_PINS;
      var matched = null;
      ROLE_ORDER.forEach(function(rk) {
        if (!matched && String(pins[rk] || DEFAULT_PINS[rk]) === pinBuffer) matched = rk;
      });
      if (!matched) {
        pinError = true;
        pinBuffer = '';
        renderPinScreen();
        return;
      }
      loginAsRole(matched);
    }

    function loginAsRole(role) {
      currentRole = role;
      pinBuffer = '';
      pinError = false;
      safeSSSet(SESSION_ROLE_KEY, role);
      safeLSSet(SESSION_ROLE_KEY, role);

      var meta = getRoleMeta(role);
      var rp = document.getElementById('header-role-pill');
      if (rp) {
        rp.className = 'role-pill ' + meta.cssClass;
        rp.textContent = meta.short;
      }

      document.getElementById('pin-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      updateTasksBadge();
      render();
      if (fbUrl) {
        startFbTimers();
        sendPresenceHeartbeat();
        fbPullAll(false, true);
      }
    }

    function logoutSession() {
      currentRole = null;
      pinBuffer = '';
      pinError = false;
      safeSSRemove(SESSION_ROLE_KEY);
      safeLSRemove(SESSION_ROLE_KEY);
      document.getElementById('app-shell').classList.add('hidden');
      document.getElementById('pin-screen').classList.remove('hidden');
      renderPinScreen();
    }

    // =========================================================================
    // 8. ВКЛАДКА 1: НАРЯДИ (БЕЗДОГАННЕ ПРИЗНАЧЕННЯ, АВТОПІДБІР ТА ОБЛІК)
    // =========================================================================
    function getDutiesForDate(dateIso) {
      return state.duties.filter(function(d) { return d.date === dateIso; });
    }
    function getDutiesForDateAndType(dateIso, dutyTypeId) {
      return state.duties.filter(function(d) { return d.date === dateIso && d.dutyTypeId === dutyTypeId; });
    }

    function getDutyStatsMaps(year, month) {
      var prefix = year + '-' + pad2(month + 1);
      var monthMap = {}, totalMap = {}, byTypeMap = {};
      state.duties.forEach(function(d) {
        totalMap[d.personId] = (totalMap[d.personId] || 0) + 1;
        if (!byTypeMap[d.personId]) byTypeMap[d.personId] = {};
        byTypeMap[d.personId][d.dutyTypeId] = (byTypeMap[d.personId][d.dutyTypeId] || 0) + 1;
        if (String(d.date || '').indexOf(prefix) === 0) {
          monthMap[d.personId] = (monthMap[d.personId] || 0) + 1;
        }
      });
      return { monthMap: monthMap, totalMap: totalMap, byTypeMap: byTypeMap };
    }

    function addDuty(dateIso, dutyTypeId, personId) {
      if (!canEditDuties()) return false;
      var exists = state.duties.some(function(d) {
        return d.date === dateIso && d.dutyTypeId === dutyTypeId && d.personId === personId;
      });
      if (exists) return false;
      state.duties.push({ id: genId('d'), date: dateIso, dutyTypeId: dutyTypeId, personId: personId });
      saveState(true);
      return true;
    }

    function removeDuty(dutyId) {
      if (!canEditDuties()) return;
      state.duties = state.duties.filter(function(d) { return d.id !== dutyId; });
      saveState(true);
      render();
    }

    function toggleDutyAssignment(dateIso, dutyTypeId, personId) {
      if (!canEditDuties()) return;
      var existing = state.duties.find(function(d) {
        return d.date === dateIso && d.dutyTypeId === dutyTypeId && d.personId === personId;
      });
      if (existing) {
        state.duties = state.duties.filter(function(d) { return d.id !== existing.id; });
        saveState(true);
      } else {
        var dt = getDutyTypeById(dutyTypeId);
        var current = getDutiesForDateAndType(dateIso, dutyTypeId);
        if (dt && current.length >= (Number(dt.maxCount) || 1)) {
          showToast('Ліміт для «' + dt.shortName + '» (' + dt.maxCount + ') вже заповнено', true);
          return;
        }
        addDuty(dateIso, dutyTypeId, personId);
      }
      renderDutyPickerModal();
      render();
    }

    function autoPickDutiesForDate(dateIso) {
      if (!canEditDuties()) return;
      if (!state.personnel.length) { showToast('Особовий склад порожній', true); return; }

      var parts = dateIso.split('-');
      var stats = getDutyStatsMaps(Number(parts[0]), Number(parts[1]) - 1);
      var yesterday = addDaysISO(dateIso, -1);
      var assignedToday = {};
      getDutiesForDate(dateIso).forEach(function(d) { assignedToday[d.personId] = true; });
      var addedCount = 0;

      state.dutyTypes.forEach(function(dt) {
        var need = (Number(dt.maxCount) || 1) - getDutiesForDateAndType(dateIso, dt.id).length;
        if (need <= 0) return;

        var candidates = state.personnel.filter(function(p) {
          if (assignedToday[p.id]) return false;
          if (getPersonEffectiveReasonOnDate(p, dateIso) !== 'in_service') return false;
          return true;
        }).sort(function(a, b) {
          var aYest = isPersonOnDutyOnDate(a.id, yesterday) ? 1 : 0;
          var bYest = isPersonOnDutyOnDate(b.id, yesterday) ? 1 : 0;
          if (aYest !== bYest) return aYest - bYest;
          var aM = stats.monthMap[a.id] || 0, bM = stats.monthMap[b.id] || 0;
          if (aM !== bM) return aM - bM;
          var aT = stats.totalMap[a.id] || 0, bT = stats.totalMap[b.id] || 0;
          if (aT !== bT) return aT - bT;
          return a.fullName.localeCompare(b.fullName, 'uk');
        });

        for (var i = 0; i < need && i < candidates.length; i++) {
          var p = candidates[i];
          state.duties.push({ id: genId('d'), date: dateIso, dutyTypeId: dt.id, personId: p.id });
          assignedToday[p.id] = true;
          stats.monthMap[p.id] = (stats.monthMap[p.id] || 0) + 1;
          stats.totalMap[p.id] = (stats.totalMap[p.id] || 0) + 1;
          addedCount++;
        }
      });

      if (addedCount > 0) {
        saveState(true);
        showToast('⚡ Автопідбір: призначено ' + addedCount + ' ос.');
        render();
      } else {
        showToast('Усі слоти вже заповнені або немає вільних бійців');
      }
    }

    function clearDutiesForDate(dateIso) {
      if (!canEditDuties()) return;
      var had = getDutiesForDate(dateIso).length;
      if (!had) { showToast('На цю дату нарядів немає'); return; }
      state.duties = state.duties.filter(function(d) { return d.date !== dateIso; });
      saveState(true);
      showToast('Наряди на ' + fmtUA(dateIso) + ' очищено');
      render();
    }

    function copyDutyForDate(iso) {
      var lines = ['Наряд ' + state.groupNumber + ' на ' + fmtUA(iso)];
      state.dutyTypes.forEach(function(dt) {
        lines.push('');
        lines.push(dt.shortName + ':');
        var list = getDutiesForDateAndType(iso, dt.id).map(function(d) { return getPersonById(d.personId); }).filter(Boolean);
        if (!list.length) lines.push('—');
        else list.forEach(function(p) { lines.push('• ' + p.rank + ' ' + p.fullName); });
      });
      copyText(lines.join('\n'), 'Наряд скопійовано');
    }

    function openDutyPickerModal(dtId) {
      if (!canEditDuties()) return;
      ui.dutyPicker = { dtId: dtId, search: '', squad: 'all' };
      renderDutyPickerModal();
    }

    function renderDutyPickerModal() {
      var dtId = ui.dutyPicker.dtId;
      var dt = getDutyTypeById(dtId);
      if (!dt) return;

      var dateIso = ui.selectedDate;
      var parts = dateIso.split('-');
      var stats = getDutyStatsMaps(Number(parts[0]), Number(parts[1]) - 1);
      var yesterday = addDaysISO(dateIso, -1);
      var assignedThisType = getDutiesForDateAndType(dateIso, dtId);
      var assignedThisMap = {};
      assignedThisType.forEach(function(d) { assignedThisMap[d.personId] = true; });
      var assignedAnyToday = {};
      getDutiesForDate(dateIso).forEach(function(d) { assignedAnyToday[d.personId] = d.dutyTypeId; });

      var q = String(ui.dutyPicker.search || '').trim().toLowerCase();
      var sqFilter = ui.dutyPicker.squad || 'all';

      var people = state.personnel.filter(function(p) {
        if (sqFilter !== 'all' && p.squadId !== sqFilter) return false;
        if (q && p.fullName.toLowerCase().indexOf(q) === -1 && p.rank.toLowerCase().indexOf(q) === -1) return false;
        return true;
      }).sort(function(a, b) {
        var aThis = assignedThisMap[a.id] ? 0 : 1;
        var bThis = assignedThisMap[b.id] ? 0 : 1;
        if (aThis !== bThis) return aThis - bThis;

        var aBusy = (assignedAnyToday[a.id] || getPersonEffectiveReasonOnDate(a, dateIso) !== 'in_service') ? 1 : 0;
        var bBusy = (assignedAnyToday[b.id] || getPersonEffectiveReasonOnDate(b, dateIso) !== 'in_service') ? 1 : 0;
        if (aBusy !== bBusy) return aBusy - bBusy;

        var aM = stats.monthMap[a.id] || 0, bM = stats.monthMap[b.id] || 0;
        if (aM !== bM) return aM - bM;

        var aT = stats.totalMap[a.id] || 0, bT = stats.totalMap[b.id] || 0;
        if (aT !== bT) return aT - bT;
        return a.fullName.localeCompare(b.fullName, 'uk');
      });

      var sqPills =
        '<button type="button" class="pill ' + (sqFilter === 'all' ? 'active' : '') + '" data-picker-sq="all">Усі</button>' +
        getOrderedSquads().map(function(sq) {
          var shortLbl = sq.isCmdGroup ? 'КГ' : sq.name.replace(' відділення', '');
          return '<button type="button" class="pill ' + (sqFilter === sq.id ? 'active' : '') + '" data-picker-sq="' + esc(sq.id) + '">' +
            '<span class="dot" style="background:' + esc(sq.color) + '"></span>' + esc(shortLbl) + '</button>';
        }).join('');

      var rowsHtml = people.length ? people.map(function(p) {
        var sq = getSquadById(p.squadId);
        var isHere = Boolean(assignedThisMap[p.id]);
        var otherDuty = assignedAnyToday[p.id] && !isHere;
        var wasYest = isPersonOnDutyOnDate(p.id, yesterday);
        var effReason = getPersonEffectiveReasonOnDate(p, dateIso);
        var mCnt = stats.monthMap[p.id] || 0;
        var tCnt = stats.totalMap[p.id] || 0;

        var warns = '';
        if (otherDuty) warns += '<span class="badge badge-warn">Вже в наряді сьогодні</span>';
        if (wasYest) warns += '<span class="badge badge-info">Був вчора</span>';
        if (effReason !== 'in_service') warns += '<span class="badge badge-err">Відсутній (' + esc(getRozkhidCatMeta(effReason).short) + ')</span>';

        return '<div class="picker-row ' + (isHere ? 'assigned' : '') + '" data-toggle-duty-pid="' + esc(p.id) + '">' +
          '<div class="min0 stack-sm" style="gap:3px">' +
            '<div class="row" style="gap:6px">' +
              '<span class="dot" style="background:' + esc(sq ? sq.color : '#64748b') + '"></span>' +
              '<span class="fw-bold text-sm">' + esc(p.fullName) + '</span>' +
            '</div>' +
            '<div class="text-xs text-muted">' + esc(p.rank) + ' • Міс: <b style="color:#fff">' + mCnt + '</b> | Всього: <b style="color:#fff">' + tCnt + '</b></div>' +
            (warns ? '<div class="row wrap" style="gap:4px">' + warns + '</div>' : '') +
          '</div>' +
          '<div style="flex-shrink:0">' +
            (isHere ? '<span class="badge badge-ok">✓ Обрано</span>' : '<span class="badge badge-muted">+ Обрати</span>') +
          '</div>' +
        '</div>';
      }).join('') : '<div class="empty-state">Немає бійців за фільтром</div>';

      openModal(
        '<div class="modal-header">' +
          '<div>' +
            '<div class="modal-title">' + esc(dt.shortName) + ' • ' + fmtUA(dateIso) + '</div>' +
            '<div class="text-xs text-muted">Призначено: <b style="color:#fff">' + assignedThisType.length + ' / ' + dt.maxCount + '</b> (натисніть на бійця)</div>' +
          '</div>' +
          '<button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<div class="modal-body" id="duty-picker-body">' +
          '<input id="duty-picker-search" class="input input-sm" type="search" placeholder="Пошук бійця..." value="' + esc(ui.dutyPicker.search) + '" />' +
          '<div class="pills-scroll">' + sqPills + '</div>' +
          '<div class="stack-sm">' + rowsHtml + '</div>' +
          '<button type="button" class="btn btn-primary btn-full" onclick="closeModal()">Готово</button>' +
        '</div>'
      );

      // Надійна прив'язка подій без inline-екранування
      var bodyEl = document.getElementById('duty-picker-body');
      var searchEl = document.getElementById('duty-picker-search');
      if (searchEl) {
        searchEl.oninput = function() {
          ui.dutyPicker.search = this.value;
          renderDutyPickerModal();
          var again = document.getElementById('duty-picker-search');
          if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
        };
      }
      if (bodyEl) {
        bodyEl.onclick = function(ev) {
          var sqBtn = ev.target.closest('[data-picker-sq]');
          if (sqBtn) {
            ui.dutyPicker.squad = sqBtn.getAttribute('data-picker-sq');
            renderDutyPickerModal();
            return;
          }
          var rowEl = ev.target.closest('[data-toggle-duty-pid]');
          if (rowEl) {
            var pid = rowEl.getAttribute('data-toggle-duty-pid');
            toggleDutyAssignment(dateIso, dtId, pid);
          }
        };
      }
    }

    function openDutyTypesModal() {
      if (!canEditDuties()) return;
      var listHtml = state.dutyTypes.map(function(dt) {
        return '<div class="row-between" style="padding:9px 11px;border-radius:10px;background:var(--bg);border:1px solid var(--border)">' +
          '<div class="row min0"><span class="dot" style="background:' + esc(dt.color) + '"></span>' +
            '<div class="min0"><div class="fw-bold text-sm">' + esc(dt.shortName) + '</div><div class="text-xs text-muted">Макс. людей: ' + dt.maxCount + '</div></div>' +
          '</div>' +
          (state.dutyTypes.length > 1 ? '<button type="button" class="btn-icon btn-icon-sm danger" data-del-dt="' + esc(dt.id) + '">✕</button>' : '') +
        '</div>';
      }).join('');

      openModal(
        '<div class="modal-header"><div class="modal-title">⚙️ Види нарядів</div><button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body" id="duty-types-body">' +
          '<div class="stack-sm">' + listHtml + '</div>' +
          '<div class="card stack-sm" style="background:var(--bg)">' +
            '<div class="section-title">Додати вид наряду</div>' +
            '<input id="new-dt-name" class="input input-sm" type="text" placeholder="Назва (напр. Патруль)" />' +
            '<div class="grid-2">' +
              '<input id="new-dt-max" class="input input-sm" type="number" min="1" max="20" value="1" placeholder="Кількість" />' +
              '<select id="new-dt-color" class="select select-sm">' +
                '<option value="#3b82f6">Синій</option><option value="#10b981">Зелений</option>' +
                '<option value="#f59e0b">Жовтий</option><option value="#f43f5e">Червоний</option><option value="#a855f7">Фіолетовий</option>' +
              '</select>' +
            '</div>' +
            '<button type="button" class="btn btn-sm btn-primary btn-full" onclick="addDutyTypeFromModal()">+ Додати вид</button>' +
          '</div>' +
        '</div>'
      );

      var b = document.getElementById('duty-types-body');
      if (b) {
        b.onclick = function(ev) {
          var delBtn = ev.target.closest('[data-del-dt]');
          if (delBtn) {
            var id = delBtn.getAttribute('data-del-dt');
            state.dutyTypes = state.dutyTypes.filter(function(x) { return x.id !== id; });
            state.duties = state.duties.filter(function(d) { return d.dutyTypeId !== id; });
            saveState(true);
            openDutyTypesModal();
            render();
          }
        };
      }
    }

    function addDutyTypeFromModal() {

    function saveNewTaskFromModal() {
      if (!canCreateTasks()) return;
      var recIdx = Number(document.getElementById('task-rec').value) || 0;
      var title = (document.getElementById('task-title').value || '').trim();
      var desc = (document.getElementById('task-desc').value || '').trim();
      var prio = document.getElementById('task-prio').value || 'normal';
      var due = document.getElementById('task-due').value || '';
      if (!title) { showToast('Введіть суть задачі', true); return; }

      var rec = TASK_RECIPIENTS[recIdx] || TASK_RECIPIENTS[0];
      var nowStr = fmtTimeNow();
      state.tasks.unshift({
        id: genId('t'),

        description: desc,
        target: rec.label,
        targetRole: rec.targetRole,
        targetSquadId: rec.targetSquadId,

        dueDate: due,
        status: 'in_progress',

    // =========================================================================
    // 10. ВКЛАДКА 3: РОЗХІД (ШВИДКИЙ РЕДАКТОР ПО КАТЕГОРІЯХ + ЛЮДИ + ПЕРІОДИ)
    // =========================================================================
    function getRozkhidScopePeople() {
      var mode = getRozkhidMode();
      if (mode === 'squad' && getMySquadId()) {
        return state.personnel.filter(function(p) { return p.squadId === getMySquadId(); });
      }
      return state.personnel.slice();
    }

    function computeRozkhidData(dateIso) {
      var people = getRozkhidScopePeople();
      var total = people.length;
      var peopleByCat = {};
      ROZKHID_CATEGORIES.forEach(function(c) { peopleByCat[c.key] = []; });

      var dutyIdsOnDate = {};
      getDutiesForDate(dateIso).forEach(function(d) { dutyIdsOnDate[d.personId] = true; });

      people.forEach(function(p) {
        var manualDay = state.rozkhidManual && state.rozkhidManual[dateIso];
        var manualVal = manualDay ? manualDay[p.id] : null;
        if (manualVal) {
          var norm = normalizeReasonKey(manualVal);
          if (norm !== 'in_service' && peopleByCat[norm]) peopleByCat[norm].push(p);
          return;
        }
        if (dutyIdsOnDate[p.id]) {
          peopleByCat.onDuty.push(p);
          return;
        }
        var eff = getPersonEffectiveReasonOnDate(p, dateIso);
        if (eff !== 'in_service' && peopleByCat[eff]) {
          peopleByCat[eff].push(p);
        }
      });

      var numOverrides = (state.rozkhidNumeric && state.rozkhidNumeric[dateIso]) ? state.rozkhidNumeric[dateIso] : {};
      var counts = {};
      var isOverridden = {};
      ROZKHID_CATEGORIES.forEach(function(c) {
        var ov = numOverrides[c.key];
        if (ov !== null && ov !== undefined && ov !== '' && !isNaN(Number(ov))) {
          counts[c.key] = Math.max(0, Number(ov));
          isOverridden[c.key] = true;
        } else {
          counts[c.key] = peopleByCat[c.key].length;
          isOverridden[c.key] = false;
        }
      });

      var onDutyCount = counts.onDuty || 0;
      var absentCount = 0;
      ABSENCE_CATEGORIES.forEach(function(c) { absentCount += (counts[c.key] || 0); });
      var availableCount = Math.max(0, total - onDutyCount - absentCount);

      return {
        people: people,
        total: total,
        available: availableCount,
        onDuty: onDutyCount,
        absent: absentCount,
        counts: counts,
        isOverridden: isOverridden,
        peopleByCat: peopleByCat
      };
    }

    function stepRozkhidNumeric(catKey, delta) {
      if (!canEditRozkhid()) return;
      var dateIso = ui.rozkhidDate;
      var data = computeRozkhidData(dateIso);
      var current = data.counts[catKey] || 0;
      var nextVal = Math.max(0, current + delta);
      if (!state.rozkhidNumeric[dateIso]) state.rozkhidNumeric[dateIso] = {};
      state.rozkhidNumeric[dateIso][catKey] = nextVal;
      saveState(true);
      render();
    }

    function resetRozkhidNumeric(catKey) {
      if (!canEditRozkhid()) return;
      var dateIso = ui.rozkhidDate;
      if (state.rozkhidNumeric[dateIso]) {
        delete state.rozkhidNumeric[dateIso][catKey];
        if (!Object.keys(state.rozkhidNumeric[dateIso]).length) delete state.rozkhidNumeric[dateIso];
      }
      saveState(true);
      render();
    }

    function clearRozkhidForDate(dateIso) {
      if (!canEditRozkhid()) return;
      state.rozkhidCleared[dateIso] = true;
      delete state.rozkhidManual[dateIso];
      delete state.rozkhidNumeric[dateIso];
      saveState(true);
      showToast('🧹 Розхід на ' + fmtUA(dateIso) + ' очищено');
      render();
    }

    function setManualPersonRozkhid(dateIso, personId, reasonKey) {
      if (!canEditRozkhid()) return;
      if (!state.rozkhidManual[dateIso]) state.rozkhidManual[dateIso] = {};
      state.rozkhidManual[dateIso][personId] = reasonKey;
      // Якщо раніше була ручна цифра для цієї категорії — скидаємо її, щоб підтягнулась точна кількість
      if (state.rozkhidNumeric[dateIso] && state.rozkhidNumeric[dateIso][reasonKey] !== undefined) {
        delete state.rozkhidNumeric[dateIso][reasonKey];
      }
      saveState(true);
      render();
    }

    function openRozkhidCategoryPeopleModal(catKey) {
      if (!canEditRozkhid()) return;
      ui.rozkhidPicker = { catKey: catKey, search: '', squad: 'all' };
      renderRozkhidCategoryPeopleModal();
    }

    function renderRozkhidCategoryPeopleModal() {
      var catKey = ui.rozkhidPicker.catKey;
      var cat = getRozkhidCatMeta(catKey);
      var dateIso = ui.rozkhidDate;
      var data = computeRozkhidData(dateIso);
      var inCatMap = {};
      (data.peopleByCat[catKey] || []).forEach(function(p) { inCatMap[p.id] = true; });

      var q = String(ui.rozkhidPicker.search || '').trim().toLowerCase();
      var sqFilter = ui.rozkhidPicker.squad || 'all';

      var scopePeople = data.people.filter(function(p) {
        if (sqFilter !== 'all' && p.squadId !== sqFilter) return false;
        if (q && p.fullName.toLowerCase().indexOf(q) === -1 && p.rank.toLowerCase().indexOf(q) === -1) return false;
        return true;
      }).sort(function(a, b) {
        var aIn = inCatMap[a.id] ? 0 : 1, bIn = inCatMap[b.id] ? 0 : 1;
        if (aIn !== bIn) return aIn - bIn;
        return a.fullName.localeCompare(b.fullName, 'uk');
      });

      var sqPills =
        '<button type="button" class="pill ' + (sqFilter === 'all' ? 'active' : '') + '" data-rpick-sq="all">Усі</button>' +
        getOrderedSquads().map(function(sq) {
          var shortLbl = sq.isCmdGroup ? 'КГ' : sq.name.replace(' відділення', '');
          return '<button type="button" class="pill ' + (sqFilter === sq.id ? 'active' : '') + '" data-rpick-sq="' + esc(sq.id) + '">' +
            '<span class="dot" style="background:' + esc(sq.color) + '"></span>' + esc(shortLbl) + '</button>';
        }).join('');

      var rows = scopePeople.length ? scopePeople.map(function(p) {
        var checked = Boolean(inCatMap[p.id]);
        var sq = getSquadById(p.squadId);
        return '<label class="checkbox-row">' +
          '<div class="min0">' +
            '<div class="row" style="gap:6px"><span class="dot" style="background:' + esc(sq ? sq.color : '#64748b') + '"></span><span class="fw-bold text-sm">' + esc(p.fullName) + '</span></div>' +
            '<div class="text-xs text-muted">' + esc(p.rank) + '</div>' +
          '</div>' +
          '<input type="checkbox" ' + (checked ? 'checked' : '') + ' data-rpick-pid="' + esc(p.id) + '" />' +
        '</label>';
      }).join('') : '<div class="empty-state">Немає бійців</div>';

      openModal(
        '<div class="modal-header">' +
          '<div><div class="modal-title">' + cat.icon + ' ' + esc(cat.label) + ' • ' + fmtUA(dateIso) + '</div>' +
          '<div class="text-xs text-muted">Відмітьте бійців у цій категорії</div></div>' +
          '<button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<div class="modal-body" id="rozkhid-picker-body">' +
          '<input id="rozkhid-picker-search" class="input input-sm" type="search" placeholder="Пошук бійця..." value="' + esc(ui.rozkhidPicker.search) + '" />' +
          '<div class="pills-scroll">' + sqPills + '</div>' +
          '<div class="card-flush">' + rows + '</div>' +
          '<button type="button" class="btn btn-primary btn-full" onclick="closeModal()">Готово</button>' +
        '</div>'
      );

      var bodyEl = document.getElementById('rozkhid-picker-body');
      var searchEl = document.getElementById('rozkhid-picker-search');
      if (searchEl) {
        searchEl.oninput = function() {
          ui.rozkhidPicker.search = this.value;
          renderRozkhidCategoryPeopleModal();
          var again = document.getElementById('rozkhid-picker-search');
          if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
        };
      }
      if (bodyEl) {
        bodyEl.onclick = function(ev) {
          var sqBtn = ev.target.closest('[data-rpick-sq]');
          if (sqBtn) {
            ui.rozkhidPicker.squad = sqBtn.getAttribute('data-rpick-sq');
            renderRozkhidCategoryPeopleModal();
          }
        };
        bodyEl.onchange = function(ev) {
          var cb = ev.target.closest('[data-rpick-pid]');
          if (!cb) return;
          var pid = cb.getAttribute('data-rpick-pid');
          if (!state.rozkhidManual[dateIso]) state.rozkhidManual[dateIso] = {};

            delete state.rozkhidNumeric[dateIso][catKey];
          }
          saveState(true);
          render();
        };

    function saveScheduledAbsenceModal() {
      var pid = document.getElementById('abs-person').value;

      var end = document.getElementById('abs-end').value;
      var note = (document.getElementById('abs-note').value || '').trim();

      closeModal();

    function buildRozkhidReportText(dateIso) {
      var d = computeRozkhidData(dateIso);
      var lines = [
        'Розхід ' + state.groupNumber + ' групи на ' + fmtUA(dateIso),
        'За списком: ' + d.total,
        'В наявності: ' + d.available
      ];

      var dutyNames = (d.peopleByCat.onDuty || []).map(function(p) { return p.fullName; });
      lines.push('В наряді: ' + d.onDuty + (dutyNames.length ? (' (' + dutyNames.join(', ') + ')') : ''));
      lines.push('Відсутні: ' + d.absent);

      ABSENCE_CATEGORIES.forEach(function(cat) {
        var cnt = d.counts[cat.key] || 0;
        if (cnt <= 0) return;
        var names = (d.peopleByCat[cat.key] || []).map(function(p) { return p.fullName; });
        lines.push('— ' + cat.label + ': ' + cnt + (names.length ? (' (' + names.join(', ') + ')') : ''));
      });

      return lines.join('\n');
    }

    function shareRozkhidReport(dateIso) {
      var text = buildRozkhidReportText(dateIso);
      if (navigator.share) {
        navigator.share({ title: 'Розхід ' + state.groupNumber + ' групи', text: text }).catch(function() {
          copyText(text, 'Розхід скопійовано');
        });
      } else {
        copyText(text, 'Розхід скопійовано');
      }
    }

    function savePersonModal(existingId) {
      var fullName = (document.getElementById('per-name').value || '').trim();
      var rank = (document.getElementById('per-rank').value || '').trim() || 'солдат';
      var squadId = document.getElementById('per-sq').value;
      var isLeader = document.getElementById('per-leader').checked;
      if (!fullName) { showToast('Введіть ПІБ', true); return; }

      if (existingId) {
        var p = getPersonById(existingId);
        if (p) { p.fullName = fullName; p.rank = rank; p.squadId = squadId; p.isLeader = isLeader; }
      } else {
        state.personnel.push({ id: genId('s'), fullName: fullName, rank: rank, squadId: squadId, isLeader: isLeader, presenceStatus: 'in_service' });
      }
      saveState(true);
      closeModal();
      showToast(existingId ? 'Дані оновлено' : 'Бійця додано');
      render();
    }

    function confirmDeletePerson(pid) {

            '<button type="button" class="btn btn-secondary" onclick="closeModal()">Скасувати</button>' +
            '<button type="button" class="btn btn-danger" onclick="deletePerson(\'' + esc(pid) + '\')">Видалити</button>' +
          '</div>' +
        '</div>'

    // =========================================================================
    // 5. ХЕЛПЕРИ ОСОБОВОГО СКЛАДУ ТА ВІДДІЛЕНЬ
    // =========================================================================
    function getOrderedSquads() {
      return state.squads.slice().sort(function(a, b) {
        var rA = a.isCmdGroup || a.id === 'group_cmd' ? 0 : (a.id === 'sq_1' ? 1 : a.id === 'sq_2' ? 2 : a.id === 'sq_3' ? 3 : 10);
        var rB = b.isCmdGroup || b.id === 'group_cmd' ? 0 : (b.id === 'sq_1' ? 1 : b.id === 'sq_2' ? 2 : b.id === 'sq_3' ? 3 : 10);
        if (rA !== rB) return rA - rB;
        return a.name.localeCompare(b.name, 'uk');
      });
    }

    function getPeopleBySquad(squadId, searchQuery) {
      var q = String(searchQuery || '').trim().toLowerCase();
      return state.personnel.filter(function(p) {
        if (p.squadId !== squadId) return false;
        if (!q) return true;
        return p.fullName.toLowerCase().indexOf(q) !== -1 || p.rank.toLowerCase().indexOf(q) !== -1;
      }).sort(function(a, b) {
        if (a.isLeader && !b.isLeader) return -1;
        if (!a.isLeader && b.isLeader) return 1;
        return a.fullName.localeCompare(b.fullName, 'uk');
      });
    }

    function getPersonById(id) { return state.personnel.find(function(p) { return p.id === id; }) || null; }
    function getSquadById(id) { return state.squads.find(function(sq) { return sq.id === id; }) || null; }
    function getDutyTypeById(id) { return state.dutyTypes.find(function(dt) { return dt.id === id; }) || null; }
    function getPresenceMeta(key) {
      return PRESENCE_STATUSES.find(function(x) { return x.key === key; }) || PRESENCE_STATUSES[0];
    }

    function getLeaderBadgeHtml(person, squad) {
      if (!person || !person.isLeader) return '';
      if (squad && (squad.isCmdGroup || squad.id === 'group_cmd')) {
        return '<span class="badge badge-kg">★ КГ</span>';
      }
      return '<span class="badge badge-kv">★ КВ</span>';
    }

    // =========================================================================
    // 6. ЕКРАН ВХОДУ ЗА PIN-КОДОМ
    // =========================================================================
    function renderPinScreen() {
      var el = document.getElementById('pin-screen');
      var dots = '';
      for (var i = 0; i < 4; i++) {
        dots += '<div class="pin-dot' + (pinError ? ' err' : (i < pinBuffer.length ? ' filled' : '')) + '"></div>';
      }
      var keys = ['1','2','3','4','5','6','7','8','9','C','0','⌫'];
      var pad = keys.map(function(k) {
        var cls = 'num-key' + (k === 'C' || k === '⌫' ? ' fn' : '');
        return '<button type="button" class="' + cls + '" onclick="onPinKey(\'' + k + '\')">' + k + '</button>';
      }).join('');

      el.innerHTML =
        '<div class="pin-logo">' +
          '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>' +
          '</svg>' +
        '</div>' +
        '<div style="text-align:center">' +
          '<div style="font-size:21px;font-weight:800;color:#fff">Помічник взводу</div>' +
          '<div class="text-xs text-muted" style="margin-top:4px">Введіть 4-значний PIN-код доступу</div>' +
          '<div style="margin-top:8px">' + (fbUrl ? '<span class="badge badge-ok">☁️ База підключена</span>' : '<span class="badge badge-info">📱 Локальний режим</span>') + '</div>' +
        '</div>' +
        '<div class="pin-dots">' + dots + '</div>' +
        '<div class="text-xs" style="min-height:18px;color:' + (pinError ? '#fca5a5' : 'var(--muted)') + '">' +
          (pinError ? 'Невірний PIN-код. Спробуйте ще раз.' : 'Версія ' + APP_VERSION + ' (оновлено ' + APP_UPDATED + ')') +
        '</div>' +
        '<div class="numpad">' + pad + '</div>';
    }

    function onPinKey(k) {
      if (k === 'C') { pinBuffer = ''; pinError = false; renderPinScreen(); return; }
      if (k === '⌫') { pinBuffer = pinBuffer.slice(0, -1); pinError = false; renderPinScreen(); return; }
      if (pinBuffer.length >= 4) return;
      pinError = false;
      pinBuffer += k;
      renderPinScreen();
      if (pinBuffer.length === 4) setTimeout(verifyPin, 120);
    }

    function verifyPin() {
      var pins = state.pins || DEFAULT_PINS;
      var matched = null;
      ROLE_ORDER.forEach(function(rk) {
        if (!matched && String(pins[rk] || DEFAULT_PINS[rk]) === pinBuffer) matched = rk;
      });
      if (!matched) {
        pinError = true;
        pinBuffer = '';
        renderPinScreen();
        return;
      }
      loginAsRole(matched);
    }

    function loginAsRole(role) {
      currentRole = role;
      pinBuffer = '';
      pinError = false;
      safeSSSet(SESSION_ROLE_KEY, role);
      safeLSSet(SESSION_ROLE_KEY, role);

      var meta = getRoleMeta(role);
      var rp = document.getElementById('header-role-pill');
      if (rp) {
        rp.className = 'role-pill ' + meta.cssClass;
        rp.textContent = meta.short;
      }

      document.getElementById('pin-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      updateTasksBadge();
      render();
      if (fbUrl) {
        startFbTimers();
        sendPresenceHeartbeat();
        fbPullAll(false, true);
      }
    }

    function logoutSession() {
      currentRole = null;
      pinBuffer = '';
      pinError = false;
      safeSSRemove(SESSION_ROLE_KEY);
      safeLSRemove(SESSION_ROLE_KEY);
      document.getElementById('app-shell').classList.add('hidden');
      document.getElementById('pin-screen').classList.remove('hidden');
      renderPinScreen();
    }

    // =========================================================================
    // 7. ВКЛАДКА 1: НАРЯДИ (ГРАФІК + ОБЛІК)
    // =========================================================================
    function getDutiesForDateAndType(dateIso, dutyTypeId) {
      return state.duties.filter(function(d) { return d.date === dateIso && d.dutyTypeId === dutyTypeId; });
    }

    function renderDutiesTab() {
      var sub =
        '<div class="seg-control">' +
          '<button type="button" class="seg-btn ' + (ui.dutiesSubtab === 'calendar' ? 'active' : '') + '" onclick="ui.dutiesSubtab=\'calendar\';render()">📅 Графік</button>' +
          '<button type="button" class="seg-btn ' + (ui.dutiesSubtab === 'stats' ? 'active' : '') + '" onclick="ui.dutiesSubtab=\'stats\';render()">📊 Облік</button>' +
        '</div>';

      if (ui.dutiesSubtab === 'stats') return sub + renderDutiesStats();

      var y = ui.calYear, m = ui.calMonth;
      var firstDay = new Date(y, m, 1);
      var daysInMonth = new Date(y, m + 1, 0).getDate();
      var startDow = (firstDay.getDay() + 6) % 7;
      var today = todayISO();

      var cells = '';
      for (var b = 0; b < startDow; b++) cells += '<div></div>';
      for (var d = 1; d <= daysInMonth; d++) {
        var iso = y + '-' + pad2(m + 1) + '-' + pad2(d);
        var dots = '';
        state.dutyTypes.forEach(function(dt) {
          if (getDutiesForDateAndType(iso, dt.id).length > 0) {
            dots += '<span class="cal-dot" style="background:' + esc(dt.color) + '"></span>';
          }
        });
        var cls = 'cal-cell' + (iso === today ? ' today' : '') + (iso === ui.selectedDate ? ' selected' : '');
        cells += '<button type="button" class="' + cls + '" onclick="ui.selectedDate=\'' + iso + '\';render()">' +
          '<span class="cal-num">' + d + '</span><span class="cal-dots">' + dots + '</span></button>';
      }

      var calendarCard =
        '<div class="card stack">' +
          '<div class="row-between">' +
            '<button type="button" class="btn-icon btn-icon-sm" onclick="changeCalMonth(-1)">◀</button>' +
            '<div class="fw-800" style="font-size:15px">' + MONTHS_NOM[m] + ' ' + y + '</div>' +
            '<button type="button" class="btn-icon btn-icon-sm" onclick="changeCalMonth(1)">▶</button>' +
          '</div>' +
          '<div class="cal-weekdays"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div class="wknd">Сб</div><div class="wknd">Нд</div></div>' +
          '<div class="cal-grid">' + cells + '</div>' +
        '</div>';

      var editable = canEditDuties();
      var dutyBlocks = state.dutyTypes.map(function(dt) {
        var recs = getDutiesForDateAndType(ui.selectedDate, dt.id);
        var listHtml = recs.length ? recs.map(function(rec) {
          var p = getPersonById(rec.personId);
          if (!p) return '';
          var sq = getSquadById(p.squadId);
          return '<div class="row-between" style="padding:7px 9px;border-radius:9px;background:var(--bg);border:1px solid var(--border)">' +
            '<div class="min0">' +
              '<div class="fw-bold text-sm">' + esc(p.rank) + ' ' + esc(p.fullName) + '</div>' +
              '<div class="text-xs text-muted">' + esc(sq ? sq.name : '') + '</div>' +
            '</div>' +
            (editable ? '<button type="button" class="btn-icon btn-icon-sm danger" onclick="removeDutyRecord(\'' + rec.id + '\')">✕</button>' : '') +
          '</div>';
        }).join('') : '<div class="text-xs text-muted">Не призначено</div>';

        return '<div class="stack-sm" style="padding:10px;border-radius:11px;background:rgba(11,17,32,0.55);border:1px solid var(--border)">' +
          '<div class="row-between">' +
            '<div class="row"><span class="dot" style="background:' + esc(dt.color) + '"></span><span class="fw-800">' + esc(dt.shortName) + '</span><span class="text-xs text-muted">(' + recs.length + '/' + dt.maxCount + ')</span></div>' +
            (editable ? '<button type="button" class="btn btn-xs btn-primary" onclick="openAssignDutyModal(\'' + dt.id + '\')">+ Призначити</button>' : '') +
          '</div>' +
          listHtml +
        '</div>';
      }).join('');

      var dayCard =
        '<div class="card stack">' +
          '<div class="row-between">' +
            '<div class="fw-800">Наряд на ' + fmtUA(ui.selectedDate) + '</div>' +
            '<button type="button" class="btn btn-sm btn-info" onclick="copyDutyForDate(\'' + ui.selectedDate + '\')">📋 Скопіювати</button>' +
          '</div>' +
          (!editable ? '<div class="info-banner">Режим перегляду нарядів.</div>' : '') +
          dutyBlocks +
        '</div>';

      return sub + calendarCard + dayCard;
    }

    function renderDutiesStats() {
      var prefix = ui.calYear + '-' + pad2(ui.calMonth + 1);
      var monthCounts = {}, totalCounts = {};
      state.duties.forEach(function(d) {
        totalCounts[d.personId] = (totalCounts[d.personId] || 0) + 1;
        if (String(d.date || '').indexOf(prefix) === 0) {
          monthCounts[d.personId] = (monthCounts[d.personId] || 0) + 1;
        }
      });

      var header =
        '<div class="card row-between">' +
          '<button type="button" class="btn-icon btn-icon-sm" onclick="changeCalMonth(-1)">◀</button>' +
          '<div class="fw-800">Облік: ' + MONTHS_NOM[ui.calMonth] + ' ' + ui.calYear + '</div>' +
          '<button type="button" class="btn-icon btn-icon-sm" onclick="changeCalMonth(1)">▶</button>' +
        '</div>';

      if (!state.personnel.length) {
        return header + '<div class="card empty-state">Особовий склад порожній. Додайте бійців у вкладці «Склад» або відновіть бекап у Налаштуваннях.</div>';
      }

      var groups = getOrderedSquads().map(function(sq) {
        var list = getPeopleBySquad(sq.id);
        if (!list.length) return '';
        var rows = list.map(function(p) {
          return '<div class="row-between" style="padding:9px 12px;border-bottom:1px solid var(--border);background:var(--bg)">' +
            '<div class="min0 row" style="gap:6px">' + getLeaderBadgeHtml(p, sq) + '<span class="fw-bold text-sm">' + esc(p.fullName) + '</span></div>' +
            '<div class="row" style="gap:6px;flex-shrink:0">' +
              '<span class="badge badge-info">Міс: ' + (monthCounts[p.id] || 0) + '</span>' +
              '<span class="badge badge-ok">Всього: ' + (totalCounts[p.id] || 0) + '</span>' +
            '</div>' +
          '</div>';
        }).join('');
        return '<div class="card-flush">' +
          '<div class="acc-header" style="cursor:default"><div class="row"><span class="dot" style="background:' + esc(sq.color) + '"></span><span class="fw-800">' + esc(sq.name) + '</span></div><span class="text-xs text-muted">' + list.length + ' ос.</span></div>' +
          '<div class="acc-body">' + rows + '</div>' +
        '</div>';
      }).join('');

      return header + groups;
    }

    function changeCalMonth(delta) {
      var d = new Date(ui.calYear, ui.calMonth + delta, 1);
      ui.calYear = d.getFullYear();
      ui.calMonth = d.getMonth();
      render();
    }

    function removeDutyRecord(dutyId) {
      if (!canEditDuties()) return;
      state.duties = state.duties.filter(function(d) { return d.id !== dutyId; });
      saveState(true);
      render();
    }

    function openAssignDutyModal(dtId) {
      if (!canEditDuties()) return;
      ui.dutyModalSelection = getDutiesForDateAndType(ui.selectedDate, dtId).map(function(d) { return d.personId; });
      renderAssignDutyModal(dtId);
    }

    function renderAssignDutyModal(dtId) {
      var dt = getDutyTypeById(dtId);
      if (!dt) return;
      var maxC = Number(dt.maxCount) || 1;
      var sel = ui.dutyModalSelection;

      var body = !state.personnel.length
        ? '<div class="empty-state">Особовий склад порожній.</div>'
        : getOrderedSquads().map(function(sq) {
            var list = getPeopleBySquad(sq.id);
            if (!list.length) return '';
            var rows = list.map(function(p) {
              var checked = sel.indexOf(p.id) !== -1;
              var locked = !checked && sel.length >= maxC;
              return '<label class="checkbox-row ' + (locked ? 'locked' : '') + '">' +
                '<div class="min0 row" style="gap:6px">' + getLeaderBadgeHtml(p, sq) + '<span class="fw-bold text-sm">' + esc(p.rank) + ' ' + esc(p.fullName) + '</span></div>' +
                '<input type="checkbox" ' + (checked ? 'checked' : '') + ' ' + (locked ? 'disabled' : '') + ' onchange="toggleDutyModalPerson(\'' + dtId + '\',\'' + p.id + '\')" />' +
              '</label>';
            }).join('');
            return '<div class="card-flush">' +
              '<div class="acc-header" style="cursor:default"><div class="row"><span class="dot" style="background:' + esc(sq.color) + '"></span><span class="fw-800 text-sm">' + esc(sq.name) + '</span></div></div>' +
              '<div class="acc-body">' + rows + '</div>' +
            '</div>';
          }).join('');

      openModal(
        '<div class="modal-header">' +
          '<div><div class="modal-title">' + esc(dt.shortName) + ' — ' + fmtUA(ui.selectedDate) + '</div>' +
          '<div class="text-xs text-muted">Обрано: ' + sel.length + ' / ' + maxC + '</div></div>' +
          '<button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<div class="modal-body">' + body +
          '<button type="button" class="btn btn-primary btn-full" onclick="saveAssignDutyModal(\'' + dtId + '\')">Зберегти наряд</button>' +
        '</div>'
      );
    }

    function toggleDutyModalPerson(dtId, pid) {
      var dt = getDutyTypeById(dtId);
      var maxC = dt ? (Number(dt.maxCount) || 1) : 1;
      var idx = ui.dutyModalSelection.indexOf(pid);
      if (idx !== -1) ui.dutyModalSelection.splice(idx, 1);
      else if (ui.dutyModalSelection.length < maxC) ui.dutyModalSelection.push(pid);
      renderAssignDutyModal(dtId);
    }

    function saveAssignDutyModal(dtId) {
      state.duties = state.duties.filter(function(d) {
        return !(d.date === ui.selectedDate && d.dutyTypeId === dtId);
      });
      ui.dutyModalSelection.forEach(function(pid) {
        state.duties.push({ id: genId('d'), date: ui.selectedDate, dutyTypeId: dtId, personId: pid, note: '' });
      });
      saveState(true);
      closeModal();
      showToast('Наряд збережено');
      render();
    }

    function copyDutyForDate(iso) {
      var lines = [state.groupNumber + ', ' + fmtUA(iso)];
      state.dutyTypes.forEach(function(dt, idx) {
        if (idx > 0) lines.push('');
        lines.push(dt.shortName + ':');
        var list = getDutiesForDateAndType(iso, dt.id).map(function(d) { return getPersonById(d.personId); }).filter(Boolean);
        if (!list.length) lines.push('-');
        else list.forEach(function(p) { lines.push('- ' + p.rank + ' ' + p.fullName); });
      });
      copyText(lines.join('\n'), 'Наряд скопійовано');
    }

    // =========================================================================
    // 8. ВКЛАДКА 2: ЗАДАЧІ (БЕЙДЖ + АДРЕСНА ВИДИМІСТЬ + 4 СТАТУСИ)
    // =========================================================================
    function renderTasksTab() {
      var canCreate = canCreateTasks();
      var canStatus = canUpdateTaskStatus();
      var canSeeAll = isAdmin() || Boolean(getPerm().tasksViewAll);

      var createForm = '';
      if (canCreate) {
        var opts = TASK_RECIPIENTS.map(function(r, idx) {
          return '<option value="' + idx + '">' + esc(r.label) + '</option>';
        }).join('');
        createForm =
          '<div class="card stack">' +
            '<div class="section-title">Поставити задачу</div>' +
            '<div class="field"><label class="field-label" for="task-rec">Кому</label><select id="task-rec" class="select">' + opts + '</select></div>' +
            '<div class="field"><label class="field-label" for="task-title">Заголовок / Суть задачі</label><input id="task-title" class="input" type="text" placeholder="Коротко про задачу..." /></div>' +
            '<div class="field"><label class="field-label" for="task-desc">Деталі (необов\'язково)</label><textarea id="task-desc" class="textarea" placeholder="Додаткові вказівки..."></textarea></div>' +
            '<div class="field"><label class="field-label" for="task-author">Хто поставив</label><input id="task-author" class="input" type="text" value="' + esc(getRoleMeta(currentRole).label) + '" /></div>' +
            '<button type="button" class="btn btn-primary btn-full" onclick="createNewTask()">+ Поставити задачу</button>' +
          '</div>';
      }

      var visible = state.tasks.filter(function(t) { return isTaskVisibleForRole(t, currentRole); });

      var recPills = '';
      if (canSeeAll) {
        var recOpts = [{ key: 'all', label: 'Усі' }, { key: 'kg', label: 'КГ' }, { key: 'kv1', label: 'КВ 1' }, { key: 'kv2', label: 'КВ 2' }, { key: 'kv3', label: 'КВ 3' }];
        recPills = '<div class="pills-scroll">' + recOpts.map(function(o) {
          return '<button type="button" class="pill ' + (ui.tasksFilterRecipient === o.key ? 'active' : '') + '" onclick="ui.tasksFilterRecipient=\'' + o.key + '\';render()">' + esc(o.label) + '</button>';
        }).join('') + '</div>';
      }

      var statusFilters = [
        { key: 'all', label: 'Усі (' + visible.length + ')' },
        { key: 'active', label: 'Активні' },
        { key: 'new', label: 'Нова' },
        { key: 'in_progress', label: 'В роботі' },
        { key: 'done', label: 'Виконано' },
        { key: 'failed', label: 'Не виконано' }
      ];
      var statusPills = '<div class="pills-scroll">' + statusFilters.map(function(sf) {
        return '<button type="button" class="pill ' + (ui.tasksFilterStatus === sf.key ? 'active' : '') + '" onclick="ui.tasksFilterStatus=\'' + sf.key + '\';render()">' + esc(sf.label) + '</button>';
      }).join('') + '</div>';

      var filtered = visible.filter(function(t) {
        if (canSeeAll && ui.tasksFilterRecipient !== 'all' && t.targetRole !== ui.tasksFilterRecipient) return false;
        if (ui.tasksFilterStatus === 'active') return t.status !== 'done';
        if (ui.tasksFilterStatus !== 'all' && t.status !== ui.tasksFilterStatus) return false;
        return true;
      });

      var cards = filtered.length ? filtered.map(function(t) {
        var stObj = TASK_STATUSES.find(function(x) { return x.key === t.status; }) || TASK_STATUSES[0];
        var stBtns = canStatus ? '<div class="status-group-4">' + TASK_STATUSES.map(function(s) {
          var cls = 'status-btn' + (t.status === s.key ? (' st-' + s.key) : '');
          return '<button type="button" class="' + cls + '" onclick="setTaskStatus(\'' + t.id + '\',\'' + s.key + '\')">' + esc(s.label) + '</button>';
        }).join('') + '</div>' : '';

        return '<div class="task-card">' +
          '<div class="row-between">' +
            '<span class="badge badge-warn">' + esc(t.target) + '</span>' +
            '<div class="row" style="gap:6px"><span class="badge ' + stObj.badgeClass + '">' + esc(stObj.label) + '</span>' +
              (canCreate ? '<button type="button" class="btn-icon btn-icon-sm danger" onclick="deleteTask(\'' + t.id + '\')">✕</button>' : '') +
            '</div>' +
          '</div>' +
          '<div style="font-size:15px;font-weight:800;color:#fff">' + esc(t.title) + '</div>' +
          (t.description ? '<div class="text-sm" style="color:#cbd5e1;white-space:pre-wrap">' + esc(t.description) + '</div>' : '') +
          '<div class="row-between text-xs text-muted"><span>' + (t.createdBy ? ('Від: ' + esc(t.createdBy)) : '') + '</span><span>' + esc(t.createdAt) + '</span></div>' +
          stBtns +
        '</div>';
      }).join('') : '<div class="card empty-state">Задач за обраним фільтром немає.</div>';

      return createForm + recPills + statusPills + cards;
    }

    function createNewTask() {
      if (!canCreateTasks()) return;
      var recIdx = Number(document.getElementById('task-rec').value) || 0;
      var title = (document.getElementById('task-title').value || '').trim();
      var desc = (document.getElementById('task-desc').value || '').trim();
      var author = (document.getElementById('task-author').value || '').trim();
      if (!title) { showToast('Введіть суть задачі', true); return; }
      var rec = TASK_RECIPIENTS[recIdx] || TASK_RECIPIENTS[0];
      var nowStr = fmtTimeNow();
      state.tasks.unshift({
        id: genId('t'),
        title: title,
        description: desc,
        target: rec.label,
        targetRole: rec.targetRole,
        targetSquadId: rec.targetSquadId,
        priority: 'normal',
        status: 'new',
        createdBy: author,
        createdAt: nowStr,
        updatedAt: nowStr
      });
      saveState(true);
      showToast('Задачу поставлено');
      render();
    }

    function setTaskStatus(taskId, status) {
      if (!canUpdateTaskStatus()) return;
      var t = state.tasks.find(function(x) { return x.id === taskId; });
      if (!t) return;
      t.status = status;
      t.updatedAt = fmtTimeNow();
      saveState(true);
      render();
    }

    function deleteTask(taskId) {
      if (!canCreateTasks()) return;
      state.tasks = state.tasks.filter(function(x) { return x.id !== taskId; });
      saveState(true);
      showToast('Задачу видалено');
      render();
    }

    // =========================================================================
    // 9. ВКЛАДКА 3: РОЗХІД (ПІДСУМОК ПО СТАТУСАХ + ПО ВІДДІЛЕННЯХ + КОПІЯ)
    // =========================================================================
    function buildRozkhidReportText() {
      var total = state.personnel.length;
      var byStatus = {};
      PRESENCE_STATUSES.forEach(function(st) { byStatus[st.key] = []; });
      state.personnel.forEach(function(p) {
        var k = normalizePresenceStatus(p.presenceStatus);
        if (!byStatus[k]) byStatus[k] = [];
        byStatus[k].push(p);
      });

      var inService = byStatus.in_service.length;
      var absent = total - inService;
      var lines = [
        'Розхід ' + state.groupNumber + ' • ' + fmtUA(todayISO()),
        'За списком: ' + total,
        'В строю: ' + inService,
        'Відсутні: ' + absent
      ];

      PRESENCE_STATUSES.forEach(function(st) {
        if (st.key === 'in_service') return;
        var arr = byStatus[st.key];
        if (!arr.length) return;
        var names = arr.map(function(p) { return p.fullName; }).join(', ');
        lines.push('— ' + st.label + ': ' + arr.length + ' (' + names + ')');
      });

      lines.push('');
      lines.push('По відділеннях:');
      getOrderedSquads().forEach(function(sq) {
        var list = getPeopleBySquad(sq.id);
        var ok = list.filter(function(p) { return normalizePresenceStatus(p.presenceStatus) === 'in_service'; }).length;
        lines.push('• ' + sq.name + ': ' + ok + '/' + list.length + ' в строю');
      });
      return lines.join('\n');
    }

    function renderRozkhidTab() {
      var total = state.personnel.length;
      var counts = {};
      PRESENCE_STATUSES.forEach(function(st) { counts[st.key] = 0; });
      state.personnel.forEach(function(p) {
        var k = normalizePresenceStatus(p.presenceStatus);
        counts[k] = (counts[k] || 0) + 1;
      });
      var inService = counts.in_service || 0;
      var absent = total - inService;

      var kpi =
        '<div class="grid-3">' +
          '<div class="kpi-box"><div class="kpi-val">' + total + '</div><div class="kpi-lbl">За списком</div></div>' +
          '<div class="kpi-box"><div class="kpi-val" style="color:var(--emerald)">' + inService + '</div><div class="kpi-lbl">В строю</div></div>' +
          '<div class="kpi-box"><div class="kpi-val" style="color:var(--amber)">' + absent + '</div><div class="kpi-lbl">Відсутні</div></div>' +
        '</div>';

      var statusRows = PRESENCE_STATUSES.filter(function(st) { return st.key !== 'in_service'; }).map(function(st) {
        var people = state.personnel.filter(function(p) { return normalizePresenceStatus(p.presenceStatus) === st.key; });
        var names = people.map(function(p) { return p.fullName; }).join(', ');
        return '<div class="stack-sm" style="padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--border)">' +
          '<div class="row-between"><span class="fw-bold text-sm">' + esc(st.label) + '</span><span class="badge ' + st.badgeClass + '">' + people.length + '</span></div>' +
          (names ? '<div class="text-xs text-muted">' + esc(names) + '</div>' : '') +
        '</div>';
      }).join('');

      var mode = getRozkhidMode();
      var squadQuickCards = getOrderedSquads().map(function(sq) {
        var list = getPeopleBySquad(sq.id);
        if (!list.length) return '';
        var ok = list.filter(function(p) { return normalizePresenceStatus(p.presenceStatus) === 'in_service'; }).length;
        var rows = list.map(function(p) {
          var stKey = normalizePresenceStatus(p.presenceStatus);

          return '<div class="row-between" style="padding:8px 10px;border-bottom:1px solid var(--border);background:var(--bg)">' +
            '<div class="min0">' +
              '<div class="row" style="gap:5px">' + getLeaderBadgeHtml(p, sq) + '<span class="fw-bold text-sm">' + esc(p.fullName) + '</span></div>' +
            '</div>' +
            (canEdit
              ? '<select class="select" style="width:auto;min-height:34px;padding:4px 8px;font-size:12px" onchange="setPersonPresence(\'' + p.id + '\',this.value)">' +
                  PRESENCE_STATUSES.map(function(s) {
                    return '<option value="' + s.key + '" ' + (stKey === s.key ? 'selected' : '') + '>' + esc(s.short) + '</option>';
                  }).join('') +
                '</select>'
              : '<span class="badge ' + stMeta.badgeClass + '">' + esc(stMeta.short) + '</span>') +
          '</div>';
        }).join('');

        return '<div class="card-flush">' +
          '<div class="acc-header" style="cursor:default">' +
            '<div class="row"><span class="dot" style="background:' + esc(sq.color) + '"></span><span class="fw-800 text-sm">' + esc(sq.name) + '</span></div>' +
            '<span class="badge badge-ok">' + ok + '/' + list.length + ' в строю</span>' +
          '</div>' +
          '<div class="acc-body">' + rows + '</div>' +
        '</div>';

      var previewCard =
        '<div class="card stack">' +
          '<div class="row-between"><div class="section-title">Текстовий звіт (Telegram / Viber)</div><button type="button" class="btn btn-xs btn-primary" onclick="copyText(buildRozkhidReportText(),\'Розхід скопійовано\')">📋 Скопіювати розхід</button></div>' +
          '<pre class="preview-pre">' + esc(buildRozkhidReportText()) + '</pre>' +
        '</div>';

      return kpi +
        (mode === 'view' ? '<div class="info-banner">Режим перегляду розходу.</div>' : '') +
        '<div class="card stack-sm"><div class="section-title">Відсутні по категоріях</div>' + statusRows + '</div>' +
        previewCard +

    function setPersonPresence(personId, statusKey) {
      var p = getPersonById(personId);
      if (!p || !canEditPersonPresence(p)) return;
      p.presenceStatus = normalizePresenceStatus(statusKey);
      saveState(true);
      render();

    function openPersonModal(personId) {
      if (getSkladMode() !== 'all_edit') return;
      var p = personId ? getPersonById(personId) : null;
      var sqOpts = getOrderedSquads().map(function(sq) {
        var sel = (p ? p.squadId : 'sq_1') === sq.id ? 'selected' : '';

      }).join('');

      openModal(
        '<div class="modal-header"><div class="modal-title">' + (p ? 'Редагувати бійця' : 'Додати бійця') + '</div><button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body">' +
          '<div class="field"><label class="field-label">ПІБ</label><input id="per-name" class="input" type="text" value="' + esc(p ? p.fullName : '') + '" placeholder="Прізвище Ім\'я" /></div>' +

    function savePersonModal(existingId) {
      var fullName = (document.getElementById('per-name').value || '').trim();
      var rank = (document.getElementById('per-rank').value || '').trim() || 'солдат';
      var squadId = document.getElementById('per-sq').value;
      var isLeader = document.getElementById('per-leader').checked;
      if (!fullName) { showToast('Введіть ПІБ', true); return; }

      if (existingId) {
        var p = getPersonById(existingId);
        if (p) { p.fullName = fullName; p.rank = rank; p.squadId = squadId; p.isLeader = isLeader; }
      } else {
        state.personnel.push({ id: genId('s'), fullName: fullName, rank: rank, squadId: squadId, isLeader: isLeader, presenceStatus: 'in_service' });
      }
      saveState(true);
      closeModal();
      showToast(existingId ? 'Дані оновлено' : 'Бійця додано');
      render();
    }

    function confirmDeletePerson(pid) {
      var p = getPersonById(pid);
      if (!p) return;
      openModal(
        '<div class="modal-header"><div class="modal-title">Видалити бійця?</div><button type="button" class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body">' +
          '<div class="text-sm">Видалити <b>' + esc(p.fullName) + '</b> зі складу?</div>' +
          '<div class="grid-2">' +
            '<button type="button" class="btn btn-secondary" onclick="closeModal()">Скасувати</button>' +
            '<button type="button" class="btn btn-danger" onclick="deletePerson(\'' + pid + '\')">Видалити</button>' +
          '</div>' +
        '</div>'
      );
    }

    function deletePerson(pid) {
      state.personnel = state.personnel.filter(function(p) { return p.id !== pid; });
      saveState(true);
      closeModal();
      showToast('Видалено зі складу');
      render();
    }

    function saveGroupNumber() {
      if (!isAdmin()) return;
      var val = (document.getElementById('set-group-num').value || '').trim();
      if (!val) return;
      state.groupNumber = val;
      saveState(true);
      showToast('Номер групи збережено');
    }

    function savePinsSettings() {
      if (!isAdmin()) return;
      var nextPins = {}, used = {};
      for (var i = 0; i < ROLE_ORDER.length; i++) {
        var k = ROLE_ORDER[i];
        var val = (document.getElementById('pin-' + k).value || '').trim();
        if (!/^\d{4}$/.test(val)) { showToast('Усі PIN-коди мають містити 4 цифри', true); return; }
        if (used[val]) { showToast('PIN-коди не можуть повторюватись', true); return; }
        used[val] = true;
        nextPins[k] = val;
      }
      state.pins = nextPins;
      saveState(true);
      showToast('PIN-коди збережено');
    }

    function setRolePerm(roleKey, field, val) {
      if (!isAdmin()) return;
      if (!state.rolePermissions[roleKey]) state.rolePermissions[roleKey] = Object.assign({}, DEFAULT_ROLE_PERMISSIONS[roleKey]);
      state.rolePermissions[roleKey][field] = val;
      saveState(true);
      showToast('Права оновлено');
    }

    // =========================================================================
    // 12. УНІВЕРСАЛЬНИЙ БЕКАП (JSON / CSV)
    // =========================================================================
    function exportBackupJSON() {
      try {
        state.lastBackupAt = fmtTimeNow();
        var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'pomichnyk_vzvodu_backup_' + todayISO() + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('Бекап збережено (' + state.personnel.length + ' осіб)');
      } catch (e) {
        showToast('Помилка збереження бекапу', true);
      }
    }

    function handleImportJSON(ev) {
      if (!isAdmin()) return;
      var file = ev.target && ev.target.files ? ev.target.files[0] : null;
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function() {
        try {
          var parsed = JSON.parse(String(reader.result || ''));
          state = normalizeState(parsed);
          saveState(true);
          render();
          showToast('✅ Відновлено з бекапу: ' + state.personnel.length + ' осіб');
        } catch (e) {
          showToast('Помилка читання JSON файлу', true);
        }
      };
      reader.readAsText(file);
      ev.target.value = '';
    }

    function exportPersonnelCSV() {
      var rows = [['Відділення', 'Звання', 'ПІБ', 'Командир', 'Статус']];
      getOrderedSquads().forEach(function(sq) {
        getPeopleBySquad(sq.id).forEach(function(p) {
          rows.push([sq.name, p.rank, p.fullName, p.isLeader ? 'Так' : 'Ні', getPresenceMeta(p.presenceStatus).label]);
        });
      });
      var csv = '\uFEFF' + rows.map(function(r) {
        return r.map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(';');
      }).join('\n');
      try {
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'sklad_' + state.groupNumber + '_' + todayISO() + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('CSV експортовано');
      } catch (e) {
        showToast('Помилка експорту CSV', true);
      }
    }

    // =========================================================================
    // 13. МОДАЛКИ, БЕЙДЖ ЗАДАЧ, ГОЛОВНИЙ РЕНДЕР ТА ЗАПУСК
    // =========================================================================
    function openModal(html) {
      var box = document.getElementById('modal-box');
      var root = document.getElementById('modal-root');
      if (!box || !root) return;
      box.innerHTML = html;
      root.classList.add('open');
    }
    function closeModal() {
      var root = document.getElementById('modal-root');
      if (root) root.classList.remove('open');
    }

    function switchTab(tab) {
      ui.tab = tab;
      render();
      window.scrollTo(0, 0);
    }

    function updateTasksBadge() {
      var badge = document.getElementById('nav-tasks-badge');
      if (!badge || !currentRole) return;
      var activeCount = state.tasks.filter(function(t) {
        return t.status !== 'done' && isTaskVisibleForRole(t, currentRole);
      }).length;
      if (activeCount <= 0) {
        badge.classList.add('hidden');
        badge.textContent = '0';
      } else {
        badge.classList.remove('hidden');
        badge.textContent = activeCount > 99 ? '99+' : String(activeCount);
      }
    }

    function render() {
      if (!currentRole) return;
      updateSyncPillUI();
      updateTasksBadge();

      document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
      var activeBtn = document.getElementById('nav-' + ui.tab);
      if (activeBtn) activeBtn.classList.add('active');

      var main = document.getElementById('main-content');
      if (!main) return;
      if (ui.tab === 'duties') main.innerHTML = renderDutiesTab();
      else if (ui.tab === 'tasks') main.innerHTML = renderTasksTab();
      else if (ui.tab === 'rozkhid') main.innerHTML = renderRozkhidTab();
      else if (ui.tab === 'personnel') main.innerHTML = renderPersonnelTab();
      else main.innerHTML = renderSettingsTab();
    }

    (function bootstrap() {
      try {
        var params = new URLSearchParams(window.location.search);
        var fbParam = params.get('fb') || params.get('db');
        if (fbParam) {
          var normalized = normalizeFirebaseBaseUrl(fbParam);
          if (normalized) {
            fbUrl = normalized;
            safeLSSet(FB_URL_STORAGE_KEY, fbUrl);
          }
        }
      } catch (e) {}

      var savedRole = safeSSGet(SESSION_ROLE_KEY) || safeLSGet(SESSION_ROLE_KEY);
      if (savedRole && ROLES_META[savedRole]) {
        loginAsRole(savedRole);
      } else {
        document.getElementById('pin-screen').classList.remove('hidden');
        renderPinScreen();
      }
    })();
  </script>
</body>
</html>

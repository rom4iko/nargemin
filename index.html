<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d1217" />
  <title>Помічник взводу</title>
  <style>
    :root {
      --bg: #0d1217;
      --card: #161e27;
      --card-hover: #1e2834;
      --border: #263240;
      --text: #e6edf3;
      --muted: #8b98a5;
      --olive: #4d7c3f;
      --olive-hover: #3f6733;
      --accent: #4ade80;
      --danger: #ef4444;
      --warn: #f59e0b;
      --radius: 14px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px; line-height: 1.4;
      overscroll-behavior-y: none;
    }
    button, input, select, textarea {
      font-family: inherit; font-size: 14px; color: var(--text);
    }
    button { cursor: pointer; border: none; background: none; padding: 0; }
    .app {
      max-width: 600px; margin: 0 auto; min-height: 100vh;
      display: flex; flex-direction: column; padding-bottom: 84px;
    }
    /* Шапка */
    .header {
      position: sticky; top: 0; z-index: 30;
      background: rgba(13, 18, 23, 0.94);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(77, 124, 63, 0.22); border: 1px solid rgba(74, 222, 128, 0.35);
      color: var(--accent); display: flex; align-items: center; justify-content: center;
    }
    .brand-title { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -0.2px; }
    .brand-sub { font-size: 11px; color: var(--muted); }
    .ver-badge {
      font-size: 11px; font-weight: 700; color: var(--accent);
      background: rgba(74, 222, 128, 0.12); border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 3px 8px; border-radius: 999px;
    }
    /* Контент */
    .main { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px;
    }
    .card-flush {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .text-xs { font-size: 12px; }
    .text-sm { font-size: 13.5px; }
    .text-muted { color: var(--muted); }
    .section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; }
    .empty-state { text-align: center; padding: 24px 12px; color: var(--muted); font-size: 13.5px; }

    /* Кнопки */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 42px; padding: 8px 14px; border-radius: 11px;
      font-weight: 700; font-size: 13.5px; transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-sm { min-height: 34px; padding: 5px 10px; font-size: 12px; border-radius: 9px; }
    .btn-full { width: 100%; }
    .btn-primary { background: var(--olive); color: #fff; }
    .btn-primary:hover { background: var(--olive-hover); }
    .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--card-hover); }
    .btn-danger { background: rgba(239, 68, 68, 0.14); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }
    .btn-icon {
      width: 36px; height: 36px; border-radius: 9px;
      background: var(--bg); border: 1px solid var(--border); color: var(--muted);
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-icon.danger { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.3); color: #f87171; }

    /* Поля вводу */
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field-label { font-size: 12px; font-weight: 700; color: var(--muted); }
    .input, .select, .textarea {
      width: 100%; min-height: 42px; padding: 9px 12px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border); color: #fff;
      outline: none;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); }
    .textarea { min-height: 80px; resize: vertical; }
    .chips-wrap { display: flex; flex-wrap: wrap; gap: 6px; }

    /* Підвкладки та пілюлі */
    .seg-control {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
      background: var(--card); border: 1px solid var(--border);
      padding: 4px; border-radius: 12px;
    }
    .seg-btn {
      padding: 8px; border-radius: 9px; font-size: 13px; font-weight: 700;
      color: var(--muted); text-align: center;
    }
    .seg-btn.active { background: var(--olive); color: #fff; }
    .pills-scroll {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
      scrollbar-width: none;
    }
    .pills-scroll::-webkit-scrollbar { display: none; }
    .pill {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
    }
    .pill.active { background: var(--olive); border-color: var(--olive); color: #fff; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* Календар */
    .date-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 6px 8px;
    }
    .date-bar-title { font-size: 14px; font-weight: 800; color: #fff; text-align: center; flex: 1; }
    .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-bottom: 6px; }
    .cal-weekdays div { font-size: 11px; font-weight: 700; color: var(--muted); }
    .cal-weekdays .wknd { color: #fbbf24; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-cell {
      height: 46px; border-radius: 9px; border: 1px solid transparent;
      background: rgba(13, 18, 23, 0.55); color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 5px 2px;
    }
    .cal-cell.today { border-color: rgba(74, 222, 128, 0.5); }
    .cal-cell.selected { background: rgba(77, 124, 63, 0.35); border-color: var(--accent); color: #fff; }
    .cal-num { font-size: 12.5px; font-weight: 700; line-height: 1; }
    .cal-dots { display: flex; gap: 2px; height: 6px; align-items: center; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; }

    /* Рядки бійців та бейджі */
    .soldier-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; background: var(--bg);
    }
    .soldier-info { min-width: 0; flex: 1; }
    .soldier-name { font-size: 14px; font-weight: 700; color: #fff; }
    .badge {
      display: inline-flex; align-items: center; padding: 2px 6px;
      border-radius: 6px; font-size: 10.5px; font-weight: 700;
    }
    .badge-kg { background: rgba(234, 179, 8, 0.2); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.4); }
    .badge-kv { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-ok { background: rgba(74, 222, 128, 0.16); color: #86efac; }
    .badge-warn { background: rgba(245, 158, 11, 0.18); color: #fcd34d; }
    .badge-err { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }

    /* Акордеон */
    .acc-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 11px 12px; background: rgba(13, 18, 23, 0.5);
      cursor: pointer; user-select: none;
    }
    .chevron { transition: transform 0.18s; color: var(--muted); flex-shrink: 0; }
    .acc-header.open .chevron { transform: rotate(90deg); color: #fff; }
    .acc-body { border-top: 1px solid var(--border); }

    /* Задачі */
    .task-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 13px; display: flex; flex-direction: column; gap: 10px;
    }
    .status-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .status-btn {
      padding: 7px 4px; border-radius: 9px; font-size: 11.5px; font-weight: 700;
      background: var(--bg); border: 1px solid var(--border); color: var(--muted); text-align: center;
    }
    .status-btn.st-received { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; color: #93c5fd; }
    .status-btn.st-done { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #86efac; }
    .status-btn.st-failed { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #fca5a5; }

    /* Розхід */
    .kpi-box {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 11px; padding: 10px; text-align: center;
    }
    .kpi-val { font-size: 20px; font-weight: 800; color: #fff; }
    .kpi-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .rozkhid-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border);
    }
    .rozkhid-row.active { border-color: rgba(245, 158, 11, 0.45); }
    .stepper { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .step-btn {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--card); border: 1px solid var(--border);
      color: #fff; font-size: 16px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .step-val { min-width: 22px; text-align: center; font-weight: 800; font-size: 14px; }
    .preview-pre {
      margin: 0; padding: 12px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border);
      color: #e6edf3; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px; white-space: pre-wrap; word-break: break-word; line-height: 1.45;
    }
    .toggle-pill {
      display: flex; align-items: center; gap: 7px; padding: 8px 10px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .checkbox-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; background: var(--bg); border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .checkbox-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; }

    /* Нижня навігація (5 вкладок) */
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      background: rgba(22, 30, 39, 0.96);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 600px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(5, 1fr); height: 64px;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; font-size: 10.5px; font-weight: 700; color: var(--muted);
    }
    .nav-btn.active { color: var(--accent); }

    /* Модальне вікно */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0, 0, 0, 0.78);
      display: none; align-items: flex-end; justify-content: center; padding: 0;
    }
    .modal-backdrop.open { display: flex; }
    @media (min-width: 520px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }
    .modal-box {
      width: 100%; max-width: 540px; max-height: 90vh;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden;
    }
    @media (min-width: 520px) { .modal-box { border-radius: 18px; } }
    .modal-header {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .modal-title { font-size: 16px; font-weight: 800; color: #fff; }
    .modal-body {
      padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    }

    /* Toast */
    .toast-root {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
      z-index: 60; width: 92%; max-width: 380px; pointer-events: none;
      display: flex; flex-direction: column; gap: 6px;
    }
    .toast {
      padding: 10px 14px; border-radius: 11px; text-align: center;
      font-size: 13px; font-weight: 700; color: #fff;
      background: #1d2833; border: 1px solid rgba(74, 222, 128, 0.5);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
    .toast.error { background: #3b171b; border-color: rgba(239, 68, 68, 0.6); color: #fecaca; }
    .color-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .color-swatch {
      width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent;
    }
    .color-swatch.selected { border-color: #fff; transform: scale(1.1); }
  </style>
</head>
<body>

      { id: 'Хв', label: 'Хворий (Хв)' }
    ];
    const PERM_ABSENT = new Set(['Ш','Л','Вд','Вп','Г','Пк','Хв']);

    // =========================================================================
    // СТАН ДАНИХ ТА UI
    // =========================================================================
    const todayObj = new Date();
    let state = {
      groupNumber: '223',
      squads: [],
      soldiers: [],
      dutyTypes: [],
      duties: [],
      tasks: [],
      rozkhid: {},
      lastBackupAt: null
    };

    let ui = {
      activeTab: 'duties',
      dutiesSubTab: 'schedule',
      year: todayObj.getFullYear(),
      month: todayObj.getMonth(),
      selectedDate: toISO(todayObj),
      scheduleSquadFilter: 'all',
      statsSquadFilter: 'all',
      rozkhidDate: toISO(todayObj),
      rozkhidIncludeNames: true,
      rozkhidHideZeros: false,
      rozkhidModalCat: '',
      rozkhidModalSearch: '',
      rozkhidModalOpenSquads: {},
      openPersonnelSquads: {},
      openSoldiers: {},
      openTaskNotes: {}
    };

    let assignModal = { date: '', dutyTypeId: '', selectedIds: [] };
    let tempColor = '#3b82f6';

    // =========================================================================
    // УТИЛІТИ
    // =========================================================================
    function genId(p) {
      return p + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
    }
    function toISO(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function addDaysISO(iso, delta) {
      const parts = iso.split('-').map(Number);
      const d = new Date(parts[0], parts[1] - 1, parts[2] + delta);
      return toISO(d);
    }
    function formatHuman(iso) {
      const p = iso.split('-').map(Number);
      return p[2] + ' ' + MONTHS_GEN[p[1] - 1] + ' ' + p[0];
    }
    function formatShortDate(iso) {
      if (!iso) return '—';
      const p = iso.split('-');
      return p[2] + '.' + p[1] + '.' + p[0];
    }
    function monthPrefix(y, m) {
      return y + '-' + String(m + 1).padStart(2, '0');
    }
    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function capitalizePIB(str) {
      return String(str || '').replace(/(^|[\s-])([а-яіїєґa-z])/gi, function(m, sep, ch) {
        return sep + ch.toUpperCase();
      });
    }
    function isGroupCmd(sq) {
      return Boolean(sq && (sq.isGroupCmd || sq.id === GROUP_CMD_ID));
    }
    function getOrderedSquads() {
      const list = Array.isArray(state.squads) ? state.squads : [];
      const kg = list.filter(isGroupCmd);
      const rest = list.filter(function(s) { return !isGroupCmd(s); });
      return kg.concat(rest);
    }
    function getSquadById(id) {
      return state.squads.find(function(s) { return s.id === id; }) || { id: id, name: 'Без відділення', color: '#64748b' };
    }
    function getSoldierById(id) {
      return state.soldiers.find(function(s) { return s.id === id; });
    }
    function getDutyTypeById(id) {
      return state.dutyTypes.find(function(d) { return d.id === id; }) || { id: id, name: 'Наряд', desc: '', maxPeople: 1, color: '#64748b' };
    }
    function sortSquadMembers(members) {
      return members.slice().sort(function(a, b) {
        if (a.isCommander && !b.isCommander) return -1;
        if (!a.isCommander && b.isCommander) return 1;
        return String(a.name || '').localeCompare(String(b.name || ''), 'uk');
      });
    }
    function normalizeStatus(st) {
      if (st === 'leave') return 'Вп';
      if (st === 'medical') return 'Л';
      if (st === 'trip') return 'Вд';
      if (PERM_ABSENT.has(st)) return st;
      return 'active';
    }
    function getStatusLabel(st) {
      const found = SOLDIER_STATUSES.find(function(x) { return x.id === st; });
      return found ? found.label : 'В строю';
    }
    function getSoldierDutyCounts(soldierId, y, m) {
      const pref = monthPrefix(y, m);
      let monthCount = 0;
      let totalCount = 0;
      for (let i = 0; i < state.duties.length; i++) {
        const d = state.duties[i];
        if (d.soldierId === soldierId) {
          totalCount++;
          if (d.date && d.date.indexOf(pref) === 0) monthCount++;
        }
      }
      return { monthCount: monthCount, totalCount: totalCount };
    }

    // =========================================================================
    // БЕЗПЕЧНЕ ЗБЕРЕЖЕННЯ ТА МІГРАЦІЯ LOCALSTORAGE
    // =========================================================================
    function createEmptyState() {
      return {
        groupNumber: '223',
        squads: JSON.parse(JSON.stringify(DEFAULT_SQUADS)),
        soldiers: [],
        dutyTypes: JSON.parse(JSON.stringify(DEFAULT_DUTY_TYPES)),
        duties: [],
        tasks: [],
        rozkhid: {},
        lastBackupAt: null
      };
    }

    function ensureSquadsValid(rawSquads) {
      let arr = Array.isArray(rawSquads) && rawSquads.length ? rawSquads.slice() : JSON.parse(JSON.stringify(DEFAULT_SQUADS));
      const hasKG = arr.some(isGroupCmd);
      if (!hasKG) {
        arr.unshift({ id: GROUP_CMD_ID, name: 'Командир групи', color: '#eab308', isGroupCmd: true });
      }
      return arr.map(function(sq, idx) {
        return {
          id: sq.id || genId('sq'),
          name: sq.name || ('Відділення ' + idx),
          color: sq.color || PALETTE[idx % PALETTE.length],
          isGroupCmd: isGroupCmd(sq)
        };
      });
    }

    function ensureDutyTypesValid(rawTypes) {
      if (!Array.isArray(rawTypes) || rawTypes.length === 0) {
        return JSON.parse(JSON.stringify(DEFAULT_DUTY_TYPES));
      }
      return rawTypes.map(function(dt, idx) {
        const low = String(dt.name || '').toLowerCase();
        const isDn = low === 'дн' || low.indexOf('днювальн') !== -1;
        const maxP = Math.min(10, Math.max(1, Number(dt.maxPeople) || (isDn ? 3 : 1)));
        return {
          id: dt.id || genId('dt'),
          name: dt.name || 'Наряд',
          desc: dt.desc || '',
          maxPeople: maxP,
          color: dt.color || PALETTE[(idx + 1) % PALETTE.length]
        };
      });
    }

    function migrateRozkhid(raw) {
      const out = {};
      if (!raw || typeof raw !== 'object') return out;
      Object.keys(raw).forEach(function(k) {
        const v = raw[k];
        if (!v || typeof v !== 'object') return;
        if (v.overrides && typeof v.overrides === 'object') {
          out[k] = { cleared: Boolean(v.cleared), overrides: Object.assign({}, v.overrides), extra: Object.assign({}, v.extra || {}) };
        } else {
          out[k] = { cleared: false, overrides: Object.assign({}, v), extra: {} };
        }
      });
      return out;
    }

    function loadState() {
      try {
        let raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const legacyKeys = ['pomichnyk_vzvodu_v3', 'pomichnyk_vzvodu_v2', 'pomichnyk_vzvodu_v1', 'platoon_duty_tracker_v1'];
          for (let i = 0; i < legacyKeys.length; i++) {
            const l = localStorage.getItem(legacyKeys[i]);
            if (l) { raw = l; break; }
          }
        }
        if (!raw) {
          state = createEmptyState();
          saveState();
          return;
        }
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') throw new Error('Invalid state');
        state = {
          groupNumber: (typeof parsed.groupNumber === 'string' && parsed.groupNumber.trim()) ? parsed.groupNumber.trim() : '223',
          squads: ensureSquadsValid(parsed.squads),
          soldiers: Array.isArray(parsed.soldiers) ? parsed.soldiers.map(function(s) {
            return {
              id: s.id || genId('s'),
              name: String(s.name || ''),
              rank: String(s.rank || ''),
              squadId: s.squadId || 'sq_1',
              isCommander: Boolean(s.isCommander),
              status: normalizeStatus(s.status)
            };
          }) : [],
          dutyTypes: ensureDutyTypesValid(parsed.dutyTypes),
          duties: Array.isArray(parsed.duties) ? parsed.duties : [],
          tasks: Array.isArray(parsed.tasks) ? parsed.tasks : [],
          rozkhid: migrateRozkhid(parsed.rozkhid),
          lastBackupAt: parsed.lastBackupAt || null
        };
        saveState();
      } catch (err) {
        console.error('loadState error:', err);
        state = createEmptyState();
        saveState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error('saveState error:', err);
        showToast('Помилка збереження у памʼять браузера', 'error');
      }
    }

    // =========================================================================
    // СПОВІЩЕННЯ, МОДАЛКИ, БУФЕР ОБМІНУ
    // =========================================================================
    function showToast(msg, type) {
      const root = document.getElementById('toast-root');
      if (!root) return;
      const el = document.createElement('div');
      el.className = 'toast' + (type === 'error' ? ' error' : '');
      el.textContent = msg;
      root.appendChild(el);
      setTimeout(function() {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.2s';
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
      }, 2300);
    }

    function openModal(html) {
      const root = document.getElementById('modal-root');
      const box = document.getElementById('modal-box');
      if (!root || !box) return;
      box.innerHTML = html;
      root.classList.add('open');
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      if (root) root.classList.remove('open');
    }

    function showConfirm(title, message, btnText, onOk, isDanger) {
      openModal(
        '<div class="modal-header"><div class="modal-title">' + esc(title) + '</div><button class="btn-icon" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body">' +
          '<div class="text-sm text-muted">' + esc(message) + '</div>' +
          '<div class="grid-2">' +
            '<button class="btn btn-secondary" onclick="closeModal()">Скасувати</button>' +
            '<button id="confirm-ok-btn" class="btn ' + (isDanger ? 'btn-danger' : 'btn-primary') + '">' + esc(btnText) + '</button>' +
          '</div>' +
        '</div>'
      );
      const okBtn = document.getElementById('confirm-ok-btn');
      if (okBtn) okBtn.onclick = function() { closeModal(); onOk(); };
    }

    function copyText(text, successMsg) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) {
          showToast(successMsg || 'Скопійовано');
          return;
        }
      } catch (e) {}
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
          showToast(successMsg || 'Скопійовано');
        }).catch(function() {
          showToast('Не вдалося скопіювати автоматично', 'error');
        });
      } else {
        showToast('Не вдалося скопіювати автоматично', 'error');
      }
    }

    // =========================================================================
    // НАВІГАЦІЯ
    // =========================================================================
    function switchTab(tab) {
      ui.activeTab = tab;
      render();
      window.scrollTo(0, 0);
    }
    function setDutiesSubTab(sub) {
      ui.dutiesSubTab = sub;
      render();
    }
    function changeMonth(delta) {
      ui.month += delta;
      if (ui.month < 0) { ui.month = 11; ui.year--; }
      else if (ui.month > 11) { ui.month = 0; ui.year++; }
      ui.selectedDate = (ui.year === todayObj.getFullYear() && ui.month === todayObj.getMonth())
        ? toISO(todayObj)
        : monthPrefix(ui.year, ui.month) + '-01';
      render();
    }
    function goTodayCalendar() {
      const now = new Date();
      ui.year = now.getFullYear();
      ui.month = now.getMonth();
      ui.selectedDate = toISO(now);
      render();
    }

    function renderMonthBar(showTodayBtn) {
      return (
        '<div class="date-bar">' +
          '<button class="btn-icon" onclick="changeMonth(-1)" aria-label="Попередній місяць">‹</button>' +
          '<div class="date-bar-title">' + MONTHS_UK[ui.month] + ' ' + ui.year + '</div>' +
          (showTodayBtn ? '<button class="btn btn-sm btn-secondary" onclick="goTodayCalendar()">Сьогодні</button>' : '') +
          '<button class="btn-icon" onclick="changeMonth(1)" aria-label="Наступний місяць">›</button>' +
        '</div>'
      );
    }

    function renderSquadPills(activeId, fnName) {
      const items = [{ id: 'all', name: 'Усі', color: '#4ade80' }].concat(getOrderedSquads());
      return '<div class="pills-scroll">' + items.map(function(sq) {
        return '<button class="pill ' + (activeId === sq.id ? 'active' : '') + '" onclick="' + fnName + '(\'' + sq.id + '\')">' +
          '<span class="dot" style="background:' + sq.color + '"></span><span>' + esc(sq.name) + '</span></button>';
      }).join('') + '</div>';
    }

    // =========================================================================
    // ВКЛАДКА 1: НАРЯДИ (ГРАФІК + ОБЛІК)
    // =========================================================================
    function setScheduleSquadFilter(id) { ui.scheduleSquadFilter = id; render(); }
    function setStatsSquadFilter(id) { ui.statsSquadFilter = id; render(); }
    function selectCalDate(iso) { ui.selectedDate = iso; render(); }

    function renderDutiesTab() {
      const seg =
        '<div class="seg-control">' +
          '<button class="seg-btn ' + (ui.dutiesSubTab === 'schedule' ? 'active' : '') + '" onclick="setDutiesSubTab(\'schedule\')">Графік</button>' +
          '<button class="seg-btn ' + (ui.dutiesSubTab === 'stats' ? 'active' : '') + '" onclick="setDutiesSubTab(\'stats\')">Облік</button>' +
        '</div>';
      return seg + (ui.dutiesSubTab === 'schedule' ? renderScheduleView() : renderStatsView());
    }

    function renderScheduleView() {
      const y = ui.year, m = ui.month;
      const pref = monthPrefix(y, m);
      const firstDay = new Date(y, m, 1);
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      let offset = firstDay.getDay() - 1;
      if (offset < 0) offset = 6;
      const todayISO = toISO(new Date());

      const byDate = {};
      state.duties.forEach(function(d) {
        if (!d.date || d.date.indexOf(pref) !== 0) return;
        const s = getSoldierById(d.soldierId);
        if (!s) return;
        if (ui.scheduleSquadFilter !== 'all' && s.squadId !== ui.scheduleSquadFilter) return;
        if (!byDate[d.date]) byDate[d.date] = [];
        byDate[d.date].push(d);
      });

      let cells = '';
      for (let i = 0; i < offset; i++) cells += '<div></div>';
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = pref + '-' + String(day).padStart(2, '0');
        const list = byDate[iso] || [];
        const cls = 'cal-cell' + (iso === ui.selectedDate ? ' selected' : '') + (iso === todayISO ? ' today' : '');
        const dots = list.slice(0, 4).map(function(d) {
          const dt = getDutyTypeById(d.dutyTypeId);
          return '<span class="cal-dot" style="background:' + dt.color + '"></span>';
        }).join('');
        cells += '<button class="' + cls + '" onclick="selectCalDate(\'' + iso + '\')">' +
          '<span class="cal-num">' + day + '</span><div class="cal-dots">' + dots + '</div></button>';
      }

      const dayDuties = state.duties.filter(function(d) {
        if (d.date !== ui.selectedDate) return false;
        const s = getSoldierById(d.soldierId);
        if (!s) return false;
        if (ui.scheduleSquadFilter !== 'all' && s.squadId !== ui.scheduleSquadFilter) return false;
        return true;
      });

      const grouped = [];
      const seen = new Set();
      state.dutyTypes.forEach(function(dt) {
        const items = dayDuties.filter(function(d) { return d.dutyTypeId === dt.id; });
        if (items.length) { grouped.push({ dt: dt, items: items }); seen.add(dt.id); }
      });
      dayDuties.forEach(function(d) {
        if (!seen.has(d.dutyTypeId)) {
          const dt = getDutyTypeById(d.dutyTypeId);
          grouped.push({ dt: dt, items: dayDuties.filter(function(x) { return x.dutyTypeId === d.dutyTypeId; }) });
          seen.add(d.dutyTypeId);
        }
      });

      const listHtml = grouped.length === 0
        ? '<div class="empty-state">На ' + formatHuman(ui.selectedDate) + ' нарядів не призначено.</div>'
        : '<div class="stack">' + grouped.map(function(g) {
            return '<div class="stack" style="gap:6px">' +
              '<div class="row-between">' +
                '<div class="row"><span class="dot" style="background:' + g.dt.color + '"></span><span class="section-title" style="color:' + g.dt.color + '">' + esc(g.dt.name) + (g.dt.desc ? ' — ' + esc(g.dt.desc) : '') + '</span></div>' +
                '<span class="text-xs text-muted">' + g.items.length + (g.dt.maxPeople > 1 ? ' / ' + g.dt.maxPeople : '') + ' ос.</span>' +
              '</div>' +
              g.items.map(function(d) {
                const s = getSoldierById(d.soldierId);
                const sq = getSquadById(s.squadId);
                return '<div class="soldier-row" style="border-radius:10px;border:1px solid var(--border);border-left:4px solid ' + sq.color + '">' +
                  '<div class="soldier-info">' +
                    '<div class="row" style="flex-wrap:wrap"><span class="soldier-name">' + esc(s.name) + '</span>' +
                      (isGroupCmd(sq) ? '<span class="badge badge-kg">★ КГ</span>' : (s.isCommander ? '<span class="badge badge-kv">★ КВ</span>' : '')) +
                    '</div>' +
                    '<div class="text-xs text-muted">' + esc(sq.name) + (s.rank ? ' • ' + esc(s.rank) : '') + '</div>' +
                  '</div>' +
                  '<button class="btn-icon danger" onclick="removeDuty(\'' + d.id + '\')" title="Видалити">✕</button>' +
                '</div>';
              }).join('') +
            '</div>';
          }).join('') + '</div>';

      return (
        renderMonthBar(true) +
        renderSquadPills(ui.scheduleSquadFilter, 'setScheduleSquadFilter') +
        '<div class="card">' +
          '<div class="cal-weekdays">' + WEEKDAYS_UK.map(function(w, i) { return '<div class="' + (i >= 5 ? 'wknd' : '') + '">' + w + '</div>'; }).join('') + '</div>' +
          '<div class="cal-grid">' + cells + '</div>' +
        '</div>' +
        '<div class="card stack">' +
          '<div class="row-between">' +
            '<div><div style="font-weight:800;color:#fff">' + formatHuman(ui.selectedDate) + '</div><div class="text-xs text-muted">Призначено: ' + dayDuties.length + '</div></div>' +
            '<button class="btn btn-sm btn-primary" onclick="openAssignDutyModal(\'' + ui.selectedDate + '\')">+ Призначити</button>' +
          '</div>' +
          listHtml +
          (dayDuties.length > 0
            ? '<div class="grid-2">' +
                '<button class="btn btn-secondary" onclick="openDayDutiesPreview(\'' + ui.selectedDate + '\')">Перегляд</button>' +
                '<button class="btn btn-primary" onclick="copyDayDuties(\'' + ui.selectedDate + '\')">Скопіювати наряд</button>' +
              '</div>'
            : '') +
        '</div>'
      );
    }

    function generateDayDutiesText(isoDate) {
      const dayDuties = state.duties.filter(function(d) {
        if (d.date !== isoDate) return false;
        const s = getSoldierById(d.soldierId);
        if (!s) return false;
        if (ui.scheduleSquadFilter !== 'all' && s.squadId !== ui.scheduleSquadFilter) return false;
        return true;
      });
      if (!dayDuties.length) return '';

      const groupNum = (state.groupNumber || '223').trim() || '223';
      const header = groupNum + ', ' + formatShortDate(isoDate);

      const order = state.dutyTypes.slice();
      const known = new Set(order.map(function(dt) { return dt.id; }));
      dayDuties.forEach(function(d) {
        if (!known.has(d.dutyTypeId)) {
          order.push(getDutyTypeById(d.dutyTypeId));
          known.add(d.dutyTypeId);
        }
      });

      const blocks = [];
      order.forEach(function(dt) {
        const items = dayDuties.filter(function(d) { return d.dutyTypeId === dt.id; });
        if (!items.length) return;
        const lines = [dt.name + ':'];
        items.forEach(function(d) {
          const s = getSoldierById(d.soldierId);
          if (!s) return;
          const rankPrefix = s.rank && s.rank.trim() ? s.rank.trim() + ' ' : '';
          lines.push('-' + rankPrefix + s.name);
        });
        blocks.push(lines.join('\n'));
      });
      return header + '\n' + blocks.join('\n\n');
    }

    function openDayDutiesPreview(isoDate) {
      const txt = generateDayDutiesText(isoDate);
      if (!txt) return;
      openModal(
        '<div class="modal-header"><div class="modal-title">Наряд на ' + formatShortDate(isoDate) + '</div><button class="btn-icon" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body">' +
          '<pre class="preview-pre">' + esc(txt) + '</pre>' +
          '<button class="btn btn-primary btn-full" onclick="copyDayDuties(\'' + isoDate + '\'); closeModal();">Скопіювати наряд</button>' +
        '</div>'
      );
    }

    function copyDayDuties(isoDate) {
      const txt = generateDayDutiesText(isoDate);
      if (!txt) { showToast('На цей день нарядів немає', 'error'); return; }
      copyText(txt, 'Наряд скопійовано');
    }

    function removeDuty(id) {
      state.duties = state.duties.filter(function(d) { return d.id !== id; });
      saveState();
      render();
      showToast('Наряд видалено');
    }

    function openAssignDutyModal(isoDate) {
      if (state.soldiers.length === 0) {
        showToast('Спочатку додайте бійців у вкладці «Склад»', 'error');
        return;
      }
      assignModal.date = isoDate;
      assignModal.dutyTypeId = state.dutyTypes[0] ? state.dutyTypes[0].id : '';
      assignModal.selectedIds = [];
      renderAssignDutyModal();
    }

    function selectAssignType(dtId) {
      assignModal.dutyTypeId = dtId;
      assignModal.selectedIds = [];
      renderAssignDutyModal();
    }

    function toggleAssignSoldier(soldierId) {
      const dt = getDutyTypeById(assignModal.dutyTypeId);
      const maxP = Math.max(1, Number(dt.maxPeople) || 1);
      if (maxP === 1) {
        saveAssignedDuties([soldierId]);
        return;
      }
      const idx = assignModal.selectedIds.indexOf(soldierId);
      if (idx >= 0) {
        assignModal.selectedIds.splice(idx, 1);
      } else {
        if (assignModal.selectedIds.length >= maxP) {

    function openTaskModal() {

          '<div class="field"><label class="field-label" for="t-target">Кому</label><select id="t-target" class="select">' + opts + '</select></div>' +
          '<div class="field"><label class="field-label" for="t-issuer">Хто поставив</label><input id="t-issuer" class="input" type="text" required placeholder="Введіть вручну..." /></div>' +
          '<div class="field"><label class="field-label" for="t-text">Суть задачі</label><textarea id="t-text" class="textarea" required placeholder="Опишіть задачу..."></textarea></div>' +
          '<button type="submit" class="btn btn-primary btn-full">Поставити задачу</button>' +
        '</form>'
      );

    function saveTask(e) {
      e.preventDefault();
      const targetVal = document.getElementById('t-target').value;
      const issuer = document.getElementById('t-issuer').value.trim();
      const text = document.getElementById('t-text').value.trim();
      if (!text) return;
      const isAll = targetVal === 'all_commanders';
      state.tasks.unshift({
        id: genId('task'),
        targetType: isAll ? 'all_commanders' : 'squad',
        targetSquadId: isAll ? '' : targetVal.replace('squad:', ''),
        issuer: issuer,
        text: text,
        status: 'received',
        note: ''
      });
      saveState();
      closeModal();
      render();
      showToast('Задачу додано');
    }

    function setTaskStatus(id, st) {
      const t = state.tasks.find(function(x) { return x.id === id; });
      if (!t) return;
      t.status = st;
      if (st === 'failed') ui.openTaskNotes[id] = true;
      saveState();
      render();
    }

    function toggleTaskNote(id) {
      ui.openTaskNotes[id] = !ui.openTaskNotes[id];
      render();
    }

    function updateTaskNote(id, val) {
      const t = state.tasks.find(function(x) { return x.id === id; });
      if (t) { t.note = val; saveState(); }
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(function(x) { return x.id !== id; });
      saveState();
      render();
      showToast('Задачу видалено');
    }

    // =========================================================================
    // ВКЛАДКА 3: РОЗХІД
    // =========================================================================
    function ensureRozkhidDay(iso) {
      if (!state.rozkhid[iso] || typeof state.rozkhid[iso] !== 'object') {
        state.rozkhid[iso] = { cleared: false, overrides: {}, extra: {} };
      }
      if (!state.rozkhid[iso].overrides) state.rozkhid[iso].overrides = {};
      if (!state.rozkhid[iso].extra) state.rozkhid[iso].extra = {};
      return state.rozkhid[iso];
    }

    function getSurnameCounts() {
      const map = {};
      state.soldiers.forEach(function(s) {
        const sn = String(s.name || '').trim().split(/\s+/)[0] || '';
        const key = sn.toLowerCase();
        map[key] = (map[key] || 0) + 1;
      });
      return map;
    }

    function shortReportName(soldier, countsMap) {
      const parts = String(soldier.name || '').trim().split(/\s+/);
      const sn = parts[0] || '';
      if (countsMap[sn.toLowerCase()] > 1 && parts[1]) {
        return sn + ' ' + parts[1].charAt(0).toUpperCase() + '.';
      }
      return sn;
    }

    function computeRozkhid(iso) {
      const yestISO = addDaysISO(iso, -1);
      const todayDuty = new Set(state.duties.filter(function(d) { return d.date === iso; }).map(function(d) { return d.soldierId; }));
      const yestDuty = new Set(state.duties.filter(function(d) { return d.date === yestISO; }).map(function(d) { return d.soldierId; }));
      const dayData = state.rozkhid[iso] || { cleared: false, overrides: {}, extra: {} };
      const snCounts = getSurnameCounts();

      const statusBySoldier = {};
      const byCat = {};
      ROZKHID_CATS.forEach(function(c) { byCat[c.code] = []; });

      state.soldiers.forEach(function(s) {
        let st = 'Вн';
        if (dayData.overrides && dayData.overrides[s.id]) {
          st = dayData.overrides[s.id];
        } else if (dayData.cleared) {
          st = 'Вн';
        } else if (todayDuty.has(s.id)) {
          st = 'Н';
        } else if (yestDuty.has(s.id)) {
          st = 'Стародобовий';
        } else if (PERM_ABSENT.has(s.status)) {
          st = s.status;
        }
        statusBySoldier[s.id] = st;
        if (byCat[st]) {
          byCat[st].push({ soldier: s, reportName: shortReportName(s, snCounts) });
        }
      });

      let totalAbsent = 0;
      const categories = ROZKHID_CATS.map(function(c) {
        const list = byCat[c.code] || [];
        const extraVal = Math.max(0, Number((dayData.extra && dayData.extra[c.code]) || 0));
        const count = list.length + extraVal;
        totalAbsent += count;
        return { code: c.code, hint: c.hint, soldiers: list, extra: extraVal, count: count };
      });

      const totalList = state.soldiers.length;
      const presentCount = Math.max(0, totalList - totalAbsent);
      return { totalList: totalList, presentCount: presentCount, totalAbsent: totalAbsent, categories: categories, statusBySoldier: statusBySoldier };
    }

    function generateRozkhidText() {
      const data = computeRozkhid(ui.rozkhidDate);
      const grp = (state.groupNumber || '223').trim() || '223';
      const lines = [grp, 'З/с - ' + data.totalList, 'Вн - ' + data.presentCount];
      data.categories.forEach(function(c) {
        if (ui.rozkhidHideZeros && c.count === 0) return;
        let line = c.code + ' - ' + c.count;
        if (ui.rozkhidIncludeNames && c.soldiers.length > 0) {
          line += ' (' + c.soldiers.map(function(x) { return x.reportName; }).join(', ') + ')';
        }
        lines.push(line);
      });
      return lines.join('\n');
    }

    function changeRozkhidDate(delta) { ui.rozkhidDate = addDaysISO(ui.rozkhidDate, delta); render(); }
    function setRozkhidToday() { ui.rozkhidDate = toISO(new Date()); render(); }
    function updateGroupNumber(val) {
      state.groupNumber = val.trim();
      saveState();
      const box = document.getElementById('rozkhid-preview');
      if (box) box.textContent = generateRozkhidText();
    }
    function toggleRozkhidOpt(opt, checked) {
      if (opt === 'names') ui.rozkhidIncludeNames = checked;
      if (opt === 'hideZeros') ui.rozkhidHideZeros = checked;
      const box = document.getElementById('rozkhid-preview');
      if (box) box.textContent = generateRozkhidText();
    }
    function adjustRozkhidExtra(code, delta) {
      const day = ensureRozkhidDay(ui.rozkhidDate);
      const cur = Math.max(0, Number(day.extra[code] || 0));
      day.extra[code] = Math.max(0, cur + delta);
      saveState();
      render();
    }
    function promptClearRozkhid() {
      showConfirm(
        'Очистити розхід?',
        'Усі пункти відсутності та прізвища на ' + formatHuman(ui.rozkhidDate) + ' будуть обнулені (Вн = З/с).',
        'Очистити розхід',
        function() {
          state.rozkhid[ui.rozkhidDate] = { cleared: true, overrides: {}, extra: {} };
          saveState();
          render();
          showToast('Розхід очищено');
        },
        true
      );
    }
    function autoFillRozkhid() {
      delete state.rozkhid[ui.rozkhidDate];
      saveState();
      render();
      showToast('Автопідтягнуто з нарядів та складу');
    }

    function openRozkhidModal(catCode) {
      ui.rozkhidModalCat = catCode;
      ui.rozkhidModalSearch = '';
      ui.rozkhidModalOpenSquads = {};

    function onRozkhidSearch(val) {

      const el = document.getElementById('rozkhid-modal-list');
      if (el) el.innerHTML = buildRozkhidModalList();
    }

    function buildRozkhidModalList() {
      const catCode = ui.rozkhidModalCat;
      const data = computeRozkhid(ui.rozkhidDate);
      const q = ui.rozkhidModalSearch.trim().toLowerCase();
      if (!state.soldiers.length) return '<div class="empty-state">Додайте бійців у вкладці «Склад».</div>';

      return getOrderedSquads().map(function(sq) {
        const all = sortSquadMembers(state.soldiers.filter(function(s) { return s.squadId === sq.id; }));
        if (!all.length) return '';
        const list = q ? all.filter(function(s) { return s.name.toLowerCase().indexOf(q) !== -1; }) : all;
        if (q && !list.length) return '';
        const selectedCnt = all.filter(function(s) { return data.statusBySoldier[s.id] === catCode; }).length;
        const isOpen = q ? true : Boolean(ui.rozkhidModalOpenSquads[sq.id]);

        const rows = list.map(function(s) {
          const cur = data.statusBySoldier[s.id] || 'Вн';
          const checked = cur === catCode;
          const inOther = cur !== 'Вн' && cur !== catCode;
          return '<label class="checkbox-row" style="border-left:4px solid ' + sq.color + '">' +
            '<div class="soldier-info">' +
              '<div class="row" style="flex-wrap:wrap"><span class="soldier-name">' + esc(s.name) + '</span>' +
                (isGroupCmd(sq) ? '<span class="badge badge-kg">★ КГ</span>' : (s.isCommander ? '<span class="badge badge-kv">★ КВ</span>' : '')) +
                (inOther ? '<span class="badge badge-warn">Вже у: ' + esc(cur) + '</span>' : '') +
              '</div>' +
              '<div class="text-xs text-muted">' + (checked ? 'Обрано у «' + esc(catCode) + '»' : (inOther ? 'При виборі переміститься сюди' : 'В наявності (Вн)')) + '</div>' +
            '</div>' +
            '<input type="checkbox" ' + (checked ? 'checked' : '') + ' onchange="toggleSoldierRozkhid(\'' + s.id + '\', \'' + esc(catCode) + '\', this.checked)" />' +
          '</label>';
        }).join('');

        return '<div class="card-flush">' +
          '<div class="acc-header ' + (isOpen ? 'open' : '') + '" style="border-left:4px solid ' + sq.color + '" onclick="toggleRozkhidModalSquad(\'' + sq.id + '\')">' +
            '<div class="row"><span class="chevron">▸</span><span class="dot" style="background:' + sq.color + '"></span><span class="section-title" style="color:' + sq.color + '">' + esc(sq.name) + '</span></div>' +
            '<span class="badge ' + (selectedCnt > 0 ? 'badge-ok' : '') + '">' + selectedCnt + ' / ' + all.length + '</span>' +
          '</div>' +
          (isOpen ? '<div class="acc-body">' + rows + '</div>' : '') +
        '</div>';
      }).join('');
    }

    function renderRozkhidModal() {
      openModal(

    function saveSoldier(e, id) {
      e.preventDefault();
      const name = capitalizePIB(document.getElementById('s-name').value.trim());
      const rank = document.getElementById('s-rank').value.trim();
      const squadId = document.getElementById('s-squad').value;
      const isCommander = document.getElementById('s-kv').checked;
      const status = document.getElementById('s-status').value;
      if (!name) return;

      if (id) {
        const s = getSoldierById(id);
        if (s) { s.name = name; s.rank = rank; s.squadId = squadId; s.isCommander = isCommander; s.status = status; }
      } else {
        state.soldiers.push({ id: genId('s'), name: name, rank: rank, squadId: squadId, isCommander: isCommander, status: status });
        ui.openPersonnelSquads[squadId] = true;
      }
      saveState();
      closeModal();
      render();
      showToast(id ? 'Дані оновлено' : 'Бійця додано');
    }

      const s = getSoldierById(id);
      if (!s) return;
      showConfirm('Видалити ' + s.name + '?', 'Бійця та всі його наряди буде видалено.', 'Видалити', function() {
        state.soldiers = state.soldiers.filter(function(x) { return x.id !== id; });
        state.duties = state.duties.filter(function(d) { return d.soldierId !== id; });
        saveState();
        render();
        showToast('Бійця видалено');
      }, true);
    }

    function saveDutyType(e, id) {
      e.preventDefault();
      const name = document.getElementById('dt-name').value.trim();
      const desc = document.getElementById('dt-desc').value.trim();
      const maxPeople = Math.min(10, Math.max(1, parseInt(document.getElementById('dt-max').value, 10) || 1));
      if (!name) return;
      if (id) {
        const dt = state.dutyTypes.find(function(x) { return x.id === id; });
        if (dt) { dt.name = name; dt.desc = desc; dt.maxPeople = maxPeople; dt.color = tempColor; }
      } else {
        state.dutyTypes.push({ id: genId('dt'), name: name, desc: desc, maxPeople: maxPeople, color: tempColor });

      saveState(); closeModal(); render(); showToast('Збережено');

      if (state.dutyTypes.length <= 1) return;
      state.dutyTypes = state.dutyTypes.filter(function(x) { return x.id !== id; });
      saveState(); render(); showToast('Видалено');

    function downloadFile(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportBackupJSON() {
      state.lastBackupAt = formatShortDate(toISO(new Date()));
      saveState();
      downloadFile(JSON.stringify(state, null, 2), 'pomichnyk_vzvodu_backup_' + toISO(new Date()) + '.json', 'application/json');
      render();
      showToast('Резервну копію збережено');
    }
    function copyBackupJSON() {
      state.lastBackupAt = formatShortDate(toISO(new Date()));
      saveState();
      copyText(JSON.stringify(state), 'JSON-копію скопійовано');
      render();
    }
    function openPasteBackupModal() {
      openModal(
        '<div class="modal-header"><div class="modal-title">Відновити з JSON-тексту</div><button class="btn-icon" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body">' +
          '<textarea id="paste-json" class="textarea" style="min-height:140px" placeholder="Вставте сюди скопійований JSON..."></textarea>' +
          '<button class="btn btn-primary btn-full" onclick="applyPastedBackup()">Відновити дані</button>' +
        '</div>'
      );
    }
    function restoreFromJSONString(raw) {
      try {
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.squads) || !Array.isArray(parsed.soldiers)) throw new Error('bad');
        state = {
          groupNumber: (typeof parsed.groupNumber === 'string' && parsed.groupNumber.trim()) ? parsed.groupNumber.trim() : '223',
          squads: ensureSquadsValid(parsed.squads),
          soldiers: parsed.soldiers,
          dutyTypes: ensureDutyTypesValid(parsed.dutyTypes),
          duties: Array.isArray(parsed.duties) ? parsed.duties : [],
          tasks: Array.isArray(parsed.tasks) ? parsed.tasks : [],
          rozkhid: migrateRozkhid(parsed.rozkhid),
          lastBackupAt: state.lastBackupAt
        };
        saveState();
        closeModal();
        render();
        showToast('Дані успішно відновлено');
      } catch (err) {
        showToast('Помилка: некоректний JSON', 'error');
      }
    }
    function applyPastedBackup() {
      const val = document.getElementById('paste-json').value.trim();
      if (val) restoreFromJSONString(val);
    }
    function handleImportJSON(e) {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = function(ev) { restoreFromJSONString(ev.target.result); e.target.value = ''; };
      r.readAsText(f);
    }
    function exportCSV() {
      const rows = [['Відділення', 'ПІБ', 'Звання', 'Статус', 'За ' + MONTHS_UK[ui.month] + ' ' + ui.year, 'Всього']];
      getOrderedSquads().forEach(function(sq) {
        sortSquadMembers(state.soldiers.filter(function(s) { return s.squadId === sq.id; })).forEach(function(s) {
          const c = getSoldierDutyCounts(s.id, ui.year, ui.month);
          rows.push([sq.name, s.name, s.rank || '', getStatusLabel(s.status), c.monthCount, c.totalCount]);
        });
      });
      const csv = '\uFEFF' + rows.map(function(r) {
        return r.map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(';');
      }).join('\r\n');
      downloadFile(csv, 'oblik_' + ui.year + '_' + String(ui.month + 1).padStart(2, '0') + '.csv', 'text/csv;charset=utf-8;');
      showToast('CSV збережено');
    }

      showConfirm('Очистити всі дані?', 'Усі бійці, наряди, задачі та розхід будуть видалені безповоротно.', 'Очистити все', function() {
        state = createEmptyState();
        saveState();
        render();
        showToast('Усі дані очищено');
      }, true);
    }

    // ГОЛОВНИЙ РЕНДЕР ТА ІНІЦІАЛІЗАЦІЯ
    // =========================================================================
    function render() {
      try {
        ['duties','tasks','rozkhid','personnel','settings'].forEach(function(t) {
          const btn = document.getElementById('nav-' + t);
          if (btn) btn.classList.toggle('active', ui.activeTab === t);
        });
        const main = document.getElementById('main-content');
        if (!main) return;
        if (ui.activeTab === 'duties') main.innerHTML = renderDutiesTab();
        else if (ui.activeTab === 'tasks') main.innerHTML = renderTasksTab();
        else if (ui.activeTab === 'rozkhid') main.innerHTML = renderRozkhidTab();
        else if (ui.activeTab === 'personnel') main.innerHTML = renderPersonnelTab();
        else if (ui.activeTab === 'settings') main.innerHTML = renderSettingsTab();
      } catch (err) {
        console.error('render error:', err);
        const main = document.getElementById('main-content');
        if (main) main.innerHTML = '<div class="card empty-state">Сталася помилка відображення. Спробуйте оновити сторінку.</div>';
      }
    }

    loadState();
    render();
  </script>
</body>
</html>

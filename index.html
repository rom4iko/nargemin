            : `<div class="stack">
                ${history.map(d => {
                  const dt = getDutyTypeById(d.dutyTypeId);
                  return `
                    <div class="row-between" style="padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--border)">
                      <div>
                        <div class="text-sm" style="font-weight:600;color:#fff">${formatDateHuman(d.date)}</div>
                        <span class="badge" style="margin-top:4px;background:${sq.color}22;color:${sq.color};border-color:${sq.color}55">${esc(dt.name)}</span>
                      </div>
                      <button class="btn-icon danger" onclick="removeDuty('${d.id}', '${s.id}')" title="Видалити помилковий запис">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                      </button>
                    </div>
                  `;
                }).join('')}
              </div>`
          }
        </div>
      `);
    }

    // =========================================================================
    // ВКЛАДКА 2: РОЗХІД (ЩОДЕННИЙ ОБЛІК О/С ТА ШАБЛОН ДЛЯ МЕСЕНДЖЕРІВ)
    // =========================================================================
    function changeRozkhidDate(delta) {
      ui.rozkhidDate = addDaysISO(ui.rozkhidDate, delta);
      render();
    }

    function setRozkhidToday() {
      ui.rozkhidDate = toISODate(new Date());
      render();
    }

    function updateGroupNumber(val) {
      state.groupNumber = val.trim();
      saveState();
      const previewEl = document.getElementById('rozkhid-preview-box');
      if (previewEl) previewEl.textContent = generateRozkhidText();
    }

    function getRozkhidStatus(dateISO, soldierId) {
      const dayMap = state.rozkhid[dateISO];
      if (!dayMap || !dayMap[soldierId]) return 'Вн';
      return dayMap[soldierId];
    }

    function setRozkhidStatus(soldierId, statusCode) {
      if (!state.rozkhid[ui.rozkhidDate]) {
        state.rozkhid[ui.rozkhidDate] = {};
      }
      if (statusCode === 'Вн') {
        delete state.rozkhid[ui.rozkhidDate][soldierId];
      } else {
        state.rozkhid[ui.rozkhidDate][soldierId] = statusCode;
      }
      saveState();
      render();
    }

    function toggleRozkhidSquad(squadId) {
      ui.expandedRozkhidSquads[squadId] = !ui.expandedRozkhidSquads[squadId];
      render();
    }

    function toggleAllRozkhidSquads() {
      const allOpen = state.squads.length > 0 && state.squads.every(sq => ui.expandedRozkhidSquads[sq.id]);
      state.squads.forEach(sq => {
        ui.expandedRozkhidSquads[sq.id] = !allOpen;
      });
      render();
    }

    function toggleRozkhidOption(opt, checked) {
      if (opt === 'names') ui.rozkhidIncludeNames = checked;
      if (opt === 'hideZeros') ui.rozkhidHideZeros = checked;
      const previewEl = document.getElementById('rozkhid-preview-box');
      if (previewEl) previewEl.textContent = generateRozkhidText();
    }

    // Підтягнути статуси «Н» (сьогодні в наряді) та «Стародобовий» (був у наряді вчора)
    function syncRozkhidFromDuties() {
      if (state.soldiers.length === 0) {
        showToast('Список особового складу порожній', 'error');
        return;
      }
      const dateISO = ui.rozkhidDate;
      const yestISO = addDaysISO(dateISO, -1);

      const todayDutyIds = new Set(state.duties.filter(d => d.date === dateISO).map(d => d.soldierId));
      const yestDutyIds = new Set(state.duties.filter(d => d.date === yestISO).map(d => d.soldierId));

      if (!state.rozkhid[dateISO]) state.rozkhid[dateISO] = {};

      let countN = 0;
      let countStaro = 0;

      state.soldiers.forEach(s => {
        const cur = getRozkhidStatus(dateISO, s.id);
        // Оновлюємо якщо статус Вн або вже Н/Стародобовий (не затираємо шпиталь/відпустку тощо)
        const canOverwrite = (cur === 'Вн' || cur === 'Н' || cur === 'Стародобовий');
        if (!canOverwrite) return;

        if (todayDutyIds.has(s.id)) {
          state.rozkhid[dateISO][s.id] = 'Н';
          countN++;
        } else if (yestDutyIds.has(s.id)) {
          state.rozkhid[dateISO][s.id] = 'Стародобовий';
          countStaro++;
        }
      });

      saveState();
      render();
      if (countN === 0 && countStaro === 0) {
        showToast('На цю дату нарядів у графіку не знайдено');
      } else {
        showToast(`Оновлено: Н — ${countN}, Стародобовий — ${countStaro}`);
      }
    }

    // Копіювати статуси з попереднього дня
    function copyRozkhidFromYesterday() {
      const yestISO = addDaysISO(ui.rozkhidDate, -1);
      const prevMap = state.rozkhid[yestISO];
      if (!prevMap || Object.keys(prevMap).length === 0) {
        showToast('За вчора немає збережених відміток', 'error');
        return;
      }
      state.rozkhid[ui.rozkhidDate] = { ...prevMap };
      saveState();
      render();
      showToast('Статуси скопійовано з учорашнього дня');
    }
    // Підрахунок розходу за вибрану дату (зі збереженням порядку по відділеннях)
    function computeRozkhidSummary(dateISO) {
      const total = state.soldiers.length;
      const buckets = {};
      ROZKHID_STATUSES.forEach(st => { buckets[st.code] = []; });

      const orderedSoldiers = [];
      for (const sq of getOrderedSquads()) {
        const members = sortSquadMembers(state.soldiers.filter(s => s.squadId === sq.id));
        orderedSoldiers.push(...members);
      }

      for (const s of orderedSoldiers) {
        const code = getRozkhidStatus(dateISO, s.id);
        if (buckets[code]) {
          buckets[code].push(s.name);
        } else {
          buckets['Вн'].push(s.name);
        }
      }

      const presentCount = buckets['Вн'].length;
      return { total, presentCount, buckets };
    }
    function openRozkhidCategoryModal(statusCode) {
      const stObj = ROZKHID_STATUSES.find(x => x.code === statusCode) || { code: statusCode, uiLabel: statusCode };
      const dateISO = ui.rozkhidDate;
      const orderedSquads = getOrderedSquads();

      const groupsHtml = orderedSquads.map(sq => {
        const isKG = isGroupCmdSquad(sq);
        const members = sortSquadMembers(state.soldiers.filter(s => s.squadId === sq.id));
        if (members.length === 0) return '';

        const rows = members.map(s => {
          const curStatus = getRozkhidStatus(dateISO, s.id);
          const isChecked = curStatus === statusCode;
          return `
            <label class="checkbox-card" style="border-left:4px solid ${sq.color}; padding:9px 11px;">
              <div class="soldier-info">
                <div class="soldier-name-line">
                  <span class="soldier-name">${esc(s.name)}</span>
                  ${isKG ? `<span class="badge badge-kv">★ КГ</span>` : (s.isCommander ? `<span class="badge badge-kv">★ КВ</span>` : '')}
                </div>
                <div class="soldier-meta">
                  <span>Поточний статус: <strong style="color:${curStatus === 'Вн' ? '#34d399' : '#fbbf24'}">${esc(curStatus)}</strong></span>
                </div>
              </div>
              <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleSoldierInRozkhidCategory('${s.id}', '${esc(statusCode)}', this.checked)" />
            </label>
          `;
        }).join('');

        return `
          <div class="stack" style="gap:6px">
            <div class="row-gap" style="padding:4px 2px 0">
              <span class="pill-dot" style="background:${sq.color}"></span>
              <span class="section-title" style="color:${sq.color}">${esc(sq.name)}</span>
            </div>
            ${rows}
          </div>
        `;
      }).join('');

      openModal(`
        <div class="modal-header">
          <div>
            <div class="modal-title">${esc(stObj.uiLabel)}</div>
            <div class="text-xs text-muted">${formatDateHuman(dateISO)} • Відмітьте о/с по відділеннях</div>
          </div>
          <button class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          ${state.soldiers.length === 0
            ? `<div class="empty-state">Немає особового складу.</div>`
            : `<div class="stack" style="gap:12px">${groupsHtml}</div>`
          }
          <button class="btn btn-primary btn-full" onclick="closeModal()">Готово</button>
        </div>
      `);
    }

    function toggleSoldierInRozkhidCategory(soldierId, targetStatus, checked) {
      if (!state.rozkhid[ui.rozkhidDate]) state.rozkhid[ui.rozkhidDate] = {};
      if (checked) {
        if (targetStatus === 'Вн') delete state.rozkhid[ui.rozkhidDate][soldierId];
        else state.rozkhid[ui.rozkhidDate][soldierId] = targetStatus;
      } else {
        delete state.rozkhid[ui.rozkhidDate][soldierId];
      }
      saveState();
      render();
      openRozkhidCategoryModal(targetStatus);
    }

    function renderRozkhidTab() {
      const { total, presentCount, buckets } = computeRozkhidSummary(ui.rozkhidDate);
      const absentCount = total - presentCount;
      const orderedSquads = getOrderedSquads();
      const allOpen = orderedSquads.length > 0 && orderedSquads.every(sq => ui.expandedRozkhidSquads[sq.id]);
      const previewText = generateRozkhidText();

      const categoryCountersHtml = ROZKHID_STATUSES.filter(st => st.code !== 'Вн').map(st => {
        const cnt = (buckets[st.code] || []).length;
        return `
          <div class="row-between" style="padding:8px 11px;border-radius:10px;background:var(--bg);border:1px solid ${cnt > 0 ? 'rgba(245,158,11,0.45)' : 'var(--border)'}">
            <div style="min-width:0">
              <div class="text-sm" style="font-weight:700;color:${cnt > 0 ? '#fbbf24' : '#fff'}">${esc(st.uiLabel)}</div>
              ${cnt > 0 ? `<div class="text-xs text-muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(buckets[st.code].join(', '))}</div>` : ''}
            </div>
            <div class="row-gap" style="flex-shrink:0">
              <span class="badge" style="background:${cnt > 0 ? 'rgba(245,158,11,0.18)' : 'rgba(255,255,255,0.06)'};color:${cnt > 0 ? '#fbbf24' : 'var(--muted)'};font-size:13px;padding:3px 9px">${cnt}</span>
              <button class="btn btn-sm btn-secondary" onclick="openRozkhidCategoryModal('${esc(st.code)}')">ПІБ</button>
            </div>
          </div>
        `;
      }).join('');

      let squadsHtml = '';
      if (state.soldiers.length === 0) {
        squadsHtml = `
          <div class="card empty-state stack" style="align-items:center">
            <div>Особовий склад ще не заповнений. Додайте бійців у розділі «Склад», щоб вести щоденний розхід.</div>
            <button class="btn btn-sm btn-primary" onclick="switchTab('personnel')">Перейти у «Склад»</button>
          </div>
        `;
      } else {
        squadsHtml = orderedSquads.map(sq => {
          const isKG = isGroupCmdSquad(sq);
          const members = sortSquadMembers(state.soldiers.filter(s => s.squadId === sq.id));
          if (members.length === 0) return '';
          const isOpen = Boolean(ui.expandedRozkhidSquads[sq.id]);
          const sqPresent = members.filter(s => getRozkhidStatus(ui.rozkhidDate, s.id) === 'Вн').length;

          return `
            <div class="card-flush">
              <div class="accordion-header ${isOpen ? 'open' : ''}" style="border-left:4px solid ${sq.color}" onclick="toggleRozkhidSquad('${sq.id}')">
                <div class="row-gap" style="min-width:0">
                  <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                  <span class="pill-dot" style="background:${sq.color}"></span>
                  <div style="min-width:0">
                    <div class="section-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sq.name)}</div>
                    <div class="text-xs text-muted">Вн: ${sqPresent} з ${members.length}</div>
                  </div>
                </div>
                <span class="badge" style="background:${sqPresent === members.length ? 'rgba(16,185,129,0.14)' : 'rgba(245,158,11,0.16)'}; color:${sqPresent === members.length ? '#34d399' : '#fbbf24'}; border-color:${sqPresent === members.length ? 'rgba(16,185,129,0.35)' : 'rgba(245,158,11,0.4)'}">
                  ${sqPresent}/${members.length}
                </span>
              </div>
              ${isOpen ? `
                <div>
                  ${members.map(s => {
                    const curStatus = getRozkhidStatus(ui.rozkhidDate, s.id);
                    const isPresent = curStatus === 'Вн';
                    return `
                      <div class="soldier-row ${s.isCommander || isKG ? 'is-kv' : ''}" style="--sq-color:${sq.color}">
                        <div class="soldier-info">
                          <div class="soldier-name-line">
                            <span class="soldier-name">${esc(s.name)}</span>
                            ${isKG ? `<span class="badge badge-kv">★ КГ</span>` : (s.isCommander ? `<span class="badge badge-kv">★ КВ</span>` : '')}
                          </div>
                          ${s.rank ? `<div class="soldier-meta">${esc(s.rank)}</div>` : ''}
                        </div>
                        <select class="rozkhid-select ${isPresent ? 'is-present' : 'is-absent'}" onchange="setRozkhidStatus('${s.id}', this.value)" aria-label="Статус ${esc(s.name)}">
                          ${ROZKHID_STATUSES.map(st => `
                            <option value="${esc(st.code)}" ${curStatus === st.code ? 'selected' : ''}>${esc(st.uiLabel)}</option>
                          `).join('')}
                        </select>
                      </div>
                    `;
                  }).join('')}
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      }

      return `
        <!-- Дата розходу -->
        <div class="date-bar">
          <button class="btn-icon" onclick="changeRozkhidDate(-1)" aria-label="Попередній день">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="date-bar-title">${formatDateHuman(ui.rozkhidDate)}</div>
          <button class="btn btn-sm btn-secondary" onclick="setRozkhidToday()">Сьогодні</button>
          <button class="btn-icon" onclick="changeRozkhidDate(1)" aria-label="Наступний день">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>

        <!-- Номер групи та швидкі дії -->
        <div class="card stack">
          <div class="row-between">
            <label for="rozkhid-group-input" class="field-label" style="white-space:nowrap">Номер групи:</label>
            <input id="rozkhid-group-input" class="input" style="max-width:160px;min-height:40px;padding:7px 11px;text-align:center;font-weight:700" type="text" value="${esc(state.groupNumber)}" placeholder="223" oninput="updateGroupNumber(this.value)" />
          </div>
          <div class="grid-2">
            <button class="btn btn-sm btn-secondary" onclick="syncRozkhidFromDuties()">Підтягнути з нарядів</button>
            <button class="btn btn-sm btn-secondary" onclick="copyRozkhidFromYesterday()">Як учора</button>
          </div>
        </div>

        <!-- Зведення З/с та Вн -->
        <div class="kpi-grid-2">
          <div class="kpi-card">
            <div class="kpi-val">${total}</div>
            <div class="kpi-label">З/с (За списком)</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-val" style="color:#4ade80">${presentCount}</div>
            <div class="kpi-label">Вн (Відсутні: ${absentCount})</div>
          </div>
        </div>

        <!-- Швидкий поіменний вибір по категоріях розходу -->
        ${state.soldiers.length > 0 ? `
          <div class="card stack">
            <span class="section-title" style="color:var(--muted)">Поіменно по категоріях (ПІБ)</span>
            <div class="stack" style="gap:6px">${categoryCountersHtml}</div>
          </div>
        ` : ''}

        <!-- Заголовок списку відділень -->
        ${state.soldiers.length > 0 ? `
          <div class="row-between">
            <span class="section-title" style="color:var(--muted)">Відмітки по відділеннях</span>
            <button class="btn btn-sm btn-secondary" onclick="toggleAllRozkhidSquads()">
              ${allOpen ? 'Згорнути всі' : 'Розгорнути всі'}
            </button>
          </div>
        ` : ''}

        <div class="stack">${squadsHtml}</div>

        <!-- Попередній перегляд та кнопка копіювання -->
        <div class="card stack" style="border-color:rgba(94,150,77,0.45)">
          <div class="row-between">
            <span class="section-title" style="color:#4ade80">Готовий розхід для месенджера</span>
          </div>
          <div class="grid-2">
            <label class="toggle-pill">
              <input type="checkbox" ${ui.rozkhidIncludeNames ? 'checked' : ''} onchange="toggleRozkhidOption('names', this.checked)" />
              <span>Додавати прізвища</span>
            </label>
            <label class="toggle-pill">
              <input type="checkbox" ${ui.rozkhidHideZeros ? 'checked' : ''} onchange="toggleRozkhidOption('hideZeros', this.checked)" />
              <span>Приховувати нулі</span>
            </label>
          </div>
          <pre id="rozkhid-preview-box" class="rozkhid-preview">${esc(previewText)}</pre>
          <button class="btn btn-primary btn-full" onclick="copyRozkhid()">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span>Скопіювати розхід</span>
          </button>
        </div>
      `;
    }

    // =========================================================================
    // ВКЛАДКА 3: ЗАДАЧІ
    // =========================================================================
    function setTasksTargetFilter(val) {
      ui.tasksTargetFilter = val;
      render();
    }

    function setTasksStatusFilter(val) {
      ui.tasksStatusFilter = val;
      render();
    }

    function getFilteredTasks() {
      return state.tasks.filter(t => {
        if (ui.tasksTargetFilter !== 'all') {
          const matchesSquad = t.targetType === 'squad' && t.targetSquadId === ui.tasksTargetFilter;
          const isAllCmd = t.targetType === 'all_commanders';
          if (!matchesSquad && !isAllCmd) return false;
        }
        if (ui.tasksStatusFilter === 'active' && t.status !== 'received') return false;
        if (ui.tasksStatusFilter === 'done' && t.status !== 'done') return false;
        if (ui.tasksStatusFilter === 'failed' && t.status !== 'failed') return false;
        return true;
      });
    }

    function getTaskTargetDisplay(task) {
      if (task.targetType === 'all_commanders') {
        return { label: 'Усім командирам відділень', color: '#a855f7', kvName: '' };
      }
      const sq = getSquadById(task.targetSquadId);
      const kv = getSquadCommander(task.targetSquadId);
      return {
        label: formatCommanderTargetLabel(sq),
        color: sq.color,
        kvName: kv ? kv.name : ''
      };
    }

    function renderTasksTab() {
      const targetPills = renderSquadPills(ui.tasksTargetFilter, 'setTasksTargetFilter', true);

      const statusPills = `
        <div class="pills-row">
          <button class="pill-btn ${ui.tasksStatusFilter === 'all' ? 'active' : ''}" style="--pill-color:#e8eef5" onclick="setTasksStatusFilter('all')">Усі</button>
          <button class="pill-btn ${ui.tasksStatusFilter === 'active' ? 'active' : ''}" style="--pill-color:#3b82f6" onclick="setTasksStatusFilter('active')">Активні</button>
          <button class="pill-btn ${ui.tasksStatusFilter === 'done' ? 'active' : ''}" style="--pill-color:#10b981" onclick="setTasksStatusFilter('done')">Виконані</button>
          <button class="pill-btn ${ui.tasksStatusFilter === 'failed' ? 'active' : ''}" style="--pill-color:#ef4444" onclick="setTasksStatusFilter('failed')">Не виконано</button>
        </div>
      `;

      const filteredTasks = getFilteredTasks();

      const tasksHtml = filteredTasks.length === 0
        ? `<div class="card empty-state">Задач немає. Натисніть «+ Нова задача», щоб додати задачу.</div>`
        : filteredTasks.map(t => {
            const target = getTaskTargetDisplay(t);
            const isNoteOpen = Boolean(ui.openNotes[t.id]);
            const hasNote = Boolean(t.note && t.note.trim());

            return `
              <div class="task-card status-${t.status}" style="--sq-color:${target.color}">
                <div class="task-top">
                  <div>
                    <span class="badge" style="background:${target.color}22; color:${target.color}; border-color:${target.color}55; white-space:normal; line-height:1.25">
                      ${esc(target.label)}
                    </span>
                    ${target.kvName ? `<div class="text-xs text-muted" style="margin-top:3px">КВ: ${esc(target.kvName)}</div>` : ''}
                  </div>
                  <div class="row-gap" style="flex-shrink:0">
                    <button class="btn-icon" style="width:34px;height:34px" onclick="openTaskModal('${t.id}')" title="Редагувати">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                    <button class="btn-icon danger" style="width:34px;height:34px" onclick="promptDeleteTask('${t.id}')" title="Видалити">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                  </div>
                </div>

                <div class="task-text">${esc(t.text)}</div>

                <div class="task-meta">
                  <span>Поставив: <strong style="color:#fff">${esc(t.issuer || 'Не вказано')}</strong></span>
                  <span>• ${esc(t.createdAt || '')}</span>
                  ${t.deadline ? `<span>• Термін: <strong style="color:#fbbf24">${formatDeadline(t.deadline)}</strong></span>` : ''}
                </div>

                <div class="task-status-grid">
                  <button class="status-tap-btn ${t.status === 'received' ? 'active-received' : ''}" onclick="setTaskStatus('${t.id}', 'received')">Отримав задачу</button>
                  <button class="status-tap-btn ${t.status === 'done' ? 'active-done' : ''}" onclick="setTaskStatus('${t.id}', 'done')">Виконано</button>
                  <button class="status-tap-btn ${t.status === 'failed' ? 'active-failed' : ''}" onclick="setTaskStatus('${t.id}', 'failed')">Не виконано</button>
                </div>

                <div>
                  <button class="note-toggle-btn ${hasNote ? 'has-note' : ''}" onclick="toggleTaskNote('${t.id}')">
                    <span>${hasNote ? '● Зауваження (є запис)' : 'Зауваження'}</span>
                    <span>${isNoteOpen ? '▲' : '▼'}</span>
                  </button>
                  ${isNoteOpen ? `
                    <div class="note-box" style="margin-top:6px">
                      <textarea id="note-input-${t.id}" class="textarea" style="min-height:68px" placeholder="Вкажіть причину невиконання або коментар...">${esc(t.note || '')}</textarea>
                      <div class="row-between">
                        <span class="text-xs text-muted">${t.status === 'failed' ? 'Вкажіть причину невиконання' : 'Коментар до задачі'}</span>
                        <button class="btn btn-sm btn-primary" onclick="saveTaskNote('${t.id}')">Зберегти</button>
                      </div>
                    </div>
                  ` : (hasNote ? `<div class="text-xs" style="margin-top:6px;padding:7px 10px;border-radius:8px;background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.22);color:#fde68a;white-space:pre-wrap">${esc(t.note)}</div>` : '')}
                </div>
              </div>
            `;
          }).join('');

      return `
        <div class="grid-2">
          <button class="btn btn-primary" onclick="openTaskModal()">+ Нова задача</button>
          <button class="btn btn-secondary" onclick="copyActiveTasks()">Скопіювати активні задачі</button>
        </div>

        ${targetPills}
        ${statusPills}

        <div class="stack">${tasksHtml}</div>
      `;
    }

    function setTaskStatus(taskId, status) {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      t.status = status;
      if (status === 'failed') ui.openNotes[taskId] = true;
      saveState();
      render();
      if (status === 'failed') {
        setTimeout(() => document.getElementById(`note-input-${taskId}`)?.focus(), 60);
      }
    }

    function toggleTaskNote(taskId) {
      ui.openNotes[taskId] = !ui.openNotes[taskId];
      render();
    }

    function saveTaskNote(taskId) {
      const t = state.tasks.find(x => x.id === taskId);
      const input = document.getElementById(`note-input-${taskId}`);
      if (!t || !input) return;
      t.note = input.value.trim();
      ui.openNotes[taskId] = false;
      saveState();
      render();
      showToast('Зауваження збережено');
    }

    function openTaskModal(taskId = null) {
      const existing = taskId ? state.tasks.find(t => t.id === taskId) : null;
      const squadTargets = getOrderedSquads().filter(sq => !isGroupCmdSquad(sq));
      let currentTargetVal = 'all_commanders';
      if (existing) {
        currentTargetVal = existing.targetType === 'squad' ? `squad:${existing.targetSquadId}` : 'all_commanders';
      } else if (ui.tasksTargetFilter !== 'all' && ui.tasksTargetFilter !== GROUP_CMD_SQUAD_ID) {
        currentTargetVal = `squad:${ui.tasksTargetFilter}`;
      } else if (squadTargets.length > 0) {
        currentTargetVal = `squad:${squadTargets[0].id}`;
      }

      const targetOptions = [
        ...squadTargets.map(sq => {
          const kv = getSquadCommander(sq.id);
          const baseLbl = formatCommanderTargetLabel(sq);
          const fullLbl = kv ? `${baseLbl} (${kv.name})` : baseLbl;
          return `<option value="squad:${sq.id}" ${currentTargetVal === 'squad:' + sq.id ? 'selected' : ''}>${esc(fullLbl)}</option>`;
        }),
        `<option value="all_commanders" ${currentTargetVal === 'all_commanders' ? 'selected' : ''}>Усім командирам відділень</option>`
      ].join('');

      const groupCmdSoldier = getGroupCommanderSoldier();

      openModal(`
        <div class="modal-header">
          <div class="modal-title">${existing ? 'Редагувати задачу' : 'Нова задача'}</div>
          <button class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <form class="modal-body" onsubmit="saveTask(event, '${taskId || ''}')">
          <div class="field">
            <label class="field-label" for="task-target">Кому</label>
            <select id="task-target" class="select">${targetOptions}</select>
          </div>

          <div class="field">
            <label class="field-label" for="task-issuer">Хто поставив</label>
            <input id="task-issuer" class="input" type="text" required value="${esc(existing?.issuer || '')}" placeholder="Введіть вручну..." />
            ${groupCmdSoldier ? `
              <div class="chips-wrap" style="margin-top:2px">
                <button type="button" class="btn btn-sm btn-secondary" onclick="document.getElementById('task-issuer').value = '${esc(groupCmdSoldier.name)}'">
                  ★ КГ: ${esc(groupCmdSoldier.name)}
                </button>
              </div>
            ` : ''}
          </div>

          <div class="field">
            <label class="field-label" for="task-text">Суть задачі</label>
            <textarea id="task-text" class="textarea" required placeholder="Опишіть задачу...">${esc(existing?.text || '')}</textarea>
          </div>

          <div class="field">
            <label class="field-label" for="task-deadline">Термін виконання (необов'язково)</label>
            <input id="task-deadline" class="input" type="datetime-local" value="${esc(existing?.deadline || '')}" />
          </div>

          <button type="submit" class="btn btn-primary btn-full">${existing ? 'Зберегти зміни' : 'Поставити задачу'}</button>
        </form>
      `);
      setTimeout(() => document.getElementById('task-issuer')?.focus(), 60);
    }

    function saveTask(e, taskId) {
      e.preventDefault();
      const targetVal = document.getElementById('task-target').value;
      const issuer = document.getElementById('task-issuer').value.trim();
      const text = document.getElementById('task-text').value.trim();
      const deadline = document.getElementById('task-deadline').value;
      if (!text || !issuer) return;

      let targetType = 'all_commanders';
      let targetSquadId = null;
      if (targetVal.startsWith('squad:')) {
        targetType = 'squad';
        targetSquadId = targetVal.slice(6);
      }

      if (taskId) {
        const t = state.tasks.find(x => x.id === taskId);
        if (t) {
          t.targetType = targetType;
          t.targetSquadId = targetSquadId;
          t.text = text;
          t.issuer = issuer;
          t.deadline = deadline;
        }
      } else {
        state.tasks.unshift({
          id: genId('t'),
          targetType,
          targetSquadId,
          text,
          issuer,
          deadline,
          status: 'received',
          note: '',
          createdAt: toDateTimeHuman(new Date())
        });
      }
      saveState();
      closeModal();
      render();
      showToast(taskId ? 'Задачу оновлено' : 'Задачу поставлено');
    }

    function promptDeleteTask(taskId) {
      showConfirm(
        'Видалити задачу?',
        'Задача та зауваження до неї будуть видалені.',
        'Видалити',
        () => {
          state.tasks = state.tasks.filter(t => t.id !== taskId);
          saveState();
          render();
          showToast('Задачу видалено');
        }
      );
    }

    function copyActiveTasks() {
      const list = state.tasks.filter(t => {
        if (t.status === 'done') return false;
        if (ui.tasksTargetFilter !== 'all') {
          const matchesSquad = t.targetType === 'squad' && t.targetSquadId === ui.tasksTargetFilter;
          const isAllCmd = t.targetType === 'all_commanders';
          if (!matchesSquad && !isAllCmd) return false;
        }
        return true;
      });
      if (!list.length) {
        showToast('Немає активних задач для копіювання', 'error');
        return;
      }
      const statusMap = { received: 'Отримав задачу', done: 'Виконано', failed: 'Не виконано' };
      const lines = [`Активні задачі (${formatDateShort(toISODate(new Date()))}):`];
      list.forEach((t, i) => {
        const target = getTaskTargetDisplay(t);
        lines.push(`${i + 1}. [${target.label}${target.kvName ? ' — ' + target.kvName : ''}] ${t.text}`);
        lines.push(`   Поставив: ${t.issuer} | Статус: ${statusMap[t.status]}${t.deadline ? ' | Термін: ' + formatDeadline(t.deadline) : ''}`);
        if (t.note) lines.push(`   Зауваження: ${t.note}`);
      });
      copyToClipboard(lines.join('\n'), 'Активні задачі скопійовано');
    }

    // =========================================================================
    // ВКЛАДКА 4: СКЛАД (РОЗГОРТУВАНІ ВКЛАДКИ-АКОРДЕОНИ ПО ВІДДІЛЕННЯХ + БІЙЦЯХ)
    // =========================================================================
    ui.personnelSquadFilter = 'all';
    ui.expandedSoldiers = {};

    function setPersonnelSquadFilter(id) {
      ui.personnelSquadFilter = id;
      if (id !== 'all') {
        ui.expandedPersonnelSquads[id] = true;
      }
      render();
    }

    function toggleSoldierCard(soldierId) {
      ui.expandedSoldiers[soldierId] = !ui.expandedSoldiers[soldierId];
      render();
    }

    function togglePersonnelSquad(squadId) {
      ui.expandedPersonnelSquads[squadId] = !ui.expandedPersonnelSquads[squadId];
      render();
    }

    function toggleAllPersonnelSquads() {
      const ordered = getOrderedSquads();
      const allOpen = ordered.length > 0 && ordered.every(sq => ui.expandedPersonnelSquads[sq.id]);
      ordered.forEach(sq => {
        ui.expandedPersonnelSquads[sq.id] = !allOpen;
      });
      render();
    }

    function onPersonnelSearchInput(val) {
      ui.personnelSearch = val;
      const container = document.getElementById('personnel-list-container');
      if (container) container.innerHTML = buildPersonnelAccordionHtml();
      const clearBtn = document.getElementById('personnel-search-clear');
      if (clearBtn) clearBtn.classList.toggle('hidden', !val);
    }

    function clearPersonnelSearch() {
      ui.personnelSearch = '';
      render();
    }

    function renderPersonnelTab() {
      const ordered = getOrderedSquads();
      const allOpen = ordered.length > 0 && ordered.every(sq => ui.expandedPersonnelSquads[sq.id]);

      const filterPills = `
        <div class="pills-row">
          <button class="pill-btn ${ui.personnelSquadFilter === 'all' ? 'active' : ''}" style="--pill-color:#4ade80" onclick="setPersonnelSquadFilter('all')">
            <span>Всі</span>
            <span class="pill-count">${state.soldiers.length}</span>
          </button>
          ${ordered.map(sq => {
            const cnt = state.soldiers.filter(s => s.squadId === sq.id).length;
            return `
              <button class="pill-btn ${ui.personnelSquadFilter === sq.id ? 'active' : ''}" style="--pill-color:${sq.color}" onclick="setPersonnelSquadFilter('${sq.id}')">
                <span class="pill-dot" style="background:${sq.color}"></span>
                <span>${esc(getSquadTabLabel(sq))}</span>
                <span class="pill-count">${cnt}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;

      return `
        ${filterPills}

        <div class="row-gap">
          <div class="search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="personnel-search-input" class="input" type="text" value="${esc(ui.personnelSearch)}" placeholder="Пошук бійця..." oninput="onPersonnelSearchInput(this.value)" />
            <button id="personnel-search-clear" class="search-clear ${ui.personnelSearch ? '' : 'hidden'}" onclick="clearPersonnelSearch()" aria-label="Очистити">✕</button>
          </div>
          <button class="btn btn-sm btn-secondary" style="flex-shrink:0;min-height:44px" onclick="toggleAllPersonnelSquads()">
            ${allOpen ? 'Згорнути всі' : 'Розгорнути всі'}
          </button>
        </div>

        <div class="text-xs text-muted" style="padding:0 2px">
          Всього у взводі: <strong style="color:#fff">${state.soldiers.length}</strong> • Натисніть на блок або прізвище, щоб розгорнути
        </div>

        <div id="personnel-list-container" class="stack">
          ${buildPersonnelAccordionHtml()}
        </div>

        <button class="btn btn-secondary btn-full" onclick="openSquadModal()">+ Додати нове відділення</button>
      `;
    }

    function buildPersonnelAccordionHtml() {
      const ordered = getOrderedSquads().filter(sq => ui.personnelSquadFilter === 'all' || sq.id === ui.personnelSquadFilter);
      if (ordered.length === 0) {
        return `<div class="card empty-state">Немає відділень. Натисніть кнопку нижче, щоб створити відділення.</div>`;
      }

      const query = ui.personnelSearch.trim().toLowerCase();
      let totalShown = 0;

      const html = ordered.map(sq => {
        const isKG = isGroupCmdSquad(sq);
        const allMembers = state.soldiers.filter(s => s.squadId === sq.id);
        const filteredMembers = sortSquadMembers(
          allMembers.filter(s => !query || s.name.toLowerCase().includes(query) || (s.rank && s.rank.toLowerCase().includes(query)))
        );

        if (query && filteredMembers.length === 0) return '';
        totalShown += filteredMembers.length;

        const isOpen = query ? true : (ui.personnelSquadFilter === sq.id ? true : Boolean(ui.expandedPersonnelSquads[sq.id]));

        return `
          <div class="card-flush">
            <div class="accordion-header ${isOpen ? 'open' : ''}" style="border-left:4px solid ${sq.color}; ${isKG ? 'background:linear-gradient(90deg, rgba(234,179,8,0.14) 0%, rgba(13,18,23,0.75) 75%);' : ''}" onclick="togglePersonnelSquad('${sq.id}')">
              <div class="row-gap" style="min-width:0;flex:1">
                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                <span class="pill-dot" style="background:${sq.color}"></span>
                <div style="min-width:0">
                  <div class="section-title" style="color:${isKG ? '#fde047' : '#fff'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sq.name)}</div>
                  <div class="text-xs text-muted">${isKG ? (allMembers.length ? 'Призначено: ' + esc(allMembers[0].name) : 'Не призначено') : 'Особового складу: ' + allMembers.length}</div>
                </div>
              </div>
              <button class="btn btn-sm btn-primary" style="flex-shrink:0" onclick="event.stopPropagation(); openSoldierModal(null, '${sq.id}')">+ Додати</button>
            </div>

            ${isOpen ? `
              <div>
                ${filteredMembers.length === 0
                  ? `<div class="empty-state" style="padding:18px">${isKG ? 'Командира групи ще не додано' : 'У відділенні поки немає бійців'}</div>`
                  : filteredMembers.map(s => {
                      const st = getStatusObj(s.status);
                      const isCardOpen = Boolean(ui.expandedSoldiers[s.id]);
                      const stats = getSoldierStats(s.id, ui.year, ui.month);
                      const curRozkhid = getRozkhidStatus(ui.rozkhidDate, s.id);
                      return `
                        <div style="border-bottom:1px solid rgba(39,50,64,0.65); border-left:4px solid ${sq.color}; background:${s.isCommander || isKG ? 'linear-gradient(90deg, rgba(245,158,11,0.09) 0%, rgba(21,28,36,1) 72%)' : 'var(--card)'}">
                          <button type="button" onclick="toggleSoldierCard('${s.id}')" style="width:100%; text-align:left; padding:11px 13px; display:flex; align-items:center; justify-content:space-between; gap:10px;">
                            <div class="soldier-info">
                              <div class="soldier-name-line">
                                <span class="soldier-name">${esc(s.name)}</span>
                                ${isKG ? `<span class="badge badge-kv">★ КГ</span>` : (s.isCommander ? `<span class="badge badge-kv">★ КВ</span>` : '')}
                                <span class="badge ${st.cls}">${st.label}</span>
                              </div>

    function saveSoldier(e, soldierId) {
      e.preventDefault();

          state.squads = state.squads.filter(s => s.id !== squadId);
          state.soldiers = state.soldiers.filter(s => s.squadId !== squadId);
          state.duties = state.duties.filter(d => !sIds.has(d.soldierId));
          state.tasks = state.tasks.filter(t => !(t.targetType === 'squad' && t.targetSquadId === squadId));
          Object.keys(state.rozkhid).forEach(dt => {
            sIds.forEach(sid => { if (state.rozkhid[dt]) delete state.rozkhid[dt][sid]; });
          });
          if (ui.scheduleSquadFilter === squadId) ui.scheduleSquadFilter = 'all';
          if (ui.statsSquadFilter === squadId) ui.statsSquadFilter = 'all';
          if (ui.tasksTargetFilter === squadId) ui.tasksTargetFilter = 'all';
          saveState();
          render();
          showToast('Відділення видалено');
        }
      );
    }

    // --- Види нарядів ---
    function openAddDutyTypeModal() {
      openModal(`
        <div class="modal-header">
          <div class="modal-title">Новий вид наряду</div>
          <button class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <form class="modal-body" onsubmit="saveDutyType(event)">
          <div class="field">
            <label class="field-label" for="dt-name">Назва виду наряду</label>
            <input id="dt-name" class="input" type="text" required placeholder="Наприклад: Черговий по роті" />
          </div>
          <button type="submit" class="btn btn-primary btn-full">Додати</button>
        </form>
      `);
      setTimeout(() => document.getElementById('dt-name')?.focus(), 50);
    }

    function saveDutyType(e) {
      e.preventDefault();
      const name = document.getElementById('dt-name').value.trim();
      if (!name) return;
      state.dutyTypes.push({ id: genId('dt'), name });
      saveState();
      closeModal();
      render();
      showToast('Вид наряду додано');
    }

    function deleteDutyType(id) {
      if (state.dutyTypes.length <= 1) return;
      state.dutyTypes = state.dutyTypes.filter(d => d.id !== id);
      saveState();
      render();
      showToast('Вид наряду видалено');
    }

    // --- Резервне копіювання ---
    function buildBackupPayload() {
      return {
        app: 'pomichnyk_vzvodu',
        version: APP_VERSION,
        exportedAt: toDateTimeHuman(new Date()),
        groupNumber: state.groupNumber,
        squads: state.squads,
        soldiers: state.soldiers,
        dutyTypes: state.dutyTypes,
        duties: state.duties,
        tasks: state.tasks,
        rozkhid: state.rozkhid
      };
    }

    function downloadFile(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportBackupJSON() {
      const now = new Date();
      state.lastBackupAt = toDateTimeHuman(now);
      saveState();
      downloadFile(JSON.stringify(buildBackupPayload(), null, 2), `pomichnyk_vzvodu_backup_${toISODate(now)}.json`, 'application/json');
      render();
      showToast('Резервну копію JSON збережено');
    }

    function copyBackupText() {
      const now = new Date();
      const text = JSON.stringify(buildBackupPayload());
      if (copyToClipboard(text, 'Код резервної копії скопійовано')) {
        state.lastBackupAt = toDateTimeHuman(now);
        saveState();
        render();
      }
    }

    function parseAndValidateBackup(rawText) {
      const parsed = JSON.parse(rawText);
      if (!parsed || !Array.isArray(parsed.squads) || !Array.isArray(parsed.soldiers) || !Array.isArray(parsed.duties)) {
        throw new Error('Некоректна структура резервної копії');
      }
      return {
        groupNumber: typeof parsed.groupNumber === 'string' && parsed.groupNumber.trim() ? parsed.groupNumber : '223',
        squads: ensureGroupCmdSquad(parsed.squads),
        soldiers: parsed.soldiers,
        dutyTypes: Array.isArray(parsed.dutyTypes) && parsed.dutyTypes.length
          ? parsed.dutyTypes
          : JSON.parse(JSON.stringify(DEFAULT_DUTY_TYPES)),
        duties: parsed.duties,
        tasks: Array.isArray(parsed.tasks) ? parsed.tasks : [],
        rozkhid: parsed.rozkhid && typeof parsed.rozkhid === 'object' ? parsed.rozkhid : {},
        lastBackupAt: state.lastBackupAt
      };
    }

    function confirmApplyBackup(validatedState) {
      showConfirm(
        'Відновити дані з резервної копії?',
        `Поточні дані будуть замінені. У копії: відділень — ${validatedState.squads.length}, бійців — ${validatedState.soldiers.length}, нарядів — ${validatedState.duties.length}, задач — ${validatedState.tasks.length}.`,
        'Відновити',
        () => {
          state = validatedState;
          saveState();
          render();
          showToast('Дані успішно відновлено');
        },
        false
      );
    }

    function handleImportJSONFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const validated = parseAndValidateBackup(e.target.result);
          confirmApplyBackup(validated);
        } catch (err) {
          showToast('Помилка: некоректний файл резервної копії', 'error');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    function openPasteBackupModal() {
      openModal(`
        <div class="modal-header">
          <div class="modal-title">Вставити резервну копію з тексту</div>
          <button class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <form class="modal-body" onsubmit="submitPasteBackup(event)">
          <div class="field">
            <label class="field-label" for="paste-backup-area">Вставте раніше скопійований код JSON:</label>
            <textarea id="paste-backup-area" class="textarea" style="min-height:130px;font-family:monospace;font-size:13px" required placeholder='{"app":"pomichnyk_vzvodu", ...}'></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Перевірити та відновити</button>
        </form>
      `);
      setTimeout(() => document.getElementById('paste-backup-area')?.focus(), 50);
    }

    function submitPasteBackup(e) {
      e.preventDefault();
      const raw = document.getElementById('paste-backup-area').value.trim();
      try {
        const validated = parseAndValidateBackup(raw);
        confirmApplyBackup(validated);
      } catch (err) {
        showToast('Помилка: некоректний код резервної копії', 'error');
      }
    }

    function exportCSV() {
      const y = ui.year;
      const m = ui.month;
      const header = ['Підрозділ / Відділення', 'ПІБ', 'Звання/Посада', 'Посада (КГ/КВ)', 'Статус', `За ${MONTHS_UK[m]} ${y}`, 'За весь час', 'Останній наряд'];
      const rows = [header];

      for (const sq of getOrderedSquads()) {
        const isKG = isGroupCmdSquad(sq);
        const members = sortSquadMembers(state.soldiers.filter(s => s.squadId === sq.id));
        for (const s of members) {
          const st = getSoldierStats(s.id, y, m);
          rows.push([
            sq.name,
            s.name,
            s.rank || '',
            isKG ? 'КГ' : (s.isCommander ? 'КВ' : ''),
            getStatusObj(s.status).label,
            st.monthCount,
            st.totalCount,
            formatDateShort(st.lastDate)
          ]);
        }
      }

      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
      downloadFile('\uFEFF' + csv, `oblik_naryadiv_${y}_${String(m + 1).padStart(2, '0')}.csv`, 'text/csv;charset=utf-8;');
      showToast('CSV-файл збережено');
    }

    function promptResetAllStep1() {
      showConfirm(
        'Очистити всі дані? (Крок 1 з 2)',
        'Будуть видалені всі бійці, графік нарядів, розхід та задачі. Рекомендуємо спочатку зберегти резервну копію.',
        'Продовжити',
        () => setTimeout(() => promptResetAllStep2(), 120),
        true
      );
    }

    function promptResetAllStep2() {
      showConfirm(
        'Точно видалити все? (Крок 2 з 2)',
        'Цю дію неможливо скасувати. Залишаться лише 3 базові порожні відділення, види нарядів та номер групи 223.',
        'Так, очистити все',
        () => {
          state = createEmptyInitialState();
          saveState();
          render();
          showToast('Усі дані очищено');
        },
        true
      );
    }

    // =========================================================================
    // ГОЛОВНИЙ РЕНДЕР
    // =========================================================================
    function render() {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const activeNav = document.getElementById(`nav-${ui.activeTab}`);
      if (activeNav) activeNav.classList.add('active');

      const activeTasksCnt = state.tasks.filter(t => t.status !== 'done').length;
      const badge = document.getElementById('nav-tasks-badge');
      if (activeTasksCnt > 0) {
        badge.textContent = activeTasksCnt > 99 ? '99+' : activeTasksCnt;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      const main = document.getElementById('main-content');
      if (ui.activeTab === 'duties') {
        main.innerHTML = renderDutiesTab();
      } else if (ui.activeTab === 'rozkhid') {
        main.innerHTML = renderRozkhidTab();
      } else if (ui.activeTab === 'tasks') {
        main.innerHTML = renderTasksTab();
      } else if (ui.activeTab === 'personnel') {
        main.innerHTML = renderPersonnelTab();
      } else if (ui.activeTab === 'settings') {
        main.innerHTML = renderSettingsTab();
      }
    }

    // Ініціалізація при старті
    loadState();
    render();
  </script>
</body>
</html>

        upcomingHtml +
        '<div class="grid-2">' +
          '<div class="kpi-box"><div class="kpi-val">' + data.totalList + '</div><div class="kpi-lbl">З/с (За списком)</div></div>' +
          '<div class="kpi-box"><div class="kpi-val" style="color:var(--accent)">' + data.presentCount + '</div><div class="kpi-lbl">Вн (В наявності)</div></div></div>' +
        '<div class="stack-sm">' + catRows + '</div>' +
        '<div class="card stack">' +
          '<div class="section-title" style="color:var(--accent)">Рапорт розходу</div>' +
          '<div class="grid-2">' +
            '<label class="toggle-pill"><input type="checkbox" ' + (ui.rozkhidShowNames ? 'checked' : '') + ' onchange="toggleRozkhidOption(\'names\',this.checked)" /><span>Прізвища в дужках</span></label>' +
            '<label class="toggle-pill"><input type="checkbox" ' + (ui.rozkhidHideZeros ? 'checked' : '') + ' onchange="toggleRozkhidOption(\'hideZeros\',this.checked)" /><span>Приховати нулі</span></label></div>' +
          '<pre id="rozkhid-preview" class="preview-pre">' + esc(generateRozkhidReport()) + '</pre>' +
          '<button class="btn btn-primary btn-full" onclick="copyText(generateRozkhidReport(),\'Розхід скопійовано\')">Скопіювати розхід</button>' +
        '</div>'
      );
    }

    // Модалка вибору ПІБ для Розходу (акордеон по відділеннях + пошук + сувора унікальність)
    function openRozkhidPicker(catKey) {
      if (!state.personnel.length) { showToast('Спочатку додайте бійців у «Склад»', 'error'); return; }
      ui.rozkhidModalCat = catKey;
      ui.rozkhidModalSearch = '';
      ui.rozkhidModalOpenSquads = {};
      const data = computeRozkhid(ui.rozkhidDate);
      getOrderedSquads().forEach(function(sq, idx) {
        const hasSel = state.personnel.some(function(p) { return p.squadId === sq.id && data.statusBySoldier[p.id] === catKey; });
        ui.rozkhidModalOpenSquads[sq.id] = hasSel || idx === 0;
      });
      renderRozkhidPickerModal();
    }

    function toggleRozkhidModalSquad(sqId) { ui.rozkhidModalOpenSquads[sqId] = !ui.rozkhidModalOpenSquads[sqId]; renderRozkhidPickerModal(); }

    function setRozkhidModalSearch(val) {
      ui.rozkhidModalSearch = val;
      renderRozkhidPickerModal();
      const inp = document.getElementById('rozkhid-search-inp');
      if (inp) { inp.focus(); inp.setSelectionRange(val.length, val.length); }
    }

    function toggleSoldierInRozkhidCat(soldierId, catKey) {
      const data = computeRozkhid(ui.rozkhidDate);
      const curCat = data.statusBySoldier[soldierId] || 'in_service';
      const day = ensureRozkhidDay(ui.rozkhidDate);
      const s = getSoldierById(soldierId);
      if (curCat === catKey) {
        day.manual[soldierId] = 'in_service';
      } else {
        day.manual[soldierId] = catKey;
        if (curCat !== 'in_service') {
          showToast((s ? s.fullName : 'Бійця') + ': перенесено з «' + getRozkhidCat(curCat).label + '» у «' + getRozkhidCat(catKey).label + '»');
        }
      }
      saveState();
      renderRozkhidPickerModal();
      render();
    }

    function renderRozkhidPickerModal() {
      const cat = getRozkhidCat(ui.rozkhidModalCat);
      const data = computeRozkhid(ui.rozkhidDate);
      const q = ui.rozkhidModalSearch.trim().toLowerCase();

      const accHtml = getOrderedSquads().map(function(sq) {
        const allM = sortSquadPersonnel(state.personnel.filter(function(p) { return p.squadId === sq.id; }));
        const members = q ? allM.filter(function(p) { return p.fullName.toLowerCase().indexOf(q) !== -1; }) : allM;
        if (!members.length) return '';
        const selCnt = members.filter(function(p) { return data.statusBySoldier[p.id] === cat.key; }).length;
        const isOpen = q ? true : Boolean(ui.rozkhidModalOpenSquads[sq.id]);

        return '<div class="card-flush">' +
          '<div class="acc-header ' + (isOpen ? 'open' : '') + '" style="border-left:4px solid ' + sq.color + '" onclick="toggleRozkhidModalSquad(\'' + sq.id + '\')">' +
            '<div class="row"><span class="chevron">▸</span><span class="fw-bold text-sm" style="color:' + sq.color + '">' + esc(sq.name) + '</span></div>' +
            '<span class="badge ' + (selCnt ? 'badge-warn' : 'badge-ok') + '">' + selCnt + ' / ' + members.length + '</span></div>' +
          (isOpen ? '<div class="acc-body">' + members.map(function(s) {
            const cur = data.statusBySoldier[s.id] || 'in_service';
            const checked = cur === cat.key;
            const other = cur !== 'in_service' && !checked;
            return '<label class="checkbox-row"><div class="min0"><div class="row wrap"><span class="soldier-name">' + esc(s.fullName) + '</span>' +
              (isCmdGroup(sq) ? '<span class="badge badge-kg">★ КГ</span>' : (s.isLeader ? '<span class="badge badge-kv">★ КВ</span>' : '')) +
              (other ? '<span class="badge badge-warn">Вже у: ' + esc(getRozkhidCat(cur).label) + '</span>' : '') + '</div>' +
              (s.rank ? '<div class="text-xs text-muted">' + esc(s.rank) + '</div>' : '') + '</div>' +
              '<input type="checkbox" ' + (checked ? 'checked' : '') + ' onchange="toggleSoldierInRozkhidCat(\'' + s.id + '\',\'' + cat.key + '\')" /></label>';
          }).join('') + '</div>' : '') + '</div>';
      }).join('');

      openModal(
        '<div class="modal-header"><div><div class="modal-title">' + esc(cat.label) + '</div><div class="text-xs text-muted">' + formatHumanDate(ui.rozkhidDate) + '</div></div>' +
        '<button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body">' +
          '<input id="rozkhid-search-inp" class="input" type="search" placeholder="Пошук за прізвищем..." value="' + esc(ui.rozkhidModalSearch) + '" oninput="setRozkhidModalSearch(this.value)" />' +
          '<div class="stack-sm">' + (accHtml || '<div class="empty-state">Нікого не знайдено</div>') + '</div>' +
          '<button class="btn btn-primary btn-full" onclick="closeModal()">Готово</button></div>'
      );
    }

    // Модалка планування відсутності на майбутню дату / період
    function openScheduleAbsenceModal(preSoldierId) {
      if (!state.personnel.length) { showToast('Спочатку додайте бійців у «Склад»', 'error'); return; }
      const defaultStart = addDaysISO(todayISO(), 1);
      const soldierOpts = getOrderedSquads().map(function(sq) {
        const members = sortSquadPersonnel(state.personnel.filter(function(p) { return p.squadId === sq.id; }));
        if (!members.length) return '';
        return '<optgroup label="' + esc(sq.name) + '">' + members.map(function(s) {
          return '<option value="' + s.id + '" ' + (preSoldierId === s.id ? 'selected' : '') + '>' + esc(s.fullName) + (s.rank ? ' (' + esc(s.rank) + ')' : '') + '</option>';
        }).join('') + '</optgroup>';
      }).join('');
      const catOpts = ROZKHID_CATS.filter(function(c) { return c.schedulable; }).map(function(c) {
        return '<option value="' + c.key + '">' + esc(c.label) + (c.hint && c.hint !== c.label ? ' — ' + esc(c.hint) : '') + '</option>';
      }).join('');

      openModal(
        '<div class="modal-header"><div class="modal-title">Запланувати на дату</div><button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<form class="modal-body" onsubmit="saveScheduledAbsence(event)">' +
          '<div class="field"><label class="field-label">Військовослужбовець</label><select id="sched-soldier" class="select" required>' + soldierOpts + '</select></div>' +
          '<div class="field"><label class="field-label">Причина (пункт розходу)</label><select id="sched-cat" class="select" required>' + catOpts + '</select></div>' +
          '<div class="grid-2">' +
            '<div class="field"><label class="field-label">Дата початку</label><input id="sched-start" type="date" class="input" required value="' + defaultStart + '" /></div>' +
            '<div class="field"><label class="field-label">Дата кінця (необов.)</label><input id="sched-end" type="date" class="input" /></div></div>' +
          '<div class="text-xs text-muted">Залиште дату кінця порожньою для одного дня, або вкажіть кінець для періоду (напр. відрядження).</div>' +
          '<div class="field"><label class="field-label">Примітка (необов\'язково)</label><input id="sched-note" type="text" class="input" placeholder="Наприклад: на 09:00" /></div>' +
          '<button type="submit" class="btn btn-primary btn-full">Зберегти в графік</button></form>'
      );
    }

    function saveScheduledAbsence(e) {
      e.preventDefault();
      const soldierId = document.getElementById('sched-soldier').value;
      const category = document.getElementById('sched-cat').value;
      const startDate = document.getElementById('sched-start').value;
      const endDate = document.getElementById('sched-end').value;
      const note = document.getElementById('sched-note').value.trim();
      if (!soldierId || !category || !startDate) return;
      if (endDate && endDate < startDate) { showToast('Дата кінця не може бути раніше початку', 'error'); return; }
      state.scheduledAbsences.push({ id: genId('sched'), soldierId: soldierId, category: category, startDate: startDate, endDate: endDate || '', note: note });
      saveState(); closeModal(); render();
      showToast('Заплановано на ' + formatDotDate(startDate));
    }

    function setPersonnelSearch(v) {
      ui.personnelSearch = v; render();

      if (el) { el.focus(); el.setSelectionRange(v.length, v.length); }

    function setPersonnelSquadFilter(id) { ui.personnelSquadFilter = id; render(); }
    function togglePersonnelSquad(id) { ui.openPersonnelSquads[id] = !ui.openPersonnelSquads[id]; render(); }
    function toggleSoldierCard(id) { ui.openSoldiers[id] = !ui.openSoldiers[id]; render(); }

    function setSoldierPresence(soldierId, statusKey) {
      const s = getSoldierById(soldierId); if (!s) return;
      s.presenceStatus = statusKey;
      // Скидаємо можливе ручне перекриття на сьогодні, щоб зміна одразу синхронізувалась у Розході
      const td = todayISO();
      if (state.rozkhidByDate[td] && state.rozkhidByDate[td].manual && state.rozkhidByDate[td].manual[soldierId]) {
        delete state.rozkhidByDate[td].manual[soldierId];
      }
      saveState(); render();
      showToast(s.fullName + ': ' + getPresenceMeta(statusKey).fullLabel);
    }

      const q = ui.personnelSearch.trim().toLowerCase();

                '<div class="soldier-row" style="cursor:pointer" onclick="toggleSoldierCard(\'' + s.id + '\')">' +

                    '<span class="chevron" style="transform:' + (sOpen ? 'rotate(90deg)' : 'none') + '">▸</span>' +

                    '<span class="soldier-name">' + esc(s.fullName) + '</span>' +
                  '</div>' + (s.rank ? '<div class="text-xs text-muted" style="padding-left:18px">' + esc(s.rank) + '</div>' : '') + '</div>' +
                  '<div class="row" style="gap:5px;flex-shrink:0">' +
                    (up.length ? '<span class="badge badge-info">📅 ' + up.length + '</span>' : '') +
                    '<span class="badge ' + (pm.isOk ? 'badge-ok' : 'badge-warn') + '">' + esc(pm.shortLabel) + '</span>' +
                  '</div></div>' +
                (sOpen ? '<div style="padding:10px 12px 12px;background:var(--bg-elev);border-top:1px solid var(--border)" class="stack">' +
                  '<div><div class="field-label" style="margin-bottom:6px">Статус присутності (Розхід):</div>' +
                  '<div class="presence-grid">' + PRESENCE_STATUSES.map(function(ps) {
                    const active = (s.presenceStatus || 'in_service') === ps.key;
                    const cls = active ? (ps.isOk ? 'active-ok' : 'active-warn') : '';
                    return '<button type="button" class="presence-btn ' + cls + '" onclick="setSoldierPresence(\'' + s.id + '\',\'' + ps.key + '\')">' + esc(ps.fullLabel) + '</button>';
                  }).join('') + '</div></div>' +
                  '<div class="stack-sm">' +
                    '<div class="row-between"><span class="field-label">Заплановано на майбутні дати:</span>' +
                    '<button type="button" class="btn btn-xs btn-info" onclick="openScheduleAbsenceModal(\'' + s.id + '\')">+ Запланувати на дату</button></div>' +
                    (up.length ? up.map(function(a) {
                      const dLbl = (a.endDate && a.endDate !== a.startDate) ? (formatDayMonth(a.startDate) + '–' + formatDayMonth(a.endDate)) : formatDayMonth(a.startDate);
                      return '<div class="sched-item"><div class="text-xs"><strong style="color:#fff">' + esc(dLbl) + '</strong> — ' + esc(getRozkhidCat(a.category).label) + (a.note ? ' (' + esc(a.note) + ')' : '') + '</div>' +

                  '<div class="grid-3">' +
                    '<div class="kpi-box" style="padding:7px"><div class="fw-800" style="color:#fff">' + st.monthCount + '</div><div class="text-xs text-muted">За місяць</div></div>' +

                '</div>' : '') + '</div>';
            }).join('');

        return '<div class="card-flush">' +
          '<div class="acc-header ' + (isOpen ? 'open' : '') + '" style="border-left:4px solid ' + sq.color + '" onclick="togglePersonnelSquad(\'' + sq.id + '\')">' +
            '<div class="row min0"><span class="chevron">▸</span><span class="fw-800 text-sm" style="color:' + sq.color + '">' + esc(sq.name) + '</span><span class="text-xs text-muted">(' + members.length + ')</span></div>' +
            '<button type="button" class="btn btn-xs btn-primary" onclick="event.stopPropagation(); openSoldierModal(null,\'' + sq.id + '\')">+ Додати</button></div>' +

    function openSoldierModal(soldierId, preSquadId) {
      const ex = soldierId ? getSoldierById(soldierId) : null;
      const targetSq = ex ? ex.squadId : (preSquadId || (getOrderedSquads()[0] ? getOrderedSquads()[0].id : 'sq1'));
      openModal(
        '<div class="modal-header"><div class="modal-title">' + (ex ? 'Редагувати бійця' : 'Додати військовослужбовця') + '</div><button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +

            '<input id="s-name" class="input" type="text" required placeholder="Іваненко Олександр" value="' + esc(ex ? ex.fullName : '') + '" oninput="this.value=capitalizePIB(this.value)" /></div>' +

            '<input id="s-rank" class="input" type="text" placeholder="солдат" value="' + esc(ex ? ex.rank : '') + '" />' +
            '<div class="chips-wrap">' + QUICK_RANKS.map(function(r) {

          '<label class="toggle-pill"><input id="s-leader" type="checkbox" ' + (ex && ex.isLeader ? 'checked' : '') + ' /><span>Командир відділення / групи (★)</span></label>' +

    function saveSoldier(e, soldierId) {
      e.preventDefault();
      const fullName = capitalizePIB(document.getElementById('s-name').value.trim());
      const rank = document.getElementById('s-rank').value.trim();
      const squadId = document.getElementById('s-squad').value;
      const isLeader = document.getElementById('s-leader').checked;
      const presenceStatus = document.getElementById('s-presence').value;
      if (!fullName) return;

      if (soldierId) {
        const s = getSoldierById(soldierId);
        if (s) { s.fullName = fullName; s.rank = rank; s.squadId = squadId; s.isLeader = isLeader; s.presenceStatus = presenceStatus; }
      } else {
        state.personnel.push({ id: genId('p'), fullName: fullName, rank: rank, squadId: squadId, isLeader: isLeader, presenceStatus: presenceStatus });
      }
      saveState(); closeModal(); render();
      showToast(soldierId ? 'Дані оновлено' : 'Бійця додано');
    }

    function promptDeleteSoldier(sid) {
      const s = getSoldierById(sid); if (!s) return;
      showConfirm('Видалити ' + s.fullName + '?', 'Бійця, його наряди та заплановані відсутності буде видалено.', 'Видалити', function() {
        state.personnel = state.personnel.filter(function(p) { return p.id !== sid; });
        state.duties = state.duties.filter(function(d) { return d.soldierId !== sid; });
        state.scheduledAbsences = state.scheduledAbsences.filter(function(a) { return a.soldierId !== sid; });
        saveState(); render(); showToast('Бійця видалено');
      }, true);
    }

      tempColor = c;
      document.querySelectorAll('.color-swatch').forEach(function(el) {
        el.classList.toggle('selected', el.getAttribute('data-c') === c);
      });

      tempColor = selected || PALETTE[0];
      return '<div class="color-row">' + PALETTE.map(function(c) {

      }).join('') + '</div>';

      const ex = dtId ? state.dutyTypes.find(function(x) { return x.id === dtId; }) : null;
      openModal(
        '<div class="modal-header"><div class="modal-title">' + (ex ? 'Редагувати вид наряду' : 'Новий вид наряду') + '</div><button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +

      );

    function saveDutyType(e, dtId) {
      e.preventDefault();
      const shortName = document.getElementById('dt-short').value.trim();
      const name = document.getElementById('dt-full').value.trim() || shortName;
      const maxCount = Math.min(10, Math.max(1, Number(document.getElementById('dt-max').value) || 1));
      if (!shortName) return;
      if (dtId) {
        const dt = state.dutyTypes.find(function(x) { return x.id === dtId; });
        if (dt) { dt.shortName = shortName; dt.name = name; dt.maxCount = maxCount; dt.color = tempColor; }
      } else {
        state.dutyTypes.push({ id: genId('dt'), shortName: shortName, name: name, maxCount: maxCount, color: tempColor });
      }
      saveState(); closeModal(); render(); showToast('Вид наряду збережено');
    }

    function deleteDutyType(dtId) {
      if (state.dutyTypes.length <= 1) return;
      state.dutyTypes = state.dutyTypes.filter(function(x) { return x.id !== dtId; });
      saveState(); render(); showToast('Вид наряду видалено');
    }

      const ex = sqId ? state.squads.find(function(x) { return x.id === sqId; }) : null;
      openModal(

    function saveSquad(e, sqId) {
      e.preventDefault();
      const name = document.getElementById('sq-name').value.trim(); if (!name) return;
      if (sqId) {
        const sq = state.squads.find(function(x) { return x.id === sqId; });
        if (sq) { sq.name = name; sq.color = tempColor; }
      } else {
        const nid = genId('sq');
        state.squads.push({ id: nid, name: name, color: tempColor, isCmdGroup: false });

      }
      saveState(); closeModal(); render(); showToast('Відділення збережено');

    // Експорт / Імпорт JSON та CSV
    function downloadFile(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    }

    function exportBackupJSON() {
      state.lastBackupAt = formatDateTimeNow(); saveState();
      downloadFile(JSON.stringify(state, null, 2), 'pomichnyk_vzvodu_backup_' + todayISO() + '.json', 'application/json');
      render(); showToast('Бекап збережено у файл');
    }

    function handleImportJSON(e) {
      const file = e.target.files && e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = function(ev) {
        try {
          state = normalizeState(JSON.parse(ev.target.result));
          saveState(); render(); showToast('Дані відновлено з файлу');
        } catch (err) { showToast('Некоректний файл резервної копії', 'error'); }
        finally { e.target.value = ''; }
      };
      r.readAsText(file);
    }

    function copyBackupAsText() {
      state.lastBackupAt = formatDateTimeNow(); saveState();
      copyText(JSON.stringify(state), 'Бекап скопійовано як текст');
      render();
    }

    function openRestoreTextModal() {
      openModal(
        '<div class="modal-header"><div class="modal-title">Відновити з тексту</div><button class="btn-icon btn-icon-sm" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body"><textarea id="restore-txt" class="textarea" style="min-height:130px" placeholder="Вставте сюди скопійований текст резервної копії..."></textarea>' +
        '<button class="btn btn-primary btn-full" onclick="restoreFromText()">Відновити дані</button></div>'
      );
    }

    function restoreFromText() {
      const raw = (document.getElementById('restore-txt').value || '').trim();
      try {
        state = normalizeState(JSON.parse(raw));
        saveState(); closeModal(); render(); showToast('Дані успішно відновлено');
      } catch (err) { showToast('Помилка: некоректний формат тексту', 'error'); }
    }

    function exportMonthlyCSV() {
      const rows = [['Відділення', 'ПІБ', 'Звання', 'Статус', 'За ' + MONTHS_UK[ui.month] + ' ' + ui.year, 'Всього', 'Останній наряд']];
      getOrderedSquads().forEach(function(sq) {
        sortSquadPersonnel(state.personnel.filter(function(p) { return p.squadId === sq.id; })).forEach(function(s) {
          const st = getSoldierDutyStats(s.id, ui.year, ui.month);
          rows.push([sq.name, s.fullName, s.rank || '', getPresenceMeta(s.presenceStatus).fullLabel, st.monthCount, st.totalCount, st.lastDate ? formatDotDate(st.lastDate) : '']);
        });
      });
      const csv = '\uFEFF' + rows.map(function(r) {
        return r.map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(';');
      }).join('\r\n');
      downloadFile(csv, 'oblik_' + ui.year + '_' + String(ui.month + 1).padStart(2, '0') + '.csv', 'text/csv;charset=utf-8;');
      showToast('CSV-файл експортовано');
    }

    function promptResetStep1() {
      showConfirm('Очистити всі дані? (Крок 1/2)', 'Буде видалено весь особовий склад, графік нарядів, задачі та розхід.', 'Продовжити', function() {
        showConfirm('Точно видалити все? (Крок 2/2)', 'Цю дію неможливо скасувати, якщо у вас немає резервної копії.', 'Так, очистити все', function() {
          state = createFreshState();
          saveState(); render(); showToast('Усі дані очищено');
        }, true);
      }, true);
    }

    // =========================================================================
    // 10. ГОЛОВНИЙ РЕНДЕР ТА ЗАПУСК
    // =========================================================================
    function render() {
      document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
      const act = document.getElementById('nav-' + ui.activeTab);
      if (act) act.classList.add('active');

      const main = document.getElementById('main-content');
      if (!main) return;
      if (ui.activeTab === 'duties') main.innerHTML = renderDutiesTab();
      else if (ui.activeTab === 'tasks') main.innerHTML = renderTasksTab();
      else if (ui.activeTab === 'rozkhid') main.innerHTML = renderRozkhidTab();
      else if (ui.activeTab === 'personnel') main.innerHTML = renderPersonnelTab();
      else if (ui.activeTab === 'settings') main.innerHTML = renderSettingsTab();
    }

    loadState();
    render();
  </script>
</body>
</html>
